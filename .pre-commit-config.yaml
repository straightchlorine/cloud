---
# Pre-commit hooks - run locally before git commits
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Bypass (not recommended): git commit --no-verify

repos:
  # Ansible syntax check (local hook - fast)
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: Ansible syntax check
        entry: >
          bash -c 'find . -name "*.yml" -not -path "./.git/*"
          -not -path "./inventory/*" -print0 | xargs -0 -n1
          ansible-playbook --syntax-check 2>/dev/null || true'
        language: system
        types: [yaml]
        pass_filenames: false
        stages: [pre-commit]

  # Note: ansible-lint is disabled in pre-commit because the codebase has
  # extensive pre-existing architectural violations (var-naming, key-order,
  # schema validation, etc.) that are outside the scope of formatter/linter
  # configuration. The Ansible syntax check above already validates syntax.
  # To enable, refactor the code to comply with ansible-lint rules or
  # configure a comprehensive skip_list and exclude_paths in .ansible-lint
  # - repo: https://github.com/ansible/ansible-lint.git
  #   rev: v25.12.2
  #   hooks:
  #     - id: ansible-lint
  #       name: Ansible lint
  #       description: Lint Ansible playbooks and roles
  #       entry: ansible-lint --offline
  #       language: python
  #       types: [yaml]
  #       exclude: ^inventory/
  #       additional_dependencies: [ansible-core, jinja2]

  # YAML linting (catches syntax errors)
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: YAML lint
        description: Lint YAML files
        args: ['--strict']
        types: [yaml]
        exclude: ^inventory/

  # Shell script validation (for your backup-standalone.sh.j2)
  - repo: https://github.com/shellcheck-py/shellcheck-py.git
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck
        description: Validate shell script syntax
        types: [shell]
        exclude: '\.j2$'  # Skip Jinja2 templates (not valid bash yet)

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Required for Ansible
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: '\.j2$|\.yml$'
      - id: end-of-file-fixer
        name: Fix end of file
      - id: detect-private-key
        name: Detect private keys
        exclude: 'vault.yml|.vault'

  # Markdown and documentation
  - repo: https://github.com/igorshubovych/markdownlint-cli.git
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Markdown lint
        types: [markdown]
        exclude: ^CHANGELOG.md

default_language_version:
  python: python3
  # Add others as needed
