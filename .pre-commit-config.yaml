---
# pre-commit install; pre-commit run --all-files.
# ansible-lint and Molecule run on push (.pre-push-config.yaml) and in CI.
repos:
  - repo: local
    hooks:
      - id: syntax
        name: Playbook syntax
        entry: just syntax
        language: system
        pass_filenames: false
        files: ^(playbooks|roles|inventory)/
      - id: ascii
        name: ASCII only in CI and test tooling
        entry: '[^\x00-\x7F]'
        language: pygrep
        files: |
          (?x)^(
            \.woodpecker/ | \.config/ | roles/[^/]+/molecule/ | roles/[^/]+/\.env\.yml$ |
            scripts/[^/]+\.sh$ | justfile$ | \.pre-(commit|push)-config\.yaml$
          )

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: YAML lint
        args: ['--strict']
        types: [yaml]
        exclude: ^inventory/

  - repo: https://github.com/shellcheck-py/shellcheck-py.git
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck
        types: [shell]
        exclude: '\.j2$'  # Jinja2 templates are not valid shell until rendered.

  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Lets the parser accept Ansible's custom YAML tags.
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: '\.j2$'
      - id: end-of-file-fixer
        name: Fix end of file
      - id: detect-private-key
        name: Detect private keys
        # The restic molecule scenarios generate throwaway keys and assert on the PEM header text.
        exclude: >-
          (?x) vault.yml | .vault |
          ^roles/restic/molecule/(default/verify/01_deployed_files|fail-fast-validation/cases)\.yml$

  - repo: https://github.com/igorshubovych/markdownlint-cli.git
    rev: v0.50.0
    hooks:
      - id: markdownlint
        name: Markdown lint
        types: [markdown]
        exclude: ^CHANGELOG.md

default_language_version:
  python: python3
