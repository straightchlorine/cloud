---
# Pre-commit hooks - run locally before git commits
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Bypass (not recommended): git commit --no-verify

repos:
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: Ansible playbook syntax check
        entry: >
          bash -c 'find playbooks -name "*.yml"
          -exec ansible-playbook --syntax-check {} +'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ansible-lint is not a commit hook because it needs the installed collections and is too slow.
  # It runs in CI (.woodpecker/lint.yaml) and in the pre-push stage (.pre-push-config.yaml).

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: YAML lint
        description: Lint YAML files
        args: ['--strict']
        types: [yaml]
        exclude: ^inventory/

  - repo: https://github.com/shellcheck-py/shellcheck-py.git
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck
        description: Validate shell script syntax
        types: [shell]
        exclude: '\.j2$'  # Jinja2 templates are not valid shell until rendered.

  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Lets the parser accept Ansible's custom YAML tags.
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: '\.j2$'
      - id: end-of-file-fixer
        name: Fix end of file
      - id: detect-private-key
        name: Detect private keys
        # The restic molecule scenarios generate throwaway keys and assert on the PEM header text.
        exclude: 'vault.yml|.vault|^roles/restic/molecule/(default/verify|fail-fast-validation/converge)\.yml$'

  - repo: https://github.com/igorshubovych/markdownlint-cli.git
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Markdown lint
        types: [markdown]
        exclude: ^CHANGELOG.md

default_language_version:
  python: python3
