  - service_name: "station-arch"
    target_host: "192.168.100.10"
    ssh_user: "backup"
    backup_enabled: true
    backup_schedule: "*-*-* 10:00:00"
    backup_randomized_delay: "1800s"
    backup_timeout: "7200"
    backup_method: "hybrid_enhanced"
    network_optimization: true
    restic_repository: "{{ vault_backup_repository_base }}/station-arch"
    restic_password: "{{ vault_restic_station_arch_password }}"
    backup_paths:
      - "/etc"
      - "/home"
      - "/var/lib"
      - "/data/ssd/code"
      - "/data/vault/books"
      - "/data/vault/code"
      - "/data/vault/media/img"
      - "/data/vault/media/misc"
      - "/data/vault/organise"
    exclude_patterns:
      - "**/.cache/**"
      - "**/cache/**"
      - "**/tmp/**"
      - "/var/tmp/**"
      - "/var/cache/**"
      - "*.log.1*"
      - "*.tmp"
      - "**/logs/**"
      - "/data/vault/code/.vault/leaks/"
      - "/home/*/.local/share/Steam/steamapps/**"
      - "/home/*/.local/share/anaconda/**"
      - "/home/*/.local/share/matlab/**"
      - "/home/*/building/**"
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/target/**"
      - "**/build/**"
      - "**/__pycache__/**"
      - "*.iso"
      - "*.img"
      - "*.vmdk"
    retention_policy:
      daily: "30"
      weekly: "12"
      monthly: "24"
      yearly: "3"
    compression_level: "adaptive"
    bandwidth_limit_mbps: 50
    concurrent_transfers: 3
    restore_pushback_enabled: true

# Enterprise backup required vault variables
backup_required_vault_vars:
  - vault_backup_repository_base
  - vault_restic_station_arch_password
  - vault_domain_name
  - vault_letsencrypt_email
