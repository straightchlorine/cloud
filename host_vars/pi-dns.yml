# DNS server specific configuration - Pi-hole on Debian Bookworm
dns_service: pihole
dns_port: 53
dns_interface: "{{ ansible_default_ipv4.address }}"

# Device Configuration
device_type: rpi3b

# Pi-hole configuration
pihole_admin_password: "{{ vault_pihole_admin_password }}"
pihole_webpassword: "{{ vault_pihole_webpassword }}"
pihole_dns_servers:
  - 192.168.20.1#53
pihole_interface: "{{ primary_interface }}"
pihole_ipv4_address: "{{ host_ip_cidr }}"
pihole_ipv6_address: ""
pihole_packages:
  - curl
  - ca-certificates
  - dnsutils


# Automatic updates configuration
auto_updates_enabled: true
auto_updates_schedule: "0 2 * * 1" # Monday 2 AM
auto_updates_reboot_if_required: true

# NTP server configuration
ntp_server_enabled: true
ntp_allowed_networks:
  - "10.0.0.0/8"
  - "192.168.0.0/16"
  - "172.16.0.0/12"

# Firewall configuration for DNS services
firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 53, comment: "Pi-hole DNS", proto: "udp"}
  - {port: 53, comment: "Pi-hole DNS", proto: "tcp"}
  - {port: 80, comment: "Pi-hole Web Interface"}
  - {port: 123, comment: "NTP server", proto: "udp"}
  - {port: 9100, comment: "Node Exporter"}
  - {port: 9617, comment: "Pi-hole Exporter"}
  - {port: 19999, comment: "Netdata",}

# Additional services for Pi 3B
additional_services:
  - name: netdata
    description: "System monitoring"
    port: 19999
  - name: prometheus-node-exporter
    description: "Metrics collection"
    port: 9100
  - name: chrony
    description: "NTP server"
    port: 123
  - name: pihole-exporter
    description: "Pi-hole metrics exporter"
    port: 9617

# Prometheus exporters configuration
pihole_exporter_enabled: true
prometheus_role: "dns"

# Enterprise backup configuration
restic_enabled: true
restic_repository: "{{ vault_backup_repository_base }}/dns"
restic_password: "{{ vault_restic_dns_password }}"
backup_directories:
  - "/etc/pihole"
  - "/etc/chrony"
  - "/var/log/pihole"
  - "/opt/pihole"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "/var/log/pihole/pihole.log.*"


