# Raspberry Pi 4 specific configuration

device_type: rpi4b
device_specs:
  cpu: "ARM Cortex-A72 4-core 1.5GHz"
  memory: "2GB"
  architecture: "aarch64"

ssd_device: "/dev/sda1"
ssd_filesystem: "ext4"
ssd_mount_options: "defaults,noatime,errors=remount-ro"
ssd_format: false
automation_data_path: "/mnt/automation-data"

# Subdomains for automation services
subdomain_traefik: "traefik"
subdomain_influxdb: "influxdb"
subdomain_explorer: "influxdb-ui"
subdomain_dozzle: "dozzle"
subdomain_portainer: "portainer"
subdomain_vaultwarden: "vault"

# Automation stack configuration
automation_stack_home: "/home/automation/automation-stack"

# Firewall configuration
firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 80, comment: "HTTP"}
  - {port: 443, comment: "HTTPS",}

# Service enablement
services_enabled:
  traefik: true

# Stack management
restic_enabled: true
start_stack: true

# Traefik ports
traefik_web_port: 80
traefik_websecure_port: 443
traefik_dashboard_port: 8080

automation_user: automation
automation_uid: 1000
automation_gid: 1000

# Prometheus exporters configuration
docker_exporter_enabled: true
prometheus_role: "automation"

# Enterprise backup configuration
restic_repository: "{{ vault_backup_repository_base }}/automation"
restic_password: "{{ vault_restic_automation_password }}"
backup_directories:
  - "{{ automation_stack_home }}"
  - "{{ automation_data_path }}"
  - "/var/lib/docker/volumes"
  - "/etc/docker"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "**/logs/*"
  - "docker/overlay2/*"
