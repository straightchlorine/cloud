---
# Centralized Backup Deployment Playbook
# Deploys rclone-based centralized backup system to backup-wyse
# Backup-wyse will backup multiple remote hosts via SSH/rclone

- name: Deploy centralized backup system
  hosts: backup-wyse
  become: true
  gather_facts: true

  vars:
    backup_base_path: "/opt/enterprise-backup"
    backup_user: "backup"
    backup_group: "backup"

  pre_tasks:
    - name: Validate centralized backup configuration
      ansible.builtin.fail:
        msg: "centralized_backup_targets must be defined"
      when: centralized_backup_targets is not defined

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          🚀 Deploying Centralized Backup System to {{ inventory_hostname }}

          Target hosts to backup:
          {% for target in centralized_backup_targets %}
          - {{ target.service_name }}: {{ target.target_host }} ({{ target.backup_paths | length }} paths)
          {% endfor %}

  tasks:
    - name: Create backup user
      ansible.builtin.user:
        name: "{{ backup_user }}"
        system: true
        shell: /bin/bash
        home: "{{ backup_base_path }}"
        create_home: true
        groups: ["sudo"]
        append: true

    - name: Create backup directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: '0750'
      loop:
        - "{{ backup_base_path }}/scripts"
        - "{{ backup_base_path }}/logs"
        - "{{ backup_base_path }}/keys"
        - "{{ backup_base_path }}/cache"
        - "{{ backup_base_path }}/staging"
        - "{{ backup_base_path }}/.config"

    - name: Deploy centralized rclone backup system
      include_tasks: roles/common/tasks/centralized_rclone_backup.yml

  post_tasks:
    - name: Display deployment results
      ansible.builtin.debug:
        msg: |
          ✅ Centralized Backup System Deployed Successfully!

          📋 Next Steps:
          1. Deploy SSH public keys to target hosts:
          {% for target in centralized_backup_targets %}
             ssh-copy-id -i {{ backup_base_path }}/keys/{{ target.service_name }}-ssh-key.pub root@{{ target.target_host }}
          {% endfor %}

          2. Test connectivity:
          {% for target in centralized_backup_targets %}
             sudo -u backup rclone --config {{ backup_base_path }}/.config/rclone/rclone.conf ls {{ target.service_name }}:/
          {% endfor %}

          3. Run test backups:
          {% for target in centralized_backup_targets %}
             systemctl start backup-{{ target.service_name }}.service
          {% endfor %}

          4. Check backup logs:
             tail -f {{ backup_base_path }}/logs/backup-*.log

          📊 Services Created:
          {% for target in centralized_backup_targets %}
          - backup-{{ target.service_name }}.service ({{ target.backup_schedule }})
          - backup-{{ target.service_name }}.timer
          {% endfor %}

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart backup service
      ansible.builtin.systemd:
        name: "backup-{{ item.service_name }}.service"
        state: restarted
        daemon_reload: true
      loop: "{{ centralized_backup_targets }}"

    - name: restart backup timer
      ansible.builtin.systemd:
        name: "backup-{{ item.service_name }}.timer"
        state: restarted
        enabled: true
        daemon_reload: true
      loop: "{{ centralized_backup_targets }}"