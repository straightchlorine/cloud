---
- name: Run Alloy validation
  ansible.builtin.include_tasks: validate.yml
  tags: [alloy, validation]

- name: Add the Grafana package repository
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana OSS packages
    baseurl: "{{ alloy_repo_baseurl }}"
    gpgkey: "{{ alloy_repo_gpgkey }}"
    gpgcheck: true
    enabled: true
  become: true

- name: Install Alloy
  ansible.builtin.dnf:
    name: "alloy-{{ alloy_version }}"
    state: present
    allow_downgrade: true
  become: true
  notify: Restart alloy

- name: Allow Alloy to read the systemd journal
  # The packaged unit runs as an unprivileged user; without this group the
  # journal source starts cleanly and ships nothing.
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    groups: systemd-journal
    append: true
  become: true
  notify: Restart alloy

- name: Install the Alloy environment file
  ansible.builtin.template:
    src: alloy.sysconfig.j2
    dest: "{{ alloy_env_file }}"
    owner: root
    group: "{{ alloy_group }}"
    mode: '0644'
  become: true
  notify: Restart alloy

- name: Install the Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_file }}"
    owner: root
    group: "{{ alloy_group }}"
    mode: '0644'
    # This version's CLI has no `validate` subcommand; `fmt` still has to parse
    # the file to reformat it, so it fails the same way on real syntax errors.
    # Deliberately no -t/-w: those would also fail on formatting-only
    # differences, which isn't what this check is for.
    validate: "alloy fmt %s"
  become: true
  notify: Restart alloy

- name: Enable and start Alloy
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
  become: true

- name: Flush handlers so the health check sees the new configuration
  ansible.builtin.meta: flush_handlers

- name: Confirm Alloy is healthy
  # Proves the agent parsed its config and is running, not merely that systemd
  # started it - a bad component leaves the process up and the pipeline dead.
  ansible.builtin.uri:
    url: "http://{{ alloy_listen_address }}/-/ready"
    status_code: 200
  retries: 6
  delay: 5
  register: alloy_ready
  until: alloy_ready is succeeded
  tags: [post_validation]

- name: Confirm the fleet sinks are reachable over the tailnet
  # Alloy stays ready while every push fails, so this is what proves the
  # Headscale ACL, the NodePort and the fleet NetworkPolicy end to end.
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
  loop: >-
    {{ [alloy_loki_url | regex_replace('/loki/api/v1/push$', '/ready')]
       + ([alloy_prometheus_url | regex_replace('/api/v1/write$', '/-/ready')]
          if alloy_metrics_enabled else []) }}
  retries: 6
  delay: 5
  register: alloy_sink_ready
  until: alloy_sink_ready is succeeded
  tags: [post_validation]

- name: Read the textfile collector status from the exporter
  # The collector's own error gauge is the only place an unreadable directory
  # shows up; Alloy stays ready and the pipeline just goes quiet. An empty
  # directory scrapes clean, so this passes before the first .prom file exists.
  ansible.builtin.uri:
    url: "http://{{ alloy_listen_address }}/api/v0/component/prometheus.exporter.unix.host/metrics"
    return_content: true
    status_code: 200
  when: alloy_metrics_enabled and alloy_textfile_directory | length > 0
  retries: 6
  delay: 5
  register: alloy_textfile_metrics
  until: alloy_textfile_metrics is succeeded
  tags: [post_validation]

- name: Confirm the textfile collector reads its directory without error
  ansible.builtin.assert:
    that:
      - "'node_textfile_scrape_error 0' in alloy_textfile_metrics.content"
    fail_msg: >-
      The textfile collector reports an error reading {{ alloy_textfile_directory }}
      (node_textfile_scrape_error is not 0): check the directory exists and the
      {{ alloy_user }} user can read it and the .prom files in it.
  when: alloy_metrics_enabled and alloy_textfile_directory | length > 0
  tags: [post_validation]
