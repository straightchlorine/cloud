---
- name: Read the pihole_status metric from the exporter
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics"
    return_content: true
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
  register: prom_exp_pihole_exporter_health
  changed_when: false
  retries: 6
  delay: 10
  until: >-
    prom_exp_pihole_exporter_health.content | default('')
    | regex_findall('(?m)^pihole_status(\{[^}]*\})? 1$') | length == 1
