---
# Firewall configuration for Prometheus exporters

- name: Configure firewall rules for exporters
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    src: "{{ prometheus_exporters_firewall_source }}"
    comment: "{{ item.comment }}"
  become: true
  when: item.enabled
  loop:
    - port: "{{ prometheus_exporters_node_exporter_port }}"
      enabled: "{{ prometheus_exporters_node_exporter_enabled }}"
      comment: "Prometheus Node Exporter"
    - port: "{{ prometheus_exporters_pihole_exporter_port }}"
      enabled: "{{ prometheus_exporters_pihole_exporter_enabled }}"
      comment: "Pi-hole Prometheus Exporter"
    - port: "{{ prometheus_exporters_docker_exporter_port }}"
      enabled: "{{ prometheus_exporters_docker_exporter_enabled }}"
      comment: "Docker Prometheus Metrics"
  loop_control:
    label: "{{ item.comment }}"

- name: Display firewall rules summary
  ansible.builtin.debug:
    msg: |
      [OK] Prometheus Exporters Firewall Configuration:
      {% if node_exporter_enabled %}
      - Node Exporter: Port {{ prometheus_exporters_node_exporter_port }} ({{ prometheus_exporters_firewall_source }})
      {% endif %}
      {% if pihole_exporter_enabled %}
      - Pi-hole Exporter: Port {{ prometheus_exporters_pihole_exporter_port }} ({{ prometheus_exporters_firewall_source }})
      {% endif %}
      {% if docker_exporter_enabled %}
      - Docker Metrics: Port {{ prometheus_exporters_docker_exporter_port }} ({{ prometheus_exporters_firewall_source }})
      {% endif %}
