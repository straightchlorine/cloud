# Firewall configuration for Prometheus exporters

- name: Configure firewall rules for exporters
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    src: "{{ prometheus_exporters_firewall_source }}"
    comment: "{{ item.comment }}"
  become: yes
  when: item.enabled
  loop:
    - port: "{{ node_exporter_port }}"
      enabled: "{{ node_exporter_enabled }}"
      comment: "Prometheus Node Exporter"
    - port: "{{ pihole_exporter_port }}"
      enabled: "{{ pihole_exporter_enabled }}"
      comment: "Pi-hole Prometheus Exporter"
    - port: "{{ docker_exporter_port }}"
      enabled: "{{ docker_exporter_enabled }}"
      comment: "Docker Prometheus Metrics"
  loop_control:
    label: "{{ item.comment }}"

- name: Display firewall rules summary
  ansible.builtin.debug:
    msg: |
      ✅ Prometheus Exporters Firewall Configuration:
      {% if node_exporter_enabled %}
      - Node Exporter: Port {{ node_exporter_port }} ({{ prometheus_exporters_firewall_source }})
      {% endif %}
      {% if pihole_exporter_enabled %}
      - Pi-hole Exporter: Port {{ pihole_exporter_port }} ({{ prometheus_exporters_firewall_source }})
      {% endif %}
      {% if docker_exporter_enabled %}
      - Docker Metrics: Port {{ docker_exporter_port }} ({{ prometheus_exporters_firewall_source }})
      {% endif %}