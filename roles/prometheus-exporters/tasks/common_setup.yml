---
# Common setup for Prometheus exporters

- name: Create prometheus user and group
  ansible.builtin.group:
    name: "{{ prometheus_exporters_group }}"
    system: true
  become: true

- name: Create prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_exporters_user }}"
    ansible.builtin.group: "{{ prometheus_exporters_group }}"
    system: true
    ansible.builtin.shell: /bin/false
    home: "{{ prometheus_exporters_base_dir }}"
    create_home: false
  become: true

- name: Create Prometheus exporters directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_exporters_user }}"
    ansible.builtin.group: "{{ prometheus_exporters_group }}"
    mode: '0755'
  become: true
  loop:
    - "{{ prometheus_exporters_base_dir }}"
    - "{{ prometheus_exporters_base_dir }}/bin"
    - "{{ prometheus_exporters_base_dir }}/scripts"
    - "{{ prometheus_exporters_base_dir }}/logs"
    - "{{ prometheus_exporters_config_dir }}"
    - "{{ node_exporter_textfile_dir }}"

- name: Install required packages for exporters
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - tar
      - gzip
      - jq
      - bc
    state: present
    update_cache: true
  become: true

- name: Create systemd service template directory
  ansible.builtin.file:
    path: /etc/systemd/system
    state: directory
    mode: '0755'
  become: true

- name: Set up logrotate for exporter logs
  ansible.builtin.template:
    src: prometheus-exporters-logrotate.j2
    dest: /etc/logrotate.d/prometheus-exporters
    owner: root
    ansible.builtin.group: root
    mode: '0644'
  become: true
