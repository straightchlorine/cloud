---
# Pi-specific hardware metrics collection

- name: Create Pi hardware metrics collection script
  ansible.builtin.template:
    src: pi_hardware_metrics.sh.j2
    dest: "{{ prometheus_exporters_pi_hardware_metrics_script }}"
    owner: "{{ prometheus_exporters_user }}"
    group: "{{ prometheus_exporters_group }}"
    mode: "0755"
  become: true
  notify: restart pi-hardware-metrics

- name: Create systemd service for Pi hardware metrics
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/pi-hardware-metrics.service
    owner: root
    group: root
    mode: "0644"
  vars:
    service_description: "Pi Hardware Metrics Collection"
    service_after: ["network.target"]
    service_type: "oneshot"
    service_user: "{{ prometheus_exporters_user }}"
    service_group: "{{ prometheus_exporters_group }}"
    exec_start: "{{ prometheus_exporters_pi_hardware_metrics_script }}"
    remain_after_exit: "false"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["{{ prometheus_exporters_node_exporter_textfile_dir }}"]
  become: true
  notify:
    - Reload systemd
    - restart pi-hardware-metrics

- name: Create systemd timer for Pi hardware metrics
  ansible.builtin.template:
    src: pi-hardware-metrics.timer.j2
    dest: /etc/systemd/system/pi-hardware-metrics.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - restart pi-hardware-metrics-timer

- name: Enable and start Pi hardware metrics timer
  ansible.builtin.systemd:
    name: Pi-hardware-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Create initial hardware metrics
  ansible.builtin.command:
    cmd: "{{ prometheus_exporters_pi_hardware_metrics_script }}"
  become_user: "{{ prometheus_exporters_user }}"
  become: true
  changed_when: false

- name: Verify Pi hardware metrics file creation
  ansible.builtin.stat:
    path: "{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom"
  register: prom_exp_pi_metrics_file

- name: Display Pi hardware metrics sample
  ansible.builtin.shell: head -n 5 "{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom"
  register: prom_exp_pi_metrics_sample
  changed_when: false
  when: prom_exp_pi_metrics_file.stat.exists

- name: Pi hardware metrics setup completed
  ansible.builtin.debug:
    msg: |
      [OK] Pi Hardware Metrics Setup Complete:
      - Metrics script: {{ prometheus_exporters_pi_hardware_metrics_script }}
      - Collection interval: {{ prometheus_exporters_pi_hardware_metrics_interval }} seconds
      - Textfile output: {{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom
      - Service: pi-hardware-metrics.timer
      {% if prom_exp_pi_metrics_sample.stdout is defined %}

      Sample metrics:
      {{ prom_exp_pi_metrics_sample.stdout }}
      {% endif %}
