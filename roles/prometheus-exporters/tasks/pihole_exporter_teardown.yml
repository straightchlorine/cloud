---
# This removes the Pi-hole exporter artifacts only.
# The shared prometheus user and group stay because node_exporter and pi_hardware_metrics still run under them.
# The teardown_confirmed gate keeps it from running outside a teardown playbook.

- name: Tear down Pi-hole Exporter
  when: teardown_confirmed | default(false) | bool
  block:
    - name: Stop and disable Pi-hole Exporter service
      ansible.builtin.systemd:
        name: pihole-exporter
        state: stopped
        enabled: false
      become: true
      # The unit does not exist when the exporter was never deployed.
      failed_when: false

    - name: Remove Pi-hole Exporter systemd service
      ansible.builtin.file:
        path: /etc/systemd/system/pihole-exporter.service
        state: absent
      become: true

    - name: Reload systemd after removing the unit file
      # This is not a notify because the file can run from playbooks such as dns-teardown.yml.
      # Those playbooks never load the handlers of roles/common.
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Remove Pi-hole Exporter binary and config
      # The list includes the checksum file in /tmp.
      # A run interrupted between download and cleanup leaves a stale checksum.
      # That checksum would force a re-fetch on the next deploy.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter"
        - "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter.version"
        - "{{ prometheus_exporters_config_dir }}/pihole-exporter.conf"
        - "/tmp/pihole_exporter_checksum.txt"
      become: true

    - name: Remove firewall rule for Pi-hole Exporter
      # The rule mirrors the one firewall.yml adds, with the same source and protocol.
      # ufw only deletes rules whose parameters match, so deleting by port alone would silently leave it.
      community.general.ufw:
        rule: allow
        port: "{{ prometheus_exporters_pihole_exporter_port }}"
        proto: tcp
        src: "{{ prometheus_exporters_firewall_source }}"
        comment: "Pi-hole Prometheus Exporter"
        delete: true
      become: true
      # Deleting a rule that is not there must not fail the teardown.
      failed_when: false

    - name: Remove the Pi-hole Exporter's src-unrestricted common firewall rule too
      # firewall_common_ports may also open this port with no source restriction.
      # The port belongs exclusively to this exporter, so both rules go with it.
      community.general.ufw:
        rule: allow
        port: "{{ prometheus_exporters_pihole_exporter_port }}"
        proto: tcp
        delete: true
      become: true
      # Deleting a rule that is not there must not fail the teardown.
      failed_when: false
