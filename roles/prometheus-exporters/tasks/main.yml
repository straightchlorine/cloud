---

- name: Include validation tasks
  ansible.builtin.include_tasks: validate.yml
  tags:
    - validation

- name: Include common setup tasks
  ansible.builtin.include_tasks:
    file: common_setup.yml
    apply:
      tags:
        - dns
        - automation
        - music
        - monitoring
        - backup
  when: prometheus_exporters_enabled
  tags:
    - dns
    - automation
    - music
    - monitoring
    - backup

- name: Gather network facts
  # primary_ip is rendered into the exporters' systemd units.
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
    apply:
      tags:
        - dns
        - automation
        - music
        - monitoring
        - backup
  when: prometheus_exporters_enabled
  tags:
    - dns
    - automation
    - music
    - monitoring
    - backup

- name: Include Node Exporter setup
  ansible.builtin.include_tasks:
    file: node_exporter.yml
    apply:
      tags:
        - dns
        - automation
        - music
        - monitoring
        - backup
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_node_exporter_enabled
  tags:
    - dns
    - automation
    - music
    - monitoring
    - backup

- name: Include Pi hardware metrics setup
  ansible.builtin.include_tasks:
    file: pi_hardware_metrics.yml
    apply:
      tags:
        - dns
        - automation
        - music
        - monitoring
        - backup
  when:
    - prometheus_exporters_enabled
    - pi_hardware_metrics_enabled
    - ansible_architecture in ['armv7l', 'aarch64']
  tags:
    - dns
    - automation
    - music
    - monitoring
    - backup

- name: Include Pi-hole Exporter setup
  ansible.builtin.include_tasks:
    file: pihole_exporter.yml
    apply:
      tags:
        - dns
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_pihole_exporter_enabled
    - "'dns' in group_names"
  tags:
    - dns

- name: Include Docker Exporter setup
  ansible.builtin.include_tasks:
    file: docker_exporter.yml
    apply:
      tags:
        - automation
        - music
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_docker_exporter_enabled
    - "'automation' in group_names or 'music' in group_names"
  tags:
    - automation
    - music

- name: Include firewall configuration
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - dns
        - automation
        - music
        - monitoring
        - backup
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_ufw_enabled
  tags:
    - dns
    - automation
    - music
    - monitoring
    - backup

- name: Include health checks
  ansible.builtin.include_tasks: health_checks.yml
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_health_check_enabled
  tags:
    - health_check
    - post_validation
