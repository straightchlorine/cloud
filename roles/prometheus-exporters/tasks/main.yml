---

- name: Include validation tasks
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common setup tasks
  # Also tagged with every host-specific play tag in site.yml: this creates the
  # user, directories (including {{ prometheus_exporters_base_dir }}/bin) and
  # packages that node_exporter.yml et al. depend on, but an untagged include
  # is skipped on `--tags dns`-style scoped runs - the exporters then fail
  # with "Destination directory ... does not exist".
  # apply: is required, not just tags: on the include itself - see the note on
  # node_exporter below.
  ansible.builtin.include_tasks:
    file: common_setup.yml
    apply:
      tags: [dns, automation, music, monitoring, backup]
  when: prometheus_exporters_enabled
  tags: [dns, automation, music, monitoring, backup]

- name: Gather network facts
  # primary_ip is rendered into the exporters' systemd units
  # (--web.listen-address). The fleet-wide play's common role normally provides
  # it, but that role is tagged [common, base] - on `--tags dns`-style scoped
  # runs it never executes, primary_ip is undefined, and the systemd template's
  # 'is defined' guard then SILENTLY drops the ExecStart line, leaving a unit
  # systemd rejects with BadUnitSetting. Same tag-propagation rules as the
  # includes above: apply: is required, tags: alone does nothing.
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
    apply:
      tags: [dns, automation, music, monitoring, backup]
  when: prometheus_exporters_enabled
  tags: [dns, automation, music, monitoring, backup]

- name: Include Node Exporter setup
  # Also tagged with every host-specific play tag in site.yml: node_exporter
  # runs on every host, but this task lives in the fleet-wide "Configure all
  # hosts" play, which only carries [monitoring, prometheus, exporters] by
  # default - without this, `--tags dns` (or automation/music/backup) never
  # reaches it, so it silently never gets installed on a --tags-scoped run.
  # apply: is required, not just tags: on the include itself - plain tags:
  # only gates whether the include statement runs, it does NOT propagate
  # into the tasks defined inside node_exporter.yml, so without apply: every
  # task in that file gets silently tag-filtered out anyway.
  ansible.builtin.include_tasks:
    file: node_exporter.yml
    apply:
      tags: [dns, automation, music, monitoring, backup]
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_node_exporter_enabled
  tags: [dns, automation, music, monitoring, backup]

- name: Include Pi hardware metrics setup
  ansible.builtin.include_tasks: pi_hardware_metrics.yml
  when:
    - prometheus_exporters_enabled
    - pi_hardware_metrics_enabled
    - ansible_architecture in ['armv7l', 'aarch64']

- name: Include Pi-hole Exporter setup
  # Also tagged dns: this task lives in the fleet-wide "Configure all hosts"
  # play (site.yml), which only carries [monitoring, prometheus, exporters]
  # by default - without this, `ansible-playbook site.yml --tags dns` never
  # reaches it at all, so the exporter silently never gets installed.
  # apply: is required, not just tags: on the include itself - see the note
  # on node_exporter above.
  ansible.builtin.include_tasks:
    file: pihole_exporter.yml
    apply:
      tags: [dns]
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_pihole_exporter_enabled
    - "'dns' in group_names"
  tags: [dns]

- name: Include Docker Exporter setup
  ansible.builtin.include_tasks: docker_exporter.yml
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_docker_exporter_enabled
    - "'automation' in group_names or 'music' in group_names"

- name: Include firewall configuration
  ansible.builtin.include_tasks: firewall.yml
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_ufw_enabled

- name: Include health checks
  ansible.builtin.include_tasks: health_checks.yml
  when:
    - prometheus_exporters_enabled
    - prometheus_exporters_health_check_enabled
  tags: [health_check, post_validation]
