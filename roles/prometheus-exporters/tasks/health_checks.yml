---
# Health checks for Prometheus exporters

- name: Check Node Exporter health
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_exporters_node_exporter_port }}/metrics"
    method: GET
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
    return_content: true
  register: node_exporter_health_check
  failed_when: false
  when: node_exporter_enabled

- name: Check Pi-hole Exporter health
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics"
    method: GET
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
    return_content: true
  register: pihole_exporter_health_check
  failed_when: false
  when: pihole_exporter_enabled

- name: Check Docker metrics endpoint
  ansible.builtin.uri:
    url: "http://localhost:9323/metrics"
    method: GET
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
    return_content: true
  register: docker_metrics_health_check
  failed_when: false
  when: docker_exporter_enabled

- name: Verify Pi hardware metrics file
  ansible.builtin.stat:
    path: "{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom"
  register: pi_hardware_metrics_file
  when: pi_hardware_metrics_enabled

- name: Check textfile metrics freshness
  ansible.builtin.shell: |
    if [ -f "{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom" ]; then
      # Check if file is newer than 5 minutes (300 seconds)
      if [ $(($(date +%s) - $(stat -c %Y "{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom"))) -lt 300 ]; then
        echo "fresh"
      else
        echo "stale"
      fi
    else
      echo "missing"
    fi
  register: textfile_freshness_check
  changed_when: false
  when: pi_hardware_metrics_enabled

- name: Count available metrics
  ansible.builtin.shell: |
    set -o pipefail
    metrics_count=0
    {% if node_exporter_enabled %}
    if curl -s http://localhost:{{ prometheus_exporters_node_exporter_port }}/metrics | grep -c '^[a-zA-Z]' >/dev/null 2>&1; then
      node_metrics=$(curl -s http://localhost:{{ prometheus_exporters_node_exporter_port }}/metrics | grep -c '^[a-zA-Z]' || echo 0)
      metrics_count=$((metrics_count + node_metrics))
    fi
    {% endif %}
    {% if pihole_exporter_enabled %}
    if curl -s http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics | grep -c '^pihole_' >/dev/null 2>&1; then
      pihole_metrics=$(curl -s http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics | grep -c '^pihole_' || echo 0)
      metrics_count=$((metrics_count + pihole_metrics))
    fi
    {% endif %}
    echo $metrics_count
  changed_when: false

- name: Generate comprehensive health report
  ansible.builtin.debug:
    msg: |
      🏥 Prometheus Exporters Health Check Report:

      {% if node_exporter_enabled %}
      Node Exporter ({{ prometheus_exporters_node_exporter_port }}):
      common_Status: {{ '[OK] Healthy' if node_exporter_health_check.status == 200 else '[FAIL] Unhealthy' }}
      {% if node_exporter_health_check.status == 200 %}
      Response time: {{ node_exporter_health_check.elapsed }}s
      {% endif %}
      {% endif %}

      {% if pihole_exporter_enabled %}
      Pi-hole Exporter ({{ prometheus_exporters_pihole_exporter_port }}):
      common_Status: {{ '[OK] Healthy' if pihole_exporter_health_check.status == 200 else '[FAIL] Unhealthy' }}
      {% if pihole_exporter_health_check.status == 200 %}
      Response time: {{ pihole_exporter_health_check.elapsed }}s
      {% endif %}
      {% endif %}

      {% if docker_exporter_enabled %}
      Docker Metrics (9323):
      common_Status: {{ '[OK] Healthy' if docker_metrics_health_check.status == 200 else '[FAIL] Unhealthy' }}
      {% if docker_metrics_health_check.status == 200 %}
      Response time: {{ docker_metrics_health_check.elapsed }}s
      {% endif %}
      {% endif %}

      {% if pi_hardware_metrics_enabled %}
      Pi Hardware Metrics:
      File exists: {{ '[OK] Yes' if pi_hardware_metrics_file.stat.exists else '[FAIL] No' }}
      Freshness: {{ '[OK] Fresh' if textfile_freshness_check.stdout == 'fresh' else '[WARN] Stale/Missing' }}
      {% endif %}

      Overall Metrics:
      Total metrics available: {{ total_metrics_count.stdout }}
      Health check timeout: {{ prometheus_exporters_health_check_timeout }}s

      {% if node_exporter_health_check.status != 200 or (pihole_exporter_enabled and
            pihole_exporter_health_check.status != 200) or (docker_exporter_enabled and
            docker_metrics_health_check.status != 200) %}
      [WARN]  Some exporters are not responding. Check service status and logs.
      {% else %}
      🎉 All enabled exporters are healthy and responding!
      {% endif %}

- name: Fail if critical exporters are unhealthy
  ansible.builtin.fail:
    msg: "Critical Prometheus exporters are not responding. Check service status and configuration."
  when:
    - node_exporter_enabled
    - node_exporter_health_check.status != 200
