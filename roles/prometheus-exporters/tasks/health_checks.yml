---
# Health checks for Prometheus exporters

- name: Check Node Exporter health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_exporters_node_exporter_port }}/metrics"
    method: GET
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
    return_content: true
  register: prom_exp_node_health_check
  failed_when: false
  when: node_exporter_enabled

- name: Check Pi-hole Exporter health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_exporters_pihole_exporter_port }}/metrics"
    method: GET
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
    return_content: true
  register: prom_exp_pihole_health_check
  failed_when: false
  when: prometheus_exporters_pihole_exporter_enabled

- name: Check Docker metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_exporters_docker_exporter_port }}/metrics"
    method: GET
    timeout: "{{ prometheus_exporters_health_check_timeout }}"
    return_content: true
  register: prom_exp_docker_health_check
  failed_when: false
  when: docker_exporter_enabled

- name: Verify Pi hardware metrics file
  ansible.builtin.stat:
    path: "{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom"
  register: prom_exp_pi_hw_metrics_file
  when: pi_hardware_metrics_enabled

- name: Check textfile metrics freshness
  ansible.builtin.shell: |
    PROM_FILE="{{ prometheus_exporters_node_exporter_textfile_dir }}/pi_hardware.prom"
    if [ -f "$PROM_FILE" ]; then
      AGE=$(($(date +%s) - $(stat -c %Y "$PROM_FILE")))
      if [ "$AGE" -lt 300 ]; then
        echo "fresh"
      else
        echo "stale"
      fi
    else
      echo "missing"
    fi
  register: prom_exp_textfile_freshness
  changed_when: false
  when: pi_hardware_metrics_enabled

- name: Count available metrics
  ansible.builtin.shell: |
    set -o pipefail
    metrics_count=0
    {% if node_exporter_enabled %}
    NODE_URL="http://127.0.0.1:{{ prometheus_exporters_node_exporter_port }}/metrics"
    if curl -s "$NODE_URL" | grep -c '^[a-zA-Z]' >/dev/null 2>&1; then
      node_metrics=$(curl -s "$NODE_URL" \
        | grep -c '^[a-zA-Z]' || echo 0)
      metrics_count=$((metrics_count + node_metrics))
    fi
    {% endif %}
    {% if prometheus_exporters_pihole_exporter_enabled %}
    PIHOLE_URL="http://127.0.0.1:{{ prometheus_exporters_pihole_exporter_port }}/metrics"
    if curl -s "$PIHOLE_URL" | grep -c '^pihole_' >/dev/null 2>&1; then
      pihole_metrics=$(curl -s "$PIHOLE_URL" \
        | grep -c '^pihole_' || echo 0)
      metrics_count=$((metrics_count + pihole_metrics))
    fi
    {% endif %}
    echo $metrics_count
  changed_when: false
  register: total_metrics_count

- name: Generate comprehensive health report
  ansible.builtin.debug:
    msg: |
      🏥 Prometheus Exporters Health Check Report:

      {% if node_exporter_enabled %}
      Node Exporter ({{ prometheus_exporters_node_exporter_port }}):
      common_Status: {{ '[OK] Healthy' if prom_exp_node_health_check.status == 200 else '[FAIL] Unhealthy' }}
      {% if prom_exp_node_health_check.status == 200 %}
      Response time: {{ prom_exp_node_health_check.elapsed }}s
      {% endif %}
      {% endif %}

      {% if prometheus_exporters_pihole_exporter_enabled %}
      Pi-hole Exporter ({{ prometheus_exporters_pihole_exporter_port }}):
      common_Status: {{ '[OK] Healthy' if prom_exp_pihole_health_check.status == 200 else '[FAIL] Unhealthy' }}
      {% if prom_exp_pihole_health_check.status == 200 %}
      Response time: {{ prom_exp_pihole_health_check.elapsed }}s
      {% endif %}
      {% endif %}

      {% if docker_exporter_enabled %}
      Docker Metrics ({{ prometheus_exporters_docker_exporter_port }}):
      common_Status: {{ '[OK] Healthy' if prom_exp_docker_health_check.status == 200 else '[FAIL] Unhealthy' }}
      {% if prom_exp_docker_health_check.status == 200 %}
      Response time: {{ prom_exp_docker_health_check.elapsed }}s
      {% endif %}
      {% endif %}

      {% if pi_hardware_metrics_enabled %}
      Pi Hardware Metrics:
      File exists: {{ '[OK] Yes' if prom_exp_pi_hw_metrics_file.stat.exists else '[FAIL] No' }}
      Freshness: {{ '[OK] Fresh' if prom_exp_textfile_freshness.stdout == 'fresh' else '[WARN] Stale/Missing' }}
      {% endif %}

      Overall Metrics:
      Total metrics available: {{ total_metrics_count.stdout }}
      Health check timeout: {{ prometheus_exporters_health_check_timeout }}s

      {% if prom_exp_node_health_check.status != 200 or (prometheus_exporters_pihole_exporter_enabled and
            prom_exp_pihole_health_check.status != 200) or (docker_exporter_enabled and
            prom_exp_docker_health_check.status != 200) %}
      [WARN]  Some exporters are not responding. Check service status and logs.
      {% else %}
      🎉 All enabled exporters are healthy and responding!
      {% endif %}

- name: Fail if critical exporters are unhealthy
  ansible.builtin.fail:
    msg: "Critical Prometheus exporters are not responding. Check service status and configuration."
  when:
    - node_exporter_enabled
    - prom_exp_node_health_check.status != 200
