---
# Docker metrics via Node Exporter (no separate exporter needed)

- name: Check if daemon.json exists
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: prom_exp_daemon_json_stat
  become: true
  when: docker_exporter_enabled

- name: Read existing daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: prom_exp_daemon_json_content
  become: true
  when:
    - docker_exporter_enabled
    - prom_exp_daemon_json_stat.stat.exists

- name: Merge Docker metrics config into daemon.json
  ansible.builtin.copy:
    content: >-
      {{ (prom_exp_daemon_json_content.content | b64decode | from_json
      if prom_exp_daemon_json_stat.stat.exists
      else {})
      | combine({"metrics-addr": "127.0.0.1:{{ prometheus_exporters_docker_exporter_port }}",
      "experimental": true}) | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: restart docker
  when: docker_exporter_enabled

- name: Verify userns-remap preserved in daemon.json after merge
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: prom_exp_daemon_json_post_merge
  become: true
  when: docker_exporter_enabled

- name: Assert userns-remap key still present in daemon.json
  ansible.builtin.assert:
    that:
      - "'userns-remap' in (prom_exp_daemon_json_post_merge.content | b64decode | from_json)"
    fail_msg: >-
      CRITICAL: userns-remap key was lost from daemon.json during metrics config merge.
      Docker container isolation may be compromised. Restore from backup.
    success_msg: "userns-remap key verified present in daemon.json"
  when: docker_exporter_enabled

- name: Create Docker metrics collection script
  ansible.builtin.template:
    src: docker_metrics.sh.j2
    dest: "{{ prometheus_exporters_base_dir }}/scripts/docker_metrics.sh"
    owner: "{{ prometheus_exporters_user }}"
    group: "{{ prometheus_exporters_group }}"
    mode: '0755'
  become: true

- name: Create systemd service for Docker metrics collection
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/docker-metrics.service
    owner: root
    group: root
    mode: '0644'
  vars:
    service_description: "Docker Metrics Collection"
    service_after: ["network.target", "docker.service"]
    common_service_wants: ["docker.service"]
    service_type: "oneshot"
    service_user: "{{ prometheus_exporters_user }}"
    service_group: "{{ prometheus_exporters_group }}"
    exec_start: "{{ prometheus_exporters_base_dir }}/scripts/docker_metrics.sh"
    remain_after_exit: "false"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["{{ prometheus_exporters_node_exporter_textfile_dir }}"]
  become: true
  notify:
    - reload systemd
    - restart docker-metrics

- name: Create systemd timer for Docker metrics collection
  ansible.builtin.template:
    src: docker-metrics.timer.j2
    dest: /etc/systemd/system/docker-metrics.timer
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - reload systemd
    - restart docker-metrics-timer

- name: Enable and start Docker metrics timer
  ansible.builtin.systemd:
    name: Docker-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: docker_exporter_enabled

- name: Test Docker metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_exporters_docker_exporter_port }}/metrics"
    method: GET
    timeout: 5
  register: prom_exp_docker_metrics_test
  failed_when: false
  when: docker_exporter_enabled

- name: Docker metrics setup status
  ansible.builtin.debug:
    msg: |
      [OK] Docker Metrics Setup:
      - Docker daemon metrics: {{ 'Enabled' if docker_exporter_enabled else 'Disabled' }}
      - Metrics endpoint: {{ 'Accessible' if prom_exp_docker_metrics_test.status == 200 else 'Not accessible' }}
      - Collection script: {{ prometheus_exporters_base_dir }}/scripts/docker_metrics.sh
  when: docker_exporter_enabled
