---

- name: Install Node Exporter via binary (recommended)
  when: node_exporter_install_method == "binary"
  block:
    - name: Check current Node Exporter version
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f "{{ prometheus_exporters_base_dir }}/bin/node_exporter" ]; then
          {{ prometheus_exporters_base_dir }}/bin/node_exporter --version 2>/dev/null | head -n 1 |
          grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown"
        else
          echo "not_installed"
        fi
      changed_when: false

    - name: Download and install Node Exporter
      block:
        - name: Download Node Exporter checksums
          # retries: GitHub release downloads redirect through
          # objects.githubusercontent.com - occasional dropped connections on
          # a Pi's link are transient, not a real failure.
          ansible.builtin.get_url:
            url: "{{ prometheus_exporters_node_exporter_checksum_url }}"
            dest: "/tmp/node_exporter_checksums.txt"
            # force: a partial file can be left behind by a dropped connection; get_url
            # would accept it without a checksum and grep would read stale data.
            force: true
            timeout: 30
          register: prom_exp_node_exporter_checksums_download
          retries: 3
          delay: 5
          until: prom_exp_node_exporter_checksums_download is succeeded

        - name: Extract expected checksum
          ansible.builtin.shell: |
            set -o pipefail
            grep "node_exporter-{{ prometheus_exporters_node_exporter_version }}.linux-{{
                  prometheus_exporters_prometheus_arch_map[ansible_architecture] }}.tar.gz" \
              /tmp/node_exporter_checksums.txt | cut -d' ' -f1
          register: prom_exp_expected_checksum
          changed_when: false

        - name: Download Node Exporter archive
          ansible.builtin.get_url:
            url: "{{ prometheus_exporters_node_exporter_binary_url }}"
            dest: "/tmp/node_exporter-{{ prometheus_exporters_node_exporter_version }}.tar.gz"
            checksum: "sha256:{{ prom_exp_expected_checksum.stdout }}"
            timeout: 60
          register: prom_exp_node_exporter_archive_download
          retries: 3
          delay: 5
          until: prom_exp_node_exporter_archive_download is succeeded

        - name: Extract Node Exporter archive
          ansible.builtin.unarchive:
            src: "/tmp/node_exporter-{{ prometheus_exporters_node_exporter_version }}.tar.gz"
            dest: "/tmp"
            remote_src: true

        - name: Install Node Exporter binary
          ansible.builtin.copy:
            src: >-
              /tmp/node_exporter-{{ prometheus_exporters_node_exporter_version }}.linux-{{
              prometheus_exporters_prometheus_arch_map[ansible_architecture] }}/node_exporter
            dest: "{{ prometheus_exporters_base_dir }}/bin/node_exporter"
            owner: "{{ prometheus_exporters_user }}"
            group: "{{ prometheus_exporters_group }}"
            mode: '0755'
            remote_src: true
          become: true
          notify: Restart node-exporter

        - name: Clean up downloaded files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/node_exporter-{{ prometheus_exporters_node_exporter_version }}.tar.gz"
            - >-
              /tmp/node_exporter-{{ prometheus_exporters_node_exporter_version
              }}.linux-{{ prometheus_exporters_prometheus_arch_map[ansible_architecture] }}
            - "/tmp/node_exporter_checksums.txt"

- name: Install Node Exporter via package manager (fallback)
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
  become: true
  when: node_exporter_install_method == "package"

- name: Create Node Exporter service file
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/node-exporter.service
    owner: root
    group: root
    mode: '0644'
  vars:
    service_description: "Prometheus Node Exporter"
    common_service_wants: ["network-online.target"]
    service_after: ["network-online.target"]
    service_type: "simple"
    service_user: "{{ prometheus_exporters_user }}"
    service_group: "{{ prometheus_exporters_group }}"
    exec_reload: "/bin/kill -HUP $MAINPID"
    exec_start: >-
      {{ prometheus_exporters_base_dir }}/bin/node_exporter
      {% for collector in node_exporter_enabled_collectors %}
      --collector.{{ collector }}
      {% endfor %}
      --collector.textfile.directory={{ prometheus_exporters_node_exporter_textfile_dir }}
      --web.listen-address={{ primary_ip }}:{{ prometheus_exporters_node_exporter_port }}
      --web.telemetry-path=/metrics
      --log.level=info
      --log.format=logfmt
    syslog_identifier: "node_exporter"
    restart_policy: "always"
    restart_sec: "1"
    start_limit_interval_sec: "0"
    common_protect_home: "true"
    common_protect_system: "strict"
    protect_control_groups: "true"
    protect_kernel_modules: "true"
    protect_kernel_tunables: "true"
    common_read_write_paths: ["{{ prometheus_exporters_node_exporter_textfile_dir }}"]
  become: true
  notify:
    - Reload systemd
    - Restart node-exporter
  when: node_exporter_install_method == "binary"

- name: Enable and start Node Exporter service
  ansible.builtin.systemd:
    name: "{{ 'node-exporter' if node_exporter_install_method == 'binary' else 'prometheus-node-exporter' }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Verify Node Exporter is responding
  # Must target primary_ip, not localhost: the unit binds
  # --web.listen-address={{ primary_ip }}:port, so 127.0.0.1:port refuses.
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ prometheus_exporters_node_exporter_port }}/metrics"
    method: GET
    timeout: 10
  register: prom_exp_node_exporter_health
  retries: 3
  delay: 5
  until: prom_exp_node_exporter_health.status == 200
