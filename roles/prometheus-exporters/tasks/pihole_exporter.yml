---
- name: Download Pi-hole Exporter checksum
  ansible.builtin.get_url:
    url: "{{ prometheus_exporters_pihole_exporter_checksum_url }}"
    dest: "/tmp/pihole_exporter_checksum.txt"
    force: true
    timeout: 30
  register: prom_exp_pihole_exporter_checksum_download
  retries: 3
  delay: 5
  until: prom_exp_pihole_exporter_checksum_download is succeeded

- name: Extract expected Pi-hole Exporter checksum
  ansible.builtin.shell: |
    set -o pipefail
    grep "pihole_exporter-linux-{{ prometheus_exporters_pihole_arch_map[ansible_architecture] }}" \
      /tmp/pihole_exporter_checksum.txt | cut -d' ' -f1
  register: prom_exp_pihole_expected_checksum
  changed_when: false

- name: Download Pi-hole Exporter binary
  ansible.builtin.get_url:
    url: "{{ prometheus_exporters_pihole_exporter_binary_url }}"
    dest: "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter"
    owner: "{{ prometheus_exporters_user }}"
    group: "{{ prometheus_exporters_group }}"
    mode: "0755"
    checksum: "sha256:{{ prom_exp_pihole_expected_checksum.stdout }}"
    timeout: 60
  become: true
  register: prom_exp_pihole_exporter_download
  retries: 3
  delay: 5
  until: prom_exp_pihole_exporter_download is succeeded
  notify: Restart pihole-exporter

- name: Clean up Pi-hole Exporter checksum file
  ansible.builtin.file:
    path: "/tmp/pihole_exporter_checksum.txt"
    state: absent

- name: Sync the Pi-hole admin password to the vault
  # The dns play runs after this one, so a rotated password would otherwise
  # fail the verification below before the dns role could apply it.
  ansible.builtin.include_role:
    name: common
    tasks_from: pihole_password_sync

- name: Write the Pi-hole Exporter environment file
  # Keeps the password out of ExecStart, which ps exposes. Escaped because
  # systemd parses backslashes and quotes in EnvironmentFile values.
  ansible.builtin.copy:
    content: |
      PIHOLE_PASSWORD="{{ vault_pihole_webpassword
      | replace(prom_exp_backslash, prom_exp_backslash ~ prom_exp_backslash)
      | replace('"', prom_exp_backslash ~ '"') }}"
    dest: "{{ prometheus_exporters_config_dir }}/pihole-exporter.conf"
    owner: root
    group: root
    mode: "0600"
  vars:
    prom_exp_backslash: '\'
  no_log: true
  become: true
  notify: Restart pihole-exporter

- name: Create Pi-hole Exporter systemd service
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/pihole-exporter.service
    owner: root
    group: root
    mode: "0644"
  vars:
    service_description: "Pi-hole Prometheus Exporter"
    service_after: ["network.target", "pihole-FTL.service"]
    # The exporter never re-authenticates, so an FTL restart (which drops all
    # API sessions) must restart it too.
    service_part_of: ["pihole-FTL.service"]
    common_service_wants: ["network.target"]
    service_type: "simple"
    service_user: "{{ prometheus_exporters_user }}"
    service_group: "{{ prometheus_exporters_group }}"
    environment_file: "{{ prometheus_exporters_config_dir }}/pihole-exporter.conf"
    # FTL is "started" before its API listens and the exporter logs in only
    # once, so wait for the API. $$ escapes systemd's variable expansion.
    exec_start_pre:
      - >-
        /bin/sh -c 'for i in $$(seq 1 20); do curl -sf -m 2 -o /dev/null
        http://{{ prometheus_exporters_pihole_exporter_target_host }}:{{
        prometheus_exporters_pihole_exporter_target_port }}/api/info/login
        && exit 0; sleep 2; done; exit 1'
    exec_start: >-
      {{ prometheus_exporters_base_dir }}/bin/pihole_exporter
      -pihole_hostname {{ prometheus_exporters_pihole_exporter_target_host }}
      -port {{ prometheus_exporters_pihole_exporter_port }}
    restart_policy: "on-failure"
    restart_sec: "5"
    syslog_identifier: "pihole-exporter"
    kill_mode: "mixed"
    timeout_stop_sec: "5"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["{{ prometheus_exporters_base_dir }}/bin"]
  become: true
  notify:
    - Reload systemd
    - Restart pihole-exporter

- name: Enable and start Pi-hole Exporter service
  ansible.builtin.systemd:
    name: pihole-exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Restart the exporter so it logs in with the synced password
  ansible.builtin.systemd:
    name: pihole-exporter
    state: restarted
  become: true
  when: common_pihole_password_synced

- name: Flush pending handlers before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify Pi-hole Exporter is scraping Pi-hole
  # /metrics answers 200 even when every scrape fails (e.g. a dead session), so
  # pihole_status 1 is the proof it can actually read Pi-hole's API.
  block:
    - name: Check the exporter reports pihole_status 1
      ansible.builtin.shell:
        cmd: >-
          curl -s -m 30 http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics
          | grep -c '^pihole_status 1$' || true
      register: prom_exp_pihole_exporter_health
      changed_when: false
      # On weaker hosts the first scrape can take a while.
      retries: 4
      delay: 30
      until: prom_exp_pihole_exporter_health.stdout | int == 1
  rescue:
    - name: Read the exporter's recent log
      ansible.builtin.command: journalctl -u pihole-exporter -n 5 --no-pager
      register: prom_exp_pihole_exporter_log
      changed_when: false
      become: true

    - name: Show why the exporter is not scraping
      ansible.builtin.debug:
        var: prom_exp_pihole_exporter_log.stdout_lines

    - name: Restart the exporter to clear poisoned scrape state
      ansible.builtin.systemd:
        name: pihole-exporter
        state: restarted
      become: true

    - name: Check the exporter reports pihole_status 1 after restart
      ansible.builtin.shell:
        cmd: >-
          curl -s -m 30 http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics
          | grep -c '^pihole_status 1$' || true
      register: prom_exp_pihole_exporter_health_after_restart
      changed_when: false
      retries: 4
      delay: 30
      until: prom_exp_pihole_exporter_health_after_restart.stdout | int == 1

- name: Test Pi-hole connectivity from exporter
  ansible.builtin.uri:
    url: >-
      http://{{ prometheus_exporters_pihole_exporter_target_host
      }}:{{ prometheus_exporters_pihole_exporter_target_port }}/api/info/login
    method: GET
    timeout: 5
  register: prom_exp_pihole_api_test
  failed_when: false

- name: Warn if Pi-hole API not accessible
  ansible.builtin.debug:
    msg: "WARNING: Pi-hole API not accessible. Pi-hole Exporter may not collect all metrics."
  when: prom_exp_pihole_api_test.status != 200
