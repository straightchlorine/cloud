---

- name: Download Pi-hole Exporter binary
  ansible.builtin.get_url:
    url: "{{ pihole_exporter_binary_url }}"
    dest: "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter"
    owner: "{{ prometheus_exporters_user }}"
    group: "{{ prometheus_exporters_group }}"
    mode: "0755"
    timeout: 60
  become: true
  notify: Restart pihole-exporter

- name: Create Pi-hole Exporter configuration file
  ansible.builtin.template:
    src: pihole-exporter.conf.j2
    dest: "{{ prometheus_exporters_config_dir }}/pihole-exporter.conf"
    owner: "{{ prometheus_exporters_user }}"
    group: "{{ prometheus_exporters_group }}"
    mode: "0644"
  become: true
  notify: Restart pihole-exporter

- name: Create Pi-hole Exporter systemd service
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/pihole-exporter.service
    owner: root
    group: root
    mode: "0644"
  vars:
    service_description: "Pi-hole Prometheus Exporter"
    service_after: ["network.target"]
    common_service_wants: ["network.target"]
    service_type: "simple"
    service_user: "{{ prometheus_exporters_user }}"
    service_group: "{{ prometheus_exporters_group }}"
    exec_start: >-
      {{ prometheus_exporters_base_dir }}/bin/pihole_exporter
      -pihole_hostname {{ prometheus_exporters_pihole_exporter_target_host }}
      -pihole_password {{ vault_pihole_webpassword }}
      -port {{ prometheus_exporters_pihole_exporter_port }}
    restart_policy: "on-failure"
    restart_sec: "5"
    syslog_identifier: "pihole-exporter"
    kill_mode: "mixed"
    timeout_stop_sec: "5"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["{{ prometheus_exporters_base_dir }}/bin"]
  become: true
  notify:
    - Reload systemd
    - Restart pihole-exporter

- name: Enable and start Pi-hole Exporter service
  ansible.builtin.systemd:
    name: pihole-exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Verify Pi-hole Exporter is responding
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_exporters_pihole_exporter_port }}/metrics"
    method: GET
    timeout: 10
  register: prom_exp_pihole_exporter_health
  retries: 3
  delay: 5
  until: prom_exp_pihole_exporter_health.status == 200

- name: Test Pi-hole connectivity from exporter
  ansible.builtin.uri:
    url: >-
      http://{{ prometheus_exporters_pihole_exporter_target_host
      }}:{{ prometheus_exporters_pihole_exporter_target_port }}/api/info/login
    method: GET
    timeout: 5
  register: prom_exp_pihole_api_test
  failed_when: false

- name: Warn if Pi-hole API not accessible
  ansible.builtin.debug:
    msg: "WARNING: Pi-hole API not accessible. Pi-hole Exporter may not collect all metrics."
  when: prom_exp_pihole_api_test.status != 200
