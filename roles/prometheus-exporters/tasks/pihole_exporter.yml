---
- name: Read the installed Pi-hole Exporter version
  # The exporter has no --version flag, so the install records the version it fetched.
  ansible.builtin.slurp:
    src: "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter.version"
  register: prom_exp_pihole_installed
  # A missing version file means no exporter is installed, and the install below then runs.
  failed_when: false

- name: Download and install the Pi-hole Exporter
  when: >-
    prom_exp_pihole_installed.content is not defined
    or (prom_exp_pihole_installed.content | b64decode | trim) != prometheus_exporters_pihole_exporter_version
  block:
    - name: Download Pi-hole Exporter checksum
      ansible.builtin.get_url:
        url: "{{ prometheus_exporters_pihole_exporter_checksum_url }}"
        dest: "/tmp/pihole_exporter_checksum.txt"
        force: true
        mode: "0644"
        timeout: 30
      register: prom_exp_pihole_exporter_checksum_download
      retries: 3
      delay: 5
      until: prom_exp_pihole_exporter_checksum_download is succeeded

    - name: Extract expected Pi-hole Exporter checksum
      ansible.builtin.shell: |
        set -o pipefail
        grep "pihole_exporter-linux-{{ prometheus_exporters_pihole_arch }}" \
          /tmp/pihole_exporter_checksum.txt | cut -d' ' -f1
      register: prom_exp_pihole_expected_checksum
      changed_when: false

    - name: Download Pi-hole Exporter binary
      ansible.builtin.get_url:
        url: "{{ prometheus_exporters_pihole_exporter_binary_url }}"
        dest: "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter"
        owner: "{{ prometheus_exporters_user }}"
        group: "{{ prometheus_exporters_group }}"
        mode: "0755"
        checksum: "sha256:{{ prom_exp_pihole_expected_checksum.stdout }}"
        timeout: 60
      become: true
      register: prom_exp_pihole_exporter_download
      retries: 3
      delay: 5
      until: prom_exp_pihole_exporter_download is succeeded
      notify: Restart pihole-exporter

    - name: Clean up Pi-hole Exporter checksum file
      ansible.builtin.file:
        path: "/tmp/pihole_exporter_checksum.txt"
        state: absent

    - name: Record the installed Pi-hole Exporter version
      ansible.builtin.copy:
        content: "{{ prometheus_exporters_pihole_exporter_version }}\n"
        dest: "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter.version"
        owner: "{{ prometheus_exporters_user }}"
        group: "{{ prometheus_exporters_group }}"
        mode: "0644"
      become: true

- name: Sync the Pi-hole admin password to the vault
  # The dns play runs after this one.
  # Without the sync, a rotated password would fail the verification below before the dns role could apply it.
  ansible.builtin.include_role:
    name: common
    tasks_from: pihole_password_sync

- name: Install the Pi-hole Exporter unit
  ansible.builtin.include_tasks: pihole_exporter_unit.yml

- name: Restart the exporter so it logs in with the synced password
  ansible.builtin.systemd:
    name: pihole-exporter
    state: restarted
  become: true
  when: common_pihole_password_synced

- name: Flush pending handlers before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify the Pi-hole Exporter
  # Before Pi-hole is installed FTL is not running; the dns role's post-deploy check verifies it then.
  ansible.builtin.include_tasks: pihole_exporter_verify.yml
  when: prom_exp_ftl_active.stdout == 'active'
