---
- name: Prepare prometheus-exporters default
  hosts: all
  become: true
  tasks:
    # A host that ran Debian's exporter before this role: the package's account has another home and its
    # running process holds it, which is what made usermod fail on supervisor-wyse.
    - name: Install and start the distribution's node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        install_recommends: false
        update_cache: true

    - name: Make sure the distribution's exporter is running
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: started
