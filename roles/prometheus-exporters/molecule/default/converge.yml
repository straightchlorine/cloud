---
- name: Converge - Default (Core Role Logic)
  hosts: all
  vars:
    # Global exporter configuration
    prometheus_exporters_enabled: true
    prometheus_exporters_user: "prometheus"
    prometheus_exporters_group: "prometheus"
    prometheus_exporters_base_dir: "/opt/prometheus-exporters"
    prometheus_exporters_config_dir: "/etc/prometheus/exporters"

    # Node Exporter configuration
    prometheus_exporters_node_exporter_enabled: true
    prometheus_exporters_node_exporter_port: 9100
    prometheus_exporters_node_exporter_textfile_dir: "/opt/prometheus-exporters/textfiles"

    # Pi-specific hardware metrics
    pi_hardware_metrics_enabled: false

    # Optional exporters disabled for base test
    prometheus_exporters_pihole_exporter_enabled: false
    prometheus_exporters_docker_exporter_enabled: false
    prometheus_exporters_pihole_exporter_port: 9617
    # Referenced by pihole_exporter_teardown.yml's ufw delete, which must mirror
    # the src-restricted rule firewall.yml adds on a real host.
    prometheus_exporters_firewall_source: "192.168.0.0/16"

  tasks:
    - name: Note about molecule test limitations
      ansible.builtin.debug:
        msg: |
          Running simplified test of prometheus-exporters role core logic
          Note: Common role dependencies not available in molecule
          Testing only: user/group creation, directory structure, permissions

    - name: Create prometheus group
      ansible.builtin.group:
        name: "{{ prometheus_exporters_group }}"
        system: true
        state: present
      become: true

    - name: Create prometheus user
      ansible.builtin.user:
        name: "{{ prometheus_exporters_user }}"
        group: "{{ prometheus_exporters_group }}"
        system: true
        shell: /bin/false
        home: "{{ prometheus_exporters_base_dir }}"
        createhome: false
      become: true

    - name: Create Prometheus exporters directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ prometheus_exporters_user }}"
        group: "{{ prometheus_exporters_group }}"
        mode: '0755'
      become: true
      loop:
        - "{{ prometheus_exporters_base_dir }}"
        - "{{ prometheus_exporters_base_dir }}/bin"
        - "{{ prometheus_exporters_base_dir }}/scripts"
        - "{{ prometheus_exporters_base_dir }}/logs"
        - "{{ prometheus_exporters_config_dir }}"
        - "{{ prometheus_exporters_node_exporter_textfile_dir }}"

    - name: Create systemd service template directory
      ansible.builtin.file:
        path: /etc/systemd/system
        state: directory
        mode: '0755'
      become: true

    - name: Create node exporter configuration placeholder
      ansible.builtin.copy:
        content: |
          # Node Exporter configuration placeholder for molecule test
          # Actual configuration deployed by the full role
          ARGS=""
        dest: "{{ prometheus_exporters_config_dir }}/node_exporter.conf"
        owner: "{{ prometheus_exporters_user }}"
        group: "{{ prometheus_exporters_group }}"
        mode: '0644'
      become: true
      when: prometheus_exporters_node_exporter_enabled

    # Simulate a prior Pi-hole Exporter install so pihole_exporter_teardown.yml
    # (below) has real artifacts to remove, instead of a no-op on empty paths.
    # Tagged molecule-idempotence-notest: create-then-delete is legitimately
    # non-idempotent as a fixture cycle, so skip it on molecule's 2nd (idempotence) run.
    - name: Create fake Pi-hole Exporter artifacts to exercise teardown
      ansible.builtin.copy:
        content: "fake binary for molecule test\n"
        dest: "{{ item }}"
        mode: "0755"
      become: true
      loop:
        - "{{ prometheus_exporters_base_dir }}/bin/pihole_exporter"
        - "{{ prometheus_exporters_config_dir }}/pihole-exporter.conf"
      tags: [molecule-idempotence-notest]

    - name: Create fake Pi-hole Exporter systemd unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Pi-hole Exporter (molecule test fixture)
          [Service]
          ExecStart=/bin/true
        dest: /etc/systemd/system/pihole-exporter.service
        mode: "0644"
      become: true
      tags: [molecule-idempotence-notest]

    # include_role: name: prometheus-exporters doesn't resolve here (no
    # cross-role roles_path in molecule's sandbox), so include_tasks by
    # explicit relative path instead - same trick the dns role's tests use.
    - name: Run pihole_exporter_teardown.yml against the fake artifacts
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/pihole_exporter_teardown.yml"
      tags: [molecule-idempotence-notest]
