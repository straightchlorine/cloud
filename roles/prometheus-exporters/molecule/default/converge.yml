---
- name: Converge prometheus-exporters default
  hosts: all
  become: true
  vars:
    # pihole_exporter_teardown.yml deletes the ufw rule this source produces.
    prometheus_exporters_firewall_source: "192.168.0.0/16"
  tasks:
    # Binary downloads and service starts cannot run in a container.
    # The site play applies common first; the unit template reads its defaults and the tasks notify its handlers.
    - name: Load the common role as the site play does
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts
        public: true

    - name: Run common_setup
      ansible.builtin.include_role:
        name: prometheus-exporters
        tasks_from: common_setup

    # The container has no vcgencmd; the collector must still write its other series.
    - name: Set up the Pi hardware metrics collector
      ansible.builtin.include_role:
        name: prometheus-exporters
        tasks_from: pi_hardware_metrics

    # One-shot arrange steps; the teardown skips silently without teardown_confirmed.
    - name: Install and tear down fake Pi-hole exporter artifacts
      tags: [molecule-idempotence-notest]
      block:
        - name: Create fake Pi-hole exporter files
          ansible.builtin.copy:
            content: "fake binary\n"
            dest: "{{ item }}"
            mode: "0755"
          loop:
            - /opt/prometheus-exporters/bin/pihole_exporter
            - /opt/prometheus-exporters/bin/pihole_exporter.version
            - /etc/prometheus/exporters/pihole-exporter.conf

        - name: Create fake Pi-hole exporter unit
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Pi-hole Exporter fixture
              [Service]
              ExecStart=/bin/true
            dest: /etc/systemd/system/pihole-exporter.service
            mode: "0644"

        - name: Run pihole_exporter_teardown
          ansible.builtin.include_role:
            name: prometheus-exporters
            tasks_from: pihole_exporter_teardown
          vars:
            teardown_confirmed: true
