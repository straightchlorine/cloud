---
- name: Verify prometheus-exporters default
  hosts: all
  become: true
  tasks:
    - name: Look up the prometheus account
      ansible.builtin.getent:
        database: "{{ item }}"
        key: prometheus
      loop: [passwd, group]
      register: prom_exp_accounts

    - name: Assert the prometheus user and group are system accounts
      ansible.builtin.assert:
        that:
          - prom_exp_accounts.results[0].ansible_facts.getent_passwd.prometheus[1] | int < 1000
          - prom_exp_accounts.results[1].ansible_facts.getent_group.prometheus is defined

    - name: Check deployed paths
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        prom_dir: { state: directory, mode: "0755", owner: prometheus, group: prometheus }
        prom_dirs:
          - /opt/prometheus-exporters
          - /opt/prometheus-exporters/bin
          - /opt/prometheus-exporters/scripts
          - /opt/prometheus-exporters/logs
          - /opt/prometheus-exporters/textfiles
          - /etc/prometheus/exporters
        prom_absent:
          - /opt/prometheus-exporters/bin/pihole_exporter
          - /opt/prometheus-exporters/bin/pihole_exporter.version
          - /etc/prometheus/exporters/pihole-exporter.conf
          - /etc/systemd/system/pihole-exporter.service
          - /tmp/pihole_exporter_checksum.txt
        molecule_paths: >-
          {{ prom_dirs | map('community.general.dict_kv', 'path') | map('combine', prom_dir) | list
             + [{'path': '/etc/logrotate.d/prometheus-exporters', 'state': 'file'}]
             + prom_absent | map('community.general.dict_kv', 'path') | map('combine', {'state': 'absent'}) | list }}

    - name: Read the logrotate config
      ansible.builtin.slurp:
        src: /etc/logrotate.d/prometheus-exporters
      register: prom_exp_logrotate_conf

    - name: Assert the logrotate config covers the exporter logs
      vars:
        logrotate_conf: "{{ prom_exp_logrotate_conf.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/opt/prometheus-exporters/logs/*.log' in logrotate_conf"
          - "'rotate 14' in logrotate_conf"
        fail_msg: "logrotate config wrong: {{ logrotate_conf }}"

    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert the exporter runtime packages are installed
      ansible.builtin.assert:
        that:
          - "'curl' in ansible_facts.packages"
          - "'jq' in ansible_facts.packages"

    - name: Run the hardware collector as its unit does
      ansible.builtin.command: systemctl start pi-hardware-metrics.service
      changed_when: false

    - name: Read the collector output and the kernel's ext4 error counts
      ansible.builtin.shell: |
        cat /opt/prometheus-exporters/textfiles/pi_hardware.prom
        echo ---
        for f in /sys/fs/ext4/*/errors_count; do [ -r "$f" ] && echo "$f $(cat "$f")"; done
        true
      register: prom_exp_hw
      changed_when: false

    - name: Assert the collector runs without vcgencmd and reports one error series per ext4 filesystem
      vars:
        prom: "{{ (prom_exp_hw.stdout.split('---')[0]).splitlines() }}"
        kernel: "{{ (prom_exp_hw.stdout.split('---')[1] | trim).splitlines() }}"
      ansible.builtin.assert:
        that:
          - >-
            'hw_metrics_source_up{source="vcgencmd"} 0' in prom
          - >-
            '# TYPE hw_filesystem_errors gauge' in prom
          - prom | select('match', 'hw_filesystem_errors[{]') | list | length == kernel | length
        fail_msg: "collector: {{ prom }} kernel: {{ kernel }}"
        quiet: true

    - name: Assert each series carries the kernel's count
      vars:
        prom: "{{ (prom_exp_hw.stdout.split('---')[0]).splitlines() }}"
        kernel: "{{ (prom_exp_hw.stdout.split('---')[1] | trim).splitlines() }}"
        want: >-
          {{ 'hw_filesystem_errors{device="' ~ item.split('/')[4] ~ '"} ' ~ item.split(' ')[1] }}
      ansible.builtin.assert:
        that: want in prom
        fail_msg: "missing {{ want }} in {{ prom }}"
        quiet: true
      loop: "{{ kernel }}"

    - name: Read the installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Look up the account's home and shell
      ansible.builtin.getent:
        database: passwd
        key: prometheus

    # prepare.yml installed Debian's exporter, whose account has another home and whose process held it.
    - name: Assert the distribution's exporter is gone and the account is the role's
      ansible.builtin.assert:
        that:
          - "'prometheus-node-exporter' not in ansible_facts.packages"
          - ansible_facts.getent_passwd.prometheus[4] == '/opt/prometheus-exporters'
          - ansible_facts.getent_passwd.prometheus[5] == '/bin/false'
        fail_msg: >-
          package present: {{ 'prometheus-node-exporter' in ansible_facts.packages }},
          account: {{ ansible_facts.getent_passwd.prometheus }}
        quiet: true

    - name: Install a stand-in for one of the role's own exporters
      ansible.builtin.copy:
        content: "#!/bin/sh\nexec sleep 600\n"
        dest: /opt/prometheus-exporters/bin/molecule-own-exporter
        mode: "0755"

    - name: Run the stand-in as the exporters account
      ansible.builtin.command:
        argv: [systemd-run, --unit=molecule-own-exporter, --uid=prometheus,
               /opt/prometheus-exporters/bin/molecule-own-exporter]
      changed_when: true

    - name: Accept the role's own process
      ansible.builtin.include_role:
        name: prometheus-exporters
        tasks_from: foreign_exporters

    - name: Run a process the role did not install as the exporters account
      ansible.builtin.command:
        argv: [systemd-run, --unit=molecule-foreign-exporter, --uid=prometheus, /bin/sleep, "600"]
      changed_when: true

    - name: Refuse the process the role did not install
      block:
        - name: Run the foreign-exporter check
          ansible.builtin.include_role:
            name: prometheus-exporters
            tasks_from: foreign_exporters

        - name: Fail when the foreign process was accepted
          ansible.builtin.fail:
            msg: the foreign-exporter check accepted a process the role did not install
      rescue:
        - name: Assert it named the foreign process and only that one
          ansible.builtin.assert:
            that:
              - "ansible_failed_result.msg is search('prometheus runs processes this role did not install')"
              - "ansible_failed_result.msg is search('/bin/sleep 600')"
              - "ansible_failed_result.msg is not search('molecule-own-exporter')"
            fail_msg: "failed for another reason: {{ ansible_failed_result.msg }}"
            quiet: true
      always:
        - name: Stop the stand-in processes
          ansible.builtin.command:
            argv: [systemctl, stop, molecule-foreign-exporter.service, molecule-own-exporter.service]
          changed_when: true
