---
- name: Verify prometheus-exporters default
  hosts: all
  become: true
  tasks:
    - name: Look up the prometheus account
      ansible.builtin.getent:
        database: "{{ item }}"
        key: prometheus
      loop: [passwd, group]
      register: prom_exp_accounts

    - name: Assert the prometheus user and group are system accounts
      ansible.builtin.assert:
        that:
          - prom_exp_accounts.results[0].ansible_facts.getent_passwd.prometheus[1] | int < 1000
          - prom_exp_accounts.results[1].ansible_facts.getent_group.prometheus is defined

    - name: Check deployed paths
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        prom_dir: { state: directory, mode: "0755", owner: prometheus, group: prometheus }
        prom_dirs:
          - /opt/prometheus-exporters
          - /opt/prometheus-exporters/bin
          - /opt/prometheus-exporters/scripts
          - /opt/prometheus-exporters/logs
          - /opt/prometheus-exporters/textfiles
          - /etc/prometheus/exporters
        prom_absent:
          - /opt/prometheus-exporters/bin/pihole_exporter
          - /opt/prometheus-exporters/bin/pihole_exporter.version
          - /etc/prometheus/exporters/pihole-exporter.conf
          - /etc/systemd/system/pihole-exporter.service
          - /tmp/pihole_exporter_checksum.txt
        molecule_paths: >-
          {{ prom_dirs | map('community.general.dict_kv', 'path') | map('combine', prom_dir) | list
             + [{'path': '/etc/logrotate.d/prometheus-exporters', 'state': 'file'}]
             + prom_absent | map('community.general.dict_kv', 'path') | map('combine', {'state': 'absent'}) | list }}

    - name: Read the logrotate config
      ansible.builtin.slurp:
        src: /etc/logrotate.d/prometheus-exporters
      register: prom_exp_logrotate_conf

    - name: Assert the logrotate config covers the exporter logs
      vars:
        logrotate_conf: "{{ prom_exp_logrotate_conf.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/opt/prometheus-exporters/logs/*.log' in logrotate_conf"
          - "'rotate 14' in logrotate_conf"
        fail_msg: "logrotate config wrong: {{ logrotate_conf }}"

    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert the exporter runtime packages are installed
      ansible.builtin.assert:
        that:
          - "'curl' in ansible_facts.packages"
          - "'jq' in ansible_facts.packages"
