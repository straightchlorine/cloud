---
- name: Converge - Fail-Fast Validation
  hosts: all
  vars:
    # Intentionally omit ALL required variables:
    # - prometheus_exporters_enabled
    # - prometheus_exporters_base_dir
    # - node_exporter_enabled
    # - prometheus_environment
    # - prometheus_role
    # - device_type
    # This tests that the role validation fails gracefully with clear error messages
  tasks:
    - name: Include prometheus-exporters validation (expect to fail)
      block:
        - name: Try to include prometheus-exporters validation without required variables
          ansible.builtin.include_tasks: ../../tasks/validate.yml
      rescue:
        - name: Capture expected validation failure
          ansible.builtin.set_fact:
            validation_failed: true
            validation_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Display validation failure message
          ansible.builtin.debug:
            msg: |
              [OK] Validation correctly failed (expected behavior)
              Error: {{ validation_error }}
