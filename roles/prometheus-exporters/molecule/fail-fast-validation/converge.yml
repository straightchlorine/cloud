---
- name: Converge prometheus-exporters fail-fast-validation
  hosts: all
  vars_files: [cases.yml]
  tasks:
    - name: Run cases
      ansible.builtin.include_tasks: "{{ molecule_case.file }}"
      vars:
        molecule_case: "{{ molecule_case_defaults | combine(molecule_item) }}"
      loop: "{{ molecule_cases }}"
      loop_control:
        loop_var: molecule_item
        label: "{{ molecule_item.id }}"
