---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: test
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # Molecule runs from the role directory, so MOLECULE_PROJECT_DIRECTORY is roles/prometheus-exporters.
    # Its parent is roles/, which lets the include_role of common in validate.yml resolve.
    # Without that, the include_role itself would error.
    # A scenario that accepts any failure would then pass for the wrong reason.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
