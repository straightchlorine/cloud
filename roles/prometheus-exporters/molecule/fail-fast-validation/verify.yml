---
- name: Verify fail-fast validation worked
  hosts: all
  tasks:
    - name: Confirm fail-fast-validation test completed
      ansible.builtin.debug:
        msg: |
          [OK] Fail-fast validation scenario verified

          Note: Validation correctly failed in converge step
          when required variables were missing

          This confirms the fail-fast principle works as designed

    - name: Display fail-fast validation verification
      ansible.builtin.debug:
        msg: |
          [OK] Fail-Fast Validation Test Complete

          Test Scenario: Missing required variables
          - prometheus_exporters_enabled: NOT SET (required)
          - prometheus_exporters_base_dir: NOT SET (required)
          - node_exporter_enabled: NOT SET (required)
          - prometheus_environment: NOT SET (required)
          - prometheus_role: NOT SET (required)
          - device_type: NOT SET (required)

          Result: Role validation correctly failed in converge step
          This confirms the "fail-fast" principle:
          Role fails immediately with clear error when required variables missing
