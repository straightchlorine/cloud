---
- name: Verify fail-fast validation worked
  hosts: all
  become: true
  tasks:
    - name: Stat the marker file converge wrote
      # Converge and verify run as separate processes, so the case result is
      # a file, not a set_fact - see converge.yml.
      ansible.builtin.stat:
        path: /tmp/molecule-promexp-validation.passed
      register: prom_exp_failfast_marker

    - name: Assert the expected validation failure was recorded
      ansible.builtin.assert:
        that:
          - prom_exp_failfast_marker.stat.exists
        fail_msg: >-
          validate.yml should have failed fast on the missing required
          variables (prometheus_exporters_enabled, base_dir,
          node_exporter_enabled, prometheus_environment, prometheus_role,
          device_type) - and converge should have proven the failure was
          that validation, not an include error.
        success_msg: "[OK] validate.yml fails fast on missing required variables"
