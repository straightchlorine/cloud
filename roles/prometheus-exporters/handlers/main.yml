---
# The "Reload systemd" handler that the tasks notify lives in roles/common/handlers/main.yml.
# It only works here because the common handlers are already loaded into the same play of playbooks/site.yml.

- name: Restart node-exporter
  ansible.builtin.systemd:
    name: node-exporter
    state: restarted
  become: true
  when: prometheus_exporters_node_exporter_enabled

- name: Restart pihole-exporter
  ansible.builtin.systemd:
    name: pihole-exporter
    state: restarted
  become: true
  when: prometheus_exporters_pihole_exporter_enabled

- name: Restart pi-hardware-metrics
  ansible.builtin.systemd:
    name: pi-hardware-metrics.service
    state: restarted
  become: true
  when: prometheus_exporters_pi_hardware_metrics_enabled

- name: Restart pi-hardware-metrics-timer
  ansible.builtin.systemd:
    name: pi-hardware-metrics.timer
    state: restarted
    enabled: true
  become: true
  when: prometheus_exporters_pi_hardware_metrics_enabled
