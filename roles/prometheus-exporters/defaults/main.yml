---
prometheus_exporters_enabled: true
prometheus_exporters_user: "prometheus"
prometheus_exporters_group: "prometheus"
prometheus_exporters_base_dir: "/opt/prometheus-exporters"
prometheus_exporters_config_dir: "/etc/prometheus/exporters"

prometheus_exporters_node_exporter_enabled: true
prometheus_exporters_node_exporter_version: "1.12.1"
prometheus_exporters_node_exporter_port: 9100
prometheus_exporters_node_exporter_install_method: "binary" # 'binary' or 'package'
# The distribution's node exporter, purged before a binary install: it binds the same port and its processes hold
# the prometheus account, which usermod cannot change while they run.
prometheus_exporters_distro_node_exporter_packages:
  - prometheus-node-exporter
  - prometheus-node-exporter-collectors
prometheus_exporters_node_exporter_binary_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{
  prometheus_exporters_node_exporter_version }}/node_exporter-{{
  prometheus_exporters_node_exporter_version }}.linux-{{
  os_arch_download }}.tar.gz
prometheus_exporters_node_exporter_checksum_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{
  prometheus_exporters_node_exporter_version }}/sha256sums.txt

prometheus_exporters_node_exporter_enabled_collectors:
  - systemd
  - textfile
  - filesystem
  - cpu
  - meminfo
  - loadavg
  - diskstats
  - netdev
  - netstat
  - stat
  - time
  - uname
  - vmstat

prometheus_exporters_node_exporter_textfile_dir: "{{ prometheus_exporters_base_dir }}/textfiles"
prometheus_exporters_pi_hardware_metrics_enabled: true
prometheus_exporters_pi_hardware_metrics_script: "{{ prometheus_exporters_base_dir }}/scripts/pi_hardware_metrics.sh"
prometheus_exporters_pi_hardware_metrics_interval: 60 # seconds

prometheus_exporters_pihole_exporter_enabled: false # Enable only on DNS hosts
prometheus_exporters_pihole_exporter_version: "v1.2.0"
prometheus_exporters_pihole_exporter_port: 9617

# eko/pihole-exporter publishes one "linux-arm" binary for every ARM architecture, plus "linux-amd64".
# The os role's armv7 or arm64 download suffix would therefore build a URL that returns 404.
prometheus_exporters_pihole_arch: "{{ 'arm' if os_is_arm else os_arch_download }}"

prometheus_exporters_pihole_exporter_binary_url: >-
  https://github.com/eko/pihole-exporter/releases/download/{{
  prometheus_exporters_pihole_exporter_version }}/pihole_exporter-linux-{{
  prometheus_exporters_pihole_arch }}
prometheus_exporters_pihole_exporter_checksum_url: >-
  https://github.com/eko/pihole-exporter/releases/download/{{
  prometheus_exporters_pihole_exporter_version }}/pihole_exporter-linux-{{
  prometheus_exporters_pihole_arch }}.sha256.txt
# prometheus_exporters_pihole_exporter_target_host has no default and must be set in host_vars.
prometheus_exporters_pihole_exporter_target_port: 80

# The service discovery labels prometheus_environment, prometheus_role and device_type have no defaults.
# Every host must set them in host_vars.

prometheus_exporters_ufw_enabled: true
# prometheus_server_ip has no default, so that no address is opened by accident, and must be set in host_vars.

prometheus_exporters_health_check_enabled: true
# The Pi-hole exporter /metrics answers only after a full scrape of several API calls.
# That scrape can take a while on weaker hosts.
prometheus_exporters_health_check_timeout: 30
# Limit for each Pi-hole API request the exporter makes.
# A short limit makes scrapes fail whenever FTL is briefly slow.
prometheus_exporters_pihole_exporter_api_timeout: "15s"
