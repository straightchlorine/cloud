---
role_name_check: 0
driver:
  name: podman
platforms:
  - name: debian12-board
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
provisioner:
  name: ansible
  env:
    # Molecule runs from roles/common, so the parent dir is roles/ and
    # `include_role: name: common` resolves by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  name: board-tuning
