---
- name: Verify common board-tuning
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert the tuning artifacts are deployed
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - {path: /usr/local/bin/wifi-powersave-off, state: file, mode: "0755", owner: root}
          - {path: /etc/systemd/system/wifi-powersave.service, state: file}
          - {path: /etc/default/zramswap, state: file, mode: "0644", owner: root, group: root}

    - name: Read the script and the zram config
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: common_tuning_contents
      loop:
        - /usr/local/bin/wifi-powersave-off
        - /etc/default/zramswap
      loop_control:
        label: "{{ item }}"

    - name: Assert the script disables power save on wireless only
      # The wireless discovery is what makes the unit a no-op on wired hosts.
      vars:
        script: "{{ common_tuning_contents.results[0].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/sys/class/net/*/wireless' in script"
          - "'set power_save off' in script"
        fail_msg: "wifi-powersave-off lacks the discovery or the iw call: {{ script }}"
        quiet: true

    - name: Assert the zram config renders the default algorithm, share and priority
      vars:
        config: "{{ common_tuning_contents.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ALGO=zstd' in config"
          - "'PERCENT=50' in config"
          - "'PRIORITY=100' in config"
        fail_msg: "zramswap.j2 rendered wrong: {{ config }}"
        quiet: true

    - name: Read the Wi-Fi unit state
      ansible.builtin.systemd:
        name: wifi-powersave
      register: common_tuning_unit

    - name: Assert the unit is active and enabled
      ansible.builtin.assert:
        that:
          - common_tuning_unit.status.ActiveState == 'active'
          - common_tuning_unit.status.UnitFileState == 'enabled'
        fail_msg: >-
          wifi-powersave is {{ common_tuning_unit.status.ActiveState }} / {{ common_tuning_unit.status.UnitFileState }}
        quiet: true

    - name: Read the firmware config
      ansible.builtin.slurp:
        src: /boot/firmware/config.txt
      register: common_config_txt

    - name: Assert the headless settings sit before the first board filter, the rest untouched
      vars:
        lines: "{{ (common_config_txt.content | b64decode).splitlines() }}"
        global_lines: "{{ lines[:lines.index('[cm4]')] }}"
      ansible.builtin.assert:
        that:
          - lines | select('match', 'dtoverlay=vc4') | list | length == 0
          - "'camera_auto_detect=0' in global_lines"
          - "'display_auto_detect=0' in global_lines"
          - "'dtparam=audio=off' in global_lines"
          - "'gpu_mem=16' in global_lines"
          - "'arm_64bit=1' in global_lines"
          - lines[lines.index('[cm5]') + 1] == 'dtoverlay=dwc2,dr_mode=host'
          - lines[-1] == '[all]'
        fail_msg: "{{ lines }}"
        quiet: true

    - name: Assert the change requested a reboot
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - {path: /var/run/reboot-required, state: file}

    - name: Read the rpi-swap drop-in
      ansible.builtin.slurp:
        src: /etc/rpi/swap.conf.d/50-ansible.conf
      register: common_rpi_swap_dropin

    - name: Assert rpi-swap runs zram only, at half the RAM
      ansible.builtin.assert:
        that: >-
          (common_rpi_swap_dropin.content | b64decode).splitlines()
          == ['[Main]', 'Mechanism=zram', '', '[Zram]', 'RamMultiplier=0.5']
        fail_msg: "{{ common_rpi_swap_dropin.content | b64decode }}"
        quiet: true

    - name: Look for zram-tools
      ansible.builtin.command: dpkg-query -W -f=${Status} zram-tools
      register: common_zram_tools_status
      changed_when: false
      failed_when: false

    - name: Assert zram-tools is not installed next to rpi-swap
      ansible.builtin.assert:
        that: common_zram_tools_status.stdout is not search('install ok installed')
        fail_msg: "zram-tools: {{ common_zram_tools_status.stdout }}"
        quiet: true
