---
- name: Verify common board-tuning
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert the tuning artifacts are deployed
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - {path: /usr/local/bin/wifi-powersave-off, state: file, mode: "0755", owner: root}
          - {path: /etc/systemd/system/wifi-powersave.service, state: file}
          - {path: /etc/default/zramswap, state: file, mode: "0644", owner: root, group: root}

    - name: Read the script and the zram config
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: common_tuning_contents
      loop:
        - /usr/local/bin/wifi-powersave-off
        - /etc/default/zramswap
      loop_control:
        label: "{{ item }}"

    - name: Assert the script disables power save on wireless only
      # The wireless discovery is what makes the unit a no-op on wired hosts.
      vars:
        script: "{{ common_tuning_contents.results[0].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/sys/class/net/*/wireless' in script"
          - "'set power_save off' in script"
        fail_msg: "wifi-powersave-off lacks the discovery or the iw call: {{ script }}"
        quiet: true

    - name: Assert the zram config renders the default algorithm, share and priority
      vars:
        config: "{{ common_tuning_contents.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ALGO=zstd' in config"
          - "'PERCENT=50' in config"
          - "'PRIORITY=100' in config"
        fail_msg: "zramswap.j2 rendered wrong: {{ config }}"
        quiet: true

    - name: Read the Wi-Fi unit state
      ansible.builtin.systemd:
        name: wifi-powersave
      register: common_tuning_unit

    - name: Assert the unit is active and enabled
      ansible.builtin.assert:
        that:
          - common_tuning_unit.status.ActiveState == 'active'
          - common_tuning_unit.status.UnitFileState == 'enabled'
        fail_msg: >-
          wifi-powersave is {{ common_tuning_unit.status.ActiveState }} / {{ common_tuning_unit.status.UnitFileState }}
        quiet: true
