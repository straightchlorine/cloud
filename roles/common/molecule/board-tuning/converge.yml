---
- name: Converge common board-tuning
  hosts: all
  vars:
    common_wifi_powersave_tuning_enabled: true
  pre_tasks:
    # The image ships with empty apt lists, so the role's `apt: name=iw` would fail.
    - name: Warm the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
  tasks:
    # A container has no wireless interface; the script must exit 0 as on a wired host.
    - name: Set up Wi-Fi power save
      ansible.builtin.include_role:
        name: common
        tasks_from: wifi_powersave

    # zram.yml itself needs kernel modules a container lacks, so only its config render runs.
    - name: Strip the display stack
      ansible.builtin.include_role:
        name: common
        tasks_from: rpi_headless

    - name: Render the zram-tools config
      ansible.builtin.include_role:
        name: common
        tasks_from: zram_config

    # prepare.yml installs rpi-swap's config, so zram.yml takes its rpi-swap branch, which needs no kernel module.
    - name: Configure zram swap
      ansible.builtin.include_role:
        name: common
        tasks_from: zram
