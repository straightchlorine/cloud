---
- name: Verify - the helper's delivery, strict mode and key handling
  hosts: all
  become: true
  tasks:
    - name: Install the stub ntfy server
      # The status code comes from /tmp/ntfy-stub-code so each case sets it;
      # every request is recorded for the header and body assertions.
      ansible.builtin.copy:
        dest: /tmp/ntfy-stub.py
        mode: "0644"
        content: |
          import http.server
          import pathlib

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0))).decode()
                  names = ('Authorization', 'Title', 'Priority', 'Tags')
                  fields = [self.path] + [self.headers.get(h, '') for h in names]
                  pathlib.Path('/tmp/ntfy-stub.log').write_text('\n'.join(fields + [body]))
                  code = int(pathlib.Path('/tmp/ntfy-stub-code').read_text())
                  self.send_response(code)
                  if code == 302:
                      self.send_header('Location', '/elsewhere')
                  self.end_headers()

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(('127.0.0.1', 8099), Handler).serve_forever()

    - name: Start the stub server
      ansible.builtin.shell: |
        echo 200 > /tmp/ntfy-stub-code
        nohup python3 /tmp/ntfy-stub.py > /tmp/ntfy-stub.out 2>&1 &
      changed_when: true

    - name: Wait for the stub server
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8099
        timeout: 30

    - name: Send through the helper for each stub status, with and without NTFY_STRICT
      # The body carries a quote and a dollar sign: --data-raw must pass both through.
      ansible.builtin.shell: |
        echo {{ item.code }} > /tmp/ntfy-stub-code
        {{ item.env }} /usr/local/bin/ntfy-notify 'The title' 'body "quoted" $HOME' high rotating_light
      environment:
        HOME: /root
      register: molecule_sends
      loop:
        - { code: 200, env: "", label: "200 lenient" }
        - { code: 200, env: "NTFY_STRICT=1", label: "200 strict" }
        - { code: 302, env: "", label: "302 lenient" }
        - { code: 302, env: "NTFY_STRICT=1", label: "302 strict" }
        - { code: 500, env: "", label: "500 lenient" }
        - { code: 500, env: "NTFY_STRICT=1", label: "500 strict" }
      loop_control:
        label: "{{ item.label }}"
      changed_when: false
      failed_when: false

    - name: Read the last request the stub recorded for a 200
      ansible.builtin.shell: |
        echo 200 > /tmp/ntfy-stub-code
        /usr/local/bin/ntfy-notify 'The title' 'body "quoted" $HOME' high rotating_light
        cat /tmp/ntfy-stub.log
      register: molecule_request
      changed_when: false

    - name: Assert only a 2xx counts as delivered under NTFY_STRICT
      vars:
        molecule_rc: "{{ molecule_sends.results | map(attribute='rc') | list }}"
      ansible.builtin.assert:
        that:
          - molecule_rc == [0, 0, 0, 1, 0, 1]
          - "'delivery failed (HTTP 302)' in molecule_sends.results[3].stderr"
          - "'delivery failed (HTTP 500)' in molecule_sends.results[5].stderr"
          - molecule_sends.results[2].stderr == ''

    - name: Assert the request carried the bearer token, the headers and the body verbatim
      ansible.builtin.assert:
        that:
          - molecule_request.stdout_lines[0] == '/molecule-test'
          - molecule_request.stdout_lines[1] == 'Bearer molecule-test-ntfy-key'
          - molecule_request.stdout_lines[2] == 'The title'
          - molecule_request.stdout_lines[3] == 'high'
          - molecule_request.stdout_lines[4] == 'rotating_light'
          - molecule_request.stdout_lines[5] == 'body "quoted" $HOME'

    - name: Hide the key file
      ansible.builtin.command: mv /etc/ntfy/notify-api-key /etc/ntfy/notify-api-key.away
      changed_when: true

    - name: Send without a key, with and without NTFY_STRICT
      ansible.builtin.shell: "{{ item }} /usr/local/bin/ntfy-notify 'The title' 'body'"
      register: molecule_nokey
      loop: ["", "NTFY_STRICT=1"]
      changed_when: false
      failed_when: false

    - name: Restore the key file
      ansible.builtin.command: mv /etc/ntfy/notify-api-key.away /etc/ntfy/notify-api-key
      changed_when: true

    - name: Assert a missing key is a no-op normally and a failure under NTFY_STRICT
      ansible.builtin.assert:
        that:
          - molecule_nokey.results[0].rc == 0
          - molecule_nokey.results[0].stderr == ''
          - molecule_nokey.results[1].rc == 1
          - "'cannot read /etc/ntfy/notify-api-key' in molecule_nokey.results[1].stderr"

    - name: Stop the stub server
      ansible.builtin.command: pkill -f /tmp/ntfy-stub.py
      changed_when: true
