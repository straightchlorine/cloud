---
- name: Converge common ntfy-notify
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  vars:
    ntfy_server_url: "http://127.0.0.1:8099"
  pre_tasks:
    - name: Install curl, which the image lacks
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600
  tasks:
    - name: Install the ntfy helper
      ansible.builtin.include_role:
        name: common
        tasks_from: ntfy_install
