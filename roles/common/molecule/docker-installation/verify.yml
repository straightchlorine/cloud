---
- name: Verify Docker installation
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Check Docker is installed
      ansible.builtin.command: docker --version
      register: common_docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "Docker version: {{ common_docker_version.stdout }}"

    - name: Verify Docker daemon is running
      ansible.builtin.systemd:
        name: docker
      register: common_docker_service

    - name: Assert Docker service is active
      ansible.builtin.assert:
        that:
          - common_docker_service.status.ActiveState == "active"
        fail_msg: "Docker service is not active: {{ common_docker_service.status.ActiveState }}"

    - name: Check Docker daemon.json exists
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: common_daemon_json

    - name: Assert daemon.json exists
      ansible.builtin.assert:
        that:
          - common_daemon_json.stat.exists
        fail_msg: "/etc/docker/daemon.json does not exist"

    - name: Read daemon.json configuration
      ansible.builtin.slurp:
        path: /etc/docker/daemon.json
      register: common_daemon_config

    - name: Parse Docker daemon configuration
      ansible.builtin.set_fact:
        common_docker_config: "{{ common_daemon_config.content | b64decode | from_json }}"

    - name: Verify user namespace mapping is configured
      ansible.builtin.assert:
        that:
          - common_docker_config.get('userns-remap') == 'default'
        fail_msg: "Docker user namespace mapping not configured. Current config: {{ common_docker_config }}"

    - name: Verify Docker Compose plugin availability
      ansible.builtin.command: docker compose version
      register: common_compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "Docker Compose version: {{ common_compose_version.stdout }}"

    - name: Verify hello-world container runs
      ansible.builtin.command: docker run --rm hello-world
      register: common_hello_output
      changed_when: false

    - name: Display verification summary
      ansible.builtin.debug:
        msg: |
          [OK] Docker Installation Verified:
          - Docker: {{ common_docker_version.stdout }}
          - Compose: {{ common_compose_version.stdout }}
          - Service: Active ({{ common_docker_service.status.ActiveState }})
          - User Namespace: Enabled (userns-remap=default)
          - Hello-world test: PASSED
