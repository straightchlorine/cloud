---
- name: Verify common docker-installation
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Read daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: common_daemon_json

    - name: Assert the user namespace remap is configured
      vars:
        daemon_config: "{{ common_daemon_json.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that: daemon_config['userns-remap'] == 'default'
        fail_msg: "userns-remap missing from daemon.json: {{ daemon_config }}"
        quiet: true

    - name: Read the docker service state
      ansible.builtin.systemd:
        name: docker
      register: common_docker_service

    - name: Assert the docker service is active
      ansible.builtin.assert:
        that: common_docker_service.status.ActiveState == 'active'
        fail_msg: "docker is {{ common_docker_service.status.ActiveState }}"
        quiet: true

    - name: Run docker compose version
      ansible.builtin.command: docker compose version
      changed_when: false
