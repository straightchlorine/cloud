---
platforms:
  # dockerd inside podman needs a privileged container with SYS_ADMIN.
  - name: ${MOLECULE_ROLE}-${MOLECULE_SCENARIO_NAME}
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian13-ansible:latest}
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    capabilities:
      - SYS_ADMIN
    env:
      container: podman
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
provisioner:
  inventory:
    group_vars:
      all:
        # docker.yml adds ansible_user to the docker group, and the podman inventory does not set it.
        ansible_user: root
