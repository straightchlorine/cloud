---
# Molecule configuration for Docker installation testing
# Tests Docker setup with user namespace mapping for security

driver:
  name: docker

platforms:
  - name: debian12-docker
    image: docker.io/geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    # Note: Privileged required for Docker-in-Podman testing
    privileged: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    environment:
      container: podman

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
  inventory:
    group_vars:
      all:
        ansible_user: root
        timezone: UTC
        package_cache_valid_time: 3600

verifier:
  name: ansible

scenario:
  name: docker-installation
  description: Test Docker installation with user namespace mapping (userns-remap)
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - idempotence
    - cleanup
    - destroy
