---
- name: Converge common docker-installation
  hosts: all
  become: true
  pre_tasks:
    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false
  tasks:
    - name: Install Docker
      ansible.builtin.include_role:
        name: common
        tasks_from: docker

    # The scenario connects as root, which bypasses the docker socket's group ownership, so only a non-root
    # re-run can catch a permission failure in docker.yml's smoke test.
    - name: Create the non-root docker test user
      ansible.builtin.user:
        name: docker-probe
        shell: /bin/bash

    # Ansible caches one become session per user. Arming it before the group grant makes docker.yml's
    # smoke test fail if it loses its reset_connection step.
    - name: Arm a stale become session for the test user
      ansible.builtin.command: id
      become_user: docker-probe
      changed_when: false

    - name: Install Docker as the non-root user
      ansible.builtin.include_role:
        name: common
        tasks_from: docker
      vars:
        ansible_user: docker-probe
