---
# Runs the REAL roles/common/tasks/docker.yml (see docs/testing/molecule-standard.md).
# The scenario connects as root, so docker.yml's own smoke test (become_user) can
# never catch a non-root docker-permission regression - root bypasses the socket's
# group ownership. The non-root re-run below covers that path.

- name: Converge - Docker installation
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false

  tasks:
    - name: Include Docker installation task
      ansible.builtin.include_role:
        name: common
        tasks_from: docker

    # -- Non-root docker-group regression guard ----------------------------
    # Ansible caches one become session per target user, so a user added to the
    # docker group mid-play keeps using a session with its pre-change groups, and
    # `docker run` then fails with "permission denied ... docker.sock". Sequence:
    #   1) create 'docker-probe' (not yet in the docker group),
    #   2) arm a stale become session for it (spawned before the group grant),
    #   3) re-run the real docker.yml as docker-probe - it adds the group, then
    #      reset_connection re-spawns the session and re-runs the smoke test.
    - name: Create the non-root docker test user (not yet a docker member)
      ansible.builtin.user:
        name: docker-probe
        state: present
        shell: /bin/bash
      become: true

    - name: Arm a stale non-root become session before the docker group is granted
      # A trivial command that forces Ansible to spawn (and cache) a become
      # session as docker-probe while it still has NO docker group. This cached
      # session is what the docker.yml smoke test would be given if docker.yml
      # ever lost its reset_connection step.
      ansible.builtin.command: id
      args:
        warn: false
      become: true
      become_user: docker-probe
      changed_when: false

    - name: Include the real docker role as the non-root user (regression path)
      ansible.builtin.include_role:
        name: common
        tasks_from: docker
      vars:
        # Point the role's become/smoke wiring at the non-root user.
        ansible_user: docker-probe
