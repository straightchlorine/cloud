---
- name: Prepare test environment
  hosts: all
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      become: true

    - name: Install minimal utilities for testing
      ansible.builtin.apt:
        name:
          - sudo
          - curl
          - gnupg
          - python3-netaddr
        state: present
      become: true

    - name: Ensure systemd is running
      ansible.builtin.service:
        name: systemd-logind
        state: started
        enabled: true
      become: true
      # Ignore errors - service may not be available in test container environment
      ignore_errors: true

    # This role requires a pre-existing SSH key and fails fast without one -
    # a real key isn't needed since the network-dependent repository-init
    # step is skipped via backup_skip_init in converge.yml.
    - name: Create the SSH directory ahead of the role
      ansible.builtin.file:
        path: /opt/backup/.ssh
        state: directory
        mode: "0700"
      become: true

    - name: Write a dummy Hetzner SSH key
      ansible.builtin.copy:
        content: "molecule-test-dummy-key\n"
        dest: /opt/backup/.ssh/hetzner
        mode: "0600"
      become: true
