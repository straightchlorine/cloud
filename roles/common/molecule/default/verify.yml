---
- name: Verify common default
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert the refusal cases failed for their own reason
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_markers.yml"
      vars:
        molecule_case_ids: [teardown-guard-refusal, ntfy-notify-missing-vars]

    - name: Read the deployed chrony config
      ansible.builtin.slurp:
        src: /etc/chrony/chrony.conf
      register: common_chrony_conf

    - name: Assert the chrony config rendered the inputs
      vars:
        chrony_conf: "{{ common_chrony_conf.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'server pool.ntp.org iburst prefer' in chrony_conf"
          - "'allow 192.168.1.0/24' in chrony_conf"
          - "'local stratum 8' in chrony_conf"
        fail_msg: "chrony.conf rendered wrong: {{ chrony_conf }}"
        quiet: true

    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: Assert chrony is installed
      ansible.builtin.assert:
        that: "'chrony' in ansible_facts.packages"
        quiet: true

    - name: Assert the helpers and the key file are deployed
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - {path: /usr/local/bin/ntfy-notify, state: file, mode: "0755"}
          - {path: /usr/local/bin/reboot-notify, state: file, mode: "0755"}
          - {path: /etc/ntfy/notify-api-key, state: file, mode: "0600"}

    - name: Read the helper scripts and the key file
      ansible.builtin.slurp:
        src: "{{ item.value }}"
      register: common_deployed
      loop: "{{ {'helper': '/usr/local/bin/ntfy-notify', 'key': '/etc/ntfy/notify-api-key',
                 'reboot': '/usr/local/bin/reboot-notify'} | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Index the contents by name
      ansible.builtin.set_fact:
        common_text: "{{ dict(common_deployed.results | map(attribute='item.key')
                              | zip(common_deployed.results | map(attribute='content') | map('b64decode'))) }}"

    - name: Assert the API key lives only in the key file
      ansible.builtin.assert:
        that:
          - common_text.helper | length > 0
          - "'molecule-test-ntfy-key' not in common_text.helper"
          - "'molecule-test-ntfy-key' in common_text.key"
        fail_msg: "the ntfy API key must be in /etc/ntfy/notify-api-key and never in the helper script"
        quiet: true

    - name: Assert reboot-notify calls the ntfy helper by bare name
      # The bare name relies on the PATH cron entry from auto_updates.yml.
      ansible.builtin.assert:
        that:
          - "'ntfy-notify ' in common_text.reboot"
          - "'/usr/local/bin/ntfy-notify' not in common_text.reboot"
        fail_msg: "reboot-notify must call ntfy-notify by bare name: {{ common_text.reboot }}"
        quiet: true

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      register: common_root_crontab
      changed_when: false

    - name: Assert the PATH and reboot-notification cron entries
      ansible.builtin.assert:
        that:
          - common_root_crontab.stdout is search('PATH=.?/usr/local/sbin:/usr/local/bin')
          - "'/usr/local/bin/reboot-notify' in common_root_crontab.stdout"
        fail_msg: "auto_updates cron entries missing: {{ common_root_crontab.stdout }}"
        quiet: true

    - name: Read the compose file
      ansible.builtin.slurp:
        src: /opt/molecule-stack/docker-compose.yml
      register: common_compose_file

    - name: Assert the undeclared service left the compose file
      ansible.builtin.assert:
        that: (common_compose_file.content | b64decode | from_yaml).services.keys() | list == ['kept']
        fail_msg: "stale service survived: {{ common_compose_file.content | b64decode }}"
        quiet: true

    - name: Assert teardown_paths removed its targets
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - {path: /tmp/molecule-teardown-file-1, state: absent}
          - {path: /tmp/molecule-teardown-file-2, state: absent}
