---
- name: Verify role functionality
  hosts: all
  tasks:
        # Re-gather facts: they don't persist between playbooks in Molecule.
    - name: Gather system facts
      ansible.builtin.setup:
        gather_subset:
          - network
          - hardware

    - name: Verify network interfaces exist
      ansible.builtin.assert:
        that:
          - ansible_interfaces is defined
          - ansible_interfaces | length > 0
        fail_msg: "No network interfaces found"
        success_msg: "Network interfaces detected: {{ ansible_interfaces }}"

    - name: Verify IP addresses are configured
      ansible.builtin.assert:
        that:
          - ansible_all_ipv4_addresses is defined
          - ansible_all_ipv4_addresses | length > 0
        fail_msg: "No IPv4 addresses configured"
        success_msg: "IPv4 addresses: {{ ansible_all_ipv4_addresses }}"

    - name: Verify hostname is set
      ansible.builtin.assert:
        that:
          - ansible_hostname is defined
          - ansible_hostname | length > 0
        fail_msg: "Hostname is not set"
        success_msg: "Hostname: {{ ansible_hostname }}"

    - name: Verify system memory is detected
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb is defined
          - ansible_memtotal_mb | int > 0
        fail_msg: "System memory not detected"
        success_msg: "Total memory: {{ ansible_memtotal_mb }}MB"

    - name: Verify CPU count is detected
      ansible.builtin.assert:
        that:
          - ansible_processor_count is defined
          - ansible_processor_count | int > 0
        fail_msg: "CPU count not detected"
        success_msg: "CPU count: {{ ansible_processor_count }}"

    - name: Verify CPU cores are detected
      ansible.builtin.assert:
        that:
          - ansible_processor_cores is defined
          - ansible_processor_cores | int > 0
        fail_msg: "CPU cores not detected"
        success_msg: "CPU cores: {{ ansible_processor_cores }}"

    - name: Verify OS distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution is defined
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "Not running on Debian/Ubuntu"
        success_msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Verify ntfy/reboot-notify scripts rendered
      ansible.builtin.stat:
        path: "{{ item }}"
      register: common_rendered_files
      loop:
        - /tmp/ntfy-notify.rendered.sh
        - /tmp/reboot-notify.rendered.sh

    - name: Assert ntfy/reboot-notify scripts exist and are non-empty
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "{{ item.item }} did not render"
        success_msg: "[OK] {{ item.item }} rendered"
      loop: "{{ common_rendered_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the rendered ntfy helper
      ansible.builtin.slurp:
        src: /tmp/ntfy-notify.rendered.sh
      register: common_ntfy_notify_rendered

    - name: Assert the ntfy API key is NOT embedded in the helper script
      ansible.builtin.assert:
        that:
          - "'molecule-test-ntfy-key' not in (common_ntfy_notify_rendered.content | b64decode)"
        fail_msg: "ntfy-notify.sh.j2 still embeds vault_ntfy_api_key - key must live in a separate file"
        success_msg: "[OK] ntfy-notify.sh.j2 does not embed the API key"

    - name: Read the rendered ntfy API key file
      ansible.builtin.slurp:
        src: /tmp/ntfy-api-key
      register: common_ntfy_api_key_rendered

    - name: Assert the API key lives in the separate key file
      ansible.builtin.assert:
        that:
          - "'molecule-test-ntfy-key' in (common_ntfy_api_key_rendered.content | b64decode)"
        fail_msg: "ntfy API key file did not receive vault_ntfy_api_key"
        success_msg: "[OK] API key written to separate key file"

    - name: Read the rendered reboot-notify script
      ansible.builtin.slurp:
        src: /tmp/reboot-notify.rendered.sh
      register: common_reboot_notify_rendered

    - name: Assert reboot-notify calls the ntfy helper by bare name
      ansible.builtin.assert:
        that:
          - "'ntfy-notify.sh' in (common_reboot_notify_rendered.content | b64decode)"
          - "'/usr/local/bin/ntfy-notify.sh' not in (common_reboot_notify_rendered.content | b64decode)"
        fail_msg: >-
          reboot-notify.sh.j2 should call ntfy-notify.sh by bare name (relies
          on the PATH cron entry in auto_updates.yml), not a hardcoded path.
        success_msg: "[OK] reboot-notify.sh.j2 calls ntfy-notify.sh via PATH"

    - name: Display verification results
      ansible.builtin.debug:
        msg: |
          [OK] Network Configuration Verified
          - Interfaces: {{ ansible_interfaces }}
          - IPv4 Addresses: {{ ansible_all_ipv4_addresses }}
          - Hostname: {{ ansible_hostname }}

          [OK] Hardware Configuration Verified
          - Total Memory: {{ ansible_memtotal_mb }}MB
          - CPU Count: {{ ansible_processor_count }}
          - CPU Cores: {{ ansible_processor_cores }}

          [OK] Operating System Verified
          - Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}
