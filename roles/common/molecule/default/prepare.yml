---
- name: Prepare common default
  hosts: all
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      become: true

    - name: Install minimal utilities
      ansible.builtin.apt:
        name:
          - sudo
          - curl
          - gnupg
          - python3-netaddr
          - cron
          - logrotate
          - fail2ban
        state: present
      become: true

    - name: Render a compose file with a stale service the converge must drop
      ansible.builtin.include_role:
        name: common
        tasks_from: build_docker_compose
      vars:
        stack_name: molecule
        compose_file_path: /opt/molecule-stack/docker-compose.yml
        compose_file_owner: root
        compose_file_group: root
        compose_services: ["{{ molecule_kept_service }}", "{{ molecule_dropped_service }}"]

    - name: Create the teardown_paths targets
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      loop:
        - /tmp/molecule-teardown-file-1
        - /tmp/molecule-teardown-file-2
