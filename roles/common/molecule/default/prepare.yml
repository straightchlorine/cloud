---
- name: Prepare test environment
  hosts: all
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      become: true

    - name: Install minimal utilities for testing
      ansible.builtin.apt:
        name:
          - sudo
          - curl
          - gnupg
          - python3-netaddr
          - cron
        state: present
      become: true

    - name: Ensure systemd is running
      ansible.builtin.service:
        name: systemd-logind
        state: started
        enabled: true
      become: true
      # The test container may have no systemd-logind service to manage.
      ignore_errors: true

    - name: Render a compose file with two services (a stale one the real converge must drop)
      ansible.builtin.include_role:
        name: common
        tasks_from: build_docker_compose
      vars:
        stack_name: molecule
        compose_file_path: /opt/molecule-stack/docker-compose.yml
        compose_file_owner: root
        compose_file_group: root
        compose_services:
          - {service_name: kept, service_image: "busybox:1"}
          - {service_name: dropped, service_image: "busybox:1"}

    - name: Create artifacts for the real teardown_paths run
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      loop:
        - /tmp/molecule-teardown-file-1
        - /tmp/molecule-teardown-file-2
