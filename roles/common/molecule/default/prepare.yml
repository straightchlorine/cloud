---
- name: Prepare test environment
  hosts: all
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      become: true

    - name: Install minimal utilities for testing
      ansible.builtin.apt:
        name:
          - sudo
          - curl
          - gnupg
          - python3-netaddr
        state: present
      become: true

    - name: Ensure systemd is running
      ansible.builtin.service:
        name: systemd-logind
        state: started
        enabled: true
      become: true
      # Ignore errors - service may not be available in test container environment
      ignore_errors: true
