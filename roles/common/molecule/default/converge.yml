---
- name: Converge common default
  hosts: all
  vars_files:
    - ../shared/vars.yml
  vars:
    ntfy_server_url: "https://ntfy.example.test"
    common_auto_updates_reboot_time: "03:00"
    common_ntp_upstream_server: pool.ntp.org
    common_ntp_server_enabled: true
    common_ntp_allowed_networks:
      - 192.168.1.0/24
  tasks:
    - name: Publish the network facts
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    # Untagged: only the container-unsafe enable task in chrony.yml carries molecule-idempotence-notest.
    - name: Set up chrony
      ansible.builtin.include_role:
        name: common
        tasks_from: chrony

    # The helpers stack roles re-apply: ntfy-notify, unattended-upgrades and the reboot notice.
    - name: Configure fail2ban
      ansible.builtin.include_role:
        name: common
        tasks_from: fail2ban

    - name: Configure log rotation
      ansible.builtin.include_role:
        name: common
        tasks_from: logrotate

    - name: Re-apply the base helpers
      ansible.builtin.include_role:
        name: common
        tasks_from: base_reapply
      vars:
        common_auto_updates_reboot_if_required: true

    - name: Re-render the compose file with one service
      ansible.builtin.include_role:
        name: common
        tasks_from: build_docker_compose
      vars:
        stack_name: molecule
        compose_file_path: /opt/molecule-stack/docker-compose.yml
        compose_file_owner: root
        compose_file_group: root
        compose_services: ["{{ molecule_kept_service }}"]

    - name: Remove a path list
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_paths
      vars:
        common_teardown_name: molecule
        common_teardown_paths:
          - /tmp/molecule-teardown-file-1
          - /tmp/molecule-teardown-file-2

    - name: Refuse a teardown without the flag
      vars:
        molecule_case:
          id: teardown-guard-refusal
          expect: >-
            Refusing gpu-qp teardown. Re-run with -e gpu_qp_teardown_confirm=true
            and --limit <your-test-host>.
      block:
        - name: Run teardown_guard without the flag
          ansible.builtin.include_role:
            name: common
            tasks_from: teardown_guard
          vars:
            common_teardown_name: gpu-qp

        - name: Fail when the guard let the run through
          ansible.builtin.fail:
            msg: "case {{ molecule_case.id }} passed validation"
      rescue:
        - name: Assert the refusal names the underscore flag
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"

    - name: Accept the documented flag
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_guard
      vars:
        common_teardown_name: gpu-qp
        gpu_qp_teardown_confirm: true

    - name: Refuse a notification without title and message
      vars:
        molecule_case:
          id: ntfy-notify-missing-vars
          expect: common_ntfy_title and common_ntfy_message must be set to call ntfy_notify
      block:
        - name: Call ntfy_notify without title and message
          ansible.builtin.include_role:
            name: common
            tasks_from: ntfy_notify

        - name: Fail when ntfy_notify ran anyway
          ansible.builtin.fail:
            msg: "case {{ molecule_case.id }} passed validation"
      rescue:
        - name: Assert the refusal names the missing variables
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"
