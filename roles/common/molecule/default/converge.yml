---
- name: Converge
  hosts: all
  vars:
    common_timezone: UTC
    common_fail2ban_enabled: false
    package_cache_valid_time: 3600
    common_packages:
      - curl
      - wget
      - git
  tasks:
    - name: Include network facts collection
      ansible.builtin.include_tasks: ../../tasks/network_facts.yml

    - name: Include hardware detection
      ansible.builtin.include_tasks: ../../tasks/detect_hardware.yml

    - name: Set timezone
      community.general.timezone:
        name: "{{ common_timezone }}"
      become: true
