---
- name: Converge
  hosts: all
  vars:
    timezone: UTC
    common_fail2ban_enabled: false
    package_cache_valid_time: 3600
    common_packages:
      - curl
      - wget
      - git
    vault_ntfy_api_key: molecule-test-ntfy-key
    ntfy_server_url: "https://ntfy.example.test"
    ntfy_topic: "molecule-test"
    common_auto_updates_reboot_time: "03:00"
    inventory_hostname: molecule-test-host
    common_ntp_upstream_server: pool.ntp.org
    common_ntp_server_enabled: true
    common_ntp_allowed_networks:
      - 192.168.1.0/24
  tasks:
    - name: Include network facts collection
      ansible.builtin.include_tasks: ../../tasks/network_facts.yml

    # include_role (not a raw include_tasks path) so the role-relative
    # `template: src: chrony.conf.j2` in chrony.yml resolves correctly.
    # chrony.yml itself tags only its container-unsafe enable/start task
    # molecule-idempotence-notest - don't blanket-tag the whole include.
    - name: Run the real chrony setup and sync
      ansible.builtin.include_role:
        name: common
        tasks_from: chrony

    # Hardware detection moved to a standalone 'hardware' role with its own
    # molecule scenario - no duplicate include needed here.

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"
      become: true

    # Catch undefined/misnamed template vars that would silently drop the
    # notification instead of failing.
    - name: Render the ntfy notification helper
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/ntfy-notify.j2"
        dest: /tmp/ntfy-notify.rendered.sh
        mode: "0755"

    # Render the API key file the same way ntfy_install.yml does, so verify.yml
    # can assert the secret lives only there - never embedded in the script.
    - name: Render the ntfy API key file
      ansible.builtin.copy:
        dest: /tmp/ntfy-api-key
        content: "{{ vault_ntfy_api_key }}\n"
        mode: "0600"

    - name: Render the reboot-pending notification script
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/reboot-notify.j2"
        dest: /tmp/reboot-notify.rendered.sh
        mode: "0755"

    - name: Confirm ntfy_notify fails fast when required vars are missing
      block:
        - name: Call ntfy_notify with no title/message (expect failure)
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/ntfy_notify.yml"
        - name: Fail the test - ntfy_notify should have refused to run
          ansible.builtin.fail:
            msg: "ntfy_notify did not fail fast on missing common_ntfy_title/message"
      rescue:
        - name: Expected failure caught
          ansible.builtin.debug:
            msg: "[OK] ntfy_notify correctly refused to run without required vars"
