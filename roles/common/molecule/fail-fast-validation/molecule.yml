---
role_name_check: 0
driver:
  name: Docker
platforms:
  - name: Debian12-failfast
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    ansible.builtin.command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
provisioner:
  name: Ansible
  env:
    # CI/local both run `cd roles/<role> && molecule test`, so
    # MOLECULE_PROJECT_DIRECTORY is roles/common - one level up is roles/,
    # letting `include_role: name: common` resolve by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  # Note: Intentionally minimal inventory - no variables set
  inventory:
    group_vars:
      all: {}
verifier:
  name: Ansible
scenario:
  name: Fail-fast-validation
  description: Test that role fails fast when required variables are missing
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - converge # This step should fail/be handled
    - verify # Verify the failure was expected
    - cleanup
    - destroy
