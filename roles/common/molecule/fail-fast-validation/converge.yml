---
- name: Converge - Fail-fast validation test
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Test that unified_validation fails without required variables
      block:
        - name: Include unified_validation without required variables # noqa: var-naming[no-role-prefix]
          ansible.builtin.include_role:
            name: common
            tasks_from: unified_validation
          vars:
            validation_context: "fail-fast-test"
            validation_type: "full"
            validation_role: "common"
            required_variables:
              - this_variable_does_not_exist
              - neither_does_this_one

      rescue:
        - name: Set fact to indicate expected failure occurred
          ansible.builtin.set_fact:
            common_fail_fast_test_passed: true

        - name: Display expected failure message
          ansible.builtin.debug:
            msg: |
              [OK] Fail-fast validation PASSED:
              Role correctly failed when required variables were missing
              This is the expected behavior!
