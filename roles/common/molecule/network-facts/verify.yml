---
- name: Verify common network-facts
  hosts: all
  gather_facts: true
  tasks:
    - name: Read what the role published during converge
      ansible.builtin.slurp:
        src: /tmp/molecule-network-facts.json
      register: common_published

    - name: Assert the published facts match the host's own default route
      vars:
        published: "{{ common_published.content | b64decode | from_json }}"
        route: "{{ ansible_facts['default_ipv4'] }}"
      ansible.builtin.assert:
        that:
          - published.interface == route.interface
          - published.ip == route.address
          - published.ip is match('^(\\d{1,3}\\.){3}\\d{1,3}$')
          - published.network_cidr == route.network ~ '/' ~ route.prefix
          - published.host_ip_cidr == route.address ~ '/' ~ route.prefix
        fail_msg: "published {{ published }} does not match the host route {{ route }}"
        quiet: true
