---
- name: Converge - Network facts detection
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Include network_facts task
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Include network_facts again; the facts are already set, so it must not change them
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Record the published facts for verify.yml
      # A file, not set_fact: converge and verify are separate ansible-playbook processes.
      ansible.builtin.copy:
        content: >-
          {{ {'interface': primary_interface, 'ip': primary_ip,
          'network_cidr': primary_network_cidr, 'host_ip_cidr': host_ip_cidr} | to_json }}
        dest: /tmp/molecule-network-facts.json
        mode: "0644"
