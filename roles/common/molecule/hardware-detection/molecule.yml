---
role_name_check: 0
driver:
  name: podman
platforms:
  - name: Debian12-hardware
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
provisioner:
  name: ansible
  env:
    # CI/local both run `cd roles/<role> && molecule test`, so
    # MOLECULE_PROJECT_DIRECTORY is roles/common - one level up is roles/,
    # letting `include_role: name: common` resolve itself by name instead
    # of needing a raw include_tasks path workaround.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    group_vars:
      all:
        timezone: UTC
verifier:
  name: ansible
scenario:
  name: hardware-detection
  description: Test hardware platform detection and resource limit calculation
