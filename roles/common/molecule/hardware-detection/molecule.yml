---
driver:
  name: Docker
platforms:
  - name: Debian12-hardware
    image: docker.io/geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    ansible.builtin.command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
provisioner:
  name: Ansible
  inventory:
    group_vars:
      all:
        common_timezone: UTC
verifier:
  name: Ansible
scenario:
  name: Hardware-detection
  description: Test hardware platform detection and resource limit calculation
