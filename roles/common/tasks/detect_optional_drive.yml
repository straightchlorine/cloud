---
# Non-fatal detection of an unused, non-boot drive (may be unplugged, or
# carry a stale partition table). Only real disks/partitions are considered
# (no loop/rom/zram). Never mounts or formats - just sets facts:
#   common_optional_drive_present        - bool
#   common_optional_drive_device         - "/dev/sda" or "/dev/sda1" ("" if none found)
#   common_optional_drive_is_whole_disk  - bool (bare disk, not a partition)
#   common_optional_drive_has_filesystem - bool (false = needs formatting)
#   common_optional_drive_fstype         - "" or whatever's there (callers should
#                                          compare against what they want, not just
#                                          has_filesystem, before mounting as-is)

- name: Detect an unused, non-boot drive
  ansible.builtin.shell:
    cmd: |
      python3 <<'PYEOF'
      import json, subprocess

      data = json.loads(subprocess.check_output(
          ['lsblk', '-J', '-o', 'NAME,TYPE,MOUNTPOINT,FSTYPE']))

      def in_use(dev):
          # A disk counts as in use if it, or any partition on it, is
          # mounted anywhere - including a stale multi-partition table where
          # only one partition happens to be mounted.
          if dev.get('mountpoint'):
              return True
          return any(in_use(child) for child in dev.get('children', []))

      candidate = {}
      for dev in data['blockdevices']:
          if dev.get('type') != 'disk' or dev['name'].startswith('mmcblk'):
              continue
          if in_use(dev):
              continue

          children = dev.get('children', [])
          if len(children) == 1 and children[0].get('fstype'):
              # Exactly one partition, already formatted - use it as-is.
              candidate = dict(children[0])
              candidate['is_whole_disk'] = False
          else:
              # No partition table, or a stale/unused one (zero partitions,
              # multiple partitions, or a single unformatted one) - treat the
              # whole disk as the candidate. "Formatting" it means wiping
              # whatever partition table is there and creating one fresh
              # partition, not reusing a leftover scrap partition.
              candidate = dict(dev)
              candidate['is_whole_disk'] = True
          break

      print(json.dumps(candidate))
      PYEOF
  changed_when: false
  register: common_optional_drive_raw

- name: Parse the detected drive
  ansible.builtin.set_fact:
    common_optional_drive: "{{ common_optional_drive_raw.stdout | from_json }}"

- name: Expose optional-drive facts
  ansible.builtin.set_fact:
    common_optional_drive_present: "{{ 'name' in common_optional_drive }}"
    common_optional_drive_device: >-
      {{ '/dev/' + common_optional_drive.name if 'name' in common_optional_drive else '' }}
    common_optional_drive_is_whole_disk: "{{ common_optional_drive.is_whole_disk | default(false) }}"
    common_optional_drive_fstype: "{{ common_optional_drive.fstype | default('', true) }}"
    common_optional_drive_has_filesystem: >-
      {{ (common_optional_drive.fstype | default('', true)) | length > 0 }}
