---
# Detects an unused, non-boot drive without failing when none is attached, and never mounts or formats it.
# Callers should compare common_optional_drive_fstype with the filesystem they want before mounting a drive as-is.
# common_optional_drive_present:        true when a candidate drive was found.
# common_optional_drive_device:         the device path, an empty string when none was found.
# common_optional_drive_is_whole_disk:  true for a bare disk, false for a partition.
# common_optional_drive_has_filesystem: false means the drive needs formatting.
# common_optional_drive_fstype:         the filesystem type found, or an empty string.

- name: Detect an unused, non-boot drive
  ansible.builtin.shell:
    cmd: |
      python3 <<'PYEOF'
      import json, subprocess

      data = json.loads(subprocess.check_output(
          ['lsblk', '-J', '-o', 'NAME,TYPE,MOUNTPOINT,FSTYPE']))

      def in_use(dev):
          # A disk is in use when it or any of its partitions is mounted, even on a stale partition table.
          if dev.get('mountpoint'):
              return True
          return any(in_use(child) for child in dev.get('children', []))

      candidate = {}
      for dev in data['blockdevices']:
          if dev.get('type') != 'disk' or dev['name'].startswith('mmcblk'):
              continue
          if in_use(dev):
              continue

          children = dev.get('children', [])
          if len(children) == 1 and children[0].get('fstype'):
              # A single formatted partition is used as it is.
              candidate = dict(children[0])
              candidate['is_whole_disk'] = False
          else:
              # Any other layout makes the whole disk the candidate.
              # Formatting it wipes the old partition table and creates one fresh partition.
              candidate = dict(dev)
              candidate['is_whole_disk'] = True
          break

      candidate.setdefault('is_whole_disk', False)
      candidate['fstype'] = candidate.get('fstype') or ''
      print(json.dumps(candidate))
      PYEOF
  changed_when: false
  register: common_optional_drive_raw

- name: Parse the detected drive
  ansible.builtin.set_fact:
    common_optional_drive: "{{ common_optional_drive_raw.stdout | from_json }}"

- name: Expose optional-drive facts
  ansible.builtin.set_fact:
    common_optional_drive_present: "{{ 'name' in common_optional_drive }}"
    common_optional_drive_device: >-
      {{ '/dev/' + common_optional_drive.name if 'name' in common_optional_drive else '' }}
    common_optional_drive_is_whole_disk: "{{ common_optional_drive.is_whole_disk }}"
    common_optional_drive_fstype: "{{ common_optional_drive.fstype }}"
    common_optional_drive_has_filesystem: >-
      {{ common_optional_drive.fstype | length > 0 }}
