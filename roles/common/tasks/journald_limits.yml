---
# systemd's default cap is 10% of the filesystem, too much log churn on flash storage.

- name: Cap the persistent journal size
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: "SystemMaxUse={{ common_journald_system_max_use }}"
  become: true
  notify: Restart systemd-journald
