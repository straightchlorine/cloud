---
# Cap the persistent journal. systemd's default is 10% of the filesystem -
# gigabytes of writes on a large card or drive - and flash capacity is better
# spent on data than on logs nobody reads. Callers own the policy (when/where);
# the value comes from common_journald_system_max_use.

- name: Cap the persistent journal size
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: "SystemMaxUse={{ common_journald_system_max_use }}"
  become: true
  notify: Restart systemd-journald
