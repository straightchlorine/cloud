---
# This Syncthing snapshot is the secondary off-box copy, and restic stays the primary backup.
# common_snapshot_name:         stack name used in the script, log and cron names.
# common_snapshot_stack_home:   compose project directory, used as the script's working directory.
# common_snapshot_dest:         destination directory shared through Syncthing.
# common_snapshot_owner:        user that Syncthing runs as, which owns the snapshots.
# common_snapshot_retention:    number of snapshot directories to keep.
# common_snapshot_hour and common_snapshot_minute: cron time, which should finish before the restic job.
# common_snapshot_summary:      text describing the snapshot, used in the ntfy message and --help.
# common_snapshot_steps:        shell snippets run in order that write into $WORK and may append caveats to $NOTES.

- name: Validate the snapshot backup contract
  ansible.builtin.assert:
    that:
      - common_snapshot_dest is defined
      - common_snapshot_owner is defined
      - common_snapshot_steps | length > 0
    fail_msg: >-
      {{ common_snapshot_name }}: the backup dir (the Syncthing-shared folder,
      on the SSD) and its owner (the user that runs Syncthing) must be set in
      host_vars when the local backup is enabled.
    quiet: true

- name: Ensure the Syncthing backup directory exists
  ansible.builtin.file:
    path: "{{ common_snapshot_dest }}"
    state: directory
    owner: "{{ common_snapshot_owner }}"
    mode: "0750"
  become: true

- name: "Install the Syncthing backup script: {{ common_snapshot_name }}"
  ansible.builtin.template:
    src: stack-snapshot-backup.sh.j2
    dest: "/usr/local/bin/{{ common_snapshot_name }}-syncthing-backup"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Schedule the Syncthing backup: {{ common_snapshot_name }}"
  ansible.builtin.cron:
    name: "{{ common_snapshot_name | capitalize }} Syncthing local backup"
    minute: "{{ common_snapshot_minute }}"
    hour: "{{ common_snapshot_hour }}"
    job: >-
      /usr/local/bin/{{ common_snapshot_name }}-syncthing-backup
      >> /var/log/{{ common_snapshot_name }}-syncthing-backup.log 2>&1
    user: root
  become: true
