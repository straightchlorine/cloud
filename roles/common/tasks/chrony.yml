---
# This runs before packages.yml and any HTTPS-dependent task, because a wrong clock fails TLS validation of the
# certificate dates.
# Pi hosts have no battery-backed clock, so they can start with a wrong time after every reboot.

- name: Gather service facts to check for systemd-timesyncd
  ansible.builtin.service_facts:

- name: Stop systemd-timesyncd service
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  become: true
  when: "'systemd-timesyncd.service' in ansible_facts.services"

- name: Install chrony package
  ansible.builtin.apt:
    name: chrony
    state: present
  become: true

- name: Create chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: Restart chrony

- name: Enable and start chrony service
  # molecule-idempotence-notest: containers lack CAP_SYS_TIME, so systemd skips the unit and the task reports
  # changed on every run.
  # Real hosts converge normally.
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  become: true
  tags: [molecule-idempotence-notest]

- name: Wait for chrony to sync
  # The timeout command is needed because waitsync can retry for minutes when the daemon is unreachable.
  # The deploy must not block on it, so the next task only warns.
  ansible.builtin.command: timeout 30 chronyc waitsync 10 0.5
  become: true
  register: common_chrony_sync_result
  changed_when: false
  failed_when: false

- name: Warn if chrony did not sync in time
  ansible.builtin.debug:
    msg: >-
      chronyc waitsync did not confirm sync within the timeout
      ({{ common_chrony_sync_result.stdout }}).
      Proceeding anyway - later HTTPS downloads may fail TLS validation if
      the clock is still wrong.
  when: common_chrony_sync_result.rc != 0
