---
# Hardware detection for all systems (Pi, PC, VM)
# Sets hardware-appropriate resource limits based on detected hardware

- name: Detect hardware platform
  ansible.builtin.shell: |
    set -o pipefail
    # Check for Raspberry Pi
    if [ -f /proc/device-tree/model ]; then
      cat /proc/device-tree/model
    # Check for virtualization
    elif systemd-detect-virt --quiet; then
      echo "VM-$(systemd-detect-virt)"
    # Check DMI for physical systems
    elif [ -f /sys/class/dmi/id/product_name ]; then
      echo "PC-$(cat /sys/class/dmi/id/product_name 2>/dev/null || echo 'Unknown')"
    else
      echo "unknown"
    fi
  args:
    executable: /bin/bash
  register: common_hardware_detection_raw
  changed_when: false

- name: Gather system resources
  ansible.builtin.setup:
    gather_subset:
      - hardware
    filter:
      - ansible_memtotal_mb
      - ansible_processor_count
      - ansible_processor_cores
      - ansible_processor_vcpus

- name: Parse hardware information # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    hardware_platform: >-
      {%- if device_type is defined -%}
        {%- if device_type == 'rpi4b' -%}
          rpi4
        {%- elif device_type == 'rpi3b' -%}
          rpi3
        {%- elif device_type == 'rpi2b' -%}
          rpi2
        {%- elif device_type.endswith('_vm') or device_type.endswith('_pc') -%}
          pc
        {%- else -%}
          {{ device_type }}
        {%- endif -%}
      {%- elif 'Raspberry Pi 4' in common_hardware_detection_raw.stdout -%}
        rpi4
      {%- elif 'Raspberry Pi 3' in common_hardware_detection_raw.stdout -%}
        rpi3
      {%- elif 'Raspberry Pi 2' in common_hardware_detection_raw.stdout -%}
        rpi2
      {%- elif common_hardware_detection_raw.stdout.startswith('VM-')
        or common_hardware_detection_raw.stdout.startswith('PC-') -%}
        pc
      {%- else -%}
        unknown
      {%- endif -%}

    hardware_details:
      raw_detection: "{{ common_hardware_detection_raw.stdout }}"
      memory_mb: "{{ ansible_memtotal_mb }}"
      cpu_cores: "{{ ansible_processor_cores }}"
      cpu_count: "{{ ansible_processor_count }}"
      vcpus: "{{ ansible_processor_vcpus if ansible_processor_vcpus is defined else ansible_processor_cores }}"

- name: Fail if detected hardware platform has no resource profile
  ansible.builtin.fail:
    msg: >-
      hardware_platform '{{ hardware_platform }}' is not a key of
      common_hardware_profiles. Valid keys:
      {{ common_hardware_profiles.keys() | list }}
  when: hardware_platform not in common_hardware_profiles

- name: Set hardware-specific resource limits from platform profile # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    hardware_limits: "{{ common_hardware_profiles[hardware_platform] }}"
