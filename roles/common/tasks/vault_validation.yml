# Common vault variable validation framework
# Validates that required vault variables are defined and properly formatted

- name: Validate core vault variables (required by all roles)
  ansible.builtin.fail:
    msg: "Required vault variable '{{ item }}' is not defined or empty. Check your vault.yml file."
  when: vars[item] is not defined or vars[item] == "" or vars[item] == "CHANGEME" or vars[item] == "your-" in (vars[item] | string)
  loop:
    - vault_domain_name
    - vault_letsencrypt_email
  tags: [vault_validation]

- name: Validate vault_domain_name format
  ansible.builtin.fail:
    msg: "vault_domain_name '{{ vault_domain_name }}' is not a valid domain format"
  when: not (vault_domain_name | regex_search('^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]*\.[a-zA-Z]{2,}$'))
  tags: [vault_validation]

- name: Validate vault_letsencrypt_email format
  ansible.builtin.fail:
    msg: "vault_letsencrypt_email '{{ vault_letsencrypt_email }}' is not a valid email format"
  when: not (vault_letsencrypt_email | regex_search('^[\\w\\.-]+@[\\w\\.-]+\\.[a-zA-Z]{2,}$'))
  tags: [vault_validation]

- name: Check for placeholder values in core variables
  ansible.builtin.fail:
    msg: "Vault variable '{{ item.var }}' contains placeholder value '{{ item.value }}'. Please set a real value in vault.yml."
  when: vars[item.var] is defined and (vars[item.var] | string) == item.value
  loop:
    - {var: "vault_domain_name", value: "example.com"}
    - {var: "vault_domain_name", value: "codextechnologies.org"}
    - {var: "vault_letsencrypt_email", value: "admin@example.com"}
    - {var: "vault_letsencrypt_email", value: "admin@codextechnologies.org"}
  tags: [vault_validation]

- name: Display core vault validation success
  ansible.builtin.debug:
    msg: |
      ✅ Core Vault Variables Validated:
      Domain: {{ vault_domain_name }}
      Email: {{ vault_letsencrypt_email }}
  tags: [vault_validation]

