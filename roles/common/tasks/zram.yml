---
# zram avoids SD-card swap wear and keeps apt or gravity runs from OOM-killing
# Pi-hole on low-RAM boards.

- name: Install zram-tools
  ansible.builtin.apt:
    name: zram-tools
    state: present
  become: true

- name: Configure the zram swap device
  ansible.builtin.template:
    src: zramswap.j2
    dest: /etc/default/zramswap
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart zramswap

- name: Enable and start zram swap
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started
    daemon_reload: true
  become: true
