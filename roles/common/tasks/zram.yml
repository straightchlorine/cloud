---
# zram avoids SD-card swap wear and keeps apt or gravity runs from OOM-killing
# Pi-hole on low-RAM boards.

- name: Install zram-tools
  ansible.builtin.apt:
    name: zram-tools
    state: present
  become: true

- name: Render the zram swap config
  ansible.builtin.include_tasks: zram_config.yml

- name: Enable and start zram swap
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started
    daemon_reload: true
  become: true
