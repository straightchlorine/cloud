---
- name: Install filesystem utilities
  ansible.builtin.apt:
    name: "{{ common_filesystem_utilities }}"
    state: present
  become: true

- name: Check if SSD device exists
  ansible.builtin.stat:
    path: "{{ ssd_device }}"
  register: common_ssd_exists

- name: Fail if SSD device not found
  ansible.builtin.fail:
    msg: "SSD device {{ ssd_device }} not found. Please connect your SSD and update the ssd_device variable."
  when: not common_ssd_exists.stat.exists

- name: Format SSD filesystem
  community.general.filesystem:
    fstype: "{{ common_ssd_filesystem }}"
    dev: "{{ ssd_device }}"
  become: true
  when: common_ssd_format

- name: Create mount point directory
  ansible.builtin.file:
    path: "{{ mount_path }}"
    state: directory
    mode: "0755"
  become: true

- name: Mount SSD
  ansible.posix.mount:
    path: "{{ mount_path }}"
    src: "{{ ssd_device }}"
    fstype: "{{ common_ssd_filesystem }}"
    opts: "{{ common_ssd_mount_options }}"
    state: mounted
  become: true

- name: Set ownership of mount directory
  ansible.builtin.file:
    path: "{{ mount_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
  become: true

- name: Create subdirectories if specified
  ansible.builtin.file:
    path: "{{ mount_path }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ mount_subdirectories }}"
  when: mount_subdirectories is defined and mount_subdirectories | length > 0
