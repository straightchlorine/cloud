---
# Unified Restic Backup Implementation
# Eliminates redundancy between automation and enterprise-backup roles
# Provides scalable backup solution with enterprise features when needed

- name: Validate required backup variables
  ansible.builtin.fail:
    msg: "Required backup variable '{{ item }}' is not defined or empty"
  when: vars[item] is not defined or vars[item] == ""
  loop:
    - backup_service_name
    - restic_repository
    - restic_password
    - backup_paths
  no_log: false

- name: Create backup user (if not already created)
  ansible.builtin.user:
    name: Backup
    system: true
    shell: /bin/bash
    home: "{{ common_backup_base_path }}"
    createhome: true
    groups: "{{ common_backup_additional_groups }}"
    append: true
  become: true
  when: common_backup_additional_groups is defined and common_backup_additional_groups | length > 0
  # Suppress errors if user already exists or groups not available on this system
  failed_when:
    - common_backup_user_group_result.rc not in [0, 1]
  register: common_backup_user_group_result

- name: Configure sudoers for backup user
  ansible.builtin.template:
    src: backup-sudoers.j2
    dest: /etc/sudoers.d/backup-user
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true

- name: Check if restic is already installed
  ansible.builtin.command: which restic
  register: common_restic_check
  changed_when: false
  failed_when: false

- name: Install restic on Arch Linux
  community.general.pacman:
    name: Restic
    state: present
    update_cache: true
  become: true
  when:
    - ansible_os_family == "Archlinux"
    - common_restic_check.rc != 0

- name: Install restic on Debian/Ubuntu
  ansible.builtin.apt:
    name: Restic
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - ansible_os_family == "Debian"
    - common_restic_check.rc != 0

- name: Verify restic installation
  ansible.builtin.command: restic version
  register: common_restic_version_check
  changed_when: false

- name: Create backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: backup
    group: backup
    mode: '0750'
  become: true
  loop:
    - "{{ common_backup_base_path }}/scripts"
    - "{{ common_backup_base_path }}/logs"
    - "{{ common_backup_base_path }}/cache"
    - "{{ common_backup_base_path }}/keys"

- name: Create service-specific restic password file
  ansible.builtin.copy:
    content: "{{ restic_password }}"
    dest: "{{ common_backup_base_path }}/keys/{{ common_backup_service_name }}-password"
    owner: backup
    group: backup
    mode: '0600'
  become: true
  no_log: true

- name: Create SSH directory for backup user
  ansible.builtin.file:
    path: "{{ common_backup_base_path }}/.ssh"
    state: directory
    owner: backup
    group: backup
    mode: '0700'
  become: true

- name: Verify SSH key exists at configured location
  ansible.builtin.stat:
    path: "{{ common_backup_base_path }}/.ssh/hetzner"
  register: common_hetzner_key_stat
  become: true

- name: Fail if SSH key is missing
  ansible.builtin.fail:
    msg: |
      SSH key not found at {{ common_backup_base_path }}/.ssh/hetzner

      This role requires a pre-configured SSH private key for Hetzner Storage Box access.
      Please place your SSH private key at: {{ common_backup_base_path }}/.ssh/hetzner
      Then set correct permissions: chmod 600 {{ common_backup_base_path }}/.ssh/hetzner
      And ownership: chown backup:backup {{ common_backup_base_path }}/.ssh/hetzner
  when: not common_hetzner_key_stat.stat.exists
  become: true

- name: Fix SSH key permissions if needed
  ansible.builtin.file:
    path: "{{ common_backup_base_path }}/.ssh/hetzner"
    owner: backup
    group: backup
    mode: '0600'
  become: true
  when: common_hetzner_key_stat.stat.exists

- name: Create SSH socket directory
  ansible.builtin.file:
    path: "{{ common_backup_base_path }}/.ssh/sockets"
    state: directory
    owner: backup
    group: backup
    mode: '0700'
  become: true

- name: Create SSH config for backup connectivity
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ common_backup_base_path }}/.ssh/config"
    owner: backup
    group: backup
    mode: '0600'
  become: true

- name: Create service backup script
  ansible.builtin.template:
    src: backup-script.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/backup-{{ common_backup_service_name }}.sh"
    owner: backup
    group: backup
    mode: '0755'
  vars:
    common_backup_directories: "{{ common_backup_paths }}"
    common_backup_password_file: "{{ common_backup_base_path }}/keys/{{ common_backup_service_name }}-password"
    common_backup_cache_dir: "{{ common_backup_base_path }}/cache"
    common_backup_log_dir: "{{ common_backup_base_path }}/logs"
  become: true

- name: Create repository initialization script
  ansible.builtin.template:
    src: restic-init.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/init-{{ common_backup_service_name }}.sh"
    owner: backup
    group: backup
    mode: '0755'
  vars:
    common_backup_password_file: "{{ common_backup_base_path }}/keys/{{ common_backup_service_name }}-password"
    backup_ssh_key_path: "{{ common_backup_base_path }}/keys/{{ common_backup_service_name }}-ssh-key"
  become: true

- name: Check if existing systemd service exists
  ansible.builtin.stat:
    path: "/etc/systemd/system/backup-{{ common_backup_service_name }}.service"
  become: true
  register: common_existing_service

- name: Backup existing systemd service if it exists
  ansible.builtin.copy:
    src: "/etc/systemd/system/backup-{{ common_backup_service_name }}.service"
    dest: "/etc/systemd/system/backup-{{ common_backup_service_name }}.service.backup"
    remote_src: true
  become: true
  when: common_existing_service.stat.exists

- name: Create systemd backup service
  ansible.builtin.template:
    src: systemd-service.j2
    dest: "/etc/systemd/system/backup-{{ common_backup_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
    backup: true
  vars:
    service_description: "Restic Backup Service for {{ common_backup_service_name }}"
    service_after: ["network.target"]
    common_service_wants: ["network.target"]
    service_type: "oneshot"
    service_user: "backup"
    service_group: "backup"
    common_working_directory: "{{ common_backup_base_path }}"
    service_environment:
      - "RESTIC_REPOSITORY={{ restic_repository }}"
      - "RESTIC_PASSWORD_FILE={{ common_backup_base_path }}/keys/{{ common_backup_service_name }}-password"
      - "RESTIC_CACHE_DIR={{ common_backup_base_path }}/cache"
      - "RESTIC_SFTP_COMMAND=ssh -F {{ common_backup_base_path }}/.ssh/config hetzner-storage -s sftp"
    exec_start: "{{ common_backup_base_path }}/scripts/backup-{{ common_backup_service_name }}.sh"
    common_standard_output: |
      append:{{ common_backup_base_path }}/logs/systemd-backup-{{ common_backup_service_name }}.log
    common_standard_error: |
      append:{{ common_backup_base_path }}/logs/systemd-backup-{{ common_backup_service_name }}.log
    common_timeout_start_sec: "{{ backup_timeout }}"
    common_enable_security_hardening: true
    common_no_new_privileges: false
    common_protect_system: "strict"
    common_protect_home: "read-only"
    common_private_tmp: "yes"
    common_read_write_paths: "{{ [backup_base_path] + backup_paths }}"
    memory_limit: "{{ restic_memory_limit | default(omit) }}"
    nice_level: "{{ common_backup_nice_level }}"
    io_scheduling_class: "{{ common_backup_io_class }}"
  become: true
  notify:
    - reload systemd
    - restart backup service

- name: Create systemd backup timer
  ansible.builtin.template:
    src: backup-timer.j2
    dest: "/etc/systemd/system/backup-{{ common_backup_service_name }}.timer"
    owner: root
    group: root
    mode: '0644'
  vars:
    timer_description: "Backup Timer for {{ common_backup_service_name }}"
    timer_service: "backup-{{ common_backup_service_name }}.service"
    timer_schedule: "{{ backup_schedule }}"
    timer_randomized_delay: "{{ backup_randomized_delay }}"
  become: true
  notify:
    - reload systemd
    - restart backup timer

- name: Set permissions on backup paths for backup user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "g+rx"
    recurse: false
  become: true
  loop: "{{ common_backup_paths }}"

- name: Initialize restic repository if it doesn't exist
  ansible.builtin.command: "{{ common_backup_base_path }}/scripts/init-{{ common_backup_service_name }}.sh"
  become_user: backup
  become: true
  register: common_repository_init
  changed_when: "'initialized' in common_repository_init.stdout"
  failed_when: >-
    common_repository_init.rc != 0 and 'already exists' not in common_repository_init.stderr and
    'already exists' not in common_repository_init.stdout
  when: backup_skip_init is not defined or not backup_skip_init

- name: Force handler execution
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: "backup-{{ common_backup_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: backup_enabled

- name: Get current systemd service checksum
  ansible.builtin.stat:
    path: "/etc/systemd/system/backup-{{ common_backup_service_name }}.service"
    checksum_algorithm: sha256
  register: common_current_service_file
  become: true

- name: Force systemd service restart if configuration changed
  ansible.builtin.systemd:
    name: "backup-{{ common_backup_service_name }}.service"
    state: stopped
    daemon_reload: true
  become: true
  when: common_current_service_file.stat.exists

- name: Verify backup service configuration and restart
  ansible.builtin.systemd:
    name: "backup-{{ common_backup_service_name }}.service"
    daemon_reload: true
    state: stopped
  become: true
  register: common_backup_service_status

- name: Display backup service file checksum for verification
  ansible.builtin.debug:
    msg: "Service file checksum: {{ common_current_service_file.stat.checksum }}"

- name: Verify critical service configuration
  ansible.builtin.shell: |
    grep -i "NoNewPrivileges=false"
      "/etc/systemd/system/backup-{{ common_backup_service_name }}.service"
  become: true
  register: common_service_config_check
  changed_when: false
  failed_when: common_service_config_check.rc != 0

- name: Verify deployed service configuration
  ansible.builtin.command:
    cmd: "systemctl show backup-{{ common_backup_service_name }}.service --property=User,NoNewPrivileges,Environment"
  register: common_deployed_service_config
  become: true

- name: Display backup configuration summary
  ansible.builtin.debug:
    msg: |
      [OK] Unified Restic Backup Configured for {{ common_backup_service_name }}:

      common_Repository: {{ restic_repository }}
      common_Schedule: {{ backup_schedule }}
      Backup Paths: {{ backup_paths | join(', ') }}
      Service: backup-{{ common_backup_service_name }}.service
      Timer: backup-{{ common_backup_service_name }}.timer
      Script: {{ common_backup_base_path }}/scripts/backup-{{ common_backup_service_name }}.sh

      Logs: {{ common_backup_base_path }}/logs/
      common_Status: {{ 'Enabled' if backup_enabled else 'Disabled' }}
      Restic Version: {{ common_restic_version_check.stdout }}

      Deployed Service Config:
      {{ common_deployed_service_config.stdout_lines | join('\n      ') }}
