---
# Common Docker setup with user namespace mapping
# Used by automation and music-stack roles

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Install Docker if not present
  when: docker_check.rc != 0
  block:
    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - podman-docker
          - containerd
          - runc
        state: absent
      become: true

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        common_update_cache: true
      become: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      become: true

    - name: Add Docker repository to Apt sources
      ansible.builtin.shell: |
        set -o pipefail
        ARCH=$(dpkg --print-architecture)
        CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=$ARCH signed-by=/etc/apt/keyrings/docker.asc] \
        https://download.docker.com/linux/debian $CODENAME stable" | \
        tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache
      ansible.builtin.apt:
        common_update_cache: true
      become: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      become: true
      notify: restart docker

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true
  notify: restart docker

- name: Configure Docker daemon with user namespace mapping
  ansible.builtin.copy:
    content: |
      {
        "userns-remap": "default",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: restart docker

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: Docker
    enabled: true
    state: started
  become: true

- name: Verify Docker Compose plugin installation
  ansible.builtin.command: docker compose version
  register: docker_compose_check
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Test Docker installation with namespace mapping
  ansible.builtin.command: docker run --rm hello-world
  register: docker_test
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
