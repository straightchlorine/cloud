---
- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: common_docker_check
  failed_when: false
  changed_when: false

- name: Install Docker if not present
  when: common_docker_check.rc != 0
  block:
    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - podman-docker
          - containerd
          - runc
        state: absent
      become: true

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      become: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      become: true

    - name: Add Docker repository to Apt sources
      ansible.builtin.shell: |
        set -o pipefail
        ARCH=$(dpkg --print-architecture)
        CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=$ARCH signed-by=/etc/apt/keyrings/docker.asc] \
        https://download.docker.com/linux/debian $CODENAME stable" | \
        tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      become: true
      notify: Restart docker

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true
  notify: Restart docker

- name: Refresh the connection so the new docker group takes effect
  # Ansible reuses one become session per target user, spawned when the
  # connection was established - before this user was added to the docker group
  # above. Resetting re-spawns it with the new groups (idempotent no-op if the
  # user was already a member).
  ansible.builtin.meta: reset_connection

- name: Check if daemon.json exists
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: common_daemon_json_stat
  become: true

- name: Read existing daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: common_daemon_json_content
  become: true
  when: common_daemon_json_stat.stat.exists

- name: Configure Docker daemon with user namespace mapping
  ansible.builtin.copy:
    content: >-
      {{ (common_daemon_json_content.content | b64decode | from_json
      if common_daemon_json_stat.stat.exists
      else {})
      | combine({"userns-remap": "default",
      "log-driver": "json-file",
      "log-opts": {"max-size": "10m", "max-file": "3"}})
      | combine(common_docker_data_root is defined
      | ternary({"data-root": common_docker_data_root}, {})) | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: Restart docker

- name: Verify userns-remap preserved in daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: common_daemon_json_post_merge
  become: true

- name: Assert userns-remap key still present in daemon.json
  ansible.builtin.assert:
    that:
      - "'userns-remap' in (common_daemon_json_post_merge.content | b64decode | from_json)"
    fail_msg: >-
      CRITICAL: userns-remap key was lost from daemon.json during config merge.
      Docker container isolation may be compromised. Restore from backup.
    success_msg: "userns-remap key verified present in daemon.json"

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true

- name: Flush handlers so Docker restarts before reading its userns-remap range
  # A daemon.json change only notifies "Restart docker", which runs at end of
  # play. Flush now so /etc/subuid reflects the active userns-remap, not a
  # pending one.
  ansible.builtin.meta: flush_handlers

- name: Read the Docker userns-remap subordinate UID range
  ansible.builtin.command: grep '^dockremap:' /etc/subuid
  register: common_dockremap_subuid
  changed_when: false
  become: true

- name: Read the Docker userns-remap subordinate GID range
  ansible.builtin.command: grep '^dockremap:' /etc/subgid
  register: common_dockremap_subgid
  changed_when: false
  become: true

- name: Publish the Docker userns-remap base uid/gid facts
  # Under userns-remap, container root is this uid, not real host root: an
  # entrypoint that chowns its bind mount can only do so on dirs this range owns.
  ansible.builtin.set_fact:
    common_dockremap_uid: "{{ common_dockremap_subuid.stdout.split(':')[1] }}"
    common_dockremap_gid: "{{ common_dockremap_subgid.stdout.split(':')[1] }}"

- name: Verify Docker Compose plugin installation
  ansible.builtin.command: docker compose version
  register: common_docker_compose_check
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Test Docker installation with namespace mapping
  ansible.builtin.command: docker run --rm hello-world
  register: common_docker_test
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
