---
# Shared fail-fast checks. Inputs cannot carry a role prefix; they are per-call:
# validation_context: noun phrase for messages ("automation stack")
# validation_type:    full | vault (vault placeholders are checked for both)
# validation_role:    role name, prefixed to every failure message
# required_variables: names that must be defined and non-empty
# vault_placeholders: list of {var, value}; a var still equal to value is refused
# validation_supported_os_families: optional; os_family (from the os role) must be listed
- name: Validate required validation parameters
  ansible.builtin.fail:
    msg: >-
      validation_context, validation_type, and validation_role
      must be explicitly set when calling unified_validation
  when:
    - validation_context is not defined or validation_type is not defined or validation_role is not defined
  tags: [validation]

- name: Validate required variables are defined
  # Looped on purpose: molecule fail-fast cases read the failing names from .results.
  ansible.builtin.fail:
    msg: "[{{ validation_role }}] Required {{ validation_context }} variable '{{ item }}' is not defined or empty"
  when:
    - required_variables is defined
    - vars[item] is not defined or vars[item] == ""
  loop: "{{ required_variables }}"
  tags: [validation, variable_validation]

- name: Validate vault variables are properly set
  ansible.builtin.fail:
    msg: >-
      [{{ validation_role }}] Vault variable '{{ item.var }}' contains placeholder value.
      Please set a real value in vault.yml.
  when:
    - validation_type in ['full', 'vault']
    - vault_placeholders is defined
    - vars[item.var] is defined
    - (vars[item.var] | string) == item.value
  loop: "{{ vault_placeholders }}"
  tags: [validation, vault_validation]

- name: Confirm the host OS family is supported
  ansible.builtin.assert:
    that: os_family in validation_supported_os_families
    fail_msg: >-
      {{ validation_role }} supports only {{ validation_supported_os_families | join(', ') }};
      got {{ os_family }} ({{ os_name }} {{ os_version }}).
    success_msg: "[OK] Supported OS: {{ os_name }} {{ os_version }} ({{ os_family }})."
  when: validation_supported_os_families is defined
  tags: [validation]
