---
# Callers must set common_ntfy_title and common_ntfy_message.
# common_ntfy_priority and common_ntfy_tags are optional.

- name: Validate required ntfy variables
  ansible.builtin.assert:
    that:
      - common_ntfy_title is defined
      - common_ntfy_message is defined
    fail_msg: "common_ntfy_title and common_ntfy_message must be set to call ntfy_notify"
    quiet: true

- name: Send ntfy notification
  ansible.builtin.uri:
    url: "{{ ntfy_server_url }}/{{ ntfy_topic }}"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_ntfy_api_key }}"
      Title: "{{ common_ntfy_title }}"
      Priority: "{{ common_ntfy_priority | default(omit) }}"
      Tags: "{{ common_ntfy_tags | default(omit) }}"
    body: "{{ common_ntfy_message }}"
    body_format: raw
    status_code: 200
  failed_when: false
  no_log: true
  # Never fail the play over a notification; no_log hides the vault API key.
