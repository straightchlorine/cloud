---
- name: Install essential packages using common package management
  ansible.builtin.include_tasks: packages.yml

- name: Configure fail2ban for SSH protection
  ansible.builtin.include_tasks: fail2ban.yml

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  become: true

- name: Configure log rotation
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: /etc/logrotate.d/system-logs
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the ntfy helper and configure unattended-upgrades
  ansible.builtin.include_tasks: base_reapply.yml

- name: Deploy shared dotfiles
  ansible.builtin.include_tasks: dotfiles.yml

- name: Configure Wi-Fi power-save tuning
  ansible.builtin.include_tasks: wifi_powersave.yml
  when: common_wifi_powersave_tuning_enabled

- name: Configure compressed RAM swap
  ansible.builtin.include_tasks: zram.yml
  when: common_zram_enabled
