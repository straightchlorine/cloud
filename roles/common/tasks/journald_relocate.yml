---
# Bind-mount /var/log/journal onto a directory on the stack drive so journal
# growth never wears the SD card. Callers set common_journald_path to a
# directory on their already-mounted storage (must exist and be writable).
# Mirrors the dns role's original inline steps, parameterized for reuse.

- name: Create the journal directory on the drive
  ansible.builtin.file:
    path: "{{ common_journald_path }}"
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  become: true

- name: Stop systemd-journald before relocating storage
  ansible.builtin.systemd:
    name: systemd-journald
    state: stopped
  become: true

- name: Bind-mount the drive's journal directory over /var/log/journal
  ansible.posix.mount:
    path: /var/log/journal
    src: "{{ common_journald_path }}"
    fstype: none
    opts: bind
    state: mounted
  become: true

- name: Ensure journald is configured for persistent storage
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: "Storage=persistent"
  become: true

- name: Start systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: started
  become: true
