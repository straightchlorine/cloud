---
# Install rclone on individual hosts
# Use this when you need rclone on target hosts for other purposes

- name: Install rclone via package manager
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Verify rclone installation
  ansible.builtin.command: rclone version
  register: common_rclone_version_check
  changed_when: false

- name: Display rclone version
  ansible.builtin.debug:
    msg: "Rclone version: {{ common_rclone_version_check.stdout_lines[0] }}"
