---
# Disable 802.11 power save on wireless interfaces. The kernel default parks the
# radio between beacons - tens of milliseconds of extra latency and dropped UDP
# bursts - which breaks DNS for the whole VLAN when the resolver answers over
# Wi-Fi. A boot-time unit, not a deploy-time `iw` call: power save resets to on
# at every boot. No-op on hosts with no wireless interface.
# Opt in per host with common_wifi_powersave_tuning_enabled.

- name: Ensure iw is installed
  ansible.builtin.apt:
    name: iw
    state: present
  become: true

- name: Install the Wi-Fi power-save script
  ansible.builtin.template:
    src: wifi-powersave-off.sh.j2
    dest: /usr/local/bin/wifi-powersave-off
    owner: root
    group: root
    mode: '0755'
  become: true
  notify: Restart wifi-powersave

- name: Deploy the Wi-Fi power-save unit
  ansible.builtin.template:
    src: systemd-service.j2
    dest: /etc/systemd/system/wifi-powersave.service
    owner: root
    group: root
    mode: '0644'
  vars:
    service_description: "Disable 802.11 power save on wireless interfaces"
    service_type: "oneshot"
    # RemainAfterExit so the unit reports as active (exited) - a dead oneshot
    # would look like a failure to anyone checking `systemctl is-active`.
    common_remain_after_exit: "true"
    # network.target, not network-online.target: the radio device exists by the
    # time network.target is reached (brcmfmac loads at boot, ahead of the
    # network managers), and online.target can stall for minutes on hosts
    # without NetworkManager/systemd-networkd-wait-online.
    service_after: ["network.target"]
    common_service_wants: ["network.target"]
    exec_start: "/usr/local/bin/wifi-powersave-off"
    syslog_identifier: "wifi-powersave"
  become: true
  notify:
    - Reload systemd
    - Restart wifi-powersave

- name: Enable and start the Wi-Fi power-save unit
  ansible.builtin.systemd:
    name: wifi-powersave
    enabled: true
    state: started
    daemon_reload: true
  become: true
