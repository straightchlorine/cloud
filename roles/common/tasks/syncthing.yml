---
# Syncthing comes from the official apt repository because the Debian package lags far behind.
#
# It runs as a system-level service rather than a user service.
# User-scope systemd needs a login session and user bus, which headless hosts lack.
#
# Teardown lives in syncthing_teardown.yml so that the teardown playbook never re-runs these install tasks.

- name: Add the Syncthing stable-v2 apt repository
  ansible.builtin.include_tasks: apt_source.yml
  vars:
    common_apt_source_name: syncthing
    common_apt_source_key_url: https://syncthing.net/release-key.gpg
    common_apt_source_key_path: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    common_apt_source_line: >-
      deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg]
      https://apt.syncthing.net/ syncthing stable-v2

- name: Pin Syncthing repo priority to prefer official packages over Debian
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: origin apt.syncthing.net
      Pin-Priority: 990
    dest: /etc/apt/preferences.d/syncthing.pref
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Install Syncthing
  ansible.builtin.apt:
    name: syncthing
    state: present
    update_cache: true
    cache_valid_time: "{{ common_package_cache_valid_time }}"
  become: true

- name: Create Syncthing home directory
  ansible.builtin.file:
    path: "{{ common_syncthing_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: '0750'
  become: true

- name: Deploy the Syncthing system service unit
  ansible.builtin.template:
    src: syncthing.service.j2
    dest: /etc/systemd/system/syncthing.service
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable and start Syncthing
  ansible.builtin.systemd:
    name: syncthing
    enabled: true
    state: started
    daemon_reload: true
  become: true
