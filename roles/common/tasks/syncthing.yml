---
# Install Syncthing from the official apt repository (stable-v2 channel),
# not the Debian package which lags badly. Mirrors the Docker key/repo pattern.
# Opt in fleet-wide via common_syncthing_enabled; configure folders/devices
# per-host in host_vars.
#
# systemctl --user needs the user's systemd instance running. On a headless
# host (no login session) that only happens once loginctl linger is enabled,
# so linger comes before the service is enabled/started.
#
# Teardown tasks at the end are gated on teardown_confirmed (set by a teardown
# playbook after its confirm flag passes - see playbooks/dns-teardown.yml).

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add Syncthing release GPG key
  ansible.builtin.get_url:
    url: https://syncthing.net/release-key.gpg
    dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    mode: '0644'
  become: true
  register: common_syncthing_key
  until: common_syncthing_key is succeeded
  retries: 3
  delay: 2

- name: Add Syncthing stable-v2 apt repository
  ansible.builtin.apt_repository:
    repo: |
      deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg]
      https://apt.syncthing.net/ syncthing stable-v2
    filename: syncthing
    state: present
  become: true
  register: common_syncthing_repo
  until: common_syncthing_repo is succeeded
  retries: 3
  delay: 2

- name: Pin Syncthing repo priority to prefer official packages over Debian
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: origin apt.syncthing.net
      Pin-Priority: 990
    dest: /etc/apt/preferences.d/syncthing.pref
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Install Syncthing
  ansible.builtin.apt:
    name: syncthing
    state: present
    update_cache: true
  become: true

- name: Create Syncthing home directory
  ansible.builtin.file:
    path: "{{ common_syncthing_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user_gid | default(ansible_user) }}"
    mode: '0750'
  become: true

- name: Enable user lingering so the syncthing user service can run headless
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user }}
  become: true
  register: common_syncthing_linger
  changed_when: "'already' not in (common_syncthing_linger.stdout | default(''))"

- name: Enable and start Syncthing user service
  ansible.builtin.systemd:
    name: "syncthing@{{ ansible_user }}.service"
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ ansible_user }}"
  register: common_syncthing_service
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
  # linger was just enabled above; the user manager may take a moment to start,
  # so retry on a transient "cannot connect to user bus" failure.
  until: common_syncthing_service is not failed
  retries: 5
  delay: 3

# ---- Teardown (only runs after a teardown playbook sets teardown_confirmed) ----
- name: Remove Syncthing service configuration
  ansible.builtin.file:
    path: "/etc/systemd/system/syncthing@{{ ansible_user }}.service"
    state: absent
  become: true
  when: teardown_confirmed | default(false) | bool

- name: Disable and stop Syncthing user service
  ansible.builtin.systemd:
    name: "syncthing@{{ ansible_user }}.service"
    enabled: false
    state: stopped
    scope: user
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
  when: teardown_confirmed | default(false) | bool
