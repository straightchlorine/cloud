---
# Common package management tasks
# Standardizes package installation across all roles

- name: Update apt cache
  ansible.builtin.apt:
    common_update_cache: true
    common_cache_valid_time: "{{ package_cache_valid_time }}"
  become: true

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true
  when: common_packages is defined

- name: Install role-specific packages
  ansible.builtin.apt:
    name: "{{ role_specific_packages }}"
    state: present
  become: true
  when: role_specific_packages is defined
