---
- name: Wait for the dpkg frontend lock to clear
  # A running apt-daily/unattended-upgrades holds the lock; racing it makes
  # dpkg --configure -a fail with rc 2. Capped at 10 minutes so a wedged lock fails.
  ansible.builtin.shell: |
    if fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
      echo "locked"
    else
      echo "free"
    fi
  register: common_dpkg_lock_state
  until: common_dpkg_lock_state.stdout == "free"
  retries: 60
  delay: 10
  changed_when: false
  become: true

- name: Recover any interrupted dpkg state
  # A killed apt/dpkg run leaves dpkg half-configured and later installs fail
  # with "dpkg was interrupted". No-op on a healthy box, so it runs every deploy.
  ansible.builtin.command: dpkg --configure -a
  become: true
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ package_cache_valid_time }}"
  become: true

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true
  when: common_packages is defined

- name: Install role-specific packages
  ansible.builtin.apt:
    name: "{{ role_specific_packages }}"
    state: present
  become: true
  when: role_specific_packages is defined
