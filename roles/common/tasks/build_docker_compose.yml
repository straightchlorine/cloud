---
- name: Ensure compose directory exists
  ansible.builtin.file:
    path: "{{ compose_file_path | dirname }}"
    state: directory
    owner: "{{ compose_file_owner }}"
    group: "{{ compose_file_group }}"
    mode: "0755"

- name: Check whether an Ansible-managed compose file already exists
  ansible.builtin.stat:
    path: "{{ compose_file_path }}"
    get_checksum: false
  register: common_compose_existing

- name: Generate Docker Compose file header
  ansible.builtin.copy:
    content: |
      # Generated by Ansible - Do not edit manually
      # Stack: {{ stack_name }}

      services:

    dest: "{{ compose_file_path }}"
    owner: "{{ compose_file_owner }}"
    group: "{{ compose_file_group }}"
    mode: "0644"
  # Only seed a fresh file: rewriting the header on every run would wipe the
  # per-service blocks below and force them all to re-add (an idempotence
  # failure). Managed regions are the blockinfile markers, not the header.
  when: not common_compose_existing.stat.exists

- name: Add each service to compose file
  ansible.builtin.blockinfile:
    path: "{{ compose_file_path }}"
    marker: "# {mark} ANSIBLE MANAGED SERVICE: {{ item.service_name }}"
    block: |
      {{ lookup('template', 'docker-service.yml.j2', template_vars=item) | indent(0, first=False) }}
    insertafter: "^services:"
  loop: "{{ compose_services }}"
  loop_control:
    label: "{{ item.service_name }}"

- name: Add networks section if defined
  ansible.builtin.blockinfile:
    path: "{{ compose_file_path }}"
    marker: "# {mark} ANSIBLE MANAGED NETWORKS"
    block: |2

      networks:
      {% for network in compose_networks %}
        {{ network.name }}:
      {% if network.compose_name is defined %}
          name: {{ network.compose_name }}
      {% endif %}
      {% if network.external is defined and network.external %}
          external: true
      {% elif network.driver is defined %}
          driver: {{ network.driver }}
      {% endif %}
      {% endfor %}
    insertafter: EOF
  when: compose_networks is defined and compose_networks | length > 0

- name: Add volumes section if defined
  ansible.builtin.blockinfile:
    path: "{{ compose_file_path }}"
    marker: "# {mark} ANSIBLE MANAGED VOLUMES"
    block: |2

      volumes:
      {% for volume in compose_volumes %}
        {{ volume.name }}:
          driver: {{ volume.driver }}
      {% if volume.driver_opts is defined %}
          driver_opts:
      {% for key, value in volume.driver_opts.items() %}
            {{ key }}: {{ value }}
      {% endfor %}
      {% endif %}
      {% endfor %}
    insertafter: EOF
  # An empty (or undefined) volumes list must NOT emit a bare `volumes:` key:
  # compose rejects an empty mapping ("volumes must be a mapping"). Bind-mount
  # only stacks (automation) define compose_volumes as [] - omit the section.
  when: compose_volumes is defined and compose_volumes | length > 0

- name: Generate the environment file from vault secrets
  # Compose auto-interpolates a `.env` file placed next to the compose file, so
  # `${VAR}` inside any compose value resolves from here at runtime. 0600 so the
  # secret contents are readable only by the stack user (compose_file_owner).
  ansible.builtin.template:
    src: compose-env.j2
    dest: "{{ compose_file_path | dirname }}/.env"
    owner: "{{ compose_file_owner }}"
    group: "{{ compose_file_group }}"
    mode: "0600"
  when: compose_env_vars is defined
