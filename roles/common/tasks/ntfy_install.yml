---
# Installs the shared ntfy CLI helper on every host, so scripts can just call
# ntfy-notify.sh instead of embedding their own curl/API-key logic.
- name: Install the ntfy notification helper
  ansible.builtin.template:
    src: ntfy-notify.sh.j2
    dest: /usr/local/bin/ntfy-notify.sh
    owner: root
    group: root
    mode: "0700"  # embeds vault_ntfy_api_key
  become: true
