---
# Installs the shared ntfy helper on every host, so scripts call ntfy-notify instead of embedding their own curl and
# key handling.

- name: Ensure the ntfy config directory exists
  ansible.builtin.file:
    path: /etc/ntfy
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the ntfy API key as a separate root-only file (skip if vault_ntfy_api_key is undefined)
  ansible.builtin.copy:
    dest: /etc/ntfy/notify-api-key
    content: "{{ vault_ntfy_api_key }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  become: true
  when: vault_ntfy_api_key is defined

- name: Install the ntfy notification helper
  # The script is world-executable because it reads the API key from /etc/ntfy/notify-api-key at runtime and
  # embeds no secret.
  ansible.builtin.template:
    src: ntfy-notify.j2
    dest: /usr/local/bin/ntfy-notify
    owner: root
    group: root
    mode: "0755"
  become: true
