---
# Registers one folder (common_syncthing_folder: {id, path, type, ignore}); see
# syncthing_share.yml for the fields. Registration is best-effort: the callers' backup
# scripts create their own destinations, so a Syncthing failure must not fail the deploy.
- name: "Write the .stignore for {{ common_syncthing_folder.path }}"
  # The ignore file needs a folder root Syncthing (running as ansible_user) can write; live-data
  # folders leave that root dockremap-owned, so this hands it over. Children stay untouched.
  when: common_syncthing_folder.ignore is defined
  block:
    - name: Ensure the folder root is writable for the ignore file
      ansible.builtin.file:
        path: "{{ common_syncthing_folder.path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0755"
      become: true

    - name: Deploy the folder ignore file
      ansible.builtin.copy:
        content: |
          {% for line in common_syncthing_folder.ignore %}
          {{ line }}
          {% endfor %}
        dest: "{{ common_syncthing_folder.path }}/.stignore"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0644"
      become: true

- name: Register and configure the folder
  when:
    - ansible_facts['services']['syncthing.service'] is defined
    - ansible_facts['services']['syncthing.service']['state'] == 'running'
  block:
    - name: List existing Syncthing folders
      ansible.builtin.command: syncthing cli config folders list
      become: true
      become_user: "{{ ansible_user }}"
      register: common_syncthing_existing_folders
      changed_when: false
      failed_when: false

    - name: "Add the Syncthing folder: {{ common_syncthing_folder.id }}"
      ansible.builtin.command: >-
        syncthing cli config folders add --id "{{ common_syncthing_folder.id }}"
        --label "{{ common_syncthing_folder.id }}" --path "{{ common_syncthing_folder.path }}"
      become: true
      become_user: "{{ ansible_user }}"
      register: common_syncthing_folder_add
      changed_when: common_syncthing_folder_add.rc == 0
      # Best-effort, see the header.
      failed_when: false
      when: common_syncthing_folder.id not in common_syncthing_existing_folders.stdout_lines

    - name: "Read the current folder type: {{ common_syncthing_folder.id }}"
      ansible.builtin.command: syncthing cli config folders {{ common_syncthing_folder.id }} type get
      become: true
      become_user: "{{ ansible_user }}"
      register: common_syncthing_folder_current_type
      changed_when: false
      failed_when: false
      when: common_syncthing_folder.type is defined

    - name: "Set the folder type: {{ common_syncthing_folder.id }}"
      ansible.builtin.command: >-
        syncthing cli config folders {{ common_syncthing_folder.id }} type set {{ common_syncthing_folder.type }}
      become: true
      become_user: "{{ ansible_user }}"
      register: common_syncthing_folder_type_set
      changed_when: common_syncthing_folder_type_set.rc == 0
      # Best-effort, see the header; a wrong type shows in the Syncthing UI.
      failed_when: false
      when:
        - common_syncthing_folder.type is defined
        - common_syncthing_folder.type != common_syncthing_folder_current_type.stdout | trim
