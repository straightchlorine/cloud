---
# Reverse common/tasks/zram.yml - and remove foreign zram a hand-configured box
# may carry (systemd-zram-generator, a hand-rolled unit): the teardown leaves
# the box with no zram at all, whatever created it. Every step no-ops
# idempotently when nothing zram exists. Gated on teardown_confirmed, set only
# by a teardown playbook (see playbooks/dns-teardown.yml).

- name: Tear down zram swap
  when: teardown_confirmed | default(false) | bool
  block:
    - name: Stop and disable the repo's zramswap service
      ansible.builtin.systemd:
        name: zramswap
        enabled: false
        state: stopped
        daemon_reload: true
      become: true
      failed_when: false

    - name: Check whether zram0 is still in use as swap
      # zramswap stop already swapped its own device off; anything left here is
      # foreign (or from a box that never had zram-tools installed).
      ansible.builtin.shell: grep -q '^/dev/zram0 ' /proc/swaps
      register: common_zram_teardown_swap_active
      changed_when: false
      failed_when: false

    - name: Swap off zram0
      ansible.builtin.command: swapoff /dev/zram0
      become: true
      changed_when: true
      failed_when: false
      when: common_zram_teardown_swap_active.rc == 0

    - name: Purge zram packages (the role's zram-tools and any foreign generator)
      ansible.builtin.apt:
        name:
          - zram-tools
          - systemd-zram-generator
        state: absent
        purge: true
        autoremove: true
      become: true

    - name: Find any hand-rolled zram unit files
      # The repo never writes a zram unit into /etc/systemd/system (the unit
      # ships with zram-tools), so anything matching here is foreign.
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "*zram*"
        file_type: file
      register: common_zram_teardown_units

    - name: Delete the hand-rolled zram unit files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ common_zram_teardown_units.files }}"
      loop_control:
        label: "{{ item.path }}"
      become: true

    - name: Check whether the zram device still exists
      ansible.builtin.stat:
        path: /sys/block/zram0
      register: common_zram_teardown_device

    - name: Reset the zram device
      # Frees whatever compressed pages a foreign device still held; the empty
      # device node itself is harmless and disappears at reboot. Best-effort:
      # a container's shared /sys is read-only, and a box without CAP_SYS_ADMIN
      # cannot write the reset file - the swap-off above is the real state.
      ansible.builtin.shell: echo 1 > /sys/block/zram0/reset
      become: true
      changed_when: false
      failed_when: false
      when: common_zram_teardown_device.stat.exists
