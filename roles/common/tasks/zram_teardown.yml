---
- name: Tear down zram swap
  when: teardown_confirmed | default(false) | bool
  block:
    - name: Stop and disable the repo's zramswap service
      ansible.builtin.systemd:
        name: zramswap
        enabled: false
        state: stopped
        daemon_reload: true
      become: true
      failed_when: false

    - name: Check whether zram0 is still in use as swap
      # Stopping zramswap already swaps its device off; anything left is foreign.
      ansible.builtin.shell: grep -q '^/dev/zram0 ' /proc/swaps
      register: common_zram_teardown_swap_active
      changed_when: false
      failed_when: false

    - name: Swap off zram0
      ansible.builtin.command: swapoff /dev/zram0
      become: true
      register: common_zram_teardown_swapoff
      changed_when: common_zram_teardown_swapoff.rc == 0
      failed_when: false
      when: common_zram_teardown_swap_active.rc == 0

    - name: Purge zram packages
      ansible.builtin.apt:
        name:
          - zram-tools
          - systemd-zram-generator
        state: absent
        purge: true
        autoremove: true
      become: true

    - name: Find any hand-rolled zram unit files
      # The repo writes no zram unit here (zram-tools ships its own), so matches are foreign.
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "*zram*"
        file_type: file
      register: common_zram_teardown_units

    - name: Delete the hand-rolled zram unit files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ common_zram_teardown_units.files }}"
      loop_control:
        label: "{{ item.path }}"
      become: true

    - name: Check whether the zram device still exists
      ansible.builtin.stat:
        path: /sys/block/zram0
      register: common_zram_teardown_device

    - name: Reset the zram device
      # Best-effort: a container's read-only /sys or missing CAP_SYS_ADMIN blocks the write.
      ansible.builtin.shell: echo 1 > /sys/block/zram0/reset
      become: true
      changed_when: false
      failed_when: false
      when: common_zram_teardown_device.stat.exists
