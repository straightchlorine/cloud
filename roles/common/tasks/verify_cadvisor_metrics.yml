---
# The cAdvisor compose definition and port are in the common defaults.
# This check lives here too, so consuming roles do not reference those defaults themselves.
- name: Verify cAdvisor /metrics responds
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ common_cadvisor_port }}/metrics"
    method: GET
    timeout: 10
    status_code: [200]
    follow_redirects: none
  register: common_cadvisor_health
  until: common_cadvisor_health.status == 200
  retries: 10
  delay: 3
  tags: [post_validation]
