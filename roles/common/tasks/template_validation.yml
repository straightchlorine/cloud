# Template rendering pre-validation
# Tests template rendering with current variables to catch issues before deployment

- name: Create temporary directory for template testing
  ansible.builtin.tempfile:
    state: directory
    suffix: _template_test
  register: template_test_dir
  tags: [template_validation]

- name: Test critical template rendering (automation role)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ template_test_dir.path }}/{{ item.name }}"
    backup: false
  register: template_test_result
  failed_when: false
  loop:
    - {src: "roles/automation/templates/traefik-static.yml.j2", name: "traefik-static.yml"}
    - {src: "roles/automation/templates/traefik-dynamic.yml.j2", name: "traefik-dynamic.yml"}
    - {src: "roles/automation/templates/docker-compose.yml.j2", name: "docker-compose.yml"}
  when: "'automation' in group_names"
  tags: [template_validation]

- name: Test critical template rendering (DNS role)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ template_test_dir.path }}/{{ item.name }}"
    backup: false
  register: dns_template_test_result
  failed_when: false
  loop:
    - {src: "roles/dns/templates/setupVars.conf.j2", name: "setupVars.conf"}
    - {src: "roles/dns/templates/chrony.conf.j2", name: "chrony.conf"}
  when: "'dns' in group_names"
  tags: [template_validation]

- name: Test critical template rendering (music role)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ template_test_dir.path }}/{{ item.name }}"
    backup: false
  register: music_template_test_result
  failed_when: false
  loop:
    - {src: "roles/music-stack/templates/docker-compose.yml.j2", name: "music-docker-compose.yml"}
    - {src: "roles/music-stack/templates/youtube.env.j2", name: "youtube.env"}
  when: "'music' in group_names and youtube_sync_enabled | default(false)"
  tags: [template_validation]

- name: Check for template rendering failures
  ansible.builtin.fail:
    msg: |
      Template rendering failed for {{ item.item.name }}:
      Error: {{ item.msg | default('Unknown template error') }}

      This indicates missing or invalid vault variables.
      Please check your vault.yml configuration.
  when:
    - item.failed is defined
    - item.failed
  loop: "{{ (template_test_result.results | default([])) + (dns_template_test_result.results | default([])) + (music_template_test_result.results | default([])) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  tags: [template_validation]

- name: Validate rendered template syntax (YAML files)
  ansible.builtin.shell: |
    python3 -c "
    import yaml
    try:
        with open('{{ template_test_dir.path }}/{{ item.item.name }}', 'r') as f:
            yaml.safe_load(f)
        print('Valid YAML')
    except yaml.YAMLError as e:
        print(f'Invalid YAML: {e}')
        exit(1)
    except Exception as e:
        print(f'Error: {e}')
        exit(1)
    "
  register: yaml_validation
  changed_when: false
  failed_when: yaml_validation.rc != 0
  loop: "{{ template_test_result.results | default([]) }}"
  when:
    - item.item.name.endswith('.yml')
    - not item.failed | default(false)
  tags: [template_validation]

- name: Validate Docker Compose syntax (if applicable)
  ansible.builtin.shell: |
    cd "{{ template_test_dir.path }}"
    docker compose -f "{{ item.item.name }}" config --quiet
  register: compose_validation
  changed_when: false
  failed_when: false
  loop: "{{ template_test_result.results | default([]) }}"
  when:
    - item.item.name == "docker-compose.yml"
    - not item.failed | default(false)
  tags: [template_validation]

- name: Report Docker Compose validation issues
  ansible.builtin.debug:
    msg: |
      ⚠️  Docker Compose validation warning for {{ item.item.name }}:
      {{ item.stderr | default('Unknown validation issue') }}

      This may indicate configuration issues that could cause deployment problems.
  when:
    - item.rc is defined
    - item.rc != 0
  loop: "{{ compose_validation.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  tags: [template_validation]

- name: Clean up template test directory
  ansible.builtin.file:
    path: "{{ template_test_dir.path }}"
    state: absent
  tags: [template_validation]

- name: Display template validation results
  ansible.builtin.debug:
    msg: |
      ✅ Template Rendering Validation Results:

      {% if template_test_result.results is defined %}
      Automation Templates:
      {% for result in template_test_result.results %}
      {{ result.item.name }}: {{ '✅ Rendered successfully' if not result.failed else '❌ Failed to render' }}
      {% endfor %}
      {% endif %}

      {% if dns_template_test_result.results is defined %}
      DNS Templates:
      {% for result in dns_template_test_result.results %}
      {{ result.item.name }}: {{ '✅ Rendered successfully' if not result.failed else '❌ Failed to render' }}
      {% endfor %}
      {% endif %}

      {% if music_template_test_result.results is defined %}
      Music Templates:
      {% for result in music_template_test_result.results %}
      {{ result.item.name }}: {{ '✅ Rendered successfully' if not result.failed else '❌ Failed to render' }}
      {% endfor %}
      {% endif %}

      🔧 All templates rendered successfully with current vault variables!
      Ready for safe deployment.
  tags: [template_validation]

