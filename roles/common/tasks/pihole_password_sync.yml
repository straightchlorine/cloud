---
# Pi-hole only applies its admin password at install, so a rotated
# vault_pihole_webpassword never reaches an installed instance on its own.
- name: Check Pi-hole is installed
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: common_pihole_binary

- name: Check Pi-hole accepts the vault admin password
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ vault_pihole_webpassword }}"
    status_code: [200, 401]
  register: common_pihole_password_check
  # An unreachable FTL is not a password problem; only a definite 401 syncs.
  failed_when: false
  no_log: true
  when: common_pihole_binary.stat.exists

- name: Log out of the password check session
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/auth"
    method: DELETE
    headers:
      X-FTL-SID: "{{ common_pihole_password_check.json.session.sid }}"
    status_code: [200, 204]
  when: common_pihole_password_check.status | default(0) == 200
  no_log: true

- name: Sync the Pi-hole admin password to the vault
  ansible.builtin.command:
    argv: [pihole, setpassword, "{{ vault_pihole_webpassword }}"]
  become: true
  no_log: true
  when: common_pihole_password_check.status | default(0) == 401

- name: Record whether the password was synced
  ansible.builtin.set_fact:
    common_pihole_password_synced: "{{ common_pihole_password_check.status | default(0) == 401 }}"
