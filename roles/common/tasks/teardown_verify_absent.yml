---
# common_teardown_name:  role name, used in the messages
# common_teardown_paths: paths that must not exist after the teardown
- name: Look for leftover artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ common_teardown_paths }}"
  register: common_teardown_stats

- name: Assert the artifacts are gone
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: "{{ item.item }} still exists after teardown"
    success_msg: "[OK] {{ item.item }} removed"
  loop: "{{ common_teardown_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
