---
# This reverses syncthing.yml and runs only after a teardown playbook sets teardown_confirmed (see playbooks/dns-
# teardown.yml).
# It removes the service, the package, and the apt repository and keys.

- name: Stop and disable Syncthing service
  ansible.builtin.systemd:
    name: syncthing
    enabled: false
    state: stopped
    daemon_reload: true
  become: true
  failed_when: false

- name: Remove Syncthing service unit
  ansible.builtin.file:
    path: /etc/systemd/system/syncthing.service
    state: absent
  become: true

- name: Remove Syncthing package
  ansible.builtin.apt:
    name: syncthing
    state: absent
    purge: true
  become: true

- name: Remove Syncthing apt repository
  # The file is removed directly because apt_repository refuses to run, even for state: absent, on a host without
  # apt-key.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/syncthing.list
    state: absent
  become: true

- name: Remove Syncthing GPG keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    state: absent
  become: true

- name: Remove Syncthing apt pinning
  ansible.builtin.file:
    path: /etc/apt/preferences.d/syncthing.pref
    state: absent
  become: true

- name: Remove Syncthing home directory (config + data)
  ansible.builtin.file:
    path: "{{ common_syncthing_home }}"
    state: absent
  become: true

- name: Update apt cache after removing Syncthing repo
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Verify the Syncthing artifacts are gone
  ansible.builtin.include_tasks: teardown_verify_absent.yml
  vars:
    common_teardown_name: syncthing
    common_teardown_paths:
      - /etc/systemd/system/syncthing.service
      - /etc/apt/sources.list.d/syncthing.list
      - /etc/apt/keyrings/syncthing-archive-keyring.gpg
      - /etc/apt/preferences.d/syncthing.pref
      - /usr/bin/syncthing
      - "{{ common_syncthing_home }}"
