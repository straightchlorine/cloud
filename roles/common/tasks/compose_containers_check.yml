---
# Hard-fail on any critical compose service that is not running. Callers pass
# compose_file_path/owner/critical_services; needs a live daemon - never molecule.

- name: Get the compose container states
  ansible.builtin.shell: |
    set -o pipefail
    docker compose -f {{ compose_file_path }} ps --format json
  become: true
  become_user: "{{ compose_owner }}"
  changed_when: false
  register: common_compose_ps
  args:
    executable: /bin/bash

- name: Parse the container states
  ansible.builtin.set_fact:
    common_compose_containers: "{{ common_compose_ps.stdout_lines | map('from_json') | list }}"

- name: Fail on non-running critical services
  ansible.builtin.fail:
    msg: >-
      Container {{ item.Service }} is not running (State: {{ item.State }},
      Health: {{ item.Health | default('n/a') }})
  when:
    - item.Service in compose_critical_services
    - item.State != "running"
  loop: "{{ common_compose_containers }}"
  loop_control:
    label: "{{ item.Service }}"

- name: Gather Docker daemon warnings
  ansible.builtin.command: >-
    docker info --format '{{ '{{.Warnings}}' }}'
  become: true
  become_user: "{{ compose_owner }}"
  changed_when: false
  register: common_docker_warnings

- name: Warn on missing memory limit support
  # Compose silently drops deploy.resources without the memory cgroup controller.
  # Only a warning here; validate-deploy.sh is the hard gate.
  ansible.builtin.debug:
    msg: >-
      WARNING: Docker reports "No memory limit support" on this host - the
      compose deploy.resources memory limits are silently discarded (each
      container may use up to all free RAM). See roles/automation/README.md
      "Resource limits vs. cgroup availability" for the check and fix.
  when: "'No memory limit support' in (common_docker_warnings.stdout | default(''))"
