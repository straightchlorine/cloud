---
# Backup pre-flight check for all roles.
# Only checks free disk space: it is included for hosts: all in
# playbooks/site.yml, and hosts that back up via a remote coordinator (e.g.
# pi-dns) have no local common_backup_base_path directory of their own, so any
# check that requires the path to already exist or be writable would hard-fail
# there. Directory creation/writability is exercised for real by
# restic_backup.yml, which is only included on hosts that actually need it.

- name: Check available disk space for backup operations
  ansible.builtin.shell: |
    set -o pipefail
    df --output=avail "$(dirname "{{ common_backup_base_path }}")" | tail -1
  args:
    executable: /bin/bash
  register: common_backup_disk_space
  changed_when: false
  tags: [backup_validation]

- name: Validate sufficient disk space for backup operations
  ansible.builtin.fail:
    msg: >-
      Insufficient disk space for backup operations.
      Available: {{ (common_backup_disk_space.stdout | trim | int / 1024 / 1024) | round(2) }}GB.
      Required: 1GB minimum for backup metadata and temporary files.
  when: (common_backup_disk_space.stdout | trim | int) < 1048576 # 1GB in KB
  tags: [backup_validation]
