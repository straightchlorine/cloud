---
# Pre-flight for every host: only check free disk space. Coordinator-backed
# hosts (e.g. pi-dns) have no local common_backup_base_path, so any check
# requiring the path to exist would hard-fail there; real creation/writability
# is exercised by restic_backup.yml on hosts that actually need it.

- name: Check available disk space for backup operations
  ansible.builtin.shell: |
    set -o pipefail
    df --output=avail "$(dirname "{{ common_backup_base_path }}")" | tail -1
  args:
    executable: /bin/bash
  register: common_backup_disk_space
  changed_when: false
  tags: [backup_validation]

- name: Validate sufficient disk space for backup operations
  ansible.builtin.fail:
    msg: >-
      Insufficient disk space for backup operations.
      Available: {{ (common_backup_disk_space.stdout | trim | int / 1024 / 1024) | round(2) }}GB.
      Required: 1GB minimum for backup metadata and temporary files.
  when: (common_backup_disk_space.stdout | trim | int) < 1048576 # 1GB in KB
  tags: [backup_validation]
