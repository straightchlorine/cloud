---
# One-shot systemd unit that runs `docker compose up -d` at boot for a stack.
# Callers pass stack_service_name, stack_description, stack_home_directory,
# stack_user and (optionally) stack_environment_vars. The exec_* commands
# default to plain `docker compose <verb>` and can be overridden with
# stack_exec_start/stop/reload when a stack needs an explicit -f path (the
# shared systemd template's WorkingDirectory rendering is a known-open issue -
# see its header comment).
- name: Create systemd service for Docker stack auto-start
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: "/etc/systemd/system/{{ stack_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    service_description: "{{ stack_description }}"
    service_requires: ["docker.service"]
    service_after: ["docker.service", "network-online.target"]
    common_service_wants: ["network.target"]
    service_type: "oneshot"
    common_remain_after_exit: "true"
    common_working_directory: "{{ stack_home_directory }}"
    service_user: "{{ stack_user }}"
    service_group: "{{ stack_user }}"
    service_environment: "{{ stack_environment_vars }}"
    exec_start: "{{ stack_exec_start | default('/usr/bin/docker compose up -d') }}"
    exec_stop: "{{ stack_exec_stop | default('/usr/bin/docker compose down') }}"
    exec_reload: "{{ stack_exec_reload | default('/usr/bin/docker compose restart') }}"
    syslog_identifier: "{{ stack_service_name }}"
    common_timeout_start_sec: "0"
    kill_mode: "none"
    # Common security hardening
    common_standard_output: "journal"
    common_standard_error: "journal"
    common_restart_policy: "on-failure"
    common_restart_sec: "5"
    common_wanted_by: "multi-user.target"
    common_enable_security_hardening: true
    common_no_new_privileges: "true"
  become: true
  notify: "Restart {{ stack_service_name }}"

- name: Enable Docker stack service for auto-start
  ansible.builtin.systemd:
    name: "{{ stack_service_name }}"
    enabled: true
    daemon_reload: true
  become: true
