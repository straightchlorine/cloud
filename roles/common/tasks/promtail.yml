# Promtail agent deployment for log shipping to Loki
# Deploys Promtail on service machines to ship logs to central Loki instance

- name: Check if Promtail is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/promtail
  register: promtail_binary

- name: Create promtail user
  ansible.builtin.user:
    name: promtail
    system: yes
    shell: /bin/false
    home: /var/lib/promtail
    create_home: yes
  become: yes

- name: Download and install Promtail binary
  block:
    - name: Download Promtail
      ansible.builtin.get_url:
        url: "https://github.com/grafana/loki/releases/download/v2.9.0/promtail-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.zip"
        dest: /tmp/promtail.zip
        mode: '0644'
      become: yes

    - name: Extract Promtail binary
      ansible.builtin.unarchive:
        src: /tmp/promtail.zip
        dest: /tmp
        remote_src: yes
      become: yes

    - name: Install Promtail binary
      ansible.builtin.copy:
        src: "/tmp/promtail-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
        dest: /usr/local/bin/promtail
        mode: '0755'
        owner: root
        group: root
        remote_src: yes
      become: yes

    - name: Clean up downloaded files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/promtail.zip
        - "/tmp/promtail-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
      become: yes
  when: not promtail_binary.stat.exists

- name: Create Promtail configuration directory
  ansible.builtin.file:
    path: /etc/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: '0755'
  become: yes

- name: Generate Promtail configuration
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: /etc/promtail/promtail.yml
    owner: promtail
    group: promtail
    mode: '0644'
  become: yes
  notify: restart promtail

- name: Create Promtail systemd service
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    mode: '0644'
  become: yes
  notify:
    - reload systemd
    - restart promtail

- name: Create Promtail positions file directory
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: '0755'
  become: yes

- name: Start and enable Promtail service
  ansible.builtin.systemd:
    name: promtail
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes

- name: Verify Promtail is running and healthy
  ansible.builtin.wait_for:
    port: 9080
    host: 127.0.0.1
    delay: 5
    timeout: 30

- name: Check Promtail metrics endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:9080/metrics
    method: GET
    timeout: 10
  register: promtail_metrics
  failed_when: promtail_metrics.status != 200

- name: Display Promtail deployment status
  ansible.builtin.debug:
    msg: |
      ✅ Promtail Agent Deployment Complete for {{ inventory_hostname }}

      Configuration:
      📁 Config: /etc/promtail/promtail.yml
      📊 Metrics: http://127.0.0.1:9080/metrics
      📝 Logs: /var/log/promtail.log
      🎯 Target: {{ loki_server }}:{{ loki_port }}

      Status: {{ '✅ Running' if promtail_metrics.status == 200 else '❌ Failed' }}

      Next: Logs are now being shipped to Loki for centralized aggregation!

