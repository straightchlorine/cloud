---
# Promtail agent deployment for log shipping to Loki
# Deploys Promtail on service machines to ship logs to central Loki instance

- name: Check if Promtail is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/promtail
  register: promtail_binary

- name: Create promtail user
  ansible.builtin.user:
    name: Promtail
    system: true
    shell: /bin/false
    home: /var/lib/promtail
    createhome: true
  become: true

- name: Download and install Promtail binary
  when: not promtail_binary.stat.exists
  block:
    - name: Download Promtail
      ansible.builtin.get_url:
        url: "https://github.com/grafana/loki/releases/download/v2.9.0/promtail-linux-{{ arch }}.zip"
        dest: /tmp/promtail.zip
        mode: '0644'
      vars:
        arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
      become: true

    - name: Extract Promtail binary
      ansible.builtin.unarchive:
        src: /tmp/promtail.zip
        dest: /tmp
        remote_src: true
      become: true

    - name: Install Promtail binary
      ansible.builtin.copy:
        src: "/tmp/promtail-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
        dest: /usr/local/bin/promtail
        mode: '0755'
        owner: root
        group: root
        remote_src: true
      become: true

    - name: Clean up downloaded files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/promtail.zip
        - "/tmp/promtail-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
      become: true

- name: Create Promtail configuration directory
  ansible.builtin.file:
    path: /etc/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: '0755'
  become: true

- name: Generate Promtail configuration
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: /etc/promtail/promtail.yml
    owner: promtail
    group: promtail
    mode: '0644'
  become: true
  notify: restart promtail

- name: Create Promtail systemd service
  ansible.builtin.template:
    src: systemd-service.j2
    dest: /etc/systemd/system/promtail.service
    mode: '0644'
  vars:
    service_description: "Promtail log shipping agent"
    common_service_wants: ["network-online.target"]
    service_after: ["network-online.target"]
    service_type: "simple"
    service_user: "promtail"
    service_group: "promtail"
    exec_start: "/usr/local/bin/promtail -config.file=/etc/promtail/promtail.yml"
    restart_policy: "always"
    restart_sec: "5"
    syslog_identifier: "promtail"
    kill_mode: "mixed"
    kill_signal: "SIGINT"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["/var/lib/promtail"]
    protect_kernel_tunables: "yes"
    protect_kernel_modules: "yes"
    protect_control_groups: "yes"
    limit_nofile: "65536"
    memory_max: "128M"
  become: true
  notify:
    - reload systemd
    - restart promtail

- name: Create Promtail positions file directory
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: '0755'
  become: true

- name: Start and enable Promtail service
  ansible.builtin.systemd:
    name: Promtail
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Verify Promtail is running and healthy
  ansible.builtin.wait_for:
    port: 9080
    host: 127.0.0.1
    delay: 5
    timeout: 30

- name: Check Promtail metrics endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:9080/metrics
    method: GET
    timeout: 10
  register: promtail_metrics
  failed_when: promtail_metrics.status != 200

- name: Display Promtail deployment status
  ansible.builtin.debug:
    msg: |
      [OK] Promtail Agent Deployment Complete for {{ inventory_hostname }}

      Configuration:
      📁 Config: /etc/promtail/promtail.yml
      [STATS] Metrics: http://127.0.0.1:9080/metrics
      [NOTE] Logs: /var/log/promtail.log
      [TARGET] Target: {{ loki_server }}:{{ loki_port }}

      common_Status: {{ '[OK] Running' if promtail_metrics.status == 200 else '[FAIL] Failed' }}

      Next: Logs are now being shipped to Loki for centralized aggregation!
