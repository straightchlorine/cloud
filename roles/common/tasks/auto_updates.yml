---
- name: Set PATH for root's crontab
  # Cron's default PATH often excludes /usr/local/bin, where the cron-invoked scripts live.
  ansible.builtin.cron:
    name: PATH
    env: true
    value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    user: root
  become: true

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  become: true

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure apt timer drop-in directories exist
  # The template module does not create parent directories and Debian ships no drop-in dirs.
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.timer.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - apt-daily
    - apt-daily-upgrade
  become: true

- name: Schedule package maintenance in the night window
  # The timers need a restart, not just a daemon-reload, to re-arm on the new calendar.
  ansible.builtin.template:
    src: apt-daily-timer-override.j2
    dest: "/etc/systemd/system/{{ item }}.timer.d/override.conf"
    owner: root
    group: root
    mode: '0644'
  loop:
    - apt-daily
    - apt-daily-upgrade
  become: true
  notify:
    - Reload systemd
    - Restart apt timers

- name: Compute reboot notification time
  # Updates run at common_auto_updates_run_time and the reboot follows the same morning. A longer lead
  # would fire after the reboot already cleared /var/run/reboot-required.
  ansible.builtin.set_fact:
    common_reboot_notify_total_minutes: >-
      {{ ((common_auto_updates_reboot_time.split(':')[0] | int * 60
      + common_auto_updates_reboot_time.split(':')[1] | int - 180) % 1440) }}
  when: common_auto_updates_reboot_if_required

- name: Create reboot-pending notification script
  ansible.builtin.template:
    src: reboot-notify.j2
    dest: /usr/local/bin/reboot-notify
    owner: root
    group: root
    mode: '0755'
  become: true
  when: common_auto_updates_reboot_if_required

- name: Schedule reboot-pending notification
  ansible.builtin.cron:
    name: "Reboot pending notification"
    minute: "{{ common_reboot_notify_total_minutes | int % 60 }}"
    hour: "{{ common_reboot_notify_total_minutes | int // 60 }}"
    job: "/usr/local/bin/reboot-notify"
    user: root
  become: true
  when: common_auto_updates_reboot_if_required
