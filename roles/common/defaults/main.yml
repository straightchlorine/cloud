---
# Default values for common role

# Security Configuration
common_fail2ban_enabled: true
common_fail2ban_ssh_maxretry: 3
common_fail2ban_ssh_bantime: 600

# Unattended-upgrades (every host). Automatic-Reboot is off by default -
# opt in per host; reboot time only matters when it's on.
common_auto_updates_reboot_if_required: false
common_auto_updates_reboot_time: "03:00"

# Common System Packages (can be overridden in group_vars)
common_packages:
  - curl
  - wget
  - git
  - htop
  - vim
  - tmux
  - ufw
  - fail2ban
  - logrotate
  - rsync
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release

# Common Storage Configuration
common_filesystem_utilities:
  - e2fsprogs
  - parted
  - dosfstools

# SSD configuration defaults
common_ssd_filesystem: "ext4"
common_ssd_mount_options: "defaults,noatime,errors=remount-ro"
common_ssd_format: false

# Stack management
common_start_stack: true

# Systemd service defaults
common_remain_after_exit: "false"
common_standard_output: "journal"
common_standard_error: "journal"
common_restart_policy: "no"
common_restart_sec: "5"
common_wanted_by: "multi-user.target"
common_enable_security_hardening: true
common_no_new_privileges: "true"

# Backup integration defaults
common_backup_additional_groups: []
common_backup_nice_level: 19
common_backup_io_class: "idle"

# Port connectivity testing
common_firewall_ports: []

# Docker service defaults
common_service_restart: "always"

# Per-platform Docker resource limits, consumed by detect_hardware.yml as
# hardware_limits (roles/common/tasks/detect_hardware.yml). pc and unknown
# intentionally carry three extra services (grafana, prometheus, loki) that
# rpi4/rpi3 do not - do not normalize this away.
common_hardware_profiles:
  rpi4:
    traefik:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    influxdb3:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    vaultwarden:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    navidrome:
      memory: "512M"
      cpus: "1.5"
      memory_reservation: "256M"
      cpus_reservation: "0.75"
    portainer:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    beets:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    dozzle:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
  rpi3:
    traefik:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    influxdb3:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.75"
    vaultwarden:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    navidrome:
      memory: "256M"
      cpus: "1.0"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    portainer:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    beets:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
    dozzle:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
  pc:
    traefik:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    influxdb3:
      memory: "2G"
      cpus: "4.0"
      memory_reservation: "1G"
      cpus_reservation: "2.0"
    vaultwarden:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    navidrome:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    portainer:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    grafana:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    prometheus:
      memory: "2G"
      cpus: "4.0"
      memory_reservation: "1G"
      cpus_reservation: "2.0"
    loki:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    beets:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    dozzle:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
  unknown: &common_hardware_profile_conservative
    traefik:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    influxdb3:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    vaultwarden:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    navidrome:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    portainer:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    grafana:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    prometheus:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    loki:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    beets:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
    dozzle:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
  # rpi2 previously had no branch at all, leaving hardware_limits undefined
  # for device_type: rpi2b - reuse the conservative "unknown" profile here
  # until real rpi2-specific numbers are measured.
  rpi2: *common_hardware_profile_conservative
