---
# The chrony task syncs the clock on every fleet host.
# These two variables gate whether this host also serves NTP to other hosts.
# Serving adds the `allow` lines in chrony.conf.j2 and needs a matching firewall rule from the owning role.
common_ntp_server_enabled: false
common_ntp_allowed_networks: []

# Security Configuration
common_fail2ban_enabled: true
common_fail2ban_ssh_maxretry: 3
common_fail2ban_ssh_bantime: 600

# Automatic reboot is off by default and each host opts in.
# The default reboot time leaves room for a nightly restic run, and an interrupted run is reported by restic-job
# freshness.
# Hosts override the time so that DNS is back up before the others reboot.
common_auto_updates_reboot_if_required: false
common_auto_updates_reboot_time: "05:00"
# Runs at night because Debian's default daytime dpkg run stalls small hosts.
# It must finish before the app-update and backup jobs start.
common_auto_updates_run_time: "01:00"

# An apt cache younger than this many seconds is not refreshed again.
common_package_cache_valid_time: 21600

common_packages:
  - curl
  - wget
  - git
  - htop
  - btop
  - vim
  - tmux
  # roles/media/files/pick-core.sh uses fzf for album assignment and quarantine removal.
  - fzf
  - mosh
  # Kitty sends TERM=xterm-kitty over ssh, and tmux refuses to start without this terminfo entry.
  - kitty-terminfo
  - ufw
  - fail2ban
  # The ansible.builtin.cron jobs need the crontab binary, which slim cloud images do not ship.
  - cron
  - logrotate
  - rsync
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release

common_log_rotation_days: 30
common_log_compression: true

common_ssd_filesystem: "ext4"
common_ssd_mount_options: "defaults,noatime,errors=remount-ro"
common_ssd_format: false

# Stack management
common_start_stack: true
# The systemd unit name that docker_stack_service, stack_start, teardown_stack_service and the "Restart stack"
# handler share.
common_stack_unit: stack
common_stack_restart_sec: "5"

common_remain_after_exit: "false"
common_standard_output: "journal"
common_standard_error: "journal"
common_restart_policy: "no"
common_restart_sec: "5"
common_wanted_by: "multi-user.target"
common_enable_security_hardening: true
common_no_new_privileges: "true"

common_rpi_cgroup_memory_enabled: true

# Opt-in per host: Wi-Fi-only boards must not park the radio, and low-RAM boards
# do better with zram than SD-card swap.
common_wifi_powersave_tuning_enabled: false
common_zram_enabled: false
common_zram_algorithm: "zstd"
common_zram_percent: 50
common_zram_priority: 100

# systemd's default cap is 10% of the filesystem, i.e. gigabytes of flash writes.
common_journald_system_max_use: "50M"

common_service_restart: "always"
# docker-service.yml.j2 fills these into any healthcheck key a compose service leaves out.
common_service_healthcheck_defaults:
  interval: 30s
  timeout: 10s
  retries: "3"
  start_period: 40s

# Setting common_syncthing_enabled to true installs Syncthing on the host.
# Teardown has no flag of its own and runs when a teardown playbook sets teardown_confirmed (see playbooks/dns-
# teardown.yml).
common_syncthing_enabled: false
common_syncthing_home: "/home/{{ ansible_user }}/.config/syncthing"

# Watchtower updates only containers labelled com.centurylinklabs.watchtower.enable=true, so pinned images stay put.
# It needs common_watchtower_env_vars in the stack .env.
#
# By default Watchtower skips its own update when it has a published port, because the renamed new container would
# collide on that port.
# WATCHTOWER_EPHEMERAL_SELF_UPDATE avoids this by updating through a short-lived helper container.
common_watchtower_port: 8084
common_watchtower_schedule: "0 0 2 * * *"
common_watchtower_compose_service:
  service_name: watchtower
  service_image: "nickfedor/watchtower:latest"
  service_userns_mode: "host"
  service_ports:
    - host: "{{ common_watchtower_port }}"
      container: 8080
      bind_ip: "{{ primary_ip }}"
  service_environment:
    - "WATCHTOWER_LABEL_ENABLE=true"
    - "WATCHTOWER_SCHEDULE={{ common_watchtower_schedule }}"
    - "WATCHTOWER_CLEANUP=true"
    - "WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}"
    # The machine's own hostname is used instead of the inventory alias, and it differs from the alias on some hosts.
    - "WATCHTOWER_NOTIFICATIONS_HOSTNAME={{ ansible_facts['hostname'] }}"
    - "WATCHTOWER_NO_STARTUP_MESSAGE=true"
    - "WATCHTOWER_HTTP_API_ENDPOINTS=health,metrics"
    - "WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}"
    - "WATCHTOWER_EPHEMERAL_SELF_UPDATE=true"
  service_volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
  service_networks:
    - stack
  service_resources:
    limits:
      memory: 256M
      cpus: "0.5"
    reservations:
      memory: 128M
      cpus: "0.1"
common_watchtower_env_vars:
  WATCHTOWER_API_TOKEN: "{{ vault_watchtower_api_token }}"
  # The shoutrrr ntfy URL carries the token as the basic-auth password, and ntfy rejects it when sent as a username.
  # An empty URL keeps Watchtower silent.
  WATCHTOWER_NOTIFICATION_URL: >-
    {{ 'ntfy://:' ~ vault_ntfy_api_key ~ '@' ~
    (ntfy_server_url | regex_replace('^https?://', '')) ~ '/' ~ ntfy_topic
    if vault_ntfy_api_key is defined else '' }}

# Only the monitoring host may scrape this port, which each host's firewall_rules in host_vars enforce.
common_cadvisor_port: 8085
common_cadvisor_compose_service:
  service_name: cadvisor
  # The minor version is bumped by hand, so only patch releases arrive without review.
  service_image: "ghcr.io/google/cadvisor:0.60"
  # cAdvisor reads the Docker socket, like Watchtower does, so it needs the host user namespace.
  service_userns_mode: "host"
  service_command:
    - "--housekeeping_interval=10s"
    - "--docker_only=true"
    - "--store_container_labels=false"
    - "--disable_metrics=advtcp,udp,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,tcp"
  service_ports:
    - host: "{{ common_cadvisor_port }}"
      container: 8080
      bind_ip: "{{ primary_ip }}"
  # The data-root fact exists only on hosts that set up the SSD, and other hosts use Docker's default path.
  service_volumes:
    - "/:/rootfs:ro"
    - "/var/run:/var/run:ro"
    - "/sys:/sys:ro"
    - "{{ common_docker_data_root if common_docker_data_root is defined else '/var/lib/docker' }}:/var/lib/docker:ro"
    - "/dev/disk:/dev/disk:ro"
  service_networks:
    - stack
  service_labels:
    - "com.centurylinklabs.watchtower.enable=true"
  service_resources:
    limits:
      memory: 192M
      cpus: "0.3"
    reservations:
      memory: 64M
      cpus: "0.05"
