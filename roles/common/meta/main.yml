---
# Ansible Galaxy metadata for the common role
# https://docs.ansible.com/ansible/latest/galaxy/galaxy_role.html
# Not published to Galaxy; kept minimal (schema requires galaxy_info to carry
# min_ansible_version - decorative fields like author/company/galaxy_tags are
# dropped since they serve no purpose for a private role).

galaxy_info:
  namespace: homelab
  role_name: common
  description: Common tasks for Raspberry Pi homelab infrastructure
  license: MIT

  # Ansible version requirement (must be 2.15 or higher)
  min_ansible_version: "2.15"

  # Supported platforms
  platforms:
    - name: Debian
      versions:
        - bookworm # Debian 12
        - trixie # Debian 13

    - name: Ubuntu
      versions:
        - jammy # Ubuntu 22.04 LTS
        - noble # Ubuntu 24.04 LTS

# Collections required for this role
collections:
  - ansible.utils
  - community.general

# Role dependencies (empty for common role)
dependencies: []
