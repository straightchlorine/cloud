---
# Handlers for common role

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: Fail2ban
    state: restarted
  become: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: Rsyslog
    state: restarted
  become: true

- name: Restart docker
  ansible.builtin.systemd:
    name: Docker
    state: restarted
  become: true

# Common systemd handler - used by multiple roles
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# Generic systemd service restart handler - parameterized for any service
- name: Restart systemd service
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: restarted
  become: true

# Backup service restart handler
- name: Restart backup service
  ansible.builtin.systemd:
    name: "backup-{{ backup_service_name }}.service"
    state: restarted
    daemon_reload: true
  become: true

# Backup timer restart handler
- name: Restart backup timer
  ansible.builtin.systemd:
    name: "backup-{{ backup_service_name }}.timer"
    state: restarted
    enabled: true
    daemon_reload: true
  become: true

# Common Docker Compose stack restart handler - parameterized for different stacks
- name: Restart docker compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ stack_home }}"
    state: restarted
  become_user: "{{ ansible_user }}"

# Common Docker Compose stack rollback handler - parameterized for different stacks
- name: Rollback docker compose stack
  block:
    - name: Stop current stack
      community.docker.docker_compose_v2:
        project_src: "{{ stack_home }}"
        state: absent
      become: true
      become_user: "{{ ansible_user }}"
      ignore_errors: true

    - name: Restore from backup if available
      ansible.builtin.shell: |
        if [ -f "{{ stack_home }}/docker-compose.yml.backup" ]; then
          mv "{{ stack_home }}/docker-compose.yml.backup" "{{ stack_home }}/docker-compose.yml"
        fi
      become_user: "{{ ansible_user }}"
      ignore_errors: true

    - name: Start restored stack
      community.docker.docker_compose_v2:
        project_src: "{{ stack_home }}"
        state: present
      become: true
      become_user: "{{ ansible_user }}"
      ignore_errors: true
