---
- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true
  become: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  become: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart stack
  ansible.builtin.systemd:
    name: "{{ common_stack_unit }}"
    state: restarted
    daemon_reload: true
  become: true

- name: Restart apt timers
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    state: restarted
    enabled: true
  loop:
    - apt-daily
    - apt-daily-upgrade
  become: true

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true

- name: Restart wifi-powersave
  ansible.builtin.systemd:
    name: wifi-powersave
    state: restarted
  become: true

- name: Restart zramswap
  ansible.builtin.systemd:
    name: zramswap
    state: restarted
  become: true

- name: Request a reboot
  # unattended-upgrades reboots after its next run when this file exists (Automatic-Reboot), and reboot-notify
  # announces it beforehand.
  ansible.builtin.copy:
    content: "*** System restart required ***\n"
    dest: /var/run/reboot-required
    owner: root
    group: root
    mode: "0644"
  become: true
