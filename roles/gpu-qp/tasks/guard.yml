---
# Refuses to deploy over a benchmark run, because a copy under a running cell changes what the next start snapshots.
# The dispatcher swap would also race a command in flight.
# Fails closed: any result but "free" aborts, and main.yml imports it under `always` so every --tags run meets it.

- name: Probe the benchmark lock
  # A static import lets the tags of the importing task reach the probe.
  ansible.builtin.import_tasks: lock_probe.yml

- name: Look for bench processes
  # This also catches a .lock replaced under a live run.
  # The pattern matches scripts named supervise, phase or lane, with or without a gpu-qp- prefix.
  # Editors, tail and ansible do not match it.
  ansible.builtin.command:
    argv: [pgrep, -af, '^bash .*/(gpu-qp-)?(supervise|phase|lane)\.sh']
  register: gpu_qp_guard_procs
  # Pgrep exits 1 when nothing matches, and the refusal task below reads the exit code.
  failed_when: false
  changed_when: false
  check_mode: false

- name: Refuse to deploy while a benchmark run is live
  ansible.builtin.fail:
    # The default applies when only the lock is held, because then there is no process line to show.
    msg: >-
      benchmark run in progress
      ({{ gpu_qp_guard_procs.stdout_lines | first | default('lock held, see ' ~ gpu_qp_bench_path ~ '/.active') }});
      deploy after it ends or pass --skip-tags bench-guard
  when: >-
    gpu_qp_guard_procs.rc != 1
    or gpu_qp_lock_held
