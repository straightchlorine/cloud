---
- name: Refresh the apt cache when it is stale
  ansible.builtin.include_role:
    name: common
    tasks_from: package_cache_update

- name: Install the kernel headers matching the running kernel
  ansible.builtin.apt:
    name: "{{ gpu_qp_driver_headers_packages }}"
    state: present
  become: true

- name: Install the NVIDIA driver packages
  ansible.builtin.apt:
    name: "{{ gpu_qp_driver_packages }}"
    state: present
  become: true

- name: Check whether the NVIDIA kernel module is already built
  # Debian ships the module as nvidia-current.ko.xz, and other builds ship it as nvidia.ko.
  ansible.builtin.find:
    paths: "/lib/modules/{{ ansible_kernel }}/updates/dkms"
    patterns: ["nvidia.ko*", "nvidia-current.ko*"]
  register: gpu_qp_nvidia_module
  become: true

- name: Build the NVIDIA kernel module with DKMS
  # nvidia-kernel-dkms ships source only, so dkms compiles it against the headers installed above.
  # The task is guarded on the built module so that a converged host is not rebuilt on every run.
  ansible.builtin.command:
    cmd: dkms autoinstall
  become: true
  when: gpu_qp_nvidia_module.matched == 0
  changed_when: true

- name: Refresh the initramfs so the new module loads at boot
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  become: true
  when: gpu_qp_nvidia_module.matched == 0
  changed_when: true

- name: Load the NVIDIA kernel module now
  community.general.modprobe:
    name: nvidia
    state: present
  become: true
  when: gpu_qp_nvidia_module.matched == 0
