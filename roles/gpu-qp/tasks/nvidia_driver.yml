---
- name: Install the kernel headers matching the running kernel
  ansible.builtin.apt:
    name: "{{ gpu_qp_driver_headers_packages }}"
    state: present
    update_cache: true
  become: true

- name: Install the NVIDIA driver packages
  ansible.builtin.apt:
    name: "{{ gpu_qp_driver_packages }}"
    state: present
  become: true

- name: Check whether the NVIDIA kernel module is already built
  # Debian ships it as nvidia-current.ko.xz, other builds as nvidia.ko.
  ansible.builtin.find:
    paths: "/lib/modules/{{ ansible_kernel }}/updates/dkms"
    patterns: ["nvidia.ko*", "nvidia-current.ko*"]
  register: gpu_qp_nvidia_module
  become: true

- name: Build the NVIDIA kernel module with DKMS
  # nvidia-kernel-dkms ships source only; dkms compiles it against the headers
  # installed above. Guarded on the built artifact so a converged host is a no-op
  # instead of an always-changed rebuild.
  ansible.builtin.command:
    cmd: dkms autoinstall
  become: true
  when: gpu_qp_nvidia_module.matched == 0
  changed_when: true

- name: Refresh the initramfs so the new module loads at boot
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  become: true
  when: gpu_qp_nvidia_module.matched == 0
  changed_when: true

- name: Load the NVIDIA kernel module now
  community.general.modprobe:
    name: nvidia
    state: present
  become: true
  when: gpu_qp_nvidia_module.matched == 0
