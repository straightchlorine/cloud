---
# Needs a Docker daemon, so molecule never runs this file.

- name: Clone the quantum-pipeline source for a local build
  # Cloned once. After that `gpu-qp pull` owns the checkout, so a deploy never
  # resets a pulled branch back to gpu_qp_image_ref.
  ansible.builtin.git:
    repo: "{{ gpu_qp_image_repo }}"
    dest: "{{ gpu_qp_source_path }}"
    version: "{{ gpu_qp_image_ref }}"
    depth: 1
    update: false
  become: true
  become_user: "{{ ansible_user }}"
  when: gpu_qp_image_mode == 'build'

- name: Remove the composed Dockerfile earlier role versions generated
  # ponytail: migration only - drop once every host has run this once
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ gpu_qp_source_path }}/docker/Dockerfile.gpu.pinned"
    - "{{ gpu_qp_home }}/Dockerfile.gpu.pinned"
  become: true
  when: gpu_qp_image_mode == 'build'

- name: Build the GPU image for the target CUDA architecture
  # qiskit-aer is compiled with the CUDA thrust backend for gpu_qp_cuda_arch.
  # `gpu-qp build` passes the role's settings as build args, skips the build
  # when nothing changed and logs to gpu_qp_log_path.
  ansible.builtin.command:
    argv: "{{ ['/usr/local/bin/gpu-qp', 'build']
              + (['--force'] if gpu_qp_image_force_rebuild | bool else []) }}"
  register: gpu_qp_build
  changed_when: "'up to date' not in gpu_qp_build.stdout"
  become: true
  become_user: "{{ ansible_user }}"
  when: gpu_qp_image_mode == 'build'

- name: Pull the prebuilt GPU image
  community.docker.docker_image:
    name: "{{ gpu_qp_image_pull_name }}"
    source: pull
  become: true
  become_user: "{{ ansible_user }}"
  when: gpu_qp_image_mode == 'pull'
