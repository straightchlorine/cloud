---
# Docker-free, so molecule converges this file directly.

- name: Create the gpu-qp directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ gpu_qp_home }}"
    - "{{ gpu_qp_data_path }}"
    - "{{ gpu_qp_gen_path }}"
    - "{{ gpu_qp_log_path }}"

- name: Render the molecules input file
  ansible.builtin.template:
    src: molecules.json.j2
    dest: "{{ gpu_qp_data_path }}/molecules.json"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Install the gpu-qp host tool
  ansible.builtin.template:
    src: gpu-qp.sh.j2
    dest: /usr/local/bin/gpu-qp
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Remove the per-command tools earlier role versions installed
  # ponytail: migration only - drop once every host has run this once
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  become: true
  loop: [gpu-qp-run, gpu-qp-check, gpu-qp-pull, gpu-qp-build]
