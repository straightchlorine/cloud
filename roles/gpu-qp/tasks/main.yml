---
# The os role runs first because validate.yml asserts on its os_family fact.
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [gpu-qp, validation, facts]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run gpu-qp deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Refuse to deploy over a running benchmark
  # A static import applies the tags to the tasks inside, and `always` makes the guard run under every --tags.
  # Skip it with --skip-tags bench-guard.
  ansible.builtin.import_tasks: guard.yml
  tags: [always, bench-guard]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    # The common task files name their inputs without this role's prefix.
    role_specific_packages: "{{ gpu_qp_specific_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Install the NVIDIA driver
  ansible.builtin.include_tasks: nvidia_driver.yml
  when: gpu_qp_driver_install
  tags: [driver, nvidia]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Install the NVIDIA container toolkit
  # This must follow the Docker setup because nvidia-ctk edits the daemon.json that setup wrote.
  # The task file restarts Docker itself when the running daemon lacks the runtime.
  # A static import lets the tags reach the tasks inside.
  ansible.builtin.import_tasks: nvidia_container_toolkit.yml
  when: gpu_qp_container_toolkit_enabled
  tags: [docker, nvidia, toolkit]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Re-apply the shared dotfiles (tmux)
  # A tag-scoped run such as --tags gpu-qp skips the site.yml base play that applies the common role.
  # This task applies the fleet dotfiles on such a run.
  ansible.builtin.include_role:
    name: common
    tasks_from: dotfiles
  tags: [gpu-qp, common, base]

- name: Prepare the data directories and the run wrapper
  # A static import lets the tag reach the tasks inside, so --tags data runs them.
  ansible.builtin.import_tasks: data.yml
  tags: [data]

- name: Hold the kernel and the NVIDIA stack while benchmark work is pending
  # This must follow data.yml, which installs the guard script.
  # A static import lets the tags reach the tasks inside.
  ansible.builtin.import_tasks: kernel_guard.yml
  tags: [kernel-guard, driver, nvidia]

- name: Prepare the GPU image
  ansible.builtin.include_tasks: image.yml
  tags: [image, build]

- name: Create Docker stack systemd service
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    common_stack_description: "gpu-qp stack (quantum-pipeline GPU worker + nvidia exporter)"
    common_stack_home: "{{ gpu_qp_home }}"
    common_stack_user: "{{ ansible_user }}"
    common_stack_environment_vars:
      - "GPU_QP_HOME={{ gpu_qp_home }}"
    # A longer restart delay gives a driver that is not ready at boot more time
    # before systemd's start limit stops the retries.
    common_stack_restart_sec: "30"
  tags: [systemd, auto-start]

- name: Deploy the gpu-qp stack
  # This runs last so that the driver, toolkit and firewall are in place before the GPU containers are exposed.
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Start the stack unit and flush handlers
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_start
  tags: [systemd, auto-start, stack]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  # common_start_stack belongs to common, whose defaults are not loaded when a tag-scoped run skips all common includes.
  # The default mirrors the one in common, as CLAUDE.md allows for cross-role feature flags.
  # A false value leaves the stack stopped, so its endpoints must not be probed.
  when: common_start_stack | default(true) | bool
  tags: [post_validation]
