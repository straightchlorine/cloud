---
- name: Verify gpu-qp fail-fast-validation
  hosts: all
  become: true
  vars_files:
    - cases.yml
  tasks:
    - name: Assert every case failed for its own reason
      vars:
        molecule_case_ids: "{{ molecule_cases | map(attribute='id') | list }}"
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_markers.yml"
