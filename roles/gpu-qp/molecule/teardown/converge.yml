---
# The NVIDIA driver and toolkit stay out: the teardown leaves them alone and a container cannot install them.
- name: Converge gpu-qp teardown
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  vars:
    gpu_qp_worker_device: "all"
  tasks:
    - name: Gather network facts
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Arrange the deployed state and check the bench gate
      # A rerun would re-create what the teardown removed, and the gate would find no run tree to refuse.
      tags: [molecule-idempotence-notest]
      block:
        - name: Deploy the data directories and the run wrapper
          ansible.builtin.include_role:
            name: gpu-qp
            tasks_from: data

        - name: Render the stack
          ansible.builtin.include_role:
            name: gpu-qp
            tasks_from: stack

        - name: Install the stack unit
          ansible.builtin.include_role:
            name: common
            tasks_from: docker_stack_service
          vars:
            common_start_stack: true
            common_stack_description: "gpu-qp stack (molecule)"
            common_stack_home: "{{ gpu_qp_home }}"
            common_stack_user: "{{ ansible_user }}"
            common_stack_environment_vars:
              - "GPU_QP_HOME={{ gpu_qp_home }}"

        - name: Create a run tree directory
          ansible.builtin.file:
            path: "{{ gpu_qp_home }}/bench/x/A"
            state: directory
            mode: "0755"

        - name: Create the run state file
          ansible.builtin.copy:
            content: ""
            dest: "{{ gpu_qp_home }}/bench/x/A/state.tsv"
            force: false
            mode: "0644"

        - name: Refuse to delete a run tree
          vars:
            molecule_case:
              id: bench-gate-run-tree
              expect: "run trees exist under /home/gpu/gpu-qp/bench; copy them off first:"
          block:
            - name: Run the bench gate without the discard flag
              ansible.builtin.include_role:
                name: gpu-qp
                tasks_from: teardown_bench_gate

            - name: Fail when the gate lets a run tree through
              ansible.builtin.fail:
                msg: "teardown_bench_gate.yml let a run tree through"
          rescue:
            - name: Assert the gate asked for a copy first
              ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"

    - name: Flush handlers between deploy and teardown
      # On a real host these are separate runs, and a pending restart would fire after the unit is removed.
      ansible.builtin.meta: flush_handlers

    - name: Run the teardown
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: teardown
      vars:
        teardown_confirmed: true
        # The gate passes with the flag, and the run tree must go with the home.
        gpu_qp_teardown_discard_bench: true
