---
# Deploys the container-safe parts of the role, then runs the real teardown with its gate satisfied.
# The NVIDIA driver and toolkit stay out of scope.
# The teardown leaves them alone and a container cannot install them.
- name: Converge - gpu-qp teardown
  hosts: all
  become: true
  vars:
    ansible_user: root
    common_start_stack: false
    gpu_qp_require_nvidia_device: false
    gpu_qp_cuda_arch: "6.1"
    gpu_qp_home: /home/gpu/gpu-qp
    gpu_qp_worker_device: "all"
  pre_tasks:
    - name: Create the home parent
      ansible.builtin.file:
        path: "{{ gpu_qp_home | dirname }}"
        state: directory
        mode: "0755"
  tasks:
    # The tasks tagged molecule-idempotence-notest only arrange state for the teardown below.
    # A rerun would re-create what the teardown removed and report a change, so the idempotence run skips them.
    # The teardown itself stays untagged and must converge.
    - name: Gather network facts
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Deploy the data directories and the run wrapper (real)
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: data
      tags: [molecule-idempotence-notest]

    - name: Render the stack (real, no `up`)
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: stack
      tags: [molecule-idempotence-notest]

    - name: Fixture the stack systemd unit
      # A real deploy creates this unit through docker_stack_service.
      # The fixture gives the teardown's unit removal something to remove.
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=gpu-qp stack (molecule fixture)
        dest: /etc/systemd/system/stack.service
        mode: "0644"
      tags: [molecule-idempotence-notest]

    - name: Flush handlers between deploy and teardown
      # On a real host deploy and teardown are separate playbook runs.
      # A handler left pending here would fire after the teardown removed its service.
      ansible.builtin.meta: flush_handlers

    - name: Run the real teardown with the gate satisfied
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: teardown
      vars:
        teardown_confirmed: true
