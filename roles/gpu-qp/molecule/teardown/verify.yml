---
- name: Verify gpu-qp teardown
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Assert the bench gate refusal fired
      vars:
        molecule_case_ids: [bench-gate-run-tree]
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_markers.yml"

    - name: Assert the teardown removed every artifact
      vars:
        molecule_paths:
          - {path: /usr/local/bin/gpu-qp, state: absent}
          - {path: /usr/local/lib/gpu-qp, state: absent}
          - {path: /etc/systemd/system/stack.service, state: absent}
          - {path: "{{ gpu_qp_home }}", state: absent}
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
