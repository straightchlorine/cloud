---
- name: Verify gpu-qp default
  hosts: all
  become: true
  vars_files:
    - ../../vars/main.yml
    - ../shared/vars.yml
  vars:
    gpu_qp_bench: "{{ gpu_qp_home }}/bench"
    # A unique sleep argument lets pkill find only the processes this scenario started.
    gpu_qp_hold_seconds: 4242
  tasks:
    - name: Verify the rendered deploy
      ansible.builtin.include_tasks: verify/render.yml

    - name: Verify the bench helpers
      ansible.builtin.include_tasks: verify/bench_lib.yml

    - name: Verify the deploy guard
      ansible.builtin.include_tasks: verify/guard.yml

    - name: Verify the bench tests against the installed lib
      ansible.builtin.include_tasks: verify/suite.yml

    - name: Verify the manifest check
      # The last step: it changes an installed helper.
      ansible.builtin.include_tasks: verify/drift.yml
