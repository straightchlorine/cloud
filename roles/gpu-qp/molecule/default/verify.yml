---
- name: Verify the gpu-qp role's deployed state
  hosts: all
  become: true
  vars:
    gpu_qp_home: /home/gpu/gpu-qp
  tasks:
    - name: Read the deployed files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ gpu_qp_home }}/docker-compose.yml"
        - "{{ gpu_qp_home }}/data/molecules.json"
        - /usr/local/bin/gpu-qp
        - /tmp/gpu-qp.service.rendered
      register: gpu_qp_files

    - name: Parse the deployed files
      ansible.builtin.set_fact:
        compose: "{{ gpu_qp_files.results[0].content | b64decode | from_yaml }}"
        molecules: "{{ gpu_qp_files.results[1].content | b64decode | from_json }}"
        tool: "{{ gpu_qp_files.results[2].content | b64decode }}"
        unit: "{{ gpu_qp_files.results[3].content | b64decode }}"

    - name: Stat the host tool
      ansible.builtin.stat:
        path: /usr/local/bin/gpu-qp
      register: gpu_qp_tool_stat

    - name: Assert the compose services and the GPU worker definition
      vars:
        worker: "{{ compose.services['quantum-pipeline-gpu'] }}"
        exporter: "{{ compose.services['nvidia-gpu-exporter'] }}"
      ansible.builtin.assert:
        that:
          - compose.services | list | sort == ['nvidia-gpu-exporter', 'quantum-pipeline-gpu']
          # Worker: batch-only profile, a PINNED GPU device reservation, bind mounts.
          - worker.userns_mode == 'host'
          - worker.profiles == ['batch']
          # `restart: no` is parsed by YAML as boolean false, not the string 'no'.
          - worker.restart == false
          - worker.deploy.resources.reservations.devices[0].driver == 'nvidia'
          - worker.deploy.resources.reservations.devices[0].capabilities == ['gpu']
          # gpu_qp_worker_device is '0' here, so the pinned branch renders device_ids
          # and omits count (count and device_ids are mutually exclusive in compose).
          - worker.deploy.resources.reservations.devices[0].device_ids == ['0']
          - worker.deploy.resources.reservations.devices[0].count is not defined
          - "'/home/gpu/gpu-qp/data:/usr/src/quantum_pipeline/data:ro' in worker.volumes"
          - "'/home/gpu/gpu-qp/gen:/usr/src/quantum_pipeline/gen' in worker.volumes"
          # Exporter: device reservation path, capabilities from the role default.
          - exporter.deploy.resources.reservations.devices[0].driver == 'nvidia'
          - exporter.deploy.resources.reservations.devices[0].count == 'all'
          - exporter.deploy.resources.reservations.devices[0].capabilities == ['gpu']
          - exporter.ports | select('match', '.*:9835:9835$') | list | length == 1
        fail_msg: "compose stack wrong:\n{{ compose }}"
        success_msg: "[OK] compose renders the GPU device reservations correctly"

    - name: Assert the rendered molecules input
      ansible.builtin.assert:
        that:
          - molecules | length == 2
          - molecules[0].symbols == ['H', 'H']
          - molecules[1].symbols == ['Li', 'H']
          - molecules[0].units == 'angstrom'
        fail_msg: "molecules.json wrong: {{ molecules }}"
        success_msg: "[OK] molecules.json rendered from gpu_qp_molecules"

    - name: Assert the host tool is installed and executable
      ansible.builtin.assert:
        that:
          - gpu_qp_tool_stat.stat.exists
          - gpu_qp_tool_stat.stat.mode == '0755'
        fail_msg: "/usr/local/bin/gpu-qp is missing or not mode 0755"
        success_msg: "[OK] /usr/local/bin/gpu-qp installed (0755)"

    - name: Assert the host tool carries the role's settings
      ansible.builtin.assert:
        that:
          - "'Managed by Ansible' in tool"
          - "'STACK_HOME=\"/home/gpu/gpu-qp\"' in tool"
          - "'SOURCE=\"/home/gpu/gpu-qp/src/quantum-pipeline\"' in tool"
          # build: the host settings reach Dockerfile.gpu as build args
          - "'CUDA_VERSION=\"12.6.3\"' in tool"
          - "'CUDA_ARCH=\"6.1\"' in tool"
          - "'STRIP_CUDA_COMPAT=\"true\"' in tool"
          - "'--build-arg=' in tool"
          # run: defaults, the per-run directory, a non-root user
          - "'--file \"data/molecules.json\"' in tool"
          - "'--gpu' in tool"
          - "'--report' in tool"
          - "'MPLCONFIGDIR' in tool"
          - "'/usr/src/quantum_pipeline/gen' in tool"
          # check: a GPU circuit that cannot fall back to the CPU, plus ldd
          - "'device=\"GPU\"' in tool"
          - "'ldd' in tool"
        fail_msg: "gpu-qp wrong:\n{{ tool }}"
        success_msg: "[OK] gpu-qp is rendered with the role's settings"

    - name: Run the host tool's help
      ansible.builtin.command: /usr/local/bin/gpu-qp help
      register: gpu_qp_help
      changed_when: false

    - name: Run the host tool with an unknown command
      ansible.builtin.command: /usr/local/bin/gpu-qp no-such-command
      register: gpu_qp_unknown
      changed_when: false
      failed_when: gpu_qp_unknown.rc != 2

    - name: Assert the help lists every command
      ansible.builtin.assert:
        that:
          - "'Usage: gpu-qp <command>' in gpu_qp_help.stdout"
          - gpu_qp_help.stdout is search('(?m)^  pull ')
          - gpu_qp_help.stdout is search('(?m)^  build ')
          - gpu_qp_help.stdout is search('(?m)^  check$')
          - gpu_qp_help.stdout is search('(?m)^  run ')
        fail_msg: "gpu-qp help wrong:\n{{ gpu_qp_help.stdout }}"
        success_msg: "[OK] gpu-qp help lists pull, build, check and run; unknown commands exit 2"

    - name: Assert the rendered systemd unit
      ansible.builtin.assert:
        that:
          - "'GPU_QP_HOME=/home/gpu/gpu-qp' in unit"
          - "'ExecStart=/usr/bin/docker compose -f /home/gpu/gpu-qp/docker-compose.yml up -d' in unit"
        fail_msg: "unit render wrong:\n{{ unit }}"
        success_msg: "[OK] stack systemd unit renders with the explicit compose file"
