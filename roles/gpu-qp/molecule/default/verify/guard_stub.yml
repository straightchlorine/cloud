---
# Included once per item: a stub bench process (item.script sleeps, item.cmd starts it) must fail the deploy guard
# even though it holds no lock.
- name: Run the guard over a stub bench process
  vars:
    molecule_case:
      id: "stub-{{ item.script | basename }}"
      # The refusal shows a pgrep line that starts with a pid, so only the lead is fixed.
      expect: "benchmark run in progress ("
  block:
    - name: Create the stub directory
      ansible.builtin.file:
        path: "{{ item.script | dirname }}"
        state: directory
        mode: "0755"

    - name: Write the stub script
      ansible.builtin.copy:
        content: "sleep {{ gpu_qp_hold_seconds }}\n"
        dest: "{{ item.script }}"
        mode: "0755"

    - name: Start it
      ansible.builtin.command:
        argv: [bash, -c, "{{ item.cmd }}"]
      async: "{{ gpu_qp_hold_seconds }}"
      poll: 0
      changed_when: false

    - name: Wait for it to show up
      ansible.builtin.command:
        argv: [pgrep, -f, "{{ item.script }}"]
      register: gpu_qp_stub
      until: gpu_qp_stub.rc == 0
      retries: 20
      delay: 1
      changed_when: false

    - name: Guard refuses
      block:
        - name: Run the deploy guard
          ansible.builtin.include_role:
            name: gpu-qp
            tasks_from: guard

        - name: Fail when the guard lets the stub through
          ansible.builtin.fail:
            msg: "guard.yml let {{ item.script }} through"
      rescue:
        - name: Assert the guard named the benchmark run
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"
  always:
    - name: Kill the stub
      ansible.builtin.command:
        argv: [pkill, -f, "sleep {{ gpu_qp_hold_seconds }}$"]
      changed_when: false
      failed_when: false
