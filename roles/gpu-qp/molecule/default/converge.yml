---
- name: Converge gpu-qp default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  vars:
    gpu_qp_worker_device: "0"
  tasks:
    # Skipped because a container cannot run them: the common package and Docker setup, nvidia_driver.yml,
    # image.yml and nvidia_container_toolkit.yml (no docker daemon), the firewall and post_deploy_validate.yml.
    - name: Gather network facts
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Validate
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: validate

    - name: Guard against a running benchmark
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: guard

    - name: Deploy the data directories and the run wrapper
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: data

    - name: Install the kernel guard
      # It must follow data.yml, which installs the guard script.
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: kernel_guard

    - name: Render the stack
      ansible.builtin.include_role:
        name: gpu-qp
        tasks_from: stack

    - name: Install the stack unit
      ansible.builtin.include_role:
        name: common
        tasks_from: docker_stack_service
      vars:
        common_start_stack: true
        common_stack_description: "gpu-qp stack (molecule)"
        common_stack_home: "{{ gpu_qp_home }}"
        common_stack_user: "{{ ansible_user }}"
        common_stack_environment_vars:
          - "GPU_QP_HOME={{ gpu_qp_home }}"

    - name: Start the unit and flush the Restart stack handler
      ansible.builtin.include_role:
        name: common
        tasks_from: stack_start
      vars:
        common_start_stack: true
