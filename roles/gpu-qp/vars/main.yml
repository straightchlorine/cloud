---
# These values are fixed by the role and are not host settings, so they live in vars and not in defaults.

# Directory where the bench helpers are installed, separate from the run trees under gpu_qp_bench_path.
gpu_qp_lib_path: /usr/local/lib/gpu-qp

# The helpers copied from files/bench/, without the templates bench.env and override.yml.
# The install loop, the stale-file purge, the dispatcher's manifest and molecule all read this list.
gpu_qp_bench_files:
  - cli.sh
  - env.sh
  - eta.py
  - extract.py
  - fingerprint.sh
  - kernel-guard.sh
  - lane.sh
  - lanes.py
  - lanes.tsv
  - phase.sh
  - sample.sh
  - side.py
  - status.sh
  - supervise.sh
