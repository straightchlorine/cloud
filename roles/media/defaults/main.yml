---
# Built from ansible_user, not ansible_user_dir: under become that resolves to /root.
media_home: "/home/{{ ansible_user }}/stack"
# media_library_path: required in host_vars (data path and SSD mount point).

# sqlite3: beets DB snapshot; unzip: deno install; ffmpeg: yt-dlp's
# extract-audio / embed-metadata / thumbnail-convert postprocessing (the beets
# image ships its own ffmpeg for ReplayGain, but yt-dlp runs on the host).
media_specific_packages:
  - sqlite3
  - unzip
  - ffmpeg

media_navidrome_port: 4545
media_subdomain_navidrome: "navidrome"
# Runs before watchtower's 02:00 sweep so a backup predates any image upgrade
# (navidrome migrations are one-way).
media_navidrome_backup_schedule: "45 1 * * *"
media_navidrome_backup_count: 7

# Initial install only; the weekly self-update takes over. Deno is the JS runtime
# yt-dlp needs for YouTube's challenges.
media_ytdlp_version: "2026.08.19"
media_deno_version: "2.9.7"
media_youtube_enabled: false

# Beets query excluded from `media-sync --backfill` (e.g. audiobooks). Empty = whole library.
media_backfill_exclude: ""

media_library_directories:
  - music
  - downloads
  - navidrome-data
  - beets
  - cache
  - logs
  # Pipeline state (the yt-dlp download archive) - kept out of the /mnt/data
  # root so the data path stays folders-only. Backed up by restic and the
  # nightly snapshot (unlike cache/, which is excluded).
  - state

media_ssd_format: false  # DESTRUCTIVE if true - wipes the detected drive
media_ssd_filesystem: "ext4"
media_ssd_mount_options: "defaults,noatime,errors=remount-ro"
media_ssd_journald_enabled: true

# Secondary local backup via Syncthing; the primary off-site backup is restic.
media_backup_enabled: false
media_backup_owner: "{{ ansible_user }}"
media_backup_retention: 14
# Before the 03:00 restic timer, so restic ships tonight's snapshot too.
media_backup_schedule_hour: "02"
media_backup_schedule_minute: "30"

media_compose_networks:
  - name: stack
    compose_name: stack
    driver: bridge

media_compose_services:
  - service_name: navidrome
    service_image: "deluan/navidrome:latest"
    # primary_ip, not loopback: the central reverse proxy reaches it over the
    # tailnet, and Prometheus scrapes /metrics here.
    service_ports:
      - host: "{{ media_navidrome_port }}"
        container: 4533
        bind_ip: "{{ primary_ip }}"
    service_user: "{{ media_uid }}:{{ media_gid }}"
    service_environment:
      - "ND_MUSICFOLDER=/music"
      - "ND_DATAFOLDER=/data"
      - "ND_LOGLEVEL=info"
      - "ND_BASEURL=https://{{ media_subdomain_navidrome }}.{{ domain_name }}"
      - "ND_JWTKEY=${NAVIDROME_JWT_SECRET}"
      - "ND_AUTOIMPORTPLAYLISTS=false"
      # Anonymous usage/telemetry is opt-out (EnableInsightsCollector, default
      # true) - keep it disabled (navidrome.org anonymous-data-collection).
      - "ND_ENABLEINSIGHTSCOLLECTOR=false"
      # The watcher picks up beets' moves; no scheduled scans needed.
      - "ND_SCANNER_WATCHERWAIT=10s"
      - "ND_SCANNER_SCANONSTARTUP=true"
      - "ND_SCANNER_PURGEMISSING=full"
      # 0.63 enables public share links by default; keep them off.
      - "ND_ENABLESHARING=false"
      - "ND_BACKUP_PATH=/data/backups"
      - "ND_BACKUP_SCHEDULE={{ media_navidrome_backup_schedule }}"
      - "ND_BACKUP_COUNT={{ media_navidrome_backup_count }}"
      - "ND_ENABLENATURALSORTING=true"
      - "ND_PROMETHEUS_ENABLED=true"
      - "ND_IMAGECACHESIZE=250MB"
      - "ND_TRANSCODINGCACHESIZE=500MB"
      - "ND_SESSIONTIMEOUT=24h"
      - "ND_DEFAULTUIVOLUME=70"
      - "ND_ENABLELOGREDACTING=true"
      - "ND_DEFAULTDOWNSAMPLINGFORMAT=opus"
      - "ND_ENABLETRANSCODINGCONFIG=true"
      - "ND_DEFAULTTHEME=Dark"
      - "ND_ENABLECOVERANIMATION=true"
      - "ND_MAXSIDEBARPLAYLISTS=50"
    service_volumes:
      - "{{ media_library_path }}/music:/music:ro"
      - "{{ media_library_path }}/navidrome-data:/data"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 256M
        cpus: "1.0"
      reservations:
        memory: 128M
        cpus: "0.5"

  - service_name: beets
    service_image: "linuxserver/beets:latest"
    # On-demand import tool, never running, so watchtower cannot see it:
    # media-sync pulls the image before each run instead.
    service_restart: "no"
    service_profiles:
      - tools
    # userns_mode:host so beets runs as the REAL stack uid (= media_uid), the
    # same uid yt-dlp writes the host's downloads/ as. Userns-remapped, beets
    # could read /downloads but not rename out of it, so imports failed with
    # "Permission denied while moving". The image's s6 /init (the reason the
    # earlier revision avoided userns_mode:host) is bypassed - media-sync uses
    # --entrypoint - so no SUID preinit runs. music/, beets/ and downloads/ are
    # owned by the stack uid to match (see stack.yml).
    service_userns_mode: "host"
    service_user: "{{ media_uid }}:{{ media_gid }}"
    service_environment:
      - "TZ={{ timezone }}"
    service_volumes:
      - "{{ media_library_path }}/beets:/config"
      - "{{ media_library_path }}/music:/music"
      - "{{ media_library_path }}/downloads:/downloads"
    service_networks:
      - stack
    service_resources:
      # ReplayGain decodes every imported track with ffmpeg.
      limits:
        memory: 384M
        cpus: "2.0"
      reservations:
        memory: 64M
        cpus: "0.1"

media_compose_volumes: []
