---
# Built from ansible_user, not ansible_user_dir: under become that resolves to /root.
media_home: "/home/{{ ansible_user }}/stack"
# media_library_path: required in host_vars (data path and SSD mount point).

# The snapshot script needs sqlite3 and the deno install needs unzip.
# Yt-dlp runs on the host and needs ffmpeg for its audio, metadata and thumbnail postprocessing.
# The beets image ships its own ffmpeg.
media_specific_packages:
  - sqlite3
  - unzip
  - ffmpeg

media_navidrome_port: 4545
media_subdomain_navidrome: "navidrome"
# Runs before the watchtower sweep (common_watchtower_schedule), so a backup predates any image upgrade.
# Navidrome migrations are one-way.
media_navidrome_backup_schedule: "45 1 * * *"
media_navidrome_backup_count: 7

# These versions apply to the initial install only, and the weekly self-update takes over afterwards.
# Deno is the JavaScript runtime yt-dlp needs for YouTube's challenges.
media_ytdlp_version: "2026.08.19"
media_deno_version: "2.9.7"
media_youtube_enabled: false

# Beets query excluded from `media-sync --backfill`, for example audiobooks.
# An empty value backfills the whole library.
media_backfill_exclude: ""

# The MusicBrainz web service that the review tools ask, such as `media-sync --audit`.
# The tests point it at a local fake that serves fixture releases.
media_musicbrainz_url: "https://musicbrainz.org"

# `media-sync --apply` runs the review decisions weekly from cron.
# It refuses a run that touches more files than the limit below unless --force is given.
# It also waits for a restic backup no older than the age below.
# The age comes from the job's last-good marker <media_restic_state_dir>/<name>.ok.
# The job is restic-job@<name>.service from roles/restic, whose state directory is fixed.
# The state directory is a variable only so tests/engine-test.sh can point it at a scratch directory.
media_apply_max_files: 200
media_apply_backup_max_age_hours: 36
media_restic_service_name: "media"
media_restic_state_dir: "/var/lib/restic"
# The off-site job handed to roles/restic, with its repository and password set in host_vars.
# Navidrome's live database is excluded because restic ships Navidrome's own backups instead.
media_restic_job:
  name: "{{ media_restic_service_name }}"
  repository: "{{ media_restic_repository }}"
  password: "{{ media_restic_password }}"
  schedule: "*-*-* 03:00:00"
  timeout: 12h
  memory_max_mib: 512
  retention: { daily: 7, weekly: 4, monthly: 6, yearly: 1 }
  sources:
    - "{{ media_home }}"
    - "{{ media_library_path }}"
  excludes:
    - "{{ media_library_path }}/docker"
    - "{{ media_library_path }}/journal"
    - "{{ media_library_path }}/cache"
    - "{{ media_library_path }}/backup-tmp"
    - "{{ media_library_path }}/navidrome-data/navidrome.db*"
    - "{{ media_library_path }}/navidrome-data/cache"
    - "*.log"

media_library_directories:
  - music
  - downloads
  - navidrome-data
  - beets
  - cache
  - logs
  # `media-sync --apply` moves quarantined files here by date and never deletes them.
  - removed
  # Pipeline state such as the yt-dlp download archive lives here, so the library root holds only folders.
  # Restic and the snapshot script back it up, unlike cache/, which restic excludes.
  - state

media_ssd_format: false  # DESTRUCTIVE if true - wipes the detected drive
media_ssd_filesystem: "ext4"
media_ssd_mount_options: "defaults,noatime,errors=remount-ro"
media_ssd_journald_enabled: true

# This is the secondary local backup, shared through Syncthing, and restic is the primary off-site backup.
media_backup_enabled: false
media_backup_owner: "{{ ansible_user }}"
media_backup_retention: 14
# The snapshot runs before the restic job (media_restic_job.schedule), so restic ships tonight's snapshot too.
media_backup_schedule_hour: "02"
media_backup_schedule_minute: "30"

# Resolvers handed to the beets container through its service_dns.
# The Quad9 addresses are the fallback for a host that sets none.
# A host on a LAN with its own resolvers overrides this in host_vars.
media_beets_dns:
  - 9.9.9.9
  - 149.112.112.112

media_compose_networks:
  - name: stack
    compose_name: stack
    driver: bridge

media_compose_services:
  - service_name: navidrome
    service_image: "deluan/navidrome:latest"
    # primary_ip, not loopback: the central reverse proxy reaches it over the
    # tailnet, and Prometheus scrapes /metrics here.
    service_ports:
      - host: "{{ media_navidrome_port }}"
        container: 4533
        bind_ip: "{{ primary_ip }}"
    service_user: "{{ common_stack_uid }}:{{ common_stack_gid }}"
    service_environment:
      - "ND_MUSICFOLDER=/music"
      - "ND_DATAFOLDER=/data"
      - "ND_LOGLEVEL=info"
      - "ND_BASEURL=https://{{ media_subdomain_navidrome }}.{{ domain_name }}"
      - "ND_JWTKEY=${NAVIDROME_JWT_SECRET}"
      - "ND_AUTOIMPORTPLAYLISTS=false"
      # Navidrome sends anonymous usage data unless the insights collector is disabled.
      - "ND_ENABLEINSIGHTSCOLLECTOR=false"
      # The file watcher picks up beets' moves, so no scheduled scan is needed.
      - "ND_SCANNER_WATCHERWAIT=10s"
      - "ND_SCANNER_SCANONSTARTUP=true"
      - "ND_SCANNER_PURGEMISSING=full"
      # Navidrome enables public share links by default, so they are switched off.
      - "ND_ENABLESHARING=false"
      - "ND_BACKUP_PATH=/data/backups"
      - "ND_BACKUP_SCHEDULE={{ media_navidrome_backup_schedule }}"
      - "ND_BACKUP_COUNT={{ media_navidrome_backup_count }}"
      - "ND_ENABLENATURALSORTING=true"
      - "ND_PROMETHEUS_ENABLED=true"
      - "ND_IMAGECACHESIZE=250MB"
      - "ND_TRANSCODINGCACHESIZE=500MB"
      - "ND_SESSIONTIMEOUT=24h"
      - "ND_DEFAULTUIVOLUME=70"
      - "ND_ENABLELOGREDACTING=true"
      - "ND_DEFAULTDOWNSAMPLINGFORMAT=opus"
      - "ND_ENABLETRANSCODINGCONFIG=true"
      - "ND_DEFAULTTHEME=Dark"
      - "ND_ENABLECOVERANIMATION=true"
      - "ND_MAXSIDEBARPLAYLISTS=50"
    service_volumes:
      - "{{ media_library_path }}/music:/music:ro"
      - "{{ media_library_path }}/navidrome-data:/data"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: "{{ hardware_limits.navidrome.memory }}"
        cpus: "{{ hardware_limits.navidrome.cpus }}"
      reservations:
        memory: "{{ hardware_limits.navidrome.memory_reservation }}"
        cpus: "{{ hardware_limits.navidrome.cpus_reservation }}"

  - service_name: beets
    service_image: "linuxserver/beets:latest"
    # Beets is an on-demand tool that is never running, so watchtower cannot see it.
    # Media-sync pulls the image before each run instead.
    service_restart: "no"
    service_profiles:
      - tools
    # With userns_mode host, beets runs as the stack uid that yt-dlp also writes downloads/ as.
    # A userns-remapped beets can read /downloads but cannot move files out of it.
    # The error is "Permission denied while moving".
    # The image's s6 init is bypassed because media-sync uses --entrypoint, so no SUID preinit runs.
    # The stack uid therefore owns music/, beets/ and downloads/ (see stack.yml).
    service_userns_mode: "host"
    service_user: "{{ common_stack_uid }}:{{ common_stack_gid }}"
    service_environment:
      - "TZ={{ timezone }}"
    service_volumes:
      - "{{ media_library_path }}/beets:/config"
      - "{{ media_library_path }}/music:/music"
      - "{{ media_library_path }}/downloads:/downloads"
      - "{{ media_library_path }}/state/review:/review"
      - "{{ media_library_path }}/removed:/removed"
    service_networks:
      - stack
    # The resolvers are pinned because the host's own list lets a single hiccup fail every lookup.
    # The pass would then keep logging "Skipping." and look healthy.
    service_dns: "{{ media_beets_dns }}"
    # A whole-library `beet import` opens many files at once and would hit Docker's default open-file limit.
    # Both the soft and the hard limit are raised because the daemon's limit only sets the hard one.
    service_ulimits:
      nofile:
        soft: 65536
        hard: 65536
    service_resources:
      # The memory limit is sized for ReplayGain, which decodes every imported track with ffmpeg.
      limits:
        memory: 384M
        cpus: "2.0"
      reservations:
        memory: 64M
        cpus: "0.1"

media_compose_volumes: []
