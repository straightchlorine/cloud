---
- name: Resolve the stack user's uid/gid
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_user_ids

- name: Create the stack home directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ media_home }}"
    - "{{ media_home }}/config"
    - "{{ media_home }}/scripts"

- name: Create the library data directories
  # Navidrome runs userns-remapped, so its uid is the dockremap base plus the stack uid, and it owns navidrome-data.
  # Beets runs with userns_mode host as the stack uid so that it can move files yt-dlp wrote on the host.
  # Music/, beets/ and downloads/ therefore stay owned by ansible_user.
  # Only navidrome-data is chowned recursively, because walking the whole library is slow.
  ansible.builtin.file:
    path: "{{ media_library_path }}/{{ item }}"
    state: directory
    owner: >-
      {{ ((common_dockremap_uid | int) + (common_stack_uid | int))
      if item == 'navidrome-data' else ansible_user }}
    group: >-
      {{ ((common_dockremap_gid | int) + (common_stack_gid | int))
      if item == 'navidrome-data' else ansible_user }}
    mode: "0755"
    recurse: "{{ item == 'navidrome-data' }}"
  become: true
  loop: "{{ media_library_directories }}"

- name: Check whether a Navidrome JWT secret is already persisted
  ansible.builtin.stat:
    path: "{{ media_home }}/.navidrome_jwt_secret"
  register: media_jwt_secret_file

- name: Read the persisted Navidrome JWT secret
  ansible.builtin.slurp:
    src: "{{ media_home }}/.navidrome_jwt_secret"
  register: media_jwt_secret_persisted
  when: media_jwt_secret_file.stat.exists
  no_log: true

- name: Generate a Navidrome JWT secret
  # The secret is persisted so that a redeploy does not rotate ND_JWTKEY and log everyone out.
  ansible.builtin.command: openssl rand -hex 32
  register: media_jwt_secret_generated
  when: not media_jwt_secret_file.stat.exists
  changed_when: true
  no_log: true

- name: Publish the Navidrome JWT secret for the .env
  ansible.builtin.set_fact:
    media_jwt_secret: >-
      {{ (media_jwt_secret_generated.stdout
      if not media_jwt_secret_file.stat.exists
      else (media_jwt_secret_persisted.content | b64decode | trim)) }}
  no_log: true

- name: Persist the Navidrome JWT secret
  ansible.builtin.copy:
    content: "{{ media_jwt_secret }}\n"
    dest: "{{ media_home }}/.navidrome_jwt_secret"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

- name: Write the beets config and import overlays
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ media_library_path }}/beets/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - config.yaml
    - adopt.yaml
    - interactive.yaml
    - album.yaml
    # The upgrade overlay is album.yaml with lastgenre auto disabled, so a re-match cannot re-derive genres.
    # It is separate from album.yaml because the nightly release pass uses that one and wants Last.fm genres.
    - upgrade.yaml

- name: Install the beets plugin directory and plugins
  # The reviewed.py plugin turns a reviewer's "use as-is" answer into a marker.
  # The beets config loads it through pluginpath.
  ansible.builtin.file:
    path: "{{ media_library_path }}/beets/plugins"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Install the beets plugins
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ media_library_path }}/beets/plugins/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - reviewed.py

- name: Create the python tools directory
  # The beets container sees the library's beets/ directory as /config.
  # The tools therefore run there as /config/tools/*.py with beets' own python, as media-lib.sh.j2 does.
  ansible.builtin.file:
    path: "{{ media_library_path }}/beets/tools"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Create the library review directory
  # The directory is created before Docker can create it root-owned, because the beets container mounts it as /review.
  # The audit writes candidates.json and its MusicBrainz cache here.
  # It sits under state/ so that restic keeps the decisions, since restic excludes *.log but not *.json.
  ansible.builtin.file:
    path: "{{ media_library_path }}/state/review"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Install the python tools
  ansible.builtin.copy:
    src: "tools/{{ item }}"
    dest: "{{ media_library_path }}/beets/tools/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - media_common.py
    - media_tools.py
    - media_audit.py
    - media_apply.py
    - media_removed.py
    - media_review.py

- name: Install the pipeline scripts
  # These scripts are the engine, an interactive wrapper and a host-side `beet` for inspecting the library.
  # They are deployed unconditionally so that the wrapper always has its target.
  # Only the schedule and the downloads depend on media_youtube_enabled, in youtube.yml.
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "{{ media_home }}/scripts/{{ item }}.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - media-sync
    - media-import
    - beet
    # The read-only dashboard for a long pass is not a media-sync mode, because it must not take the writer lock.
    - media-status
    # This host-local wrapper runs pick-core.sh, which the next task installs.
    - pick

- name: Install pick, the fzf helper shared with the workstation
  # A workstation runs files/pick-core.sh from the repo over ssh.
  # On this host it is the core behind the `pick` wrapper above, which sets PICK_LOCAL so that nothing goes through ssh.
  ansible.builtin.copy:
    src: pick-core.sh
    dest: "{{ media_home }}/scripts/pick-core.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install the shared script modules
  # The pipeline scripts source these modules, which are never run directly and never in PATH.
  # Media-lib holds the library operations and media-maintenance holds the routine for an existing library.
  # They sit beside the scripts so that `readlink -f` on the PATH symlink finds them.
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "{{ media_home }}/scripts/{{ item }}.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - media-lib
    - media-maintenance

- name: Symlink the pipeline scripts into PATH
  ansible.builtin.file:
    src: "{{ media_home }}/scripts/{{ item }}.sh"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  become: true
  loop:
    - media-sync
    - media-import
    - beet
    - media-status
    - pick

- name: Remove the retired command artifacts
  # `media-sync --albums` covers the media-import-album command.
  # A host deployed earlier would keep a symlink to an unmanaged script that shadows it.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /usr/local/bin/media-import-album
    - "{{ media_home }}/scripts/media-import-album.sh"

- name: Render compose + .env and bring up the stack
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_compose_stack
  vars:  # noqa: var-naming[no-role-prefix]
    stack_name: "media"
    compose_file_path: "{{ media_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    compose_services: >-
      {{ media_compose_services
      + [common_watchtower_compose_service, common_cadvisor_compose_service] }}
    compose_networks: "{{ media_compose_networks }}"
    compose_volumes: "{{ media_compose_volumes }}"
    # Beets is excluded here because it is a tools-profile container that never runs as part of the stack.
    compose_critical_services:
      - navidrome
      - watchtower
      - cadvisor
    compose_env_vars: >-
      {{ {'NAVIDROME_JWT_SECRET': media_jwt_secret} | combine(common_watchtower_env_vars) }}
    start_stack: "{{ common_start_stack }}"
  # No handler is notified because `compose up -d` recreates containers when their files change.

- name: Install the stack management script
  ansible.builtin.include_role:
    name: common
    tasks_from: manage_stack_script
  vars:
    common_manage_stack_home: "{{ media_home }}"
    common_manage_stack_name: media
