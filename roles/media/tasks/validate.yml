---
# Site.yml includes this file directly, so it runs OS discovery itself.
# It does not probe Docker, because Docker may not be installed yet.

- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [validation]

- name: Run media stack comprehensive validation
  ansible.builtin.include_role:
    name: common
    tasks_from: unified_validation
  vars:  # noqa: var-naming[no-role-prefix]
    validation_context: "media stack"
    validation_type: "full"
    validation_role: "media"
    required_variables:
      - domain_name
      - media_home
      - media_library_path
      - media_restic_enabled
      - media_backup_enabled
      - media_youtube_enabled
      - vault_watchtower_api_token
    validation_supported_os_families: [Debian]
    vault_placeholders:
      - { var: "vault_watchtower_api_token", value: "your-watchtower-api-token" }
  tags: [validation]

- name: Validate the restic job this role builds
  # Pre-validation runs before any role deploys.
  # The job's own checks in the backup tasks run after the stack.
  # A bad job would therefore leave the firewall and stack service unapplied.
  # An undefined repository or password inside the job is named by the resulting error.
  ansible.builtin.include_role:
    name: restic
    tasks_from: validate_job
  vars:
    restic_job: "{{ media_restic_job }}"
  when: media_restic_enabled
  tags: [validation]

- name: Require real YouTube playlists
  ansible.builtin.assert:
    that:
      - vault_youtube_playlists is defined
      - vault_youtube_playlists | length > 0
      - "'YOUR_PLAYLIST_ID' not in (vault_youtube_playlists | join(' '))"
    fail_msg: >-
      media_youtube_enabled is true but vault_youtube_playlists is missing,
      empty or still the vault.yml.example placeholder.
    quiet: true
  when: media_youtube_enabled | bool
  tags: [validation]

- name: Validate the stack paths
  ansible.builtin.include_role:
    name: common
    tasks_from: validate_stack_paths
  vars:  # noqa: var-naming[no-role-prefix]
    validation_role: media
    validation_data_paths:
      - "{{ media_library_path }}"
      - "{{ media_home }}"
    validation_stack_home_var: media_home
  tags: [validation]
