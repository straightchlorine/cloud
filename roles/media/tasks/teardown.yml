---
# Reverse the media role so a disposable test Pi can be re-tested from a
# near-clean state. User data under media_library_path is intentionally left
# in place.

- name: Refuse to run outside a confirmed teardown
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_gate
  vars:
    common_teardown_name: media

- name: Tear down the stack service and compose project
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_stack_service
  vars:
    common_teardown_stack_home: "{{ media_home }}"
    common_teardown_stack_user: "{{ ansible_user }}"

- name: Remove the cron entries
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_cron
  vars:
    common_teardown_cron_jobs:
      - { name: "PATH", user: "{{ ansible_user }}", env: true }
      - { name: "Media nightly sync", user: "{{ ansible_user }}" }
      - { name: "Media weekly retag", user: "{{ ansible_user }}" }
      - { name: "Media Syncthing local backup", user: root }
      - { name: "Weekly yt-dlp updates", user: root }

- name: Remove the role file artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /usr/local/bin/manage-media
    - /usr/local/bin/media-sync
    - /usr/local/bin/media-import
    # Retired (folded into `media-sync --albums`): still removed so a host
    # deployed before the refactor cannot keep a symlink to an unmanaged script.
    - /usr/local/bin/media-import-album
    - /usr/local/bin/beet
    - /usr/local/bin/yt-dlp
    - /usr/local/bin/deno
    - "{{ media_home }}"
    - /usr/local/bin/media-syncthing-backup
    - /usr/local/bin/yt-dlp-update
    - /var/log/media-syncthing-backup.log

- name: Tear down Syncthing
  # Unconditional: the install is opt-in per host (common_syncthing_enabled),
  # but a re-test host can carry Syncthing from an earlier run whose flag no
  # longer matches the current inventory. Every task here is idempotent (apt
  # state=absent, file state=absent, unit stop with failed_when:false), so
  # always running it is safe and guarantees no Syncthing leftovers remain.
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_teardown

- name: Verify the media artifacts are gone
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_verify_absent
  vars:
    common_teardown_name: media
    common_teardown_paths:
      - /usr/local/bin/manage-media
      - /usr/local/bin/media-sync
      - /usr/local/bin/media-import
      - /usr/local/bin/media-import-album
      - /usr/local/bin/beet
      - /usr/local/bin/media-syncthing-backup
      - /usr/local/bin/yt-dlp
      - /usr/local/bin/deno
      - /etc/systemd/system/stack.service
      - "{{ media_home }}"
      - /etc/systemd/system/syncthing.service
      - /etc/apt/preferences.d/syncthing.pref
      - /etc/apt/keyrings/syncthing-archive-keyring.gpg
      - /usr/bin/syncthing
