---

# The os role must run first: validate.yml asserts on its facts (os_family).
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [media, validation, facts]

- name: Detect hardware for resource allocation
  ansible.builtin.include_role:
    name: hardware
  tags: [hardware, validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run media stack deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ media_specific_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Set up the SSD
  ansible.builtin.include_role:
    name: common
    tasks_from: optional_ssd
  vars:
    common_ssd_mount_path: "{{ media_library_path }}"
    common_ssd_format: "{{ media_ssd_format }}"
    common_ssd_filesystem: "{{ media_ssd_filesystem }}"
    common_ssd_mount_options: "{{ media_ssd_mount_options }}"
    common_ssd_journald_enabled: "{{ media_ssd_journald_enabled }}"
  tags: [storage]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Include backup configuration
  ansible.builtin.include_tasks: backup.yml
  when: media_backup_enabled or media_restic_enabled
  tags: [backup]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Re-apply the fleet notification helpers (ntfy + unattended-upgrades)
  ansible.builtin.include_role:
    name: common
    tasks_from: base_reapply
  tags: [media, common, base]

- name: Resolve the stack user's uid/gid for the unit environment
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_user_ids
  tags: [systemd, auto-start]

- name: Create Docker stack systemd service
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    common_stack_description: "Media Stack (navidrome, cadvisor)"
    common_stack_home: "{{ media_home }}"
    common_stack_user: "{{ ansible_user }}"
    common_stack_environment_vars:
      - "MEDIA_LIBRARY_PATH={{ media_library_path }}"
      - "PUID={{ common_stack_uid }}"
      - "PGID={{ common_stack_gid }}"
  tags: [systemd, auto-start]

- name: Include the YouTube -> beets pipeline
  ansible.builtin.include_tasks: youtube.yml
  when: media_youtube_enabled | bool
  tags: [youtube]

- name: Deploy the stack
  # This task runs last on purpose.
  # Host-side controls such as the firewall must exist before services are exposed.
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Start the stack unit and flush handlers
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_start
  tags: [systemd, auto-start, stack]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  # The common_start_stack flag belongs to common.
  # Common's defaults are not loaded when a tag-scoped run skips every common include.
  # The default mirrors common's own, as CLAUDE.md allows for cross-role feature flags.
  # A deploy with the flag false leaves the stack stopped, so its endpoints must not be probed.
  when: common_start_stack | default(true) | bool
  tags: [post_validation]
