---

# The os role must run first: validate.yml asserts on its facts (os_family).
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [media, validation, facts]

- name: Detect hardware for resource allocation
  ansible.builtin.include_role:
    name: hardware
  tags: [hardware, validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run media stack deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ media_specific_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Set up the SSD
  ansible.builtin.include_role:
    name: common
    tasks_from: optional_ssd
  vars:
    common_ssd_mount_path: "{{ media_library_path }}"
    common_ssd_format: "{{ media_ssd_format }}"
    common_ssd_filesystem: "{{ media_ssd_filesystem }}"
    common_ssd_mount_options: "{{ media_ssd_mount_options }}"
    common_ssd_journald_enabled: "{{ media_ssd_journald_enabled }}"
  tags: [storage]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Include backup configuration
  ansible.builtin.include_tasks: backup.yml
  when: media_backup_enabled or restic_enabled
  tags: [backup]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Re-apply the shared ntfy helper
  # --tags media skips the site.yml base play that installs this.
  ansible.builtin.include_role:
    name: common
    tasks_from: ntfy_install
  tags: [media, common, base]

- name: Re-apply unattended-upgrades and the reboot notification
  # Same tag-scoped gap as the ntfy helper above.
  ansible.builtin.include_role:
    name: common
    tasks_from: auto_updates
  tags: [media, common, base]

- name: Create Docker stack systemd service  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    stack_service_name: "stack"
    stack_description: "Media Stack (navidrome, cadvisor)"
    stack_home_directory: "{{ media_home }}"
    stack_user: "{{ ansible_user }}"
    # Explicit -f: the shared systemd template's WorkingDirectory guard is a
    # known-open issue (see its header), so don't rely on the unit's cwd.
    stack_environment_vars:
      - "MEDIA_LIBRARY_PATH={{ media_library_path }}"
      - "PUID={{ media_uid }}"
      - "PGID={{ media_gid }}"
    stack_exec_start: "/usr/bin/docker compose -f {{ media_home }}/docker-compose.yml up -d"
    stack_exec_stop: "/usr/bin/docker compose -f {{ media_home }}/docker-compose.yml down"
    stack_exec_reload: "/usr/bin/docker compose -f {{ media_home }}/docker-compose.yml restart"
  tags: [systemd, auto-start]

- name: Include the YouTube -> beets pipeline
  ansible.builtin.include_tasks: youtube.yml
  when: media_youtube_enabled | bool
  tags: [youtube]

- name: Deploy the stack
  # Last on purpose: host-side controls (firewall, backup, ntfy) must exist before services are exposed.
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Activate the stack auto-start unit
  # Starting now proves the boot path: RemainAfterExit runs ExecStart immediately.
  ansible.builtin.systemd:
    name: "stack"
    state: started
  become: true
  tags: [systemd, auto-start, stack]

- name: Flush pending handlers before validation
  # A changed unit notifies "Restart stack"; unflushed, it would restart the stack after validation.
  ansible.builtin.meta: flush_handlers

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation]
