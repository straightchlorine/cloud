---
- name: Install the nightly local snapshot backup
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_snapshot_backup
  vars:
    common_snapshot_name: "media"
    common_snapshot_stack_home: "{{ media_home }}"
    common_snapshot_dest: "{{ media_backup_dir }}"
    common_snapshot_owner: "{{ media_backup_owner }}"
    common_snapshot_retention: "{{ media_backup_retention }}"
    common_snapshot_hour: "{{ media_backup_schedule_hour }}"
    common_snapshot_minute: "{{ media_backup_schedule_minute }}"
    common_snapshot_summary: "Navidrome's newest backup, a beets DB snapshot, the stack .env and the yt-dlp archive"
    common_snapshot_steps:
      # Navidrome writes its own backup at media_navidrome_backup_schedule.
      # On the first night after a fresh deploy none exists yet.
      - |
        latest="$(ls -1 "{{ media_library_path }}"/navidrome-data/backups/navidrome_backup_*.db 2>/dev/null \
            | sort | tail -n 1 || true)"
        if [ -n "$latest" ]; then
            cp "$latest" "$WORK/navidrome.db"
        else
            NOTES="$NOTES No Navidrome backup existed yet."
        fi
      # The sqlite .backup command gives a consistent copy while beets is writing.
      - |
        if [ -f "{{ media_library_path }}/beets/library.db" ]; then
            sqlite3 -cmd '.timeout 5000' "{{ media_library_path }}/beets/library.db" ".backup '$WORK/beets-library.db'"
        fi
      - |
        cp "$STACK_HOME/.env" "$WORK/media.env"
      - |
        if [ -f "{{ media_library_path }}/state/youtube-archive.txt" ]; then
            cp "{{ media_library_path }}/state/youtube-archive.txt" "$WORK/"
        fi
  when: media_backup_enabled

- name: Share backups and music over Syncthing
  # Both folders are send-only, so a peer's delete or move never propagates back here.
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_share
  vars:
    common_syncthing_share_folders:
      - {id: media-backup, path: "{{ media_backup_dir }}", type: sendonly}
      - {id: music, path: "{{ media_library_path }}/music", type: sendonly}
  when: media_backup_enabled

- name: Configure the off-site restic backup
  # The stack is not paused, because a first run over the whole library would stop Navidrome for hours.
  # The live database is excluded, and restic ships Navidrome's own backups instead.
  ansible.builtin.include_role:
    name: restic
    tasks_from: job
    apply:
      tags: [backup]
  vars:
    restic_job: "{{ media_restic_job }}"
  when: media_restic_enabled
  tags: [backup]
