---
- name: Verify the critical compose containers are running
  ansible.builtin.include_role:
    name: common
    tasks_from: compose_containers_check
  vars:  # noqa: var-naming[no-role-prefix]
    compose_file_path: "{{ media_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    compose_critical_services:
      - navidrome
      - watchtower
      - cadvisor
  tags: [post_validation]

- name: Verify Navidrome endpoints respond
  ansible.builtin.uri:
    url: "{{ item }}"
    timeout: 10
    status_code: [200, 302]
    follow_redirects: none
  register: media_endpoint_health
  until: media_endpoint_health.status in [200, 302]
  retries: 10
  delay: 3
  loop:
    - "http://{{ primary_ip }}:{{ media_navidrome_port }}/"
    - "http://{{ primary_ip }}:{{ media_navidrome_port }}/metrics"
  tags: [post_validation]

- name: Verify the cAdvisor metrics endpoint
  # cAdvisor is a shared common service; its port (common_cadvisor_port) is in
  # common's scope, so the check runs there rather than referencing the default
  # from this role's task files.
  ansible.builtin.include_role:
    name: common
    tasks_from: verify_cadvisor_metrics
  tags: [post_validation]

- name: Verify Navidrome can write its data directory
  # A uid mismatch on the bind mount fails silently while HTTP stays healthy.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    exec -T navidrome test -w /data
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Verify beets loads our config and plugins as the stack user
  # Mirrors media-sync's invocation (--entrypoint skips /init and the web UI):
  # proves /config is the config dir, the lyrics and replaygain plugins load,
  # and ffmpeg is present. The last step imports the reviewed plugin the way
  # beets would, because beets only *warns* when a plugin fails to load and
  # carries on - so a broken reviewed.py would otherwise go unnoticed.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    run --rm -T --entrypoint /bin/sh beets -c
    '/lsiopy/bin/beet config -p && /lsiopy/bin/beet version && ffmpeg -version &&
    PYTHONPATH=/config/plugins /lsiopy/bin/python3 -c
    "import reviewed; print(reviewed.ReviewedPlugin)"'
  become: true
  become_user: "{{ ansible_user }}"
  register: media_beets_check
  changed_when: false
  failed_when: >-
    media_beets_check.rc != 0
    or '/config/config.yaml' not in media_beets_check.stdout
    or 'lyrics' not in media_beets_check.stdout
    or 'replaygain' not in media_beets_check.stdout
    or 'ReviewedPlugin' not in media_beets_check.stdout
  tags: [post_validation]

- name: Verify the reviewed plugin loads and reads its flag
  # beets only *warns* when a plugin fails to load, and the reviewed hook reads
  # `reviewed.mark` on every import with the flag absent (the nightly run,
  # --adopt and the album pass never set it), so read it here the way the hook
  # does: a missing key without the plugin's seeded default raises mid-import.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    run --rm -T --entrypoint /lsiopy/bin/python3 beets -c
    "import sys; sys.path.insert(0, '/config/plugins'); import reviewed;
    plugin = reviewed.ReviewedPlugin();
    print('plugin', reviewed.ReviewedPlugin, 'mark', plugin.config['mark'].get(bool))"
  become: true
  become_user: "{{ ansible_user }}"
  register: media_reviewed_check
  changed_when: false
  failed_when: >-
    media_reviewed_check.rc != 0
    or 'ReviewedPlugin' not in media_reviewed_check.stdout
    or 'mark False' not in media_reviewed_check.stdout
  tags: [post_validation]
