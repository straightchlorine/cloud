---
- name: Verify the critical compose containers are running
  ansible.builtin.include_role:
    name: common
    tasks_from: compose_containers_check
  vars:  # noqa: var-naming[no-role-prefix]
    compose_file_path: "{{ media_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    compose_critical_services:
      - navidrome
      - watchtower
      - cadvisor
  tags: [post_validation]

- name: Verify Navidrome endpoints respond
  ansible.builtin.uri:
    url: "{{ item }}"
    timeout: 10
    status_code: [200, 302]
    follow_redirects: none
  register: media_endpoint_health
  until: media_endpoint_health.status in [200, 302]
  retries: 10
  delay: 3
  loop:
    - "http://{{ primary_ip }}:{{ media_navidrome_port }}/"
    - "http://{{ primary_ip }}:{{ media_navidrome_port }}/metrics"
  tags: [post_validation]

- name: Verify the cAdvisor metrics endpoint
  # The cAdvisor service and its port, common_cadvisor_port, belong to the common role.
  # The check therefore lives there instead of reading that port from this role.
  ansible.builtin.include_role:
    name: common
    tasks_from: verify_cadvisor_metrics
  tags: [post_validation]

- name: Verify Navidrome can write its data directory
  # A uid mismatch on the bind mount causes no HTTP error, so only a write test detects it.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    exec -T navidrome test -w /data
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Verify beets loads our config and plugins as the stack user
  # The command mirrors media-sync, whose --entrypoint skips /init and the web UI.
  # It proves that /config is the config directory, that the lyrics and replaygain plugins load,
  # and that ffmpeg is present.
  # The last step imports the reviewed plugin directly, because beets only warns when a plugin fails to load.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    run --rm -T --entrypoint /bin/sh beets -c
    '/lsiopy/bin/beet config -p && /lsiopy/bin/beet version && ffmpeg -version &&
    PYTHONPATH=/config/plugins /lsiopy/bin/python3 -c
    "import reviewed; print(reviewed.ReviewedPlugin)"'
  become: true
  become_user: "{{ ansible_user }}"
  register: media_beets_check
  changed_when: false
  failed_when: >-
    media_beets_check.rc != 0
    or '/config/config.yaml' not in media_beets_check.stdout
    or 'lyrics' not in media_beets_check.stdout
    or 'replaygain' not in media_beets_check.stdout
    or 'ReviewedPlugin' not in media_beets_check.stdout
  tags: [post_validation]

- name: Verify the reviewed plugin loads and reads its flag
  # The reviewed hook reads `reviewed.mark` on every import, including runs that never set the flag.
  # Those runs are the nightly run, --adopt and the album pass.
  # This task reads the key the way the hook does, because a missing seeded default would raise mid-import.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    run --rm -T --entrypoint /lsiopy/bin/python3 beets -c
    "import sys; sys.path.insert(0, '/config/plugins'); import reviewed;
    plugin = reviewed.ReviewedPlugin();
    print('plugin', reviewed.ReviewedPlugin, 'mark', plugin.config['mark'].get(bool))"
  become: true
  become_user: "{{ ansible_user }}"
  register: media_reviewed_check
  changed_when: false
  failed_when: >-
    media_reviewed_check.rc != 0
    or 'ReviewedPlugin' not in media_reviewed_check.stdout
    or 'mark False' not in media_reviewed_check.stdout
  tags: [post_validation]

- name: Verify the beets container can resolve MusicBrainz
  # Without a reachable resolver every lookup fails and the pass logs "Skipping." for each file.
  # The run still looks healthy, so this task proves that lookups from inside the container answer.
  # Docker passes the host's resolver list through its embedded DNS, so a Pi-hole or tailnet hiccup can break it.
  # The role therefore pins public resolvers on the beets service (media_beets_dns).
  # The container's /etc/resolv.conf shows only Docker's embedded resolver, which forwards to the pinned ones.
  # The next task therefore checks the compose file for them.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml
    run --rm -T --entrypoint /lsiopy/bin/python3 beets -c
    "import socket; ns=[l.split()[1] for l in open('/etc/resolv.conf') if l.startswith('nameserver')];
    print('resolvers', ns); print('musicbrainz.org', socket.gethostbyname('musicbrainz.org'));
    print('api.acoustid.org', socket.gethostbyname('api.acoustid.org'))"
  become: true
  become_user: "{{ ansible_user }}"
  register: media_beets_dns_check
  changed_when: false
  failed_when: >-
    media_beets_dns_check.rc != 0
    or 'musicbrainz.org' not in media_beets_dns_check.stdout
    or 'api.acoustid.org' not in media_beets_dns_check.stdout
  tags: [post_validation]

- name: Verify the beets service pins the configured resolvers
  # Beets is an on-demand service in the tools profile, and `config` omits services of inactive profiles.
  # The default covers a beets service whose dns key is missing from the output.
  ansible.builtin.command: >-
    docker compose -f {{ media_home }}/docker-compose.yml --profile tools config --format json
  become: true
  become_user: "{{ ansible_user }}"
  register: media_compose_config
  changed_when: false
  failed_when: >-
    media_compose_config.rc != 0
    or (media_compose_config.stdout | from_json).services.beets.dns | default([]) != media_beets_dns
  tags: [post_validation]
