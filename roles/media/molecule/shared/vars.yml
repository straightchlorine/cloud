---
# Fake inputs mirroring host_vars/media.yml. ansible_user is pinned because the role's ownership and become
# wiring reads it directly.
ansible_user: root
timezone: UTC
domain_name: example.test
media_home: /home/music/stack
media_library_path: /mnt/music
# The media host's board type; its hardware profile sizes the navidrome container.
device_type: rpi3b
media_restic_enabled: false
vault_watchtower_api_token: molecule-test-watchtower-token
common_start_stack: false
media_youtube_enabled: true
vault_youtube_playlists:
  - "https://www.youtube.com/playlist?list=PLmoleculeA"
  - "https://www.youtube.com/playlist?list=PLmoleculeB"
media_backup_enabled: true
media_backup_dir: /tmp/molecule-media-backup

# Where the stub binaries record their calls; the default scenario reads them back.
molecule_ytdlp_calls_log: /tmp/molecule-ytdlp-calls
molecule_ntfy_log: /tmp/molecule-ntfy
molecule_docker_calls_log: /tmp/molecule-docker-calls
