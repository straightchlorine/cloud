---
- name: Verify media default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Read the deployed files
      ansible.builtin.slurp:
        src: "{{ item.value }}"
      loop: "{{ media_deployed_paths | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: media_slurped
      vars:
        media_deployed_paths:
          compose: "{{ media_home }}/docker-compose.yml"
          env: "{{ media_home }}/.env"
          unit: /etc/systemd/system/stack.service
          beets: "{{ media_library_path }}/beets/config.yaml"
          ytdlp_conf: "{{ media_home }}/config/yt-dlp.conf"
          snapshot_script: /usr/local/bin/media-syncthing-backup
          adopt: "{{ media_library_path }}/beets/adopt.yaml"
          interactive: "{{ media_library_path }}/beets/interactive.yaml"
          album: "{{ media_library_path }}/beets/album.yaml"
          media_sync: "{{ media_home }}/scripts/media-sync.sh"
          media_import: "{{ media_home }}/scripts/media-import.sh"
          reviewed_plugin: "{{ media_library_path }}/beets/plugins/reviewed.py"
          beet_helper: "{{ media_home }}/scripts/beet.sh"
          media_lib: "{{ media_home }}/scripts/media-lib.sh"
          media_maintenance: "{{ media_home }}/scripts/media-maintenance.sh"
          media_status: "{{ media_home }}/scripts/media-status.sh"
          media_tools_py: "{{ media_library_path }}/beets/tools/media_tools.py"
          media_common_py: "{{ media_library_path }}/beets/tools/media_common.py"
          media_audit_py: "{{ media_library_path }}/beets/tools/media_audit.py"
          media_apply_py: "{{ media_library_path }}/beets/tools/media_apply.py"
          media_review_py: "{{ media_library_path }}/beets/tools/media_review.py"
          pick_wrapper: "{{ media_home }}/scripts/pick.sh"
          pick_core: "{{ media_home }}/scripts/pick-core.sh"
          media_removed_py: "{{ media_library_path }}/beets/tools/media_removed.py"

    - name: Decode the deployed files by name
      vars:
        media_text: >-
          {{ dict(media_slurped.results | map(attribute='item.key')
                  | zip(media_slurped.results | map(attribute='content') | map('b64decode'))) }}
      ansible.builtin.set_fact:
        compose: "{{ media_text.compose | from_yaml }}"
        env_file: "{{ media_text.env }}"
        unit: "{{ media_text.unit }}"
        beets: "{{ media_text.beets | from_yaml }}"
        ytdlp_conf: "{{ media_text.ytdlp_conf }}"
        snapshot_script: "{{ media_text.snapshot_script }}"
        adopt: "{{ media_text.adopt | from_yaml }}"
        interactive: "{{ media_text.interactive | from_yaml }}"
        album: "{{ media_text.album | from_yaml }}"
        media_sync: "{{ media_text.media_sync }}"
        media_import: "{{ media_text.media_import }}"
        reviewed_plugin: "{{ media_text.reviewed_plugin }}"
        beet_helper: "{{ media_text.beet_helper }}"
        media_lib: "{{ media_text.media_lib }}"
        media_maintenance: "{{ media_text.media_maintenance }}"
        media_status: "{{ media_text.media_status }}"
        media_tools_py: "{{ media_text.media_tools_py }}"
        media_common_py: "{{ media_text.media_common_py }}"
        media_audit_py: "{{ media_text.media_audit_py }}"
        media_apply_py: "{{ media_text.media_apply_py }}"
        media_review_py: "{{ media_text.media_review_py }}"
        pick_wrapper: "{{ media_text.pick_wrapper }}"
        pick_core: "{{ media_text.pick_core }}"
        media_removed_py: "{{ media_text.media_removed_py }}"

    - name: Assert deployed paths, modes and owners
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        # music/ belongs to the stack user: beets runs with userns_mode host as that uid and shares it with yt-dlp.
        # media-import-album is retired: `media-sync --albums` covers it, and a leftover symlink would shadow it.
        molecule_paths:
          - { path: /mnt/music/music, state: directory, owner: root }
          - { path: /mnt/music/navidrome-data, state: directory }
          - { path: /home/music/stack/.env, state: file, mode: "0600" }
          - { path: /home/music/stack/config/playlists.txt, state: file, mode: "0600" }
          - { path: /tmp/molecule-media-backup, state: directory, mode: "0750" }
          - { path: /usr/local/bin/manage-media, state: link }
          - { path: /usr/local/bin/media-sync, state: link }
          - { path: /usr/local/bin/media-import, state: link }
          - { path: /usr/local/bin/beet, state: link }
          - { path: /usr/local/bin/pick, state: link }
          - { path: /usr/local/bin/media-import-album, state: absent }

    - name: Stat the navidrome data directory
      ansible.builtin.stat:
        path: /mnt/music/navidrome-data
      register: media_navidrome_data

    - name: Assert navidrome data is owned by the remapped uid
      # Navidrome is userns-remapped, and this converge's dockremap base uid is 10000.
      ansible.builtin.assert:
        that: media_navidrome_data.stat.uid == 10000
        fail_msg: "navidrome-data uid {{ media_navidrome_data.stat.uid }} (want 10000)"
        quiet: true

    - name: Assert the compose file and unit
      ansible.builtin.include_tasks: verify/compose.yml

    - name: Assert the beets config and overlays
      ansible.builtin.include_tasks: verify/beets.yml

    - name: Assert the deployed scripts
      ansible.builtin.include_tasks: verify/scripts.yml

    - name: Assert a sync run against the stub binaries
      ansible.builtin.include_tasks: verify/sync_run.yml

    - name: Assert the schedule and the stack unit
      ansible.builtin.include_tasks: verify/schedule.yml
