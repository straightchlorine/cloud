---
- name: Verify the media role's deployed state
  hosts: all
  become: true
  vars:
    media_home: /home/music/stack
    media_library_path: /mnt/music
  tasks:
    - name: Read the deployed files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ media_home }}/docker-compose.yml"
        - "{{ media_home }}/.env"
        - /tmp/media.service.rendered
        - "{{ media_library_path }}/beets/config.yaml"
        - "{{ media_home }}/config/yt-dlp.conf"
        - /usr/local/bin/media-syncthing-backup
        - "{{ media_library_path }}/beets/adopt.yaml"
        - "{{ media_library_path }}/beets/interactive.yaml"
        - "{{ media_library_path }}/beets/album.yaml"
        - "{{ media_home }}/scripts/media-sync.sh"
        - "{{ media_home }}/scripts/media-import.sh"
        - "{{ media_library_path }}/beets/plugins/reviewed.py"
        - "{{ media_home }}/scripts/beet.sh"
        - "{{ media_home }}/scripts/media-lib.sh"
        - "{{ media_home }}/scripts/media-maintenance.sh"
        - "{{ media_home }}/scripts/media-status.sh"
        - "{{ media_library_path }}/beets/tools/media_tools.py"
        - "{{ media_library_path }}/beets/tools/media_common.py"
        - "{{ media_library_path }}/beets/tools/media_audit.py"
        - "{{ media_library_path }}/beets/tools/media_apply.py"
      register: media_files

    - name: Parse the deployed files
      ansible.builtin.set_fact:
        compose: "{{ media_files.results[0].content | b64decode | from_yaml }}"
        env_file: "{{ media_files.results[1].content | b64decode }}"
        unit: "{{ media_files.results[2].content | b64decode }}"
        beets: "{{ media_files.results[3].content | b64decode | from_yaml }}"
        ytdlp_conf: "{{ media_files.results[4].content | b64decode }}"
        snapshot_script: "{{ media_files.results[5].content | b64decode }}"
        adopt: "{{ media_files.results[6].content | b64decode | from_yaml }}"
        interactive: "{{ media_files.results[7].content | b64decode | from_yaml }}"
        album: "{{ media_files.results[8].content | b64decode | from_yaml }}"
        media_sync: "{{ media_files.results[9].content | b64decode }}"
        media_import: "{{ media_files.results[10].content | b64decode }}"
        reviewed_plugin: "{{ media_files.results[11].content | b64decode }}"
        beet_helper: "{{ media_files.results[12].content | b64decode }}"
        media_lib: "{{ media_files.results[13].content | b64decode }}"
        media_maintenance: "{{ media_files.results[14].content | b64decode }}"
        media_status: "{{ media_files.results[15].content | b64decode }}"
        media_tools_py: "{{ media_files.results[16].content | b64decode }}"
        media_common_py: "{{ media_files.results[17].content | b64decode }}"
        media_audit_py: "{{ media_files.results[18].content | b64decode }}"
        media_apply_py: "{{ media_files.results[19].content | b64decode }}"

    - name: Stat the deployed files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ media_home }}/.env"
        - /usr/local/bin/manage-media
        - /usr/local/bin/media-sync
        - "{{ media_home }}/config/playlists.txt"
        - "{{ media_library_path }}/navidrome-data"
        - "{{ media_library_path }}/music"
        - /tmp/molecule-media-backup
        - /usr/local/bin/media-import
        - /usr/local/bin/beet
      register: media_stats

    - name: Stat the retired command
      # media-import-album folded into `media-sync --albums`; a stale symlink on a
      # long-lived host would shadow the new usage.
      ansible.builtin.stat:
        path: /usr/local/bin/media-import-album
      register: media_import_album_retired

    - name: Assert the compose services
      vars:
        navidrome: "{{ compose.services.navidrome }}"
        watchtower: "{{ compose.services.watchtower }}"
        watchtower_hostname: "WATCHTOWER_NOTIFICATIONS_HOSTNAME={{ ansible_facts['hostname'] }}"
      ansible.builtin.assert:
        that:
          - compose.services | list | sort == ['beets', 'cadvisor', 'navidrome', 'watchtower']
          - navidrome.image == 'deluan/navidrome:latest'
          - "'com.centurylinklabs.watchtower.enable=true' in navidrome.labels"
          - "'ND_BACKUP_PATH=/data/backups' in navidrome.environment"
          - "'ND_BACKUP_SCHEDULE=45 1 * * *' in navidrome.environment"
          - compose.services.beets.image == 'linuxserver/beets:latest'
          - navidrome.user == '0:0'
          - "'ND_JWTKEY=${NAVIDROME_JWT_SECRET}' in navidrome.environment"
          - "'ND_ENABLESHARING=false' in navidrome.environment"
          - "'ND_PROMETHEUS_ENABLED=true' in navidrome.environment"
          - "'ND_BASEURL=https://navidrome.example.test' in navidrome.environment"
          - navidrome.ports | select('match', '.*:4545:4533$') | list | length == 1
          - compose.services.beets.userns_mode == 'host'
          - compose.services.beets.profiles == ['tools']
          - "'/mnt/music/beets:/config' in compose.services.beets.volumes"
          - "'/mnt/music/state/review:/review' in compose.services.beets.volumes"
          - "'/mnt/music/removed:/removed' in compose.services.beets.volumes"
          - compose.services.cadvisor.ports | select('match', '.*:8085:8080$') | list | length == 1
          - "'WATCHTOWER_EPHEMERAL_SELF_UPDATE=true' in watchtower.environment"
          - "watchtower_hostname in watchtower.environment"
        fail_msg: "compose rendered wrong: {{ compose.services }}"
        success_msg: "[OK] navidrome (watchtower-managed, own backups) + watchtower + cadvisor + on-demand beets"

    - name: Assert the .env carries the JWT secret at 0600
      ansible.builtin.assert:
        that:
          - env_file is search('NAVIDROME_JWT_SECRET="[0-9a-f]{64}"')
          - env_file is search('WATCHTOWER_API_TOKEN="molecule-test-watchtower-token"')
          - media_stats.results[0].stat.mode == '0600'
        fail_msg: ".env wrong: {{ env_file }}"
        success_msg: "[OK] .env holds the JWT secret and is 0600"

    - name: Assert the rendered systemd unit
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/bin/docker compose -f /home/music/stack/docker-compose.yml up -d' in unit"
          - "'RemainAfterExit=true' in unit"
        fail_msg: "systemd unit rendered wrong:\n{{ unit }}"
        success_msg: "[OK] media unit renders with the explicit compose path"

    - name: Assert the ownership split
      # Converge fixture: dockremap base is 10000, stack user is root. navidrome
      # is userns-remapped (10000); beets runs userns_mode:host as the real stack
      # uid (root -> 0) and shares it with yt-dlp, so music/ is root-owned.
      ansible.builtin.assert:
        that:
          - media_stats.results[4].stat.uid == 10000
          - media_stats.results[5].stat.uid == 0
        fail_msg: >-
          navidrome-data uid {{ media_stats.results[4].stat.uid }} (want 10000),
          music uid {{ media_stats.results[5].stat.uid }} (want 0)
        success_msg: "[OK] navidrome-data remapped, music owned by the stack uid"

    - name: Assert the beets config imports YouTube singles unattended
      ansible.builtin.assert:
        that:
          - beets.directory == '/music'
          - beets.library == '/config/library.db'
          - beets['import'].quiet
          - beets['import'].singletons
          - beets['import'].quiet_fallback == 'skip'
          - beets.match.distance_weights.data_source == 0
          - beets['import'].duplicate_action == 'keep'
          - >-
            beets.plugins.split() | sort ==
            ['chroma', 'duplicates', 'embedart', 'fetchart', 'lastgenre',
            'lyrics', 'musicbrainz', 'replaygain', 'reviewed']
          - beets.pluginpath == '/config/plugins'
          - beets.replaygain.backend == 'ffmpeg'
          - beets.lyrics.synced
          - beets.chroma.auto
          - beets.lastgenre.force
          - beets.fetchart.auto
          - beets.embedart.auto
        fail_msg: "beets config wrong: {{ beets }}"
        success_msg: "[OK] beets: quiet, skip-unmatched, MB + chroma + lastgenre + covers + lyrics/gain"

    - name: Assert the adopt overlay leaves existing files untouched
      ansible.builtin.assert:
        that:
          - not adopt['import']['autotag']
          - not adopt['import']['move']
          - not adopt['import']['copy']
          - not adopt['import']['write']
        fail_msg: "adopt.yaml would modify the library: {{ adopt }}"
        success_msg: "[OK] adopt overlay: no autotag, move, copy or write"

    - name: Assert the album overlay accepts partial releases
      ansible.builtin.assert:
        that:
          - not interactive['import']['quiet']
          - interactive.reviewed.mark
          - not album['import']['singletons']
          - "'year' not in album.match.distance_weights"
          - album.match.distance_weights.missing_tracks == 0
          - "'unmatched_tracks' not in album.match.distance_weights"
          - album.match.preferred.media == ['Digital Media', 'CD']
          - album.match.preferred.original_year
          - "'unmatched_tracks' not in album.match.max_rec"
          - album.match.max_rec.missing_tracks == 'strong'
          - album.original_date
          - media_stats.results[7].stat.islnk
        fail_msg: >-
          overlays/scripts wrong: {{ interactive }} / {{ album }} /
          {{ media_stats.results[7].stat }}
        success_msg: "[OK] album overlay: partial releases accepted, unmatched tracks kept as the guard"

    - name: Assert the pipeline is one engine whose passes stay in order
      ansible.builtin.assert:
        that:
          # One overlay-parameterised release-pass function for every mode, and
          # it walks the whole downloads tree (a per-artist or per-playlist
          # subdirectory would otherwise be invisible to it and fall through to
          # the album-less singleton pass), one file at a time.
          - "'release_pass() {' in media_sync"
          - "'find \"$1\" -type f ! -name \".*\"' in media_sync"
          - "'-exec /lsiopy/bin/beet --config \"$2\" import {} \\;' in media_sync"
          - "'for track in /downloads/*' not in media_sync"
          # ... used by the nightly run before the singleton pass ...
          - "'release_pass /downloads /config/album.yaml' in media_sync"
          # One ^C must stop the release pass: the container's PID 1 needs a
          # handler and the loop has to be backgrounded for the trap to fire.
          - "'trap \"kill \\$pid' in media_sync"
          - "'wait $pid' in media_sync"
          - >-
            media_sync.index('release_pass /downloads /config/album.yaml')
            < media_sync.index('" import "${rest[@]}"')
          # ... on that night's downloads only: a leftover is not judged again
          - "'release_pass /downloads /config/album.yaml \"\" /downloads/.last-sync' in media_sync"
          - "'${3:+-cnewer \"$3\"}' in media_sync"
          # the stamp moves only after the passes, so an interrupted night is taken next night
          - >-
            media_sync.index('mapfile -t rest') < media_sync.rindex('touch "$stamp"')
          - "'older track(s) wait for media-import' in media_sync"
          # ... and every other mode is a flag on the same engine.
          - "'--albums)' in media_sync"
          - "'--keep)' in media_sync"
          - "'--interactive)' in media_sync"
          - "'--review)' in media_sync"
          - "'--singles)' in media_sync"
          - "'--release)' in media_sync"
          # The reviewer's decisions survive the repair paths.
          - "'reviewed::^$' in media_sync"
          # Folded scalar on purpose: two adjacent quoted literals in a Jinja
          # expression concatenate ('a' 'b' == 'ab'), which silently searches for
          # the wrong text.
          - >-
            "'mb_trackid::^$' 'reviewed::^$'" in media_sync
        fail_msg: "media-sync structure wrong:\n{{ media_sync }}"
        success_msg: "[OK] media-sync: one engine, per-file release pass, marker-aware repair"

    - name: Assert the reviewed plugin is deployed and gated
      ansible.builtin.assert:
        that:
          - "'ReviewedPlugin' in reviewed_plugin"
          - "'import_task_files' in reviewed_plugin"
          - "'Action.ASIS' in reviewed_plugin"
          - "'reviewed | ' in reviewed_plugin"
          - "'item.try_write()' in reviewed_plugin"
        fail_msg: "reviewed.py wrong:\n{{ reviewed_plugin }}"
        success_msg: "[OK] reviewed.py: marks an as-is answer, file tag included"

    - name: Assert media-import only delegates to the engine
      ansible.builtin.assert:
        that:
          - "'exec /usr/local/bin/media-sync' in media_import"
          - "'docker compose' not in media_import"
          - "'mode=--review' in media_import"
        fail_msg: "media-import should be a wrapper, not a second implementation:\n{{ media_import }}"
        success_msg: "[OK] media-import: interactive wrapper over media-sync"

    - name: Assert the shared modules own the library operations
      # The behaviour is proven against a real beets by
      # scripts/media/engine-test.sh; this pins the text that behaviour rests on,
      # so a refactor cannot quietly drop it.
      ansible.builtin.assert:
        that:
          # adopt registers only files with no row: importing the directory
          # re-creates every known row (new id, no album row, no reviewed flag).
          - "'register_new() {' in media_lib"
          - "'comm -23' in media_lib"
          - "'unregistered_files() {' in media_lib"
          - "'register_new /config/adopt.yaml /music' in media_lib"
          - "'-c /config/adopt.yaml import /music' not in media_lib"
          - "'-c /config/adopt.yaml import /music' not in media_sync"
          # regroup builds album rows from release ids and touches no file
          - "'lib.add_album(items)' in media_tools_py"
          # prune drops rows, never files (delete=False)
          - "'item.remove(False)' in media_tools_py"
          - "'prune_rows() {' in media_lib"
          # checkpoint, preflight, the pinned-release overlay
          - "'checkpoint() {' in media_lib"
          - "'musicbrainz_reachable() {' in media_lib"
          - "'strong_rec_thresh' in media_common_py"
          # one definition of the constants, in the library only
          - "'LIB=\"' in media_lib"
          - "'LIB=\"' not in media_sync"
          - "'media-lib.sh' in media_sync"
          - "'media-lib.sh' in media_status"
          # the maintenance routine: eight marked steps, a resume point, and the
          # step-3 warning
          - "'MAINT_STEPS=8' in media_maintenance"
          - "'settle_library' in media_maintenance"
          - "'maint_complete' in media_maintenance"
          - "'--from $CURRENT_STEP' in media_maintenance"
          - "'musicbrainz_reachable' in media_maintenance"
          - "'checkpoint' in media_maintenance"
          # the engine exposes them, and validates what a person types
          - "'--maintenance)' in media_sync"
          - "'--regroup)' in media_sync"
          - "'--pin)' in media_sync"
          - "'--complete)' in media_sync"
          - "'pin_files() {' in media_lib"
          - "'complete_plan() {' in media_lib"
          - "'def cmd_pin(' in media_tools_py"
          - "'AlbumMatch(Distance(), info, mapping).apply_metadata()' in media_common_py"
          - "'the album already holds that track (a copy)' in media_common_py"
          - "'assign(todo, info.tracks, held)' in media_common_py"
          # the pin and the apply share one implementation
          - "'mc.plan_pin(' in media_tools_py"
          - "'mc.apply_pin(' in media_tools_py"
          - "'mc.plan_pin(' in media_apply_py"
          - "'def same_title(' in media_common_py"
          # python lives in the tools, not in shell strings; a pin applies the release itself
          # and never imports into an existing album
          - "'media_tools.py\" pin' in media_lib"
          - "'import -S' not in media_lib"
          - "'importer' not in media_tools_py"
          - "'--plan)' in media_sync"
          # the library review's audit: one read-only container run into /review
          - "'--audit)' in media_sync"
          - "'$TOOLS/media_audit.py\"' in media_lib"
          - "'REVIEW=/review' in media_lib"
          - "'import media_common as mc' in media_audit_py"
          - "'.store()' not in media_audit_py"
          # the apply: decisions in one container, gated on restic, undoable from its log
          - "'--apply)' in media_sync"
          - "'--undo)' in media_sync"
          - "'backup_gate() {' in media_lib"
          - "'backup-media.service' in media_lib"
          - "'--max-files 200' in media_lib"
          - "'-ge 36 ]' in media_lib"
          - "'def cmd_undo(' in media_apply_py"
          - "'os.fsync' in media_apply_py"
          - "'import media_common as mc' in media_apply_py"
          - "'UPG_DROPPED' in media_sync"
          - "'a MusicBrainz release id (a UUID)' in media_sync"
          # the dashboard stays read-only: no container, no lock
          - "'compose run' not in media_status"
          - "'flock -n' in media_status"
        fail_msg: "shared modules wrong:\n{{ media_lib }}"
        success_msg: "[OK] media-lib / media-maintenance own the library operations, shared with sync and status"

    - name: Assert the interactive wrapper refuses a run without a terminal
      # It is never scheduled (cron runs media-sync), and this is the guard that
      # keeps it that way: without a TTY it fails immediately instead of running
      # a quiet pass that can never ask, or hanging on a prompt nobody sees.
      ansible.builtin.command: /usr/local/bin/media-import
      register: media_import_nott
      changed_when: false
      failed_when: media_import_nott.rc != 2

    - name: Assert the engine refuses an interactive mode without a terminal
      # The same guarantee one level down, where it also covers a hand-typed
      # `media-sync --singles` (or --review) with no terminal attached.
      ansible.builtin.command: /usr/local/bin/media-sync --singles
      register: media_sync_nott
      changed_when: false
      failed_when: >-
        media_sync_nott.rc != 2
        or 'needs an interactive terminal' not in media_sync_nott.stderr

    - name: Assert the yt-dlp config prefers YouTube Music tags
      ansible.builtin.assert:
        that:
          - "'%(artist,uploader)s:%(artist)s' in ytdlp_conf"
          - "'music\\s*official$' in ytdlp_conf"
          # Typographic dashes are normalised to '-' *before* the hyphen-only rules
          # run, so reordering these two would silently stop the repost split.
          - "'[–—]' in ytdlp_conf"
          - "'[^-]+?) - (' in ytdlp_conf"
          - >-
            ytdlp_conf.index('[–—]') < ytdlp_conf.index('[^-]+?) - (')
          - "'--download-archive \"/mnt/music/state/youtube-archive.txt\"' in ytdlp_conf"
          # names are capped in bytes (ext4: 255), not characters
          - "'%(artist).60B - %(title).120B [%(id)s]' in ytdlp_conf"
          - "'media_library_path' not in ytdlp_conf"
        fail_msg: "yt-dlp.conf wrong:\n{{ ytdlp_conf }}"
        success_msg: "[OK] yt-dlp.conf rendered with the tag rules and archive"

    - name: Assert the interactive tools are installed
      # tmux for the long backfill run (see the README), fzf for
      # scripts/media/pick.sh, mosh for the sessions themselves. All of these
      # come from common_packages.
      ansible.builtin.command: "{{ item }}"
      loop:
        - tmux -V
        - fzf --version
        - mosh --version
      register: media_tools
      changed_when: false
      failed_when: media_tools.rc != 0

    - name: Assert the management symlinks, the 0600 playlists and the retired command
      ansible.builtin.assert:
        that:
          - media_stats.results[1].stat.islnk
          - media_stats.results[2].stat.islnk
          - media_stats.results[3].stat.mode == '0600'
          - media_stats.results[8].stat.islnk
          - "'--entrypoint /lsiopy/bin/beet' in beet_helper"
          - "'docker compose' in beet_helper"
          - not media_import_album_retired.stat.exists
        fail_msg: manage/media-sync/beet symlinks, playlists.txt or a stale media-import-album
        success_msg: "[OK] manage-media + media-sync + beet in PATH, playlists.txt 0600, media-import-album retired"

    - name: Run the deployed media-sync against the stub yt-dlp
      # The stub downloads nothing, so beets is skipped.
      ansible.builtin.command: /usr/local/bin/media-sync
      changed_when: false

    - name: Read the stub's recorded calls
      ansible.builtin.slurp:
        src: /tmp/molecule-ytdlp-calls
      register: media_ytdlp_calls

    - name: Assert every playlist reached yt-dlp intact, once each
      vars:
        calls: "{{ (media_ytdlp_calls.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - calls | length == 2
          - calls[0].endswith(' https://www.youtube.com/playlist?list=PLmoleculeA')
          - calls[1].endswith(' https://www.youtube.com/playlist?list=PLmoleculeB')
          - calls[0].startswith('--config-location /home/music/stack/config/yt-dlp.conf ')
        fail_msg: "yt-dlp calls wrong: {{ calls }}"
        success_msg: "[OK] both playlists passed to yt-dlp as whole URLs"

    - name: Read the ntfy stub's recorded notifications
      ansible.builtin.slurp:
        src: /tmp/molecule-ntfy
      register: media_ntfy_calls

    - name: Assert the sync run sent exactly one summary notification
      vars:
        sent: "{{ (media_ntfy_calls.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - sent | length == 1
          - "'media-sync sync done' in sent[0]"
          - "'2 playlist(s): 0 track(s) imported, 0 left in downloads/, 0 unexpected yt-dlp error(s).' in sent[0]"
        fail_msg: "ntfy calls wrong: {{ sent }}"
        success_msg: "[OK] one success summary per sync run"

    - name: Read root's and the stack user's crontab
      ansible.builtin.command: crontab -l -u root
      register: media_crontab
      changed_when: false

    - name: Assert the pipeline and snapshot cron entries
      ansible.builtin.assert:
        that:
          - "'Media nightly sync' in media_crontab.stdout"
          - "'Media weekly retag' in media_crontab.stdout"
          - "'/usr/local/bin/media-sync --retag' in media_crontab.stdout"
          # Sunday 04:00, after restic and before the 04:15 retag
          - "'0 4 * * 0 /usr/local/bin/media-sync --apply' in media_crontab.stdout"
          - "'Media Syncthing local backup' in media_crontab.stdout"
          - "'/usr/local/bin/yt-dlp-update' in media_crontab.stdout"
          - "'PATH=\"/usr/local/bin:/usr/bin:/bin\"' in media_crontab.stdout"
        fail_msg: "crontab wrong:\n{{ media_crontab.stdout }}"
        success_msg: "[OK] nightly sync, weekly apply and retag, 02:30 snapshot scheduled"

    - name: Assert the snapshot backup script and destination
      ansible.builtin.assert:
        that:
          - "'navidrome-data/backups/navidrome_backup_' in snapshot_script"
          - "'beets/library.db' in snapshot_script"
          - "'youtube-archive.txt' in snapshot_script"
          - "'mv \"$WORK\" \"$DEST/$STAMP\"' in snapshot_script"
          - media_stats.results[6].stat.mode == '0750'
        fail_msg: "snapshot script wrong:\n{{ snapshot_script }}"
        success_msg: "[OK] snapshot covers navidrome + beets DBs and the yt-dlp archive"

    # The plugin's *runtime* load check lives in tasks/post_deploy_validate.yml:
    # this molecule container has no docker, so no beets container can be started
    # here (the smoke test's `docker compose pull` is non-fatal by design). The
    # grep asserts above plus that post-deploy check cover reviewed.py.
