---
- name: Converge media default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  pre_tasks:
    - name: Prepare path parents and remap facts
      ansible.builtin.include_tasks: ../shared/pre_deploy.yml

    - name: Stub yt-dlp, deno and ntfy-notify
      ansible.builtin.include_tasks: ../shared/stub_binaries.yml

  tasks:
    # Not run here: packages.yml (the full apt list is too slow), the optional SSD task (no block devices),
    # the firewall (ufw cannot bind rules in a container) and post_deploy_validate.yml (needs a running compose
    # stack). Docker is stubbed in prepare, so the real stack unit installs and starts below.
    - name: Gather network facts
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Detect hardware
      ansible.builtin.include_role:
        name: hardware

    - name: Validate the stack
      ansible.builtin.include_role:
        name: media
        tasks_from: validate

    - name: Validate the stack with the off-site backup on
      ansible.builtin.include_role:
        name: media
        tasks_from: validate
      vars:
        media_restic_enabled: true
        media_restic_repository: /srv/molecule-restic/media
        media_restic_password: molecule-restic-password-media

    - name: Deploy the backup
      # Restic stays off: deploying its job needs the host's systemd timers.
      ansible.builtin.include_role:
        name: media
        tasks_from: backup

    - name: Deploy the pipeline
      # main.yml runs youtube.yml before stack.yml; keeping that order exercises a fresh deploy with no
      # stack directories yet.
      ansible.builtin.include_role:
        name: media
        tasks_from: youtube

    - name: Deploy the stack
      ansible.builtin.include_role:
        name: media
        tasks_from: stack

    - name: Install and start the stack unit
      ansible.builtin.include_tasks: ../shared/install_unit.yml
