---
- name: Prepare platform prerequisites
  hosts: all
  become: true
  tasks:
    - name: Install cron, iproute2 and logrotate
      # The role needs crontab, `ip` and /etc/logrotate.d, which the minimal test image lacks.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
          - logrotate
        state: present
        update_cache: true

    - name: Stub docker and docker.service for the real stack unit
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../common/molecule/fixtures/stub_docker.yml"
