---
- name: Prepare platform prerequisites
  hosts: all
  become: true
  tasks:
    - name: Install cron, iproute2 and logrotate
      # Not in the minimal test image; the role needs crontab, `ip` and /etc/logrotate.d.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
          - logrotate
        state: present
        update_cache: true
