---
- name: Assert the pipeline is one engine whose passes stay in order
  ansible.builtin.assert:
    that:
      # One release-pass function takes the overlay as a parameter and serves every mode.
      # It walks the whole downloads tree one file at a time, because a per-artist subdirectory
      # would otherwise fall through to the album-less singleton pass.
      - "'release_pass() {' in media_sync"
      - "'find \"$1\" -type f ! -name \".*\"' in media_sync"
      - "'-exec /lsiopy/bin/beet --config \"$2\" import {} \\;' in media_sync"
      - "'for track in /downloads/*' not in media_sync"
      # The nightly run calls it before the singleton pass.
      - "'release_pass /downloads /config/album.yaml' in media_sync"
      # One Ctrl-C must stop the release pass.
      # The container's PID 1 needs a signal handler, and the loop must run in the background for the trap to fire.
      - "'trap \"kill \\$pid' in media_sync"
      - "'wait $pid' in media_sync"
      - >-
        media_sync.index('release_pass /downloads /config/album.yaml')
        < media_sync.index('" import "${rest[@]}"')
      # The pass looks only at files newer than the last-sync stamp, so a leftover is not judged again.
      - "'release_pass /downloads /config/album.yaml \"\" /downloads/.last-sync' in media_sync"
      - "'${3:+-cnewer \"$3\"}' in media_sync"
      # The stamp moves only after the passes, so an interrupted night is picked up the next night.
      - >-
        media_sync.index('mapfile -t rest') < media_sync.rindex('touch "$stamp"')
      - "'older track(s) wait for media-import' in media_sync"
      # Every other mode is a flag on the same engine.
      - "'--albums)' in media_sync"
      - "'--keep)' in media_sync"
      - "'--interactive)' in media_sync"
      - "'--review)' in media_sync"
      - "'--singles)' in media_sync"
      - "'--release)' in media_sync"
      # The repair paths skip rows that already carry the reviewed marker.
      - "'reviewed::^$' in media_sync"
      # This is a folded scalar because Jinja joins two adjacent quoted literals into one string.
      # A plain scalar would silently search for the joined text.
      - >-
        "'mb_trackid::^$' 'reviewed::^$'" in media_sync
    fail_msg: "media-sync structure wrong:\n{{ media_sync }}"

- name: Assert media-import only delegates to the engine
  ansible.builtin.assert:
    that:
      - "'exec /usr/local/bin/media-sync' in media_import"
      - "'docker compose' not in media_import"
      - "'mode=--review' in media_import"
    fail_msg: "media-import should be a wrapper, not a second implementation:\n{{ media_import }}"

- name: Assert the shared modules own the library operations
  # roles/media/tests/engine-test.sh proves the behaviour against a real beets.
  # These asserts pin the text that behaviour rests on, so a refactor cannot quietly drop it.
  ansible.builtin.assert:
    that:
      # Adopt registers only files that have no row.
      # Importing the whole directory would re-create every known row without its album row or reviewed flag.
      - "'register_new() {' in media_lib"
      - "'comm -23' in media_lib"
      - "'unregistered_files() {' in media_lib"
      - "'register_new /config/adopt.yaml /music' in media_lib"
      - "'-c /config/adopt.yaml import /music' not in media_lib"
      - "'-c /config/adopt.yaml import /music' not in media_sync"
      # Regroup builds album rows from release ids and touches no file.
      - "'lib.add_album(items)' in media_tools_py"
      # Prune drops rows and never deletes files.
      - "'item.remove(False)' in media_tools_py"
      - "'prune_rows() {' in media_lib"
      # The library defines the checkpoint and the preflight, and the shared module the match threshold.
      - "'checkpoint() {' in media_lib"
      - "'musicbrainz_reachable() {' in media_lib"
      - "'strong_rec_thresh' in media_common_py"
      # The constants are defined once, in the library only.
      - "'LIB=\"' in media_lib"
      - "'LIB=\"' not in media_sync"
      - "'media-lib.sh' in media_sync"
      - "'media-lib.sh' in media_status"
      # The maintenance routine counts its steps, can resume from the current one, and checks MusicBrainz.
      - "'MAINT_STEPS=8' in media_maintenance"
      - "'settle_library' in media_maintenance"
      - "'maint_complete' in media_maintenance"
      - "'--from $CURRENT_STEP' in media_maintenance"
      - "'musicbrainz_reachable' in media_maintenance"
      - "'checkpoint' in media_maintenance"
      # The engine exposes these operations and validates what a person types.
      - "'--maintenance)' in media_sync"
      - "'--regroup)' in media_sync"
      - "'--pin)' in media_sync"
      - "'--complete)' in media_sync"
      - "'pin_files() {' in media_lib"
      - "'complete_plan() {' in media_lib"
      - "'def cmd_pin(' in media_tools_py"
      - "'AlbumMatch(Distance(), info, mapping).apply_metadata()' in media_common_py"
      - "'the album already holds that track (a copy)' in media_common_py"
      - "'claims, left = assign(' in media_common_py"
      # The pin and the apply share one implementation.
      - "'mc.plan_pin(' in media_tools_py"
      - "'mc.apply_pin(' in media_tools_py"
      - "'mc.plan_pin(' in media_apply_py"
      - "'def same_title(' in media_common_py"
      # Python lives in the tools, not in shell strings.
      # A pin applies the release itself and never imports into an existing album.
      - "'media_tools.py\" pin' in media_lib"
      - "'import -S' not in media_lib"
      - "'importer' not in media_tools_py"
      - "'--plan)' in media_sync"
      # The library review's audit is one read-only container run that writes into /review.
      - "'--audit)' in media_sync"
      - "'$TOOLS/media_audit.py\"' in media_lib"
      - "'REVIEW=/review' in media_lib"
      - "'import media_common as mc' in media_audit_py"
      - "'.store()' not in media_audit_py"
      # The apply runs the decisions in one container, waits for a restic backup, and can be undone from its log.
      - "'--apply)' in media_sync"
      - "'--undo)' in media_sync"
      - "'backup_gate() {' in media_lib"
      - "'restic-job@media.service' in media_lib"
      - "'/var/lib/restic/media.ok' in media_lib"
      - "'--max-files 200' in media_lib"
      - "'-ge 36 ]' in media_lib"
      - "'def cmd_undo(' in media_apply_py"
      - "'os.fsync' in media_apply_py"
      - "'import media_common as mc' in media_apply_py"
      # The quarantine check is read-only unless --purge is given, which deletes only the safe classes.
      - "'--removed)' in media_sync"
      - "'$TOOLS/media_removed.py\"' in media_lib"
      - "'SAFE = CLASSES[:2]' in media_removed_py"
      - "'import media_common as mc' in media_removed_py"
      # On the host, the pick wrapper sets PICK_LOCAL and runs the same script the workstation uses.
      - "'PICK_LOCAL=1' in pick_wrapper"
      - "'pick-core.sh' in pick_wrapper"
      - "'PICK_LOCAL' in pick_core"
      - "'media-import --quarantine' in pick_core"
      # The review menu runs host python on the library and saves decisions through the shared writer.
      - "'--library | --quarantine)' in media_import"
      - "'beets/tools/media_review.py' in media_import"
      - "'mc.save_decision(' in media_review_py"
      - "'mode=ro' in media_review_py"
      # One helper drops an emptied album row in the same decision that empties it.
      - "'def drop_emptied_albums(' in media_common_py"
      - "'drop_emptied(lib, log, n, ' in media_apply_py"
      - "'mc.drop_emptied_albums(' in media_tools_py"
      - "'\"album_removed\"' in media_apply_py"
      # A loose copy of a registered track has one ranking, a replace action and a copy screen.
      - "'def copy_rank(' in media_common_py"
      - "'mc.best_copy(' not in media_audit_py"
      - "'mc.suggest_copy(' in media_audit_py"
      - "'\"replace\", \"adopt\"' in media_common_py"
      - "'def do_replace(' in media_apply_py"
      - "'new.added = gone.added' in media_apply_py"
      - "'mark_reviewed(new)' in media_apply_py"
      - "'def restore_comments(' in media_apply_py"
      - "'def copy(self, path)' in media_review_py"
      # The same menu handles downloads: the audit lists them, the apply adopts them and the undo reverts them.
      - "'def downloads(root)' in media_audit_py"
      - "'--downloads /downloads' in media_lib"
      - "'--downloads \"$LIB/downloads\"' in media_import"
      - "'def do_adopt(' in media_apply_py"
      - "'def undo_adopt(' in media_apply_py"
      - "'util.unique_path(item.destination())' in media_apply_py"
      - "'def download(self, key)' in media_review_py"
      - "'UPG_DROPPED' in media_sync"
      - "'a MusicBrainz release id (a UUID)' in media_sync"
      # The audit finds twins over every row and the menu offers them on a screen of their own.
      # A row queued for quarantine is never the one to keep.
      - "'def twins(' in media_common_py"
      - "'mc.twins(' in media_audit_py"
      - "'mc.queued_quarantines(' in media_audit_py"
      - "'def twin_dialog(' in media_review_py"
      - "'self.twin_groups()' in media_review_py"
      # Enter takes the screen's suggestion and never acts without one.
      # The summary reads the queue the way the apply does, against the file limit the wrapper passes.
      - "'no suggestion for this screen' in media_review_py"
      - "'ma.read_decisions(' in media_review_py"
      - "'--max-files 200' in media_import"
      - "'required=True, help=\"the apply' in media_review_py"
      # Only the menu pairs titles by length (the lenient rule), never the nightly pin or the apply.
      # A pin saved from the menu carries any pairs the strict rule would not make as a map.
      - "'def same_title_lenient(' in media_common_py"
      - "'lenient=True' in media_review_py"
      - "'lenient' not in media_apply_py"
      - "'lenient' not in media_tools_py"
      - "'def pin_map(' in media_review_py"
      - "'def force_tracks(' in media_common_py"
      - "'forced=' in media_apply_py"
      - "'map is for pin decisions only' in media_common_py"
      # The apply runs decisions by kind with quarantine first and narrows a superseded decision.
      # At the end it drops every empty album row and files the tracks of a pinned album again.
      - "'RANK = {' in media_apply_py"
      - "'narrowed' in media_apply_py"
      - "'def tidy_folders(' in media_apply_py"
      - "'_memotable' in media_apply_py"
      - "'mc.empty_album_ids(' in media_apply_py"
      - "'def empty_album_ids(' in media_common_py"
      - "'mc.empty_album_ids(' in media_tools_py"
      # The status dashboard stays read-only, so it starts no container and takes no writer lock.
      - "'compose run' not in media_status"
      - "'flock -n' in media_status"
    fail_msg: "shared modules wrong:\n{{ media_lib }}"

- name: Assert the interactive wrapper refuses a run without a terminal
  # Cron runs media-sync, never this wrapper.
  # Without a terminal the wrapper fails at once.
  # Otherwise it would run a pass that can never ask, or hang on a prompt nobody sees.
  ansible.builtin.command: /usr/local/bin/media-import
  register: media_import_nott
  changed_when: false
  failed_when: media_import_nott.rc != 2

- name: Assert the engine refuses an interactive mode without a terminal
  # The engine enforces the same rule, which also covers a hand-typed `media-sync --singles` without a terminal.
  ansible.builtin.command: /usr/local/bin/media-sync --singles
  register: media_sync_nott
  changed_when: false
  failed_when: >-
    media_sync_nott.rc != 2
    or 'needs an interactive terminal' not in media_sync_nott.stderr

- name: Read the common package list
  # Converge skips packages.yml because the full apt list is too slow in a container.
  # The tools are therefore never installed here, so the test checks the list the media host installs them from.
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../common/defaults/main.yml"
    name: media_common_defaults

- name: Assert common_packages carries the interactive tools
  # The README runs the long maintenance pass in tmux, and roles/media/files/pick-core.sh needs fzf.
  # Mosh keeps the interactive sessions alive.
  ansible.builtin.assert:
    that:
      - item in media_common_defaults.common_packages
    fail_msg: "{{ item }} was dropped from common_packages; the media host needs it"
    quiet: true
  loop:
    - tmux
    - fzf
    - mosh

- name: Assert the beet helper runs beets through compose
  ansible.builtin.assert:
    that:
      - "'--entrypoint /lsiopy/bin/beet' in beet_helper"
      - "'docker compose' in beet_helper"
    fail_msg: "beet helper wrong:\n{{ beet_helper }}"

- name: Assert the snapshot backup script
  ansible.builtin.assert:
    that:
      - "'navidrome-data/backups/navidrome_backup_' in snapshot_script"
      - "'beets/library.db' in snapshot_script"
      - "'youtube-archive.txt' in snapshot_script"
      - "'mv \"$WORK\" \"$DEST/$STAMP\"' in snapshot_script"
    fail_msg: "snapshot script wrong:\n{{ snapshot_script }}"
