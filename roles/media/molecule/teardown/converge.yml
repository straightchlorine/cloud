---
- name: Converge - deploy, then tear down
  hosts: all
  become: true
  vars:
    ansible_user: root
    timezone: UTC
    domain_name: example.test
    media_home: /home/music/stack
    media_library_path: /mnt/music
    restic_enabled: false
    restic_repository: /tmp/test-restic
    restic_password: molecule-test-restic-password
    vault_watchtower_api_token: molecule-test-watchtower-token
    common_start_stack: false
    media_youtube_enabled: true
    vault_youtube_playlists:
      - "https://www.youtube.com/playlist?list=PLmoleculeA"
    media_backup_enabled: true
    media_backup_dir: /tmp/molecule-media-backup
  pre_tasks:
    - name: Create the path parents
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ media_home }}"
        - "{{ media_library_path }}"

    - name: Publish fixture userns-remap facts
      # The uid must be inside the nested rootless-podman mapping (0-65536), or chown
      # fails with EINVAL.
      ansible.builtin.set_fact:
        common_dockremap_uid: "10000"
        common_dockremap_gid: "10000"

    - name: Read the role defaults for the stub below
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
        name: media_role_defaults

    - name: Stub yt-dlp and deno
      ansible.builtin.copy:
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        content: "#!/bin/sh\necho stub\n"
      loop: [yt-dlp, deno]
      tags: [molecule-idempotence-notest]

  tasks:
    # Deploy tasks skip idempotence: the teardown removes what they create,
    # and the teardown is what must converge on a rerun.
    - name: Gather network facts for dynamic configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts
      tags: [molecule-idempotence-notest]

    - name: Run the real stack deployment
      ansible.builtin.include_role:
        name: media
        tasks_from: stack
      tags: [molecule-idempotence-notest]

    # A container has no docker.service, so fake the unit the teardown removes.
    - name: Create the fake stack service unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Media Stack (molecule fixture)
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/stack.service
        mode: "0644"
      tags: [molecule-idempotence-notest]

    - name: Run the real backup and pipeline deployments
      ansible.builtin.include_role:
        name: media
        tasks_from: "{{ item }}"
      loop: [backup, youtube]
      tags: [molecule-idempotence-notest]

    - name: Teardown refuses to run without the confirm fact
      block:
        - name: Run the media teardown unconfirmed
          ansible.builtin.include_role:
            name: media
            tasks_from: teardown

        - name: Fail if the unconfirmed teardown ran
          ansible.builtin.fail:
            msg: media teardown ran without teardown_confirmed
      rescue:
        - name: Assert the refusal names teardown_confirmed
          ansible.builtin.assert:
            that:
              - "'media teardown requires the shared teardown_confirmed fact' in ansible_failed_result.msg"

    # docker compose down is skipped by the docker-info guard.
    - name: Run the media teardown
      ansible.builtin.include_role:
        name: media
        tasks_from: teardown
      vars:
        teardown_confirmed: true
