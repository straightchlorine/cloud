---
- name: Converge media teardown
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  tasks:
    # The teardown removes what the deploy creates, so the arrange steps skip idempotence; the untagged
    # teardown is the system under test and must converge.
    - name: Deploy what a container allows
      tags: [molecule-idempotence-notest]
      block:
        - name: Prepare path parents and remap facts
          ansible.builtin.include_tasks: ../shared/pre_deploy.yml

        - name: Stub yt-dlp, deno and ntfy-notify
          ansible.builtin.include_tasks: ../shared/stub_binaries.yml

        - name: Gather network facts
          ansible.builtin.include_role:
            name: common
            tasks_from: network_facts

        - name: Detect hardware
          ansible.builtin.include_role:
            name: hardware

        - name: Deploy the stack
          ansible.builtin.include_role:
            name: media
            tasks_from: stack

        - name: Install and start the stack unit
          ansible.builtin.include_tasks: ../shared/install_unit.yml

        - name: Deploy the backup
          ansible.builtin.include_role:
            name: media
            tasks_from: backup

        - name: Deploy the pipeline
          ansible.builtin.include_role:
            name: media
            tasks_from: youtube

    - name: Refuse an unconfirmed teardown
      block:
        - name: Run the teardown without teardown_confirmed
          ansible.builtin.include_role:
            name: media
            tasks_from: teardown

        - name: Fail when the unconfirmed teardown ran
          ansible.builtin.fail:
            msg: unconfirmed teardown ran
      rescue:
        - name: Assert the refusal and record it
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"
          vars:
            molecule_case:
              id: unconfirmed-teardown
              expect: media teardown requires the shared teardown_confirmed fact

    - name: Run the confirmed teardown
      # Its own self-verification runs inside this include. The docker-info guard skips `docker compose down`
      # because the container has no Docker.
      ansible.builtin.include_role:
        name: media
        tasks_from: teardown
      vars:
        teardown_confirmed: true
