---
- name: Prepare - platform prerequisites the role assumes
  hosts: all
  become: true
  tasks:
    - name: Install cron, iproute2 and logrotate
      # The role needs crontab, network facts (iproute2) and /etc/logrotate.d;
      # the minimal test image ships none of them.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
          - logrotate
        state: present
        update_cache: true
