---
- name: Prepare - platform prerequisites the role assumes
  hosts: all
  become: true
  tasks:
    - name: Install cron, iproute2 and logrotate
      # crontab comes from cron, network facts need iproute2, and the weekly
      # update config lands in /etc/logrotate.d (logrotate). None of the three
      # is guaranteed in the minimal test image.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
          - logrotate
        state: present
        update_cache: true
