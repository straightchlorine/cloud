---
- name: Verify the teardown left a clean host
  hosts: all
  become: true
  vars:
    media_home: /home/music/stack
  tasks:
    - name: Stat everything the teardown should have removed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/manage-media
        - /usr/local/bin/media-sync
        - /usr/local/bin/media-syncthing-backup
        - /usr/local/bin/yt-dlp
        - /usr/local/bin/deno
        - /etc/systemd/system/stack.service
        - "{{ media_home }}"
      register: media_teardown_leftovers

    - name: Assert no role artifact survives the teardown
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "{{ item.item }} still exists after teardown"
        success_msg: "[OK] {{ item.item }} removed"
      loop: "{{ media_teardown_leftovers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      failed_when: false
      register: media_teardown_crontab

    - name: Assert the role's cron jobs are gone
      ansible.builtin.assert:
        that:
          - "'Media ' not in (media_teardown_crontab.stdout | default(''))"
          - "'PATH=' not in (media_teardown_crontab.stdout | default(''))"
        fail_msg: "Cron jobs survived the teardown: {{ media_teardown_crontab.stdout | default('') }}"
        success_msg: "[OK] media stack cron jobs removed"

    - name: Assert the stack service is not active
      ansible.builtin.systemd:
        name: stack
      register: media_teardown_unit
      failed_when: media_teardown_unit.status.ActiveState == 'active'
