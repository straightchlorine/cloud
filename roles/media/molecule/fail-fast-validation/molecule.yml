---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: media-fail-fast-validation
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # Molecule runs from roles/media, so the parent directory is roles/.
    # That lets include_role resolve sibling roles such as os and common by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
