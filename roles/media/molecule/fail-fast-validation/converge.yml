---
- name: Converge media fail-fast-validation
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
    - cases.yml
  pre_tasks:
    - name: Prepare path parents and remap facts
      ansible.builtin.include_tasks: ../shared/pre_deploy.yml

    - name: Create the non-root stack user
      # The stack-home case overrides ansible_user, so the podman connection runs as this user.
      ansible.builtin.user:
        name: media
        uid: 1000
        shell: /bin/bash
        create_home: true
  tasks:
    - name: Run each case
      ansible.builtin.include_tasks: case.yml
      loop: "{{ molecule_cases }}"
      loop_control:
        loop_var: molecule_item
        label: "{{ molecule_item.id }}"
      vars:
        # Null-valued fields are dropped so the mapped variable stays undefined in case.yml.
        molecule_case: >-
          {{ molecule_case_defaults | combine(molecule_item) | dict2items
             | rejectattr('value', 'none') | items2dict }}
