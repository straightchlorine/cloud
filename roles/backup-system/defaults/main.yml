# Backup System - Default Variables

# Core configuration
backup_role: "coordinator"  # coordinator or node
backup_base_path: "/opt/enterprise-backup"
backup_user: "backup"
backup_group: "backup"
backup_restic_version: "0.18.1"

# Network optimization
backup_network_optimization: true
backup_network_tuning: false
backup_bandwidth_limit: 0  # 0 = unlimited
backup_qos_enabled: false

# Monitoring and health checks
backup_monitoring: true
backup_grafana_integration: false
backup_health_check_schedule: "*-*-* 06:00:00"
backup_metrics_schedule: "*-*-* *:15:00"

# Node agent configuration
backup_node_agent_enabled: false

# Security and compliance
backup_encryption_algorithm: "AES256"
backup_key_rotation_enabled: true
backup_audit_logging: true

# Default retention policy
backup_default_retention:
  daily: "30"
  weekly: "12"
  monthly: "24"
  yearly: "3"

# Required vault variables
backup_required_vault_vars:
  - vault_backup_repository_base
  - vault_domain_name
  - vault_letsencrypt_email