---
# Backup system role defaults

# Backup targets - list of hosts/services to back up
backup_targets: []

# Strategy and monitoring
backup_strategy: "hybrid"
backup_monitoring: true
backup_grafana_integration: false

# Scheduling
backup_health_check_schedule: "*-*-* 06:00:00"
backup_metrics_schedule: "*-*-* *:15:00"
backup_metrics_retention_days: "90"

# Key rotation
backup_enable_key_rotation: true
backup_key_rotation_schedule: "monthly"
backup_key_rotation_days: "90"
backup_password_rotation_days: "30"
backup_force_key_deployment: false

# Alerting
backup_alert_threshold_hours: "25"
backup_alert_webhook_url: ""
backup_alert_email: ""
