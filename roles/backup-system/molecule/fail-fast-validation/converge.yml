---
- name: Converge - Fail-Fast Validation
  hosts: all
  vars:
    timezone: UTC
    # Intentionally omit required variables:
    # - backup_role
    # - backup_base_path
    # - vault_backup_repository_base
    # This tests that role fails gracefully with clear error messages
  tasks:
    - name: Include backup-system validation (expect to fail)
      block:
        - name: Try to include backup-system validation without required variables
          ansible.builtin.include_tasks: ../../tasks/validation.yml
      rescue:
        - name: Capture expected validation failure
          ansible.builtin.set_fact:
            validation_failed: true
            validation_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Display validation failure message
          ansible.builtin.debug:
            msg: |
              ✓ Validation correctly failed (expected behavior)
              Error: {{ validation_error }}
