# Backup System - Monitoring and Health Checks

- name: Create monitoring directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  loop:
    - "{{ backup_base_path }}/monitoring"
    - "{{ backup_base_path }}/alerts"
    - "{{ backup_base_path }}/dashboards"

- name: Create enterprise backup health monitor script
  ansible.builtin.template:
    src: health-monitor.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-health-monitor.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'

- name: Create backup metrics collector script
  ansible.builtin.template:
    src: metrics-collector.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-metrics.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'

- name: Create health monitoring service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Health Monitor
      After=network.target

      [Service]
      Type=oneshot
      User={{ backup_user }}
      ExecStart={{ backup_base_path }}/scripts/backup-health-monitor.sh
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/backup-health-monitor.service
    owner: root
    group: root
    mode: '0644'

- name: Create health monitoring timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Health Monitor Timer
      Requires=backup-health-monitor.service

      [Timer]
      OnCalendar={{ backup_health_check_schedule | default('*-*-* 06:00:00') }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/backup-health-monitor.timer
    owner: root
    group: root
    mode: '0644'

- name: Create metrics collection service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Metrics Collector
      After=network.target

      [Service]
      Type=oneshot
      User={{ backup_user }}
      ExecStart={{ backup_base_path }}/scripts/backup-metrics.sh
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/backup-metrics.service
    owner: root
    group: root
    mode: '0644'

- name: Create metrics collection timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Metrics Collection Timer
      Requires=backup-metrics.service

      [Timer]
      OnCalendar={{ backup_metrics_schedule | default('*-*-* *:15:00') }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/backup-metrics.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable and start monitoring services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - backup-health-monitor.timer
    - backup-metrics.timer

- name: Create Grafana dashboard configuration
  ansible.builtin.template:
    src: grafana-dashboard.json.j2
    dest: "{{ backup_base_path }}/dashboards/backup-dashboard.json"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0644'
  when: backup_grafana_integration | default(false)