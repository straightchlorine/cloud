---
# Backup System - SSH Connection Optimization
# Keep it simple: connection pooling, keep-alive, and host key checking
# Restic handles compression, no need for SSH-level compression

- name: Configure SSH connection pooling
  ansible.builtin.copy:
    content: |
      # Backup SSH Connection Optimization
      Host *
          ControlMaster auto
          ControlPath {{ common_backup_base_path }}/.ssh/sockets/%r@%h-%p
          ControlPersist 10m
          ServerAliveInterval 60
          ServerAliveCountMax 3
          TCPKeepAlive yes
          StrictHostKeyChecking accept-new
    dest: "{{ common_backup_base_path }}/.ssh/config"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0600"

- name: Create SSH socket directory
  ansible.builtin.file:
    path: "{{ common_backup_base_path }}/.ssh/sockets"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0700"

- name: Display SSH optimization status
  ansible.builtin.debug:
    msg: |
      [ssh connection optimization configured]
      connection pooling: enabled
      keep-alive interval: 60 seconds
      connection timeout: 10 minutes
