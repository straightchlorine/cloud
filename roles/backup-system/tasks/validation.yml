---
# Backup System - Validation Tasks

- name: Validate backup role configuration
  ansible.builtin.fail:
    msg: >-
      backup_role must be defined as 'coordinator' or 'standalone'.
      Current value: '{{ backup_role | default('undefined') }}'
  when: >
    backup_role is not defined or
    backup_role not in ['coordinator', 'standalone']

- name: Debug backup_targets availability
  ansible.builtin.debug:
    msg: |
      Checking backup_targets:
      - backup_role: {{ backup_role }}
      - backup_targets is defined: {{ backup_targets is defined }}
      - backup_targets type: {{ backup_targets | type_debug }}
      - backup_targets length: {{ backup_targets | length if backup_targets is defined else 'N/A' }}
  when: backup_role == "coordinator"

- name: Validate coordinator configuration
  ansible.builtin.fail:
    msg: "backup_targets must be defined for coordinator role"
  when: >
    backup_role == "coordinator" and
    (backup_targets is not defined or backup_targets | length == 0)

- name: Validate backup base path
  ansible.builtin.fail:
    msg: "backup_base_path must be defined"
  when: backup_base_path is not defined

- name: Validate required vault variables
  ansible.builtin.fail:
    msg: "Required vault variable '{{ item }}' is not defined"
  when: vars[item] is not defined
  loop:
    - vault_backup_repository_base
  no_log: false

- name: Validate coordinator target configurations
  ansible.builtin.fail:
    msg: "Required target variable '{{ item.1 }}' is not defined for {{ item.0.service_name }}"
  when: >
    backup_role == "coordinator" and
    item.0[item.1] is not defined
  loop: "{{ backup_targets | product(['service_name', 'target_host', 'backup_paths', 'restic_repository']) | list }}"
  no_log: false

- name: Validate standalone configuration
  ansible.builtin.fail:
    msg: "Required standalone variable '{{ item }}' is not defined"
  when: >
    backup_role == "standalone" and
    vars[item] is not defined
  loop:
    - restic_repository
    - restic_password
    - backup_paths
  no_log: false

- name: Display validation results
  ansible.builtin.debug:
    msg: |
      [OK] Backup Validation Passed:
      - role: {{ backup_role }}
      - base path: {{{ common_backup_base_path }}}
      {% if backup_role == "coordinator" %}
      - targets: {{ backup_targets | length }} configured
      {% endif %}
      - monitoring: {{ backup_monitoring }}
