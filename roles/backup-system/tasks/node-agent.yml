# Backup System - Node Agent Deployment
# Deploys node-side agents for distributed backup operations

- name: Create backup node user
  ansible.builtin.user:
    name: "{{ backup_user }}"
    system: true
    shell: /bin/bash
    home: "{{ backup_base_path }}"
    create_home: true

- name: Create node agent directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  loop:
    - "{{ backup_base_path }}/scripts"
    - "{{ backup_base_path }}/logs"
    - "{{ backup_base_path }}/cache"
    - "{{ backup_base_path }}/staging"
    - "{{ backup_base_path }}/config"

- name: Install node agent prerequisites
  ansible.builtin.package:
    name:
      - rsync
      - openssh-server
      - jq
    state: present

- name: Configure SSH server for backup operations
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
  loop:
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?AuthorizedKeysFile', line: 'AuthorizedKeysFile .ssh/authorized_keys' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
  notify: restart sshd

- name: Create SSH directory for backup user
  ansible.builtin.file:
    path: "{{ backup_base_path }}/.ssh"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0700'

- name: Create authorized_keys file
  ansible.builtin.file:
    path: "{{ backup_base_path }}/.ssh/authorized_keys"
    state: touch
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'

- name: Create node agent script
  ansible.builtin.template:
    src: node-agent.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-node-agent.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'

- name: Create node health check script
  ansible.builtin.template:
    src: node-health-check.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-node-health.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'

- name: Create node agent service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Node Agent
      After=network.target

      [Service]
      Type=forking
      User={{ backup_user }}
      ExecStart={{ backup_base_path }}/scripts/backup-node-agent.sh start
      ExecStop={{ backup_base_path }}/scripts/backup-node-agent.sh stop
      ExecReload={{ backup_base_path }}/scripts/backup-node-agent.sh reload
      PIDFile={{ backup_base_path }}/node-agent.pid
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/backup-node-agent.service
    owner: root
    group: root
    mode: '0644'
  when: backup_node_agent_enabled

- name: Create node health monitoring timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Node Health Check Timer
      Requires=backup-node-health.service

      [Timer]
      OnCalendar=*-*-* *:30:00
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/backup-node-health.timer
    owner: root
    group: root
    mode: '0644'

- name: Create node health service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Node Health Check
      After=network.target

      [Service]
      Type=oneshot
      User={{ backup_user }}
      ExecStart={{ backup_base_path }}/scripts/backup-node-health.sh
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/backup-node-health.service
    owner: root
    group: root
    mode: '0644'

- name: Enable node agent services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - backup-node-agent.service
    - backup-node-health.timer
  when: backup_node_agent_enabled

- name: Display node agent deployment status
  ansible.builtin.debug:
    msg: |
      ✅ Backup Node Agent Deployed:
      - Node: {{ inventory_hostname }}
      - Agent Service: {{ 'Enabled' if backup_node_agent_enabled else 'Disabled' }}
      - SSH Configuration: Optimized for backup operations
      - Health Monitoring: Active

      Ready to receive backup coordinator connections!