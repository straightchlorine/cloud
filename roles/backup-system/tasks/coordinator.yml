# Backup System - Coordinator Deployment
# Deploys centralized backup coordinator (backup-wyse)

- name: Ensure backup coordinator user exists
  ansible.builtin.user:
    name: "{{ backup_user }}"
    shell: /bin/bash
    home: "{{ backup_base_path }}"
    create_home: true
    groups: ["sudo"]
    append: true
  register: backup_user_result
  failed_when:
    - backup_user_result.failed
    - "'currently used by process' not in backup_user_result.msg"

- name: Create coordinator directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  loop:
    - "{{ backup_base_path }}/scripts"
    - "{{ backup_base_path }}/logs"
    - "{{ backup_base_path }}/keys"
    - "{{ backup_base_path }}/.ssh"
    - "{{ backup_base_path }}/.ssh/nodes"
    - "{{ backup_base_path }}/cache"
    - "{{ backup_base_path }}/staging"
    - "{{ backup_base_path }}/.config"
    - "{{ backup_base_path }}/restore-staging"
    - "{{ backup_base_path }}/metrics"
    - "{{ backup_base_path }}/coordination"

- name: Install enterprise backup prerequisites
  ansible.builtin.package:
    name:
      - curl
      - jq
      - rsync
      - openssh-client
      - bc
    state: present

- name: Check if rclone is installed
  ansible.builtin.command: which rclone
  register: rclone_check
  changed_when: false
  failed_when: false

- name: Install rclone for coordinator
  ansible.builtin.shell: curl https://rclone.org/install.sh | bash
  when: rclone_check.rc != 0

- name: Install restic backup tool
  ansible.builtin.get_url:
    url: "https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/restic_{{ backup_restic_version }}_linux_amd64.bz2"
    dest: "/tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2"
    mode: '0644'

- name: Extract and install restic
  ansible.builtin.shell: |
    cd /tmp
    bunzip2 -f restic_{{ backup_restic_version }}_linux_amd64.bz2
    mv restic_{{ backup_restic_version }}_linux_amd64 /usr/local/bin/restic
    chmod +x /usr/local/bin/restic
  args:
    creates: /usr/local/bin/restic

- name: Create rclone configuration directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  loop:
    - "{{ backup_base_path }}/.config"
    - "{{ backup_base_path }}/.config/rclone"

- name: Generate SSH keys for each target
  ansible.builtin.openssh_keypair:
    path: "{{ backup_base_path }}/.ssh/nodes/{{ item.service_name }}"
    type: ed25519
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
    comment: "backup-{{ item.service_name }}@{{ ansible_hostname }}"
  loop: "{{ backup_targets }}"
  register: ssh_keys_generated

- name: Read SSH public keys from coordinator
  ansible.builtin.slurp:
    src: "{{ backup_base_path }}/.ssh/nodes/{{ item.service_name }}.pub"
  loop: "{{ backup_targets }}"
  register: ssh_public_keys

- name: Deploy SSH public keys to target hosts
  ansible.posix.authorized_key:
    user: "{{ item.item.ssh_user | default(backup_user) }}"
    state: present
    key: "{{ item.content | b64decode }}"
    comment: "backup-{{ item.item.service_name }}@{{ ansible_hostname }}"
    exclusive: false
  delegate_to: "{{ item.item.service_name }}"
  loop: "{{ ssh_public_keys.results }}"
  when: ssh_keys_generated is changed or backup_force_key_deployment | default(false)

- name: Verify SSH connectivity to targets
  ansible.builtin.shell: |
    ssh -i "{{ backup_base_path }}/.ssh/nodes/{{ item.service_name }}" \
        -o ConnectTimeout=10 \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=accept-new \
        "{{ item.ssh_user | default(backup_user) }}@{{ item.target_host }}" \
        "echo 'SSH connectivity verified'"
  become_user: "{{ backup_user }}"
  loop: "{{ backup_targets }}"
  register: ssh_connectivity_test
  failed_when: ssh_connectivity_test.rc != 0
  retries: 2
  delay: 5

- name: Create rclone configuration file
  ansible.builtin.template:
    src: rclone-config.conf.j2
    dest: "{{ backup_base_path }}/.config/rclone/rclone.conf"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'

- name: Create coordinator backup scripts for each target
  ansible.builtin.template:
    src: coordinator-backup.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-{{ item.service_name }}.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'
  vars:
    backup_target: "{{ item }}"
  loop: "{{ backup_targets }}"

- name: Create coordinator restore scripts for each target
  ansible.builtin.template:
    src: coordinator-restore.sh.j2
    dest: "{{ backup_base_path }}/scripts/enterprise-restore-{{ item.service_name }}.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'
  vars:
    backup_target: "{{ item }}"
  loop: "{{ backup_targets }}"

- name: Generate secure restic passwords for targets without existing passwords
  ansible.builtin.set_fact:
    generated_restic_passwords: "{{ generated_restic_passwords | default({}) | combine({item.service_name: lookup('password', '/dev/null chars=ascii_letters,digits,!@#$%^&*() length=32')}) }}"
  when: item.restic_password is not defined
  loop: "{{ backup_targets }}"
  no_log: true

- name: Create ansible-vault encrypted password files for each target
  ansible.builtin.copy:
    content: "{{ item.restic_password | default(generated_restic_passwords[item.service_name]) }}"
    dest: "{{ backup_base_path }}/keys/{{ item.service_name }}-password.vault"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
  no_log: true
  loop: "{{ backup_targets }}"

- name: Create plaintext password files for restic
  ansible.builtin.copy:
    content: "{{ item.restic_password }}"
    dest: "{{ backup_base_path }}/keys/{{ item.service_name }}-password"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
  loop: "{{ backup_targets }}"
  no_log: true


- name: Create systemd services for each target
  ansible.builtin.template:
    src: enterprise-backup.service.j2
    dest: "/etc/systemd/system/backup-{{ item.service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  vars:
    backup_target: "{{ item }}"
  loop: "{{ backup_targets }}"
  notify:
    - reload systemd

- name: Create systemd timers for each target
  ansible.builtin.template:
    src: enterprise-backup.timer.j2
    dest: "/etc/systemd/system/backup-{{ item.service_name }}.timer"
    owner: root
    group: root
    mode: '0644'
  vars:
    backup_target: "{{ item }}"
  loop: "{{ backup_targets }}"
  notify:
    - reload systemd

- name: Force handler execution
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timers
  ansible.builtin.systemd:
    name: "backup-{{ item.service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when: item.backup_enabled | default(true)
  loop: "{{ backup_targets }}"

- name: Initialize restic repositories
  ansible.builtin.shell: |
    export RESTIC_REPOSITORY="{{ item.restic_repository }}"
    export RESTIC_PASSWORD_FILE="{{ backup_base_path }}/keys/{{ item.service_name }}-password"
    export RESTIC_CACHE_DIR="{{ backup_base_path }}/cache/{{ item.service_name }}"

    if ! restic snapshots &>/dev/null; then
      restic init
      echo "Repository initialized for {{ item.service_name }}"
    else
      echo "Repository already exists for {{ item.service_name }}"
    fi
  become_user: "{{ backup_user }}"
  register: repository_init
  changed_when: "'Repository initialized' in repository_init.stdout"
  loop: "{{ backup_targets }}"

- name: Create coordinator management script
  ansible.builtin.template:
    src: coordinator-manager.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-manager.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'

- name: Create key rotation script
  ansible.builtin.template:
    src: key-rotation.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-key-rotation.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0755'

- name: Create key rotation service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Key Rotation Service
      After=network.target

      [Service]
      Type=oneshot
      User={{ backup_user }}
      ExecStart={{ backup_base_path }}/scripts/backup-key-rotation.sh
      StandardOutput=journal
      StandardError=journal
      PrivateTmp=true
      ProtectSystem=strict
      ReadWritePaths={{ backup_base_path }}
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/backup-key-rotation.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd

- name: Create key rotation timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup Key Rotation Timer
      Requires=backup-key-rotation.service

      [Timer]
      OnCalendar={{ backup_key_rotation_schedule | default('monthly') }}
      RandomizedDelaySec=3600
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/backup-key-rotation.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd

- name: Enable key rotation timer
  ansible.builtin.systemd:
    name: backup-key-rotation.timer
    enabled: true
    state: started
    daemon_reload: true
  when: backup_enable_key_rotation | default(true)