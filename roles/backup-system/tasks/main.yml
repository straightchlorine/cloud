---
# Backup System - Main Task Entry Point
# Unified backup solution with coordinator and node agents

- name: Import validation tasks
  ansible.builtin.import_tasks: validation.yml
  tags: [validation, backup]

- name: Import network facts collection
  ansible.builtin.import_role:
    name: common
    tasks_from: network_facts
  tags: [network, backup]

- name: Deploy backup coordinator
  ansible.builtin.import_tasks: coordinator.yml
  when: backup_role == "coordinator"
  tags: [coordinator, backup]

- name: Deploy standalone backup
  ansible.builtin.import_tasks: standalone.yml
  when: backup_role == "standalone"
  tags: [standalone, backup]

- name: Setup monitoring and health checks
  ansible.builtin.import_tasks: monitoring.yml
  when: backup_monitoring
  tags: [monitoring, backup]

- name: Display deployment summary
  ansible.builtin.debug:
    msg: |
      [OK] Backup System Deployed Successfully!

      role: {{ backup_role }}
      node: {{ inventory_hostname }}
      repository strategy: {{ backup_strategy }}
      monitoring: {{ backup_monitoring }}

      {% if backup_role == "coordinator" %}
      Coordinator Services:
      {% for target in backup_targets %}
      - {{ target.service_name }}: {{ target.target_host }}
      {% endfor %}
      {% endif %}

      backup system ready for production use!
