---
- name: Converge - Fail-Fast Validation
  hosts: all
  vars:
    timezone: UTC
    # Intentionally omit ALL required variables:
    # - domain_name, vault_domain_name, vault_letsencrypt_email
    # - automation_data_path, automation_stack_home
    # - automation_user, automation_uid, automation_gid
    # - vault_traefik_basic_auth, vault_cloudflare_api_token
    # - services_enabled, restic variables
    # This tests that role fails gracefully with clear error messages
  tasks:
    - name: Include automation validation (expect to fail)
      block:
        - name: Try to include automation validation without required variables
          ansible.builtin.include_tasks: ../../tasks/validate.yml
      rescue:
        - name: Capture expected validation failure
          ansible.builtin.set_fact:
            validation_failed: true
            validation_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Display validation failure message
          ansible.builtin.debug:
            msg: |
              [OK] Validation correctly failed (expected behavior)
              Error: {{ validation_error }}
