---
- name: Converge - automation Fail-Fast Validation
  hosts: all
  become: true
  vars:
    # Every required variable is set except automation_trusted_proxies, so case 1 leaves it undefined.
    # Each case includes the real roles/automation/tasks/validate.yml with its own variables.
    domain_name: example.test
    vault_domain_name: example.test
    vault_letsencrypt_email: test@example.test
    # The validate.yml file refuses a malformed APP_KEY, and this key has the accepted raw length.
    vault_firefly_app_key: MoleculeTestAppKey0123456789abcd
    # The validate.yml file accepts only a 32-character hex cron token, and this token matches.
    vault_firefly_static_cron_token: 0123456789abcdef0123456789abcdef
    vault_firefly_db_password: molecule-test-db-password
    vault_vaultwarden_admin_token: molecule-test-admin-token
    vault_watchtower_api_token: molecule-test-watchtower-token
    automation_data_path: /mnt/data
    automation_stack_home: /home/automation/stack
    automation_backup_enabled: false
    automation_restic_enabled: false
  pre_tasks:
    - name: Create the stack-home parent (validate.yml asserts it exists)
      # Cases 2 to 6 pass the required-variable check, so validate.yml must also pass the parent-directory check.
      # Only then does it reach the guard under test.
      ansible.builtin.file:
        path: /home/automation
        state: directory
        mode: "0755"

    - name: Create the non-root stack user the /root-guard case connects as
      # Case 4 overrides ansible_user, which the guard reads directly.
      # The podman connection then runs commands as that user, so it must exist or every later task is unreachable.
      ansible.builtin.user:
        name: testuser
        uid: 1000
        shell: /bin/bash
        create_home: true
  tasks:
    # Case 1: a required automation variable is missing.
    - name: "Case 1: validate.yml fails when automation_trusted_proxies is missing"
      block:
        - name: Run the real validate.yml with automation_trusted_proxies undefined
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"

        - name: Fail the test - validate.yml should have refused to run
          ansible.builtin.fail:
            msg: "validate.yml did not fail fast on a missing automation_trusted_proxies"
      rescue:
        - name: Assert the failure was for the missing automation_trusted_proxies specifically
          # A looped fail task reports the generic message "One or more items failed" in its own msg.
          # The per-item detail lives in .results, so the assertion reads that instead.
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results is defined
              - (ansible_failed_result.results | selectattr('failed') | map(attribute='item') | list) ==
                ['automation_trusted_proxies']
            fail_msg: >-
              validate.yml failed, but not for the expected reason
              (missing automation_trusted_proxies): {{ ansible_failed_result }}
            success_msg: "[OK] validate.yml correctly failed on the missing automation_trusted_proxies variable"

        - name: Record case 1 as passed for verify.yml
          # A marker file is used because converge and verify are separate processes, so set_fact would not reach
          # verify.
          # The force: false setting keeps the idempotence rerun unchanged.
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case1.passed
            force: false
            mode: "0644"

    # Case 2: a vault secret still holds its documented placeholder value.
    - name: "Case 2: validate.yml fails when vault_firefly_app_key still has its placeholder value"
      block:
        - name: Run the real validate.yml with vault_firefly_app_key left at its placeholder value
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            vault_firefly_app_key: "your-firefly-app-key"

        - name: Fail the test - validate.yml should have refused to run
          ansible.builtin.fail:
            msg: "validate.yml did not fail fast on a placeholder vault_firefly_app_key"
      rescue:
        - name: Assert the failure was for the placeholder vault_firefly_app_key specifically
          # The vault-placeholder guard is a looped fail, so as in case 1 the per-item reason lives in .results.
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results is defined
              - >-
                (ansible_failed_result.results | selectattr('failed')
                | map(attribute='msg') | select('search', 'vault_firefly_app_key')
                | list | length) == 1
            fail_msg: >-
              validate.yml failed, but not for the expected reason:
              {{ ansible_failed_result }}
            success_msg: "[OK] validate.yml correctly failed on the placeholder vault_firefly_app_key"

        - name: Record case 2 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case2.passed
            force: false
            mode: "0644"

    # Case 3: the TRUSTED_PROXIES catch-all guard.
    - name: "Case 3: validate.yml fails when TRUSTED_PROXIES is the catch-all '**'"
      block:
        - name: Run the real validate.yml with automation_trusted_proxies set to '**'
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            automation_trusted_proxies: "**"

        - name: Fail the test - the catch-all guard should have refused '**'
          ansible.builtin.fail:
            msg: "validate.yml did not fail on TRUSTED_PROXIES='**'"
      rescue:
        - name: Assert the failure was the TRUSTED_PROXIES guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'automation_trusted_proxies' in ansible_failed_result.msg"
              - "\"'**'\" in ansible_failed_result.msg"
            fail_msg: >-
              validate.yml failed, but not for the expected reason:
              {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's TRUSTED_PROXIES guard correctly refused '**'"

        - name: Record case 3 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case3.passed
            force: false
            mode: "0644"

    # Case 4 guards against a stack home that resolves under /root for a non-root stack user.
    # The parent-directory check passes because /root exists, so validate.yml must reach the /root guard and refuse.
    - name: "Case 4: validate.yml refuses a stack home under /root for a non-root user"
      block:
        - name: Run the real validate.yml with the /root stack-home misconfiguration
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            ansible_user: testuser
            automation_trusted_proxies: "100.64.0.0/10"
            automation_stack_home: /root/stack
            # The connection runs as testuser for this include, and validate.yml only reads facts and stats files.
            # So it needs no become, and the unprivileged user cannot sudo in the test container anyway.
            ansible_become: false

        - name: Fail the test - the /root guard should have refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse the /root stack home"
      rescue:
        - name: Assert the failure was the /root stack-home guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'/root' in (ansible_failed_result.msg | default(''))"
              - "'ansible_user' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              validate.yml failed, but not for the expected reason (stack home
              under /root): {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's /root stack-home guard correctly refused the misconfiguration"

        - name: Record case 4 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case4.passed
            force: false
            mode: "0644"

    # Case 5 guards against a static cron token that Firefly rejects, which makes its cron endpoint answer HTTP 500.
    # This case passes a token that is too short.
    - name: "Case 5: validate.yml refuses a malformed Firefly static cron token"
      block:
        - name: Run the real validate.yml with a short vault_firefly_static_cron_token
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            vault_firefly_static_cron_token: molecule-test-cron-token

        - name: Fail the test - the cron-token guard should have refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse the malformed Firefly static cron token"
      rescue:
        - name: Assert the failure was the cron-token guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'vault_firefly_static_cron_token' in (ansible_failed_result.msg | default(''))"
              - "'32' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              validate.yml failed, but not for the expected reason (Firefly
              static cron token): {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's Firefly cron-token guard correctly refused a malformed token"

        - name: Record case 5 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case5.passed
            force: false
            mode: "0644"

    # Case 6 guards against a malformed APP_KEY, which makes every route fail with HTTP 500.
    # The base variables carry a valid key, so this case passes bare base64 output without the base64: prefix.
    - name: "Case 6: validate.yml refuses a malformed Firefly APP_KEY"
      block:
        - name: Run the real validate.yml with a bare-44-char vault_firefly_app_key
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            vault_firefly_app_key: "base64-without-prefix-44-char-bare-openssloutput"

        - name: Fail the test - the APP_KEY guard should have refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse the malformed Firefly APP_KEY"
      rescue:
        - name: Assert the failure was the APP_KEY guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'vault_firefly_app_key' in (ansible_failed_result.msg | default(''))"
              - "'APP_KEY' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              validate.yml failed, but not for the expected reason (Firefly
              APP_KEY): {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's Firefly APP_KEY guard correctly refused a malformed key"

        - name: Record case 6 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case6.passed
            force: false
            mode: "0644"

    # Cases 7 to 9 cover the off-site restic job.
    # The restic role's own checks run from this validate.yml, so a bad job stops the run before any role deploys.

    - name: "Case 7: validate.yml refuses restic on without a repository"
      block:
        - name: Run the real validate.yml with automation_restic_repository undefined
          ansible.builtin.include_role:
            name: automation
            tasks_from: validate
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            automation_backup_enabled: true
            automation_backup_dir: /tmp/molecule-automation-backup
            automation_restic_enabled: true
            automation_restic_password: molecule-restic-password-automation

        - name: Fail the test - the missing repository should have been refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse case 7"
      rescue:
        - name: Assert the failure was the missing automation_restic_repository
          ansible.builtin.assert:
            that:
              - "'automation_restic_repository' in ansible_failed_result.msg"
              - "'undefined' in ansible_failed_result.msg"
            fail_msg: "validate.yml failed for another reason: {{ ansible_failed_result }}"

        - name: Record case 7 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case7.passed
            force: false
            mode: "0644"

    - name: "Case 8: validate.yml refuses restic on while the consistent dumps are off"
      block:
        - name: Run the real validate.yml with automation_backup_enabled false
          ansible.builtin.include_role:
            name: automation
            tasks_from: validate
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            automation_restic_enabled: true
            automation_restic_repository: /srv/molecule-restic/automation
            automation_restic_password: molecule-restic-password-automation

        - name: Fail the test - the missing dumps should have been refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse case 8"
      rescue:
        - name: Assert the failure names automation_backup_enabled
          ansible.builtin.assert:
            that: "ansible_failed_result.msg is match('automation_backup_enabled: must be true')"
            fail_msg: "validate.yml failed for another reason: {{ ansible_failed_result.msg | default('') }}"

        - name: Record case 8 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case8.passed
            force: false
            mode: "0644"

    - name: "Case 9: validate.yml runs the restic job checks on the job the role builds"
      block:
        - name: Run the real validate.yml with a too-short restic password
          ansible.builtin.include_role:
            name: automation
            tasks_from: validate
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            automation_backup_enabled: true
            automation_backup_dir: /tmp/molecule-automation-backup
            automation_restic_enabled: true
            automation_restic_repository: /srv/molecule-restic/automation
            automation_restic_password: short

        - name: Fail the test - the short password should have been refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse case 9"
      rescue:
        - name: Assert the failure came from the restic job checks
          ansible.builtin.assert:
            that: "ansible_failed_result.msg is match('restic_job.password: shorter than 16')"
            fail_msg: "validate.yml failed for another reason: {{ ansible_failed_result.msg | default('') }}"

        - name: Record case 9 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case9.passed
            force: false
            mode: "0644"
