---
- name: Converge - automation Fail-Fast Validation
  hosts: all
  become: true
  vars:
    # Every required variable except automation_trusted_proxies, so Case 1
    # leaves it genuinely undefined. Each case below then includes the REAL
    # roles/automation/tasks/validate.yml with per-case vars - no hand-copied
    # guards to keep in sync.
    domain_name: example.test
    vault_domain_name: example.test
    vault_letsencrypt_email: test@example.test
    vault_firefly_app_key: molecule-test-app-key
    vault_firefly_static_cron_token: molecule-test-cron-token
    vault_firefly_db_password: molecule-test-db-password
    vault_vaultwarden_admin_token: molecule-test-admin-token
    vault_watchtower_api_token: molecule-test-watchtower-token
    automation_data_path: /mnt/data
    automation_stack_home: /home/automation/stack
    restic_enabled: false
    restic_repository: /tmp/test-restic
    restic_password: molecule-test-restic-password
  pre_tasks:
    - name: Create the stack-home parent (validate.yml asserts it exists)
      # Cases 2 and 3 pass the required-variable check, so validate.yml must
      # run past the parent-directory check and reach the guard under test.
      ansible.builtin.file:
        path: /home/automation
        state: directory
        mode: "0755"
  tasks:
    # Case 1: a required automation variable is missing.
    - name: "Case 1: validate.yml fails when automation_trusted_proxies is missing"
      block:
        - name: Run the real validate.yml with automation_trusted_proxies undefined
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"

        - name: Fail the test - validate.yml should have refused to run
          ansible.builtin.fail:
            msg: "validate.yml did not fail fast on a missing automation_trusted_proxies"
      rescue:
        - name: Assert the failure was for the missing automation_trusted_proxies specifically
          # A looped fail task's own top-level msg is the generic "One or more
          # items failed" - the per-item detail lives in .results, so assert
          # on that rather than on ansible_failed_result.msg directly.
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results is defined
              - (ansible_failed_result.results | selectattr('failed') | map(attribute='item') | list) ==
                ['automation_trusted_proxies']
            fail_msg: >-
              validate.yml failed, but not for the expected reason
              (missing automation_trusted_proxies): {{ ansible_failed_result }}
            success_msg: "[OK] validate.yml correctly failed on the missing automation_trusted_proxies variable"

        - name: Record case 1 as passed for verify.yml
          # A file, not set_fact: converge and verify are separate
          # ansible-playbook processes - in-memory facts do not cross that
          # boundary. force: false keeps the idempotence rerun unchanged.
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case1.passed
            force: false
            mode: "0644"

    # Case 2: a vault secret still holds its documented placeholder value.
    - name: "Case 2: validate.yml fails when vault_firefly_app_key still has its placeholder value"
      block:
        - name: Run the real validate.yml with vault_firefly_app_key left at its placeholder value
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            automation_trusted_proxies: "100.64.0.0/10"
            vault_firefly_app_key: "your-firefly-app-key"

        - name: Fail the test - validate.yml should have refused to run
          ansible.builtin.fail:
            msg: "validate.yml did not fail fast on a placeholder vault_firefly_app_key"
      rescue:
        - name: Assert the failure was for the placeholder vault_firefly_app_key specifically
          # The vault-placeholder guard is a looped fail, so like Case 1 the
          # per-item reason lives in .results - assert on that.
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results is defined
              - >-
                (ansible_failed_result.results | selectattr('failed')
                | map(attribute='msg') | select('search', 'vault_firefly_app_key')
                | list | length) == 1
            fail_msg: >-
              validate.yml failed, but not for the expected reason:
              {{ ansible_failed_result }}
            success_msg: "[OK] validate.yml correctly failed on the placeholder vault_firefly_app_key"

        - name: Record case 2 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case2.passed
            force: false
            mode: "0644"

    # Case 3: the TRUSTED_PROXIES catch-all guard.
    - name: "Case 3: validate.yml fails when TRUSTED_PROXIES is the catch-all '**'"
      block:
        - name: Run the real validate.yml with automation_trusted_proxies set to '**'
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            automation_trusted_proxies: "**"

        - name: Fail the test - the catch-all guard should have refused '**'
          ansible.builtin.fail:
            msg: "validate.yml did not fail on TRUSTED_PROXIES='**'"
      rescue:
        - name: Assert the failure was the TRUSTED_PROXIES guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'automation_trusted_proxies' in ansible_failed_result.msg"
              - "\"'**'\" in ansible_failed_result.msg"
            fail_msg: >-
              validate.yml failed, but not for the expected reason:
              {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's TRUSTED_PROXIES guard correctly refused '**'"

        - name: Record case 3 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case3.passed
            force: false
            mode: "0644"

    # Case 4 (regression guard): stack home resolved under /root for a non-root
    # stack user - the exact trap that shipped a /root/stack deploy
    # once. The parent-dir check passes (/root exists), so validate.yml reaches
    # the new /root guard and must refuse.
    - name: "Case 4: validate.yml refuses a stack home under /root for a non-root user"
      block:
        - name: Run the real validate.yml with the /root stack-home misconfiguration
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            ansible_user: testuser
            automation_trusted_proxies: "100.64.0.0/10"
            automation_stack_home: /root/stack

        - name: Fail the test - the /root guard should have refused
          ansible.builtin.fail:
            msg: "validate.yml did not refuse the /root stack home"
      rescue:
        - name: Assert the failure was the /root stack-home guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'/root' in (ansible_failed_result.msg | default(''))"
              - "'ansible_user' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              validate.yml failed, but not for the expected reason (stack home
              under /root): {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's /root stack-home guard correctly refused the misconfiguration"

        - name: Record case 4 as passed for verify.yml
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case4.passed
            force: false
            mode: "0644"
