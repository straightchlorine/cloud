---
- name: Converge automation teardown
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  pre_tasks:
    - name: Prepare stack home and remap facts
      ansible.builtin.include_tasks: ../shared/pre_deploy.yml

  tasks:
    # The deploy removes nothing on a rerun but the teardown removes what it creates, so the arrange steps skip
    # idempotence; the untagged teardown is the system under test and must converge.
    - name: Deploy what a container allows
      tags: [molecule-idempotence-notest]
      block:
        - name: Gather network facts
          ansible.builtin.include_role:
            name: common
            tasks_from: network_facts

        - name: Deploy the stack
          ansible.builtin.include_role:
            name: automation
            tasks_from: stack

        - name: Deploy the backup
          ansible.builtin.include_role:
            name: automation
            tasks_from: backup

        - name: Install and start the stack unit
          ansible.builtin.include_tasks: ../shared/install_unit.yml

    - name: Refuse an unconfirmed teardown
      block:
        - name: Run the teardown without teardown_confirmed
          ansible.builtin.include_role:
            name: automation
            tasks_from: teardown

        - name: Fail when the unconfirmed teardown ran
          ansible.builtin.fail:
            msg: unconfirmed teardown ran
      rescue:
        - name: Assert the refusal and record it
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"
          vars:
            molecule_case:
              id: unconfirmed-teardown
              expect: >-
                automation teardown requires the shared teardown_confirmed fact - run
                through playbooks/automation-teardown.yml instead.

    - name: Run the confirmed teardown
      # Its own self-verification runs inside this include.
      ansible.builtin.include_role:
        name: automation
        tasks_from: teardown
      vars:
        teardown_confirmed: true
