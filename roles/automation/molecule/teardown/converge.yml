---
- name: Converge - deploy what a container allows, then run the real teardown
  hosts: all
  become: true
  vars:
    ansible_user: root
    timezone: UTC
    domain_name: example.test
    vault_domain_name: example.test
    vault_letsencrypt_email: test@example.test
    # 32 chars - validate.yml refuses a malformed APP_KEY (Laravel's encrypter
    # fatal "Unsupported cipher or incorrect key length" 500s every route).
    vault_firefly_app_key: MoleculeTestAppKey0123456789abcd
    # 32 hex chars - validate.yml refuses anything else (Firefly rejects a
    # differently-sized static cron token with HTTP 500 on its cron endpoint).
    vault_firefly_static_cron_token: 0123456789abcdef0123456789abcdef
    vault_firefly_db_password: molecule-test-db-password
    vault_vaultwarden_admin_token: molecule-test-admin-token
    vault_watchtower_api_token: molecule-test-watchtower-token
    automation_trusted_proxies: "100.64.0.0/10"
    automation_data_path: /mnt/data
    automation_stack_home: /home/automation/stack
    automation_backup_enabled: true
    automation_backup_dir: /tmp/molecule-automation-backup
    automation_backup_owner: molecule
    restic_enabled: false
    common_start_stack: false
  pre_tasks:
    - name: Create the stack-home parent (validate.yml asserts it exists)
      ansible.builtin.file:
        path: "{{ automation_stack_home | dirname }}"
        state: directory
        mode: "0755"

    - name: Publish fixture userns-remap facts
      # docker.yml (deliberately excluded here) publishes these on a real
      # host; stack.yml's ownership tasks read them. The fixture uid must sit inside
      # the nested rootless-podman mapping (container uids 0-65536 only - the
      # canonical dockremap base 165536 is outside it and chown fails with
      # EINVAL).
      ansible.builtin.set_fact:
        common_dockremap_uid: "10000"
        common_dockremap_gid: "10000"

  tasks:
    # Deploy side (the ARRANGE phase): the container-safe parts of a real deploy,
    # so the teardown has real things to remove. Tagged molecule-idempotence-notest
    # because the teardown removes what this creates; the system under test is the
    # teardown, which must converge on a rerun.
    - name: Gather network facts for dynamic configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts
      tags: [molecule-idempotence-notest]

    - name: Run the real stack deployment
      ansible.builtin.include_role:
        name: automation
        tasks_from: stack
      tags: [molecule-idempotence-notest]

    - name: Run the real backup deployment
      ansible.builtin.include_role:
        name: automation
        tasks_from: backup
      tags: [molecule-idempotence-notest]

    # Fixture: what docker_stack_service would have created on a real host (a
    # container has no docker.service, so the unit is faked here only to give
    # the teardown a real unit file to stop and remove).
    - name: Create the fake stack service unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Automation Stack (molecule fixture)
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/stack.service
        mode: "0644"
      tags: [molecule-idempotence-notest]

    # The real teardown, as playbooks/automation-teardown.yml runs it once
    # teardown_confirmed is set. Its own self-verification runs as part of this
    # include; docker compose down is skipped by the docker-info guard.
    - name: Run the real automation role teardown
      ansible.builtin.include_role:
        name: automation
        tasks_from: teardown
      vars:
        teardown_confirmed: true
