---
- name: Verify automation teardown
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Assert the refusal check recorded its marker
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_markers.yml"
      vars:
        molecule_case_ids: [unconfirmed-teardown]

    - name: Assert no role artifact survives
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - { path: /usr/local/bin/automation-syncthing-backup, state: absent }
          - { path: /usr/local/bin/manage-automation, state: absent }
          - { path: /etc/systemd/system/stack.service, state: absent }
          - { path: /var/log/automation-syncthing-backup.log, state: absent }
          - { path: "{{ automation_stack_home }}", state: absent }

    - name: Read root's crontab
      # crontab -l exits 1 when root has no crontab, which is a clean result.
      ansible.builtin.command: crontab -l -u root
      register: automation_teardown_crontab
      changed_when: false
      failed_when: automation_teardown_crontab.rc not in [0, 1]

    - name: Assert the backup cron job is gone
      ansible.builtin.assert:
        that: "'Automation Syncthing local backup' not in automation_teardown_crontab.stdout"
        fail_msg: "cron job survived: {{ automation_teardown_crontab.stdout }}"
        quiet: true

    - name: Read the stack unit state
      ansible.builtin.command: systemctl is-active stack
      register: automation_teardown_unit
      changed_when: false
      failed_when: false  # is-active exits non-zero for an inactive or missing unit, which is the expected result

    - name: Assert the stack unit is not active
      ansible.builtin.assert:
        that: automation_teardown_unit.stdout | trim != 'active'
        quiet: true
