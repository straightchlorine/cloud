---
- name: Prepare - platform prerequisites the role assumes
  hosts: all
  become: true
  tasks:
    - name: Install cron and iproute2
      # The cron module needs the crontab binary from the cron package, which the minimal test image may not ship.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
        state: present
        update_cache: true

    - name: Create the backup owner user
      # The backup.yml task file sets automation_backup_owner as the owner of the Syncthing backup directory.
      ansible.builtin.user:
        name: molecule
        system: true

    - name: Stub docker and docker.service for the real stack unit
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../common/molecule/fixtures/stub_docker.yml"
