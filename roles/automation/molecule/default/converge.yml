---
- name: Converge automation default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  pre_tasks:
    - name: Prepare stack home and remap facts
      ansible.builtin.include_tasks: ../shared/pre_deploy.yml

  tasks:
    # Skipped task files: common packages (slow; scripts/automation/validate-deploy.sh covers it), common optional_ssd
    # (container must not touch block devices), docker.yml (stubbed in prepare), firewall (ufw cannot bind in a
    # container), post_deploy_validate.yml (needs a running compose stack).
    - name: Gather network facts
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Validate
      ansible.builtin.include_role:
        name: automation
        tasks_from: validate

    - name: Validate with the off-site backup on
      # backup.yml below keeps restic off: deploying the restic job needs systemd units this image lacks.
      ansible.builtin.include_role:
        name: automation
        tasks_from: validate
      vars:
        automation_restic_enabled: true
        automation_restic_repository: /srv/molecule-restic/automation
        automation_restic_password: molecule-restic-password-automation

    - name: Deploy the stack
      ansible.builtin.include_role:
        name: automation
        tasks_from: stack

    - name: Deploy the backup
      ansible.builtin.include_role:
        name: automation
        tasks_from: backup

    - name: Install and start the stack unit
      ansible.builtin.include_tasks: ../shared/install_unit.yml
