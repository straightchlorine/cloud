---
- name: Converge - the automation role's container-testable task files
  hosts: all
  become: true
  vars:
    # Mirrors host_vars/pi-automation.yml with fake secrets. ansible_user is
    # pinned because the role's ownership/become wiring reads it directly.
    ansible_user: root
    timezone: UTC
    domain_name: example.test
    vault_domain_name: example.test
    vault_letsencrypt_email: test@example.test
    vault_firefly_app_key: molecule-test-app-key
    vault_firefly_static_cron_token: molecule-test-cron-token
    vault_firefly_db_password: molecule-test-db-password
    vault_vaultwarden_admin_token: molecule-test-admin-token
    vault_watchtower_api_token: molecule-test-watchtower-token
    automation_trusted_proxies: "100.64.0.0/10"
    automation_data_path: /mnt/automation-data
    automation_stack_home: /home/automation/automation-stack
    automation_backup_enabled: true
    automation_backup_dir: /tmp/molecule-automation-backup
    automation_backup_owner: molecule
    restic_enabled: false
    restic_repository: /tmp/test-restic
    restic_password: molecule-test-restic-password
    common_start_stack: false
  pre_tasks:
    - name: Create the stack-home parent (validate.yml asserts it exists)
      ansible.builtin.file:
        path: "{{ automation_stack_home | dirname }}"
        state: directory
        mode: "0755"

  tasks:
    # main.yml's task files that are container-safe, in the same order the
    # role runs them. include_role tasks_from runs the real task file with
    # the role's defaults loaded. NOT included, deliberately:
    #   - packages.yml include (apt installs the whole common list - slow,
    #     covered on the staging Pi by scripts/automation/validate-deploy.sh)
    #   - storage.yml (prepares/mounts the optional SSD - containers must
    #     not touch the host's block devices)
    #   - docker.yml (installs the Docker daemon; no docker-in-docker here -
    #     start_stack is false so compose up is skipped too)
    #   - docker_stack_service (the unit Requires=docker.service, which a
    #     container lacks; the unit template is rendered standalone below)
    #   - firewall (ufw cannot bind rules in a container)
    #   - post_deploy_validate.yml (needs a running compose stack)
    - name: Gather network facts for dynamic configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

    - name: Run the real pre-deployment validation
      ansible.builtin.include_role:
        name: automation
        tasks_from: validate

    - name: Run the real stack deployment (compose + .env + manage script)
      ansible.builtin.include_role:
        name: automation
        tasks_from: stack

    - name: Run the real backup deployment (script + cron, syncthing off)
      ansible.builtin.include_role:
        name: automation
        tasks_from: backup

    - name: Render the automation-stack systemd unit
      # docker_stack_service itself needs docker.service (excluded above) -
      # render the unit here so a broken template variable still fails CI
      # instead of silently writing a broken unit on a real Pi.
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../common/templates/systemd-service.j2"
        dest: /tmp/automation-stack.service.rendered
        mode: "0644"
      vars:
        service_description: "Automation Stack (molecule render)"
        service_requires: ["docker.service"]
        service_after: ["docker.service", "network-online.target"]
        common_service_wants: ["network.target"]
        service_type: "oneshot"
        common_remain_after_exit: "true"
        common_working_directory: "{{ automation_stack_home }}"
        service_user: "{{ ansible_user }}"
        service_group: "{{ ansible_user }}"
        service_environment:
          - "AUTOMATION_DATA_PATH={{ automation_data_path }}"
        exec_start: "/usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml up -d"
        exec_stop: "/usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml down"
        exec_reload: "/usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml restart"
        syslog_identifier: "automation-stack"
        common_timeout_start_sec: "0"
        kill_mode: "none"
        common_standard_output: "journal"
        common_standard_error: "journal"
        common_restart_policy: "on-failure"
        common_restart_sec: "5"
        common_wanted_by: "multi-user.target"
        common_enable_security_hardening: true
        common_no_new_privileges: "true"
