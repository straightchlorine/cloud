---
- name: Converge - Default (Core Role Logic)
  hosts: all
  vars:
    timezone: UTC
    # Domain configuration
    domain_name: "example.local"
    vault_domain_name: "example.local"
    vault_letsencrypt_email: "test@example.local"

    # Paths
    automation_data_path: /mnt/automation-data
    automation_stack_home: /home/automation/automation-stack

    # User
    automation_user: automation
    automation_uid: 2000
    automation_gid: 2000

    # Authentication (dummy values for test)
    vault_traefik_basic_auth: "admin:$2y$10$testhashedpassword"
    vault_cloudflare_api_token: "test-token-for-molecule"
    vault_influxdb3_session_secret_key: "test-session-secret-key-32-chars-long"
    vault_watchtower_api_token: "test-watchtower-token"

    # Services
    automation_services_enabled:
      traefik: true
      vaultwarden: true

    # Backup (minimal, disabled)
    restic_enabled: false
    restic_repository: /tmp/test-restic
    restic_password: test-password-12345678901234567890
    backup_ssh_host: localhost
    backup_ssh_port: 22
    backup_ssh_user: backup

    # Ports
    automation_traefik_web_port: 80
    automation_traefik_websecure_port: 443
    automation_traefik_dashboard_port: 8080

    # Disable container startup (Docker-in-Docker limitation)
    start_stack: false

    # SSL staging mode
    automation_letsencrypt_staging: true
    letsencrypt_email: "test@example.local"
    letsencrypt_staging: true

    # Subdomains
    automation_subdomain_traefik: "traefik"
    automation_subdomain_dozzle: "dozzle"
    automation_subdomain_portainer: "portainer"
    automation_subdomain_influxdb: "influxdb"
    automation_subdomain_explorer: "explorer"
    automation_subdomain_vaultwarden: "vault"
    automation_domain_name: "example.local"

  pre_tasks:
    - name: Create parent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      become: true
      loop:
        - "{{ automation_data_path | dirname }}"
        - "{{ automation_stack_home | dirname }}"

    - name: Gather facts (replaces network facts for testing)
      ansible.builtin.setup:
        gather_subset: network

  tasks:
    - name: Note about molecule test limitations
      ansible.builtin.debug:
        msg: |
          Running simplified test of automation role core logic
          Note: Common role dependencies not available in molecule
          Testing only: user creation, directory structure, file permissions, templates

    - name: Create automation group
      ansible.builtin.group:
        name: "{{ automation_user }}"
        gid: "{{ automation_gid }}"
        state: present
      become: true

    - name: Create automation user
      ansible.builtin.user:
        name: "{{ automation_user }}"
        uid: "{{ automation_uid }}"
        group: "{{ automation_user }}"
        shell: /bin/bash
        home: "/home/{{ automation_user }}"
        createhome: true
      become: true

    - name: Create automation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ automation_uid }}"
        group: "{{ automation_gid }}"
        mode: "0755"
      become: true
      loop:
        - "{{ automation_data_path }}"
        - "{{ automation_stack_home }}"
        - "{{ automation_stack_home }}/config"
        - "{{ automation_stack_home }}/config/traefik"
        - "{{ automation_stack_home }}/scripts"
        - "{{ automation_data_path }}/traefik"
        - "{{ automation_data_path }}/influxdb3"
        - "{{ automation_data_path }}/influxdb3/data"
        - "{{ automation_data_path }}/influxdb3/plugins"
        - "{{ automation_data_path }}/influxdb3-explorer"
        - "{{ automation_data_path }}/vaultwarden"
        - "{{ automation_data_path }}/portainer"
        - "{{ automation_data_path }}/dozzle"

    - name: Create acme.json with secure permissions
      ansible.builtin.copy:
        content: |
          {}
        dest: "{{ automation_data_path }}/traefik/acme.json"
        owner: "{{ automation_uid }}"
        group: "{{ automation_gid }}"
        mode: '0600'
      become: true

    - name: Create Traefik static configuration (test placeholder)
      ansible.builtin.copy:
        content: |
          # Test placeholder for traefik.yml
          # Full template requires common role dependencies
          global:
            checkNewVersion: false
        dest: "{{ automation_stack_home }}/config/traefik/traefik.yml"
        owner: "{{ automation_uid }}"
        group: "{{ automation_gid }}"
        mode: '0644'
      become: true

    - name: Create Traefik dynamic configuration (test placeholder)
      ansible.builtin.copy:
        content: |
          # Test placeholder for dynamic.yml
          # Full template requires common role dependencies
          http:
            routers: {}
        dest: "{{ automation_stack_home }}/config/traefik/dynamic.yml"
        owner: "{{ automation_uid }}"
        group: "{{ automation_gid }}"
        mode: '0644'
      become: true

    - name: Create docker-compose.yml for testing
      ansible.builtin.copy:
        content: |
          version: "3.9"
          services:
            traefik:
              image: "traefik:v3.0"
          networks:
            traefik-network:
              driver: bridge
        dest: "{{ automation_stack_home }}/docker-compose.yml"
        owner: "{{ automation_uid }}"
        group: "{{ automation_gid }}"
        mode: '0644'
      become: true

    - name: Create management script (test placeholder)
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Management script placeholder
          # Test that script exists and is executable
          echo "Automation stack management script"
        dest: "{{ automation_stack_home }}/scripts/manage-automation.sh"
        owner: "{{ automation_uid }}"
        group: "{{ automation_gid }}"
        mode: "0755"
      become: true
