---
- name: Verify the automation role's deployed state
  hosts: all
  become: true
  vars:
    automation_stack_home: /home/automation/automation-stack
  tasks:
    - name: Read the generated compose file and env file
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ automation_stack_home }}/docker-compose.yml"
        - "{{ automation_stack_home }}/.env"
        - /usr/local/bin/automation-syncthing-backup
        - "{{ automation_stack_home }}/scripts/manage-automation.sh"
        - /tmp/automation-stack.service.rendered
      register: automation_deployed_files

    - name: Stat the deployed files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ automation_stack_home }}/.env"
        - "{{ automation_stack_home }}/scripts/manage-automation.sh"
        - /usr/local/bin/manage-automation
        - /usr/local/bin/automation-syncthing-backup
        - /tmp/molecule-automation-backup
        - /tmp/automation-stack.service.rendered
      register: automation_deployed_stats

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      register: automation_root_crontab

    - name: Assert compose file contents (services, bindings, no secrets)
      vars:
        compose_file: "{{ automation_deployed_files.results[0].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'vaultwarden:' in compose_file"
          - "'fireflyiii/core:latest' in compose_file"
          - "'mariadb:11.4' in compose_file"
          - "'containrrr/watchtower' in compose_file"
          - "'crocodilestick/calibre-web-automated' in compose_file"
          # Ports bind to the discovered primary_ip, watchtower stays on loopback.
          - "':8081:80' in compose_file"
          - "':8082:8080' in compose_file"
          - "':8083:8083' in compose_file"
          - "'127.0.0.1:8084:8080' in compose_file"
          # Calibre's three separate binds (config/ingest/library) - CWA errors
          # on nested binds, so each must be its own directory.
          - "'/cwa-book-ingest' in compose_file"
          - "'/calibre-library' in compose_file"
          # Secrets only as ${VAR} placeholders - never inlined.
          - "'ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}' in compose_file"
          - "'DB_PASSWORD=${FIREFLY_DB_PASSWORD}' in compose_file"
          - "'HARDCOVER_TOKEN=${HARDCOVER_TOKEN}' in compose_file"
          - "'molecule-test' not in compose_file"
          # Watchtower label-enable policy on apps; mariadb has no label.
          - "'com.centurylinklabs.watchtower.enable=true' in compose_file"
        fail_msg: "docker-compose.yml rendered wrong:\n{{ compose_file }}"
        success_msg: "[OK] compose file has the 6 services, correct bindings and no inlined secrets"

    - name: Assert the generated .env carries the secrets at 0600
      vars:
        env_file: "{{ automation_deployed_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'VAULTWARDEN_ADMIN_TOKEN=molecule-test-admin-token' in env_file"
          - "'FIREFLY_DB_PASSWORD=molecule-test-db-password' in env_file"
          - "'WATCHTOWER_API_TOKEN=molecule-test-watchtower-token' in env_file"
          - automation_deployed_stats.results[0].stat.mode == '0600'
        fail_msg: >-
          .env wrong (mode {{ automation_deployed_stats.results[0].stat.mode }}):
          {{ env_file }}
        success_msg: "[OK] .env holds every vault secret and is 0600"

    - name: Assert the manage script and its symlink
      ansible.builtin.assert:
        that:
          - automation_deployed_stats.results[1].stat.mode == '0755'
          - automation_deployed_stats.results[1].stat.executable
          - automation_deployed_stats.results[2].stat.islnk
          - "'docker compose' in (automation_deployed_files.results[3].content | b64decode)"
        fail_msg: manage script/symlink wrong
        success_msg: "[OK] manage-automation.sh (0755) deployed and symlinked into PATH"

    - name: Assert the backup script and cron job
      vars:
        backup_script: "{{ automation_deployed_files.results[2].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - automation_deployed_stats.results[3].stat.mode == '0755'
          - "'/usr/local/bin/automation-syncthing-backup' in automation_root_crontab.stdout"
          - "'Automation Syncthing local backup' in automation_root_crontab.stdout"
          # The backup script must not embed any vault secret.
          - "'molecule-test' not in backup_script"
          - "'VACUUM INTO' in backup_script"
          - "'mariadb-dump' in backup_script"
        fail_msg: "backup script/cron wrong: {{ backup_script }}"
        success_msg: "[OK] backup script (0755, no embedded secrets) + root cron present"

    - name: Assert the backup directory ownership
      ansible.builtin.assert:
        that:
          - automation_deployed_stats.results[4].stat.isdir
          - automation_deployed_stats.results[4].stat.mode == '0750'
          - automation_deployed_stats.results[4].stat.pw_name == 'molecule'
        fail_msg: >-
          backup dir wrong: mode {{ automation_deployed_stats.results[4].stat.mode }}
          owner {{ automation_deployed_stats.results[4].stat.pw_name }}
        success_msg: "[OK] Syncthing backup dir 0750 owned by molecule"

    - name: Assert the rendered systemd unit
      vars:
        unit: "{{ automation_deployed_files.results[4].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'Requires=docker.service' in unit"
          - "'ExecStart=/usr/bin/docker compose -f /home/automation/automation-stack/docker-compose.yml up -d' in unit"
          - "'RemainAfterExit=true' in unit"
        fail_msg: "systemd unit rendered wrong:\n{{ unit }}"
        success_msg: "[OK] automation-stack unit renders with explicit compose path"
