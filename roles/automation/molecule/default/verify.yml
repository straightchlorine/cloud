---
- name: Verify the automation role's deployed state
  hosts: all
  become: true
  vars:
    automation_stack_home: /home/automation/stack
  tasks:
    - name: Read the generated compose file and env file
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ automation_stack_home }}/docker-compose.yml"
        - "{{ automation_stack_home }}/.env"
        - /usr/local/bin/automation-syncthing-backup
        - "{{ automation_stack_home }}/scripts/manage-automation.sh"
        - /tmp/stack.service.rendered
      register: automation_deployed_files

    - name: Stat the deployed files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ automation_stack_home }}/.env"
        - "{{ automation_stack_home }}/scripts/manage-automation.sh"
        - /usr/local/bin/manage-automation
        - /usr/local/bin/automation-syncthing-backup
        - /tmp/molecule-automation-backup
        - /tmp/stack.service.rendered
      register: automation_deployed_stats

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      register: automation_root_crontab

    - name: Assert compose file contents (services, bindings, no secrets)
      vars:
        compose_file: "{{ automation_deployed_files.results[0].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'vaultwarden:' in compose_file"
          - "'fireflyiii/core:latest' in compose_file"
          - "'mariadb:11.8.9' in compose_file"
          - "'nickfedor/watchtower' in compose_file"
          - "'crocodilestick/calibre-web-automated' in compose_file"
          - "':8081:80' in compose_file"
          - "':8082:8080' in compose_file"
          - "':8083:8083' in compose_file"
          - "':8084:8080' in compose_file"
          - "':8085:8080' in compose_file"
          # Calibre's three separate binds (config/ingest/library) - CWA errors
          # on nested binds
          - "'/cwa-book-ingest' in compose_file"
          - "'/calibre-library' in compose_file"
          # Secrets only as ${VAR} placeholders - never inlined.
          - "'ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}' in compose_file"
          - "'DB_PASSWORD=${FIREFLY_DB_PASSWORD}' in compose_file"
          # mariadb entrypoint demands a root-password policy on first init;
          # root is unused (unix_socket maintenance, firefly-user backups).
          - "'MARIADB_RANDOM_ROOT_PASSWORD=1' in compose_file"
          - "'HARDCOVER_TOKEN=${HARDCOVER_TOKEN}' in compose_file"
          - "'molecule-test' not in compose_file"
          # Watchtower label-enable policy on apps; mariadb has no label.
          - "'com.centurylinklabs.watchtower.enable=true' in compose_file"
        fail_msg: "docker-compose.yml rendered wrong:\n{{ compose_file }}"
        success_msg: "[OK] compose file has the 7 services, correct bindings and no inlined secrets"

    - name: Assert the rendered compose parses and has no empty top-level keys
      vars:
        compose_file: "{{ automation_deployed_files.results[0].content | b64decode }}"
        compose_data: "{{ compose_file | from_yaml }}"
      ansible.builtin.assert:
        that:
          - >-
            'volumes' not in compose_data or (compose_data.volumes is mapping and compose_data.volumes | length > 0)
          - >-
            'networks' not in compose_data or (compose_data.networks is mapping and compose_data.networks | length > 0)
          - "compose_data.services is mapping"
        fail_msg: >-
          rendered compose file is structurally invalid (empty volumes/networks,
          or missing services): {{ compose_data }}
        success_msg: "[OK] rendered compose parses and has non-empty volumes/networks mappings"

    - name: Assert Watchtower's schedule actually runs
      vars:
        watchtower_env: >-
          {{ dict((automation_deployed_files.results[0].content | b64decode | from_yaml)
          .services.watchtower.environment | map('split', '=', 1)) }}
      ansible.builtin.assert:
        that:
          # The 'update' endpoint switches Watchtower to API-only mode, silently
          # disabling WATCHTOWER_SCHEDULE unless periodic polls are re-enabled.
          - >-
            'update' not in watchtower_env.WATCHTOWER_HTTP_API_ENDPOINTS.split(',')
            or watchtower_env.WATCHTOWER_HTTP_API_PERIODIC_POLLS | default('false') | bool
          # Watchtower's cron has a leading seconds field.
          - watchtower_env.WATCHTOWER_SCHEDULE.split() | length == 6
        fail_msg: "watchtower env would never run its schedule: {{ watchtower_env }}"
        success_msg: "[OK] watchtower schedule is 6-field and not disabled by the update API"

    - name: Assert cAdvisor is updated by Watchtower and not exposed on 0.0.0.0
      vars:
        cadvisor: "{{ (automation_deployed_files.results[0].content | b64decode | from_yaml).services.cadvisor }}"
      ansible.builtin.assert:
        that:
          - "'com.centurylinklabs.watchtower.enable=true' in cadvisor.labels"
          - >-
            cadvisor.ports | select('match', '^' ~ ansible_facts['default_ipv4']['address'] ~ ':')
            | list | length == cadvisor.ports | length
        fail_msg: "cadvisor service wrong: {{ cadvisor }}"
        success_msg: "[OK] cadvisor labelled for Watchtower and bound to primary_ip"

    - name: Assert the compose builder's block layout
      vars:
        compose_file: "{{ automation_deployed_files.results[0].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - compose_file is search('\n# END networks')
          # A non-empty line directly above '# END' means a block lost its
          # trailing blank line (yamlfmt once rewrote |+ to |, dropping it).
          - compose_file is not search('[^\n]\n# END ')
          - compose_file is not search('[ \t]\n')
        fail_msg: "compose layout wrong (no blank line before '# END', or trailing whitespace):\n{{ compose_file }}"
        success_msg: "[OK] every managed block ends with a blank line; no trailing whitespace"

    - name: Assert the generated .env carries the secrets at 0600
      vars:
        env_file: "{{ automation_deployed_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          # compose-env.j2 double-quotes every value (a mid-value '#' would
          # otherwise truncate it in Compose's .env parser), so the assertions
          # carry the quotes.
          - "'VAULTWARDEN_ADMIN_TOKEN=\"molecule-test-admin-token\"' in env_file"
          - "'FIREFLY_DB_PASSWORD=\"molecule-test-db-password\"' in env_file"
          - "'WATCHTOWER_API_TOKEN=\"molecule-test-watchtower-token\"' in env_file"
          - automation_deployed_stats.results[0].stat.mode == '0600'
        fail_msg: >-
          .env wrong (mode {{ automation_deployed_stats.results[0].stat.mode }}): {{ env_file }}
        success_msg: "[OK] .env holds every vault secret and is 0600"

    - name: Assert the manage script and its symlink
      ansible.builtin.assert:
        that:
          - automation_deployed_stats.results[1].stat.mode == '0755'
          - automation_deployed_stats.results[1].stat.executable
          - automation_deployed_stats.results[2].stat.islnk
          - "'docker compose' in (automation_deployed_files.results[3].content | b64decode)"
        fail_msg: manage script/symlink wrong
        success_msg: "[OK] manage-automation.sh (0755) deployed and symlinked into PATH"

    - name: Assert the backup script and cron job
      vars:
        backup_script: "{{ automation_deployed_files.results[2].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - automation_deployed_stats.results[3].stat.mode == '0755'
          - "'/usr/local/bin/automation-syncthing-backup' in automation_root_crontab.stdout"
          - "'Automation Syncthing local backup' in automation_root_crontab.stdout"
          # The backup script must not embed any vault secret.
          - "'molecule-test' not in backup_script"
          - "'VACUUM INTO' in backup_script"
          - "'mariadb-dump' in backup_script"
          # Calibre: the config/library trees replicate live via Syncthing
          # folder, so the script snapshots every *.db under config and the
          # library catalog.
          - "'databases' in backup_script"
          - "'config/*.db' in backup_script"
          - "'library/metadata.db' in backup_script"
          - "'calibre' in backup_script"
          # A paused stack (restic holds it) must not hang the DB dump.
          - "'timeout 600' in backup_script"
          # Snapshots are built outside the Syncthing folder and renamed in
          # whole, so peers never receive half-written dumps.
          - "'mktemp -d' in backup_script"
          - "'mv \"$WORK\" \"$DEST/$STAMP\"' in backup_script"
          # Calibre DB snapshots live in each dated snapshot (retention applies).
          - "'$WORK/calibre-databases' in backup_script"
          # 02:30, ahead of the restic timer whose unit pauses the stack.
          - automation_root_crontab.stdout is search('(?m)^30 0?2 \\* \\* \\* ')
        fail_msg: "backup script/cron wrong: {{ backup_script }}"
        success_msg: "[OK] backup script (0755, no embedded secrets) + root cron present"

    - name: Assert the backup directory ownership
      ansible.builtin.assert:
        that:
          - automation_deployed_stats.results[4].stat.isdir
          - automation_deployed_stats.results[4].stat.mode == '0750'
          - automation_deployed_stats.results[4].stat.pw_name == 'molecule'
        fail_msg: >-
          backup dir wrong: mode {{ automation_deployed_stats.results[4].stat.mode }}
          owner {{ automation_deployed_stats.results[4].stat.pw_name }}
        success_msg: "[OK] Syncthing backup dir 0750 owned by molecule"

    - name: Assert the rendered systemd unit
      vars:
        unit: "{{ automation_deployed_files.results[4].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'Requires=docker.service' in unit"
          - "'ExecStart=/usr/bin/docker compose -f /home/automation/stack/docker-compose.yml up -d' in unit"
          - "'RemainAfterExit=true' in unit"
        fail_msg: "systemd unit rendered wrong:\n{{ unit }}"
        success_msg: "[OK] stack unit renders with explicit compose path"
