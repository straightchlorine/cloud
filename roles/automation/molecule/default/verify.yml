---
- name: Verify automation role
  hosts: all
  vars:
    automation_user: automation
    automation_uid: 2000
    automation_gid: 2000
    automation_data_path: /mnt/automation-data
    automation_stack_home: /home/automation/automation-stack
  tasks:
    # User verification
    - name: Check if automation user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ automation_user }}"
      register: automation_user_check

    - name: Assert automation user exists with correct UID/GID
      ansible.builtin.assert:
        that:
          - automation_user_check.ansible_facts.getent_passwd['automation'] is defined
          - automation_user_check.ansible_facts.getent_passwd['automation'][1] | int == 2000
          - automation_user_check.ansible_facts.getent_passwd['automation'][2] | int == 2000
        fail_msg: |
          Automation user check failed
          Expected UID: 2000, GID: 2000
        success_msg: "[OK] Automation user exists with correct UID/GID (2000:2000)"

    # Directory verification
    - name: Verify automation directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dir_stat
      loop:
        - "{{ automation_data_path }}"
        - "{{ automation_stack_home }}"
        - "{{ automation_stack_home }}/config"
        - "{{ automation_stack_home }}/config/traefik"
        - "{{ automation_stack_home }}/scripts"
        - "{{ automation_data_path }}/traefik"
        - "{{ automation_data_path }}/influxdb3"
        - "{{ automation_data_path }}/influxdb3/data"
        - "{{ automation_data_path }}/influxdb3/plugins"
        - "{{ automation_data_path }}/vaultwarden"
        - "{{ automation_data_path }}/portainer"

    - name: Assert all directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Directory {{ item.item }} does not exist or is not a directory"
        success_msg: "[OK] Directory verified: {{ item.item }}"
      loop: "{{ dir_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # File permissions verification
    - name: Verify acme.json has secure permissions (0600)
      ansible.builtin.stat:
        path: "{{ automation_data_path }}/traefik/acme.json"
      register: acme_json_stat

    - name: Assert acme.json has mode 0600
      ansible.builtin.assert:
        that:
          - acme_json_stat.stat.exists
          - acme_json_stat.stat.mode == '0600'
        fail_msg: |
          acme.json verification failed
          Expected mode: 0600
          Actual mode: {{ acme_json_stat.stat.mode }}
        success_msg: "[OK] acme.json has secure permissions (0600)"

    # Configuration files verification
    - name: Verify Traefik configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: traefik_config_stat
      loop:
        - "{{ automation_stack_home }}/config/traefik/traefik.yml"
        - "{{ automation_stack_home }}/config/traefik/dynamic.yml"

    - name: Assert Traefik configs exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Traefik config {{ item.item }} does not exist"
        success_msg: "[OK] Traefik config file exists: {{ item.item }}"
      loop: "{{ traefik_config_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Docker Compose file verification
    - name: Verify docker-compose.yml exists
      ansible.builtin.stat:
        path: "{{ automation_stack_home }}/docker-compose.yml"
      register: compose_file_stat

    - name: Assert docker-compose.yml exists
      ansible.builtin.assert:
        that:
          - compose_file_stat.stat.exists
        fail_msg: "docker-compose.yml does not exist"
        success_msg: "[OK] docker-compose.yml exists"

    # Management scripts verification
    - name: Verify manage-automation.sh is executable
      ansible.builtin.stat:
        path: "{{ automation_stack_home }}/scripts/manage-automation.sh"
      register: manage_script_stat

    - name: Assert manage-automation.sh is executable
      ansible.builtin.assert:
        that:
          - manage_script_stat.stat.exists
          - manage_script_stat.stat.executable
        fail_msg: |
          manage-automation.sh verification failed
          Exists: {{ manage_script_stat.stat.exists }}
          Executable: {{ manage_script_stat.stat.executable }}
        success_msg: "[OK] manage-automation.sh is executable"

    # Display verification summary
    - name: Display automation role verification results
      ansible.builtin.debug:
        msg: |
          [OK] Automation Role Verification Complete

          User Configuration Verified:
          - User: automation - EXISTS
          - UID: 2000 - CORRECT
          - GID: 2000 - CORRECT

          Directory Structure Verified:
          - Data path: {{ automation_data_path }} - EXISTS
          - Stack home: {{ automation_stack_home }} - EXISTS
          - Config directory: {{ automation_stack_home }}/config - EXISTS
          - Traefik config: {{ automation_stack_home }}/config/traefik - EXISTS
          - Scripts: {{ automation_stack_home }}/scripts - EXISTS
          - InfluxDB data: {{ automation_data_path }}/influxdb3 - EXISTS
          - Vaultwarden data: {{ automation_data_path }}/vaultwarden - EXISTS
          - Portainer data: {{ automation_data_path }}/portainer - EXISTS

          File Permissions Verified:
          - acme.json: 0600 - SECURE

          Configuration Files Verified:
          - traefik.yml - EXISTS
          - dynamic.yml - EXISTS
          - docker-compose.yml - EXISTS

          Scripts Verified:
          - manage-automation.sh - EXECUTABLE

          Note: Docker container startup skipped in container test
          This validates core role logic without Docker-in-Docker complexity
