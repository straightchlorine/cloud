---
- name: Verify automation default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Read the deployed files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop:
        - { key: compose, path: "{{ automation_stack_home }}/docker-compose.yml" }
        - { key: env, path: "{{ automation_stack_home }}/.env" }
        - { key: backup, path: /usr/local/bin/automation-syncthing-backup }
        - { key: manage, path: "{{ automation_stack_home }}/scripts/manage-automation.sh" }
        - { key: unit, path: /etc/systemd/system/stack.service }
        - { key: wrapper, path: "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh" }
      loop_control:
        label: "{{ item.key }}"
      register: automation_slurped

    - name: Index the file contents by name
      ansible.builtin.set_fact:
        files: >-
          {{ dict(automation_slurped.results | map(attribute='item.key')
                  | zip(automation_slurped.results | map(attribute='content') | map('b64decode'))) }}

    - name: Assert deployed paths, modes and owners
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - { path: "{{ automation_stack_home }}/.env", state: file, mode: "0600" }
          - { path: "{{ automation_stack_home }}/scripts/manage-automation.sh", state: file, mode: "0755" }
          - { path: /usr/local/bin/manage-automation, state: link }
          - { path: /usr/local/bin/automation-syncthing-backup, state: file, mode: "0755" }
          - { path: "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh", state: file, mode: "0755" }
          - path: "{{ automation_backup_dir }}"
            state: directory
            mode: "0750"
            owner: "{{ automation_backup_owner }}"
          - { path: /etc/systemd/system/stack.service, state: file }

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      register: automation_root_crontab

    - name: Assert compose file contents
      vars:
        compose_file: "{{ files.compose }}"
        compose_data: "{{ compose_file | from_yaml }}"
      ansible.builtin.assert:
        that:
          - compose_data.services | length == 7
          - "'vaultwarden:' in compose_file"
          - "'fireflyiii/core:latest' in compose_file"
          - "'mariadb:11.8.9' in compose_file"
          - "'nickfedor/watchtower' in compose_file"
          - "'crocodilestick/calibre-web-automated' in compose_file"
          - "':8081:80' in compose_file"
          - "':8082:8080' in compose_file"
          - "':8083:8083' in compose_file"
          - "':8084:8080' in compose_file"
          - "':8085:8080' in compose_file"
          - "'/cwa-book-ingest' in compose_file"
          - "'/calibre-library' in compose_file"
          # Secrets must appear only as ${VAR} placeholders.
          - "'ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}' in compose_file"
          - "'DB_PASSWORD=${FIREFLY_DB_PASSWORD}' in compose_file"
          # The mariadb entrypoint demands a root-password policy on first init; the root user is otherwise unused.
          - "'MARIADB_RANDOM_ROOT_PASSWORD=1' in compose_file"
          - "'HARDCOVER_TOKEN=${HARDCOVER_TOKEN}' in compose_file"
          - "'molecule-test' not in compose_file"
          - "'com.centurylinklabs.watchtower.enable=true' in compose_file"
          # An empty top-level volumes or networks key is invalid compose.
          - >-
            'volumes' not in compose_data
            or (compose_data.volumes is mapping and compose_data.volumes | length > 0)
          - >-
            'networks' not in compose_data
            or (compose_data.networks is mapping and compose_data.networks | length > 0)
        fail_msg: "docker-compose.yml rendered wrong:\n{{ compose_file }}"
        quiet: true

    - name: Assert Watchtower's schedule actually runs
      vars:
        watchtower_env: >-
          {{ dict((files.compose | from_yaml).services.watchtower.environment | map('split', '=', 1)) }}
      ansible.builtin.assert:
        that:
          # The 'update' endpoint switches Watchtower to API-only mode, silently disabling WATCHTOWER_SCHEDULE
          # unless periodic polls are re-enabled.
          - >-
            'update' not in watchtower_env.WATCHTOWER_HTTP_API_ENDPOINTS.split(',')
            or (watchtower_env.get('WATCHTOWER_HTTP_API_PERIODIC_POLLS', 'false') | bool)
          # Watchtower's cron has a leading seconds field.
          - watchtower_env.WATCHTOWER_SCHEDULE.split() | length == 6
          # A published port otherwise disables the rename-based self-update.
          - watchtower_env.WATCHTOWER_EPHEMERAL_SELF_UPDATE == 'true'
          # The notification hostname is the machine's hostname, not the alias.
          - watchtower_env.WATCHTOWER_NOTIFICATIONS_HOSTNAME == ansible_facts['hostname']
        fail_msg: "watchtower env would never run its schedule: {{ watchtower_env }}"
        quiet: true

    - name: Assert cAdvisor label and port binding
      vars:
        cadvisor: "{{ (files.compose | from_yaml).services.cadvisor }}"
      ansible.builtin.assert:
        that:
          - "'com.centurylinklabs.watchtower.enable=true' in cadvisor.labels"
          - >-
            cadvisor.ports | select('match', '^' ~ ansible_facts['default_ipv4']['address'] ~ ':')
            | list | length == cadvisor.ports | length
        fail_msg: "cadvisor service wrong: {{ cadvisor }}"
        quiet: true

    - name: Assert the app services bind to the primary IP
      vars:
        services: "{{ (files.compose | from_yaml).services }}"
        primary_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.assert:
        that:
          - services[item.key].ports | length == 1
          - services[item.key].ports[0] is match('^' ~ primary_ip ~ ':' ~ item.port ~ ':')
        fail_msg: "{{ item.key }} ports wrong: {{ services[item.key].ports }}"
        quiet: true
      loop:
        - { key: vaultwarden, port: 8081 }
        - { key: firefly, port: 8082 }
        - { key: calibre-web-automated, port: 8083 }

    - name: Assert the compose builder's block layout
      ansible.builtin.assert:
        that:
          - files.compose is search('\n# END networks')
          # yamlfmt rewrites |+ to |, which drops a block's trailing blank line.
          - files.compose is not search('[^\n]\n# END ')
          - files.compose is not search('[ \t]\n')
        fail_msg: "compose layout wrong (no blank line before '# END', or trailing whitespace):\n{{ files.compose }}"
        quiet: true

    - name: Assert the .env carries the vault secrets
      ansible.builtin.assert:
        that:
          # compose-env.j2 double-quotes every value so a mid-value '#' cannot truncate it in Compose's parser.
          - "'VAULTWARDEN_ADMIN_TOKEN=\"' ~ vault_vaultwarden_admin_token ~ '\"' in files.env"
          - "'FIREFLY_DB_PASSWORD=\"' ~ vault_firefly_db_password ~ '\"' in files.env"
          - "'WATCHTOWER_API_TOKEN=\"' ~ vault_watchtower_api_token ~ '\"' in files.env"
          - "'FIREFLY_APP_KEY=\"' ~ vault_firefly_app_key ~ '\"' in files.env"
          - "'FIREFLY_STATIC_CRON_TOKEN=\"' ~ vault_firefly_static_cron_token ~ '\"' in files.env"
        fail_msg: ".env is missing a secret: {{ files.env }}"
        quiet: true

    - name: Assert the manage script runs compose
      ansible.builtin.assert:
        that: "'docker compose' in files.manage"
        quiet: true

    - name: Assert the backup script and cron job
      ansible.builtin.assert:
        that:
          - "'/usr/local/bin/automation-syncthing-backup' in automation_root_crontab.stdout"
          - "'Automation Syncthing local backup' in automation_root_crontab.stdout"
          # 02:30, ahead of the 03:00 restic job that ships the dumps.
          - automation_root_crontab.stdout is search('(?m)^30 0?2 \\* \\* \\* ')
          - "'molecule-test' not in files.backup"
          - "'VACUUM INTO' in files.backup"
          - "'mariadb-dump' in files.backup"
          # Calibre config and library trees replicate live via Syncthing, so the script snapshots every *.db.
          - "'databases' in files.backup"
          - "'config/*.db' in files.backup"
          - "'library/metadata.db' in files.backup"
          - "'calibre' in files.backup"
          # A stuck compose exec must not hang the DB dump.
          - "'timeout 600' in files.backup"
          # Snapshots are built outside the Syncthing folder and renamed in whole, so peers never see half dumps.
          - "'mktemp -d' in files.backup"
          - "'mv \"$WORK\" \"$DEST/$STAMP\"' in files.backup"
          - "'$WORK/calibre-databases' in files.backup"
        fail_msg: "backup script or cron wrong: {{ files.backup }}\n{{ automation_root_crontab.stdout }}"
        quiet: true

    - name: Assert the rendered systemd unit
      ansible.builtin.assert:
        that:
          - "'Requires=docker.service' in files.unit"
          - >-
            'ExecStart=/usr/bin/docker compose -f ' ~ automation_stack_home ~ '/docker-compose.yml up -d'
            in files.unit
          - "'RemainAfterExit=true' in files.unit"
        fail_msg: "systemd unit rendered wrong:\n{{ files.unit }}"
        quiet: true

    - name: Assert the mariadb entrypoint wrapper
      ansible.builtin.assert:
        that:
          - "'rm -f /var/lib/mysql/tc.log' in files.wrapper"
          - "'exec docker-entrypoint.sh \"$@\"' in files.wrapper"
        fail_msg: "mariadb entrypoint wrapper wrong:\n{{ files.wrapper }}"
        quiet: true

    - name: Stat the data directories
      ansible.builtin.stat:
        path: "{{ automation_data_path }}/{{ item.dir }}"
      loop:
        # The remap base is 10000 and PUID/PGID is 0 because ansible_user is root, so most directories land on the
        # base while the firefly upload directory adds the www-data offset.
        - { dir: vaultwarden, id: 10000 }
        - { dir: mariadb, id: 10000 }
        - { dir: calibre/config, id: 10000 }
        - { dir: calibre/ingest, id: 10000 }
        - { dir: calibre/library, id: 10000 }
        - { dir: firefly/upload, id: 10033 }
      loop_control:
        label: "{{ item.dir }}"
      register: automation_data_dirs

    - name: Assert userns-remap ownership of the data directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.uid == item.item.id
          - item.stat.gid == item.item.id
        fail_msg: "{{ item.item.dir }} owned by {{ item.stat.uid }}:{{ item.stat.gid }}"
        quiet: true
      loop: "{{ automation_data_dirs.results }}"
      loop_control:
        label: "{{ item.item.dir }}"

    - name: Read the stack unit state
      ansible.builtin.command: systemctl {{ item.state }} stack
      register: automation_unit_state
      changed_when: false
      failed_when: automation_unit_state.stdout | trim != item.want
      loop:
        - { state: is-active, want: active }
        - { state: is-enabled, want: enabled }
      loop_control:
        label: "{{ item.state }}"
