---
- name: Create the stack-home parent
  # validate.yml refuses a stack home whose parent is missing.
  ansible.builtin.file:
    path: "{{ automation_stack_home | dirname }}"
    state: directory
    mode: "0755"

- name: Publish the userns-remap facts
  # docker.yml publishes these on a real host. The value must sit inside the nested rootless-podman uid mapping:
  # the canonical dockremap base lies outside it and chown would fail with EINVAL.
  ansible.builtin.set_fact:
    common_dockremap_uid: "10000"
    common_dockremap_gid: "10000"
