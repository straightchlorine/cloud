---
# Handlers for automation role - use common handlers with variables

- name: Restart automation stack
  ansible.builtin.set_fact:
    stack_home: "{{ automation_stack_home }}"
  notify: restart docker compose stack

- name: Rollback automation stack
  ansible.builtin.set_fact:
    stack_home: "{{ automation_stack_home }}"
  notify: rollback docker compose stack
