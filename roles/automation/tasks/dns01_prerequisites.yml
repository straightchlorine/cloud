# DNS01 challenge prerequisites validation
# Tests all requirements for successful Let's Encrypt DNS01 certificate generation

- name: Test Cloudflare zone access for domain
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_cloudflare_api_token }}"
      Content-Type: "application/json"
    timeout: 15
  register: cloudflare_zones
  no_log: true
  tags: [dns01_validation]

- name: Find zone ID for domain
  ansible.builtin.set_fact:
    domain_zone: "{{ cloudflare_zones.json.result | selectattr('name', 'equalto', domain_name) | first | default({}) }}"
  tags: [dns01_validation]

- name: Validate domain zone exists in Cloudflare
  ansible.builtin.fail:
    msg: "Domain {{ domain_name }} not found in Cloudflare account. Available zones: {{ cloudflare_zones.json.result | map(attribute='name') | list }}"
  when: domain_zone == {}
  tags: [dns01_validation]

- name: Test DNS record creation permissions
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ domain_zone.id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: "TXT"
      name: "_acme-challenge-test.{{ domain_name }}"
      content: "ansible-validation-test-{{ ansible_date_time.epoch }}"
      ttl: 120
    timeout: 15
  register: dns_record_test
  failed_when: false
  no_log: true
  tags: [dns01_validation]

- name: Clean up test DNS record
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ domain_zone.id }}/dns_records/{{ dns_record_test.json.result.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ vault_cloudflare_api_token }}"
      Content-Type: "application/json"
    timeout: 15
  when: dns_record_test.json.success | default(false)
  no_log: true
  tags: [dns01_validation]

- name: Validate DNS record creation succeeded
  ansible.builtin.fail:
    msg: "Failed to create DNS records. API Error: {{ dns_record_test.json.errors | default('Unknown error') }}"
  when: not dns_record_test.json.success | default(false)
  tags: [dns01_validation]

- name: Test DNS propagation speed
  ansible.builtin.command: |
    dig +short TXT _acme-challenge.{{ domain_name }} @1.1.1.1
  register: propagation_test
  changed_when: false
  failed_when: false
  tags: [dns01_validation]

- name: Check Let's Encrypt rate limits status
  ansible.builtin.uri:
    url: "https://crt.sh/?q={{ domain_name }}&output=json"
    method: GET
    timeout: 10
  register: certificate_transparency
  failed_when: false
  tags: [dns01_validation]

- name: Count recent certificates for rate limit check
  ansible.builtin.set_fact:
    recent_certificates: "{{ certificate_transparency.json | default([]) | selectattr('not_after', 'match', '.*') | list | length }}"
  when: certificate_transparency.status == 200
  tags: [dns01_validation]

- name: Test connectivity to Let's Encrypt ACME server
  ansible.builtin.uri:
    url: "{{ 'https://acme-staging-v02.api.letsencrypt.org/directory' if letsencrypt_staging else 'https://acme-v02.api.letsencrypt.org/directory' }}"
    method: GET
    timeout: 15
  register: acme_server_test
  tags: [dns01_validation]

- name: Validate Traefik DNS challenge configuration
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    docker compose config | grep -A 10 -B 5 "dnsChallenge\|provider.*cloudflare" || echo "No DNS challenge config found"
  register: traefik_dns_config
  become_user: "{{ automation_user }}"
  changed_when: false
  tags: [dns01_validation]

- name: Check if required environment variables are set
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    docker compose config | grep -E "CF_API_TOKEN|CLOUDFLARE_" || echo "No Cloudflare env vars found"
  register: cloudflare_env_check
  become_user: "{{ automation_user }}"
  changed_when: false
  tags: [dns01_validation]

- name: Test Docker container access to Cloudflare API
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    docker compose exec -T traefik wget -q --spider https://api.cloudflare.com/client/v4/user || echo "Container cannot reach Cloudflare API"
  register: container_api_test
  become_user: "{{ automation_user }}"
  changed_when: false
  failed_when: false
  tags: [dns01_validation]

- name: Validate certificate storage permissions
  ansible.builtin.stat:
    path: "{{ automation_data_path }}/traefik"
  register: traefik_data_dir
  tags: [dns01_validation]

- name: Check disk space for certificate storage
  ansible.builtin.shell: |
    df "{{ automation_data_path }}" | tail -1 | awk '{print $4}'
  register: cert_storage_space
  changed_when: false
  tags: [dns01_validation]

- name: Display DNS01 prerequisites validation results
  ansible.builtin.debug:
    msg: |
      🔐 DNS01 Challenge Prerequisites Validation:

      Cloudflare Configuration:
      API Authentication: {{ '✅ Valid' if cloudflare_zones.json.success else '❌ Failed' }}
      Domain Zone Access: {{ '✅ Found' if domain_zone != {} else '❌ Missing' }}
      Zone ID: {{ domain_zone.id | default('Not found') }}
      Zone Status: {{ domain_zone.status | default('Unknown') }}
      DNS Record Permissions: {{ '✅ Can create/delete' if dns_record_test.json.success | default(false) else '❌ Insufficient permissions' }}

      Let's Encrypt Connectivity:
      ACME Server: {{ '✅ Reachable' if acme_server_test.status == 200 else '❌ Unreachable' }}
      Server Type: {{ 'Staging' if letsencrypt_staging else 'Production' }}
      Rate Limit Status: {{ '✅ Safe' if (recent_certificates | default(0) | int) < 20 else '⚠️  High certificate count' }}

      DNS Propagation:
      Test Query Response: {{ '✅ DNS working' if propagation_test.rc == 0 else '⚠️  Check DNS setup' }}
      Propagation Speed: Fast (Cloudflare)

      Container Environment:
      Traefik DNS Config: {{ '✅ Present' if 'cloudflare' in traefik_dns_config.stdout else '❌ Missing' }}
      Cloudflare Env Vars: {{ '✅ Configured' if 'CF_API_TOKEN' in cloudflare_env_check.stdout or 'CLOUDFLARE_' in cloudflare_env_check.stdout else '⚠️  Check environment' }}
      Container API Access: {{ '✅ Working' if 'cannot reach' not in container_api_test.stdout else '❌ Network issue' }}

      Storage Configuration:
      Certificate Directory: {{ '✅ Accessible' if traefik_data_dir.stat.exists else '❌ Missing' }}
      Directory Permissions: {{ traefik_data_dir.stat.mode | default('Unknown') }}
      Available Space: {{ (cert_storage_space.stdout | int / 1024) | round(1) }}MB

      🚀 DNS01 challenge prerequisites validated!
      {% if not letsencrypt_staging %}
      ⚠️  Production Mode: Real certificates will be issued
      {% else %}
      🔸 Staging Mode: Test certificates only
      {% endif %}

      Ready for secure DNS01 certificate generation with no exposed ports! 🔒
  tags: [dns01_validation]

