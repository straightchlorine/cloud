---
# Secrets live only in the vault env dict below: common's build_docker_compose
# renders them as a 0600 .env next to docker-compose.yml, interpolated via ${VAR}.

- name: Resolve the stack user's uid/gid on this host
  # CWA honours PUID/PGID and must not run as root (root-owned library files
  # break ingestion). Resolve the inventory's ansible_user here, not the facts:
  # under become:true the ansible_user_uid/_dir facts reflect root.
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Publish the stack user's uid/gid for the compose services
  ansible.builtin.set_fact:
    automation_stack_uid: "{{ getent_passwd[ansible_user][1] }}"
    automation_stack_gid: "{{ getent_passwd[ansible_user][2] }}"

- name: Create the stack data directories
  ansible.builtin.file:
    path: "{{ automation_data_path }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - firefly

- name: Create data directories owned by Docker's userns-remap range
  # Under userns-remap, container root is common_dockremap_uid/gid and can only
  # chown directories it owns. mariadb and calibre chown their bind mounts at
  # startup, and vaultwarden matches no other uid - so these dirs must start
  # owned by the remap range, including after a teardown that keeps the data.
  ansible.builtin.file:
    path: "{{ automation_data_path }}/{{ item }}"
    state: directory
    owner: "{{ common_dockremap_uid }}"
    group: "{{ common_dockremap_gid }}"
    mode: "0755"
    recurse: true
  become: true
  loop:
    - vaultwarden
    - mariadb
    - calibre/config
    - calibre/ingest
    - calibre/library

- name: Create the Firefly upload directory owned by the image's www-data
  # fireflyiii/core runs php-fpm as uid 33 and never chowns its storage itself,
  # so the host dir must be owned by dockremap + 33 (the host uid that maps to
  # www-data inside the container), not literal 33. +33 is www-data on the
  # image's Debian base; an Alpine variant would be +82.
  ansible.builtin.file:
    path: "{{ automation_data_path }}/firefly/upload"
    state: directory
    owner: "{{ (common_dockremap_uid | int) + 33 }}"
    group: "{{ (common_dockremap_gid | int) + 33 }}"
    mode: "0755"
    recurse: true
  become: true

- name: Create the stack home directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ automation_stack_home }}"
    - "{{ automation_stack_home }}/scripts"

- name: Install the mariadb tc.log-safe entrypoint wrapper
  # Bind-mounted into mariadb (service_volumes) as its entrypoint - clears
  # tc.log before handing off to the image's own docker-entrypoint.sh so its
  # init/privilege-drop logic still runs unmodified (see mariadb's
  # service_stop_grace_period/service_entrypoint comment for why).
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      set -eu
      rm -f /var/lib/mysql/tc.log
      exec docker-entrypoint.sh "$@"
    dest: "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Render compose + .env and bring up the stack
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_compose_stack
  vars:  # noqa: var-naming[no-role-prefix]
    stack_name: "automation"
    compose_file_path: "{{ automation_stack_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    compose_services: "{{ automation_compose_services }}"
    compose_networks: "{{ automation_compose_networks }}"
    compose_volumes: "{{ automation_compose_volumes }}"
    # firefly-cron is excluded: it is a sleep-sidecar (wget -> sleep 60s -> exit 0
    # -> Docker restarts it), so State=running holds only ~60s of every ~62s
    # cycle. Its health is checked by the last exit code in post_deploy_validate.
    compose_critical_services:
      - vaultwarden
      - firefly
      - mariadb
      - watchtower
    # Vault glue - the only place real secret values exist in the role. The
    # .env file also feeds Watchtower's ntfy notifications (group_vars/all).
    compose_env_vars:
      FIREFLY_APP_KEY: "{{ vault_firefly_app_key }}"
      FIREFLY_STATIC_CRON_TOKEN: "{{ vault_firefly_static_cron_token }}"
      FIREFLY_DB_PASSWORD: "{{ vault_firefly_db_password }}"
      VAULTWARDEN_ADMIN_TOKEN: "{{ vault_vaultwarden_admin_token }}"
      WATCHTOWER_API_TOKEN: "{{ vault_watchtower_api_token }}"
      # Optional CWA metadata key: empty until vault_hardcover_token is set, so
      # molecule/test deploys without the vault var still render.
      HARDCOVER_TOKEN: "{{ vault_hardcover_token if vault_hardcover_token is defined else '' }}"
      # shoutrrr's ntfy URL is ntfy://user:password@host/topic and ntfy accepts
      # the token only as the basic-auth PASSWORD, so the username stays empty
      # (a key there is rejected with 40301). Empty URL = watchtower is silent.
      WATCHTOWER_NOTIFICATION_URL: >-
        {{ 'ntfy://:' ~ vault_ntfy_api_key ~ '@' ~
        (ntfy_server_url | regex_replace('^https?://', '')) ~ '/' ~ ntfy_topic
        if vault_ntfy_api_key is defined else '' }}
    start_stack: "{{ common_start_stack }}"
  # No notify: compose up -d already recreates containers on file changes, so a
  # restart handler would only double-restart the stack.

- name: Install the stack management script
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/manage-stack.sh.j2"
    dest: "{{ automation_stack_home }}/scripts/manage-automation.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  vars:
    manage_stack_home: "{{ automation_stack_home }}"
    manage_stack_name: "automation"

- name: Symlink the management script into PATH
  ansible.builtin.file:
    src: "{{ automation_stack_home }}/scripts/manage-automation.sh"
    dest: /usr/local/bin/manage-automation
    state: link
    force: true
  become: true
