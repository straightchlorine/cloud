---
# Secrets live only in the vault-backed env dict below.
# The common build_docker_compose task renders them into a 0600 .env file that compose interpolates as ${VAR}.

- name: Resolve the stack user's uid/gid on this host
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_user_ids

- name: Create the stack data directories
  ansible.builtin.file:
    path: "{{ automation_data_path }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - firefly

- name: Create data directories owned by Docker's userns-remap range
  # Under userns-remap, container root maps to common_dockremap_uid and can only chown ids inside its own namespace.
  # Vaultwarden runs as that root, and mariadb chowns its data directory to the image's mysql user at startup.
  # So these directories must be owned by the remap range, including after a teardown that keeps the data.
  ansible.builtin.file:
    path: "{{ automation_data_path }}/{{ item }}"
    state: directory
    owner: "{{ common_dockremap_uid }}"
    group: "{{ common_dockremap_gid }}"
    mode: "0755"
    recurse: true
  become: true
  loop:
    - vaultwarden
    - mariadb

- name: Create the Calibre data directories owned by the remap-mapped PUID/PGID
  # The owner differs from the other directories because CWA chowns these paths to abc (PUID/PGID) at every container
  # start.
  # A recursive chown to the remap base while the stack runs would make the SQLite databases unwritable for abc.
  # Book pages would then fail with "attempt to write a readonly database" until the container restarts.
  # Owning the paths as the host-side mapping of PUID/PGID (remap base plus stack uid) keeps a running container
  # writable.
  ansible.builtin.file:
    path: "{{ automation_data_path }}/{{ item }}"
    state: directory
    owner: "{{ (common_dockremap_uid | int) + (common_stack_uid | int) }}"
    group: "{{ (common_dockremap_gid | int) + (common_stack_gid | int) }}"
    mode: "0755"
    recurse: true
  become: true
  loop:
    - calibre/config
    - calibre/ingest
    - calibre/library

- name: Create the Firefly upload directory owned by the image's www-data
  # The fireflyiii/core image runs php-fpm as uid 33 and never chowns its storage.
  # The host directory must therefore be owned by the remap base plus 33, the host uid that maps to www-data in the
  # container.
  # The offset 33 is www-data on the image's Debian base, and an Alpine variant would need a different offset.
  ansible.builtin.file:
    path: "{{ automation_data_path }}/firefly/upload"
    state: directory
    owner: "{{ (common_dockremap_uid | int) + 33 }}"
    group: "{{ (common_dockremap_gid | int) + 33 }}"
    mode: "0755"
    recurse: true
  become: true

- name: Create the stack home directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ automation_stack_home }}"
    - "{{ automation_stack_home }}/scripts"

- name: Install the mariadb tc.log-safe entrypoint wrapper
  # The mariadb service mounts this wrapper as its entrypoint.
  # It removes tc.log and then hands off to the image's docker-entrypoint.sh, so the image's init and privilege drop
  # still run.
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      set -eu
      rm -f /var/lib/mysql/tc.log
      exec docker-entrypoint.sh "$@"
    dest: "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Render compose + .env and bring up the stack
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_compose_stack
  vars:  # noqa: var-naming[no-role-prefix]
    stack_name: "automation"
    compose_file_path: "{{ automation_stack_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    compose_services: >-
      {{ automation_compose_services
      + [common_watchtower_compose_service, common_cadvisor_compose_service] }}
    compose_networks: "{{ automation_compose_networks }}"
    compose_volumes: "{{ automation_compose_volumes }}"
    # The firefly-cron sidecar is excluded because it exits after every sleep and Docker restarts it.
    # Its running state therefore flickers, so post_deploy_validate.yml checks its last exit code instead.
    compose_critical_services:
      - vaultwarden
      - firefly
      - mariadb
      - watchtower
    compose_env_vars: "{{ automation_env_vars | combine(common_watchtower_env_vars) }}"
    automation_env_vars:
      FIREFLY_APP_KEY: "{{ vault_firefly_app_key }}"
      FIREFLY_STATIC_CRON_TOKEN: "{{ vault_firefly_static_cron_token }}"
      FIREFLY_DB_PASSWORD: "{{ vault_firefly_db_password }}"
      VAULTWARDEN_ADMIN_TOKEN: "{{ vault_vaultwarden_admin_token }}"
      # This optional CWA metadata key stays empty until vault_hardcover_token is set.
      # That lets molecule and test deploys without the vault variable still render.
      HARDCOVER_TOKEN: "{{ vault_hardcover_token if vault_hardcover_token is defined else '' }}"
    start_stack: "{{ common_start_stack }}"
  # No handler is notified because compose up -d already recreates containers when files change.
  # A restart handler would restart the stack twice.

- name: Install the stack management script
  ansible.builtin.include_role:
    name: common
    tasks_from: manage_stack_script
  vars:
    common_manage_stack_home: "{{ automation_stack_home }}"
    common_manage_stack_name: automation
