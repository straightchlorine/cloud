---
- name: Create standardized Docker Compose file  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: build_docker_compose
  vars:
    compose_file_path: "{{ automation_stack_home }}/docker-compose.yml"
    compose_file_owner: "{{ ansible_user }}"
    compose_file_group: "{{ ansible_user }}"
    stack_name: "automation"
    compose_services: "{{ automation_compose_services }}"
    compose_networks: "{{ automation_compose_networks }}"
    compose_volumes: "{{ automation_compose_volumes }}"
  notify: Restart automation stack

- name: Create InfluxDB3 data directories
  ansible.builtin.file:
    path: "{{ automation_data_path }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - influxdb3/data
    - influxdb3/plugins
    - influxdb3-explorer
    - vaultwarden
    - portainer
  become: true

- name: Create config directories
  ansible.builtin.file:
    path: "{{ automation_stack_home }}/config/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - dozzle
    - influxdb3-explorer

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ automation_stack_home }}/scripts"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create stack management script
  ansible.builtin.template:
    src: manage-automation.sh.j2
    dest: "{{ automation_stack_home }}/scripts/manage-automation.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create stack backup script
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/backup-script.sh.j2"
    dest: "{{ automation_stack_home }}/scripts/backup-automation.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  vars:
    common_backup_service_name: "automation-stack"
    common_backup_directories:
      - "{{ automation_stack_home }}"
      - "{{ automation_data_path }}"

- name: Create Docker network for Traefik
  community.docker.docker_network:
    name: traefik-network
    automation_driver: bridge
    state: present
    scope: local
  become: true
  become_user: "{{ ansible_user }}"
  tags: [docker, network, traefik]

- name: Start automation stack
  community.docker.docker_compose_v2:
    project_src: "{{ automation_stack_home }}"
    state: present
  become_user: "{{ ansible_user }}"
  when: start_stack

- name: Verify Traefik is responding
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ automation_traefik_dashboard_port }}/api/rawdata"
    method: GET
  register: automation_traefik_health
  until: automation_traefik_health.status == 200
  retries: 30
  delay: 2
  when: start_stack

- name: Verify InfluxDB3 is responding
  ansible.builtin.uri:
    url: "http://127.0.0.1:8181/health"
    method: GET
  register: automation_influxdb_health
  until: automation_influxdb_health.status == 200
  retries: 30
  delay: 2
  when: start_stack
  failed_when: false

- name: Verify Vaultwarden is responding
  ansible.builtin.uri:
    url: "http://127.0.0.1:80/alive"
    method: GET
  register: automation_vaultwarden_health
  until: automation_vaultwarden_health.status == 200
  retries: 30
  delay: 2
  when: start_stack
  failed_when: false

- name: Verify Portainer is responding
  ansible.builtin.uri:
    url: "http://127.0.0.1:9000/api/status"
    method: GET
  register: automation_portainer_health
  until: automation_portainer_health.status == 200
  retries: 30
  delay: 2
  when: start_stack
  failed_when: false

- name: Create symlinks for management scripts
  ansible.builtin.file:
    src: "{{ automation_stack_home }}/scripts/manage-automation.sh"
    dest: "/usr/local/bin/manage-automation"
    state: link
  become: true

- name: Display service information
  ansible.builtin.debug:
    msg: |
      Automation Stack Deployment Complete!

      Services:
      - Traefik Dashboard: https://{{ automation_subdomain_traefik }}.{{ automation_domain_name }}

      Management:
      - Stack control: manage-automation {start|stop|restart|status|logs}
      - Backup: {{ automation_stack_home }}/scripts/backup-automation.sh

      Data locations:
      - Traefik: {{ automation_data_path }}/traefik
