---

# The os role must run first because validate.yml asserts on its os_family fact.
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [automation, validation, facts]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run automation deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ automation_specific_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Set up SSD storage
  ansible.builtin.include_role:
    name: common
    tasks_from: optional_ssd
  vars:
    common_ssd_mount_path: "{{ automation_data_path }}"
    common_ssd_format: "{{ automation_ssd_format }}"
    common_ssd_filesystem: "{{ automation_ssd_filesystem }}"
    common_ssd_mount_options: "{{ automation_ssd_mount_options }}"
    common_ssd_journald_enabled: "{{ automation_ssd_journald_enabled }}"
  tags: [storage]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Include backup configuration (syncthing secondary + restic)
  ansible.builtin.include_tasks: backup.yml
  when: automation_backup_enabled or automation_restic_enabled
  tags: [backup]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Re-apply the fleet notification helpers (ntfy + unattended-upgrades)
  ansible.builtin.include_role:
    name: common
    tasks_from: base_reapply
  tags: [automation, common, base]

- name: Resolve the stack user's uid/gid for the unit environment
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_user_ids
  tags: [systemd, auto-start]

- name: Create Docker stack systemd service
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    common_stack_description: "Automation Stack (vaultwarden, firefly, mariadb, watchtower)"
    common_stack_home: "{{ automation_stack_home }}"
    common_stack_user: "{{ ansible_user }}"
    common_stack_environment_vars:
      - "AUTOMATION_DATA_PATH={{ automation_data_path }}"
      - "PUID={{ common_stack_uid }}"
      - "PGID={{ common_stack_gid }}"
  tags: [systemd, auto-start]

# The stack comes up last on purpose.
# The host-side controls above must exist before any service is exposed, so the containers never run ahead of the
# security setup.
- name: Deploy the stack (compose, .env, up, poll)
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Start the stack unit and flush handlers
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_start
  tags: [systemd, auto-start, stack]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  # The common role owns common_start_stack, and a tag-scoped run can skip every common include so its defaults never
  # load.
  # The fallback mirrors the default in common, as the cross-role feature flag pattern in CLAUDE.md allows.
  # A deploy with the flag false leaves the stack stopped, so its endpoints must not be probed.
  when: common_start_stack | default(true) | bool
  tags: [post_validation]
