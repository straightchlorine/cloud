- name: Run automation stack deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Detect hardware for resource allocation
  ansible.builtin.include_role:
    name: common
    tasks_from: detect_hardware
  tags: [hardware, validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ automation_specific_packages }}"
  tags: [packages]

- name: Include storage setup
  ansible.builtin.include_tasks: storage.yml
  tags: [storage]

- name: Include Docker setup
  ansible.builtin.include_tasks: docker.yml
  tags: [docker]

- name: Include Traefik setup
  ansible.builtin.include_tasks: traefik.yml
  when: services_enabled.traefik
  tags: [traefik, reverse-proxy]

- name: Include stack deployment
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Include backup configuration
  ansible.builtin.include_tasks: backup.yml
  when: restic_enabled
  tags: [backup]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Create systemd service for auto-start
  ansible.builtin.template:
    src: automation-stack.service.j2
    dest: /etc/systemd/system/automation-stack.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: restart automation stack
  tags: [systemd, auto-start]

- name: Enable automation stack service for auto-start
  ansible.builtin.systemd:
    name: automation-stack
    enabled: true
    daemon_reload: true
  become: true
  tags: [systemd, auto-start]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation, never]

