---

# The os role must run first: validate.yml asserts on its facts (os_family).
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [automation, validation, facts]

- name: Detect hardware for resource allocation
  ansible.builtin.include_role:
    name: hardware
  tags: [hardware, validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run automation deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ automation_specific_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Include storage setup (optional SSD mount + journald + docker data-root)
  ansible.builtin.include_tasks: storage.yml
  tags: [storage]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Include stack deployment (compose + .env + up + poll)
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Include backup configuration (syncthing secondary + restic)
  ansible.builtin.include_tasks: backup.yml
  when: automation_backup_enabled or restic_enabled
  tags: [backup]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Create Docker stack systemd service  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    stack_service_name: "stack"
    stack_description: "Automation Stack (vaultwarden, firefly, mariadb, watchtower)"
    stack_home_directory: "{{ automation_stack_home }}"
    stack_user: "{{ ansible_user }}"
    # Explicit -f: the shared systemd template's WorkingDirectory guard is a
    # known-open issue (see its header comment), so don't rely on cwd here.
    stack_environment_vars:
      - "AUTOMATION_DATA_PATH={{ automation_data_path }}"
      - "PUID={{ automation_stack_uid }}"
      - "PGID={{ automation_stack_gid }}"
    stack_exec_start: "/usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml up -d"
    stack_exec_stop: "/usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml down"
    stack_exec_reload: "/usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml restart"
  tags: [systemd, auto-start]

- name: Re-apply shared notification helpers (ntfy + reboot)
  # An automation-only redeploy (--tags automation) skips the site.yml base
  # play that installs these, so the role re-applies them itself. Tagged so
  # the includes run under --tags automation.
  ansible.builtin.include_role:
    name: common
    tasks_from: ntfy_install
  tags: [automation, common, base]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation]
