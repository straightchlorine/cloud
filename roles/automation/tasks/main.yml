---
- name: Run automation stack deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Detect hardware for resource allocation
  ansible.builtin.include_role:
    name: common
    tasks_from: detect_hardware
  tags: [hardware, validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Include common package management  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ automation_specific_packages }}"
  tags: [packages]

- name: Create automation user
  ansible.builtin.user:
    name: "{{ automation_user }}"
    uid: "{{ automation_uid }}"
    group: "{{ automation_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    home: "/home/{{ automation_user }}"
    createhome: true
  become: true

- name: Include storage setup
  ansible.builtin.include_tasks: storage.yml
  tags: [storage]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Create automation stack home directory
  ansible.builtin.file:
    path: "{{ automation_stack_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  tags: [docker]

- name: Include Traefik setup
  ansible.builtin.include_tasks: traefik.yml
  when: automation_services_enabled.traefik
  tags: [traefik, reverse-proxy]

- name: Include stack deployment
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, deploy]

- name: Configure unified restic backup  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: restic_backup
  vars:
    common_backup_service_name: "automation"
    common_backup_paths:
      - "{{ automation_stack_home }}"
      - "{{ automation_data_path }}"
    backup_schedule: "0 3 * * *"
    backup_excludes:
      - "*.log"
      - "tmp/*"
      - "cache/*"
    pre_backup_commands:
      - >-
        docker compose -f {{ automation_stack_home }}/docker-compose.yml pause
    post_backup_commands:
      - >-
        docker compose -f {{ automation_stack_home }}/docker-compose.yml unpause
    backup_ssh_config:
      host: "{{ backup_ssh_host }}"
      port: "{{ backup_ssh_port }}"
      user: "{{ backup_ssh_user }}"
      remote_path: "/backups"
  when: restic_enabled
  tags: [backup]

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Create Docker stack systemd service  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    stack_service_name: "automation-stack"
    stack_description: "Automation Stack (Traefik, Vaultwarden, InfluxDB)"
    stack_home_directory: "{{ automation_stack_home }}"
    stack_user: "{{ automation_user }}"
    stack_environment_vars:
      - "AUTOMATION_DATA_PATH={{ automation_data_path }}"
      - "PUID={{ automation_uid }}"
      - "PGID={{ automation_gid }}"
  tags: [systemd, auto-start]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation, never]
