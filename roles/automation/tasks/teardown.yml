---
# Reverse the automation role so a disposable test Pi can be re-tested from a
# near-clean state. User data under automation_data_path is intentionally left
# in place.

- name: Refuse to run outside a confirmed teardown
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_gate
  vars:
    common_teardown_name: automation

- name: Tear down the stack service and compose project
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_stack_service
  vars:
    common_teardown_stack_home: "{{ automation_stack_home }}"
    common_teardown_stack_user: "{{ ansible_user }}"

- name: Remove the manage-automation symlink
  ansible.builtin.file:
    path: /usr/local/bin/manage-automation
    state: absent
  become: true

- name: Remove the automation cron jobs
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_cron
  vars:
    common_teardown_cron_jobs:
      - { name: "Automation Syncthing local backup", user: root }

- name: Remove the automation role file artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /usr/local/bin/automation-syncthing-backup
    - "{{ automation_stack_home }}"
    - /var/log/automation-syncthing-backup.log

- name: Tear down Syncthing
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_teardown
  when: common_syncthing_enabled | default(false) | bool

- name: Verify the automation artifacts are gone
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_verify_absent
  vars:
    common_teardown_name: automation
    common_teardown_paths:
      - /usr/local/bin/automation-syncthing-backup
      - /usr/local/bin/manage-automation
      - /etc/systemd/system/stack.service
      - /var/log/automation-syncthing-backup.log
      - "{{ automation_stack_home }}"
