---
# Restic owns off-site backups (restic_backup.yml); the local Syncthing backup
# below replicates a MariaDB dump and a Vaultwarden snapshot off-box.

- name: Install the nightly local snapshot backup
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_snapshot_backup
  vars:
    common_snapshot_name: "automation"
    common_snapshot_stack_home: "{{ automation_stack_home }}"
    common_snapshot_dest: "{{ automation_backup_dir }}"
    common_snapshot_owner: "{{ automation_backup_owner }}"
    common_snapshot_retention: "{{ automation_backup_retention }}"
    common_snapshot_hour: "{{ automation_backup_schedule_hour }}"
    common_snapshot_minute: "{{ automation_backup_schedule_minute }}"
    common_snapshot_summary: >-
      MariaDB dump, Vaultwarden snapshot + attachments, the stack .env and the
      Calibre DB snapshots
    common_snapshot_steps:
      # Scheduled before the restic timer, which pauses the compose project.
      - |
        timeout 600 docker compose exec -T mariadb sh -c \
            'MYSQL_PWD="$MARIADB_PASSWORD" mariadb-dump --single-transaction -u "$MARIADB_USER" "$MARIADB_DATABASE"' \
            | gzip > "$WORK/firefly.sql.gz"
      - |
        sqlite3 "{{ automation_data_path }}/vaultwarden/db.sqlite3" "VACUUM INTO '$WORK/vaultwarden.db'"
      - |
        if [ -d "{{ automation_data_path }}/vaultwarden/attachments" ]; then
            tar -C "{{ automation_data_path }}/vaultwarden" -czf "$WORK/attachments.tar.gz" attachments
        fi
      - |
        cp "$STACK_HOME/.env" "$WORK/automation.env"
      - |
        if [ -d "{{ automation_data_path }}/calibre" ]; then
            mkdir -p "$WORK/calibre-databases"
            for db in "{{ automation_data_path }}"/calibre/config/*.db \
                      "{{ automation_data_path }}"/calibre/library/metadata.db; do
                [ -f "$db" ] || continue
                sqlite3 -cmd '.timeout 5000' "$db" ".backup '$WORK/calibre-databases/$(basename "$db")'"
            done
        fi
  when: automation_backup_enabled

- name: Install Syncthing (common role, optional)
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing
  when: common_syncthing_enabled | default(false) | bool and automation_backup_enabled

- name: Deploy the Calibre Syncthing ignore rules (optional)
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_ignore
  vars:
    common_syncthing_folder_path: "{{ automation_data_path }}/calibre"
    common_syncthing_folder_ignore: "{{ automation_syncthing_calibre_ignore }}"
  when: common_syncthing_enabled | default(false) | bool and automation_backup_enabled

- name: Share the live Calibre tree over Syncthing (optional)
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_folder
  vars:
    common_syncthing_folder_id: "calibre"
    common_syncthing_folder_path: "{{ automation_data_path }}/calibre"
    common_syncthing_folder_type: "sendonly"
  when: common_syncthing_enabled | default(false) | bool and automation_backup_enabled

- name: Register the automation Syncthing backup folder
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_folder
  vars:
    common_syncthing_folder_id: "backup"
    common_syncthing_folder_path: "{{ automation_backup_dir }}"
    common_syncthing_folder_type: "sendonly"
  when: common_syncthing_enabled | default(false) | bool and automation_backup_enabled

- name: Configure unified restic backup # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: restic_backup
  vars:
    common_backup_service_name: "automation"
    common_backup_paths:
      - "{{ automation_stack_home }}"
      - "{{ automation_data_path }}"
    retention_policy:
      daily: 14
      weekly: 8
      monthly: 12
      yearly: 3
    backup_exclude_patterns:
      - "*.log"
      - "tmp/*"
      - "cache/*"
      - "{{ automation_data_path }}/docker"
      - "{{ automation_backup_dir }}"
    backup_ssh_config: true
    common_backup_exec_start_pre:
      - >-
        +/usr/sbin/runuser -u {{ ansible_user }} --
        /usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml pause
    common_backup_exec_stop_post:
      - >-
        +/usr/sbin/runuser -u {{ ansible_user }} --
        /usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml unpause
  when: restic_enabled
  tags:
    - backup
