---
# Restic owns off-site backups (restic_backup.yml); the local Syncthing backup
# below replicates a MariaDB dump and a Vaultwarden snapshot off-box.

- name: Validate local backup configuration
  ansible.builtin.assert:
    that:
      - automation_backup_dir is defined
      - automation_backup_owner is defined
    fail_msg: >-
      automation_backup_dir (the Syncthing-shared folder, on the SSD) and
      automation_backup_owner (the user that runs Syncthing) must be set
      in host_vars when automation_backup_enabled is true.
    quiet: true
  when: automation_backup_enabled

- name: Ensure the Syncthing backup directory exists
  ansible.builtin.file:
    path: "{{ automation_backup_dir }}"
    state: directory
    owner: "{{ automation_backup_owner }}"
    mode: "0750"
  become: true
  when: automation_backup_enabled

- name: Install the automation Syncthing backup script
  ansible.builtin.template:
    src: automation-syncthing-backup.sh.j2
    dest: /usr/local/bin/automation-syncthing-backup
    owner: root
    group: root
    mode: "0755"
  become: true
  when: automation_backup_enabled

- name: Schedule the automation Syncthing backup
  ansible.builtin.cron:
    name: "Automation Syncthing local backup"
    minute: "{{ automation_backup_schedule_minute }}"
    hour: "{{ automation_backup_schedule_hour }}"
    job: "/usr/local/bin/automation-syncthing-backup >> /var/log/automation-syncthing-backup.log 2>&1"
    user: root
  become: true
  when: automation_backup_enabled

- name: Install Syncthing (common role, optional)
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing
  when: common_syncthing_enabled | default(false) | bool and automation_backup_enabled

- name: Gather service facts for the Syncthing folder registration
  # The registration condition below reads ansible_facts.services - gather it
  # here so the condition is safe even when nothing else ran service_facts.
  ansible.builtin.service_facts:
  when: automation_backup_enabled

- name: Ensure Syncthing backup folder is configured
  # Best-effort registration for Syncthing replication: the backup script
  # creates its destination itself, so a failure here must not fail the deploy.
  ansible.builtin.command: >-
    syncthing cli config folders list | grep -q "backup" ||
    syncthing cli config folders add --id "backup" --label "backup"
    --path "{{ automation_backup_dir }}"
  become: true
  become_user: "{{ ansible_user }}"
  when: >-
    common_syncthing_enabled | default(false) | bool
    and automation_backup_enabled
    and (ansible_facts['services']['syncthing.service'] is defined
         and ansible_facts['services']['syncthing.service']['state'] == 'running')
  changed_when: false
  ignore_errors: true

- name: Configure unified restic backup  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: restic_backup
  vars:
    common_backup_service_name: "automation"
    common_backup_paths:
      - "{{ automation_stack_home }}"
      - "{{ automation_data_path }}"
    # Match the retention documented for this host (docs/backup/index.md):
    # without it, cleanup_old_snapshots() falls back to the script's hardcoded
    # 7 daily / 4 weekly / 6 monthly / 1 yearly.
    retention_policy:
      daily: 14
      weekly: 8
      monthly: 12
      yearly: 3
    backup_exclude_patterns:
      - "*.log"
      - "tmp/*"
      - "cache/*"
      # Docker's own layer storage: many GB of re-derivable state (re-pull the
      # image rather than restore it), and large enough to exhaust staging space.
      - "{{ automation_data_path }}/docker"
    # A flag only: the connectivity test connects through the shared
    # hetzner-storage ssh_config alias, the same one restic itself uses.
    backup_ssh_config: true
    # '+' runs this one line as root regardless of the unit's User=backup, so
    # it can runuser into automation without granting backup itself any
    # Docker access. ExecStopPost (not ExecStart*Post) runs even if the
    # backup itself failed, so the stack is never left paused.
    common_backup_exec_start_pre:
      - >-
        +/usr/sbin/runuser -u {{ ansible_user }} --
        /usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml pause
    common_backup_exec_stop_post:
      - >-
        +/usr/sbin/runuser -u {{ ansible_user }} --
        /usr/bin/docker compose -f {{ automation_stack_home }}/docker-compose.yml unpause
  when: restic_enabled
  tags: [backup]
