# Restic backup configuration for automation stack

- name: Install restic
  ansible.builtin.get_url:
    url: "https://github.com/restic/restic/releases/latest/download/restic_{{ ansible_system | lower }}_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    dest: /usr/local/bin/restic
    mode: '0755'
    backup: true
    checksum: "{{ restic_checksums[ansible_architecture] | default(omit) }}"
  become: true

- name: Verify restic installation
  ansible.builtin.command: restic version
  register: restic_version_check
  changed_when: false

- name: Display restic version
  ansible.builtin.debug:
    msg: "Restic installed: {{ restic_version_check.stdout }}"

- name: Create backup user
  ansible.builtin.user:
    name: backup
    system: true
    shell: /bin/bash
    home: /opt/backup
    create_home: true
    groups: "automation,docker"
    append: true
  become: true

- name: Create restic directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: backup
    group: backup
    mode: '0700'
  become: true
  loop:
    - /opt/backup/.ssh
    - /opt/backup/cache
    - /opt/backup/logs
    - /opt/backup/scripts

- name: Generate SSH key for Hetzner access
  ansible.builtin.openssh_keypair:
    path: "{{ hetzner_ssh_key_path }}"
    type: ed25519
    owner: backup
    group: backup
    mode: '0600'
  become: true

- name: Validate restic password is set
  ansible.builtin.fail:
    msg: "restic_password must be set to a secure value. Current value suggests it needs to be changed."
  when: restic_password == 'CHANGEME-GENERATE-SECURE-PASSWORD'

- name: Create restic password file
  ansible.builtin.template:
    src: restic-password.j2
    dest: /opt/backup/restic-password
    owner: backup
    group: backup
    mode: '0600'
  become: true

- name: Create restic repository initialization script
  ansible.builtin.template:
    src: restic-init.sh.j2
    dest: /opt/backup/scripts/restic-init.sh
    owner: backup
    group: backup
    mode: '0755'
  become: true

- name: Create main restic backup script
  ansible.builtin.template:
    src: backup-automation-restic.sh.j2
    dest: /opt/backup/scripts/backup-automation-restic.sh
    owner: backup
    group: backup
    mode: '0755'
  become: true

- name: Create systemd service for restic backup
  ansible.builtin.template:
    src: backup-automation.service.j2
    dest: /etc/systemd/system/backup-automation.service
    mode: '0644'
  become: true
  notify: reload systemd

- name: Create systemd timer for restic backup
  ansible.builtin.template:
    src: backup-automation.timer.j2
    dest: /etc/systemd/system/backup-automation.timer
    mode: '0644'
  become: true
  notify: reload systemd

- name: Set permissions on automation directories for backup user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "g+rx"
    recurse: false
  become: true
  loop:
    - "{{ automation_stack_home }}"
    - "{{ automation_data_path }}"

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: backup-automation.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: restic_enabled | default(true)

