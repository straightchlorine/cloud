# Traefik routing validation for DNS01 SSL setup
# Validates dynamic routing configuration and service accessibility

- name: Validate Traefik container is running
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    docker compose ps traefik --format json
  register: traefik_status
  become_user: "{{ automation_user }}"
  changed_when: false
  tags: [routing_validation]

- name: Parse Traefik container status
  ansible.builtin.set_fact:
    traefik_container: "{{ traefik_status.stdout | from_json }}"
  tags: [routing_validation]

- name: Ensure Traefik container is running
  ansible.builtin.fail:
    msg: "Traefik container is not running (State: {{ traefik_container.State }})"
  when: traefik_container.State != "running"
  tags: [routing_validation]

- name: Test Traefik API accessibility
  ansible.builtin.uri:
    url: "http://localhost:{{ traefik_dashboard_port }}/api/version"
    method: GET
    timeout: 10
  register: traefik_api
  tags: [routing_validation]

- name: Get Traefik router configuration
  ansible.builtin.uri:
    url: "http://localhost:{{ traefik_dashboard_port }}/api/http/routers"
    method: GET
    timeout: 10
  register: traefik_routers
  tags: [routing_validation]

- name: Get Traefik service configuration
  ansible.builtin.uri:
    url: "http://localhost:{{ traefik_dashboard_port }}/api/http/services"
    method: GET
    timeout: 10
  register: traefik_services
  tags: [routing_validation]

- name: Extract configured routers
  ansible.builtin.set_fact:
    configured_routers: "{{ traefik_routers.json | selectattr('name', 'match', '.*@file$') | list }}"
  tags: [routing_validation]

- name: Validate expected routes are configured
  ansible.builtin.set_fact:
    expected_routes:
      - name: "dashboard"
        host: "{{ subdomain_traefik | default('traefik') }}.{{ domain_name }}"
      - name: "dozzle"
        host: "{{ subdomain_dozzle | default('dozzle') }}.{{ domain_name }}"
      - name: "portainer"
        host: "{{ subdomain_portainer | default('portainer') }}.{{ domain_name }}"
      - name: "influxdb"
        host: "{{ subdomain_influxdb | default('influxdb') }}.{{ domain_name }}"
      - name: "influxdb-explorer"
        host: "{{ subdomain_explorer | default('influxdb-ui') }}.{{ domain_name }}"
      - name: "vaultwarden"
        host: "{{ subdomain_vaultwarden | default('vault') }}.{{ domain_name }}"
  tags: [routing_validation]

- name: Check if all expected routes are present
  ansible.builtin.set_fact:
    missing_routes: []
    present_routes: []
  tags: [routing_validation]

- name: Identify missing and present routes
  ansible.builtin.set_fact:
    missing_routes: "{{ missing_routes + [item.name] }}"
    present_routes: "{{ present_routes + [item.name] }}"
  when: configured_routers | selectattr('rule', 'search', item.host) | list | length == 0
  loop: "{{ expected_routes }}"
  tags: [routing_validation]

- name: Validate SSL certificate resolver configuration
  ansible.builtin.set_fact:
    ssl_routers: "{{ configured_routers | selectattr('tls', 'defined') | selectattr('tls.certResolver', 'equalto', 'letsencrypt') | list }}"
  tags: [routing_validation]

- name: Test internal service connectivity
  ansible.builtin.wait_for:
    host: "localhost"
    port: "{{ item.port }}"
    timeout: 10
  loop:
    - {service: "traefik-dashboard", port: "{{ traefik_dashboard_port }}"}
    - {service: "traefik-web", port: "{{ traefik_web_port }}"}
    - {service: "traefik-websecure", port: "{{ traefik_websecure_port }}"}
  register: port_connectivity
  tags: [routing_validation]

- name: Check Traefik logs for SSL certificate errors
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    docker compose logs traefik --tail=50 | grep -i "error\|fail\|certificate" | tail -10 || echo "No recent SSL errors found"
  register: traefik_ssl_logs
  become_user: "{{ automation_user }}"
  changed_when: false
  tags: [routing_validation]

- name: Validate middleware configuration
  ansible.builtin.uri:
    url: "http://localhost:{{ traefik_dashboard_port }}/api/http/middlewares"
    method: GET
    timeout: 10
  register: traefik_middlewares
  tags: [routing_validation]

- name: Check for required middlewares
  ansible.builtin.set_fact:
    required_middlewares: ["dashboard-auth", "rate-limit", "body-limit"]
    present_middlewares: "{{ traefik_middlewares.json | map(attribute='name') | list }}"
  tags: [routing_validation]

- name: Test HTTPS redirect functionality
  ansible.builtin.uri:
    url: "http://localhost:{{ traefik_web_port }}"
    method: GET
    follow_redirects: none
    timeout: 10
  register: https_redirect_test
  failed_when: false
  tags: [routing_validation]

- name: Display Traefik routing validation results
  ansible.builtin.debug:
    msg: |
      ✅ Traefik Routing Validation Results:

      Container Status:
      Traefik Container: {{ '✅ Running' if traefik_container.State == 'running' else '❌ ' + traefik_container.State }}
      Traefik Version: {{ traefik_api.json.version | default('Unknown') }}

      API Endpoints:
      Dashboard API: {{ '✅ Accessible' if traefik_api.status == 200 else '❌ Failed' }}
      Routers API: {{ '✅ Accessible' if traefik_routers.status == 200 else '❌ Failed' }}
      Services API: {{ '✅ Accessible' if traefik_services.status == 200 else '❌ Failed' }}

      Route Configuration:
      Total Routes: {{ configured_routers | length }}
      SSL-Enabled Routes: {{ ssl_routers | length }}
      {% for route in expected_routes %}
      {{ route.name }} ({{ route.host }}): {{ '✅ Configured' if configured_routers | selectattr('rule', 'search', route.host) | list | length > 0 else '❌ Missing' }}
      {% endfor %}

      Port Connectivity:
      {% for result in port_connectivity.results %}
      {{ result.item.service }}: {{ '✅ Listening' if result.elapsed is defined and result.elapsed < 10 else '❌ Failed' }}
      {% endfor %}

      HTTPS Configuration:
      HTTP→HTTPS Redirect: {{ '✅ Working' if https_redirect_test.status == 301 or https_redirect_test.status == 302 else '⚠️  Check configuration' }}
      Certificate Resolver: {{ '✅ letsencrypt configured' if ssl_routers | length > 0 else '❌ No SSL routes found' }}

      Security Middlewares:
      {% for middleware in required_middlewares %}
      {{ middleware }}: {{ '✅ Present' if middleware in present_middlewares else '❌ Missing' }}
      {% endfor %}

      Recent SSL Activity:
      {{ traefik_ssl_logs.stdout | replace('\n', '\n      ') }}

      🚀 Traefik routing validation completed!
  tags: [routing_validation]

