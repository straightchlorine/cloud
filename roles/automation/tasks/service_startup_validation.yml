# Automation stack service startup order validation
# Validates service dependencies and startup sequence for automation services

- name: Validate automation service startup variables are defined
  ansible.builtin.fail:
    msg: "Required automation startup variable '{{ item }}' is not defined or empty"
  when: vars[item] is not defined or vars[item] == ""
  loop:
    - automation_stack_home
    - automation_services
  tags: [service_startup_validation]

- name: Check automation Docker Compose file
  ansible.builtin.stat:
    path: "{{ automation_stack_home }}/docker-compose.yml"
  register: automation_compose_check
  tags: [service_startup_validation]

- name: Validate automation Docker Compose file exists
  ansible.builtin.fail:
    msg: "Automation Docker Compose file not found at {{ automation_stack_home }}/docker-compose.yml"
  when: not automation_compose_check.stat.exists
  tags: [service_startup_validation]

- name: Analyze automation service dependency structure
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    # Check for critical services in compose file
    services_found=""
    for service in traefik influxdb3-core influxdb3-explorer vaultwarden portainer watchtower dozzle; do
      if grep -q "^  ${service}:" docker-compose.yml; then
        services_found="${services_found}${service},"
      fi
    done
    echo "${services_found%,}"
  register: automation_service_analysis
  changed_when: false
  tags: [service_startup_validation]

- name: Validate critical automation services are defined
  ansible.builtin.fail:
    msg: "Critical automation service '{{ item }}' not found in Docker Compose file"
  when: item not in automation_service_analysis.stdout
  loop:
    - traefik
    - influxdb3-core
    - vaultwarden
    - portainer
  tags: [service_startup_validation]

- name: Check Traefik reverse proxy configuration
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    # Verify services have Traefik labels for proper routing
    services_with_traefik=""
    for service in influxdb3-core influxdb3-explorer vaultwarden portainer dozzle; do
      if grep -A 20 "^  ${service}:" docker-compose.yml | grep -q "traefik.enable=true"; then
        services_with_traefik="${services_with_traefik}${service},"
      fi
    done
    echo "${services_with_traefik%,}"
  register: traefik_routing_check
  changed_when: false
  tags: [service_startup_validation]

- name: Validate service network configuration
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    # Check that services use traefik-network
    network_services=""
    for service in traefik influxdb3-core influxdb3-explorer vaultwarden portainer dozzle watchtower; do
      if grep -A 10 "^  ${service}:" docker-compose.yml | grep -q "traefik-network"; then
        network_services="${network_services}${service},"
      fi
    done
    echo "${network_services%,}"
  register: network_config_check
  changed_when: false
  tags: [service_startup_validation]

- name: Check for service health checks
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    # Look for health check definitions
    health_check_services=""
    for service in traefik influxdb3-core vaultwarden; do
      if grep -A 15 "^  ${service}:" docker-compose.yml | grep -q "healthcheck\|health"; then
        health_check_services="${health_check_services}${service},"
      fi
    done
    echo "${health_check_services%,}"
  register: health_check_analysis
  changed_when: false
  tags: [service_startup_validation]

- name: Analyze service startup dependency implications
  ansible.builtin.set_fact:
    automation_startup_order:
      tier_1_foundation: ["traefik"]  # Must start first - reverse proxy
      tier_2_databases: ["influxdb3-core"]  # Core data services
      tier_3_applications: ["vaultwarden", "portainer", "influxdb3-explorer"]  # Apps needing Traefik
      tier_4_monitoring: ["dozzle", "watchtower"]  # Support services
    automation_critical_dependencies:
      - { service: "influxdb3-explorer", requires: "influxdb3-core", reason: "Database dependency" }
      - { service: "vaultwarden", requires: "traefik", reason: "Reverse proxy routing" }
      - { service: "portainer", requires: "traefik", reason: "Web interface routing" }
      - { service: "dozzle", requires: "traefik", reason: "Log viewer routing" }
  tags: [service_startup_validation]

- name: Validate port exposure configuration
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    # Check for proper port bindings (should be localhost only for management interfaces)
    problematic_ports=""
    if grep -q "8080:8080" docker-compose.yml; then
      problematic_ports="${problematic_ports}8080,"
    fi
    if grep -q "8084:8080" docker-compose.yml; then
      problematic_ports="${problematic_ports}8084,"
    fi
    echo "${problematic_ports%,}"
  register: port_exposure_check
  changed_when: false
  tags: [service_startup_validation]

- name: Check for external network dependency
  ansible.builtin.shell: |
    cd "{{ automation_stack_home }}"
    if grep -q "external: true" docker-compose.yml; then
      echo "external_network_required"
    else
      echo "no_external_dependency"
    fi
  register: external_network_check
  changed_when: false
  tags: [service_startup_validation]

- name: Automation service startup validation completed
  ansible.builtin.debug:
    msg: |
      ✅ Automation Stack Service Startup Validation:

      Service Discovery:
      - Found services: {{ automation_service_analysis.stdout }}
      - Traefik routing: {{ traefik_routing_check.stdout }}
      - Network config: {{ network_config_check.stdout }}

      Startup Dependency Analysis:
      Tier 1 (Foundation): {{ automation_startup_order.tier_1_foundation | join(', ') }}
      Tier 2 (Databases): {{ automation_startup_order.tier_2_databases | join(', ') }}
      Tier 3 (Applications): {{ automation_startup_order.tier_3_applications | join(', ') }}
      Tier 4 (Monitoring): {{ automation_startup_order.tier_4_monitoring | join(', ') }}

      Critical Dependencies Identified:
      {% for dep in automation_critical_dependencies %}
      - {{ dep.service }} requires {{ dep.requires }} ({{ dep.reason }})
      {% endfor %}

      Network Requirements:
      - External network needed: {{ 'Yes' if external_network_check.stdout == 'external_network_required' else 'No' }}

      ⚠️  Recommendation: Services should start in tier order to prevent dependency failures.
  tags: [service_startup_validation]