# Docker setup tasks for automation stack

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker

- name: Create automation stack home directory
  ansible.builtin.file:
    path: "{{ automation_stack_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Test Docker installation
  ansible.builtin.command: docker run --rm hello-world
  register: docker_test
  become_user: "{{ ansible_user }}"
  changed_when: false

