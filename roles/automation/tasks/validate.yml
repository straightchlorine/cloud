# Automation stack deployment validation
# Ensures all requirements are met before automation stack deployment begins

- name: Validate automation stack required variables are defined
  ansible.builtin.fail:
    msg: "Required variable '{{ item }}' is not defined or empty"
  when: vars[item] is not defined or vars[item] == ""
  loop:
    - domain_name
    - vault_domain_name
    - vault_letsencrypt_email
    - automation_data_path
    - automation_stack_home
    - automation_user
    - automation_uid
    - automation_gid
    - vault_traefik_basic_auth
    - vault_cloudflare_api_token
    - services_enabled
    - restic_enabled
    - start_stack
    - traefik_web_port
    - traefik_websecure_port
    - traefik_dashboard_port
  tags: [validation]

- name: Validate automation parent directories exist
  ansible.builtin.stat:
    path: "{{ item | dirname }}"
  register: parent_path_check
  failed_when: not parent_path_check.stat.exists or not parent_path_check.stat.isdir
  loop:
    - "{{ automation_data_path }}"
    - "{{ automation_stack_home }}"

- name: Check if automation directories exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: dir_check
  loop:
    - "{{ automation_data_path }}"
    - "{{ automation_stack_home }}"

- name: Create automation directories if they don't exist
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ automation_user }}"
    group: "{{ automation_user }}"
    mode: '0755'
  when: not item.stat.exists
  loop: "{{ dir_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: yes

- name: Check if automation user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ automation_user }}"
  register: user_check
  failed_when: false

- name: Validate UID/GID are numeric
  ansible.builtin.fail:
    msg: "automation_uid and automation_gid must be numeric values"
  when: not (automation_uid | string | regex_search('^[0-9]+$')) or not (automation_gid | string | regex_search('^[0-9]+$'))

- name: Check required ports are available
  ansible.builtin.wait_for:
    port: "{{ item }}"
    timeout: 1
  register: port_check
  failed_when: false
  loop:
    - "{{ traefik_web_port }}"
    - "{{ traefik_websecure_port }}"
    - "{{ traefik_dashboard_port }}"

- name: Fail if critical ports are in use
  ansible.builtin.fail:
    msg: "Port {{ item.item }} is already in use"
  when: item.elapsed is defined and item.elapsed < 1
  loop: "{{ port_check.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify Docker is installed and running
  ansible.builtin.systemd:
    name: docker
  register: docker_status

- name: Fail if Docker is not active
  ansible.builtin.fail:
    msg: "Docker service is not running. Install and start Docker before deploying automation stack."
  when: docker_status.status.ActiveState != "active"

- name: Check Docker Compose is available
  ansible.builtin.command: docker compose version
  register: compose_check
  failed_when: compose_check.rc != 0
  changed_when: false

- name: Verify internet connectivity for container pulls
  ansible.builtin.uri:
    url: https://hub.docker.com
    method: HEAD
    timeout: 10

- name: Check available disk space for containers
  ansible.builtin.shell: df {{ automation_data_path | dirname }} | tail -1 | awk '{print $4}'
  register: disk_space
  changed_when: false

- name: Fail if insufficient disk space
  ansible.builtin.fail:
    msg: "Insufficient disk space. Available: {{ (disk_space.stdout | int / 1024 / 1024) | round(2) }}GB. Required: 5GB minimum"
  when: (disk_space.stdout | int) < 5242880

- name: Validate domain name format
  ansible.builtin.fail:
    msg: "domain_name must be a valid domain format"
  when: not (domain_name | regex_search('^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]*\.[a-zA-Z]{2,}$'))

- name: Test DNS resolution for domain
  ansible.builtin.command: nslookup {{ domain_name }}
  register: domain_dns_check
  failed_when: false
  changed_when: false

- name: Warn if domain DNS not configured
  ansible.builtin.debug:
    msg: "WARNING: Domain {{ domain_name }} does not resolve. SSL certificates may fail."
  when: domain_dns_check.rc != 0

- name: Run vault variable validation
  ansible.builtin.include_tasks: vault_validation.yml
  tags: [vault_validation]

- name: Run template rendering validation
  ansible.builtin.include_role:
    name: common
    tasks_from: template_validation
  tags: [template_validation]

- name: Run backup directory validation
  ansible.builtin.include_tasks: backup_validation.yml
  tags: [backup_validation]

- name: Run common backup directory validation
  ansible.builtin.include_role:
    name: common
    tasks_from: backup_validation
  tags: [backup_validation]

- name: Run service startup order validation
  ansible.builtin.include_tasks: service_startup_validation.yml
  tags: [service_startup_validation]

- name: Run common service startup validation
  ansible.builtin.include_role:
    name: common
    tasks_from: service_startup_validation
  tags: [service_startup_validation]

- name: Automation stack validation completed successfully
  ansible.builtin.debug:
    msg: "All automation stack deployment requirements validated successfully (including vault variables, templates, backup directories, and service startup order)"