---
# Fail-fast pre-deployment validation for the automation stack. site.yml also
# includes this file directly, so it re-runs os discovery itself.

- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [validation]

- name: Run automation stack comprehensive validation
  ansible.builtin.include_role:
    name: common
    tasks_from: unified_validation
  vars:  # noqa: var-naming[no-role-prefix]
    validation_context: "automation stack"
    validation_type: "full"
    validation_role: "automation"
    required_variables:
      - domain_name
      - vault_domain_name
      - vault_letsencrypt_email
      - automation_data_path
      - automation_stack_home
      - automation_trusted_proxies
      - restic_enabled
      - restic_repository
      - restic_password
    vault_placeholders:
      - { var: "vault_firefly_app_key", value: "your-firefly-app-key" }
      - { var: "vault_firefly_static_cron_token", value: "your-firefly-static-cron-token" }
      - { var: "vault_firefly_db_password", value: "your-firefly-db-password" }
      - { var: "vault_vaultwarden_admin_token", value: "your-vaultwarden-admin-token" }
      - { var: "vault_watchtower_api_token", value: "your-watchtower-api-token" }
  tags: [validation]

- name: Confirm the host OS and architecture are supported
  ansible.builtin.assert:
    that:
      - os_family == "Debian"
    fail_msg: >-
      automation requires a Debian-family OS; got
      {{ os_family | default('unknown') }}
      ({{ os_name | default('?') }} {{ os_version | default('?') }}).
    success_msg: >
      [OK] Supported OS: {{ os_name }} {{ os_version }}
      ({{ os_family }}).
  tags: [validation]

- name: Validate the parent directories of the stack paths exist
  ansible.builtin.stat:
    path: "{{ item | dirname }}"
  register: automation_parent_path_check
  failed_when: not automation_parent_path_check.stat.exists or not automation_parent_path_check.stat.isdir
  loop:
    - "{{ automation_data_path }}"
    - "{{ automation_stack_home }}"
  tags: [validation]

- name: Refuse a stack home under /root for a non-root stack user
  # Guard against deriving the stack home from the ansible_user_dir/_id facts:
  # under become:true those reflect root, which lands in /root for a non-root
  # control user and cannot be traversed by the stack owner.
  ansible.builtin.fail:
    msg: >-
      automation_stack_home ({{ automation_stack_home }}) resolves under /root,
      but ansible_user is '{{ ansible_user }}'. The role derives the stack home
      from the inventory's ansible_user (/home/<user>/stack); a /root
      path usually means an ansible_user_dir / ansible_user_id FACT was used -
      under become:true those reflect the become root user, not the stack owner.
  when:
    - ansible_user is defined and ansible_user != 'root'
    - automation_stack_home is match('/root(/|$)')
  tags: [validation]

- name: Refuse the Firefly TRUSTED_PROXIES catch-all
  ansible.builtin.fail:
    msg: >
      automation_trusted_proxies set to '**', which makes Firefly trust
      any reverse proxy on the stack network. Scope it to the reverse-
      proxy/tailnet CIDRs.
  when: "'**' in automation_trusted_proxies"
  tags: [validation]

- name: Require a 32-character hex Firefly static cron token
  # Firefly's CLIToken binder rejects anything that is not exactly 32 characters,
  # and the API answers HTTP 500 - which crash-loops the firefly-cron sidecar.
  ansible.builtin.fail:
    msg: >-
      vault_firefly_static_cron_token must be exactly 32 hex characters
      (generate with: openssl rand -hex 16); got
      {{ vault_firefly_static_cron_token | length }} characters. Firefly's
      cron endpoint rejects anything else with HTTP 500, which crash-loops
      the firefly-cron container.
  when: >-
    vault_firefly_static_cron_token | length != 32
    or vault_firefly_static_cron_token is not match('^[0-9a-fA-F]{32}$')
  tags: [validation]

- name: Require a well-formed Firefly APP_KEY
  # Laravel builds its encrypter from APP_KEY before routing, so a malformed key
  # 500s every route and crash-loops the firefly-cron sidecar. Both upstream
  # formats are accepted; the only pipeline constraint is no literal double quote.
  ansible.builtin.fail:
    msg: >-
      vault_firefly_app_key is not a valid Firefly APP_KEY; got
      {{ vault_firefly_app_key | length }} characters. Valid formats: exactly
      32 raw characters with no embedded double quote
      (head /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 32), or the
      'base64:' prefixed form (echo "base64:$(openssl rand -base64 32)"). A
      bare 'openssl rand -base64 32' output WITHOUT the base64: prefix does
      not work - Firefly 500s every route with "Unsupported cipher or
      incorrect key length" and the firefly-cron sidecar crash-loops.
  when: >-
    not ((vault_firefly_app_key | length == 32)
    and ('"' not in vault_firefly_app_key))
    and not ((vault_firefly_app_key | length == 51)
    and (vault_firefly_app_key is match('^base64:[A-Za-z0-9+/]{43}={1,2}$')))
  tags: [validation]
