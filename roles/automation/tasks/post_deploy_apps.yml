---
# These checks use plain HTTP on primary_ip, which is exactly what the central reverse proxy serves.

- name: Verify Vaultwarden answers on /alive
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ automation_vaultwarden_port }}/alive"
    method: GET
    timeout: 10
  register: automation_vaultwarden_health
  until: automation_vaultwarden_health.status == 200
  retries: 10
  delay: 3
  tags: [post_validation]

- name: Verify Vaultwarden can write its data directory
  # The /alive endpoint proves only that the HTTP listener is up, not that SQLite writes succeed.
  # A host and container uid mismatch leaves the endpoint healthy while the WAL file stops advancing.
  ansible.builtin.command: >-
    docker compose -f {{ automation_stack_home }}/docker-compose.yml
    exec -T vaultwarden test -w /data
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Verify Firefly serves its web frontend
  # Firefly runs its database migrations on first boot and after every image update.
  # Migrations can take minutes on Pi hardware with SD storage, so a short retry window would fail a healthy deploy.
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ automation_firefly_port }}/"
    method: GET
    timeout: 10
    status_code: [200, 302]
    follow_redirects: none
  register: automation_firefly_health
  until: automation_firefly_health.status in [200, 302]
  retries: 40
  delay: 10
  tags: [post_validation]

- name: Verify Firefly can write its upload directory
  # A write failure here is silent, because Firefly answers attachment requests with HTTP 200 while nothing lands on
  # disk.
  # Only the container's own view of the bind mount proves that it can write.
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ automation_stack_home }}/docker-compose.yml
      exec -T firefly test -w /var/www/html/storage/upload
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Verify Calibre-Web Automated serves its web UI
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ automation_calibre_port }}/"
    method: GET
    timeout: 10
    status_code: [200, 302]
    follow_redirects: none
  register: automation_calibre_health
  until: automation_calibre_health.status in [200, 302]
  retries: 10
  delay: 3
  tags: [post_validation]

- name: Verify Calibre-Web Automated can write its data mounts
  # The UI check above proves only that the Flask listener answers, because cps.py opens its SQLite databases on every
  # request.
  # A host and container uid mismatch makes each book page fail with "attempt to write a readonly database" while "/"
  # still redirects.
  # The probe runs as the container's app user abc, which follows PUID, because root writes through the mismatch.
  ansible.builtin.command: >-
    docker compose -f {{ automation_stack_home }}/docker-compose.yml
    exec -T -u abc calibre-web-automated sh -c
    'test -w /config && test -w /cwa-book-ingest && test -w /calibre-library'
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Verify MariaDB answers ping
  # The root user has no known password because MARIADB_RANDOM_ROOT_PASSWORD is never captured.
  # So the check authenticates as the vault-managed firefly user, and MYSQL_PWD keeps that password out of the process
  # list.
  ansible.builtin.command: >-
    docker compose exec -T -e MYSQL_PWD={{ vault_firefly_db_password }}
    mariadb mariadb-admin -u firefly ping
  args:
    chdir: "{{ automation_stack_home }}"
  become: true
  become_user: "{{ ansible_user }}"
  register: automation_mariadb_ping
  until: "'mysqld is alive' in automation_mariadb_ping.stdout"
  retries: 10
  delay: 3
  changed_when: false
  no_log: true
  tags: [post_validation]
