---
# Business-level post-deploy checks over the real publish addresses: plain
# HTTP on primary_ip - exactly what the central reverse proxy serves.

- name: Verify Vaultwarden answers on /alive
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ automation_vaultwarden_port }}/alive"
    method: GET
    timeout: 10
  register: automation_vaultwarden_health
  until: automation_vaultwarden_health.status == 200
  retries: 10
  delay: 3
  tags: [post_validation]

- name: Verify Firefly serves its web frontend
  # Firefly runs its DB migrations on first boot (and after every image
  # update), which can take several minutes on Pi-class hardware/SD storage -
  # a short retry window here false-fails a healthy, still-migrating deploy.
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ automation_firefly_port }}/"
    method: GET
    timeout: 10
    status_code: [200, 302]
    follow_redirects: none
  register: automation_firefly_health
  until: automation_firefly_health.status in [200, 302]
  retries: 40
  delay: 10
  tags: [post_validation]

- name: Verify Firefly can actually write its upload directory
  # The failure this guards is silent: attachments upload "fine", Firefly
  # returns HTTP 200 on the attachment view and nothing lands on disk. Only
  # the container's own view of the bind mount proves it.
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ automation_stack_home }}/docker-compose.yml
      exec -T firefly test -w /var/www/html/storage/upload
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Verify Calibre-Web Automated serves its web UI
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ automation_calibre_port }}/"
    method: GET
    timeout: 10
    status_code: [200, 302]
    follow_redirects: none
  register: automation_calibre_health
  until: automation_calibre_health.status in [200, 302]
  retries: 10
  delay: 3
  tags: [post_validation]

- name: Verify MariaDB answers ping
  # root@localhost has no known-working passwordless auth here
  # (MARIADB_RANDOM_ROOT_PASSWORD generates a password we never capture) -
  # authenticate as the firefly account instead, whose credentials are
  # already vault-managed and already proven working (Firefly itself is up).
  # MYSQL_PWD (not -p on the command line) keeps the password out of the
  # container's own process list.
  ansible.builtin.command: >-
    docker compose exec -T -e MYSQL_PWD={{ vault_firefly_db_password }}
    mariadb mariadb-admin -u firefly ping
  args:
    chdir: "{{ automation_stack_home }}"
  become: true
  become_user: "{{ ansible_user }}"
  register: automation_mariadb_ping
  until: "'mysqld is alive' in automation_mariadb_ping.stdout"
  retries: 10
  delay: 3
  no_log: true
  tags: [post_validation]
