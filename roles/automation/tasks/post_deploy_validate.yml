---
# Proves the running stack, never side effects: container states first, then
# real endpoint and write-access checks on the reverse-proxy-facing paths.

- name: Verify the critical compose containers are running
  ansible.builtin.include_role:
    name: common
    tasks_from: compose_containers_check
  vars:  # noqa: var-naming[no-role-prefix]
    compose_file_path: "{{ automation_stack_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    # firefly-cron is excluded (see stack.yml) - its health is asserted right
    # below by the last exit code, not by a running-state check.
    compose_critical_services:
      - vaultwarden
      - firefly
      - mariadb
      - watchtower
  tags: [post_validation]

- name: Verify the firefly-cron sidecar is not crash-looping
  # firefly-cron is a sleep-sidecar by design: wget the cron endpoint, sleep 60s,
  # exit 0, restart. The probe that matters is the LAST EXIT CODE - 0 means the
  # cycle finished cleanly (a failed wget aborts with 8/4/1 before the sleep).
  # Poll ~2 minutes so a sample taken mid-sleep still sees the last clean exit.
  ansible.builtin.command: >-
    docker inspect firefly-cron
    --format '{{ '{{.State.Status}} {{.State.ExitCode}}' }}'
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  register: automation_firefly_cron_state
  until: >-
    (automation_firefly_cron_state.stdout | trim | split | first) == 'running'
    or (automation_firefly_cron_state.stdout | trim | split | last) == '0'
  retries: 24
  delay: 5
  tags: [post_validation]

- name: Gather Docker daemon warnings
  ansible.builtin.command: >-
    docker info --format '{{ '{{.Warnings}}' }}'
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  register: automation_docker_warnings
  tags: [post_validation]

- name: Warn if Docker memory limits cannot be enforced
  # Not a deploy failure - containers run fine without limits - but the compose
  # deploy.resources block is silently DISCARDED when the memory controller is
  # unavailable (cgroup v2 without "memory", or v1 without cgroup_enable=memory).
  # Surface it every deploy; the hard FAIL gate is in validate-deploy.sh.
  ansible.builtin.debug:
    msg: >-
      WARNING: Docker reports "No memory limit support" on this host - the
      compose deploy.resources memory limits are silently discarded (each
      container may use up to all free RAM). See roles/automation/README.md
      "Resource limits vs. cgroup availability" for the check and fix.
  when: "'No memory limit support' in (automation_docker_warnings.stdout | default(''))"
  tags: [post_validation]

- name: Verify the reachable services answer
  ansible.builtin.include_tasks: post_deploy_apps.yml
  tags: [post_validation]
