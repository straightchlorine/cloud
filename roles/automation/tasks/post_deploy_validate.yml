---
# These checks prove the running stack directly, starting with container states and then endpoint and write-access
# checks.

- name: Verify the critical compose containers are running
  ansible.builtin.include_role:
    name: common
    tasks_from: compose_containers_check
  vars:  # noqa: var-naming[no-role-prefix]
    compose_file_path: "{{ automation_stack_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    # The firefly-cron sidecar is excluded, as in stack.yml, and its last exit code is checked below instead.
    compose_critical_services:
      - vaultwarden
      - firefly
      - mariadb
      - watchtower
  tags: [post_validation]

- name: Verify the cAdvisor metrics endpoint
  ansible.builtin.include_role:
    name: common
    tasks_from: verify_cadvisor_metrics
  tags: [post_validation]

- name: Verify the firefly-cron sidecar is not crash-looping
  # The sidecar calls the cron endpoint, sleeps, exits with 0 and is restarted by Docker.
  # An exit code of 0 means the cycle finished cleanly, because a failed wget exits non-zero before the sleep.
  # The retries span about two minutes so that a sample taken mid-sleep still sees a clean exit.
  ansible.builtin.command: >-
    docker inspect firefly-cron
    --format '{{ '{{.State.Status}} {{.State.ExitCode}}' }}'
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  register: automation_firefly_cron_state
  until: >-
    (automation_firefly_cron_state.stdout | trim | split | first) == 'running'
    or (automation_firefly_cron_state.stdout | trim | split | last) == '0'
  retries: 24
  delay: 5
  tags: [post_validation]

- name: Verify the reachable services answer
  ansible.builtin.include_tasks: post_deploy_apps.yml
  tags: [post_validation]
