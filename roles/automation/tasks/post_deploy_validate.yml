---
# Proves the running stack, never side effects: container states first, then
# real endpoint/business checks over the same paths gatus uses.

- name: Verify the critical compose containers are running
  ansible.builtin.include_role:
    name: common
    tasks_from: compose_containers_check
  vars:  # noqa: var-naming[no-role-prefix]
    compose_file_path: "{{ automation_stack_home }}/docker-compose.yml"
    compose_owner: "{{ ansible_user }}"
    # firefly-cron is deliberately excluded (see stack.yml): as a sleep-sidecar
    # it only reports State=running ~60s of every ~62s cycle, so a running-state
    # check would false-fail on the perfectly healthy container. Its health is
    # asserted separately right below, by the last exit code.
    compose_critical_services:
      - vaultwarden
      - firefly
      - mariadb
      - watchtower
  tags: [post_validation]

- name: Verify the firefly-cron sidecar is not crash-looping
  # firefly-cron is a sleep-sidecar BY DESIGN: wget the cron endpoint, sleep
  # 60s, exit 0, then Docker restarts it - State=running only holds ~60s of
  # every ~62s cycle. The probe that matters is the LAST EXIT CODE: 0 means the
  # wget+sleep cycle finished cleanly (a failed wget aborts before the sleep
  # with exit 8/4/1). Poll up to ~2 minutes so even a sample taken mid-sleep
  # still observes the previous clean exit.
  ansible.builtin.command: >-
    docker inspect firefly-cron
    --format '{{ '{{.State.Status}} {{.State.ExitCode}}' }}'
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  register: automation_firefly_cron_state
  until: >-
    (automation_firefly_cron_state.stdout | trim | split | first) == 'running'
    or (automation_firefly_cron_state.stdout | trim | split | last) == '0'
  retries: 24
  delay: 5
  tags: [post_validation]

- name: Gather Docker warnings (resource/cgroup capability report)
  ansible.builtin.command: >-
    docker info --format '{{ '{{.Warnings}}' }}'
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  register: automation_docker_warnings
  tags: [post_validation]

- name: Warn if Docker memory limits cannot be enforced
  # Not a deploy failure: containers run fine without enforced limits. But the
  # compose profile declares deploy.resources and it is silently DISCARDED when
  # the memory controller is unavailable (cgroup v2 without "memory" in
  # /sys/fs/cgroup/cgroup.controllers, or a v1 host without cgroup_enable=memory
  # in the kernel cmdline). Surface it every deploy so it cannot be missed; the
  # hard FAIL gate lives in scripts/automation/validate-deploy.sh.
  ansible.builtin.debug:
    msg: >-
      WARNING: Docker reports "No memory limit support" on this host - the
      compose deploy.resources memory limits are silently discarded (each
      container may use up to all free RAM). See roles/automation/README.md
      "Resource limits vs. cgroup availability" for the check and fix.
  when: "'No memory limit support' in (automation_docker_warnings.stdout | default(''))"
  tags: [post_validation]

- name: Verify the reachable services answer
  ansible.builtin.include_tasks: post_deploy_apps.yml
  tags: [post_validation]
