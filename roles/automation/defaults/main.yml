---
# Automation stack: vaultwarden, firefly (+ mariadb, cron sidecar), watchtower.
# Secrets never appear here: the compose file refers to ${VAR}, interpolated from
# the generated .env (0600) at deploy time.

# Derived from the inventory's ansible_user, the control user that owns the stack
# (as common_syncthing_home, stack_user and compose_owner do). Do NOT use the
# ansible_user_dir / ansible_user_id FACTS here: under become:true they reflect
# root and resolve to /root. Host_vars may override to pin a dedicated account.
automation_stack_home: "/home/{{ ansible_user }}/stack"
automation_backup_owner: "{{ ansible_user }}"

automation_specific_packages:
  - ncdu
  - tree
  - sqlite3  # the vaultwarden snapshot is taken with VACUUM INTO

automation_vaultwarden_port: 8081
automation_firefly_port: 8082
automation_calibre_port: 8083
automation_watchtower_metrics_port: 8084

automation_subdomain_vaultwarden: "vault"
automation_subdomain_firefly: "firefly"

# Request source allow-list for Firefly's TRUSTED_PROXIES - host-defined and
# scoped to the tailnet/LAN, never '**'.
# automation_trusted_proxies: REQUIRED in host_vars - no default.

# Optional stack SSD, mirroring the dns role's optional-drive pattern: the stack
# data path, journald and Docker's data-root ride a dedicated drive when one is
# present (auto-detected, or already mounted from a prior deploy), and the stack
# simply runs on the SD card when there is none.
automation_ssd_format: false  # DESTRUCTIVE if true - wipes the detected drive
automation_ssd_filesystem: "ext4"
automation_ssd_mount_options: "defaults,noatime,errors=remount-ro"
automation_ssd_journald_enabled: true

# Watchtower: opt-in per container via labels, nightly sweep. Application images
# float on :latest; mariadb is pinned and unlabeled so DB upgrades stay manual.
automation_watchtower_schedule: "0 2 * * *"

# Secondary local backup replicated by Syncthing; primary/off-site is restic.
# automation_backup_dir / automation_backup_owner are set in host_vars.
automation_backup_enabled: false
automation_backup_retention: 14
automation_backup_schedule_hour: "03"
automation_backup_schedule_minute: "45"

# --- Generated compose profile (secretless; env values come from .env) -----

automation_compose_networks:
  - name: stack
    compose_name: stack
    driver: bridge

automation_compose_services:
  - service_name: vaultwarden
    service_image: "vaultwarden/server:latest"
    service_ports:
      - host: "{{ automation_vaultwarden_port }}"
        container: 80
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "DOMAIN=https://{{ automation_subdomain_vaultwarden }}.{{ domain_name }}"
      - "SIGNUPS_ALLOWED=false"
      - "INVITATIONS_ALLOWED=false"
      - "SHOW_PASSWORD_HINT=false"
      - "ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/vaultwarden:/data"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: firefly
    service_image: "fireflyiii/core:latest"
    service_ports:
      - host: "{{ automation_firefly_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "APP_URL=https://{{ automation_subdomain_firefly }}.{{ domain_name }}"
      - "APP_ENV=production"
      - "APP_KEY=${FIREFLY_APP_KEY}"
      - "STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN}"
      - "TRUSTED_PROXIES={{ automation_trusted_proxies }}"
      - "TZ={{ timezone }}"
      - "DB_CONNECTION=mysql"
      - "DB_HOST=mariadb"
      - "DB_PORT=3306"
      - "DB_DATABASE=firefly"
      - "DB_USERNAME=firefly"
      - "DB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/firefly/upload:/var/www/html/storage/upload"
    service_networks:
      - stack
    service_depends_on:
      - service: mariadb
        condition: service_healthy
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "3.0"
      reservations:
        memory: 256M
        cpus: "1.0"

  - service_name: firefly-cron
    service_image: "alpine:3.20"
    service_command:
      - "sh"
      - "-c"
      - >-
        wget -q -O /dev/null
        "http://firefly:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN}"
        && sleep 60s
    service_depends_on:
      # service_healthy, not service_started: the cron endpoint 500s until
      # Firefly's migrations finish, so service_started restart-looped this sidecar.
      - service: firefly
        condition: service_healthy
    service_networks:
      - stack
    # No watchtower.enable label: watchtower refuses to run at all when any
    # monitored container has a compose dependency, and this sidecar depends on
    # firefly. Pinned to alpine:3.20, so there is nothing to update anyway.
    service_resources:
      limits:
        memory: 64M
        cpus: "0.1"
      reservations:
        memory: 32M
        cpus: "0.05"

  - service_name: mariadb
    # MariaDB upgrades a data directory forward within one major.minor series
    # only. Production data was written by 11.8.5, so this must stay >= 11.8.5.
    service_image: "mariadb:11.8.9"
    # Longer grace period + wipe tc.log (2PC coordination, unused - single
    # engine, no binlog) on every start via a wrapper entrypoint: a SIGKILL
    # mid-shutdown tears it ("Bad magic header in tc log"), and `command:`
    # can't do the wipe since docker-entrypoint.sh's init/privilege-drop only
    # fires when it sees $1 == mariadbd.
    service_stop_grace_period: "60s"
    # command: restated explicitly - unlike `docker run --entrypoint`, compose
    # does not fall back to the image's default CMD when only entrypoint: is
    # set, so without this the wrapper's "$@" is empty and mariadbd never runs.
    service_entrypoint: ["/usr/local/bin/mariadb-safe-entrypoint.sh"]
    service_command: ["mariadbd"]
    service_healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    service_environment:
      # The entrypoint refuses to initialize an EMPTY datadir without a root
      # password policy, and exits 1 on every fresh deploy. Nothing here uses
      # root - backups dump as the firefly user, and root@localhost keeps
      # unix_socket auth - so a throwaway password beats another vault secret.
      - "MARIADB_RANDOM_ROOT_PASSWORD=1"
      - "MARIADB_DATABASE=firefly"
      - "MARIADB_USER=firefly"
      - "MARIADB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/mariadb:/var/lib/mysql"
      - "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh:/usr/local/bin/mariadb-safe-entrypoint.sh:ro"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 768M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: watchtower
    # nickfedor/watchtower, not containrrr/watchtower: the latter pins the Docker
    # client to API 1.25, which Engine >= 26 refuses (exit-1 crash-loop). This
    # fork autonegotiates the API version and keeps the WATCHTOWER_* variables
    # and the com.centurylinklabs.watchtower.enable label. App images float on
    # :latest so this nightly sweep can move them; mariadb is pinned.
    service_image: "nickfedor/watchtower:latest"
    # userns_mode: host - the fleet-wide userns-remap maps container root to a
    # subordinate host uid, which cannot open the host-owned docker.sock.
    service_userns_mode: "host"
    service_ports:
      - host: "{{ automation_watchtower_metrics_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "WATCHTOWER_LABEL_ENABLE=true"
      - "WATCHTOWER_SCHEDULE={{ automation_watchtower_schedule }}"
      - "WATCHTOWER_CLEANUP=true"
      # No WATCHTOWER_ROLLING_RESTART: it is a separate update strategy that
      # refuses to run at all when any monitored container has a compose
      # dependency. The default mode already sorts updates by depends_on, so
      # mariadb still restarts before firefly.
      - "WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}"
      # WATCHTOWER_NOTIFICATION_TITLE is not a real Watchtower option (silently
      # ignored) - WATCHTOWER_NOTIFICATIONS_HOSTNAME is the documented flag for
      # this, and gives the plain hostname as the title with no extra text.
      - "WATCHTOWER_NOTIFICATIONS_HOSTNAME={{ inventory_hostname }}"
      - "WATCHTOWER_NO_STARTUP_MESSAGE=true"
      # WATCHTOWER_HTTP_API_ENDPOINTS supersedes the deprecated per-endpoint
      # booleans. health is open (no token) for a plain liveness check;
      # metrics/update require the token below either way.
      - "WATCHTOWER_HTTP_API_ENDPOINTS=health,metrics,update"
      - "WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}"
    service_volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 256M
        cpus: "0.5"
      reservations:
        memory: 128M
        cpus: "0.1"

  - service_name: calibre-web-automated
    service_image: "crocodilestick/calibre-web-automated:latest"
    service_ports:
      - host: "{{ automation_calibre_port }}"
        container: 8083
        bind_ip: "{{ primary_ip }}"
    service_environment:
      # Stack user owns the library files - CWA must not run as root (its docs
      # warn root-owned library files break ingestion/transfer). The uid/gid
      # are resolved via getent in stack.yml from the inventory's ansible_user.
      - "PUID={{ automation_stack_uid }}"
      - "PGID={{ automation_stack_gid }}"
      - "TZ={{ timezone }}"
      # Data lives on the local data path - NETWORK_SHARE_MODE (disables WAL,
      # switches to polling watchers) is only for NFS/SMB libraries.
      - "NETWORK_SHARE_MODE=false"
      # Optional Hardcover metadata-provider key - empty until
      # vault_hardcover_token is set in vault (value lives in the 0600 .env).
      - "HARDCOVER_TOKEN=${HARDCOVER_TOKEN}"
    service_volumes:
      # Three SEPARATE directories - CWA errors when binds are nested in binds.
      - "{{ automation_data_path }}/calibre/config:/config"
      # DESTRUCTIVE by design: files dropped here are deleted after ingest.
      - "{{ automation_data_path }}/calibre/ingest:/cwa-book-ingest"
      - "{{ automation_data_path }}/calibre/library:/calibre-library"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 1G
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

# No named volumes - every service volume is a bind mount onto the data path
# (automation_data_path; the SSD when the optional drive is present).
automation_compose_volumes: []
