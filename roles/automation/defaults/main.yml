---
# Automation stack: vaultwarden, firefly (+ mariadb, cron sidecar), watchtower.

# Derived from the inventory's ansible_user, the control user that owns the stack
# (as common_syncthing_home, stack_user and compose_owner do). Do NOT use the
# ansible_user_dir / ansible_user_id FACTS here: under become:true they reflect
# root and resolve to /root. Host_vars may override to pin a dedicated account.
automation_stack_home: "/home/{{ ansible_user }}/stack"
automation_backup_owner: "{{ ansible_user }}"

automation_specific_packages:
  - ncdu
  - tree
  - sqlite3

automation_vaultwarden_port: 8081
automation_firefly_port: 8082
automation_calibre_port: 8083
automation_watchtower_metrics_port: 8084

automation_subdomain_vaultwarden: "vault"
automation_subdomain_firefly: "firefly"

# Request source allow-list for Firefly's TRUSTED_PROXIES - host-defined and
# scoped to the tailnet/LAN.
# automation_trusted_proxies: REQUIRED in host_vars - no default.

# Optional stack SSD: the stack data path, journald and Docker's data-root ride
# a dedicated drive when one is present, and the stack simply on the SD card
# when there is none.
automation_ssd_format: false # DESTRUCTIVE if true - wipes the detected drive
automation_ssd_filesystem: "ext4"
automation_ssd_mount_options: "defaults,noatime,errors=remount-ro"
automation_ssd_journald_enabled: true

# Watchtower: opt-in per container via labels, nightly sweep. Application images
# float on :latest; mariadb is pinned.
automation_watchtower_schedule: "0 0 2 * * *"

# Secondary local backup replicated by Syncthing; primary/off-site is restic.
# automation_backup_dir / automation_backup_owner are set in host_vars.
automation_backup_enabled: false
automation_backup_retention: 14
# Finishes before restic timer - MariaDB is paused during restic backup, so exec
# fails until the unpause.
automation_backup_schedule_hour: "02"
automation_backup_schedule_minute: "30"

# Live Calibre tree shared to other devices through its Syncthing folder, pointed
# at the live tree.
automation_syncthing_calibre_ignore:
  - "// Derived / instance-local / transient - never exported. The databases"
  - "// come from backup/<stamp>/calibre-databases (snapshots) instead:"
  - "// a .db is only valid alongside its exact -wal, and a file sync ships"
  - "// the two independently."
  - "(?d)ingest"
  - "(?d)thumbnails"
  - "(?d)processed_books"
  - "(?d)log_archive"
  - "*.log"
  - "(?d)*.db"
  - "(?d)*-wal"
  - "(?d)*-shm"
  - "// Runtime ingest state; the ingest service recreates these on start."
  - "(?d)cwa_ingest_status"
  - "(?d)cwa_ingest_retry_queue"
  - "(?d)cwa_ingest_batch_dirty"

# --- Generated compose profile -----

automation_compose_networks:
  - name: stack
    compose_name: stack
    driver: bridge

automation_compose_services:
  - service_name: vaultwarden
    service_image: "vaultwarden/server:latest"
    service_ports:
      - host: "{{ automation_vaultwarden_port }}"
        container: 80
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "DOMAIN=https://{{ automation_subdomain_vaultwarden }}.{{ domain_name }}"
      - "SIGNUPS_ALLOWED=false"
      - "INVITATIONS_ALLOWED=false"
      - "SHOW_PASSWORD_HINT=false"
      - "ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/vaultwarden:/data"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: firefly
    service_image: "fireflyiii/core:latest"
    service_ports:
      - host: "{{ automation_firefly_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "APP_URL=https://{{ automation_subdomain_firefly }}.{{ domain_name }}"
      - "APP_ENV=production"
      - "APP_KEY=${FIREFLY_APP_KEY}"
      - "STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN}"
      - "TRUSTED_PROXIES={{ automation_trusted_proxies }}"
      - "TZ={{ timezone }}"
      - "DB_CONNECTION=mysql"
      - "DB_HOST=mariadb"
      - "DB_PORT=3306"
      - "DB_DATABASE=firefly"
      - "DB_USERNAME=firefly"
      - "DB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/firefly/upload:/var/www/html/storage/upload"
    service_networks:
      - stack
    service_depends_on:
      - service: mariadb
        condition: service_healthy
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "3.0"
      reservations:
        memory: 256M
        cpus: "1.0"

  - service_name: firefly-cron
    service_image: "alpine:3.20"
    service_command:
      - "sh"
      - "-c"
      - >-
        wget -q -O /dev/null "http://firefly:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN}" && sleep 60s
    service_depends_on:
      - service: firefly
        condition: service_healthy
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 64M
        cpus: "0.1"
      reservations:
        memory: 32M
        cpus: "0.05"

  - service_name: mariadb
    service_image: "mariadb:11.8.9"
    # Longer grace period + wipe tc.log
    service_stop_grace_period: "60s"
    # command: explicit - compose does not fall back to the image default CMD.
    service_entrypoint:
      - "/usr/local/bin/mariadb-safe-entrypoint.sh"
    service_command:
      - "mariadbd"
    service_healthcheck:
      test:
        - "CMD"
        - "healthcheck.sh"
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    service_environment:
      - "MARIADB_RANDOM_ROOT_PASSWORD=1"
      - "MARIADB_DATABASE=firefly"
      - "MARIADB_USER=firefly"
      - "MARIADB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/mariadb:/var/lib/mysql"
      - "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh:/usr/local/bin/mariadb-safe-entrypoint.sh:ro"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 768M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: watchtower
    service_image: "nickfedor/watchtower:latest"
    service_userns_mode: "host"
    service_ports:
      - host: "{{ automation_watchtower_metrics_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "WATCHTOWER_LABEL_ENABLE=true"
      - "WATCHTOWER_SCHEDULE={{ automation_watchtower_schedule }}"
      - "WATCHTOWER_CLEANUP=true"
      - "WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}"
      - "WATCHTOWER_NOTIFICATIONS_HOSTNAME={{ inventory_hostname }}"
      - "WATCHTOWER_NO_STARTUP_MESSAGE=true"
      - "WATCHTOWER_HTTP_API_ENDPOINTS=health,metrics"
      - "WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}"
    service_volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 256M
        cpus: "0.5"
      reservations:
        memory: 128M
        cpus: "0.1"

  - service_name: calibre-web-automated
    service_image: "crocodilestick/calibre-web-automated:latest"
    service_ports:
      - host: "{{ automation_calibre_port }}"
        container: 8083
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "PUID={{ automation_stack_uid }}"
      - "PGID={{ automation_stack_gid }}"
      - "TZ={{ timezone }}"
      - "NETWORK_SHARE_MODE=false"
      - "HARDCOVER_TOKEN=${HARDCOVER_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/calibre/config:/config"
      # Destructive: files dropped here are deleted after ingest.
      - "{{ automation_data_path }}/calibre/ingest:/cwa-book-ingest"
      - "{{ automation_data_path }}/calibre/library:/calibre-library"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 1.5G
        cpus: "1.5"
      reservations:
        memory: 512M
        cpus: "0.5"

# No named volumes - every service volume is a bind mount onto the data path
# (automation_data_path; the SSD when the optional drive is present).
automation_compose_volumes: []
