---
# The application images float on :latest and carry the watchtower label, while mariadb and the firefly-cron sidecar
# are pinned.

# These paths derive from the inventory's ansible_user, which owns the stack.
# The ansible_user_dir and ansible_user_id facts must not be used, because under become they resolve to root.
# A host_vars override can pin a dedicated account.
automation_stack_home: "/home/{{ ansible_user }}/stack"
automation_backup_owner: "{{ ansible_user }}"

automation_specific_packages:
  - ncdu
  - tree
  - sqlite3

automation_vaultwarden_port: 8081
automation_firefly_port: 8082
automation_calibre_port: 8083

automation_subdomain_vaultwarden: "vaultwarden"
automation_subdomain_firefly: "firefly"

# automation_trusted_proxies is Firefly's TRUSTED_PROXIES allow-list of request sources.
# It has no default and must be set in host_vars, scoped to the tailnet or LAN.

# The optional stack SSD holds the stack data path, journald and the Docker data-root when a dedicated drive is present.
# Without a drive everything stays on the SD card.
automation_ssd_format: false # True lets the role wipe the detected drive.
automation_ssd_filesystem: "ext4"
automation_ssd_mount_options: "defaults,noatime,errors=remount-ro"
automation_ssd_journald_enabled: true

# This local backup is replicated by Syncthing, while restic provides the off-site copy.
# The host_vars files set automation_backup_dir, and automation_backup_owner defaults to the stack user.
automation_backup_enabled: false
automation_backup_retention: 14
# The snapshot must finish before the schedule in automation_restic_job, which ships these dumps and fails when none
# is fresh.
automation_backup_schedule_hour: "02"
automation_backup_schedule_minute: "30"

# This is the off-site job handed to roles/restic.
# The host_vars files supply automation_restic_repository and automation_restic_password.
automation_restic_job:
  name: automation
  repository: "{{ automation_restic_repository }}"
  password: "{{ automation_restic_password }}"
  schedule: "*-*-* 03:00:00"
  timeout: 90min
  memory_max_mib: 1024
  retention: { daily: 14, weekly: 8, monthly: 12, yearly: 3 }
  sources:
    - "{{ automation_stack_home }}"
    - "{{ automation_data_path }}"
  # The dump directory's mtime changes only when a finished dump is moved in, so it measures the newest complete dump.
  fresh:
    - { path: "{{ automation_backup_dir }}", max_age_hours: 12 }
  excludes:
    - "*.log"
    - "tmp/*"
    - "cache/*"
    - "{{ automation_data_path }}/docker"
    - "{{ automation_data_path }}/backup-tmp"
    # A dump still being built is moved into automation_backup_dir only when it is complete.
    - "{{ automation_backup_dir | dirname }}/.automation-backup.*"

# These Syncthing ignore patterns apply to the live Calibre tree that the calibre folder shares.
automation_syncthing_calibre_ignore:
  - "// Derived / instance-local / transient - never exported. The databases"
  - "// come from backup/<stamp>/calibre-databases (snapshots) instead:"
  - "// a .db is only valid alongside its exact -wal, and a file sync ships"
  - "// the two independently."
  - "(?d)ingest"
  - "(?d)thumbnails"
  - "(?d)processed_books"
  - "(?d)log_archive"
  - "*.log"
  - "(?d)*.db"
  - "(?d)*-wal"
  - "(?d)*-shm"
  - "// Runtime ingest state; the ingest service recreates these on start."
  - "(?d)cwa_ingest_status"
  - "(?d)cwa_ingest_retry_queue"
  - "(?d)cwa_ingest_batch_dirty"

# --- Generated compose profile -----

automation_compose_networks:
  - name: stack
    compose_name: stack
    driver: bridge

automation_compose_services:
  - service_name: vaultwarden
    service_image: "vaultwarden/server:latest"
    service_ports:
      - host: "{{ automation_vaultwarden_port }}"
        container: 80
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "DOMAIN=https://{{ automation_subdomain_vaultwarden }}.{{ domain_name }}"
      - "SIGNUPS_ALLOWED=false"
      - "INVITATIONS_ALLOWED=false"
      - "SHOW_PASSWORD_HINT=false"
      - "ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/vaultwarden:/data"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: firefly
    service_image: "fireflyiii/core:latest"
    service_ports:
      - host: "{{ automation_firefly_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "APP_URL=https://{{ automation_subdomain_firefly }}.{{ domain_name }}"
      - "APP_ENV=production"
      - "APP_KEY=${FIREFLY_APP_KEY}"
      - "STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN}"
      - "TRUSTED_PROXIES={{ automation_trusted_proxies }}"
      - "TZ={{ timezone }}"
      - "DB_CONNECTION=mysql"
      - "DB_HOST=mariadb"
      - "DB_PORT=3306"
      - "DB_DATABASE=firefly"
      - "DB_USERNAME=firefly"
      - "DB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/firefly/upload:/var/www/html/storage/upload"
    service_networks:
      - stack
    service_depends_on:
      - service: mariadb
        condition: service_healthy
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "3.0"
      reservations:
        memory: 256M
        cpus: "1.0"

  - service_name: firefly-cron
    service_image: "alpine:3.20"
    service_command:
      - "sh"
      - "-c"
      - >-
        wget -q -O /dev/null "http://firefly:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN}" && sleep 60s
    service_depends_on:
      - service: firefly
        condition: service_healthy
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 64M
        cpus: "0.1"
      reservations:
        memory: 32M
        cpus: "0.05"

  - service_name: mariadb
    service_image: "mariadb:11.8.9"
    # The longer stop grace period gives mariadb time to shut down, and the wrapper entrypoint removes tc.log.
    service_stop_grace_period: "60s"
    # The command is explicit because compose does not fall back to the image default CMD once the entrypoint is
    # overridden.
    service_entrypoint:
      - "/usr/local/bin/mariadb-safe-entrypoint.sh"
    service_command:
      - "mariadbd"
    service_healthcheck:
      test:
        - "CMD"
        - "healthcheck.sh"
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    service_environment:
      - "MARIADB_RANDOM_ROOT_PASSWORD=1"
      - "MARIADB_DATABASE=firefly"
      - "MARIADB_USER=firefly"
      - "MARIADB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/mariadb:/var/lib/mysql"
      - "{{ automation_stack_home }}/scripts/mariadb-safe-entrypoint.sh:/usr/local/bin/mariadb-safe-entrypoint.sh:ro"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 768M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: calibre-web-automated
    service_image: "crocodilestick/calibre-web-automated:latest"
    service_ports:
      - host: "{{ automation_calibre_port }}"
        container: 8083
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "PUID={{ common_stack_uid }}"
      - "PGID={{ common_stack_gid }}"
      - "TZ={{ timezone }}"
      - "NETWORK_SHARE_MODE=false"
      - "HARDCOVER_TOKEN=${HARDCOVER_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/calibre/config:/config"
      # Files dropped into this directory are deleted after ingest.
      - "{{ automation_data_path }}/calibre/ingest:/cwa-book-ingest"
      - "{{ automation_data_path }}/calibre/library:/calibre-library"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 1.5G
        cpus: "1.5"
      reservations:
        memory: 512M
        cpus: "0.5"

# The stack declares no named volumes because every service volume is a bind mount under automation_data_path.
automation_compose_volumes: []
