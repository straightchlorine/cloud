---
# Automation stack: vaultwarden, firefly (+mariadb, cron sidecar), watchtower.
# TLS terminates at the central reverse proxy (moving onto the Kubernetes
# cluster on a separate node); these services publish plain HTTP bound to
# primary_ip, reached over the tailnet. Secrets never appear here - the
# compose file refers to ${VAR} and is interpolated from the generated .env
# (0600) at deploy time.

automation_specific_packages:
  - ncdu
  - tree
  - sqlite3  # automation-syncthing-backup.sh snapshots vaultwarden's db with VACUUM INTO

# Host-facing ports for the two tailnet-reachable services (the central
# reverse proxy fronts these). Watchtower's metrics API stays localhost-only.
automation_vaultwarden_port: 8081
automation_firefly_port: 8082
automation_watchtower_metrics_port: 8084

# Subdomains used in service URLs and by the reverse proxy.
automation_subdomain_vaultwarden: "vault"
automation_subdomain_firefly: "firefly"

# Request source allow-list for Firefly's TRUSTED_PROXIES - host-defined and
# scoped to the tailnet/LAN, never '**'.
# automation_trusted_proxies: REQUIRED in host_vars - no default.

# Watchtower update policy: opt-in per container via labels, nightly
# sweep, notification through vault's ntfy topic. No default tag pins for
# application images (floating latest is the documented exception); mariadb
# is pinned and has no watchtower label (DB upgrades are manual).
automation_watchtower_schedule: "0 2 * * *"

# Secondary local backup replicated by Syncthing; primary/off-site is
# restic (unchanged). automation_backup_dir / automation_backup_owner are
# host_vars when enabled.
automation_backup_enabled: false
automation_backup_retention: 14
automation_backup_schedule_hour: "03"
automation_backup_schedule_minute: "45"

# --- Generated compose profile (secretless; env values come from .env) -----

automation_compose_networks:
  - name: automation-stack
    compose_name: automation-stack
    driver: bridge

automation_compose_services:
  - service_name: vaultwarden
    service_image: "vaultwarden/server:latest"
    service_ports:
      - host: "{{ automation_vaultwarden_port }}"
        container: 80
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "DOMAIN=https://{{ automation_subdomain_vaultwarden }}.{{ domain_name }}"
      - "SIGNUPS_ALLOWED=false"
      - "INVITATIONS_ALLOWED=false"
      - "SHOW_PASSWORD_HINT=false"
      - "ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/vaultwarden:/data"
    service_networks:
      - automation-stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: firefly
    service_image: "fireflyiii/core:latest"
    service_ports:
      - host: "{{ automation_firefly_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "APP_URL=https://{{ automation_subdomain_firefly }}.{{ domain_name }}"
      - "APP_ENV=production"
      - "APP_KEY=${FIREFLY_APP_KEY}"
      - "STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN}"
      - "TRUSTED_PROXIES={{ automation_trusted_proxies }}"
      - "TZ={{ timezone }}"
      - "DB_CONNECTION=mysql"
      - "DB_HOST=mariadb"
      - "DB_PORT=3306"
      - "DB_DATABASE=firefly"
      - "DB_USERNAME=firefly"
      - "DB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/firefly/upload:/var/www/html/storage/upload"
    service_networks:
      - automation-stack
    service_depends_on:
      - service: mariadb
        condition: service_healthy
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: firefly-cron
    service_image: "alpine:3.20"
    service_command:
      - "sh"
      - "-c"
      - >-
        wget -q -O /dev/null
        "http://firefly:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN}"
        && sleep 60s
    service_depends_on:
      - service: firefly
        condition: service_started
    service_networks:
      - automation-stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 64M
        cpus: "0.1"
      reservations:
        memory: 32M
        cpus: "0.05"

  - service_name: mariadb
    service_image: "mariadb:11.4"
    service_healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    service_environment:
      - "MARIADB_DATABASE=firefly"
      - "MARIADB_USER=firefly"
      - "MARIADB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/mariadb:/var/lib/mysql"
    service_networks:
      - automation-stack
    service_resources:
      limits:
        memory: 768M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: watchtower
    service_image: "containrrr/watchtower:latest"
    service_ports:
      - host: "{{ automation_watchtower_metrics_port }}"
        container: 8080
        bind_ip: "127.0.0.1"
    service_environment:
      - "WATCHTOWER_LABEL_ENABLE=true"
      - "WATCHTOWER_SCHEDULE={{ automation_watchtower_schedule }}"
      - "WATCHTOWER_CLEANUP=true"
      - "WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}"
      - "WATCHTOWER_NOTIFICATION_TITLE=watchtower: {{ inventory_hostname }}"
      - "WATCHTOWER_HTTP_API_METRICS=true"
      - "WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}"
      - "WATCHTOWER_HTTP_API_UPDATE=true"
    service_volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    service_networks:
      - automation-stack
    service_resources:
      limits:
        memory: 256M
        cpus: "0.5"
      reservations:
        memory: 128M
        cpus: "0.1"

# No named volumes - every service volume is a bind mount onto the SSD
# (automation_data_path).
automation_compose_volumes: []
