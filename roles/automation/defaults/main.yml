---
# Automation stack: vaultwarden, firefly (+mariadb, cron sidecar), watchtower.
# TLS terminates at the central reverse proxy (moving onto the Kubernetes
# cluster on a separate node); these services publish plain HTTP bound to
# primary_ip, reached over the tailnet. Secrets never appear here - the
# compose file refers to ${VAR} and is interpolated from the generated .env
# (0600) at deploy time.

# Deployment identity derives from the inventory's ansible_user - the control
# user that owns the stack (the same user common_syncthing_home, stack_user and
# compose_owner all use). Do NOT use the ansible_user_dir / ansible_user_id
# FACTS here: plays run with become:true, so those reflect the BECOME user
# (root) and resolve to /root, not the stack owner's home. Set the SSH/stack
# user once in hosts.yml and both values follow it:
#   pi-automation  (ansible_user=automation) -> /home/automation/stack
#   pi-test-automation (ansible_user=ansible) -> /home/ansible/stack
# Host_vars may still override these to pin a dedicated stack account.
automation_stack_home: "/home/{{ ansible_user }}/stack"
automation_backup_owner: "{{ ansible_user }}"

automation_specific_packages:
  - ncdu
  - tree
  - sqlite3  # automation-syncthing-backup.sh snapshots vaultwarden's db with VACUUM INTO

# Host-facing ports for the tailnet-reachable services (the central reverse
# proxy fronts these). Watchtower's metrics API stays localhost-only.
automation_vaultwarden_port: 8081
automation_firefly_port: 8082
automation_calibre_port: 8083
automation_watchtower_metrics_port: 8084

# Subdomains used in service URLs and by the reverse proxy.
automation_subdomain_vaultwarden: "vault"
automation_subdomain_firefly: "firefly"

# Request source allow-list for Firefly's TRUSTED_PROXIES - host-defined and
# scoped to the tailnet/LAN, never '**'.
# automation_trusted_proxies: REQUIRED in host_vars - no default.

# Optional stack SSD, mirroring the dns role's optional-drive pattern. Stack
# data (the bind mounts under automation_data_path), journald and Docker's
# data-root ride a dedicated drive when one is present - auto-detected, or
# already mounted at automation_data_path from a prior deploy - and with no
# drive the stack simply runs on the SD card. Wiping a drive is opt-in per
# host and DESTRUCTIVE:
automation_ssd_format: false  # DESTRUCTIVE if true - wipes the detected drive
automation_ssd_filesystem: "ext4"
automation_ssd_mount_options: "defaults,noatime,errors=remount-ro"
automation_ssd_journald_enabled: true

# Watchtower update policy: opt-in per container via labels, nightly
# sweep, notification through vault's ntfy topic. No default tag pins for
# application images (floating latest is the documented exception); mariadb
# is pinned and has no watchtower label (DB upgrades are manual).
automation_watchtower_schedule: "0 2 * * *"

# Secondary local backup replicated by Syncthing; primary/off-site is
# restic (unchanged). automation_backup_dir / automation_backup_owner are
# host_vars when enabled.
automation_backup_enabled: false
automation_backup_retention: 14
automation_backup_schedule_hour: "03"
automation_backup_schedule_minute: "45"

# --- Generated compose profile (secretless; env values come from .env) -----

automation_compose_networks:
  - name: stack
    compose_name: stack
    driver: bridge

automation_compose_services:
  - service_name: vaultwarden
    service_image: "vaultwarden/server:latest"
    service_ports:
      - host: "{{ automation_vaultwarden_port }}"
        container: 80
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "DOMAIN=https://{{ automation_subdomain_vaultwarden }}.{{ domain_name }}"
      - "SIGNUPS_ALLOWED=false"
      - "INVITATIONS_ALLOWED=false"
      - "SHOW_PASSWORD_HINT=false"
      - "ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}"
    service_volumes:
      - "{{ automation_data_path }}/vaultwarden:/data"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: firefly
    service_image: "fireflyiii/core:latest"
    service_ports:
      - host: "{{ automation_firefly_port }}"
        container: 8080
        bind_ip: "{{ primary_ip }}"
    service_environment:
      - "APP_URL=https://{{ automation_subdomain_firefly }}.{{ domain_name }}"
      - "APP_ENV=production"
      - "APP_KEY=${FIREFLY_APP_KEY}"
      - "STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN}"
      - "TRUSTED_PROXIES={{ automation_trusted_proxies }}"
      - "TZ={{ timezone }}"
      - "DB_CONNECTION=mysql"
      - "DB_HOST=mariadb"
      - "DB_PORT=3306"
      - "DB_DATABASE=firefly"
      - "DB_USERNAME=firefly"
      - "DB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/firefly/upload:/var/www/html/storage/upload"
    service_networks:
      - stack
    service_depends_on:
      - service: mariadb
        condition: service_healthy
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 512M
        cpus: "3.0"
      reservations:
        memory: 256M
        cpus: "1.0"

  - service_name: firefly-cron
    service_image: "alpine:3.20"
    service_command:
      - "sh"
      - "-c"
      - >-
        wget -q -O /dev/null
        "http://firefly:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN}"
        && sleep 60s
    service_depends_on:
      # service_healthy (not just service_started): firefly's own image
      # healthcheck only passes once migrations finish, and the cron
      # endpoint 404s/500s until then - service_started let this sidecar
      # hammer it and restart-loop through Firefly's whole boot.
      - service: firefly
        condition: service_healthy
    service_networks:
      - stack
    # No watchtower.enable label: this sidecar has a service_healthy
    # depends_on above, and watchtower's rolling-restart mode refuses to
    # run at all (for every monitored container on the host, not just this
    # one) if any managed container has a compose dependency. Pinned to
    # alpine:3.20, so watchtower has nothing to update here anyway.
    service_resources:
      limits:
        memory: 64M
        cpus: "0.1"
      reservations:
        memory: 32M
        cpus: "0.05"

  - service_name: mariadb
    # Newest stable 11.8.x patch as of this pin. Matters for the migration
    # onto pi-automation: the production data directory being copied in was
    # last written by 11.8.5, and MariaDB only upgrades a data directory
    # forward within the same major.minor series, never back - this must
    # stay >= 11.8.5 (a same-series bump like this is a routine, safe
    # forward upgrade; jumping to a new major series would not be).
    service_image: "mariadb:11.8.9"
    service_healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    service_environment:
      # The entrypoint refuses to initialize an EMPTY datadir without a root
      # password policy, and exits 1 on every fresh deploy (teardown -> redeploy
      # included). Nothing here uses root - the backup dumps via the firefly
      # user, and root@localhost keeps unix_socket auth for `docker exec -it
      # mariadb mariadb` maintenance - so generate a throwaway root password
      # rather than adding an unused vault secret to the .env.
      - "MARIADB_RANDOM_ROOT_PASSWORD=1"
      - "MARIADB_DATABASE=firefly"
      - "MARIADB_USER=firefly"
      - "MARIADB_PASSWORD=${FIREFLY_DB_PASSWORD}"
    service_volumes:
      - "{{ automation_data_path }}/mariadb:/var/lib/mysql"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 768M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

  - service_name: watchtower
    # containrrr/watchtower is archived and pins the Docker client to API
    # 1.25, which Docker Engine >= 26 refuses ("client version 1.25 is too
    # old. Minimum supported API version is 1.40") - the container exit-1
    # crash-loops. nickfedor/watchtower is the actively maintained fork
    # (newest release v1.22.1, 2026-09; the multi-arch :latest tag tracks
    # it exactly) that autonegotiates the Docker API version and keeps the
    # WATCHTOWER_* environment variables and the
    # com.centurylinklabs.watchtower.enable label. Floating :latest (not a
    # version pin) is the documented exception for application images -
    # and watchtower refreshes itself on its nightly sweep anyway.
    service_image: "nickfedor/watchtower:latest"
    # Fleet-wide userns-remap maps container root to a subordinate host uid,
    # not real root - it can't open a bind-mounted /var/run/docker.sock
    # (host-owned root:docker) at all ("permission denied ... trying to
    # connect to the docker API"), breaking Watchtower's actual function
    # entirely. userns_mode: host is the standard, accepted opt-out for
    # docker-socket-consuming tools like this one.
    service_userns_mode: "host"
    service_ports:
      - host: "{{ automation_watchtower_metrics_port }}"
        container: 8080
        bind_ip: "127.0.0.1"
    service_environment:
      - "WATCHTOWER_LABEL_ENABLE=true"
      - "WATCHTOWER_SCHEDULE={{ automation_watchtower_schedule }}"
      - "WATCHTOWER_CLEANUP=true"
      # No WATCHTOWER_ROLLING_RESTART: it unconditionally refuses to run at
      # all if any monitored container has a compose depends_on (firefly ->
      # mariadb here) - it's a separate update strategy, not a variant of
      # dependency-ordered updates. Watchtower's default update mode already
      # topologically sorts by depends_on (WATCHTOWER_USE_COMPOSE_DEPENDS_ON,
      # true by default) so mariadb still restarts before firefly.
      - "WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}"
      # WATCHTOWER_NOTIFICATION_TITLE is not a real Watchtower option (silently
      # ignored) - WATCHTOWER_NOTIFICATIONS_HOSTNAME is the documented flag for
      # this, and gives the plain hostname as the title with no extra text.
      - "WATCHTOWER_NOTIFICATIONS_HOSTNAME={{ inventory_hostname }}"
      - "WATCHTOWER_NO_STARTUP_MESSAGE=true"
      # WATCHTOWER_HTTP_API_METRICS/_UPDATE (the old per-endpoint booleans)
      # are deprecated and slated for removal in Watchtower v2 - this stack
      # tracks :latest, so a future major bump would silently drop them.
      # HTTP_API_ENDPOINTS is the current replacement. health is open (no
      # token) for a plain liveness check; metrics/update require the token
      # below either way.
      - "WATCHTOWER_HTTP_API_ENDPOINTS=health,metrics,update"
      - "WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}"
    service_volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    service_networks:
      - stack
    service_resources:
      limits:
        memory: 256M
        cpus: "0.5"
      reservations:
        memory: 128M
        cpus: "0.1"

  - service_name: calibre-web-automated
    service_image: "crocodilestick/calibre-web-automated:latest"
    service_ports:
      - host: "{{ automation_calibre_port }}"
        container: 8083
        bind_ip: "{{ primary_ip }}"
    service_environment:
      # Stack user owns the library files - CWA must not run as root (its docs
      # warn root-owned library files break ingestion/transfer). The uid/gid
      # are resolved via getent in stack.yml from the inventory's ansible_user.
      - "PUID={{ automation_stack_uid }}"
      - "PGID={{ automation_stack_gid }}"
      - "TZ={{ timezone }}"
      # Data lives on the local data path - NETWORK_SHARE_MODE (disables WAL,
      # switches to polling watchers) is only for NFS/SMB libraries.
      - "NETWORK_SHARE_MODE=false"
      # Optional Hardcover metadata-provider key - empty until
      # vault_hardcover_token is set in vault (value lives in the 0600 .env).
      - "HARDCOVER_TOKEN=${HARDCOVER_TOKEN}"
    service_volumes:
      # Three SEPARATE directories - CWA errors when binds are nested in binds.
      - "{{ automation_data_path }}/calibre/config:/config"
      # DESTRUCTIVE by design: files dropped here are deleted after ingest.
      - "{{ automation_data_path }}/calibre/ingest:/cwa-book-ingest"
      - "{{ automation_data_path }}/calibre/library:/calibre-library"
    service_networks:
      - stack
    service_labels:
      - "com.centurylinklabs.watchtower.enable=true"
    service_resources:
      limits:
        memory: 1G
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

# No named volumes - every service volume is a bind mount onto the data path
# (automation_data_path; the SSD when the optional drive is present).
automation_compose_volumes: []
