---
- name: Converge restic fail-fast-validation
  hosts: all
  become: true
  vars_files: [../shared/vars.yml, cases.yml]
  tasks:
    - name: Run each case
      ansible.builtin.include_tasks: case.yml
      vars:
        molecule_case: "{{ molecule_case_defaults | combine(molecule_item) }}"
      loop: "{{ molecule_cases }}"
      loop_control:
        loop_var: molecule_item
        label: "case {{ molecule_item.id }}"
