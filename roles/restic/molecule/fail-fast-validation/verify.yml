---
- name: Verify restic fail-fast validation
  hosts: all
  become: true
  tasks:
    - name: Stat the per-case markers converge wrote
      ansible.builtin.stat:
        path: "/tmp/molecule-restic-case{{ item }}.passed"
      loop: "{{ range(1, 68) | list }}"
      register: molecule_markers

    - name: Assert all 67 cases failed for their own reason
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "case {{ item.item }} did not fail as expected - see converge output"
      loop: "{{ molecule_markers.results }}"
      loop_control:
        label: "case {{ item.item }}"
