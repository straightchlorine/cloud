---
- name: Prepare restic cron
  hosts: all
  become: true
  tasks:
    - name: Install cron for the scheduler and NetworkManager for its real nmcli binary
      # The container has no NetworkManager daemon: nmcli then answers "not running", which is the real
      # unreachable case the gate must skip on.
      ansible.builtin.apt:
        name: [cron, network-manager]
        update_cache: true

    - name: Create the shared source tree
      ansible.builtin.include_tasks: ../shared/prepare_sources.yml

    - name: Install the deploy-time notice stub
      ansible.builtin.include_tasks: ../shared/notice_stub.yml
