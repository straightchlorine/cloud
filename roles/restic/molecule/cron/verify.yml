---
- name: Verify restic cron
  hosts: all
  become: true
  vars_files: [../shared/vars.yml, ../shared/gate_cases_nmcli.yml]
  tasks:
    - name: Check the cron files
      ansible.builtin.include_tasks: verify/01_cron_files.yml
    - name: Check the cron daemon accepts the files
      ansible.builtin.include_tasks: verify/02_daemon_refusals.yml
    - name: Install the verify harness
      ansible.builtin.include_tasks: verify/03_harness.yml
    - name: Run the plain job
      ansible.builtin.include_tasks: verify/04_plain_job.yml
    - name: Run the warning and fallback cases
      ansible.builtin.include_tasks: verify/05_warnings.yml
    - name: Run the sftp job
      ansible.builtin.include_tasks: verify/06_storage_box.yml
    - name: Check the run privileges
      ansible.builtin.include_tasks: verify/07_privileges.yml
    - name: Check the lock skip
      ansible.builtin.include_tasks: verify/08_lock.yml
    - name: Run the failing job and the log rotation
      ansible.builtin.include_tasks: verify/09_failure_rotation.yml
    - name: Run the timeout and hang cases
      ansible.builtin.include_tasks: verify/10_timeout_hang.yml
    - name: Run the gate cases
      ansible.builtin.include_tasks: verify/11_gate.yml
    - name: Run the freshness check
      ansible.builtin.include_tasks: verify/12_freshness.yml
    - name: Tear down the cron host
      ansible.builtin.include_tasks: verify/13_teardown.yml
