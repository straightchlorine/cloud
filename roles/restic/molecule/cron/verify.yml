---
- name: Verify - the cron scheduler, run for real
  hosts: all
  become: true
  vars:
    molecule_stubs: /usr/local/lib/molecule-stubs
    molecule_path: /usr/local/lib/molecule-stubs:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    molecule_wrapper: /usr/local/libexec/restic/restic-job
    # Each case is the terse output nmcli would give: active connections as NAME:TYPE, then device blocks.
    molecule_nmcli_cases:
      - id: metered-device
        rc: 1
        text: "skipped: link of 'Home' is metered"
        conns: ["Home:802-3-ethernet"]
        devs: ["GENERAL.METERED:yes", "GENERAL.CONNECTION:Home", ""]
      - id: guessed-metered
        rc: 1
        text: "skipped: link of 'Hotspot' is metered"
        conns: ["Hotspot:802-11-wireless"]
        devs: ["GENERAL.METERED:yes (guessed)", "GENERAL.CONNECTION:Hotspot", ""]
      - id: fields-in-the-other-order
        rc: 1
        text: "skipped: link of 'Hotspot' is metered"
        conns: ["Hotspot:802-11-wireless"]
        devs: ["GENERAL.CONNECTION:Hotspot", "GENERAL.METERED:yes", ""]
      - id: listed-name-with-unicode-quote-and-backslash
        rc: 1
        text: 'skipped: connection ''Ünï "q" back\slash'' is listed as metered'
        conns: ['Ünï "q" back\slash:802-11-wireless']
        devs: ["GENERAL.METERED:no", "GENERAL.CONNECTION:x", ""]
      - id: listed-name-with-a-colon
        rc: 1
        text: "skipped: connection 'Lab: Guest' is listed as metered"
        conns: ["Home:802-3-ethernet", "Lab: Guest:802-11-wireless"]
        devs: ["GENERAL.METERED:no", "GENERAL.CONNECTION:Home", ""]
      - id: only-a-docker-bridge
        rc: 1
        text: "skipped: no active network connection"
        conns: ["docker0:bridge", "veth1234:veth", "tun0:tun"]
        devs: ["GENERAL.METERED:no", "GENERAL.CONNECTION:docker0", ""]
      - id: bridge-with-an-enslaved-uplink
        rc: 0
        text: ""
        conns: ["br0:bridge", "bridge-slave-enp6s0:802-3-ethernet"]
        devs:
          - "GENERAL.METERED:no (guessed)"
          - "GENERAL.CONNECTION:br0"
          - ""
          - "GENERAL.METERED:no"
          - "GENERAL.CONNECTION:bridge-slave-enp6s0"
          - ""
      - id: metered-device-behind-a-bridge-is-ignored-but-the-uplink-counts
        rc: 1
        text: "skipped: link of 'Phone' is metered"
        conns: ["docker0:bridge", "Phone:802-11-wireless"]
        devs:
          - "GENERAL.METERED:yes"
          - "GENERAL.CONNECTION:docker0"
          - ""
          - "GENERAL.METERED:yes"
          - "GENERAL.CONNECTION:Phone"
          - ""
      - id: only-loopback
        rc: 1
        text: "skipped: no active network connection"
        conns: ["lo:loopback"]
        devs: ["GENERAL.METERED:no", "GENERAL.CONNECTION:lo", ""]
      - id: metered-device-without-a-connection
        rc: 0
        text: ""
        conns: ["Home:802-3-ethernet"]
        devs:
          - "GENERAL.METERED:yes"
          - "GENERAL.CONNECTION:--"
          - ""
          - "GENERAL.METERED:no (guessed)"
          - "GENERAL.CONNECTION:Home"
          - ""
      - id: second-device-metered
        rc: 1
        text: "skipped: link of 'Hotspot' is metered"
        conns: ["Home:802-3-ethernet", "Hotspot:802-11-wireless"]
        devs:
          - "GENERAL.METERED:no"
          - "GENERAL.CONNECTION:Home"
          - ""
          - "GENERAL.METERED:yes (guessed)"
          - "GENERAL.CONNECTION:Hotspot"
          - ""
      - id: all-unmetered
        rc: 0
        text: ""
        conns: ["Home:802-3-ethernet"]
        devs: ["GENERAL.METERED:unknown", "GENERAL.CONNECTION:Home", ""]
  tasks:
    - name: Stat the cron files, the directories and the units that must not exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/cron.d/restic-cr
        - /etc/cron.d/restic-crgate
        - /etc/cron.d/restic-freshness
        - /var/log/restic
        - /var/cache/restic
        - /var/cache/restic/tmp
        - /etc/systemd/system/restic-job@.service
        - /etc/systemd/system/restic-freshness.timer
        - /etc/systemd/system/restic-job@cr.timer.d
      register: molecule_files

    - name: Read the cron files and the env files
      ansible.builtin.command: "cat {{ item }}"
      loop:
        - /etc/cron.d/restic-cr
        - /etc/cron.d/restic-crgate
        - /etc/cron.d/restic-crbroken
        - /etc/cron.d/restic-crslow
        - /etc/cron.d/restic-freshness
        - /etc/restic/crgate.env
        - /etc/restic/crslow.env
      register: molecule_text
      changed_when: false

    - name: Assert the entries, the directories and the absence of any systemd unit
      vars:
        molecule_st: "{{ molecule_files.results | map(attribute='stat') | list }}"
        molecule_t: "{{ molecule_text.results | map(attribute='stdout') | list }}"
        molecule_cmd: /usr/local/libexec/restic/restic-job
      ansible.builtin.assert:
        that:
          - molecule_st[0].exists and molecule_st[0].mode == '0644' and molecule_st[0].pw_name == 'root'
          - molecule_st[1].exists and molecule_st[2].exists
          - molecule_st[3].isdir and molecule_st[3].mode == '0750' and molecule_st[3].pw_name == 'root'
          - molecule_st[4].isdir and molecule_st[4].mode == '0700' and molecule_st[4].pw_name == 'restic'
          - molecule_st[5].isdir and molecule_st[5].pw_name == 'restic'
          - molecule_st[6:] | selectattr('exists') | list | length == 0
          - >-
            molecule_t[0] is search('(?m)^\*/30 8-18 \* \* 1-5 root ' ~ molecule_cmd
            ~ ' cron cr >>/var/log/restic/cr.log 2>&1$')
          - molecule_t[1] is search('(?m)^17 \* \* \* \* root ' ~ molecule_cmd ~ ' cron crgate ')
          - molecule_t[2] is search('(?m)^0 3 \* \* 0 root ')
          - molecule_t[3] is search('(?m)^5,35 \* 1,15 \* \* root ')
          - molecule_t[4] is search('(?m)^@reboot root sleep 900 && ' ~ molecule_cmd ~ ' freshness >>')
          - molecule_t[4] is search('(?m)^7 \* \* \* \* root ' ~ molecule_cmd ~ ' freshness >>')
          - "'TMPDIR=/var/cache/restic/tmp' in molecule_t[5].splitlines()"
          - "'RESTIC_JOB_SKIP_METERED=1' in molecule_t[5].splitlines()"
          - "'RESTIC_JOB_SKIP_ON_BATTERY=1' in molecule_t[5].splitlines()"
          - "'RESTIC_JOB_TIMEOUT=10m' in molecule_t[5].splitlines()"
          - "'RESTIC_JOB_TIMEOUT=2s' in molecule_t[6].splitlines()"
          - "'GOMEMLIMIT=409MiB' in molecule_t[5].splitlines()"

    # A restart makes the daemon read every file again and log each one it refuses. A deliberately broken file
    # proves the daemon logs such refusals, so the absence of a line for the role's files means something.
    - name: Add a deliberately broken cron file and restart the daemon
      ansible.builtin.shell: |
        printf '99 * * * * root true\n' > /etc/cron.d/restic-bad-probe
        systemctl restart cron
      changed_when: true

    - name: Wait until the daemon has logged the broken file
      ansible.builtin.command: journalctl -u cron -o cat --no-pager
      register: molecule_cron_log
      until: molecule_cron_log.stdout is search('restic-bad-probe')
      retries: 12
      delay: 5
      changed_when: false

    - name: Assert the daemon refused the probe and none of the role's files, and ran the @reboot entry
      vars:
        molecule_refusals: >-
          {{ molecule_cron_log.stdout_lines | select('search', 'restic-(cr|crgate|crbroken|crslow|freshness)\b')
             | reject('search', 'CMD') | list }}
      ansible.builtin.assert:
        that:
          - molecule_refusals == []
          - molecule_cron_log.stdout is search('CMD \(sleep 900 && /usr/local/libexec/restic/restic-job freshness')

    - name: Remove the broken probe file
      ansible.builtin.file:
        path: /etc/cron.d/restic-bad-probe
        state: absent

    - name: Create the stub directory and the fake power and nmcli trees
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: ["{{ molecule_stubs }}", /run/molecule-nmcli, /run/molecule-power, /run/molecule-power/BAT0]

    - name: Install the harness stubs
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      loop:
        - dest: /usr/local/bin/ntfy-notify
          content: |
            #!/bin/sh
            printf '%s|%s\n' "$1" "$3" >> /run/molecule-ntfy.log
            printf '%s\n' "$2" | tr '\n' ' ' >> /run/molecule-ntfy-body.log
            echo >> /run/molecule-ntfy-body.log
        - dest: /usr/local/bin/restic-stub
          content: |
            #!/bin/sh
            case "$STUB_MODE: $* " in
              probe:*" backup "*)
                { grep -E '^(CapEff|CapBnd|CapAmb|NoNewPrivs)' /proc/self/status; id -un; umask
                  echo "lockfds=$(ls -l /proc/$$/fd | grep -c '\.lock')"; } > /var/lib/restic/molecule-probe ;;
              hang:*" backup "*)
                # Ignores SIGINT and leaves a child behind, as a wedged restic with a live ssh would.
                trap '' INT
                sleep 600 ;;
              slow:*" backup "*)
                exec /usr/local/bin/restic backup --stdin-from-command --stdin-filename slow -- sleep 600 ;;
            esac
            exec /usr/local/bin/restic "$@"
        - dest: "{{ molecule_stubs }}/nmcli"
          content: |
            #!/bin/sh
            d=/run/molecule-nmcli
            [ ! -e "$d/rc" ] || { echo "Error: NetworkManager is not running." >&2; exit "$(cat "$d/rc")"; }
            # The arguments are checked, so a changed command line in the engine fails here.
            case "$*" in
              "--terse --escape no --fields NAME,TYPE connection show --active") cat "$d/connections" ;;
              "--terse --escape no --fields GENERAL.METERED,GENERAL.CONNECTION device show") cat "$d/devices" ;;
              *) echo "unexpected nmcli arguments: $*" >&2; exit 2 ;;
            esac

    - name: Put the fake battery on the charger
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - { dest: /run/molecule-power/BAT0/type, content: "Battery\n" }
        - { dest: /run/molecule-power/BAT0/status, content: "Charging\n" }

    # The plain job: a real run through cron's own entry point, as cron would start it.
    - name: Run the plain job through the wrapper
      ansible.builtin.shell: |
        rm -f /run/molecule-ntfy.log
        {{ molecule_wrapper }} cron cr
        echo "rc=$?"
      register: molecule_cr
      changed_when: true

    - name: Read the plain job's snapshots, files, log, notification and stamp
      ansible.builtin.command: "{{ item }}"
      loop:
        - "{{ molecule_wrapper }} exec cr snapshots --json"
        - "{{ molecule_wrapper }} exec cr ls latest"
        - cat /var/log/restic/cr.log
        - cat /run/molecule-ntfy.log
        - stat -c '%U:%G' /var/lib/restic/cr.ok
        - stat -c '%a' /var/log/restic/cr.log
      register: molecule_cr_out
      changed_when: false

    - name: Assert a real, capability-read snapshot, its log, its notification and a stamp the restic user wrote
      vars:
        molecule_o: "{{ molecule_cr_out.results | map(attribute='stdout') | list }}"
      ansible.builtin.assert:
        that:
          - molecule_cr.stdout_lines[-1] == 'rc=0'
          - molecule_o[0] | from_json | length == 1
          - ((molecule_o[0] | from_json) | first).hostname == ansible_nodename
          - "'cr' in ((molecule_o[0] | from_json) | first).tags"
          - "'/srv/molecule-src/private/secret' in molecule_o[1].splitlines()"
          - "'/srv/molecule-src/skip/excluded' not in molecule_o[1].splitlines()"
          - >-
            molecule_o[2] is search('(?m)^\S+ restic-job: start cr$')
          - >-
            molecule_o[2] is search('(?m)^restic-job: done \(backup,forget')
          - >-
            molecule_o[2] is search('(?m)^\S+ restic-job: exit 0$')
          - molecule_o[3] is search('restic cr ok\|low')
          - molecule_o[4] == 'restic:restic'
          - molecule_o[5] == '600'

    # The unit's sandbox has a cron counterpart: setpriv sets the user, the single capability, the bounding set
    # and no_new_privs, and the wrapper sets the umask.
    - name: Run the plain job with a stub restic that records its privileges
      ansible.builtin.shell: |
        env RESTIC_JOB_BIN=/usr/local/bin/restic-stub STUB_MODE=probe {{ molecule_wrapper }} cron cr
        echo "rc=$?"
        cat /var/lib/restic/molecule-probe
      register: molecule_probe
      changed_when: true

    - name: Assert the run had only CAP_DAC_READ_SEARCH, no new privileges and the restic user
      ansible.builtin.assert:
        that:
          - molecule_probe.stdout_lines[0] == 'rc=0'
          - "'CapEff:\t0000000000000004' in molecule_probe.stdout_lines"
          - "'CapBnd:\t0000000000000004' in molecule_probe.stdout_lines"
          - "'CapAmb:\t0000000000000004' in molecule_probe.stdout_lines"
          - "'NoNewPrivs:\t1' in molecule_probe.stdout_lines"
          - "'restic' in molecule_probe.stdout_lines"
          - "'0077' in molecule_probe.stdout_lines"
          - "'lockfds=0' in molecule_probe.stdout_lines"

    # A run holding the lock makes the next cron start skip without a message to ntfy.
    - name: Start the plain job while another process holds its lock
      ansible.builtin.shell: |
        rm -f /run/molecule-ntfy.log
        ( flock /run/restic-cr.lock sleep 8 ) &
        sleep 1
        {{ molecule_wrapper }} cron cr
        echo "rc=$?"
        wait
        cat /run/molecule-ntfy.log 2>/dev/null || true
        tail -n 1 /var/log/restic/cr.log
      register: molecule_locked
      changed_when: true

    - name: Assert the locked start skipped silently and logged why
      ansible.builtin.assert:
        that:
          - molecule_locked.stdout_lines[0] == 'rc=0'
          - molecule_locked.stdout_lines | length == 2
          - >-
            molecule_locked.stdout_lines[1] is search('restic-job: skipped: the previous run still holds the lock$')

    # A failing job: the notification carries the log tail, and the wrapper says it failed.
    - name: Run the job whose source is missing
      ansible.builtin.shell: |
        rm -f /run/molecule-ntfy.log /run/molecule-ntfy-body.log
        {{ molecule_wrapper }} cron crbroken
        echo "rc=$?"
      register: molecule_broken
      changed_when: true

    - name: Read the failed job's log and notification
      ansible.builtin.command: "cat {{ item }}"
      loop: [/var/log/restic/crbroken.log, /run/molecule-ntfy.log, /run/molecule-ntfy-body.log]
      register: molecule_broken_out
      changed_when: false

    - name: Assert the failure reached the log and ntfy with the run's own lines
      vars:
        molecule_o: "{{ molecule_broken_out.results | map(attribute='stdout') | list }}"
      ansible.builtin.assert:
        that:
          - molecule_broken.stdout_lines[-1] == 'rc=1'
          - >-
            molecule_o[0] is search('restic-job: FAILED: source missing: /srv/molecule-missing')
          - >-
            molecule_o[0] is search('restic-job: exit 1$')
          - molecule_o[1] is search('restic crbroken FAILED \(exit-code/1\)\|high')
          - >-
            molecule_o[2] is search('source missing: /srv/molecule-missing')

    - name: Rotate the log when it is over 1 MiB
      ansible.builtin.shell: |
        head -c 1100000 /dev/zero | tr '\0' x > /var/log/restic/crbroken.log
        {{ molecule_wrapper }} cron crbroken || true
        stat -c %s /var/log/restic/crbroken.log /var/log/restic/crbroken.log.1
      register: molecule_rotate
      changed_when: true

    - name: Assert one rotated copy and a small new log
      ansible.builtin.assert:
        that:
          - molecule_rotate.stdout_lines[0] | int < 10000
          - molecule_rotate.stdout_lines[1] | int > 1000000

    # The job timeout is a real run killed by `timeout --signal=INT`; restic must still delete its lock.
    - name: Run the slow job past its 2 s timeout
      ansible.builtin.shell: |
        rm -f /run/molecule-ntfy.log
        env RESTIC_JOB_BIN=/usr/local/bin/restic-stub STUB_MODE=slow {{ molecule_wrapper }} cron crslow
        echo "rc=$?"
      register: molecule_slow
      changed_when: true

    - name: Read the slow job's locks, marker and notification
      ansible.builtin.shell: |
        {{ molecule_wrapper }} exec crslow list locks --no-lock
        echo "marker=$(test -e /var/lib/restic/crslow.interrupted && echo yes || echo no)"
        cat /run/molecule-ntfy.log
      register: molecule_slow_out
      changed_when: false

    - name: Assert the timeout failed the run, cleared the lock and sent one alert
      ansible.builtin.assert:
        that:
          - molecule_slow.stdout_lines[-1] == 'rc=1'
          - molecule_slow_out.stdout_lines[0] == 'marker=no'
          - molecule_slow_out.stdout is search('restic crslow FAILED \(timeout/124\)\|high')

    # The final SIGKILL reaches only restic-job; the session kill must take what it left behind.
    - name: Run a job whose restic ignores SIGINT, with a 3 s grace before SIGKILL
      ansible.builtin.shell: |
        rm -f /run/molecule-ntfy.log
        env RESTIC_JOB_BIN=/usr/local/bin/restic-stub STUB_MODE=hang RESTIC_JOB_KILL_AFTER=3s \
          {{ molecule_wrapper }} cron crslow
        echo "rc=$?"
        sleep 1
        echo "left=$(pgrep -fc '[s]leep 600' || true)"
        flock -n /run/restic-crslow.lock true && echo lock-free
        cat /run/molecule-ntfy.log
      register: molecule_hang
      changed_when: true

    - name: Assert the run was killed, nothing survived and the lock is free
      ansible.builtin.assert:
        that:
          - "'rc=1' in molecule_hang.stdout_lines or 'rc=137' in molecule_hang.stdout_lines"
          - "'left=0' in molecule_hang.stdout_lines"
          - "'lock-free' in molecule_hang.stdout_lines"
          - molecule_hang.stdout is search('restic crslow FAILED \(timeout/(124|137)\)\|high')

    # Gate: the nmcli reader against canned replies, then the real nmcli, then no nmcli at all.
    - name: Run the gate as the restic user against each set of nmcli replies
      ansible.builtin.shell: |
        rm -f /run/molecule-nmcli/rc /var/lib/restic/crgate.ok
        printf '%s\n' "$CONNS" > /run/molecule-nmcli/connections
        printf '%s\n' "$DEVS" > /run/molecule-nmcli/devices
        out=$(runuser -u restic -- env PATH={{ molecule_path }} RESTIC_JOB_NM=nmcli \
          RESTIC_JOB_POWER_DIR=/run/molecule-power {{ molecule_wrapper }} gate crgate 2>&1)
        echo "rc=$?"
        echo "$out"
      environment:
        CONNS: "{{ item.conns | join('\n') }}"
        DEVS: "{{ item.devs | join('\n') }}"
      loop: "{{ molecule_nmcli_cases }}"
      loop_control:
        label: "{{ item.id }}"
      register: molecule_nmcli
      changed_when: false

    - name: Assert each reply set was parsed to the right decision
      ansible.builtin.assert:
        that:
          - item.stdout_lines[0] == 'rc=' ~ item.item.rc
          - item.item.text in item.stdout
        fail_msg: "{{ item.item.id }}: {{ item.stdout }}"
      loop: "{{ molecule_nmcli.results }}"
      loop_control:
        label: "{{ item.item.id }}"

    - name: Run the gate with a failing nmcli, with the real nmcli and without any
      ansible.builtin.shell: |
        rm -f /var/lib/restic/crgate.ok
        echo 8 > /run/molecule-nmcli/rc
        runuser -u restic -- env PATH={{ molecule_path }} RESTIC_JOB_NM=nmcli \
          RESTIC_JOB_POWER_DIR=/run/molecule-power {{ molecule_wrapper }} gate crgate 2>&1 || echo "rc=$?"
        echo @@@
        runuser -u restic -- env PATH=/usr/sbin:/usr/bin:/sbin:/bin RESTIC_JOB_NM=nmcli \
          RESTIC_JOB_POWER_DIR=/run/molecule-power {{ molecule_wrapper }} gate crgate 2>&1 || echo "rc=$?"
        echo @@@
        runuser -u restic -- env PATH=/nonexistent RESTIC_JOB_NM=nmcli RESTIC_JOB_POWER_DIR=/run/molecule-power \
          /bin/bash {{ molecule_wrapper }} gate crgate 2>&1 || echo "rc=$?"
      register: molecule_nmcli_fail
      changed_when: false

    - name: Assert all three are skips that name NetworkManager, and the real nmcli accepted the arguments
      vars:
        molecule_parts: "{{ molecule_nmcli_fail.stdout.split('@@@\n') }}"
      ansible.builtin.assert:
        that:
          - >-
            molecule_parts[0] is search('skipped: NetworkManager unreachable: Error: NetworkManager is not running')
          - molecule_parts[0] is search('rc=1')
          - >-
            molecule_parts[1] is search('skipped: NetworkManager unreachable: ')
          - molecule_parts[1] is not search('(?i)invalid|usage|unknown option')
          - >-
            molecule_parts[2] is search('skipped: NetworkManager unreachable: nmcli not found')

    # The wrapper end to end on the gated job: AC and an unmetered link back up; battery, a throttle and a
    # metered link skip silently into the log.
    - name: Run the gated job through the wrapper in four situations
      ansible.builtin.shell: |
        rm -f /run/molecule-nmcli/rc /run/molecule-ntfy.log /var/lib/restic/crgate.ok
        printf '%s\n' "Home:802-3-ethernet" > /run/molecule-nmcli/connections
        printf '%s\n' "GENERAL.METERED:no" "GENERAL.CONNECTION:Home" "" > /run/molecule-nmcli/devices
        w() { env RESTIC_JOB_PATH={{ molecule_path }} PATH={{ molecule_path }} RESTIC_JOB_NM=nmcli \
          RESTIC_JOB_POWER_DIR=/run/molecule-power \
          {{ molecule_wrapper }} cron crgate; echo "rc=$?"; }
        snaps() { find /srv/molecule-repos/crgate/snapshots -type f | wc -l; }
        w; echo "ac: snaps=$(snaps) ok=$(test -e /var/lib/restic/crgate.ok && echo yes || echo no)"
        w; echo "throttle: snaps=$(snaps)"
        rm -f /var/lib/restic/crgate.ok
        echo Discharging > /run/molecule-power/BAT0/status
        w; echo "battery: snaps=$(snaps) ok=$(test -e /var/lib/restic/crgate.ok && echo yes || echo no)"
        echo Full > /run/molecule-power/BAT0/status
        printf '%s\n' "GENERAL.METERED:yes (guessed)" "GENERAL.CONNECTION:Home" "" > /run/molecule-nmcli/devices
        w; echo "metered: snaps=$(snaps) ok=$(test -e /var/lib/restic/crgate.ok && echo yes || echo no)"
        cat /run/molecule-ntfy.log
        echo @@@
        cat /var/log/restic/crgate.log
      register: molecule_gated
      changed_when: true

    - name: Assert one backup and three silent, logged skips
      vars:
        molecule_gated_parts: "{{ molecule_gated.stdout.split('@@@\n') }}"
      ansible.builtin.assert:
        that:
          - >-
            molecule_gated_parts[0] is search('(?m)^rc=0\nac: snaps=1 ok=yes$')
          - >-
            molecule_gated_parts[0] is search('(?m)^rc=0\nthrottle: snaps=1$')
          - >-
            molecule_gated_parts[0] is search('(?m)^rc=0\nbattery: snaps=1 ok=no$')
          - >-
            molecule_gated_parts[0] is search('(?m)^rc=0\nmetered: snaps=1 ok=no$')
          - molecule_gated_parts[0] is search('restic crgate ok\|low')
          - molecule_gated_parts[0] | regex_findall('restic crgate') | length == 1
          - >-
            molecule_gated_parts[1] is search('restic-job: skipped: last good run is under 20 h old')
          - >-
            molecule_gated_parts[1] is search('restic-job: skipped: the battery is discharging \(on battery\)')
          - >-
            molecule_gated_parts[1] is search("restic-job: skipped: link of 'Home' is metered")
        fail_msg: "{{ molecule_gated.stdout }}"

    # The freshness alert on a cron host points at the log directory, not at journalctl.
    - name: Age the plain job's stamp past its limit and run the freshness check
      ansible.builtin.shell: |
        touch -d '40 hours ago' /var/lib/restic/cr.ok
        rm -f /run/molecule-ntfy.log /run/molecule-ntfy-body.log
        {{ molecule_wrapper }} freshness
        echo "rc=$?"
        cat /run/molecule-ntfy.log /run/molecule-ntfy-body.log
      register: molecule_fresh
      changed_when: true

    - name: Assert the alert names the stale job and the log directory
      ansible.builtin.assert:
        that:
          - molecule_fresh.stdout_lines[0] == 'rc=2'
          - molecule_fresh.stdout is search('restic backups need attention\|high')
          - >-
            molecule_fresh.stdout is search('No good backup within the limit: cr\. See /var/log/restic/\.')
          - molecule_fresh.stdout is not search('journalctl')

    # The cron entry runs hourly, so a root-owned alert stamp keeps it to one alert a day.
    - name: Run freshness again, then through the cron redirect on an oversized freshness log
      ansible.builtin.shell: |
        rm -f /run/molecule-ntfy.log
        {{ molecule_wrapper }} freshness
        echo "again-rc=$?"
        echo "again-alerts=$(cat /run/molecule-ntfy.log 2>/dev/null | grep -c 'need attention')"
        stat -c '%a %U:%G' /var/lib/restic-alerts /var/lib/restic-alerts/stale-cr
        head -c 1100000 /dev/zero | tr '\0' x > /var/log/restic/freshness.log
        {{ molecule_wrapper }} freshness >>/var/log/restic/freshness.log 2>&1
        stat -c '%s' /var/log/restic/freshness.log /var/log/restic/freshness.log.1
        touch /var/lib/restic/cr.ok
        {{ molecule_wrapper }} freshness
        test ! -e /var/lib/restic-alerts/stale-cr && echo stamp-cleared
      register: molecule_fresh_again
      changed_when: true

    - name: Assert one alert a day, a root-only stamp, a rotated log and a stamp cleared when the job is fresh
      ansible.builtin.assert:
        that:
          - "'again-rc=0' in molecule_fresh_again.stdout_lines"
          - "'again-alerts=0' in molecule_fresh_again.stdout_lines"
          - "'700 root:root' in molecule_fresh_again.stdout_lines"
          - molecule_fresh_again.stdout_lines | select('match', '^6[04][04] root:root$') | list | length == 1
          - molecule_fresh_again.stdout_lines[-3] | int < 10000
          - molecule_fresh_again.stdout_lines[-2] | int > 1000000
          - "'stamp-cleared' in molecule_fresh_again.stdout_lines"
        fail_msg: "{{ molecule_fresh_again.stdout }}"

    # The teardown of a cron host removes entries, logs, cache and user, so it runs last.
    - name: Run the restic teardown on the cron host
      ansible.builtin.include_role:
        name: restic
        tasks_from: teardown
      vars:
        teardown_confirmed: true
        restic_scheduler: cron

    - name: Stat what the teardown must have removed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/cron.d/restic-cr
        - /etc/cron.d/restic-crgate
        - /etc/cron.d/restic-freshness
        - /var/log/restic
        - /var/cache/restic
        - /usr/local/libexec/restic
        - /etc/restic
        - /srv/molecule-repos/cr/config
      register: molecule_gone

    - name: Look up the restic user
      ansible.builtin.command: getent passwd restic
      register: molecule_user
      changed_when: false
      failed_when: false

    - name: Assert the cron host is torn down and its repository kept
      vars:
        molecule_st: "{{ molecule_gone.results | map(attribute='stat') | list }}"
      ansible.builtin.assert:
        that:
          - molecule_st[:-1] | selectattr('exists') | list | length == 0
          - molecule_st[-1].exists
          - molecule_user.rc == 2
