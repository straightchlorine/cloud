---
- name: Converge restic cron
  hosts: all
  become: true
  vars_files: [../shared/vars.yml]
  vars:
    # A systemd host that asks for cron: everything the role does for an OpenRC host except the init script.
    restic_scheduler: cron
    restic_cron_service: cron
  tasks:
    - name: Deploy five jobs through the role entry point
      ansible.builtin.include_role:
        name: restic
      vars:
        restic_jobs:
          - "{{ molecule_job | combine({'name': 'cr', 'repository': '/srv/molecule-repos/cr',
               'password': 'molecule-restic-password-cr', 'cron_schedule': '*/30 8-18 * * 1-5'}) }}"
          - "{{ molecule_job | combine({'name': 'crgate', 'repository': '/srv/molecule-repos/crgate',
               'password': 'molecule-restic-password-crgate', 'cron_schedule': '17 * * * *',
               'skip_metered': true, 'skip_on_battery': true,
               'metered_connections': molecule_metered_names + ['Lab: Guest']}) }}"
          - "{{ molecule_job | combine({'name': 'crbroken', 'repository': '/srv/molecule-repos/crbroken',
               'password': 'molecule-restic-password-crbroken', 'cron_schedule': '0 3 * * 0',
               'sources': ['/srv/molecule-missing']}) }}"
          - "{{ molecule_job | combine({'name': 'crbox', 'repository': '/srv/molecule-repos/crbox',
               'password': 'molecule-restic-password-crbox', 'cron_schedule': '11 4 * * *'}) }}"
          - "{{ molecule_job | combine({'name': 'crslow', 'repository': '/srv/molecule-repos/crslow',
               'password': 'molecule-restic-password-crslow', 'cron_schedule': '5,35 * 1,15 * *',
               'timeout': '2s'}) }}"
