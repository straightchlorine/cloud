---
- name: Prepare restic teardown
  hosts: all
  become: true
  tasks:
    - name: Install cron for the cron-scheduler teardown
      ansible.builtin.apt:
        name: cron
        update_cache: true

    - name: Create the shared source tree
      ansible.builtin.include_tasks: ../shared/prepare_sources.yml

    - name: Create a cache directory parent that belongs to another account, as /data/vault belongs to a user
      ansible.builtin.file:
        path: /srv/pre-parent
        state: directory
        owner: nobody
        group: nogroup
        mode: "0755"

    - name: Place a Storage Box key the teardown must keep
      ansible.builtin.copy:
        content: "not-a-real-key\n"
        dest: /etc/ssh/restic_storage_key
        mode: "0600"

    - name: Install the deploy-time notice stub
      ansible.builtin.include_tasks: ../shared/notice_stub.yml
