---
- name: Verify restic teardown
  hosts: all
  become: true
  tasks:
    - name: Assert the refusals ran
      vars:
        molecule_case_ids: [unconfirmed, cache-dir-not-restic]
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_markers.yml"

    - name: Assert the engine is gone and the repository, the key and the cache parent remain
      vars:
        molecule_paths:
          - { path: /etc/systemd/system/restic-job@.service, state: absent }
          - { path: /etc/systemd/system/restic-job@.timer, state: absent }
          - { path: /etc/systemd/system/restic-notify@.service, state: absent }
          - { path: /etc/systemd/system/restic-freshness.service, state: absent }
          - { path: /etc/systemd/system/restic-freshness.timer, state: absent }
          - { path: /etc/systemd/system/restic-job@ok.service.d, state: absent }
          - { path: /etc/systemd/system/restic-job@ok.timer.d, state: absent }
          - { path: /etc/systemd/system/timers.target.wants/restic-job@ok.timer, state: absent }
          - { path: /etc/systemd/system/timers.target.wants/restic-freshness.timer, state: absent }
          - { path: /etc/restic, state: absent }
          - { path: /usr/local/libexec/restic, state: absent }
          - { path: /var/lib/restic, state: absent }
          - { path: /var/lib/restic-alerts, state: absent }
          - { path: /usr/local/bin/restic, state: absent }
          - { path: /etc/cron.d/restic-freshness, state: absent }
          - { path: /etc/cron.d/restic-okcron, state: absent }
          - { path: /var/log/restic, state: absent }
          - { path: /srv/pre-parent/restic, state: absent }
          - { path: /srv/pre-parent, state: directory, mode: "0755", owner: nobody }
          - { path: /srv/molecule-repos/ok/config, state: file }
          - { path: /etc/ssh/restic_storage_key, state: file, mode: "0400", owner: root, group: root }
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"

    - name: Ask systemd about the timers
      ansible.builtin.command: "{{ item }}"
      loop:
        - systemctl is-enabled restic-job@ok.timer
        - systemctl is-enabled restic-freshness.timer
        - systemctl is-active restic-job@ok.timer
        - systemctl is-active restic-freshness.timer
      register: molecule_systemd
      changed_when: false
      failed_when: false

    - name: List the restic unit files systemd still knows
      ansible.builtin.command: systemctl list-unit-files 'restic-*' --no-legend
      register: molecule_unit_files
      changed_when: false
      failed_when: false

    - name: Look up the restic user
      ansible.builtin.command: getent passwd restic
      register: molecule_user
      changed_when: false
      failed_when: false

    - name: Assert no timer, no unit file and no restic user survive
      ansible.builtin.assert:
        that:
          - molecule_systemd.results | selectattr('rc', 'equalto', 0) | list | length == 0
          - molecule_unit_files.stdout | trim == ''
          - molecule_user.rc == 2
        quiet: true
