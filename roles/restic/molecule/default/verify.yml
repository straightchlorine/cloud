---
- name: Verify restic default
  hosts: all
  become: true
  vars_files: [../shared/vars.yml, ../shared/gate_cases_busctl.yml]
  tasks:
    - name: Check the deployed files
      ansible.builtin.include_tasks: verify/01_deployed_files.yml
    - name: Install the verify harness
      ansible.builtin.include_tasks: verify/02_harness.yml
    - name: Run the jobs
      ansible.builtin.include_tasks: verify/03_runs.yml
    - name: Stop a running job
      ansible.builtin.include_tasks: verify/04_slow_lock.yml
    - name: Check the notifications
      ansible.builtin.include_tasks: verify/05_notifications.yml
    - name: Run the freshness check
      ansible.builtin.include_tasks: verify/06_freshness.yml
    - name: Check the connection files and the sudo guard
      ansible.builtin.include_tasks: verify/07_connection_sudo.yml
    - name: Run the metered gate cases
      ansible.builtin.include_tasks: verify/08_metered_gate.yml
    - name: Run the unlock retry cases
      ansible.builtin.include_tasks: verify/09_unlock.yml
    - name: Check the cache directory and the battery gate
      ansible.builtin.include_tasks: verify/10_cache_battery.yml
    - name: Run the Storage Box cases
      ansible.builtin.include_tasks: verify/11_storage_box.yml
