---
# One line per message, newlines in the body shown as ^; verify parses this format.
- name: Install the stub that records the deploy-time test message
  ansible.builtin.copy:
    dest: /usr/local/bin/molecule-notice
    mode: "0755"
    content: |
      #!/bin/sh
      printf '%s|%s|%s\n' "$1" "$3" "$(printf '%s' "$2" | tr '\n' '^')" >> /var/log/molecule-notice.log
