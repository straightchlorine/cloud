---
# Input molecule_stub_install: [{src: <file under shared/stubs>, dest: <path on the host>}].
- name: Create the stub directory
  ansible.builtin.file:
    path: "{{ molecule_stubs }}"
    state: directory
    mode: "0755"

- name: Install the stubs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../shared/stubs/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
  loop: "{{ molecule_stub_install }}"
  loop_control:
    label: "{{ item.dest }}"
