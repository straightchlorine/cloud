---
- name: Install the static units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ restic_engine_units }}"
  notify: Reload systemd (restic)

- name: Load the units before enabling them
  ansible.builtin.meta: flush_handlers

- name: Enable the freshness timer
  ansible.builtin.systemd_service:
    name: restic-freshness.timer
    enabled: true
    state: started
