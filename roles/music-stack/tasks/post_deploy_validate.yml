---
# Post-deployment validation for music stack
# Verifies music services and YouTube sync are working correctly

- name: Wait for music stack containers to be ready
  ansible.builtin.pause:
    seconds: 20
    prompt: "Waiting for music stack containers to start..."
  tags: [post_validation]

- name: Check Docker containers are running
  ansible.builtin.shell: |
    cd "{{ music_stack_home }}"
    docker compose ps --format json
  register: music_stack_container_status
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Parse music container status
  ansible.builtin.set_fact:
    music_stack_containers: "{{ music_stack_container_status.stdout_lines | map('from_json') | list }}"
  tags: [post_validation]

- name: Verify music containers are running
  ansible.builtin.fail:
    msg: "Container {{ item.Service }} is not running (State: {{ item.State }})"
  when: item.State != "running"
  loop: "{{ music_stack_containers }}"
  loop_control:
    label: "{{ item.Service }}"
  tags: [post_validation]

- name: Test Navidrome accessibility
  ansible.builtin.wait_for:
    port: "{{ music_stack_navidrome_port }}"
    timeout: 60
  tags: [post_validation]

- name: Test Navidrome web interface
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ music_stack_navidrome_port }}"
    method: GET
    timeout: 15
  register: music_stack_navidrome_web
  tags: [post_validation]

- name: Check music library directory access
  ansible.builtin.stat:
    path: "{{ music_stack_music_library_path }}/music"
  register: music_stack_music_dir
  tags: [post_validation]

- name: Verify music library permissions
  ansible.builtin.file:
    path: "{{ music_stack_music_library_path }}/music"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: true
  tags: [post_validation]

- name: Test YouTube sync script if enabled
  when: youtube_sync_enabled
  tags: [post_validation]
  block:
    - name: Check yt-dlp is installed and working
      ansible.builtin.command: |
        python3 -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"
      register: music_stack_ytdlp_test
      changed_when: false
      become: true
      become_user: "{{ ansible_user }}"

    - name: Verify YouTube sync script exists
      ansible.builtin.stat:
        path: "{{ music_stack_music_library_path }}/scripts/youtube-sync.py"
      register: music_stack_youtube_script

    - name: Test YouTube sync script syntax
      ansible.builtin.command: |
        python3 -m py_compile "{{ music_stack_music_library_path }}/scripts/youtube-sync.py"
      when: music_stack_youtube_script.stat.exists
      changed_when: false
      become: true
      become_user: "{{ ansible_user }}"

- name: Check container health status
  ansible.builtin.shell: |
    cd "{{ music_stack_home }}"
    docker compose ps --format "table {{.Service}}\t{{.State}}\t{{.Health}}"
  register: music_stack_health_status
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false
  tags: [post_validation]

- name: Display music stack validation results
  ansible.builtin.debug:
    msg: |
      [OK] Music Stack Post-Deployment Validation Results:

      Container Status:
      {{ music_stack_health_status.stdout }}

      Service Health:
      Navidrome Web Interface: {{ 'Accessible' if music_stack_navidrome_web.status == 200 else 'Failed' }}
      Navidrome Port ({{ music_stack_navidrome_port }}): Listening
      Music Library: {{ 'Accessible' if music_stack_music_dir.stat.exists else 'Missing' }}
      Library Permissions: {{ 'Correct' if music_stack_music_dir.stat.mode == '0755' else 'Check Required' }}

      {% if youtube_sync_enabled %}
      YouTube Sync:
      yt-dlp Installation: {{ 'Working' if music_stack_ytdlp_test.rc == 0 else 'Failed' }}
      Sync Script: {{ 'Present' if music_stack_youtube_script.stat.exists else 'Missing' }}
      Script Syntax: {{ 'Valid' if music_stack_youtube_script.stat.exists else 'Not tested' }}
      {% else %}
      YouTube Sync: Disabled
      {% endif %}

      [OK] Music stack deployment validated successfully!
  tags: [post_validation]
