---
# Music Stack setup tasks for Pi 3B

- name: Run music stack deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Detect hardware for resource allocation
  ansible.builtin.include_role:
    name: common
    tasks_from: detect_hardware
  tags: [hardware, validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Include common package management # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ music_stack_music_stack_specific_packages }}"
  tags: [packages]

- name: Include common Docker setup
  ansible.builtin.include_role:
    name: common
    tasks_from: docker
  tags: [docker]

- name: Create music stack directory
  ansible.builtin.file:
    path: "{{ music_stack_music_stack_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  tags: [docker]

- name: Include SSD mounting
  ansible.builtin.include_tasks: storage.yml
  tags: [storage]

- name: Include music stack deployment
  ansible.builtin.include_tasks: stack.yml
  tags: [stack, config]

- name: Include YouTube sync configuration
  ansible.builtin.include_tasks: youtube.yml
  tags: [youtube]
  when: youtube_sync_enabled

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Create Docker stack systemd service # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_stack_service
  vars:
    stack_service_name: "music-stack"
    stack_description: "Music Stack (Navidrome, Beets, YouTube sync)"
    stack_home_directory: "{{ music_stack_music_stack_home }}"
    stack_user: "{{ ansible_user }}"
    stack_environment_vars:
      - "MUSIC_LIBRARY_PATH={{ music_stack_music_library_path }}"
      - "PUID={{ ansible_uid }}"
      - "PGID={{ ansible_gid }}"
  tags: [systemd, auto-start]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation, never]
