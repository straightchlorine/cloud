---
- name: Converge - Default (Core Role Logic)
  hosts: all
  vars:
    # Music stack paths
    music_stack_home: "/home/pi/music-stack"
    music_stack_music_library_path: "/mnt/music"

    # Service ports
    music_stack_navidrome_port: 4545

    # Music library directories
    music_stack_music_library_directories:
      - music
      - downloads
      - processing

    # Domain configuration (test values)
    vault_domain_name: "example.local"
    vault_letsencrypt_email: "test@example.local"

    # Disable optional features
    youtube_sync_enabled: false
    start_stack: false

    # Test user (simulates ansible_user in the real role)
    test_user: "pi"
    test_uid: 1000
    test_gid: 1000

  pre_tasks:
    - name: Create parent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      become: true
      loop:
        - "{{ music_stack_home | dirname }}"
        - "{{ music_stack_music_library_path | dirname }}"

    - name: Create test user group
      ansible.builtin.group:
        name: "{{ test_user }}"
        gid: "{{ test_gid }}"
        state: present
      become: true

    - name: Create test user
      ansible.builtin.user:
        name: "{{ test_user }}"
        uid: "{{ test_uid }}"
        group: "{{ test_user }}"
        shell: /bin/bash
        home: "/home/{{ test_user }}"
        createhome: true
      become: true

    - name: Gather facts (replaces network facts for testing)
      ansible.builtin.setup:
        gather_subset: network

  tasks:
    - name: Note about molecule test limitations
      ansible.builtin.debug:
        msg: |
          Running simplified test of music-stack role core logic
          Note: Common role dependencies not available in molecule
          Testing only: directory structure, config directories, scripts directory, ownership

    - name: Create music stack home directory
      ansible.builtin.file:
        path: "{{ music_stack_home }}"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true

    - name: Create music library base directory
      ansible.builtin.file:
        path: "{{ music_stack_music_library_path }}"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true

    - name: Create music library subdirectories
      ansible.builtin.file:
        path: "{{ music_stack_music_library_path }}/{{ item }}"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true
      loop: "{{ music_stack_music_library_directories }}"

    - name: Create config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true
      loop:
        - "{{ music_stack_home }}/config"
        - "{{ music_stack_home }}/config/beets"
        - "{{ music_stack_home }}/config/navidrome"
        - "{{ music_stack_home }}/config/cache"

    - name: Create scripts directory
      ansible.builtin.file:
        path: "{{ music_stack_home }}/scripts"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true

    - name: Create logs directory
      ansible.builtin.file:
        path: "{{ music_stack_home }}/logs"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true

    - name: Create archive directory
      ansible.builtin.file:
        path: "{{ music_stack_home }}/archive"
        state: directory
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true

    - name: Create docker-compose.yml for testing
      ansible.builtin.copy:
        content: |
          version: "3.9"
          services:
            navidrome:
              image: "deluan/navidrome:latest"
              container_name: "navidrome"
              ports:
                - "{{ music_stack_navidrome_port }}:4533"
          networks:
            default:
              name: music-stack
        dest: "{{ music_stack_home }}/docker-compose.yml"
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: '0644'
      become: true

    - name: Create management script (test placeholder)
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Music stack management script placeholder
          echo "Music stack management script"
        dest: "{{ music_stack_home }}/scripts/youtube-sync.sh"
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: "0755"
      become: true
