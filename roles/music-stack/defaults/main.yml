---
# Default variables for music-stack role

# Music-specific packages (common packages inherited from common role)
music_stack_music_stack_specific_packages:
  - python3-pip
  - ffmpeg

# Service ports (defaults)
music_stack_navidrome_port: 4545

# SSD configuration (common variables inherited from common role)

music_stack_beets_genres:
  - Rock
  - Pop
  - Hip-Hop
  - Electronic
  - Jazz
  - Classical
  - Folk
  - Country
  - Blues
  - Reggae
  - Metal
  - Punk
  - Alternative
  - Indie
  - R&B
  - Soul
  - Funk
  - Disco
  - House
  - Techno
  - Trance
  - Drum & Bass
  - Dubstep
  - Ambient
  - World
  - Latin
  - Soundtrack
  - YouTube
  - Podcast
  - Speech

# YouTube download configuration
music_stack_ytdlp_version: "2025.08.27"
music_stack_ytdlp_dependencies:
  - python3-pip
  - ffmpeg

music_stack_music_library_directories:
  - music
  - downloads
  - processing
  - backups
  - logs
  - navidrome-data

# start_stack: inherited from common role

# Docker Compose services configuration
music_stack_music_stack_compose_services:
  navidrome:
    image: "deluan/navidrome:latest"
    container_name: "navidrome"
    ports:
      - "{{ music_stack_navidrome_port }}:4533"
    deploy:
      resources:
        limits:
          memory: "{{ hardware_limits.navidrome.memory }}"
          cpus: "{{ hardware_limits.navidrome.cpus }}"
        reservations:
          memory: "{{ hardware_limits.navidrome.memory_reservation }}"
          cpus: "{{ hardware_limits.navidrome.cpus_reservation }}"
    environment:
      - "ND_MUSICFOLDER=/music"
      - "ND_DATAFOLDER=/data"
      - "ND_LOGLEVEL=info"
      - "ND_BASEURL=https://{{ subdomain_navidrome }}.{{ domain_name }}"
      - "ND_JWTKEY=${NAVIDROME_JWT_SECRET}"
      - "ND_AUTOIMPORTPLAYLISTS=false"
      - "ND_SCANNER_INTERVAL=0"
      - "ND_ENABLEINSIGHTSCOLLECTOR=false"
      - "ND_BACKUP_PATH=/data/backups"
      - "ND_BACKUP_SCHEDULE=0 1 * * *"
      - "ND_BACKUP_COUNT=5"
      - "ND_IMAGECACHESIZE=250MB"
      - "ND_TRANSCODINGCACHESIZE=500MB"
      - "ND_SCANNER_WATCHERWAIT=10s"
      - "ND_SCANNER_SCANONSTARTUP=true"
      - "ND_SCANNER_PURGEMISSING=full"
      - "ND_SESSIONTIMEOUT=24h"
      - "ND_DEFAULTUIVOLUME=70"
      - "ND_ENABLELOGREDACTING=true"
      - "ND_DEFAULTDOWNSAMPLINGFORMAT=opus"
      - "ND_ENABLETRANSCODINGCONFIG=true"
      - "ND_DEFAULTTHEME=Dark"
      - "ND_ENABLECOVERANIMATION=true"
      - "ND_MAXSIDEBARPLAYLISTS=50"
    volumes:
      - "{{ music_stack_music_library_path }}/music:/music:ro"
      - "{{ music_stack_music_library_path }}/navidrome-data:/data"
    restart: "always"
    user: "{{ ansible_uid }}:{{ ansible_gid }}"

  beets:
    image: "linuxserver/beets:latest"
    container_name: "beets"
    deploy:
      resources:
        limits:
          memory: "{{ hardware_limits.beets.memory }}"
          cpus: "{{ hardware_limits.beets.cpus }}"
        reservations:
          memory: "{{ hardware_limits.beets.memory_reservation }}"
          cpus: "{{ hardware_limits.beets.cpus_reservation }}"
    environment:
      - "PUID={{ ansible_uid }}"
      - "PGID={{ ansible_gid }}"
      - "TZ={{ timezone }}"
    volumes:
      - "{{ music_stack_music_stack_home }}/config/beets:/config"
      - "{{ music_stack_music_library_path }}/music:/music"
      - "{{ music_stack_music_library_path }}/downloads:/downloads"
    restart: "no"
    profiles:
      - "tools"

  dozzle-agent:
    image: "amir20/dozzle:latest"
    container_name: "dozzle-agent"
    restart: "always"
    ansible.builtin.command: "agent"
    deploy:
      resources:
        limits:
          memory: "{{ hardware_limits.dozzle.memory }}"
          cpus: "{{ hardware_limits.dozzle.cpus }}"
        reservations:
          memory: "{{ hardware_limits.dozzle.memory_reservation }}"
          cpus: "{{ hardware_limits.dozzle.cpus_reservation }}"
    ports:
      - "7007:7007"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  portainer-agent:
    image: "portainer/agent:latest"
    container_name: "portainer-agent"
    restart: "always"
    deploy:
      resources:
        limits:
          memory: "128M"
          cpus: "0.25"
        reservations:
          memory: "64M"
          cpus: "0.1"
    ports:
      - "9001:9001"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/var/lib/docker/volumes:/var/lib/docker/volumes:ro"
    environment:
      - "AGENT_CLUSTER_ADDR=tasks.agent"

# Docker Compose networks configuration
music_stack_music_stack_compose_networks:
  default:
    name: "music-stack"
