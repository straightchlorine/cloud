# Default variables for music-stack role

# Music-specific packages (common packages inherited from common role)
music_stack_specific_packages:
  - python3-pip
  - ffmpeg

# Service ports (defaults)
navidrome_port: 4545

# SSD configuration defaults
ssd_filesystem: "ext4"
ssd_mount_options: "defaults,noatime"
ssd_format: false



beets_genres:
  - Rock
  - Pop
  - Hip-Hop
  - Electronic
  - Jazz
  - Classical
  - Folk
  - Country
  - Blues
  - Reggae
  - Metal
  - Punk
  - Alternative
  - Indie
  - R&B
  - Soul
  - Funk
  - Disco
  - House
  - Techno
  - Trance
  - Drum & Bass
  - Dubstep
  - Ambient
  - World
  - Latin
  - Soundtrack
  - YouTube
  - Podcast
  - Speech

# YouTube download configuration
ytdlp_version: "2025.08.27"
ytdlp_dependencies:
  - python3-pip
  - ffmpeg

music_library_directories:
  - music
  - downloads
  - processing
  - backups
  - logs
  - navidrome-data


# Stack startup
start_stack: true

