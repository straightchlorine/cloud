---
firewall_enabled: true
firewall_policy_incoming: deny
firewall_policy_outgoing: allow
firewall_policy_routed: deny

# Resets UFW before applying. It is set per test run and never in production inventory.
firewall_reset: false

# Ports every host of a group opens (group_vars); firewall_ports adds host-specific ones.
firewall_common_ports: []
firewall_ports: []

firewall_rules: []

firewall_logging: "low"
