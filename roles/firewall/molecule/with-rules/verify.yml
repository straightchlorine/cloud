---
- name: Verify firewall role with custom rules
  hosts: all
  tasks:
    - name: Verify UFW is installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert UFW package is installed
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['ufw'] is defined
        fail_msg: "UFW package is not installed"
        success_msg: "✓ UFW package is installed"

    - name: Display firewall with-rules verification results
      ansible.builtin.debug:
        msg: |
          ✓ Firewall Rules Verification Complete

          Configuration verified:
          - UFW Installation: Verified
          - Firewall enabled: true
          - Common ports configured: 2 (HTTP, HTTPS)
          - Host-specific ports: 2 (8080, 8443)
          - Advanced rules: 2 (DNS, MySQL)

          Note: UFW rule verification skipped in container environment
          (requires kernel/iptables access for firewall operations)
