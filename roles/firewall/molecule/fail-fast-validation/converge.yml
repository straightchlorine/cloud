---
- name: Converge - Firewall Fail-Fast Validation
  hosts: all
  vars:
    timezone: UTC
    # Intentionally omit required variables:
    # - firewall_enabled
    # - firewall_policy_incoming
    # - firewall_policy_outgoing
    # - firewall_policy_routed
    # This tests that role handles missing configuration gracefully
  tasks:
    - name: Test firewall without required variables
      block:
        - name: Try basic UFW install without firewall variables
          ansible.builtin.apt:
            name: ufw
            state: present
          become: true

        - name: Set result to success
          ansible.builtin.set_fact:
            firewall_validation_failed: false
      rescue:
        - name: Capture failure if it occurs
          ansible.builtin.set_fact:
            firewall_validation_failed: true
            firewall_validation_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Display failure message
          ansible.builtin.debug:
            msg: |
              [OK] Firewall validation failed
              Error: {{ firewall_validation_error }}
