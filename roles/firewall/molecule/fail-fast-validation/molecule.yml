---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: firewall-fail-fast-validation
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible

verifier:
  name: ansible
scenario:
  # No idempotence pass: converge only installs ufw and asserts, so a second converge cannot catch a
  # non-idempotent role. The default scenario's idempotence pass covers the role.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
