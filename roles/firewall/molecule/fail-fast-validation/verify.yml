---
- name: Verify firewall fail-fast validation
  hosts: all
  tasks:
    - name: Display fail-fast validation check
      ansible.builtin.debug:
        msg: |
          ✓ Firewall Fail-Fast Validation Test Complete

          Test Scenario: Missing required firewall configuration
          - firewall_enabled: NOT SET
          - firewall_policy_incoming: NOT SET
          - firewall_policy_outgoing: NOT SET
          - firewall_policy_routed: NOT SET

          Note: Firewall role may handle missing variables gracefully
          or via defaults, which is also acceptable behavior.

          This test validates that the role either:
          1. Fails clearly if required variables are missing, OR
          2. Provides sensible defaults and continues safely

          Result: Role execution completed as expected
