---
# Firewall configuration tasks

- name: Install UFW using common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    firewall_role_specific_packages:
      - ufw

- name: Reset UFW to defaults
  community.general.ufw:
    state: reset
  become: true
  when: firewall_reset is defined and firewall_reset | bool

- name: Reload systemd and ensure UFW is available
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: "{{ firewall_policy_incoming }}"}
    - {direction: outgoing, policy: "{{ firewall_policy_outgoing }}"}
    - {direction: routed, policy: "{{ firewall_policy_routed }}"}
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

- name: Configure UFW logging
  community.general.ufw:
    logging: "{{ firewall_logging }}"
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

- name: Allow SSH (always required)
  community.general.ufw:
    rule: allow
    port: "22"
    comment: "SSH access"
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

- name: Configure common firewall ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    comment: "{{ item.comment if item.comment is defined else 'Service port' }}"
    proto: "{{ item.proto if item.proto is defined else 'tcp' }}"
  loop: "{{ common_firewall_ports }}"
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: common_firewall_ports is defined and common_firewall_ports | length > 0

- name: Configure host-specific firewall ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    comment: "{{ item }} service"
  loop: "{{ firewall_ports }}"
  when: firewall_ports is defined and firewall_ports | length > 0
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

- name: Configure advanced firewall rules
  community.general.ufw:
    rule: "{{ item.rule if item.rule is defined else 'allow' }}"
    port: "{{ item.port if item.port is defined else omit }}"
    proto: "{{ item.proto if item.proto is defined else 'tcp' }}"
    src: "{{ item.src if item.src is defined else omit }}"
    dest: "{{ item.dest if item.dest is defined else omit }}"
    comment: "{{ item.comment if item.comment is defined else 'Custom rule' }}"
  loop: "{{ firewall_rules }}"
  when: firewall_rules is defined and firewall_rules | length > 0
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: firewall_enabled
