---

- name: Run firewall deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Install UFW using common package management # noqa: var-naming[no-role-prefix]
  # role_specific_packages is the input of common/packages, so it cannot carry the firewall_ prefix.
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages:  # noqa: var-naming[no-role-prefix]
      - ufw

- name: Reset UFW to defaults
  community.general.ufw:
    state: reset
  become: true
  when: firewall_reset | bool

- name: Reload systemd and ensure UFW is available
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Apply UFW policies and rules
  become: true
  # ufw lives in /usr/sbin, absent from non-login shells' PATH.
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  block:
    - name: Set UFW default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - {direction: incoming, policy: "{{ firewall_policy_incoming }}"}
        - {direction: outgoing, policy: "{{ firewall_policy_outgoing }}"}
        - {direction: routed, policy: "{{ firewall_policy_routed }}"}

    - name: Configure UFW logging
      community.general.ufw:
        logging: "{{ firewall_logging }}"

    - name: Allow SSH (always required)
      community.general.ufw:
        rule: allow
        port: "22"
        comment: "SSH access"

    - name: Configure the group-wide firewall ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port | string }}"
        comment: "{{ item.comment if item.comment is defined else 'Service port' }}"
        proto: "{{ item.proto if item.proto is defined else 'tcp' }}"
      loop: "{{ firewall_common_ports }}"

    - name: Configure host-specific firewall ports
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        comment: "{{ item }} service"
      loop: "{{ firewall_ports }}"

    - name: Configure advanced firewall rules
      community.general.ufw:
        rule: "{{ item.rule if item.rule is defined else 'allow' }}"
        port: "{{ item.port if item.port is defined else omit }}"
        proto: "{{ item.proto if item.proto is defined else 'tcp' }}"
        src: "{{ item.src if item.src is defined else omit }}"
        dest: "{{ item.dest if item.dest is defined else omit }}"
        comment: "{{ item.comment if item.comment is defined else 'Custom rule' }}"
      loop: "{{ firewall_rules }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      when: firewall_enabled
