---

- name: Validate firewall policies have valid values
  ansible.builtin.assert:
    that:
      - firewall_policy_incoming in ['allow', 'deny', 'reject']
      - firewall_policy_outgoing in ['allow', 'deny', 'reject']
      - firewall_policy_routed in ['allow', 'deny', 'reject']
    fail_msg: "Firewall policies must be one of: allow, deny, reject"
    success_msg: "[OK] Firewall policies have valid values"

- name: Validate firewall_logging has valid value
  ansible.builtin.assert:
    that:
      - firewall_logging in ['on', 'off', 'low', 'medium', 'high', 'full']
    fail_msg: "firewall_logging must be one of: on, off, low, medium, high, full"
    success_msg: "[OK] firewall_logging has valid value"
