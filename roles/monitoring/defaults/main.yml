---
# Monitoring stack configuration
# Centralized monitoring machine with native Debian packages for Grafana, Prometheus, Loki

# Monitoring packages (replaces custom packages.yml)
monitoring_packages:
  - curl
  - wget
  - unzip
  - nodejs
  - npm
  - jq
  - prometheus
  - prometheus-alertmanager
  - grafana

# Monitoring configuration paths
monitoring_config_path: "/etc/monitoring"
monitoring_data_path: "/var/lib/monitoring"
monitoring_log_path: "/var/log/monitoring"
monitoring_stack_home: "/opt/monitoring"

# Package sources
monitoring_grafana_apt_key_url: "https://apt.grafana.com/gpg.key"
monitoring_grafana_apt_repo: "deb https://apt.grafana.com stable main"
monitoring_prometheus_version: "latest" # Will use Debian package version

# Service configuration
monitoring_grafana_port: 3000
monitoring_prometheus_port: 9090
monitoring_loki_port: 3100
monitoring_uptime_kuma_port: 3001
monitoring_alertmanager_port: 9093

# Grafana configuration
monitoring_grafana_admin_password: "{{ vault_grafana_admin_password }}"
monitoring_grafana_database_type: "sqlite3"
monitoring_grafana_allow_embedding: false

# Prometheus configuration
monitoring_prometheus_retention_time: "30d"
monitoring_prometheus_retention_size: "10GB"
monitoring_prometheus_scrape_interval: "15s"
monitoring_prometheus_evaluation_interval: "15s"

# Loki configuration
monitoring_loki_retention_period: "30d"
monitoring_loki_max_chunk_age: "2h"
monitoring_loki_chunk_idle_period: "30m"
monitoring_loki_max_transfer_retries: 3

# Uptime Kuma configuration
monitoring_uptime_kuma_data_retention: "365d"

# Alertmanager configuration - ALL MUST be explicitly set in vault
# vault_smtp_server: must be set in vault - no default
# vault_alert_email: must be set in vault - no default
# vault_webhook_url: must be set in vault - no default
# These will be validated during deployment

# SSL/TLS configuration
monitoring_enable_ssl: true
monitoring_ssl_cert_path: "/etc/ssl/certs"
monitoring_ssl_key_path: "/etc/ssl/private"

# Native service configuration
monitoring_services_enabled:
  grafana: true
  prometheus: true
  loki: true
  uptime_kuma: true
  alertmanager: true

# Service users (will be created by packages)
monitoring_grafana_user: "grafana"
monitoring_prometheus_user: "prometheus"
monitoring_loki_user: "loki"

# Service discovery targets (to be populated from inventory)
monitoring_prometheus_targets: []
monitoring_loki_targets: []
# Backup configuration
# backup_enabled: determined by restic_enabled variable validation
monitoring_backup_paths:
  - "{{ monitoring_data_path }}"
  - "{{ monitoring_stack_home }}/config"

# Security configuration
monitoring_basic_auth_enabled: true
# vault_prometheus_basic_auth: must be set in vault - no default
# vault_loki_basic_auth: must be set in vault - no default
# These will be validated during deployment
