---
# Monitoring stack configuration
# Centralized monitoring machine with native Debian packages for Grafana, Prometheus, Loki

# Monitoring packages (replaces custom packages.yml)
monitoring_packages:
  - curl
  - wget
  - unzip
  - nodejs
  - npm
  - jq
  - prometheus
  - prometheus-alertmanager
  - grafana

# Monitoring configuration paths
monitoring_config_path: "/etc/monitoring"
monitoring_data_path: "/var/lib/monitoring"
monitoring_log_path: "/var/log/monitoring"
monitoring_stack_home: "/opt/monitoring"

# Package sources
grafana_apt_key_url: "https://apt.grafana.com/gpg.key"
grafana_apt_repo: "deb https://apt.grafana.com stable main"
prometheus_version: "latest" # Will use Debian package version

# Service configuration
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
uptime_kuma_port: 3001
alertmanager_port: 9093

# Grafana configuration
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_database_type: "sqlite3"
grafana_allow_embedding: false

# Prometheus configuration
prometheus_retention_time: "30d"
prometheus_retention_size: "10GB"
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"

# Loki configuration
loki_retention_period: "30d"
loki_max_chunk_age: "2h"
loki_chunk_idle_period: "30m"
loki_max_transfer_retries: 3

# Uptime Kuma configuration
uptime_kuma_data_retention: "365d"

# Alertmanager configuration - ALL MUST be explicitly set in vault
# vault_smtp_server: must be set in vault - no default
# vault_alert_email: must be set in vault - no default
# vault_webhook_url: must be set in vault - no default
# These will be validated during deployment

# SSL/TLS configuration
enable_ssl: true
ssl_cert_path: "/etc/ssl/certs"
ssl_key_path: "/etc/ssl/private"

# Native service configuration
services_enabled:
  grafana: true
  prometheus: true
  loki: true
  uptime_kuma: true
  alertmanager: true

# Service users (will be created by packages)
grafana_user: "grafana"
prometheus_user: "prometheus"
loki_user: "loki"

# Service discovery targets (to be populated from inventory)
prometheus_targets: []
loki_targets: []
# Backup configuration
# backup_enabled: determined by restic_enabled variable validation
common_backup_paths:
  - "{{ monitoring_data_path }}"
  - "{{ monitoring_stack_home }}/config"

# Security configuration
basic_auth_enabled: true
# vault_prometheus_basic_auth: must be set in vault - no default
# vault_loki_basic_auth: must be set in vault - no default
# These will be validated during deployment
