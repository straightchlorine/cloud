---
# Service management for monitoring stack
# Manages systemd services for Prometheus, Grafana, Loki, Uptime Kuma

- name: Create Loki systemd service # noqa: var-naming[no-role-prefix]
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/loki.service
    mode: "0644"
  vars:
    service_description: "Loki log aggregation system"
    common_service_wants: ["network-online.target"]
    service_after: ["network-online.target"]
    service_type: "simple"
    service_user: "loki"
    service_group: "loki"
    exec_start: "/usr/local/bin/loki -config.file=/etc/loki/loki.yml"
    restart_policy: "always"
    restart_sec: "5"
    syslog_identifier: "loki"
    kill_mode: "mixed"
    kill_signal: "SIGINT"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["/var/lib/loki", "/var/log/loki"]
    protect_kernel_tunables: "yes"
    protect_kernel_modules: "yes"
    protect_control_groups: "yes"
    limit_nofile: "65536"
    memory_max: "512M"
  become: true
  notify:
    - reload systemd
    - Restart loki

- name: Create Uptime Kuma systemd service # noqa: var-naming[no-role-prefix]
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: /etc/systemd/system/uptime-kuma.service
    mode: "0644"
  vars:
    service_description: "Uptime Kuma monitoring dashboard"
    common_service_wants: ["network-online.target"]
    service_after: ["network-online.target"]
    service_type: "simple"
    service_user: "uptime-kuma"
    service_group: "uptime-kuma"
    common_working_directory: "/opt/uptime-kuma"
    exec_start: "/usr/bin/node server/server.js"
    restart_policy: "always"
    restart_sec: "5"
    syslog_identifier: "uptime-kuma"
    common_protect_system: "strict"
    common_protect_home: "yes"
    common_private_tmp: "yes"
    common_read_write_paths: ["/opt/uptime-kuma/data"]
    memory_max: "256M"
  become: true
  notify:
    - reload systemd
    - Restart uptime-kuma

- name: Start and enable all monitoring services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  loop:
    - prometheus
    - prometheus-alertmanager
    - grafana-server
    - loki
    - uptime-kuma
  register: monitoring_service_start

- name: Wait for services to start
  ansible.builtin.wait_for:
    port: "{{ item.port }}"
    host: "{{ primary_ip }}"
    delay: 5
    timeout: 60
  loop:
    - { service: "prometheus", port: "{{ monitoring_prometheus_port }}" }
    - { service: "alertmanager", port: "{{ monitoring_alertmanager_port }}" }
    - { service: "grafana", port: "{{ monitoring_grafana_port }}" }
    - { service: "loki", port: "{{ monitoring_loki_port }}" }
    - { service: "uptime-kuma", port: "{{ monitoring_uptime_kuma_port }}" }
  loop_control:
    label: "{{ item.service }}:{{ item.port }}"

- name: Check service status
  ansible.builtin.systemd:
    name: "{{ item }}"
  register: monitoring_service_status
  loop:
    - prometheus
    - prometheus-alertmanager
    - grafana-server
    - loki
    - uptime-kuma

- name: Verify services are active
  ansible.builtin.fail:
    msg: "Service {{ item.item }} is not active: {{ item.status.ActiveState }}"
  when: item.status.ActiveState != "active"
  loop: "{{ monitoring_service_status.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Test service endpoints
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ item.port }}{{ item.health_path }}"
    method: GET
    timeout: 10
    status_code: 200
  loop:
    - { service: "prometheus", port: "{{ monitoring_prometheus_port }}", health_path: "/-/healthy" }
    - { service: "alertmanager", port: "{{ monitoring_alertmanager_port }}", health_path: "/-/healthy" }
    - { service: "grafana", port: "{{ monitoring_grafana_port }}", health_path: "/api/health" }
    - { service: "loki", port: "{{ monitoring_loki_port }}", health_path: "/ready" }
    - { service: "uptime-kuma", port: "{{ monitoring_uptime_kuma_port }}", health_path: "" }
  loop_control:
    label: "{{ item.service }}"
  register: monitoring_endpoint_checks
  retries: 3
  delay: 5

- name: Display service status summary
  ansible.builtin.debug:
    msg: |
      [OK] Monitoring Services Status:

      {% for check in monitoring_endpoint_checks.results %}
      {{ check.item.service | title }}: {{
          '[OK] Running' if check.status == 200 else '[FAIL] Failed' }} ({{ check.item.port }})
      {% endfor %}

      All monitoring services are running and accessible!

- name: Configure log rotation for monitoring services
  ansible.builtin.template:
    src: monitoring-logrotate.j2
    dest: /etc/logrotate.d/monitoring
    mode: "0644"
  become: true
