---
# Monitoring stack deployment validation
# Ensures all requirements are met before monitoring stack deployment begins

- name: Run monitoring stack comprehensive validation
  ansible.builtin.include_role:
    name: Common
    tasks_from: unified_validation
  vars:
    validation_context: "monitoring stack"
    validation_type: "full"
    role_name: "monitoring"
    required_variables:
      - monitoring_data_path
      - monitoring_config_path
      - monitoring_log_path
      - monitoring_stack_home
      - vault_grafana_admin_password
      - grafana_port
      - prometheus_port
      - loki_port
      - uptime_kuma_port
      - alertmanager_port
      - restic_enabled
      - restic_repository
      - restic_password
    vault_placeholders:
      - { var: "vault_grafana_admin_password", value: "your-secure-grafana-admin-password" }
    backup_directories:
      - "{{ monitoring_data_path }}"
      - "{{ monitoring_config_path }}"
    critical_backup_paths:
      - "{{ monitoring_data_path }}"

- name: Check required ports are available
  ansible.builtin.wait_for:
    port: "{{ item }}"
    timeout: 1
  register: port_check
  failed_when: false
  loop:
    - "{{ grafana_port }}"
    - "{{ prometheus_port }}"
    - "{{ loki_port }}"
    - "{{ uptime_kuma_port }}"
    - "{{ alertmanager_port }}"

- name: Fail if critical ports are in use
  ansible.builtin.fail:
    msg: "Port {{ item.item }} is already in use"
  when: item.elapsed is defined and item.elapsed < 1
  loop: "{{ port_check.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check available disk space for monitoring data
  ansible.builtin.shell: df {{ monitoring_data_path | dirname }} | tail -1 | awk '{print $4}'
  register: disk_space
  changed_when: false

- name: Fail if insufficient disk space
  ansible.builtin.fail:
    msg: >-
      Insufficient disk space. Available: {{ (disk_space.stdout | int / 1024 / 1024) | round(2) }}GB.
      Required: 10GB minimum for monitoring data retention
  when: (disk_space.stdout | int) < 10485760
