---
# Configuration management for monitoring stack
# Generates and deploys configuration files for all monitoring services

- name: Create monitoring configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  become: true
  loop:
    - /etc/prometheus
    - /etc/prometheus/rules
    - /etc/loki
    - /etc/grafana
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /etc/alertmanager
    - /etc/alertmanager/templates

- name: Generate Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
    backup: true
  become: true
  notify: restart prometheus

- name: Generate Prometheus alerting rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: /etc/prometheus/rules/alert-rules.yml
    mode: '0644'
    backup: true
  become: true
  notify: restart prometheus

- name: Generate Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: /etc/loki/loki.yml
    mode: '0644'
    backup: true
  become: true
  notify: restart loki

- name: Generate Loki alerting rules
  ansible.builtin.template:
    src: loki-alert-rules.yml.j2
    dest: /etc/loki/loki-alert-rules.yml
    mode: '0644'
    backup: true
  become: true
  notify: restart loki

- name: Generate Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    mode: '0644'
    backup: true
  become: true
  notify: restart alertmanager

- name: Generate Grafana datasource configuration
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    mode: '0644'
  become: true
  notify: restart grafana

- name: Generate Grafana dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    mode: '0644'
  become: true
  notify: restart grafana

- name: Create Grafana dashboard directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    ansible.builtin.group: grafana
    mode: '0755'
  become: true

- name: Copy unified infrastructure dashboard
  ansible.builtin.template:
    src: infrastructure-dashboard.json.j2
    dest: /var/lib/grafana/dashboards/infrastructure-overview.json
    owner: grafana
    ansible.builtin.group: grafana
    mode: '0644'
  become: true

- name: Validate Prometheus configuration
  ansible.builtin.command: promtool check config /etc/prometheus/prometheus.yml
  register: prometheus_config_check
  failed_when: prometheus_config_check.rc != 0
  changed_when: false
  become: true

- name: Validate Prometheus alerting rules
  ansible.builtin.command: promtool check rules /etc/prometheus/rules/alert-rules.yml
  register: prometheus_rules_check
  failed_when: prometheus_rules_check.rc != 0
  changed_when: false
  become: true

- name: Display configuration validation results
  ansible.builtin.debug:
    msg: |
      [OK] Configuration Validation Results:

      Prometheus Config: {{ 'Valid' if prometheus_config_check.rc == 0 else 'Invalid' }}
      Prometheus Rules: {{ 'Valid' if prometheus_rules_check.rc == 0 else 'Invalid' }}

      Configuration files deployed:
      [STATS] /etc/prometheus/prometheus.yml
      🚨 /etc/prometheus/rules/alert-rules.yml
      [NOTE] /etc/loki/loki.yml
      📋 /etc/loki/loki-alert-rules.yml
      🔔 /etc/alertmanager/alertmanager.yml
      📈 /etc/grafana/provisioning/datasources/datasources.yml
      [STATS] /etc/grafana/provisioning/dashboards/dashboards.yml

      All monitoring services ready for restart!
