---
# Handlers for monitoring stack services
# Restart services when configuration changes

# reload systemd uses common handler

- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
  become: true

- name: Restart alertmanager
  ansible.builtin.systemd:
    name: prometheus-alertmanager
    state: restarted
  become: true

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  become: true

- name: Restart loki
  ansible.builtin.systemd:
    name: loki
    state: restarted
  become: true

- name: Restart uptime-kuma
  ansible.builtin.systemd:
    name: uptime-kuma
    state: restarted
  become: true
