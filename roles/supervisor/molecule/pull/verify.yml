---
- name: Verify supervisor pull
  hosts: all
  become: true
  vars_files: [../shared/vars.yml]
  vars:
    molecule_ssh: >-
      -i /etc/supervisor/dns-pull.key -o IdentitiesOnly=yes -o BatchMode=yes
      -o UserKnownHostsFile=/etc/supervisor/dns-pull.known_hosts -o StrictHostKeyChecking=yes
      -o Port={{ molecule_ssh_port }}
  tasks:
    - name: Try a shell command with the pull key
      ansible.builtin.shell: "ssh {{ molecule_ssh }} puller@127.0.0.1 'echo shell-ran-as-$(id -un)'"
      register: molecule_shell
      changed_when: false
      failed_when: false

    - name: Try to upload through sftp with the pull key
      ansible.builtin.shell: >-
        echo 'put /etc/hostname /home/puller/export/uploaded' | sftp {{ molecule_ssh }} -b - puller@127.0.0.1
      register: molecule_put
      changed_when: false
      failed_when: false

    - name: Look for the uploaded file
      ansible.builtin.stat:
        path: /home/puller/export/uploaded
      register: molecule_uploaded

    # The forced sftp-server -R is the whole remote-side defence: no shell, and no writes even for an sftp client.
    - name: Assert the key is sftp-only and read-only
      ansible.builtin.assert:
        that:
          - "'shell-ran-as' not in molecule_shell.stdout"
          - molecule_put.rc != 0
          - not molecule_uploaded.stat.exists
        fail_msg: >-
          shell: {{ molecule_shell.stdout }}; put rc {{ molecule_put.rc }};
          uploaded {{ molecule_uploaded.stat.exists }}
        quiet: true

    - name: List the snapshots the deploy took
      ansible.builtin.command: /usr/local/libexec/restic/restic-job exec dns snapshots --json
      register: molecule_deploy_snapshots
      changed_when: false

    # Converge ran twice (idempotence), so exactly one snapshot proves the first-run task ran once and then held off.
    - name: Assert the deploy took exactly one first snapshot
      ansible.builtin.assert:
        that: (molecule_deploy_snapshots.stdout | from_json) | length == 1
        fail_msg: "snapshots after converge: {{ molecule_deploy_snapshots.stdout }}"
        quiet: true

    - name: Run the pull job
      ansible.builtin.command: systemctl start restic-job@dns.service
      changed_when: true

    - name: List the new snapshot
      ansible.builtin.command: /usr/local/libexec/restic/restic-job exec dns ls latest
      register: molecule_snapshot
      changed_when: false

    - name: Read the snapshot's host and tags
      ansible.builtin.command: /usr/local/libexec/restic/restic-job exec dns snapshots --json
      register: molecule_snapshot_meta
      changed_when: false

    - name: Assert the snapshot holds the exported file under the mount path, filed as the pulled host
      vars:
        snapshots: "{{ molecule_snapshot_meta.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - "'/mnt/restic-pull/dns/data.txt' in molecule_snapshot.stdout"
          - snapshots | length == 2
          - snapshots[0].hostname == 'dns'
          - snapshots[0].tags | sort == ['debian-13', 'dns']
        fail_msg: "snapshot wrong: {{ molecule_snapshot.stdout }} {{ molecule_snapshot_meta.stdout }}"
        quiet: true

    - name: Read the mount unit's state after the job
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ molecule_mount_unit }}"]
      register: molecule_mount_after
      changed_when: false
      failed_when: false

    - name: Assert the mount stopped with the job
      ansible.builtin.assert:
        that: molecule_mount_after.stdout == 'inactive'
        fail_msg: "mount unit is {{ molecule_mount_after.stdout }} after the job"
        quiet: true

    - name: Make the export older than the job's freshness limit
      ansible.builtin.command: touch -d '3 days ago' /home/puller/export
      changed_when: true

    - name: Run the pull job on the stale export
      ansible.builtin.command: systemctl start restic-job@dns.service
      register: molecule_stale
      changed_when: false
      failed_when: false

    - name: Read the stale run's log
      ansible.builtin.command: journalctl -u restic-job@dns.service --no-pager --since '-5min'
      register: molecule_stale_log
      changed_when: false

    - name: Assert the stale export is refused and not snapshotted again
      ansible.builtin.assert:
        that:
          - molecule_stale.rc != 0
          - "'not updated in the last 26 h' in molecule_stale_log.stdout"
        fail_msg: "stale run: rc {{ molecule_stale.rc }}, {{ molecule_stale_log.stdout }}"
        quiet: true

    - name: Count the snapshots
      ansible.builtin.command: /usr/local/libexec/restic/restic-job exec dns snapshots --json
      register: molecule_snapshots_after
      changed_when: false

    - name: Assert the refused run added no snapshot
      ansible.builtin.assert:
        that: (molecule_snapshots_after.stdout | from_json) | length == 2
        fail_msg: "snapshots: {{ molecule_snapshots_after.stdout }}"
        quiet: true

    # sshfs numbers inodes per mount in the order files are looked up. Two runs over mounts that looked the files up
    # in opposite orders see different inode numbers for every unmodified file; only ignore_inode keeps restic from
    # reading them all again.
    - name: Create a tree of unmodified files and make the export fresh again
      ansible.builtin.shell: |
        set -eu
        for d in $(seq 1 10); do
          mkdir -p "/home/puller/export/tree/d$d"
          for f in $(seq 1 20); do echo "$d-$f" > "/home/puller/export/tree/d$d/f$f"; done
        done
        chown -R puller /home/puller/export/tree
        touch /home/puller/export
      args:
        executable: /bin/bash
      changed_when: true

    - name: Back up the tree over a mount that restic walks itself
      ansible.builtin.command: systemctl start restic-job@dns.service
      changed_when: true

    - name: Hold a new mount and look the files up in reverse order
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=molecule-reverse-lookup
          - --property=RequiresMountsFor=/mnt/restic-pull/dns
          - /bin/sh
          - -c
          - >-
            find /mnt/restic-pull/dns -type f | sort -r | xargs stat -c %i > /tmp/molecule-reverse-inodes;
            sleep 300
      changed_when: true

    - name: Wait until the reverse lookup is done
      ansible.builtin.wait_for:
        path: /tmp/molecule-reverse-inodes
        search_regex: '^[0-9]+$'
        timeout: 60

    - name: Back up the unchanged tree over the reverse-numbered mount
      ansible.builtin.command: systemctl start restic-job@dns.service
      changed_when: true

    - name: Release the held mount
      ansible.builtin.command: systemctl stop molecule-reverse-lookup.service
      changed_when: true

    - name: Read the summary of the last run
      ansible.builtin.shell: >-
        set -o pipefail; journalctl -u restic-job@dns.service --no-pager -o cat
        | grep 'restic-job: summary' | tail -n 1
      args:
        executable: /bin/bash
      register: molecule_reverse_summary
      changed_when: false

    - name: Assert restic read none of the unmodified files again
      ansible.builtin.assert:
        that:
          - molecule_reverse_summary.stdout is search(' new=0 changed=0 ')
        fail_msg: "second run over a renumbered mount: {{ molecule_reverse_summary.stdout }}"
        quiet: true
