---
# device_type comes from host_vars. There is no auto-detection fallback,
# because a wrong guess would silently mis-size container limits.
# A device_type missing from this map fails the role.
hardware_device_platforms:
  rpi4b: rpi4
  rpi3b: rpi3
  rpi2b: rpi2
  rpizero2w: rpizero2w
  rpi02w: rpizero2w
  rpizero2: rpizero2w
  debian: pc
  debian_vm: pc
  cloud_vm: pc
  arch_linux: pc

# Per-service resource limits by platform.
# Only navidrome is listed, because it is the only compose service in roles/media that reads hardware_limits.
hardware_profiles:
  rpi4:
    navidrome:
      memory: "512M"
      cpus: "1.5"
      memory_reservation: "256M"
      cpus_reservation: "0.75"
  # The board has 512MB RAM, so the caps keep containers from starving Pi-hole and sshd on the same board.
  rpizero2w:
    navidrome:
      memory: "160M"
      cpus: "0.75"
      memory_reservation: "96M"
      cpus_reservation: "0.5"
  rpi3:
    # Page cache counts against the memory limit, and a smaller limit evicted the 65 MB database
    # and the cover thumbnails on every browse.
    # The CPU limit is sized for scans and thumbnails, because playback uses under 1% of a core.
    navidrome:
      memory: "512M"
      cpus: "2.0"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
  # No rpi2-specific numbers are measured, so this is a conservative sizing.
  rpi2:
    navidrome:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
  pc:
    navidrome:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
