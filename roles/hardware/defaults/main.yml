---
# hardware role defaults - hardware platform detection and resource limits.
# Consumed by roles/hardware/tasks/main.yml (hardware_limits) and published as
# hardware_platform / hardware_details / hardware_limits.
# Extracted from the old roles/common/tasks/detect_hardware.yml +
# common_hardware_profiles.
#
# device_type comes from host_vars (no auto-detection fallback: every host in
# this inventory sets it explicitly, and a wrong guess silently mis-sizes
# container limits). pc and unknown intentionally carry three extra services
# (grafana, prometheus, loki) that rpi4/rpi3 do not - do not normalize this away.
hardware_profiles:
  rpi4:
    traefik:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    influxdb3:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    vaultwarden:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    navidrome:
      memory: "512M"
      cpus: "1.5"
      memory_reservation: "256M"
      cpus_reservation: "0.75"
    portainer:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    beets:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    dozzle:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
  rpi3:
    traefik:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    influxdb3:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.75"
    vaultwarden:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    navidrome:
      memory: "256M"
      cpus: "1.0"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    portainer:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    beets:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
    dozzle:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
  pc:
    traefik:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    influxdb3:
      memory: "2G"
      cpus: "4.0"
      memory_reservation: "1G"
      cpus_reservation: "2.0"
    vaultwarden:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    navidrome:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    portainer:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    grafana:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    prometheus:
      memory: "2G"
      cpus: "4.0"
      memory_reservation: "1G"
      cpus_reservation: "2.0"
    loki:
      memory: "1G"
      cpus: "2.0"
      memory_reservation: "512M"
      cpus_reservation: "1.0"
    beets:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    dozzle:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
  unknown: &hardware_profile_conservative
    traefik:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    influxdb3:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    vaultwarden:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    navidrome:
      memory: "256M"
      cpus: "0.75"
      memory_reservation: "128M"
      cpus_reservation: "0.5"
    portainer:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    grafana:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    prometheus:
      memory: "512M"
      cpus: "1.0"
      memory_reservation: "256M"
      cpus_reservation: "0.5"
    loki:
      memory: "256M"
      cpus: "0.5"
      memory_reservation: "128M"
      cpus_reservation: "0.25"
    beets:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
    dozzle:
      memory: "128M"
      cpus: "0.25"
      memory_reservation: "64M"
      cpus_reservation: "0.1"
  # rpi2 previously had no branch at all, leaving hardware_limits undefined
  # for device_type: rpi2b - reuse the conservative "unknown" profile here
  # until real rpi2-specific numbers are measured.
  rpi2: *hardware_profile_conservative
