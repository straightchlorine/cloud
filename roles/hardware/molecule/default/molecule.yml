---
role_name_check: 0
driver:
  name: podman
platforms:
  - name: test
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
provisioner:
  name: ansible
  env:
    # CI/local both run `cd roles/hardware && molecule test`, so
    # MOLECULE_PROJECT_DIRECTORY is roles/hardware - one level up is roles/,
    # letting the converge's `include_role: name: hardware` resolve by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
