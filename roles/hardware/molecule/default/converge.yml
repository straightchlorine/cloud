---
- name: Converge - hardware discovery role
  hosts: all
  gather_facts: true
  become: true
  vars:
    # device_type is required (no auto-detect fallback) - see
    # roles/hardware/tasks/main.yml.
    device_type: rpi4b
  tasks:
    - name: Run hardware discovery
      ansible.builtin.include_role:
        name: hardware
