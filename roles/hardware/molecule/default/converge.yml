---
- name: Converge - hardware discovery role
  hosts: all
  gather_facts: true
  become: true
  vars:
    # device_type is required (no auto-detect fallback) - see
    # roles/hardware/tasks/main.yml. Overridable to exercise other platform
    # branches without editing this file, e.g.:
    #   MOLECULE_DEVICE_TYPE=rpizero2w molecule converge
    # (default(..., true) so an unset env var - which looks up as "" - falls
    # back to rpi4b.)
    device_type: "{{ lookup('env', 'MOLECULE_DEVICE_TYPE') | default('rpi4b', true) }}"
  tasks:
    - name: Run hardware discovery
      ansible.builtin.include_role:
        name: hardware
