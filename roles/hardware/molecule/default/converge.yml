---
- name: Converge - hardware discovery role
  hosts: all
  gather_facts: true
  become: true
  vars:
    # device_type is required (no auto-detect fallback) - see
    # roles/hardware/tasks/main.yml.
    # default(..., true) because an unset env var looks up as "".
    device_type: "{{ lookup('env', 'MOLECULE_DEVICE_TYPE') | default('rpi4b', true) }}"
  tasks:
    - name: Run hardware discovery
      ansible.builtin.include_role:
        name: hardware
