---
- name: Verify hardware discovery
  hosts: all
  gather_facts: true
  become: true
  vars:
    # The facts the role sets live only in the process that ran it.
    # Verify therefore runs the role itself, once per device_type.
    hardware_expected:
      rpi4b: rpi4
      rpi3b: rpi3
      rpizero2w: rpizero2w
      debian: pc
      debian_vm: pc
      cloud_vm: pc
      arch_linux: pc
  tasks:
    - name: Run the hardware role for every supported device_type
      ansible.builtin.include_tasks: per_device.yml
      loop: "{{ hardware_expected | dict2items }}"
      loop_control:
        loop_var: hardware_case

    - name: Refuse an unlisted device_type with the list of valid ones
      block:
        - name: Run the hardware role with an unknown device_type
          ansible.builtin.include_role:
            name: hardware
          vars:
            device_type: toaster

        - name: Fail the test - the role should have refused
          ansible.builtin.fail:
            msg: "hardware accepted device_type toaster"
      rescue:
        - name: Assert the failure names the device_type and the valid ones
          ansible.builtin.assert:
            that:
              - "'device_type' in ansible_failed_result.msg"
              - "'toaster' in ansible_failed_result.msg"
              - "'rpi3b' in ansible_failed_result.msg"
            fail_msg: "wrong failure: {{ ansible_failed_result.msg | default('') }}"
            success_msg: "[OK] an unknown device_type fails with the valid list"
