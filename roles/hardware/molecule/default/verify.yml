---
- name: Verify hardware discovery
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Assert hardware facts are defined
      # hardware_limits is per-service (hardware_limits.traefik.memory, etc,
      # see hardware_profiles) - traefik is used here just because every
      # platform profile defines it, not because it's special.
      ansible.builtin.assert:
        that:
          - hardware_platform is defined
          - hardware_details is defined
          - hardware_limits is defined
          - hardware_limits.traefik.memory is defined
          - hardware_limits.traefik.cpus is defined
        fail_msg: |
          Hardware facts validation failed:
          hardware_platform: {{ hardware_platform | default('UNDEFINED') }}
          hardware_limits: {{ hardware_limits | default('UNDEFINED') }}

    - name: Verify hardware_platform is valid
      ansible.builtin.assert:
        that:
          - hardware_platform in ['rpi4', 'rpi3', 'rpi2', 'pc', 'unknown']
        fail_msg: "Invalid hardware_platform: {{ hardware_platform }}"

    - name: Display hardware detection results
      ansible.builtin.debug:
        msg: |
          [OK] Hardware Detection:
          - Platform: {{ hardware_platform }}
          - Traefik memory limit: {{ hardware_limits.traefik.memory }}
          - Traefik CPU limit: {{ hardware_limits.traefik.cpus }}
