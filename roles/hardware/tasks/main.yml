---
# Hardware curation: map device_type (host_vars) to a hardware platform and
# resource limit profile. Read-only - sets hardware_platform, hardware_details
# and hardware_limits.
# Extracted from the old roles/common/tasks/detect_hardware.yml.

- name: Fail if device_type is not set
  ansible.builtin.fail:
    msg: "device_type must be set in host_vars (e.g. rpi4b, rpi3b, debian_vm, arch_linux)."
  when: device_type is not defined

- name: Gather system resources
  ansible.builtin.setup:
    gather_subset:
      - hardware
    filter:
      - ansible_memtotal_mb
      - ansible_processor_count
      - ansible_processor_cores
      - ansible_processor_vcpus

- name: Map device_type to a hardware platform
  ansible.builtin.set_fact:
    hardware_platform: >-
      {%- if device_type == 'rpi4b' -%}
        rpi4
      {%- elif device_type == 'rpi3b' -%}
        rpi3
      {%- elif device_type == 'rpi2b' -%}
        rpi2
      {%- elif device_type.endswith('_vm') or device_type.endswith('_pc') -%}
        pc
      {%- else -%}
        {{ device_type }}
      {%- endif -%}

    hardware_details:
      memory_mb: "{{ ansible_memtotal_mb }}"
      cpu_cores: "{{ ansible_processor_cores }}"
      cpu_count: "{{ ansible_processor_count }}"
      vcpus: "{{ ansible_processor_vcpus if ansible_processor_vcpus is defined else ansible_processor_cores }}"

- name: Fail if detected hardware platform has no resource profile
  ansible.builtin.fail:
    msg: >-
      hardware_platform '{{ hardware_platform }}' is not a key of
      hardware_profiles. Valid keys: {{ hardware_profiles.keys() | list }}
  when: hardware_platform not in hardware_profiles

- name: Set hardware-specific resource limits from platform profile
  ansible.builtin.set_fact:
    hardware_limits: "{{ hardware_profiles[hardware_platform] }}"
