---
# Maps device_type (host_vars) to a hardware platform and publishes hardware_platform,
# hardware_details and hardware_limits. Read-only.

- name: Fail if device_type is not set
  ansible.builtin.fail:
    msg: "device_type must be set in host_vars (one of: {{ hardware_device_platforms.keys() | sort | join(', ') }})."
  when: device_type is not defined

- name: Fail if device_type has no hardware platform
  ansible.builtin.fail:
    msg: >-
      device_type '{{ device_type }}' has no hardware platform. Add it to hardware_device_platforms
      or use one of: {{ hardware_device_platforms.keys() | sort | join(', ') }}.
  when: device_type not in hardware_device_platforms

- name: Gather system resources
  ansible.builtin.setup:
    gather_subset:
      - hardware
    filter:
      - ansible_memtotal_mb
      - ansible_processor_count
      - ansible_processor_cores
      - ansible_processor_vcpus

- name: Publish the hardware platform, its resources and its resource limits
  ansible.builtin.set_fact:
    hardware_platform: "{{ hardware_device_platforms[device_type] }}"
    hardware_limits: "{{ hardware_profiles[hardware_device_platforms[device_type]] }}"
    hardware_details:
      memory_mb: "{{ ansible_memtotal_mb }}"
      cpu_cores: "{{ ansible_processor_cores }}"
      cpu_count: "{{ ansible_processor_count }}"
      vcpus: "{{ ansible_processor_vcpus if ansible_processor_vcpus is defined else ansible_processor_cores }}"
