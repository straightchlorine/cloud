---
# Declaration order is execution order at flush.
# firewalld must reload first so the tailnet zone and its port permit are active before sshd rebinds.
# Reloading sshd first would leave a window where it listens on an address the firewall does not yet permit.
- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  become: true

- name: Reload sshd
  # Reload instead of restart, because an aborted restart would lock out everyone.
  # This sshd is the host's only admin path.
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  become: true

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  become: true

- name: Reload systemd (honeypot)
  # The name differs from common's "Reload systemd" so notifications cannot collide across roles.
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# A running timer keeps its old next-elapse time after a daemon-reload alone.
# Only a restart applies a changed OnCalendar or RandomizedDelaySec.
# timer_job.yml sets honeypot_timer_unit before notifying.
- name: Restart honeywatch timer
  ansible.builtin.systemd_service:
    name: "{{ honeypot_timer_unit }}"
    state: restarted
  become: true
