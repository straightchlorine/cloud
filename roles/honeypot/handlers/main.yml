---
# Declaration order is execution order at flush - firewalld must land first
# so the tailnet zone (and its port permit) is already active before sshd
# rebinds to it; sshd-then-firewalld would open a window where the admin
# sshd is listening somewhere the firewall doesn't yet permit reaching.
- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  become: true

- name: Reload sshd
  # reload, never restart: an aborted restart on a host whose only admin path
  # is this sshd locks everyone out.
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  become: true

- name: Restart the honeypot fail2ban jail
  # Named distinctly from common's "Restart fail2ban": both get loaded into
  # this play (common via include_role in validate.yml), and Ansible resolves
  # notify-by-name globally across roles - a shared name here would silently
  # run whichever role's handler collides, not necessarily this one's.
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  become: true

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  become: true

- name: Reload docker
  # live-restore keeps the containers running across the daemon reload.
  ansible.builtin.systemd_service:
    name: docker
    state: reloaded
  become: true

- name: Reload systemd (honeypot)
  # See the fail2ban handler above: named distinctly from common's "Reload
  # systemd" to avoid cross-role notify-by-name collisions.
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# A running timer keeps its old next-elapse time after a daemon-reload alone;
# only a restart makes an OnCalendar/RandomizedDelaySec change actually apply.
# Named distinctly from common's "Restart backup timer", which targets a
# different unit name and requires common_backup_service_name - undefined here.
- name: Restart the honeywatch backup timer
  ansible.builtin.systemd_service:
    name: honeywatch-backup.timer
    state: restarted
  become: true

- name: Restart mmdb refresh timer
  ansible.builtin.systemd_service:
    name: honeywatch-mmdb-refresh.timer
    state: restarted
  become: true
