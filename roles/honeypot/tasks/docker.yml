---
- name: Install and configure Docker
  # live-restore keeps containers running across the daemon restart that a daemon.json change triggers.
  # The icc, log-driver, selinux-enabled and no-new-privileges options are not SIGHUP-reloadable.
  # The options are merged, not overwritten, so keys set out of band such as data-root survive a role run.
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_rpm
    apply:
      tags: [honeypot, docker]
  vars:
    common_docker_rpm_install: "{{ honeypot_docker_install_enabled }}"
    common_docker_daemon_options: "{{ honeypot_docker_daemon_options }}"
    common_docker_daemon_merge: true
