---
- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest  # noqa: package-latest
    exclude: "{{ honeypot_dnf_pinned_packages }}"
  become: true
  when: honeypot_dnf_full_update

- name: Install EPEL
  # rclone and age live in EPEL, so EPEL must be enabled before the base package list is resolved.
  ansible.builtin.dnf:
    name: epel-release
    state: present
  become: true

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ honeypot_base_packages }}"
    state: present
  become: true

- name: Remove fail2ban
  # The admin sshd accepts connections only on the tailnet interface, so a fail2ban jail protects nothing there.
  # An effective jail would only add a self-lockout risk.
  # Both package names are listed because removing fail2ban-server also removes its dependent packages.
  ansible.builtin.dnf:
    name: [fail2ban, fail2ban-server]
    state: absent
  become: true

- name: Enable the cron daemon for the cowrie cleanup job
  ansible.builtin.systemd_service:
    name: crond
    enabled: true
    state: started
  become: true
