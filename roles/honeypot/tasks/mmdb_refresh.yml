---
- name: Install the MaxMind environment file
  ansible.builtin.template:
    src: maxmind.env.j2
    dest: "{{ honeypot_config_dir }}/maxmind.env"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true

- name: Install the MaxMind refresh timer job
  ansible.builtin.include_tasks:
    file: timer_job.yml
    apply:
      tags: [honeypot, mmdb, geoip]
  vars:
    honeypot_timer_job: mmdb-refresh
