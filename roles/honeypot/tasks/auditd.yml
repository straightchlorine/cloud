---
- name: Install the honeypot audit rules
  ansible.builtin.template:
    src: honeypot.rules.j2
    dest: /etc/audit/rules.d/honeypot.rules
    owner: root
    group: root
    mode: '0640'
  become: true
  notify: Reload audit rules

- name: Enable and start auditd
  # This is not systemd_service because auditd refuses `systemctl restart` on EL.
  # The module's state handling trips over that refusal.
  # Enabling and starting is enough, since rule changes go through `augenrules --load` in the handler.
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
    use: service
  become: true
