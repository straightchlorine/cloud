---
- name: Install the ntfy failure-notification handler
  ansible.builtin.template:
    src: honeywatch-notify@.service.j2
    dest: /etc/systemd/system/honeywatch-notify@.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd (honeypot)

- name: Install the ntfy helper script
  # The honeywatch-notify@ unit and the backup and mmdb refresh scripts call this helper.
  ansible.builtin.copy:
    src: honeywatch-ntfy.sh
    dest: /usr/local/sbin/honeywatch-ntfy
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install the ntfy notification credentials
  ansible.builtin.template:
    src: notify.env.j2
    dest: "{{ honeypot_config_dir }}/notify.env"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true
