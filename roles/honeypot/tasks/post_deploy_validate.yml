---
- name: Confirm the administrative sshd is listening on its hardened port
  ansible.builtin.wait_for:
    port: "{{ honeypot_ssh_port }}"
    host: "{{ ansible_host }}"
    timeout: 30
  tags: [post_validation]

- name: Read the effective sshd configuration
  ansible.builtin.command: sshd -T
  become: true
  changed_when: false
  register: honeypot_sshd_effective
  tags: [post_validation]

- name: Assert the effective sshd policy matches the drop-in
  # sshd -T prints the merged effective configuration.
  # A drop-in that lost to an earlier file in sshd_config.d would still look correct on disk.
  ansible.builtin.assert:
    that:
      - "'port ' ~ honeypot_ssh_port in honeypot_sshd_effective.stdout"
      - "'passwordauthentication no' in honeypot_sshd_effective.stdout"
      - "'permitrootlogin no' in honeypot_sshd_effective.stdout"
      - "'x11forwarding no' in honeypot_sshd_effective.stdout"
      - "'gssapiauthentication no' in honeypot_sshd_effective.stdout"
      - "'listenaddress ' ~ honeypot_ssh_listen_address in honeypot_sshd_effective.stdout"
    fail_msg: "The running sshd does not match the hardening drop-in."
    success_msg: "[OK] sshd enforces key-only auth on {{ honeypot_ssh_port }}"
  tags: [post_validation]

- name: Read the active firewalld zones
  ansible.builtin.command: firewall-cmd --get-active-zones
  become: true
  changed_when: false
  register: honeypot_active_zones
  tags: [post_validation]

- name: Assert the tailnet zone is bound to the tailnet interface
  # An inactive tailnet zone leaves the admin sshd unreachable, which is the fail-closed design.
  # That makes it a deploy failure, not a warning.
  ansible.builtin.assert:
    that:
      - honeypot_tailnet_interface in ansible_facts['interfaces']
      - honeypot_tailnet_zone in honeypot_active_zones.stdout
      - honeypot_tailnet_interface in honeypot_active_zones.stdout
    fail_msg: >-
      Zone '{{ honeypot_tailnet_zone }}' is not bound to
      '{{ honeypot_tailnet_interface }}'. Bring the tailnet up
      (`tailscale up --login-server=...`) and re-run.
    success_msg: "[OK] {{ honeypot_tailnet_zone }} zone is bound to {{ honeypot_tailnet_interface }}"
  tags: [post_validation]

- name: Confirm the cowrie port is published to the internet
  ansible.builtin.command: firewall-cmd --zone=public --list-ports
  become: true
  changed_when: false
  register: honeypot_public_ports
  failed_when: honeypot_public_ports.stdout.split() != [honeypot_cowrie_public_port ~ '/tcp']
  tags: [post_validation]

- name: Read the services open on the public zone
  ansible.builtin.command: firewall-cmd --zone=public --list-services
  become: true
  changed_when: false
  register: honeypot_public_services
  tags: [post_validation]

- name: Assert no service is open on the public zone
  ansible.builtin.assert:
    that:
      - honeypot_public_services.stdout | trim == ''
    fail_msg: "The public zone exposes services: {{ honeypot_public_services.stdout | trim }}"
    success_msg: "[OK] public zone exposes only the cowrie port"
  tags: [post_validation]

- name: Read the cowrie ingress network configuration
  # The public cowrie path is DNATed onto this bridge, and compose disables masquerade on it.
  # The stack deploys after this role, so an absent network is not a failure but a misconfigured one is.
  # The docker-info check below covers a dead daemon.
  ansible.builtin.command: >-
    docker network inspect honeywatch_cowrie-ingress --format
    '{{ '{{' }}index .Options "com.docker.network.bridge.name"{{ '}}' }}
    {{ '{{' }}index .Options "com.docker.network.bridge.enable_ip_masquerade"{{ '}}' }}'
  become: true
  changed_when: false
  failed_when: false
  register: honeypot_cowrie_ingress_network
  tags: [post_validation]

- name: Assert the cowrie ingress bridge stays masquerade-free
  # Masquerade must be explicitly disabled and the bridge name must match honeypot_cowrie_ingress_bridge.
  # Anything else fails the deploy.
  ansible.builtin.assert:
    that:
      - honeypot_cowrie_ingress_network.stdout is match('^' ~ honeypot_cowrie_ingress_bridge ~ ' false$')
    fail_msg: >-
      honeywatch_cowrie-ingress must use bridge '{{ honeypot_cowrie_ingress_bridge }}'
      with masquerade disabled - otherwise the public :22 path can double as cowrie
      egress. Observed: '{{ honeypot_cowrie_ingress_network.stdout | trim }}'.
    success_msg: "[OK] cowrie ingress bridge {{ honeypot_cowrie_ingress_bridge }} has masquerade disabled"
  when: honeypot_cowrie_ingress_network.rc == 0
  tags: [post_validation]

- name: Read the loaded audit rules
  ansible.builtin.command: auditctl -l
  become: true
  changed_when: false
  register: honeypot_audit_loaded
  tags: [post_validation]

- name: Assert every configured audit watch is loaded
  # auditctl -l reports directory watches without their trailing slash, as in `-w /etc/ssh/sshd_config.d`.
  # The comparison therefore strips the slash from the configured path too.
  ansible.builtin.assert:
    that:
      - item.path.rstrip('/') in honeypot_audit_loaded.stdout
    fail_msg: "Audit watch for {{ item.path }} is not loaded (augenrules --load failed?)"
    quiet: true
  loop: "{{ honeypot_audit_watches }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [post_validation]

- name: Confirm the local SELinux policy module is loaded
  ansible.builtin.command: semodule -l
  become: true
  changed_when: false
  register: honeypot_semodule_loaded
  failed_when: honeypot_selinux_module not in honeypot_semodule_loaded.stdout
  tags: [post_validation]

- name: Read the effective Docker daemon settings
  ansible.builtin.command: >-
    docker info --format
    '{{ '{{' }}.LiveRestoreEnabled{{ '}}' }} {{ '{{' }}.SecurityOptions{{ '}}' }}
    {{ '{{' }}.LoggingDriver{{ '}}' }}'
  become: true
  changed_when: false
  register: honeypot_docker_info
  tags: [post_validation]

- name: Assert the Docker daemon hardening took effect
  # daemon.json on disk proves nothing until the daemon has reloaded it.
  ansible.builtin.assert:
    that:
      - "'true' in honeypot_docker_info.stdout"
      - "'selinux' in honeypot_docker_info.stdout"
      - honeypot_docker_info.stdout.split()[-1] == 'json-file'
    fail_msg: >-
      Docker is running without live-restore, SELinux confinement or json-file
      logging: {{ honeypot_docker_info.stdout }}
    success_msg: "[OK] Docker daemon hardening active"
  tags: [post_validation]

- name: Confirm the honeywatch timers are active
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  become: true
  register: honeypot_timer_state
  failed_when: honeypot_timer_state.status.ActiveState != 'active'
  loop: "{{ ['dnf-automatic.timer']
            + (['honeywatch-backup.timer'] if honeypot_backup_enabled else [])
            + (['honeywatch-mmdb-refresh.timer'] if honeypot_mmdb_enabled else [])
            + (['honeywatch-image-prune.timer'] if honeypot_image_prune_enabled else []) }}"
  tags: [post_validation]

- name: Read the dnf-automatic timer and service state
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  become: true
  register: honeypot_dnf_units
  loop: [dnf-automatic.timer, dnf-automatic.service]
  tags: [post_validation]

- name: Confirm the dnf-automatic timer is enabled and the OnFailure handler is wired
  # Depends on the flush_handlers in main.yml so the drop-in is loaded.
  ansible.builtin.assert:
    that:
      - honeypot_dnf_units.results[0].status.UnitFileState == 'enabled'
      - "'honeywatch-notify@dnf-automatic.service' in honeypot_dnf_units.results[1].status.OnFailure"
    quiet: true
  tags: [post_validation]

- name: Dry-run dnf-automatic against the live repositories
  # This proves automatic.conf parses and the enabled repos resolve.
  # Unreachable vendor repos are skipped by design through skip_if_unavailable.
  ansible.builtin.command: dnf-automatic --no-installupdates --no-downloadupdates /etc/dnf/automatic.conf
  become: true
  changed_when: false
  tags: [post_validation]

- name: Read the installed rpm packages
  ansible.builtin.package_facts:
    manager: rpm
  when: honeypot_auto_updates_reboot == 'when-needed'
  tags: [post_validation]

- name: Confirm the kernel meta-package is installed for the when-needed reboot trigger
  # The dnf-automatic setting reboot=when-needed matches the package name `kernel`.
  # An image with only kernel-core would install kernels and never reboot into them.
  ansible.builtin.assert:
    that: "'kernel' in ansible_facts.packages"
    quiet: true
  when: honeypot_auto_updates_reboot == 'when-needed'
  tags: [post_validation]

- name: Confirm the age recipient is installed and public
  ansible.builtin.command: "grep -c '^age1' {{ honeypot_backup_age_recipient_file }}"
  become: true
  changed_when: false
  when: honeypot_backup_enabled
  tags: [post_validation]
