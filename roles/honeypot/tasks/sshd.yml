---
- name: Install the sshd hardening drop-in
  # The 45 prefix loads this file before 50-redhat.conf, which would otherwise win
  # (first value wins) for X11Forwarding and GSSAPIAuthentication.
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/45-honeypot-hardening.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload sshd

- name: Remove the stale 99-hardening.conf drop-in
  # The role's own drop-in must be the only one in effect, so no other copy can show settings
  # that differ from what applies.
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent
  become: true
  notify: Reload sshd

- name: Validate the sshd configuration
  # This runs before handlers flush, so a broken config aborts the play while the old sshd still serves.
  # That sshd is the only admin path into the host.
  ansible.builtin.command: sshd -t
  become: true
  changed_when: false

- name: Gather service facts to check for sshd.socket
  ansible.builtin.service_facts:

- name: Mask sshd.socket so sshd.service owns the listener exclusively
  # Socket activation and sshd.service race for the port.
  # The loser reports "Address already in use" on the reload that moves sshd to its new port.
  ansible.builtin.systemd_service:
    name: sshd.socket
    state: stopped
    enabled: false
    masked: true
  become: true
  when: "'sshd.socket' in ansible_facts['services']"

- name: Enable and start sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: true
    state: started
  become: true
