---
- name: Confirm SELinux is enforcing
  # The container and unit sandboxing in this role assumes Enforcing.
  # A Permissive host would silently lose that layer while every check still looks green.
  ansible.builtin.assert:
    that:
      - ansible_facts['selinux']['status'] == 'enabled'
      - ansible_facts['selinux']['mode'] == 'enforcing'
    fail_msg: >-
      SELinux is '{{ ansible_facts['selinux']['mode']
      if ansible_facts['selinux']['status'] == 'enabled' else 'disabled' }}'.
      Set SELINUX=enforcing in /etc/selinux/config and reboot before deploying.
    success_msg: "[OK] SELinux is enforcing"

- name: Label the administrative sshd port
  # The default policy labels only 22/tcp as ssh_port_t.
  # Without this label, sshd exits 255 with "Bind to port {{ honeypot_ssh_port }} ... Permission denied".
  community.general.seport:
    ports: "{{ honeypot_ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  become: true

- name: Register the honeywatch config directory as etc_t
  # systemd reads the units' EnvironmentFile from here.
  # An unlabelled directory makes the backup and mmdb units fail to start under Enforcing.
  community.general.sefcontext:
    target: "{{ honeypot_config_dir }}(/.*)?"
    setype: etc_t
    state: present
  become: true

- name: Create the honeywatch config directory
  ansible.builtin.file:
    path: "{{ honeypot_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

- name: Apply the file context to the config directory
  # This runs unconditionally and reports no change, because restorecon does nothing once the labels match.
  # It cannot be a handler, since the backup and mmdb env files are written into this directory later in the play.
  ansible.builtin.command: "restorecon -R {{ honeypot_config_dir }}"
  become: true
  changed_when: false

- name: Register the ingestor metrics directory as container_file_t
  # The compose bind mount deliberately carries no :z or :Z option.
  # The label therefore has to exist on the host path for the container to write there under Enforcing.
  community.general.sefcontext:
    target: "{{ honeypot_metrics_dir }}(/.*)?"
    setype: container_file_t
    state: present
  become: true

- name: Create the honeywatch state parent directory
  ansible.builtin.file:
    path: "{{ honeypot_metrics_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create the ingestor metrics directory
  # This must exist before the honeywatch release mounts it.
  # Otherwise Docker creates it root-owned and the ingestor cannot write.
  ansible.builtin.file:
    path: "{{ honeypot_metrics_dir }}"
    state: directory
    owner: "{{ honeypot_ingestor_uid }}"
    group: "{{ honeypot_ingestor_uid }}"
    mode: '0755'
  become: true

- name: Apply the file context to the metrics directory
  # This is the same unconditional restorecon as for the config directory above.
  ansible.builtin.command: "restorecon -R {{ honeypot_metrics_dir }}"
  become: true
  changed_when: false

- name: Install the local SELinux policy source
  ansible.builtin.copy:
    src: honeywatch-nnp.te
    dest: "/etc/selinux/{{ honeypot_selinux_module }}.te"
    owner: root
    group: root
    mode: '0644'
  become: true
  register: honeypot_selinux_te

- name: Check whether the local SELinux policy module is loaded
  ansible.builtin.command: semodule -l
  become: true
  changed_when: false
  register: honeypot_semodule_list

- name: Compile and load the local SELinux policy module
  # Without this module, units that set NoNewPrivileges=yes and run docker fail under Enforcing.
  # They hit an nnp_transition AVC denial on the domain transition that docker's labelled exec triggers.
  ansible.builtin.shell: |
    set -euo pipefail
    build=$(mktemp -d)
    trap 'rm -rf "$build"' EXIT
    cp /etc/selinux/{{ honeypot_selinux_module }}.te "$build/"
    cd "$build"
    checkmodule -M -m -o {{ honeypot_selinux_module }}.mod {{ honeypot_selinux_module }}.te
    semodule_package -o {{ honeypot_selinux_module }}.pp -m {{ honeypot_selinux_module }}.mod
    semodule -i {{ honeypot_selinux_module }}.pp
  become: true
  when: honeypot_selinux_te.changed or honeypot_selinux_module not in honeypot_semodule_list.stdout
  changed_when: true
