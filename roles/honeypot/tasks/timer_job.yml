---
# Installs one systemd timer job as a script, a oneshot service and a timer named honeywatch-<job>.
# The honeypot_timer_job variable is backup, mmdb-refresh or image-prune.
# backup.yml and mmdb_refresh.yml install their units' env files before including this file.
- name: Publish the timer unit name for the restart handler
  # Handlers do not see the include's vars, only host facts, so the unit name is published as a fact.
  ansible.builtin.set_fact:
    honeypot_timer_unit: "honeywatch-{{ honeypot_timer_job }}.timer"

- name: Install the timer job script
  ansible.builtin.copy:
    src: "honeywatch-{{ honeypot_timer_job }}.sh"
    dest: "/usr/local/sbin/honeywatch-{{ honeypot_timer_job }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install the timer job service and timer
  ansible.builtin.template:
    src: "honeywatch-{{ honeypot_timer_job }}.{{ item }}.j2"
    dest: "/etc/systemd/system/honeywatch-{{ honeypot_timer_job }}.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop:
    - service
    - timer
  notify:
    - Reload systemd (honeypot)
    - Restart honeywatch timer

- name: Flush handlers so systemd sees the units before they are enabled
  # The flush also runs the restart handler while honeypot_timer_unit still names this job.
  ansible.builtin.meta: flush_handlers

- name: Enable the timer job timer
  # Only the timer is enabled, because the oneshot service is triggered by it.
  ansible.builtin.systemd_service:
    name: "{{ honeypot_timer_unit }}"
    enabled: true
  become: true
