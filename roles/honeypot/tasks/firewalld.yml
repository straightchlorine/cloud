---
- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
  become: true

# Do not move docker0 or br-* interfaces into another zone, such as trusted.
# Docker manages its own firewalld zone for them, and a manual move raises ZONE_CONFLICT.
- name: Install the tailnet zone definition
  # The zone is declared as XML because `firewall-cmd --new-zone` reports NAME_CONFLICT against this file.
  # If the tailnet interface is absent the zone is inactive, which fails closed.
  ansible.builtin.template:
    src: tailnet.xml.j2
    dest: "/etc/firewalld/zones/{{ honeypot_tailnet_zone }}.xml"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload firewalld

- name: Expose the cowrie port in the public zone
  ansible.posix.firewalld:
    zone: public
    port: "{{ honeypot_cowrie_public_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true

# This runs after the explicit cowrie port above, so that port is never closed
# while the `ssh` service is withdrawn.
- name: Remove default services from the public zone
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: disabled
  become: true
  loop: "{{ honeypot_public_zone_removed_services }}"
