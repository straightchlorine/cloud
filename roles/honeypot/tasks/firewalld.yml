---
- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
  become: true

# Do not add docker0/br-* to trusted: Docker 27+ manages its own docker zone and
# a manual move raises ZONE_CONFLICT.
- name: Install the tailnet zone definition
  # The zone is declared as XML rather than assembled with --new-zone/--add-port:
  # --new-zone NAME_CONFLICTs against this file. If tailscale0 is absent the zone
  # is simply inactive - fail-closed.
  ansible.builtin.template:
    src: tailnet.xml.j2
    dest: "/etc/firewalld/zones/{{ honeypot_tailnet_zone }}.xml"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload firewalld

- name: Expose the cowrie port in the public zone
  ansible.posix.firewalld:
    zone: public
    port: "{{ honeypot_cowrie_public_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true

# Runs after the explicit 22/tcp above so the cowrie port is never momentarily
# closed while the `ssh` service is withdrawn.
- name: Remove default services from the public zone
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: disabled
  become: true
  loop: "{{ honeypot_public_zone_removed_services }}"
