---
- name: Add the Tailscale repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: "{{ honeypot_tailscale_repo_baseurl }}"
    gpgkey: "{{ honeypot_tailscale_repo_gpgkey }}"
    gpgcheck: true
    repo_gpgcheck: false
    enabled: true
  become: true

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
  become: true

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  become: true

# `tailscale up` stays manual: it needs a Headscale auth key, and re-running it
# against the interface this play is connected over can drop the session.
# The post-deploy check asserts the tailnet interface is present.
