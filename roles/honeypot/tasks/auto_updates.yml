---
- name: Install the dnf-automatic configuration
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Create the dnf-automatic service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnf-automatic.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Alert via ntfy when an unattended patch run fails
  # A failed run, such as a repo outage, a GPG failure or a failed reboot_command,
  # would otherwise appear only in the journal.
  # notify.yml installs honeywatch-notify@ later in the play, and a drop-in does not need its target unit to exist yet.
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnf-automatic.service.d/10-notify.conf
    content: |
      [Unit]
      OnFailure=honeywatch-notify@%n.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd (honeypot)

- name: Enable the dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started
  become: true
