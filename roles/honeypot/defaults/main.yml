---
# Host configuration for the public-facing honeywatch honeypot VPS. The application
# stack is deployed by the honeywatch release workflow, so this role owns only the
# host it runs on.

honeypot_config_dir: /etc/honeywatch
honeypot_stack_dir: /opt/honeywatch

# Bridge name the compose stack pins for its cowrie-ingress network.
# The post-deploy check requires masquerade to be off on it, so the public
# cowrie path cannot double as cowrie egress.
honeypot_cowrie_ingress_bridge: br-cowrie-ing

# --- Fail-fast validation -----------------------------------------------------
# validate.yml consumes these lists. The backup and mmdb lists apply only when the
# matching feature is enabled.
honeypot_required_variables:
  - honeypot_ssh_port
  - honeypot_tailnet_interface
  - honeypot_stack_dir
  - ntfy_server_url
  - vault_honeypot_ntfy_token

honeypot_backup_required_variables:
  - vault_honeypot_r2_bucket
  - vault_honeypot_r2_endpoint
  - vault_honeypot_r2_access_key_id
  - vault_honeypot_r2_secret_access_key
  - vault_honeypot_age_recipient

honeypot_mmdb_required_variables:
  - vault_honeypot_maxmind_account_id
  - vault_honeypot_maxmind_license_key

# --- Packages -----------------------------------------------------------------
honeypot_base_packages:
  - firewalld
  - audit
  - dnf-automatic
  - dnf-utils
  - dnf-plugins-core
  - policycoreutils-python-utils
  - checkpolicy
  - cronie
  - tar
  - git
  - curl
  # The backup script uploads with rclone and encrypts with age.
  - rclone
  - age

honeypot_tailscale_repo_baseurl: "https://pkgs.tailscale.com/stable/centos/10/$basearch"
honeypot_tailscale_repo_gpgkey: "https://pkgs.tailscale.com/stable/centos/10/repo.gpg"

# --- sshd ---------------------------------------------------------------------
# Cowrie owns the public cowrie port, so the admin sshd listens on this one.
# firewalld exposes it only in the tailnet zone.
honeypot_ssh_port: 2022
honeypot_ssh_allow_users:
  - deploy
  - admin
# Binding the admin sshd to the tailnet address keeps the listener off-tailnet even
# if the firewalld zone is misconfigured. The address comes from the interface fact,
# so tailscaled must have brought it up first. Setting 0.0.0.0 leaves firewalld as the only ACL.
honeypot_ssh_listen_address: "{{ ansible_facts[honeypot_tailnet_interface]['ipv4']['address'] }}"

# When false, the drop-in leaves Ciphers, MACs, KexAlgorithms and HostKeyAlgorithms unset.
# On EL, /etc/crypto-policies is included ahead of sshd_config.d and the first value wins.
# Change the system crypto policy instead of adding directives that have no effect.
honeypot_ssh_manage_crypto_directives: false

# --- firewalld ----------------------------------------------------------------
honeypot_tailnet_zone: tailnet
honeypot_tailnet_interface: tailscale0
# Extra tailnet-only ports beyond the admin sshd (set in host_vars).
honeypot_tailnet_extra_ports: []
honeypot_cowrie_public_port: 22
# Only cowrie is exposed publicly, so the public zone drops the services CentOS enables by default.
honeypot_public_zone_removed_services:
  - dhcpv6-client
  - cockpit
  # firewalld.yml opens the cowrie port explicitly. Keeping the `ssh` service would also
  # open whatever a future firewalld ships in that service definition.
  - ssh

# --- Updates (dnf-automatic + opt-in full update) -----------------------------
# CentOS Stream publishes no errata metadata, so a `security` run would match nothing
# and apply no updates. validate.yml refuses `security` on Stream.
honeypot_auto_updates_upgrade_type: default
# The timer schedule and the reboot triggers are in roles/honeypot/README.md under "Automatic updates".
honeypot_auto_updates_reboot: when-needed
# dnf-automatic already applies every update, so a full update in the play is opt-in.
# dnf-automatic reboots only after a run that installed a kernel itself.
# A kernel from this path or from a manual `dnf update` therefore needs a manual reboot.
honeypot_dnf_full_update: false
# Packages a role pins to an exact version, such as alloy via alloy_version.
# Both update paths skip them, so they move only when the pin is bumped.
honeypot_dnf_pinned_packages:
  - alloy

# --- Kernel hardening ---------------------------------------------------------
# user.max_user_namespaces = 0 blocks rootless containers and userns-remap.
# This is safe because honeypot_docker_daemon_options runs rootful Docker without userns-remap.
# Raise it before enabling either.
honeypot_sysctl_settings:
  kernel.kptr_restrict: '2'
  kernel.dmesg_restrict: '1'
  kernel.unprivileged_bpf_disabled: '1'
  user.max_user_namespaces: '0'
  kernel.kexec_load_disabled: '1'
  kernel.sysrq: '0'
  kernel.yama.ptrace_scope: '1'
  net.core.bpf_jit_harden: '2'
  net.ipv4.tcp_syncookies: '1'
  net.ipv4.tcp_rfc1337: '1'
  net.ipv4.conf.all.rp_filter: '1'
  net.ipv4.conf.default.rp_filter: '1'
  net.ipv4.conf.all.accept_source_route: '0'
  net.ipv4.conf.default.accept_source_route: '0'
  net.ipv4.conf.all.accept_redirects: '0'
  net.ipv4.conf.default.accept_redirects: '0'
  net.ipv4.conf.all.send_redirects: '0'
  net.ipv4.conf.default.send_redirects: '0'
  net.ipv4.conf.all.log_martians: '1'
  net.ipv4.icmp_echo_ignore_broadcasts: '1'
  net.ipv4.icmp_ignore_bogus_error_responses: '1'
  # Lets a service bind the tailnet address before tailscaled has assigned it,
  # for example Docker publishing a port at boot.
  net.ipv4.ip_nonlocal_bind: '1'
  # IPv6 stays enabled because the tailnet is dual-stack (fd7a:115c:a1e0::/48).
  net.ipv6.conf.all.disable_ipv6: '0'
  net.ipv6.conf.all.forwarding: '0'
  net.ipv6.conf.default.forwarding: '0'
  net.ipv6.conf.all.accept_source_route: '0'
  net.ipv6.conf.all.accept_redirects: '0'
  net.ipv6.conf.default.accept_redirects: '0'
  fs.protected_symlinks: '1'
  fs.protected_hardlinks: '1'
  fs.protected_regular: '2'
  fs.protected_fifos: '2'

# --- auditd -------------------------------------------------------------------
honeypot_audit_watches:
  - {path: /etc/ssh/sshd_config, perms: wa, key: sshd_config}
  - {path: /etc/ssh/sshd_config.d/, perms: wa, key: sshd_config}
  - {path: /etc/passwd, perms: wa, key: passwd}
  - {path: /etc/shadow, perms: wa, key: shadow}
  - {path: /etc/group, perms: wa, key: group}
  - {path: /etc/sudoers, perms: wa, key: sudoers}
  - {path: /etc/sudoers.d/, perms: wa, key: sudoers}
  - {path: /etc/firewalld/, perms: wa, key: firewall}
  - {path: /etc/sysctl.d/, perms: wa, key: sysctl}
  - {path: /etc/docker/, perms: wa, key: docker_config}
  - {path: /etc/systemd/system/, perms: wa, key: systemd_units}
  - {path: /etc/tailscale/, perms: wa, key: tailscale}
  - {path: /var/lib/tailscale/, perms: wa, key: tailscale}
  - {path: /var/log/audit/, perms: wa, key: auditlog}

# The value 1 enables auditing but keeps the rules changeable.
# The value 2 would lock the configuration until reboot.
honeypot_audit_enable_flag: 1

# --- SELinux ------------------------------------------------------------------
# Local policy module that lets the honeywatch timer units, which set NoNewPrivileges=yes, invoke docker.
honeypot_selinux_module: honeywatch-nnp

# --- Docker -------------------------------------------------------------------
honeypot_docker_install_enabled: true
# Docker runs without userns-remap so bind-mounted host paths keep the uid that
# owns them inside the containers.
honeypot_docker_daemon_options:
  icc: false
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: '3'
  live-restore: true
  no-new-privileges: true
  selinux-enabled: true

# --- Cowrie download volume cleanup -------------------------------------------
# Cowrie limits the size of each captured file but not the total size of the volume.
honeypot_cowrie_downloads_path: /var/lib/docker/volumes/honeywatch_cowrie-state/_data/downloads
honeypot_cowrie_downloads_max_age_days: 30
honeypot_cowrie_downloads_max_file_size: 10M

# --- Failure/success notifications --------------------------------------------
# ntfy_server_url is fleet-wide and set in inventory/production/group_vars/all/all.yml.
honeypot_ntfy_topic: honeywatch
honeypot_ntfy_url: "{{ ntfy_server_url }}/{{ honeypot_ntfy_topic }}"

# --- Observability ------------------------------------------------------------
# Grafana Alloy ships this host's journal to the fleet Loki; see roles/alloy.
honeypot_alloy_enabled: true
# The ingestor container writes its metrics files here and Alloy's textfile collector
# reads them. selinux.yml creates the directory before the honeywatch release mounts it.
honeypot_metrics_dir: /var/lib/honeywatch/metrics
# Must match the uid:gid pinned in the honeywatch repo's ingestor/Dockerfile.
# The bind mount has no userns remap, so the host directory must be owned by that id.
honeypot_ingestor_uid: 1000

# --- Encrypted Postgres backup ------------------------------------------------
honeypot_backup_enabled: true
honeypot_backup_schedule: "*-*-* 03:30:00 UTC"
honeypot_backup_randomized_delay: 30min
honeypot_backup_timeout_sec: 2100
honeypot_backup_retention_days: 30
honeypot_backup_r2_prefix: honeywatch/postgres
honeypot_backup_age_recipient_file: /etc/honeywatch/backup.age.pub
honeypot_backup_postgres_container: honeywatch-db
honeypot_backup_postgres_user: honeywatch
honeypot_backup_postgres_db: honeywatch
# The vault_honeypot_r2_* variables and vault_honeypot_age_recipient have no defaults
# on purpose. validate.yml refuses to deploy without them.

# --- MaxMind GeoLite2 refresh -------------------------------------------------
honeypot_mmdb_enabled: true
honeypot_mmdb_schedule: "Wed *-*-* 04:15:00 UTC"
honeypot_mmdb_randomized_delay: 30min
honeypot_mmdb_timeout_sec: 900
honeypot_mmdb_geoip_volume: honeywatch_geoip-data
honeypot_mmdb_ingestor_container: honeywatch-ingestor

# --- Old release image prune --------------------------------------------------
# Each release leaves an older image behind in every repo. Only semver-tagged images are pruned.
honeypot_image_prune_enabled: true
honeypot_image_prune_repos:
  - ghcr.io/straightchlorine/honeywatch/api
  - ghcr.io/straightchlorine/honeywatch/ingestor
# Number of newest tags kept per repo. It must be at least 1 so the newest release image is never removed.
honeypot_image_prune_keep: 3
honeypot_image_prune_schedule: "Sun *-*-* 04:45:00 UTC"
honeypot_image_prune_randomized_delay: 30min
honeypot_image_prune_timeout_sec: 900
