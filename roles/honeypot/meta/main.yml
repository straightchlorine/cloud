---
galaxy_info:
  role_name: honeypot
  namespace: homelab
  author: Ansible Admin
  description: CentOS Stream host hardening and operations for the honeywatch honeypot VPS
  company: Local
  license: MIT
  min_ansible_version: '2.17'

  platforms:
    - name: EL
      versions:
        - '10'

  galaxy_tags:
    - honeypot
    - security
    - hardening
    - selinux
    - firewalld
