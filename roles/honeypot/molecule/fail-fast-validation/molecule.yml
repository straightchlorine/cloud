---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: test
    # validate.yml asserts a RedHat-family OS, so a Debian container would fail every case for the wrong reason.
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-rockylinux9-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/usr/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # CI and local runs both start in roles/<role>, so MOLECULE_PROJECT_DIRECTORY is roles/honeypot.
    # One level up is roles/, which lets `include_role: name: <any role>` resolve by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
