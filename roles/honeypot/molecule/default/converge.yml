---
- name: Converge honeypot default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  vars:
    # The Docker packages come from a CentOS 10 repo and need a daemon the container cannot run;
    # prepare.yml stubs the unit instead.
    honeypot_docker_install_enabled: false
  tasks:
    - name: Run the container-safe task files
      ansible.builtin.include_role:
        name: honeypot
        tasks_from: "{{ molecule_task.file }}"
      vars:
        honeypot_timer_job: "{{ molecule_task.job | default(omit) }}"
      loop: "{{ honeypot_molecule_task_files }}"
      loop_control:
        # Not item: the included files loop on item and would shadow it in these lazily templated vars.
        loop_var: molecule_task
        label: "{{ molecule_task.file }}"

    - name: Apply pending handlers
      ansible.builtin.meta: flush_handlers
