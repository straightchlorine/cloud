---
- name: Prepare honeypot default
  hosts: all
  become: true
  tasks:
    - name: Stub docker
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/stub_docker.yml"

    - name: Create /etc/docker
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Seed daemon.json with keys set out of band
      # The role merges into daemon.json, so these keys must survive.
      ansible.builtin.copy:
        content: '{"data-root": "/srv/docker", "icc": true}'
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'

    - name: Create the honeywatch config directory
      # Only selinux.yml creates it, and SELinux cannot run in the container.
      ansible.builtin.file:
        path: /etc/honeywatch
        state: directory
        owner: root
        group: root
        mode: '0700'
