---
- name: Verify fail-fast validation worked
  hosts: all
  tasks:
    - name: Confirm fail-fast-validation test completed
      ansible.builtin.debug:
        msg: |
          [OK] Fail-fast validation scenario verified

          Note: Validation correctly failed in converge step
          when required variables were missing

          This confirms the fail-fast principle works as designed

    - name: Display fail-fast validation verification
      ansible.builtin.debug:
        msg: |
          [OK] Fail-Fast Validation Test Complete

          Test Scenario: Missing required variables
          - backup_role: NOT SET (required)
          - backup_user: NOT SET (required)
          - backup_group: NOT SET (required)
          - backup_base_path: NOT SET (required)
          - restic_version: NOT SET (required)
          - vault_backup_storage_host: NOT SET (required)
          - vault_backup_storage_user: NOT SET (required)
          - vault_backup_storage_port: NOT SET (required)
          - vault_backup_repository_base: NOT SET (required)
          - restic_repository: NOT SET (required, standalone mode)
          - restic_password: NOT SET (required, standalone mode)
          - backup_paths: NOT SET (required, standalone mode)
          - retention_policy: NOT SET (required, standalone mode)
          - restic_optimization: NOT SET (required, standalone mode)
          - backup_schedule: NOT SET (required, standalone mode)
          - backup_timeout: NOT SET (required, standalone mode)

          Result: Role validation correctly failed in converge step
          This confirms the "fail-fast" principle:
          Role fails immediately with clear error when required variables missing
