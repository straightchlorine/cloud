---
- name: Converge - Fail-Fast Validation
  hosts: all
  vars:
    timezone: UTC
    # Intentionally omit ALL required variables:
    # - backup_role
    # - backup_user, backup_group, backup_base_path
    # - restic_version
    # - vault_backup_storage_host, vault_backup_storage_user
    # - vault_backup_storage_port, vault_backup_repository_base
    # - restic_repository, restic_password, backup_paths
    # - retention_policy, restic_optimization
    # - backup_schedule, backup_timeout
    # This tests that role fails gracefully with clear error messages
  tasks:
    - name: Include backup validation (expect to fail)
      block:
        - name: Try to include backup validation without required variables
          ansible.builtin.include_tasks: ../../tasks/validate.yml
      rescue:
        - name: Capture expected validation failure
          ansible.builtin.set_fact:
            validation_failed: true
            validation_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Display validation failure message
          ansible.builtin.debug:
            msg: |
              [OK] Validation correctly failed (expected behavior)
              Error: {{ validation_error }}
