---
- name: Converge - Default (Core Role Logic)
  hosts: all
  vars:
    timezone: UTC

    # Backup role mode
    backup_role: "standalone"

    # User and group configuration
    backup_user: "backup"
    backup_group: "backup"

    # Path configuration
    backup_base_path: "/opt/test-backup"

    # Restic version
    restic_version: "0.16.4"
    backup_restic_version: "0.16.4"

    # Hetzner storage configuration (test values)
    vault_backup_storage_host: "u123456.your-storagebox.de"
    vault_backup_storage_user: "u123456"
    vault_backup_storage_port: "23"
    vault_backup_repository_base: "/backups"

    # Standalone mode variables
    backup_service_name: "test-service"
    restic_repository: "sftp:u123456@u123456.your-storagebox.de:/backups/test"
    restic_password: "test-password-for-molecule-testing-only"
    backup_paths:
      - "/etc"
      - "/opt/test-backup"
    retention_policy:
      daily: "7"
      weekly: "4"
      monthly: "6"
      yearly: "1"
    restic_optimization:
      read_concurrency: 2
      compression: "auto"
      pack_size: 16
    backup_schedule: "0 2 * * *"
    backup_timeout: "3600"

  pre_tasks:
    - name: Create parent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      become: true
      loop:
        - "{{ backup_base_path | dirname }}"

    - name: Gather facts (replaces network facts for testing)
      ansible.builtin.setup:
        gather_subset: network

  tasks:
    - name: Note about molecule test limitations
      ansible.builtin.debug:
        msg: |
          Running simplified test of backup role core logic
          Note: Common role dependencies not available in molecule
          Testing only: user creation, directory structure, file permissions
          Skipping: Docker, restic download, systemd services, actual backup operations

    - name: Create backup group
      ansible.builtin.group:
        name: "{{ backup_group }}"
        state: present
      become: true

    - name: Create backup user
      ansible.builtin.user:
        name: "{{ backup_user }}"
        group: "{{ backup_group }}"
        home: "{{ backup_base_path }}"
        shell: /bin/bash
        createhome: true
        system: true
      become: true

    - name: Create backup directory structure
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ backup_base_path }}", mode: '0750'}
        - {path: "{{ backup_base_path }}/scripts", mode: '0750'}
        - {path: "{{ backup_base_path }}/logs", mode: '0750'}
        - {path: "{{ backup_base_path }}/cache", mode: '0750'}
        - {path: "{{ backup_base_path }}/repositories", mode: '0750'}
        - {path: "{{ backup_base_path }}/keys", mode: '0750'}
        - {path: "{{ backup_base_path }}/config", mode: '0750'}
        - {path: "{{ backup_base_path }}/metrics", mode: '0750'}
        - {path: "{{ backup_base_path }}/locks", mode: '0750'}
        - {path: "{{ backup_base_path }}/coordination", mode: '0750'}
        - {path: "{{ backup_base_path }}/reports", mode: '0750'}
        - {path: "{{ backup_base_path }}/dashboards", mode: '0750'}
        - {path: "{{ backup_base_path }}/.ssh", mode: '0700'}
        - {path: "{{ backup_base_path }}/.ssh/sockets", mode: '0700'}
        - {path: "{{ backup_base_path }}/.ssh/nodes", mode: '0750'}
      become: true

    - name: Create test backup script placeholder
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Backup script placeholder for molecule testing
          echo "Backup script for {{ backup_service_name }}"
        dest: "{{ backup_base_path }}/scripts/backup-{{ backup_service_name }}.sh"
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: '0750'
      become: true

    - name: Create test password file placeholder
      ansible.builtin.copy:
        content: "{{ restic_password }}"
        dest: "{{ backup_base_path }}/keys/{{ backup_service_name }}-password"
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: '0600'
      become: true
      no_log: true
