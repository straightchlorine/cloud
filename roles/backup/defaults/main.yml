# Enterprise backup configuration
# Modern backup standards with multi-repository strategy and advanced operational features

# Enterprise backup strategy
backup_strategy: "multi-repository"  # Options: single, multi-repository, tiered
backup_tier: "production"           # Options: production, staging, development

# User and group configuration
backup_user: "backup"
backup_group: "backup"

# Repository configuration
backup_base_path: "/opt/enterprise-backup"
backup_repositories:
  critical:
    description: "Critical system and database backups"
    retention_policy: "14 daily, 8 weekly, 12 monthly, 3 yearly"
    priority: 1
    max_parallel_operations: 2
    compression: "max"
    check_frequency: "daily"

  services:
    description: "Application and service data backups"
    retention_policy: "7 daily, 4 weekly, 6 monthly, 1 yearly"
    priority: 2
    max_parallel_operations: 3
    compression: "auto"
    check_frequency: "weekly"

  system:
    description: "System configuration and logs"
    retention_policy: "3 daily, 2 weekly, 3 monthly"
    priority: 3
    max_parallel_operations: 4
    compression: "fast"
    check_frequency: "weekly"

# Backup scheduling and orchestration
backup_orchestration:
  enabled: true
  coordination_method: "systemd"  # Options: systemd, cron, kubernetes
  dependency_management: true
  parallel_limit: 6
  timeout_minutes: 240
  retry_attempts: 3
  retry_delay_minutes: 15

# Enterprise restore testing
restore_testing:
  enabled: true
  frequency: "weekly"
  test_percentage: 10  # Percentage of recent backups to test
  test_environment: "/tmp/restore-test"
  cleanup_after_test: true
  alert_on_failure: true
  performance_benchmarking: true

# Backup performance optimization
performance_optimization:
  cache_enabled: true
  cache_size_mb: 2048
  compression_level: "auto"  # Options: none, fast, max, auto
  concurrent_uploads: 4
  concurrent_downloads: 4
  bandwidth_limit_mbps: 0  # 0 = unlimited
  cpu_priority: "normal"   # Options: low, normal, high

# Monitoring and metrics
backup_monitoring:
  prometheus_metrics: true
  metrics_port: 9102
  detailed_timing: true
  storage_efficiency: true
  deduplication_stats: true
  error_tracking: true

# Security configuration
backup_security:
  encryption_algorithm: "AES256"
  key_derivation: "scrypt"
  key_rotation_enabled: true
  key_rotation_frequency: "quarterly"
  access_logging: true
  audit_trail: true

# Notification and alerting
backup_notifications:
  success_notifications: false  # Only failures and warnings
  failure_notifications: true
  warning_notifications: true
  summary_reports: true
  report_frequency: "weekly"

# Enterprise compliance
compliance:
  retention_enforcement: true
  immutable_backups: false  # Set to true for regulatory compliance
  legal_hold_support: true
  audit_logging: true
  data_classification: true

# Disaster recovery
disaster_recovery:
  cross_site_replication: true
  hot_standby_repos: 1
  recovery_time_objective_minutes: 30
  recovery_point_objective_minutes: 15
  automated_failover: false
  manual_validation_required: true

# Service-specific backup configuration
service_backup_configs:
  dns:
    repository: "critical"
    schedule: "0 1 * * *"  # Daily at 1 AM
    pre_backup_scripts: ["pihole-flush", "dns-consistency-check"]
    post_backup_scripts: ["backup-verification"]
    include_paths:
      - "/etc/pihole"
      - "/etc/dnsmasq.d"
      - "/var/log/pihole.log"
    exclude_patterns:
      - "*.tmp"
      - "cache/*"

  automation:
    repository: "critical"
    schedule: "0 2 * * *"  # Daily at 2 AM
    pre_backup_scripts: ["container-pause", "database-backup"]
    post_backup_scripts: ["container-resume", "backup-verification"]
    include_paths:
      - "{{ automation_data_path }}"
      - "{{ automation_stack_home }}"
      - "/etc/traefik"
    exclude_patterns:
      - "*/logs/*"
      - "*/tmp/*"
      - "*.log"

  music:
    repository: "services"
    schedule: "0 3 * * *"  # Daily at 3 AM
    pre_backup_scripts: ["media-sync", "library-consistency"]
    post_backup_scripts: ["backup-verification"]
    include_paths:
      - "{{ music_library_path }}"
      - "{{ music_stack_home }}"
    exclude_patterns:
      - "*/cache/*"
      - "*.tmp"
      - "*/thumbnails/*"

  system:
    repository: "system"
    schedule: "0 4 * * *"  # Daily at 4 AM
    pre_backup_scripts: ["system-snapshot"]
    post_backup_scripts: ["backup-verification"]
    include_paths:
      - "/etc"
      - "/home"
      - "/var/lib"
      - "/opt"
    exclude_patterns:
      - "/tmp/*"
      - "*/cache/*"
      - "*.log"
      - "/proc/*"
      - "/sys/*"

# Remote repository configuration
remote_repositories:
  primary:
    type: "sftp"
    connection_string: "{{ vault_backup_primary_repo }}"
    bandwidth_limit: "10MB"
    connection_timeout: 30
    retry_attempts: 5

  secondary:
    type: "sftp"
    connection_string: "{{ vault_backup_secondary_repo }}"
    bandwidth_limit: "5MB"
    connection_timeout: 30
    retry_attempts: 3
    replication_delay_hours: 6

# Backup validation and integrity
backup_validation:
  checksum_verification: true
  repository_consistency_check: true
  random_restore_testing: true
  data_integrity_verification: true
  performance_regression_testing: true

# Advanced features
advanced_features:
  backup_deduplication_analysis: true
  storage_cost_analysis: true
  backup_lifecycle_management: true
  automated_cleanup: true
  capacity_planning: true

# Default repository configuration values
# These replace the removed default filters in templates
retention_daily: "7"
retention_weekly: "4"
retention_monthly: "6"
retention_yearly: "1"
backup_frequency: "daily"
backup_time: "02:00"
timezone: "UTC"
health_check_frequency: "daily"
backup_metrics_enabled: "true"
backup_compression: "auto"
max_backup_time: "3600"
max_parallel_files: "4"
bandwidth_limit: "0"
connect_timeout: "30"
retry_attempts: "3"
retry_delay: "60"
post_backup_verification: "true"
restore_test_frequency: "weekly"

# Systemd service management
backup_timer_enabled: true
backup_coordinator_enabled: true