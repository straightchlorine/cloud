---
# Enterprise backup configuration
# Modern backup standards with multi-repository strategy and advanced operational features

# Enterprise backup strategy
backup_strategy: "multi-repository" # Options: single, multi-repository, tiered
backup_tier: "production" # Options: production, staging, development

# User and group configuration
backup_user: "backup"
backup_group: "backup"

# Repository configuration
common_backup_base_path: "/opt/enterprise-backup"
backup_repositories:
  critical:
    description: "Critical system and database backups"
    backup_retention_policy: "14 daily, 8 weekly, 12 monthly, 3 yearly"
    priority: 1
    max_parallel_operations: 2
    compression: "max"
    check_frequency: "daily"

  services:
    description: "Application and service data backups"
    backup_retention_policy: "7 daily, 4 weekly, 6 monthly, 1 yearly"
    priority: 2
    max_parallel_operations: 3
    compression: "auto"
    check_frequency: "weekly"

  system:
    description: "System configuration and logs"
    backup_retention_policy: "3 daily, 2 weekly, 3 monthly"
    priority: 3
    max_parallel_operations: 4
    compression: "fast"
    check_frequency: "weekly"

# Backup scheduling and orchestration
backup_orchestration:
  enabled: true
  coordination_method: "systemd" # Options: systemd, cron, kubernetes
  dependency_management: true
  parallel_limit: 6
  timeout_minutes: 240
  retry_attempts: 3
  retry_delay_minutes: 15

# Backup performance optimization
performance_optimization:
  cache_enabled: true
  cache_size_mb: 2048
  compression_level: "auto" # Options: none, fast, max, auto
  concurrent_uploads: 4
  concurrent_downloads: 4
  bandwidth_limit_mbps: 0 # 0 = unlimited
  cpu_priority: "normal" # Options: low, normal, high

# Service-specific backup configuration
backup_service_backup_configs:
  dns:
    repository: "critical"
    schedule: "0 1 * * *" # Daily at 1 AM
    pre_backup_scripts: ["pihole-flush", "dns-consistency-check"]
    post_backup_scripts: ["backup-verification"]
    include_paths:
      - "/etc/pihole"
      - "/etc/dnsmasq.d"
      - "/var/log/pihole.log"
    exclude_patterns:
      - "*.tmp"
      - "cache/*"

  automation:
    repository: "critical"
    schedule: "0 2 * * *" # Daily at 2 AM
    pre_backup_scripts: ["container-pause", "database-backup"]
    post_backup_scripts: ["container-resume", "backup-verification"]
    include_paths:
      - "{{ automation_data_path }}"
      - "{{ automation_stack_home }}"
      - "/etc/traefik"
    exclude_patterns:
      - "*/logs/*"
      - "*/tmp/*"
      - "*.log"

  music:
    repository: "services"
    schedule: "0 3 * * *" # Daily at 3 AM
    pre_backup_scripts: ["media-sync", "library-consistency"]
    post_backup_scripts: ["backup-verification"]
    include_paths:
      - "{{ music_library_path }}"
      - "{{ music_stack_home }}"
    exclude_patterns:
      - "*/cache/*"
      - "*.tmp"
      - "*/thumbnails/*"

  system:
    repository: "system"
    schedule: "0 4 * * *" # Daily at 4 AM
    pre_backup_scripts: ["system-snapshot"]
    post_backup_scripts: ["backup-verification"]
    include_paths:
      - "/etc"
      - "/home"
      - "/var/lib"
      - "/opt"
    exclude_patterns:
      - "/tmp/*"
      - "*/cache/*"
      - "*.log"
      - "/proc/*"
      - "/sys/*"

# Default repository configuration values
# These replace the removed default filters in templates
backup_retention_daily: "7"
backup_retention_weekly: "4"
backup_retention_monthly: "6"
backup_retention_yearly: "1"
backup_frequency: "daily"
backup_time: "02:00"
timezone: "UTC"
health_check_frequency: "daily"
backup_metrics_enabled: "true"
backup_compression: "auto"
max_backup_time: "3600"
max_parallel_files: "4"
bandwidth_limit: "0"
connect_timeout: "30"
retry_attempts: "3"
retry_delay: "60"
post_backup_verification: "true"
restore_test_frequency: "weekly"

# Systemd service management
backup_timer_enabled: true
backup_coordinator_enabled: true

# Backup scheduling
backup_schedule: "*-*-* 02:00:00"
backup_randomized_delay: "300s"
max_concurrent_backups: "2"
