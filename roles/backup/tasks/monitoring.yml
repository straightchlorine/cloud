# Enterprise backup monitoring and performance analytics
# Integration with existing Prometheus/Grafana stack for comprehensive backup observability

- name: Create backup monitoring infrastructure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: backup
    group: backup
    mode: '0750'
  become: yes
  loop:
    - "{{ backup_base_path }}/monitoring"
    - "{{ backup_base_path }}/metrics"
    - "{{ backup_base_path }}/dashboards"
    - "{{ backup_base_path }}/alerts"

- name: Generate backup metrics exporter
  ansible.builtin.template:
    src: backup-metrics-exporter.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-metrics-exporter.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Create backup performance analyzer
  ansible.builtin.template:
    src: backup-performance-analyzer.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-performance-analyzer.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Generate backup storage efficiency tracker
  ansible.builtin.template:
    src: storage-efficiency-tracker.py.j2
    dest: "{{ backup_base_path }}/scripts/storage-efficiency-tracker.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Create backup operation logger
  ansible.builtin.template:
    src: backup-operation-logger.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-operation-logger.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Generate backup SLA monitor
  ansible.builtin.template:
    src: backup-sla-monitor.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-sla-monitor.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Create backup metrics systemd service
  ansible.builtin.template:
    src: backup-metrics.service.j2
    dest: /etc/systemd/system/backup-metrics.service
    mode: '0644'
  become: yes
  notify:
    - reload systemd
    - restart backup metrics

- name: Create comprehensive backup dashboard
  ansible.builtin.template:
    src: enterprise-backup-dashboard.json.j2
    dest: "{{ backup_base_path }}/dashboards/enterprise-backup-overview.json"
    owner: backup
    group: backup
    mode: '0640'
  become: yes

- name: Create backup performance dashboard
  ansible.builtin.template:
    src: backup-performance-dashboard.json.j2
    dest: "{{ backup_base_path }}/dashboards/backup-performance-analytics.json"
    owner: backup
    group: backup
    mode: '0640'
  become: yes

- name: Create backup storage analytics dashboard
  ansible.builtin.template:
    src: backup-storage-dashboard.json.j2
    dest: "{{ backup_base_path }}/dashboards/backup-storage-analytics.json"
    owner: backup
    group: backup
    mode: '0640'
  become: yes

- name: Generate backup alerting rules for Prometheus
  ansible.builtin.template:
    src: backup-alert-rules.yml.j2
    dest: "{{ backup_base_path }}/alerts/backup-alert-rules.yml"
    owner: backup
    group: backup
    mode: '0640'
  become: yes

- name: Create backup capacity planning analyzer
  ansible.builtin.template:
    src: backup-capacity-planner.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-capacity-planner.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Generate backup trend analyzer
  ansible.builtin.template:
    src: backup-trend-analyzer.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-trend-analyzer.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Create backup cost analyzer
  ansible.builtin.template:
    src: backup-cost-analyzer.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-cost-analyzer.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Generate backup health checker
  ansible.builtin.template:
    src: backup-health-checker.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-health-checker.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Create backup notification processor
  ansible.builtin.template:
    src: backup-notification-processor.py.j2
    dest: "{{ backup_base_path }}/scripts/backup-notification-processor.py"
    owner: backup
    group: backup
    mode: '0750'
  become: yes

- name: Create backup monitoring configuration
  ansible.builtin.template:
    src: backup-monitoring-config.yml.j2
    dest: "{{ backup_base_path }}/config/backup-monitoring-config.yml"
    owner: backup
    group: backup
    mode: '0640'
  become: yes

- name: Start and enable backup metrics service
  ansible.builtin.systemd:
    name: backup-metrics.service
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes
  when: backup_monitoring.prometheus_metrics

- name: Verify backup metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}:{{ backup_monitoring.metrics_port }}/metrics"
    method: GET
    timeout: 10
    status_code: 200
  register: backup_metrics_check
  retries: 3
  delay: 5
  when: backup_monitoring.prometheus_metrics

- name: Create backup monitoring documentation
  ansible.builtin.template:
    src: backup-monitoring-guide.md.j2
    dest: "{{ backup_base_path }}/docs/backup-monitoring-guide.md"
    owner: backup
    group: backup
    mode: '0640'
  become: yes

- name: Display backup monitoring deployment status
  ansible.builtin.debug:
    msg: |
      [OK] Enterprise Backup Monitoring Deployed:

      [STATS] Metrics and Analytics:
      - Backup Metrics Endpoint: http://{{ primary_ip }}:{{ backup_monitoring.metrics_port }}/metrics
      - Performance Analytics: {{ 'Enabled' if backup_monitoring.detailed_timing else 'Disabled' }}
      - Storage Efficiency Tracking: {{ 'Enabled' if backup_monitoring.storage_efficiency else 'Disabled' }}
      - Deduplication Statistics: {{ 'Enabled' if backup_monitoring.deduplication_stats else 'Disabled' }}

      📈 Grafana Dashboards:
      - Enterprise Backup Overview: enterprise-backup-overview.json
      - Performance Analytics: backup-performance-analytics.json
      - Storage Analytics: backup-storage-analytics.json
      - Repository Management: repository-management.json

      🚨 Monitoring Coverage:
      - Backup Success/Failure Rates
      - Backup Duration and Performance Trends
      - Storage Growth and Efficiency
      - Repository Health and Consistency
      - Restore Testing Results
      - SLA Compliance Tracking

      [POWER] Automated Analysis:
      - Capacity Planning: {{ backup_base_path }}/scripts/backup-capacity-planner.py
      - Trend Analysis: {{ backup_base_path }}/scripts/backup-trend-analyzer.py
      - Cost Analysis: {{ backup_base_path }}/scripts/backup-cost-analyzer.py
      - Health Monitoring: {{ backup_base_path }}/scripts/backup-health-checker.py

      🔔 Alerting Integration:
      - Prometheus Alert Rules: backup-alert-rules.yml
      - Notification Processing: backup-notification-processor.py
      - SLA Monitoring: backup-sla-monitor.py

      📋 Enterprise Metrics Tracked:
      - Backup Operation Metrics (duration, size, success rate)
      - Repository Performance (deduplication ratio, storage efficiency)
      - Restore Testing Metrics (success rate, performance)
      - Infrastructure Health (disk usage, network performance)
      - Compliance Metrics (retention policy adherence, audit trails)

      {{ '[OK] Metrics endpoint accessible!' if backup_metrics_check.status == 200 else '[FAIL] Metrics endpoint not accessible!' }}

      📖 Documentation: {{ backup_base_path }}/docs/backup-monitoring-guide.md

      Enterprise backup monitoring integrated with existing Prometheus/Grafana stack!