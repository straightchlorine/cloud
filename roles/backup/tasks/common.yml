---
# Common Backup Setup Tasks
# Shared functionality for both standalone and coordinator modes

- name: Create backup group
  ansible.builtin.group:
    name: "{{ backup_group }}"
    state: present
  become: true

- name: Create backup user
  ansible.builtin.user:
    name: "{{ backup_user }}"
    group: "{{ backup_group }}"
    home: "{{ backup_base_path }}"
    shell: /bin/bash
    createhome: true
    system: true
  become: true

- name: Create backup directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  loop:
    - "{{ backup_base_path }}"
    - "{{ backup_base_path }}/scripts"
    - "{{ backup_base_path }}/logs"
    - "{{ backup_base_path }}/cache"
    - "{{ backup_base_path }}/.ssh"
    - "{{ backup_base_path }}/.ssh/sockets"
    - "{{ backup_base_path }}/.ssh/nodes"
  become: true

- name: Create coordinator-specific directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  loop:
    - "{{ backup_base_path }}/mounts"
  become: true
  when: backup_role == 'coordinator'

- name: Set SSH directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0700'
  loop:
    - "{{ backup_base_path }}/.ssh"
    - "{{ backup_base_path }}/.ssh/sockets"
  become: true

- name: Install required packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - fuse
      - sshfs
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'

- name: Install required packages (Arch Linux)
  community.general.pacman:
    name:
      - curl
      - jq
      - fuse3
      - sshfs
    state: present
  become: true
  when: ansible_os_family == 'Archlinux'

- name: Check if restic is already installed
  ansible.builtin.command: restic version
  register: backup_restic_check
  failed_when: false
  changed_when: false

- name: Install restic
  when: >-
    backup_restic_check.rc != 0 or
    (backup_restic_check.stdout is defined and
    backup_restic_version not in backup_restic_check.stdout)
  block:
    - name: Download restic SHA256SUMS file
      ansible.builtin.get_url:
        url: >-
          https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/SHA256SUMS
        dest: "/tmp/restic_{{ backup_restic_version }}_SHA256SUMS"
        mode: '0644'
      become: true

    - name: Extract restic checksum for linux_amd64
      ansible.builtin.shell: >
        set -o pipefail &&
        grep "restic_{{ backup_restic_version }}_linux_amd64.bz2"
        "/tmp/restic_{{ backup_restic_version }}_SHA256SUMS"
        | awk '{print $1}'
      args:
        executable: /bin/bash
      register: backup_restic_checksum
      changed_when: false
      failed_when: backup_restic_checksum.stdout | length == 0

    - name: Download restic binary
      ansible.builtin.get_url:
        url: >-
          https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/restic_{{
          backup_restic_version }}_linux_amd64.bz2
        dest: "/tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2"
        checksum: "sha256:{{ backup_restic_checksum.stdout }}"
        mode: '0644'
      become: true

    - name: Extract restic binary
      ansible.builtin.command: "bunzip2 -f /tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2"
      become: true
      changed_when: true

    - name: Install restic to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/restic_{{ backup_restic_version }}_linux_amd64"
        dest: /usr/local/bin/restic
        mode: '0755'
        remote_src: true
      become: true

    - name: Clean up downloaded restic file
      ansible.builtin.file:
        path: "/tmp/restic_{{ backup_restic_version }}_linux_amd64"
        state: absent
      become: true

- name: Verify restic installation
  ansible.builtin.command: restic version
  register: backup_restic_verify
  changed_when: false
  failed_when: backup_restic_verify.rc != 0

- name: Display restic version
  ansible.builtin.debug:
    msg: "Restic installed: {{ backup_restic_verify.stdout }}"
