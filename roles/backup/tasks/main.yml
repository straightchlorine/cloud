---
# Unified Backup Role - Main Entry Point
# Supports two modes: standalone and coordinator
# No defaults - all configuration must be explicit

- name: Include backup validation (fail-fast)
  ansible.builtin.include_tasks: validate.yml
  tags: [validation, backup]

- name: Include common backup setup
  ansible.builtin.include_tasks: common.yml
  tags: [common, backup]

- name: Include standalone backup setup
  ansible.builtin.include_tasks: standalone.yml
  when: backup_role == 'standalone'
  tags: [standalone, backup]

- name: Include coordinator backup setup
  ansible.builtin.include_tasks: coordinator.yml
  when: backup_role == 'coordinator'
  tags: [coordinator, backup]

- name: Display backup deployment summary
  ansible.builtin.debug:
    msg: |
      [backup deployment complete]
      host: {{ inventory_hostname }}
      mode: {{ backup_role }}
      user: {{ backup_user }}
      base path: {{{ common_backup_base_path }}}
      {% if backup_role == 'standalone' %}
      repository: {{ backup_restic_repository }}
      backup paths: {{ backup_paths | length }}
      schedule: {{ backup_schedule }}
      {% endif %}
      {% if backup_role == 'coordinator' %}
      targets: {{ coordinator_targets | length }}
      {% for target in coordinator_targets | sort(attribute='priority') %}
      - {{ target.service_name }} (priority {{ target.priority }})
      {% endfor %}
      {% endif %}
  tags: [summary, backup]
