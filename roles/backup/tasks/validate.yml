# Enterprise Backup Validation Tasks
# Uses unified validation framework to eliminate redundancy

- name: Run enterprise backup comprehensive validation
  ansible.builtin.include_role:
    name: common
    tasks_from: unified_validation
  vars:
    validation_context: "enterprise backup"
    validation_type: "backup"
    role_name: "enterprise-backup"
    required_variables:
      - restic_repository
      - restic_password
      - backup_directories
      - device_role
      - enterprise_backup_base_path
      - backup_user
      - backup_group
    vault_placeholders:
      - {var: "restic_password", value: "your-32-character-secure-restic-password"}
    critical_backup_paths: "{{ backup_directories }}"
    stack_home: "{{ enterprise_backup_base_path }}"
    required_services: []
  tags: [validation]

- name: Validate backup directories exist and are accessible
  ansible.builtin.stat:
    path: "{{ item }}"
  register: backup_dir_check
  loop: "{{ backup_directories }}"
  tags: [validation]

- name: Fail if backup directories are not accessible
  ansible.builtin.fail:
    msg: "Backup directory does not exist or is not accessible: {{ item.item }}"
  when: not item.stat.exists or not item.stat.readable
  loop: "{{ backup_dir_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [validation]

- name: Validate enterprise backup base path parent directory exists
  ansible.builtin.stat:
    path: "{{ enterprise_backup_base_path | dirname }}"
  register: backup_base_parent
  tags: [validation]

- name: Fail if enterprise backup base path parent does not exist
  ansible.builtin.fail:
    msg: "Enterprise backup base path parent directory does not exist: {{ enterprise_backup_base_path | dirname }}"
  when: not backup_base_parent.stat.exists or not backup_base_parent.stat.isdir
  tags: [validation]

- name: Check if restic repository URL format is valid
  ansible.builtin.fail:
    msg: "Invalid restic repository URL format: {{ restic_repository }}"
  when: not (restic_repository | regex_search('^(sftp:|s3:|local:|rest:|rclone:|azure:|gs:|swift:)'))
  tags: [validation]

- name: Validate backup password length
  ansible.builtin.fail:
    msg: "Backup password must be at least 12 characters long for security"
  when: restic_password | length < 12
  tags: [validation]

- name: Check available disk space for backup operations
  ansible.builtin.shell: df {{ enterprise_backup_base_path | dirname }} | tail -1 | awk '{print $4}'
  register: available_space
  changed_when: false
  tags: [validation]

- name: Fail if insufficient disk space for backup operations
  ansible.builtin.fail:
    msg: "Insufficient disk space. Available: {{ (available_space.stdout | int / 1024 / 1024) | round(2) }}GB. Required: 2GB minimum for backup operations"
  when: (available_space.stdout | int) < 2097152 # 2GB in KB
  tags: [validation]

- name: Validate systemd is available for service management
  ansible.builtin.command: systemctl --version
  changed_when: false
  failed_when: false
  register: systemd_check
  tags: [validation]

- name: Fail if systemd is not available
  ansible.builtin.fail:
    msg: "systemd is required for enterprise backup service management"
  when: systemd_check.rc != 0
  tags: [validation]

- name: Check if jq is available for JSON processing
  ansible.builtin.command: which jq
  changed_when: false
  failed_when: false
  register: jq_check
  tags: [validation]

- name: Install jq if not available
  ansible.builtin.package:
    name: jq
    state: present
  become: yes
  when: jq_check.rc != 0
  tags: [validation, packages]

- name: Validate backup user configuration
  ansible.builtin.fail:
    msg: "backup_user must be defined and non-empty"
  when: backup_user is not defined or backup_user == ""
  tags: [validation]

- name: Enterprise backup validation completed successfully
  ansible.builtin.debug:
    msg: "All enterprise backup deployment requirements validated successfully"
  tags: [validation]

