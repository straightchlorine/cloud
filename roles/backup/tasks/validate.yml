---
# Unified Backup Role Validation Tasks
# Implements fail-fast validation - NO defaults allowed
# All required variables must be explicitly defined

- name: Validate backup_role is defined
  ansible.builtin.assert:
    that:
      - backup_role is defined
      - backup_role in ['standalone', 'coordinator']
    fail_msg: "backup_role must be defined and set to 'standalone' or 'coordinator'"
    success_msg: "Backup role validated: {{ backup_role }}"

- name: Validate common required variables
  ansible.builtin.assert:
    that:
      - backup_user is defined
      - backup_group is defined
      - backup_base_path is defined
      - restic_version is defined
    fail_msg: "Missing required common variables. Required: backup_user, backup_group, backup_base_path, restic_version"
    success_msg: "Common backup variables validated"

- name: Validate Hetzner storage configuration
  ansible.builtin.assert:
    that:
      - vault_backup_storage_host is defined
      - vault_backup_storage_user is defined
      - vault_backup_storage_port is defined
      - vault_backup_repository_base is defined
    fail_msg: "Missing Hetzner storage configuration. Required: vault_backup_storage_host, vault_backup_storage_user, vault_backup_storage_port, vault_backup_repository_base"
    success_msg: "Hetzner storage configuration validated"

# Standalone mode validation
- name: Validate standalone mode configuration
  when: backup_role == 'standalone'
  block:
    - name: Validate standalone required variables
      ansible.builtin.assert:
        that:
          - restic_repository is defined
          - restic_password is defined
          - backup_paths is defined
          - backup_paths | length > 0
          - retention_policy is defined
          - retention_policy.daily is defined
          - retention_policy.weekly is defined
          - retention_policy.monthly is defined
          - retention_policy.yearly is defined
          - restic_optimization is defined
          - backup_schedule is defined
          - backup_timeout is defined
        fail_msg: |
          Missing required standalone variables. Required:
            - restic_repository
            - restic_password
            - backup_paths (list with at least one path)
            - retention_policy (with daily, weekly, monthly, yearly)
            - restic_optimization
            - backup_schedule
            - backup_timeout
        success_msg: "Standalone mode configuration validated"

    - name: Validate restic_optimization structure
      ansible.builtin.assert:
        that:
          - restic_optimization.read_concurrency is defined
          - restic_optimization.compression is defined
          - restic_optimization.pack_size is defined
        fail_msg: "restic_optimization must define: read_concurrency, compression, pack_size"
        success_msg: "Restic optimization settings validated"

    - name: Validate backup paths exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: backup_path_check
      loop: "{{ backup_paths }}"
      failed_when: false
      changed_when: false

    - name: Warn about non-existent backup paths
      ansible.builtin.debug:
        msg: "WARNING: Backup path does not exist: {{ item.item }}"
      loop: "{{ backup_path_check.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

# Coordinator mode validation
- name: Validate coordinator mode configuration
  when: backup_role == 'coordinator'
  block:
    - name: Validate coordinator_targets is defined
      ansible.builtin.assert:
        that:
          - coordinator_targets is defined
          - coordinator_targets | length > 0
        fail_msg: "coordinator_targets must be defined with at least one target"
        success_msg: "Coordinator has {{ coordinator_targets | length }} target(s)"

    - name: Validate each coordinator target configuration
      ansible.builtin.assert:
        that:
          - item.service_name is defined
          - item.hostname is defined
          - item.ssh_user is defined
          - item.ssh_key is defined
          - item.backup_paths is defined
          - item.backup_paths | length > 0
          - item.restic_repository is defined
          - item.restic_password is defined
          - item.retention_policy is defined
          - item.retention_policy.daily is defined
          - item.retention_policy.weekly is defined
          - item.retention_policy.monthly is defined
          - item.retention_policy.yearly is defined
          - item.priority is defined
          - item.memory_limit is defined
          - item.restic_optimization is defined
        fail_msg: |
          Invalid coordinator target configuration for {{ item.service_name | default('unknown') }}.
          Required fields: service_name, hostname, ssh_user, ssh_key, backup_paths,
          restic_repository, restic_password, retention_policy (daily/weekly/monthly/yearly),
          priority, memory_limit, restic_optimization
        success_msg: "Target {{ item.service_name }} configuration validated"
      loop: "{{ coordinator_targets }}"
      loop_control:
        label: "{{ item.service_name | default('unknown') }}"

    - name: Validate coordinator target restic_optimization
      ansible.builtin.assert:
        that:
          - item.restic_optimization.read_concurrency is defined
          - item.restic_optimization.compression is defined
          - item.restic_optimization.pack_size is defined
        fail_msg: "Target {{ item.service_name }}: restic_optimization must define read_concurrency, compression, pack_size"
        success_msg: "Target {{ item.service_name }} optimization validated"
      loop: "{{ coordinator_targets }}"
      loop_control:
        label: "{{ item.service_name }}"

    - name: Validate unique priorities
      ansible.builtin.assert:
        that:
          - coordinator_targets | map(attribute='priority') | list | unique | length == coordinator_targets | length
        fail_msg: "Coordinator target priorities must be unique (for sequential execution order)"
        success_msg: "All coordinator targets have unique priorities"

    - name: Validate unique service names
      ansible.builtin.assert:
        that:
          - coordinator_targets | map(attribute='service_name') | list | unique | length == coordinator_targets | length
        fail_msg: "Coordinator target service_name values must be unique"
        success_msg: "All coordinator targets have unique service names"

- name: Validate backup_excludes format (if defined)
  when: backup_excludes is defined
  ansible.builtin.assert:
    that:
      - backup_excludes is iterable
      - backup_excludes is not string
    fail_msg: "backup_excludes must be a list"
    success_msg: "Backup excludes validated ({{ backup_excludes | length }} patterns)"

- name: Check available disk space for backup operations
  ansible.builtin.shell: df {{ backup_base_path | dirname }} | tail -1 | awk '{print $4}'
  register: available_space
  changed_when: false

- name: Warn if low disk space
  ansible.builtin.debug:
    msg: "WARNING: Low disk space. Available: {{ (available_space.stdout | int / 1024 / 1024) | round(2) }}GB"
  when: (available_space.stdout | int) < 2097152

- name: Validate systemd is available
  ansible.builtin.command: systemctl --version
  changed_when: false
  failed_when: false
  register: systemd_check

- name: Fail if systemd is not available
  ansible.builtin.fail:
    msg: "systemd is required for backup service management"
  when: systemd_check.rc != 0

- name: Display validation summary
  ansible.builtin.debug:
    msg:
      - "[backup configuration validation summary]"
      - "mode: {{ backup_role }}"
      - "user: {{ backup_user }}"
      - "base path: {{ backup_base_path }}"
      - "restic version: {{ restic_version }}"
      - "{% if backup_role == 'standalone' %}backup paths: {{ backup_paths | length }}{% endif %}"
      - "{% if backup_role == 'coordinator' %}coordinator targets: {{ coordinator_targets | length }}{% endif %}"

