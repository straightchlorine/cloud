---
# Enterprise Backup Systemd Services Configuration
# Creates and manages systemd services for backup operations

- name: Create backup service file
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: "/etc/systemd/system/backup-{{ backup_device_role }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    service_description: "Enterprise Backup Service for {{ backup_device_role }}"
    service_after: ["network.target"]
    common_service_wants: ["network.target"]
    service_type: "oneshot"
    remain_after_exit: "true"
    service_user: "{{ backup_user }}"
    service_group: "{{ backup_group }}"
    common_working_directory: "{{ common_backup_base_path }}"
    service_environment:
      - "RESTIC_REPOSITORY={{ backup_restic_repository }}"
      - "RESTIC_PASSWORD_FILE={{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
      - "RESTIC_CACHE_DIR={{ common_backup_base_path }}/cache/{{ backup_device_role }}"
    exec_start: "{{ common_backup_base_path }}/scripts/backup-{{ backup_device_role }}.sh"
    common_standard_output: "journal"
    common_standard_error: "journal"
    restart_policy: "no"
    restart_sec: "5"
    common_wanted_by: "multi-user.target"
    enable_security_hardening: true
    no_new_privileges: "true"
    common_protect_system: "strict"
    common_protect_home: "true"
    common_private_tmp: "true"
    common_read_write_paths: ["{{ common_backup_base_path }}"]
  become: true
  notify: reload systemd

- name: Create backup timer file
  ansible.builtin.template:
    src: backup-schedule.timer.j2
    dest: "/etc/systemd/system/backup-{{ backup_device_role }}.timer"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload systemd

- name: Create backup coordinator service file
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/systemd-service.j2"
    dest: "/etc/systemd/system/backup-coordinator-{{ backup_device_role }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    service_description: "Enterprise Backup Coordinator for {{ backup_device_role }}"
    service_after: ["network.target"]
    common_service_wants: ["network.target"]
    service_type: "simple"
    remain_after_exit: "false"
    service_user: "{{ backup_user }}"
    service_group: "{{ backup_group }}"
    common_working_directory: "{{ common_backup_base_path }}"
    service_environment:
      - "RESTIC_REPOSITORY={{ backup_restic_repository }}"
      - "RESTIC_PASSWORD_FILE={{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
      - "RESTIC_CACHE_DIR={{ common_backup_base_path }}/cache/{{ backup_device_role }}"
    exec_start: "{{ common_backup_base_path }}/scripts/backup-coordinator.sh monitor"
    common_standard_output: "journal"
    common_standard_error: "journal"
    restart_policy: "on-failure"
    restart_sec: "30"
    common_wanted_by: "multi-user.target"
    enable_security_hardening: true
    no_new_privileges: "true"
    start_limit_burst: "3"
    start_limit_interval_sec: "600"
    syslog_identifier: "backup-coordinator-{{ backup_device_role }}"
    protect_kernel_tunables: "true"
    protect_kernel_modules: "true"
    protect_control_groups: "true"
    restrict_suid_sgid: "true"
    restrict_realtime: "true"
    restrict_namespaces: "true"
    memory_max: "512M"
    cpu_quota: "50%"
  become: true
  notify: reload systemd

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable backup timer
  ansible.builtin.systemd:
    name: "backup-{{ backup_device_role }}.timer"
    enabled: "{{ backup_timer_enabled }}"
    state: "{{ backup_timer_enabled | ternary('started', 'stopped') }}"
  become: true

- name: Enable backup coordinator service
  ansible.builtin.systemd:
    name: "backup-coordinator-{{ backup_device_role }}.service"
    enabled: "{{ backup_coordinator_enabled }}"
    state: "{{ backup_coordinator_enabled | ternary('started', 'stopped') }}"
  become: true
