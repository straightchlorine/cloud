---
# Standalone Backup Mode Tasks
# For powerful machines that handle their own backups directly to Hetzner

- name: Create SSH directories for backup user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0700"
  become: true
  loop:
    - "{{{ common_backup_base_path }}}/.ssh"
    - "{{{ common_backup_base_path }}}/.ssh/sockets"

- name: Check if Hetzner SSH key exists
  ansible.builtin.stat:
    path: "{{{ common_backup_base_path }}}/.ssh/hetzner"
  become: true
  register: hetzner_ssh_key_stat

- name: Display manual SSH key setup instructions
  ansible.builtin.debug:
    msg: |
      [ssh key for hetzner storage box]
      The SSH private key does not exist at: {{{ common_backup_base_path }}}/.ssh/hetzner

      To set up the single shared key:
      1. Place your existing private key at: {{{ common_backup_base_path }}}/.ssh/hetzner
      2. Set permissions: chmod 600 {{{ common_backup_base_path }}}/.ssh/hetzner
      3. Set ownership: chown {{ backup_user }}:{{ backup_group }} {{{ common_backup_base_path }}}/.ssh/hetzner

      If you don't have a key yet, generate it on your storage box:
      - ssh {{ vault_backup_storage_user }}@{{ vault_backup_storage_host }} -p {{ vault_backup_storage_port }}
      - ssh-keygen -t ed25519 -f ~/.ssh/backup-hosts-key -N ""
      - cat ~/.ssh/backup-hosts-key (copy the private key)
      - Add to authorized_keys: cat ~/.ssh/backup-hosts-key.pub >> ~/.ssh/authorized_keys
  when: not hetzner_ssh_key_stat.exists

- name: Create SSH config for Hetzner connection
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{{ common_backup_base_path }}}/.ssh/config"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0600"
  become: true

- name: Test SSH connectivity to Hetzner
  ansible.builtin.command: >
    ssh -F {{{ common_backup_base_path }}}/.ssh/config
    -o StrictHostKeyChecking=accept-new
    -o ConnectTimeout=10
    hetzner-storage
    echo 'Connection successful'
  become: true
  become_user: "{{ backup_user }}"
  register: ssh_test
  failed_when: false
  changed_when: false

- name: Warn if SSH connection failed
  ansible.builtin.debug:
    msg: "WARNING: Could not connect to Hetzner Storage Box. Please verify SSH key is added and network is accessible."
  when: ssh_test.rc != 0

- name: Test SFTP connectivity with restic
  ansible.builtin.shell: |
    set -o pipefail
    export RESTIC_REPOSITORY="{{ restic_repository }}"
    export RESTIC_PASSWORD="{{ restic_password }}"
    export RESTIC_SFTP_COMMAND="ssh -F {{{ common_backup_base_path }}}/.ssh/config hetzner-storage -s sftp"
    restic snapshots --latest 1 >/dev/null 2>&1 && echo "success" || echo "failed"
  become: true
  become_user: "{{ backup_user }}"
  register: sftp_test
  failed_when: false
  changed_when: false

- name: Display SFTP connectivity result
  ansible.builtin.debug:
    msg: |
      [sftp connectivity test]
      result: >-
        {{ 'passed' if 'success' in sftp_test.stdout else
        'failed (may be uninitialized, will be initialized below)' }}
      repository: {{ restic_repository }}
      user: {{ backup_user }}

- name: Initialize restic repository
  ansible.builtin.command: restic init
  environment:
    RESTIC_REPOSITORY: "{{ restic_repository }}"
    RESTIC_PASSWORD: "{{ restic_password }}"
    RESTIC_SFTP_COMMAND: "ssh -F {{{ common_backup_base_path }}}/.ssh/config hetzner-storage -s sftp"
  become: true
  become_user: "{{ backup_user }}"
  register: restic_init
  failed_when: false
  changed_when: restic_init.rc == 0

- name: Check repository status
  ansible.builtin.command: restic snapshots --latest 1
  environment:
    RESTIC_REPOSITORY: "{{ restic_repository }}"
    RESTIC_PASSWORD: "{{ restic_password }}"
    RESTIC_SFTP_COMMAND: "ssh -F {{{ common_backup_base_path }}}/.ssh/config hetzner-storage -s sftp"
  become: true
  become_user: "{{ backup_user }}"
  register: restic_snapshots
  failed_when: false
  changed_when: false

- name: Display repository status
  ansible.builtin.debug:
    msg: >-
      Repository status:
      {{ 'Initialized and accessible' if restic_snapshots.rc == 0 else 'Not accessible or not initialized' }}

- name: Deploy standalone backup script
  ansible.builtin.template:
    src: backup-standalone.sh.j2
    dest: "{{{ common_backup_base_path }}}/scripts/backup-{{ inventory_hostname }}.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0750"
  become: true

- name: Deploy systemd service for standalone backup
  ansible.builtin.template:
    src: backup-standalone.service.j2
    dest: "/etc/systemd/system/backup-{{ inventory_hostname }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Deploy systemd timer for standalone backup
  ansible.builtin.template:
    src: backup-standalone.timer.j2
    dest: "/etc/systemd/system/backup-{{ inventory_hostname }}.timer"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: "backup-{{ inventory_hostname }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Display standalone backup summary
  ansible.builtin.debug:
    msg: |
      [backup configured]
      host: {{ inventory_hostname }}
      script: {{{ common_backup_base_path }}}/scripts/backup-{{ inventory_hostname }}.sh
      ansible.builtin.service: backup-{{ inventory_hostname }}.service
      timer: backup-{{ inventory_hostname }}.timer
      schedule: {{ backup_schedule }}
      repository: {{ restic_repository }}
