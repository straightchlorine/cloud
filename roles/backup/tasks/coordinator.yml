---
# Coordinator Backup Mode Tasks
# For backup coordinator that pulls backups from multiple remote hosts

- name: Enable user_allow_other in fuse.conf for SSHFS mounts
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^\s*#?\s*user_allow_other'
    line: 'user_allow_other'
    state: present
  become: true

- name: Create SSH keys for each coordinator target
  ansible.builtin.openssh_keypair:
    path: "{{ item.ssh_key }}"
    type: ed25519
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
  become: true
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  register: target_ssh_keys

- name: Create SSH key subdirectory for coordinator nodes
  ansible.builtin.file:
    path: "{{ backup_base_path }}/.ssh/nodes"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0700'
  become: true

- name: Check if Hetzner SSH key exists
  ansible.builtin.stat:
    path: "{{ backup_base_path }}/.ssh/hetzner"
  become: true
  register: hetzner_ssh_key_stat

- name: Display manual Hetzner SSH key setup instructions
  ansible.builtin.debug:
    msg: |
      [SSH KEY FOR HETZNER STORAGE BOX]
      The SSH private key does not exist at: {{ backup_base_path }}/.ssh/hetzner

      To set up the single shared key:
      1. Place your existing private key at: {{ backup_base_path }}/.ssh/hetzner
      2. Set permissions: chmod 600 {{ backup_base_path }}/.ssh/hetzner
      3. Set ownership: chown {{ backup_user }}:{{ backup_group }} {{ backup_base_path }}/.ssh/hetzner
  when: not hetzner_ssh_key_stat.stat.exists

- name: Deploy SSH config for coordinator connections
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ backup_base_path }}/.ssh/config"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
  become: true

- name: Test SSH connectivity to Hetzner Storage Box
  ansible.builtin.command: >
    ssh -F {{ backup_base_path }}/.ssh/config
    -o StrictHostKeyChecking=accept-new
    -o ConnectTimeout=10
    hetzner-storage
    echo 'Connection successful'
  become: true
  become_user: "{{ backup_user }}"
  register: hetzner_ssh_test
  failed_when: false
  changed_when: false

- name: Warn if Hetzner SSH connection failed
  ansible.builtin.debug:
    msg: "WARNING: Could not connect to Hetzner Storage Box. Please verify SSH key is deployed."
  when: hetzner_ssh_test.rc != 0

- name: Display SSH public keys for target configuration
  ansible.builtin.debug:
    msg: |
      [ssh public keys for coordinator targets]
      {% for result in target_ssh_keys.results %}
      target: {{ result.item.service_name }} ({{ result.item.hostname }})
      key: {{ result.public_key }}

      add to {{ result.item.hostname }} as root:
      echo "{{ result.public_key }}" >> /root/.ssh/authorized_keys

      {% endfor %}
  when: target_ssh_keys.changed

- name: Test SSH connectivity to each target
  ansible.builtin.command: >
    ssh -i {{ item.ssh_key }}
    -o StrictHostKeyChecking=accept-new
    -o ConnectTimeout=10
    {{ item.ssh_user }}@{{ item.hostname }}
    echo 'Connection successful'
  become: true
  become_user: "{{ backup_user }}"
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  register: target_ssh_tests
  failed_when: false
  changed_when: false

- name: Display SSH connectivity results
  ansible.builtin.debug:
    msg: "{{ item.item.service_name }}: {{ 'Connected' if item.rc == 0 else 'FAILED - Check SSH key and network' }}"
  loop: "{{ target_ssh_tests.results }}"
  loop_control:
    label: "{{ item.item.service_name }}"

- name: Create keys directory for coordinator
  ansible.builtin.file:
    path: "{{ backup_base_path }}/keys"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0700'
  become: true

- name: Create password files for each coordinator target
  ansible.builtin.copy:
    content: "{{ item.restic_password }}"
    dest: "{{ backup_base_path }}/keys/{{ item.service_name }}-password"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
  become: true
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"

- name: Deploy repository initialization scripts for each target
  ansible.builtin.template:
    src: restic-init.sh.j2
    dest: "{{ backup_base_path }}/scripts/init-{{ item.service_name }}.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  vars:
    restic_repository: "{{ item.restic_repository }}"
    backup_password_file: "{{ backup_base_path }}/keys/{{ item.service_name }}-password"
    backup_service_name: "{{ item.service_name }}"

- name: Initialize restic repositories for each target
  ansible.builtin.command: "{{ backup_base_path }}/scripts/init-{{ item.service_name }}.sh"
  become: true
  become_user: "{{ backup_user }}"
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  register: repo_init_output
  failed_when: false
  changed_when: true

- name: Display repository status for each target
  ansible.builtin.debug:
    msg: "{{ item.item.service_name }} repository: {{ 'Accessible' if item.rc == 0 else 'Not accessible or not initialized' }}"
  loop: "{{ repo_init_output.results }}"
  loop_control:
    label: "{{ item.item.service_name }}"

- name: Deploy coordinator backup scripts for each target
  ansible.builtin.template:
    src: backup-coordinator-target.sh.j2
    dest: "{{ backup_base_path }}/scripts/backup-{{ item.service_name }}.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  vars:
    target: "{{ item }}"

- name: Deploy systemd services for each target
  ansible.builtin.template:
    src: backup-coordinator.service.j2
    dest: "/etc/systemd/system/backup-{{ item.service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  vars:
    target: "{{ item }}"
  notify: Reload systemd

- name: Deploy systemd timers for each target
  ansible.builtin.template:
    src: backup-coordinator.timer.j2
    dest: "/etc/systemd/system/backup-{{ item.service_name }}.timer"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop: "{{ coordinator_targets }}"
  loop_control:
    label: "{{ item.service_name }}"
  vars:
    target: "{{ item }}"
  notify: Reload systemd

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timers (sequential, respecting priority)
  ansible.builtin.systemd:
    name: "backup-{{ item.service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  loop: "{{ coordinator_targets | sort(attribute='priority') }}"
  loop_control:
    label: "{{ item.service_name }} (priority {{ item.priority }})"

- name: Display coordinator backup summary
  ansible.builtin.debug:
    msg: |
      [coordinator backup configured]
      host: {{ inventory_hostname }}
      targets: {{ coordinator_targets | length }}

      {% for target in coordinator_targets | sort(attribute='priority') %}
      target {{ target.priority }}: {{ target.service_name }}
        hostname: {{ target.hostname }}
        script: {{ backup_base_path }}/scripts/backup-{{ target.service_name }}.sh
        service: backup-{{ target.service_name }}.service
        timer: backup-{{ target.service_name }}.timer
        repository: {{ target.restic_repository }}
        memory limit: {{ target.memory_limit }}

      {% endfor %}
