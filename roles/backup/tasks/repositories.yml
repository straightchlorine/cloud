---
# Multi-repository backup strategy implementation
# Enterprise-grade repository management with service isolation and performance optimization

- name: Create backup user
  user:
    name: "{{ backup_user }}"
    group: "{{ backup_group }}"
    home: "{{ common_backup_base_path }}"
    ansible.builtin.shell: /bin/bash
    system: true
    common_create_home: true
  become: true

- name: Create repository base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true
  loop:
    - "{{ common_backup_base_path }}/scripts"
    - "{{ common_backup_base_path }}/repositories"
    - "{{ common_backup_base_path }}/cache"
    - "{{ common_backup_base_path }}/keys"
    - "{{ common_backup_base_path }}/config"
    - "{{ common_backup_base_path }}/logs"
    - "{{ common_backup_base_path }}/metrics"
    - "{{ common_backup_base_path }}/locks"
    - "{{ common_backup_base_path }}/coordination"
    - "{{ common_backup_base_path }}/reports"
    - "{{ common_backup_base_path }}/dashboards"

- name: Install restic backup tool
  ansible.builtin.get_url:
    url: >-
      https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/restic_{{
      restic_version }}_linux_amd64.bz2
    dest: "/tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2"
    mode: '0644'
  become: true

- name: Extract and install restic
  ansible.builtin.shell: |
    cd /tmp
    bunzip2 restic_{{ backup_restic_version }}_linux_amd64.bz2
    mv restic_{{ backup_restic_version }}_linux_amd64 /usr/local/bin/restic
    chmod +x /usr/local/bin/restic
  become: true
  args:
    creates: /usr/local/bin/restic

- name: Create restic password file
  ansible.builtin.copy:
    content: "{{ backup_restic_password }}"
    dest: "{{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0600'
  become: true
  no_log: true

- name: Generate repository initialization script
  ansible.builtin.template:
    src: init-repositories.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/init-repositories.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Generate service backup script
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/backup-script.sh.j2"
    dest: "{{ common_backup_base_path }}/scripts/backup-{{ backup_device_role }}.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  vars:
    common_backup_service_name: "{{ backup_device_role }}"
    common_backup_directories: "{{ service_backup_configs[device_role].directories }}"
    backup_excludes: "{{ service_backup_configs[device_role].excludes }}"
    pre_backup_commands: "{{ service_backup_configs[device_role].pre_backup_scripts }}"
    post_backup_commands: "{{ service_backup_configs[device_role].post_backup_scripts }}"
    common_backup_password_file: "{{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
    common_backup_cache_dir: "{{ common_backup_base_path }}/cache"
    common_backup_log_dir: "{{ common_backup_base_path }}/logs"
    backup_retention_policy:
      daily: "{{ backup_retention_daily }}"
      weekly: "{{ backup_retention_weekly }}"
      monthly: "{{ backup_retention_monthly }}"
      yearly: "{{ backup_retention_yearly }}"
  become: true

- name: Generate backup coordinator script
  ansible.builtin.template:
    src: backup-coordinator.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/backup-coordinator.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Generate repository health monitor script
  ansible.builtin.template:
    src: repository-health-monitor.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/repository-health-monitor.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Create repository-specific configuration files
  ansible.builtin.template:
    src: repository-config.yml.j2
    dest: "{{ common_backup_base_path }}/config/{{ backup_device_role }}-repository.yml"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0640'
  become: true
  loop: "{{ backup_repositories | dict2items }}"

- name: Generate repository management script
  ansible.builtin.template:
    src: manage-repositories.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/manage-repositories.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Create repository health monitoring script
  ansible.builtin.template:
    src: repository-health-check.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/repository-health-check.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Generate repository performance analyzer
  ansible.builtin.template:
    src: repository-performance.py.j2
    dest: "{{ common_backup_base_path }}/scripts/repository-performance.py"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Create repository encryption key management
  ansible.builtin.template:
    src: manage-encryption-keys.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/manage-encryption-keys.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0700'
  become: true

- name: Generate repository consistency checker
  ansible.builtin.template:
    src: repository-consistency.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/repository-consistency.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Create repository backup orchestrator
  ansible.builtin.template:
    src: repository-orchestrator.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/repository-orchestrator.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Generate repository migration tools
  ansible.builtin.template:
    src: repository-migration.sh.j2
    dest: "{{ common_backup_base_path }}/scripts/repository-migration.sh"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Create repository deduplication analyzer
  ansible.builtin.template:
    src: analyze-deduplication.py.j2
    dest: "{{ common_backup_base_path }}/scripts/analyze-deduplication.py"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0750'
  become: true

- name: Create repository systemd services
  ansible.builtin.template:
    src: repository-backup@.service.j2
    dest: /etc/systemd/system/repository-backup@.service
    mode: '0644'
  become: true
  notify:
    - reload systemd

- name: Create repository backup timers
  ansible.builtin.template:
    src: repository-backup@.timer.j2
    dest: /etc/systemd/system/repository-backup@.timer
    mode: '0644'
  become: true
  notify:
    - reload systemd

- name: Create repository maintenance service
  ansible.builtin.template:
    src: repository-maintenance.service.j2
    dest: /etc/systemd/system/repository-maintenance.service
    mode: '0644'
  become: true
  notify:
    - reload systemd

- name: Create repository maintenance timer
  ansible.builtin.template:
    src: repository-maintenance.timer.j2
    dest: /etc/systemd/system/repository-maintenance.timer
    mode: '0644'
  become: true
  notify:
    - reload systemd

- name: Initialize repositories if they don't exist
  ansible.builtin.command: >
    {{ common_backup_base_path }}/scripts/init-repositories.sh
    --repository {{ item.key }}
    --check-only
  environment:
    RESTIC_REPOSITORY: "{{ backup_restic_repository }}"
    RESTIC_PASSWORD_FILE: "{{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
  register: repository_status
  become_user: backup
  become: true
  loop: "{{ backup_repositories | dict2items }}"
  failed_when: false
  changed_when: false

- name: Create missing repositories
  ansible.builtin.command: >
    {{ common_backup_base_path }}/scripts/init-repositories.sh
    --repository {{ item.item.key }}
    --initialize
  environment:
    RESTIC_REPOSITORY: "{{ backup_restic_repository }}"
    RESTIC_PASSWORD_FILE: "{{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
  become_user: backup
  become: true
  when: item.rc != 0
  loop: "{{ repository_status.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Enable repository backup timers
  ansible.builtin.systemd:
    name: "repository-backup@{{ item.key }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  loop: "{{ backup_repositories | dict2items }}"

- name: Enable repository maintenance timer
  ansible.builtin.systemd:
    name: Repository-maintenance.timer
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Verify repository health
  ansible.builtin.command: >
    {{ common_backup_base_path }}/scripts/repository-health-check.sh
    --repository {{ item.key }}
    --quick-check
  environment:
    RESTIC_REPOSITORY: "{{ backup_restic_repository }}"
    RESTIC_PASSWORD_FILE: "{{ common_backup_base_path }}/keys/{{ backup_device_role }}-password"
  register: repository_health
  become_user: backup
  become: true
  loop: "{{ backup_repositories | dict2items }}"
  failed_when: repository_health.rc != 0
  changed_when: false

- name: Create repository monitoring dashboard
  ansible.builtin.template:
    src: repository-dashboard.json.j2
    dest: "{{ common_backup_base_path }}/dashboards/repository-management.json"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: '0640'
  become: true

- name: Display multi-repository deployment status
  ansible.builtin.debug:
    msg: |
      [OK] Multi-Repository Strategy Deployed:

      [STATS] Repository Configuration:
      {% for repo, config in backup_repositories.items() %}
      - {{ repo | title }} Repository:
        Description: {{ config.description }}
        Retention: {{ config.retention_policy }}
        Priority: {{ config.priority }}
        Compression: {{ config.compression }}
        Check Frequency: {{ config.check_frequency }}
        Max Parallel Ops: {{ config.max_parallel_operations }}
        common_Status: >-
          {{ 'Healthy' if repository_health.results | selectattr('item.key', 'equalto', repo) |
          map(attribute='rc') | first == 0 else 'Needs Attention' }}
      {% endfor %}

      [TOOL] Repository Management:
      - Initialization: {{ common_backup_base_path }}/scripts/init-repositories.sh
      - Management CLI: {{ common_backup_base_path }}/scripts/manage-repositories.sh
      - Health Monitoring: {{ common_backup_base_path }}/scripts/repository-health-check.sh
      - Performance Analysis: {{ common_backup_base_path }}/scripts/repository-performance.py

      [POWER] Automation:
      {% for repo in backup_repositories.keys() %}
      - {{ repo | title }} Timer: repository-backup@{{ repo }}.timer ({{
          'Active' if repository_health.results | selectattr('item.key', 'equalto', repo) |
          map(attribute='rc') | first == 0 else 'Inactive' }})
      {% endfor %}
      - Maintenance Timer: repository-maintenance.timer (Active)

      [SECURE] Security Features:
      - Encryption Key Management: {{ common_backup_base_path }}/scripts/manage-encryption-keys.sh
      - Repository Consistency Checks: Automated via timers
      - Access Control: Backup user isolation with proper permissions

      📈 Monitoring Integration:
      - Grafana Dashboard: repository-management.json
      - Health Metrics: Integrated with Prometheus
      - Performance Analytics: Deduplication efficiency, storage optimization

      [TARGET] Enterprise Benefits:
      - Service Isolation: Separate repositories for different service tiers
      - Performance Optimization: Parallel operations with priority-based scheduling
      - Risk Distribution: Repository failures don't affect entire backup strategy
      - Compliance Support: Separate retention policies per repository type

      Repository infrastructure ready for enterprise backup operations!
