---

os_supported_families:
  - Debian

# Maps ansible_architecture to the download suffix used by Prometheus-style
# releases (linux-<arch>).
os_arch_download_map:
  x86_64: "amd64"
  i386: "386"
  i686: "386"
  armv5tel: "armv5"
  armv5tejl: "armv5"
  armv6l: "armv6"
  armv7l: "armv7"
  armv8l: "arm64"
  aarch64: "arm64"

# Architectures treated as ARM. Some projects collapse every ARM variant down to
# a single "linux-arm" binary (e.g. eko/pihole-exporter) - gating on os_is_arm
# is the robust way to handle that.
os_arch_arm:
  - armv5tel
  - armv5tejl
  - armv6l
  - armv7l
  - armv8l
  - aarch64

os_arch_64bit:
  - x86_64
  - aarch64
