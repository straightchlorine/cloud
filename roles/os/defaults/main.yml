---

os_supported_families:
  - Debian
  # The honeypot VPS runs CentOS Stream, which is RedHat family.
  - RedHat

# Maps ansible_architecture to the download suffix used by Prometheus-style
# releases (linux-<arch>).
os_arch_download_map:
  x86_64: "amd64"
  i386: "386"
  i686: "386"
  armv5tel: "armv5"
  armv5tejl: "armv5"
  armv6l: "armv6"
  armv7l: "armv7"
  armv8l: "arm64"
  aarch64: "arm64"

# Architectures treated as ARM.
# Some projects publish one "linux-arm" binary for every ARM variant, such as eko/pihole-exporter.
# Roles gate on os_is_arm to handle those.
os_arch_arm:
  - armv5tel
  - armv5tejl
  - armv6l
  - armv7l
  - armv8l
  - aarch64

os_arch_64bit:
  - x86_64
  - aarch64
