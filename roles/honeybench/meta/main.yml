---
galaxy_info:
  role_name: honeybench
  namespace: homelab
  author: Ansible Admin
  description: CentOS Stream performance bench VM for the honeywatch sessions-list work
  company: Local
  license: MIT
  min_ansible_version: '2.17'

  platforms:
    - name: EL
      versions:
        - '10'

  galaxy_tags:
    - benchmark
