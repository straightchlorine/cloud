---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: honeybench-fail-fast-validation
    # The image must be RedHat-family because validate.yml asserts the OS family.
    # A Debian container would fail every case for the wrong reason.
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-rockylinux9-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/usr/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  inventory:
    host_vars:
      honeybench-fail-fast-validation:
        # validate.yml asserts honeybench_user == ansible_user, and the connection user in the container is root.
        # The user is given as the uid because `podman exec --user root` fails.
        # The error is "no matching entries in passwd file".
        ansible_user: "0"
  env:
    # Molecule runs from the role directory, so MOLECULE_PROJECT_DIRECTORY is roles/honeybench.
    # Its parent is roles/, which lets `include_role` resolve any role by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # The podman connection needs an existing remote tmp directory when the user is given as a uid.
    ANSIBLE_REMOTE_TMP: /tmp/.ansible

verifier:
  name: ansible
