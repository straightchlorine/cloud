---
provisioner:
  inventory:
    group_vars:
      all:
        # validate.yml asserts honeybench_user == ansible_user. The uid form avoids podman exec --user root,
        # which fails with "no matching entries in passwd file".
        ansible_user: "0"
ansible:
  env:
    # The podman connection needs an existing remote tmp directory when the user is given as a uid.
    ANSIBLE_REMOTE_TMP: /tmp/.ansible
