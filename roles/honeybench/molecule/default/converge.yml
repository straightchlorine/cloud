---
- name: Converge honeybench default
  hosts: all
  become: true
  vars:
    honeybench_user: root
  tasks:
    - name: Configure Docker
      # The Docker packages come from a CentOS 10 repository and need a daemon that the container cannot run.
      # The stub unit and group from prepare.yml stand in for them.
      ansible.builtin.include_role:
        name: honeybench
        tasks_from: docker
      vars:
        honeybench_docker_install_enabled: false

    - name: Apply pending handlers
      ansible.builtin.meta: flush_handlers
