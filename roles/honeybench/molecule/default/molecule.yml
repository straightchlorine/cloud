---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: honeybench-default
    # The image must be RedHat-family because validate.yml asserts the OS family.
    # A Debian container would fail every case for the wrong reason.
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-rockylinux9-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/usr/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # Molecule runs from the role directory, so MOLECULE_PROJECT_DIRECTORY is roles/honeybench.
    # Its parent is roles/, which lets `include_role` resolve any role by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
