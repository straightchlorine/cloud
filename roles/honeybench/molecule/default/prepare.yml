---
- name: Prepare - stand-ins for what docker-ce provides on the real host
  hosts: all
  become: true
  tasks:
    - name: Install a stub docker.service
      # The real docker-ce cannot run in the container.
      # The stub records each start so verify can prove that the Restart docker handler from common fired.
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Docker stub for molecule
          [Service]
          ExecStartPre=/bin/sh -c 'echo start >> /var/tmp/docker-stub-starts'
          ExecStart=/usr/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/docker.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd to see the stub
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Create the docker group the package would create
      ansible.builtin.group:
        name: docker

    - name: Create /etc/docker
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Seed daemon.json with a stale key
      # The role overwrites daemon.json, so the stale key must disappear.
      ansible.builtin.copy:
        content: '{"data-root": "/srv/docker"}'
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
