---
- name: Prepare honeybench default
  hosts: all
  become: true
  tasks:
    - name: Stub docker
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/stub_docker.yml"

    - name: Create the docker group the package would create
      ansible.builtin.group:
        name: docker

    - name: Create /etc/docker
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Seed daemon.json with a stale key
      # The role overwrites daemon.json, so the stale key must disappear.
      ansible.builtin.copy:
        content: '{"data-root": "/srv/docker"}'
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
