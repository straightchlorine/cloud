---
# This removes the data-bearing half of the deploy: bench containers, their data, the worktrees and the dump.
# Packages, Docker and the pinned tools stay, because reinstalling them is the slow part of a redeploy.
# The checkout stays too, because bench/results and bench/plans are untracked and hold the campaign's only record.
# Fetch or archive them first if the host itself is going away.
# The playbook honeybench-teardown.yml gates this file.
- name: Refuse to run outside a confirmed teardown
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_gate
    apply:
      tags: [teardown]
  vars:
    common_teardown_name: honeybench
  tags: [teardown]

- name: Check whether Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: honeybench_docker_bin
  tags: [teardown]

- name: List the bench containers
  ansible.builtin.command: >-
    docker ps -aq --filter name={{ honeybench_container_prefix }}
  become: true
  changed_when: false
  register: honeybench_bench_containers
  when: honeybench_docker_bin.stat.exists
  tags: [teardown]

- name: Remove the bench containers
  ansible.builtin.command: docker rm -f {{ item }}
  become: true
  changed_when: true
  # The listing is skipped when Docker is absent, so its result then has no stdout_lines.
  loop: "{{ honeybench_bench_containers.stdout_lines | default([]) }}"
  when: honeybench_docker_bin.stat.exists
  tags: [teardown]

- name: Find the bench data directories
  ansible.builtin.find:
    paths: "{{ honeybench_cache_dir }}"
    patterns: "{{ honeybench_container_prefix }}-*"
    file_type: directory
  become: true
  register: honeybench_data_dirs
  tags: [teardown]

- name: Remove the bench data, worktrees and dump
  # Become is needed because the Postgres container writes the data directory as its own uid.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ honeybench_data_dirs.files | map(attribute='path') | list
       + [honeybench_worktree_dir, honeybench_dump_dest] }}
  become: true
  tags: [teardown]

- name: Drop the stale worktree registrations
  # The directories are gone, but git still lists them until pruned.
  # Pruning drops only registrations whose directory is missing.
  # Deleting .git/worktrees instead would orphan worktrees that still exist.
  # The command module is needed because ansible.builtin.git has no prune.
  ansible.builtin.command: git worktree prune  # noqa: command-instead-of-module
  args:
    chdir: "{{ honeybench_checkout_dir }}"
  become: false
  changed_when: false
  tags: [teardown]

- name: List what is left
  ansible.builtin.command: >-
    docker ps -aq --filter name={{ honeybench_container_prefix }}
  become: true
  changed_when: false
  register: honeybench_left_containers
  when: honeybench_docker_bin.stat.exists
  tags: [teardown]

- name: Assert the teardown left no bench containers behind
  ansible.builtin.assert:
    # The listing is skipped when Docker is absent, so the default makes that count as no containers.
    that: honeybench_left_containers.stdout_lines | default([]) | length == 0
    fail_msg: "Teardown left bench containers behind."
    success_msg: "[OK] No bench containers remain."
  tags: [teardown]

- name: Assert the worktrees and dump are gone
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_verify_absent
    apply:
      tags: [teardown]
  vars:
    common_teardown_name: honeybench
    common_teardown_paths:
      - "{{ honeybench_worktree_dir }}"
      - "{{ honeybench_dump_dest }}"
  tags: [teardown]
