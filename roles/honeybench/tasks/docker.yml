---
- name: Install and configure Docker
  # The daemon.json is overwritten and not merged, unlike in the honeypot role.
  # Nothing else manages it on a bench VM.
  # A stale key from a manual experiment would silently change what the benchmarks measure.
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_rpm
    apply:
      tags: [honeybench, docker]
  vars:
    common_docker_rpm_install: "{{ honeybench_docker_install_enabled }}"
    common_docker_daemon_options: "{{ honeybench_docker_daemon_options }}"
    common_docker_daemon_merge: false
  tags: [docker]

- name: Let the bench user run docker without sudo
  # Docker group membership is root-equivalent, which is acceptable on a disposable LAN bench VM.
  # bench.sh and measure.py call docker directly.
  ansible.builtin.user:
    name: "{{ honeybench_user }}"
    groups: docker
    append: true
  become: true
  tags: [docker]
