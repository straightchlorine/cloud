---
# This role prepares a performance bench host.
# It installs the toolchain that honeywatch's bench/ needs and checks out the repo.
# Running the bench stays a manual job per campaign, as README.md describes.

# --- Fail-fast validation -----------------------------------------------------
# validate.yml consumes these lists.
# The dump list is only required when the dump is deployed.
honeybench_required_variables:
  - honeybench_user
  - honeybench_repo_url
  - honeybench_repo_version
  - honeybench_tools
  - honeybench_min_free_bytes

honeybench_dump_required_variables:
  - honeybench_dump_src
  - honeybench_dump_sha256

# --- Repository ---------------------------------------------------------------
honeybench_repo_url: https://github.com/straightchlorine/honeywatch.git
# The ref must contain bench/, because a ref without it fails the deploy instead of leaving an empty bench host.
honeybench_repo_version: master

# bench.sh derives the repo root from its own location and puts release worktrees in ../honeywatch-wt.
# The checkout and the worktree root are therefore siblings under the bench user's home.
honeybench_home: "/home/{{ honeybench_user }}"
honeybench_checkout_dir: "{{ honeybench_home }}/honeywatch"
honeybench_worktree_dir: "{{ honeybench_home }}/honeywatch-wt"
# The default data directories of bench.sh (hw-bench-pg*) live here.
honeybench_cache_dir: "{{ honeybench_home }}/.cache"

# --- Prod data dump -----------------------------------------------------------
# The dump holds unredacted attacker data, so it is opt-in.
# It is copied from the controller with a verified checksum.
honeybench_dump_enabled: false
honeybench_dump_dest: "{{ honeybench_checkout_dir }}/honeywatch-prod-data.gz"

# --- Disk ---------------------------------------------------------------------
# One restored bench database is about 2.7 GB.
# The minimum is the least free space that can hold one together with the toolchain.
# Running two releases side by side needs the recommended amount.
honeybench_min_free_bytes: 6442450944
honeybench_recommended_free_bytes: 21474836480

# --- Packages -----------------------------------------------------------------
# The role runs no full update and no dnf-automatic on purpose.
# Kernel and cgroup version are part of every run's recorded fingerprint, so the host must not change under a campaign.
honeybench_packages:
  - git
  - jq
  - tmux
  - rsync
  - tar
  - gzip
  # sysstat provides iostat and sar, for judging steal time and I/O wait during a run.
  - sysstat

# --- Docker -------------------------------------------------------------------
# False skips the Docker repository and package install, because molecule has no Docker daemon.
honeybench_docker_install_enabled: true

honeybench_docker_daemon_options:
  # measure.py reads /sys/fs/cgroup/system.slice/docker-<id>.scope.
  # That path only exists with the systemd cgroup driver on cgroup v2, so the driver is pinned and not assumed.
  exec-opts:
    - native.cgroupdriver=systemd
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: '3'
  # A daemon.json change restarts dockerd, and live-restore keeps a running bench container alive across it.
  live-restore: true
  # bench.sh publishes Postgres as `-p PORT:5432` over an unredacted prod dump.
  # A loopback default publish address keeps it off-host unless a run passes an explicit -p <ip>:...
  ip: 127.0.0.1
  # bench.sh bind-mounts its data directory with :z, which needs SELinux support in the daemon under Enforcing.
  selinux-enabled: true

# --- Pinned tools -------------------------------------------------------------
# Binary downloads are verified, unpacked under honeybench_tools_dir/<name>-<version> and linked into /usr/local/bin.
# A version bump therefore leaves the old tree in place and only moves the link.
# Bump version, url and sha256 together.
# validate.yml checks that the version is in the url and that the sha256 is well formed.
honeybench_tools_dir: /opt/honeybench/tools
honeybench_tools:
  - name: uv
    version: "0.13.5"
    url: https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz
    sha256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    strip_components: 1
    binaries: [uv, uvx]
    version_args: --version
  - name: just
    version: "1.59.0"
    url: https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
    sha256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
    strip_components: 0
    binaries: [just]
    version_args: --version
  - name: k6
    version: "2.0.0"
    url: https://github.com/grafana/k6/releases/download/v2.0.0/k6-v2.0.0-linux-amd64.tar.gz
    sha256: 2ae87d976f6cdba17185bdd980d8819a3a98e9092c6f0638cd58272ecefc8b90
    strip_components: 1
    binaries: [k6]
    version_args: version

# --- Teardown -----------------------------------------------------------------
# The container name prefix that bench.sh uses, as in hw-bench-pg.
honeybench_container_prefix: hw-bench
