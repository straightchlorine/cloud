---

- name: Wait for Pi-hole service to be ready
  ansible.builtin.wait_for:
    port: 80
    host: "{{ primary_ip }}"
    timeout: 60
  tags: [post_validation]

- name: Test Pi-hole DNS resolution
  ansible.builtin.command: |
    nslookup google.com {{ primary_ip }}
  changed_when: false
  tags: [post_validation]

- name: Verify Pi-hole web interface is accessible
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/admin/"
    method: GET
    timeout: 10
  tags: [post_validation]

- name: Authenticate against the Pi-hole v6 REST API
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ vault_pihole_webpassword }}"
    status_code: 200
  register: dns_pihole_auth
  no_log: true
  tags: [post_validation]

- name: Test Pi-hole API response
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/stats/summary"
    method: GET
    headers:
      X-FTL-SID: "{{ dns_pihole_auth.json.session.sid }}"
    timeout: 10
  register: dns_pihole_api
  tags: [post_validation]

- name: Log out of the Pi-hole v6 REST API session
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/auth"
    method: DELETE
    headers:
      X-FTL-SID: "{{ dns_pihole_auth.json.session.sid }}"
    status_code: [200, 204]
  tags: [post_validation]

- name: Verify gravity has an active blocklist
  # A blank gravity.db makes Pi-hole resolve everything normally, for example after a failed blocklist download.
  # This check reads the count directly instead of inferring it from one test domain.
  ansible.builtin.assert:
    that:
      - dns_pihole_api.json.gravity.domains_being_blocked | int > 0
    fail_msg: >-
      Gravity has 0 blocked domains (last update:
      {{ dns_pihole_api.json.gravity.last_update | default('never') }}).
      Run `pihole -g` on the host and check for download failures.
    quiet: true
  tags: [post_validation]

- name: Verify Pi-hole blocks a known ad domain
  ansible.builtin.command: dig +short @{{ primary_ip }} doubleclick.net A
  register: dns_ad_block_test
  changed_when: false
  # Pi-hole answers a blocked domain with 0.0.0.0 or NXDOMAIN, which gives empty output.
  # Any other A record means blocking does not work, so the deploy fails.
  failed_when:
    - dns_ad_block_test.stdout | trim | length > 0
    - "'0.0.0.0' not in dns_ad_block_test.stdout"
  tags: [post_validation]

- name: Check chrony NTP service state
  # This host serves NTP to the network, so an inactive chrony fails the deploy.
  ansible.builtin.systemd:
    name: chrony
  register: dns_ntp_status
  failed_when: dns_ntp_status.status.ActiveState != "active"
  tags: [post_validation]

- name: Verify the Pi-hole Exporter now that Pi-hole runs
  # The fleet play installs the exporter before this play installs Pi-hole, so a first deploy verifies it here.
  # The flag belongs to prometheus-exporters, whose defaults this play does not load.
  ansible.builtin.include_role:
    name: prometheus-exporters
    tasks_from: pihole_exporter_verify
  when: prometheus_exporters_pihole_exporter_enabled | default(false)
  tags: [post_validation]
