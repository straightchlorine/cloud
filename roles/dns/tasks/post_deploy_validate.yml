---

- name: Wait for Pi-hole service to be ready
  ansible.builtin.wait_for:
    port: 80
    host: "{{ primary_ip }}"
    timeout: 60
  tags: [post_validation]

- name: Test Pi-hole DNS resolution
  ansible.builtin.command: |
    nslookup google.com {{ primary_ip }}
  changed_when: false
  tags: [post_validation]

- name: Verify Pi-hole web interface is accessible
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/admin/"
    method: GET
    timeout: 10
  tags: [post_validation]

- name: Authenticate against the Pi-hole v6 REST API
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ vault_pihole_webpassword }}"
    status_code: 200
  register: dns_pihole_auth
  no_log: true
  tags: [post_validation]

- name: Test Pi-hole API response
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/stats/summary"
    method: GET
    headers:
      X-FTL-SID: "{{ dns_pihole_auth.json.session.sid }}"
    timeout: 10
  register: dns_pihole_api
  tags: [post_validation]

- name: Log out of the Pi-hole v6 REST API session
  ansible.builtin.uri:
    url: "http://{{ primary_ip }}/api/auth"
    method: DELETE
    headers:
      X-FTL-SID: "{{ dns_pihole_auth.json.session.sid }}"
    status_code: [200, 204]
  tags: [post_validation]

- name: Verify gravity has an active blocklist
  # A blank gravity.db (e.g. the default-blocklist download failed, or
  # gravity was never rebuilt) makes Pi-hole resolve everything normally -
  # check this directly instead of only inferring it from one test domain.
  ansible.builtin.assert:
    that:
      - dns_pihole_api.json.gravity.domains_being_blocked | int > 0
    fail_msg: >-
      Gravity has 0 blocked domains (last update:
      {{ dns_pihole_api.json.gravity.last_update | default('never') }}).
      Run `pihole -g` on the host and check for download failures.
    quiet: true
  tags: [post_validation]

- name: Verify Pi-hole blocks a known ad domain
  ansible.builtin.command: dig +short @{{ primary_ip }} doubleclick.net A
  register: dns_ad_block_test
  changed_when: false
  # Pi-hole answers a blocked domain with 0.0.0.0 or NXDOMAIN (empty output). A
  # real routable A record means blocking is NOT working -> fail the deploy.
  failed_when:
    - dns_ad_block_test.stdout | trim | length > 0
    - "'0.0.0.0' not in dns_ad_block_test.stdout"
  tags: [post_validation]

- name: Check chrony NTP service state
  # This host serves NTP to the VLAN, so a dead chrony is a deploy failure.
  ansible.builtin.systemd:
    name: chrony
  register: dns_ntp_status
  failed_when: dns_ntp_status.status.ActiveState != "active"
  tags: [post_validation]
