---
# Post-deployment validation for DNS services
# Verifies Pi-hole and related services are working correctly

- name: Wait for Pi-hole service to be ready
  ansible.builtin.wait_for:
    port: 80
    host: "{{ dns_primary_ip }}"
    timeout: 60
  tags: [post_validation]

- name: Test Pi-hole DNS resolution
  ansible.builtin.command: |
    nslookup google.com {{ dns_primary_ip }}
  register: dns_resolution_test
  failed_when: dns_resolution_test.rc != 0
  changed_when: false
  tags: [post_validation]

- name: Verify Pi-hole web interface is accessible
  ansible.builtin.uri:
    url: "http://{{ dns_primary_ip }}/admin/"
    method: GET
    timeout: 10
  register: dns_pihole_web
  tags: [post_validation]

- name: Test Pi-hole API response
  ansible.builtin.uri:
    url: "http://{{ dns_primary_ip }}/admin/api.php?summary"
    method: GET
    timeout: 10
  register: dns_pihole_api
  tags: [post_validation]

- name: Verify Pi-hole is blocking ads
  ansible.builtin.command: |
    nslookup doubleclick.net {{ dns_primary_ip }}
  register: dns_ad_block_test
  failed_when: false
  changed_when: false
  tags: [post_validation]

- name: Check NTP service if enabled
  ansible.builtin.systemd:
    name: Chrony
  register: dns_ntp_status
  when: dns_ntp_server_enabled
  tags: [post_validation]

- name: Verify monitoring services if enabled
  ansible.builtin.wait_for:
    port: "{{ item.port }}"
    timeout: 30
  loop: "{{ dns_additional_services }}"
  when: dns_additional_services | length > 0
  tags: [post_validation]

- name: Display DNS validation results
  ansible.builtin.debug:
    msg: |
      [OK] Pi-hole Post-Deployment Validation Results:

      Pi-hole Service: {{ 'Running' if dns_pihole_web.status == 200 else 'Failed' }}
      DNS Resolution: {{ 'Working' if dns_resolution_test.rc == 0 else 'Failed' }}
      Web Interface: {{ 'Accessible' if dns_pihole_web.status == 200 else 'Failed' }}
      API Response: {{ 'Working' if dns_pihole_api.status == 200 else 'Failed' }}
      Ad Blocking: {{ 'Active' if dns_ad_block_test.rc != 0 else 'Check Required' }}
      NTP Service: {{ dns_ntp_status.status.ActiveState if dns_ntp_server_enabled else 'Disabled' }}

      Pi-hole deployment validated successfully!
  tags: [post_validation]
