---
# Reverses the DNS role so a test host can be redeployed from a near-clean state.
# Order matters because `pihole uninstall` destroys the resolver, so working DNS is restored before storage is reverted.
# The playbooks/dns-teardown.yml playbook refuses to run this on production hosts.

- name: Refuse to run outside a confirmed teardown
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_gate
  vars:
    common_teardown_name: dns

- name: Gather service facts (systemd-timesyncd/systemd-resolved presence varies by image)
  ansible.builtin.service_facts:

- name: Uninstall Pi-hole
  # `yes |` answers the uninstaller's confirm prompt, and `removes:` skips the task once pihole is gone.
  ansible.builtin.shell:
    cmd: set -o pipefail; yes | pihole uninstall
    executable: /bin/bash
  args:
    removes: /usr/local/bin/pihole
  become: true
  # Teardown continues after a partial uninstall, and the artifact checks at the end catch what remains.
  failed_when: false

- name: Remove the pihole system user
  # `pihole uninstall` also removes the user, but its `removes:` guard skips it when the binary is already gone.
  ansible.builtin.user:
    name: pihole
    state: absent
    remove: true
  become: true
  # The user may already be gone.
  failed_when: false

- name: Remove the pihole system group
  ansible.builtin.group:
    name: pihole
    state: absent
  become: true
  # The group may already be gone.
  failed_when: false

- name: Force-remove any leftover Pi-hole config and install directories
  # `pihole uninstall` should already remove these, but a stale /etc/pihole breaks the next install.
  # The installer adds its default blocklist only when adlists.list is absent and otherwise reuses the old gravity.db.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/pihole
    - /etc/.pihole
    - /opt/pihole
  become: true

# The unattended-upgrades configuration is fleet-wide common state and stays, but its reboot-notify cron entry is
# removed.
- name: Remove Pi-hole and notification cron jobs
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_cron
  vars:
    common_teardown_cron_jobs:
      - { name: "Weekly Pi-hole updates", user: root }
      - { name: "Pihole Syncthing local backup", user: root }
      - { name: "Pi-hole Syncthing local backup", user: root }
      - { name: "Reboot pending notification", user: root }


- name: Stop and disable chrony
  ansible.builtin.systemd:
    name: chrony
    state: stopped
    enabled: false
  become: true
  # On a partly torn-down host the chrony unit may already be gone.
  failed_when: false

- name: Purge packages the role installed
  ansible.builtin.apt:
    name:
      - chrony
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Re-enable systemd-timesyncd (chrony had replaced it)
  # masked: false unmasks too, so a previously-masked unit cannot make this fail.
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
    masked: false
  become: true
  when: "'systemd-timesyncd.service' in ansible_facts.services"

- name: Check whether /etc/chrony exists for backup cleanup
  ansible.builtin.stat:
    path: /etc/chrony
  register: dns_teardown_chrony_conf_dir

- name: "Find chrony config backups created by the deploy's 'backup: true'"
  ansible.builtin.find:
    paths: /etc/chrony
    patterns: "chrony.conf.*"
    file_type: file
  register: dns_teardown_chrony_conf_backups
  when: dns_teardown_chrony_conf_dir.stat.exists

- name: Remove chrony config backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dns_teardown_chrony_conf_backups.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  when: dns_teardown_chrony_conf_dir.stat.exists

# `pihole uninstall` does not restore the resolver, so without this block the host would have no working DNS.
# Debian does not enable systemd-resolved by default, so the block checks for it first.
# Without it, a plain resolv.conf with the configured upstream resolvers is written.
- name: Restore working DNS resolution
  become: true
  block:
    - name: Restore systemd-resolved
      when: "'systemd-resolved.service' in ansible_facts.services"
      block:
        - name: Unmask, enable and start systemd-resolved
          ansible.builtin.systemd:
            name: systemd-resolved
            masked: false
            state: started
            enabled: true

        - name: Point /etc/resolv.conf at the systemd-resolved stub
          ansible.builtin.file:
            src: /run/systemd/resolve/stub-resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true

    - name: Write a plain resolv.conf when systemd-resolved is not installed
      # molecule-notest: a container's /etc/resolv.conf is a host bind-mount
      # and cannot be replaced (EBUSY); on a real host it is a plain file.
      when: "'systemd-resolved.service' not in ansible_facts.services"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          {% for dns_server in dns_pihole_dns_servers %}
          nameserver {{ dns_server }}
          {% endfor %}
        mode: "0644"
        force: true
      tags: [molecule-notest]

    - name: Verify the host resolves DNS after teardown
      ansible.builtin.command: getent hosts github.com
      register: dns_teardown_resolve
      changed_when: false
      retries: 3
      delay: 2
      until: dns_teardown_resolve.rc == 0

# This section reverts the journald relocation from storage.yml, because leftover state would confuse a retest.
- name: Stop systemd-journald before reverting storage relocation
  # molecule-idempotence-notest: journald is socket-activated and restarts whenever anything logs.
  # So state=stopped can never converge on a rerun.
  ansible.builtin.systemd:
    name: systemd-journald
    state: stopped
  become: true
  # Teardown continues so the remaining journald reversal and the final checks still run.
  failed_when: false
  tags: [molecule-idempotence-notest]

- name: Unmount the journal bind mount if present
  ansible.posix.mount:
    path: /var/log/journal
    state: absent
  become: true
  # Without an optional drive no bind mount exists, so this can fail harmlessly.
  failed_when: false

- name: Restore default journald storage setting
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: "#Storage=auto"
  become: true
  # Teardown continues so the remaining journald reversal and the final checks still run.
  failed_when: false

- name: Restore the default journald size cap
  # The scripts/dns/validate-clean.sh script expects the size cap to be gone on retest.
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: "#SystemMaxUse="
  become: true
  # Teardown continues so the remaining journald reversal and the final checks still run.
  failed_when: false

- name: Start systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: started
  become: true
  # Teardown continues so the final checks still run.
  failed_when: false

# The optional drive is unmounted and wiped because detect_optional_drive.yml skips any mounted drive.
# A drive left mounted would stop the next deploy from exercising the detect, wipe and format path.
- name: Find what's mounted at the optional drive path (if anything)
  ansible.builtin.set_fact:
    dns_optional_drive_mounted_source: >-
      {{ (ansible_facts.mounts | selectattr('mount', 'equalto', dns_optional_drive_mount_path)
      | list | first).device | default('') }}

- name: Unmount the optional attached drive if mounted
  ansible.posix.mount:
    path: "{{ dns_optional_drive_mount_path }}"
    state: absent
  become: true
  # Without an optional drive nothing is mounted, so this can fail harmlessly.
  failed_when: false

- name: Wipe the drive's filesystem signature so the next run re-tests detection from scratch
  # This also destroys a Syncthing backup directory (dns_backup_dir) held on the drive.
  # That is acceptable on a disposable test host, and the next deploy recreates the directory.
  ansible.builtin.command: "wipefs -a {{ dns_optional_drive_mounted_source }}"
  become: true
  changed_when: true
  # Without an optional drive there is nothing to wipe.
  failed_when: false
  when: dns_optional_drive_mounted_source | length > 0

- name: Tear down Syncthing
  # This runs unconditionally because a retest host can still carry Syncthing from an earlier run.
  # The inventory flag may no longer match, and the teardown tasks are idempotent.
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_teardown

- name: Tear down zram swap
  # This is not gated on common_zram_enabled because foreign zram units would collide with the next deploy's zramswap.
  ansible.builtin.include_role:
    name: common
    tasks_from: zram_teardown

# Self-verification fails the run if anything the role installed is still present.
# A teardown that leaves pihole running would poison the next test run.
- name: Remove the DNS artifacts and verify they are gone
  # The list covers the pihole binary and FTL unit so an interrupted `pihole uninstall` leaves no dangling service.
  # It covers /tmp/pi-hole-repo for runs killed before the deploy cleanup.
  # It also covers the notification helpers and the ntfy API key directory, so no secret survives.
  ansible.builtin.include_role:
    name: common
    tasks_from: teardown_paths
  vars:
    common_teardown_name: dns
    common_teardown_paths:
      - /usr/local/bin/pihole
      - /usr/local/bin/pihole-update
      - /usr/local/bin/pihole-syncthing-backup
      - /usr/local/bin/ntfy-notify
      - /usr/local/bin/reboot-notify
      - /etc/ntfy/notify-api-key
      - /etc/ntfy
      - /var/log/pihole-FTL.log
      - /var/log/pihole.log
      - /var/log/pihole-syncthing-backup.log
      - /etc/logrotate.d/weekly-updates
      - /var/log/weekly-updates.log
      - /etc/chrony/chrony.conf
      - /etc/pihole
      - /opt/pihole
      - /etc/pihole.backup
      - /etc/systemd/system/pihole-FTL.service
      - /tmp/pi-hole-repo

- name: Reload systemd after removing the Pi-hole service unit
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Check for remaining TCP listeners on Pi-hole ports
  ansible.builtin.command: ss -H -ltn
  register: dns_teardown_tcp_listeners
  changed_when: false
  # The assert below judges the output, so a non-zero exit from ss must not stop the play.
  failed_when: false

- name: Check for remaining UDP listeners on the Pi-hole DNS port
  ansible.builtin.command: ss -H -lun
  register: dns_teardown_udp_listeners
  changed_when: false
  # The assert below judges the output, so a non-zero exit from ss must not stop the play.
  failed_when: false

- name: Assert no Pi-hole services still listen on ports 53/80
  # The trailing space avoids matching an mDNS listener on port 5353, because ss separates the local address from the
  # peer column.
  ansible.builtin.assert:
    that:
      - "'0.0.0.0:53 ' not in dns_teardown_tcp_listeners.stdout"
      - "'[::]:53 ' not in dns_teardown_tcp_listeners.stdout"
      - "'0.0.0.0:53 ' not in dns_teardown_udp_listeners.stdout"
      - "'[::]:53 ' not in dns_teardown_udp_listeners.stdout"
      - "'0.0.0.0:80 ' not in dns_teardown_tcp_listeners.stdout"
      - "'[::]:80 ' not in dns_teardown_tcp_listeners.stdout"
    fail_msg: >-
      Pi-hole services still listen on ports 53/80 after teardown. TCP:\n
      {{ dns_teardown_tcp_listeners.stdout }}UDP:\n
      {{ dns_teardown_udp_listeners.stdout }}
    success_msg: "[OK] No Pi-hole services listening on ports 53/80"

# Note: firewall rules the role added are left in place - harmless residue on a
# test box, and reversing ufw risks locking out SSH. Run `ufw --force reset`
# by hand if you want a truly bare firewall.
