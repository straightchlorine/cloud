---
# Reverse the DNS role so the host can be re-tested from a near-clean state.
# Order matters: restore the system resolver LAST so the box keeps working DNS
# throughout. Intended for a disposable test Pi, never the production DNS host
# (playbooks/dns-teardown.yml enforces that guard before including this).

- name: Gather service facts (systemd-timesyncd/systemd-resolved presence varies by image)
  ansible.builtin.service_facts:

- name: Uninstall Pi-hole
  # ponytail: `yes |` answers the uninstaller's confirm prompt; `removes:` makes
  # it idempotent (skips when pihole is already gone). If a future Pi-hole build
  # changes the prompt, switch to the repo's automated install/uninstall.sh.
  ansible.builtin.shell:
    cmd: yes | pihole uninstall
  args:
    removes: /usr/local/bin/pihole
  become: true
  failed_when: false

- name: Remove the pihole system user
  # Belt-and-suspenders, same reasoning as the config cleanup below:
  # `pihole uninstall` does this too, but the `removes:` guard above can skip
  # it entirely on a retry where the binary is already gone but a prior
  # partial run never got this far.
  ansible.builtin.user:
    name: pihole
    state: absent
    remove: true
  become: true
  failed_when: false

- name: Remove the pihole system group
  ansible.builtin.group:
    name: pihole
    state: absent
  become: true
  failed_when: false

- name: Force-remove any leftover Pi-hole config and install directories
  # Belt-and-suspenders: `pihole uninstall` should already remove these, but
  # if it exits early/partially (interrupted, changed prompt, etc.) a stale
  # /etc/pihole silently breaks the next install - the installer only adds
  # its default blocklist when adlists.list is absent, and reuses whatever
  # gravity.db/pihole.toml is already there instead of building fresh ones.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/pihole
    - /etc/.pihole
    - /opt/pihole
  become: true

- name: Remove Pi-hole cron jobs
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: root
  loop:
    - "Weekly Pi-hole updates"
    - "Pi-hole Syncthing local backup"
  become: true
  # Note: unattended-upgrades and its "Reboot pending notification" cron are
  # common-role state (every host has them, like fail2ban/SSH) - out of
  # scope for a DNS-role-only teardown.

- name: Remove DNS role file artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/pihole-update.sh
    - /usr/local/bin/pihole-syncthing-backup.sh
    - /var/log/pihole-syncthing-backup.log
    - /etc/logrotate.d/weekly-updates
    - /var/log/weekly-updates.log
    - /etc/chrony/chrony.conf
    - /etc/pihole.backup
  become: true
  # Note: the Syncthing-shared backup dir (dns_backup_dir) is left intact - it is
  # replicated user data, not role state.

- name: Stop and disable chrony
  ansible.builtin.systemd:
    name: chrony
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Purge packages the role installed
  ansible.builtin.apt:
    name:
      - chrony
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Re-enable systemd-timesyncd (chrony had replaced it)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
  become: true
  when: "'systemd-timesyncd.service' in ansible_facts.services"

# Restore the resolver Pi-hole disabled/rewrote. `pihole uninstall` does NOT do
# this, so without it the host is left with no working DNS. Debian doesn't ship
# systemd-resolved enabled by default (unlike Ubuntu), so check it actually
# exists before trying to use it - otherwise fall back to a plain resolv.conf
# using the same upstream resolvers the role was configured with.
- name: Restore working DNS resolution
  become: true
  block:
    - name: Restore systemd-resolved
      when: "'systemd-resolved.service' in ansible_facts.services"
      block:
        - name: Unmask systemd-resolved
          ansible.builtin.command: systemctl unmask systemd-resolved
          changed_when: false
          failed_when: false

        - name: Enable and start systemd-resolved
          ansible.builtin.systemd:
            name: systemd-resolved
            state: started
            enabled: true

        - name: Point /etc/resolv.conf at the systemd-resolved stub
          ansible.builtin.file:
            src: /run/systemd/resolve/stub-resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true

    - name: Write a plain resolv.conf when systemd-resolved is not installed
      when: "'systemd-resolved.service' not in ansible_facts.services"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          {% for dns_server in dns_pihole_dns_servers %}
          nameserver {{ dns_server }}
          {% endfor %}
        mode: "0644"
        force: true

    - name: Verify the host resolves DNS after teardown
      ansible.builtin.command: getent hosts github.com
      register: dns_teardown_resolve
      changed_when: false
      retries: 3
      delay: 2
      until: dns_teardown_resolve.rc == 0

# Reverse storage.yml's journald relocation (real role state that would
# confuse a retest).
- name: Stop systemd-journald before reverting storage relocation
  ansible.builtin.systemd:
    name: systemd-journald
    state: stopped
  become: true
  failed_when: false

- name: Unmount the journal bind mount if present
  ansible.posix.mount:
    path: /var/log/journal
    state: absent
  become: true
  failed_when: false

- name: Restore default journald storage setting
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: "#Storage=auto"
  become: true
  failed_when: false

- name: Start systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: started
  become: true
  failed_when: false

# The optional-drive mount is also unmounted and wiped, unlike the firewall
# rules below: detect_optional_drive.yml treats anything already mounted as
# "in use" and skips it entirely, so a left-mounted drive can never be
# re-exercised by the next test run - it would silently stop testing the
# detect/wipe/repartition/format path at all.
- name: Find what's mounted at the optional drive path (if anything)
  ansible.builtin.set_fact:
    dns_optional_drive_mounted_source: >-
      {{ (ansible_mounts | selectattr('mount', 'equalto', dns_optional_drive_mount_path)
      | list | first).device | default('') }}

- name: Unmount the optional attached drive if mounted
  ansible.posix.mount:
    path: "{{ dns_optional_drive_mount_path }}"
    state: absent
  become: true
  failed_when: false

- name: Wipe the drive's filesystem signature so the next run re-tests detection from scratch
  ansible.builtin.command: "wipefs -a {{ dns_optional_drive_mounted_source }}"
  become: true
  changed_when: true
  failed_when: false
  when: dns_optional_drive_mounted_source | length > 0

# ponytail: firewall rules the role/firewall added are left in place — harmless
# residue on a test box, and reversing ufw risks locking out SSH. Run
# `ufw --force reset` by hand if you want a truly bare firewall.
