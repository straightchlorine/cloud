---
# Reverse the DNS role so the host can be re-tested from a near-clean state.
# Order matters: `pihole uninstall` destroys the box's resolver, so working DNS
# is restored before the storage reversal and verified again by the self-check
# block at the end. Meant for disposable test Pis, never production
# (playbooks/dns-teardown.yml enforces that guard).

- name: Gather service facts (systemd-timesyncd/systemd-resolved presence varies by image)
  ansible.builtin.service_facts:

- name: Uninstall Pi-hole
  # `yes |` answers the uninstaller's confirm prompt; `removes:` makes it
  # idempotent (skips when pihole is already gone). If a future Pi-hole build
  # changes the prompt, switch to the repo's automated install/uninstall.sh.
  ansible.builtin.shell:
    cmd: yes | pihole uninstall
  args:
    removes: /usr/local/bin/pihole
  become: true
  failed_when: false

- name: Remove the pihole system user
  # Belt-and-suspenders: `pihole uninstall` also does this, but the `removes:`
  # guard above can skip it when the binary is already gone after a partial run.
  ansible.builtin.user:
    name: pihole
    state: absent
    remove: true
  become: true
  failed_when: false

- name: Remove the pihole system group
  ansible.builtin.group:
    name: pihole
    state: absent
  become: true
  failed_when: false

- name: Force-remove any leftover Pi-hole config and install directories
  # Belt-and-suspenders: `pihole uninstall` should already remove these, but a
  # stale /etc/pihole silently breaks the next install - the installer only
  # adds its default blocklist when adlists.list is absent, and otherwise
  # reuses whatever gravity.db/pihole.toml is already there.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/pihole
    - /etc/.pihole
    - /opt/pihole
  become: true

- name: Remove Pi-hole and notification cron jobs
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: root
  loop:
    - "Weekly Pi-hole updates"
    - "Pi-hole Syncthing local backup"
    - "Reboot pending notification"
  become: true
  # unattended-upgrades itself (apt config + reboot cron) is fleet-wide common
  # state, but its reboot-notify.sh helper + cron are cleanly removable too.

- name: Remove DNS role file artifacts
  # Includes the pihole binary and pihole-FTL unit so a retry after a
  # partially-interrupted `pihole uninstall` still leaves no dangling service,
  # plus /tmp/pi-hole-repo for runs killed before the deploy block's cleanup.
  # Also removes the notification scripts deployed by the common role
  # (ntfy-notify.sh, reboot-notify.sh), their ntfy API key file, and the
  # /etc/ntfy dir that held it - so no helper script/secret survives.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/pihole
    - /usr/local/bin/pihole-update.sh
    - /usr/local/bin/pihole-syncthing-backup.sh
    - /usr/local/bin/ntfy-notify.sh
    - /usr/local/bin/reboot-notify.sh
    - /tmp/ntfy-notify.sh.installing
    - /tmp/reboot-notify.sh.installing
    - /tmp/pihole-update.sh.installing
    - /tmp/pihole-syncthing-backup.sh.installing
    - /etc/ntfy/notify-api-key
    - /etc/ntfy
    - /var/log/pihole-FTL.log
    - /var/log/pihole.log
    - /var/log/pihole-syncthing-backup.log
    - /etc/logrotate.d/weekly-updates
    - /var/log/weekly-updates.log
    - /etc/chrony/chrony.conf
    - /etc/pihole.backup
    - /etc/systemd/system/pihole-FTL.service
    - /tmp/pi-hole-repo
  become: true
  # Syncthing-shared backup dir (dns_backup_dir) is left alone - it is
  # replicated user data, not role state (and lives on the optional drive,
  # unmounted and wiped separately below).

- name: Reload systemd after removing the Pi-hole service unit
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Stop and disable chrony
  ansible.builtin.systemd:
    name: chrony
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Purge packages the role installed
  ansible.builtin.apt:
    name:
      - chrony
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Re-enable systemd-timesyncd (chrony had replaced it)
  # masked: false unmasks too, so a previously-masked unit cannot make this fail.
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
    masked: false
  become: true
  when: "'systemd-timesyncd.service' in ansible_facts.services"

- name: Check whether /etc/chrony exists for backup cleanup
  ansible.builtin.stat:
    path: /etc/chrony
  register: dns_teardown_chrony_conf_dir

- name: "Find chrony config backups created by the deploy's 'backup: true'"
  ansible.builtin.find:
    paths: /etc/chrony
    patterns: "chrony.conf.*"
    file_type: file
  register: dns_teardown_chrony_conf_backups
  when: dns_teardown_chrony_conf_dir.stat.exists

- name: Remove chrony config backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dns_teardown_chrony_conf_backups.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  when: dns_teardown_chrony_conf_dir.stat.exists

# Restore the resolver Pi-hole disabled/rewrote. `pihole uninstall` does NOT do
# this, so without it the host would have no working DNS. Debian doesn't ship
# systemd-resolved enabled by default (unlike Ubuntu), so check it exists first,
# else fall back to a plain resolv.conf with the same upstream resolvers.
- name: Restore working DNS resolution
  become: true
  block:
    - name: Restore systemd-resolved
      when: "'systemd-resolved.service' in ansible_facts.services"
      block:
        - name: Unmask systemd-resolved
          ansible.builtin.command: systemctl unmask systemd-resolved
          changed_when: false
          failed_when: false

        - name: Enable and start systemd-resolved
          ansible.builtin.systemd:
            name: systemd-resolved
            state: started
            enabled: true

        - name: Point /etc/resolv.conf at the systemd-resolved stub
          ansible.builtin.file:
            src: /run/systemd/resolve/stub-resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true

    - name: Write a plain resolv.conf when systemd-resolved is not installed
      when: "'systemd-resolved.service' not in ansible_facts.services"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          {% for dns_server in dns_pihole_dns_servers %}
          nameserver {{ dns_server }}
          {% endfor %}
        mode: "0644"
        force: true

    - name: Verify the host resolves DNS after teardown
      ansible.builtin.command: getent hosts github.com
      register: dns_teardown_resolve
      changed_when: false
      retries: 3
      delay: 2
      until: dns_teardown_resolve.rc == 0

# Reverse storage.yml's journald relocation (real role state that would
# confuse a retest, unlike the firewall rules which are left alone below).
- name: Stop systemd-journald before reverting storage relocation
  ansible.builtin.systemd:
    name: systemd-journald
    state: stopped
  become: true
  failed_when: false

- name: Unmount the journal bind mount if present
  ansible.posix.mount:
    path: /var/log/journal
    state: absent
  become: true
  failed_when: false

- name: Restore default journald storage setting
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: "#Storage=auto"
  become: true
  failed_when: false

- name: Start systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: started
  become: true
  failed_when: false

# The optional-drive mount is unmounted and wiped, unlike the firewall rules:
# detect_optional_drive.yml treats anything mounted as "in use" and skips it,
# so a left-mounted drive would silently stop the next run from exercising
# the detect/wipe/repartition/format path at all.
- name: Find what's mounted at the optional drive path (if anything)
  ansible.builtin.set_fact:
    dns_optional_drive_mounted_source: >-
      {{ (ansible_mounts | selectattr('mount', 'equalto', dns_optional_drive_mount_path)
      | list | first).device | default('') }}

- name: Unmount the optional attached drive if mounted
  ansible.posix.mount:
    path: "{{ dns_optional_drive_mount_path }}"
    state: absent
  become: true
  failed_when: false

- name: Wipe the drive's filesystem signature so the next run re-tests detection from scratch
  # Also makes any Syncthing-replicated backup dir on the drive (dns_backup_dir)
  # unreadable - acceptable on a disposable test box; the dir is recreated by
  # the next deploy anyway.
  ansible.builtin.command: "wipefs -a {{ dns_optional_drive_mounted_source }}"
  become: true
  changed_when: true
  failed_when: false
  when: dns_optional_drive_mounted_source | length > 0

# Self-verification: fail loudly if anything the role installed is still around.
# A teardown that "succeeds" while leaving pihole running would silently poison
# the next test run.
- name: Verify key Pi-hole artifacts are gone
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/pihole
    - /etc/pihole
    - /opt/pihole
    - /etc/systemd/system/pihole-FTL.service
    - /etc/chrony/chrony.conf
    - /usr/local/bin/ntfy-notify.sh
    - /usr/local/bin/reboot-notify.sh
    - /etc/ntfy/notify-api-key
    - /etc/ntfy
  register: dns_teardown_verify

- name: Assert key Pi-hole artifacts are gone
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: "{{ item.item }} still exists after teardown"
    success_msg: "[OK] {{ item.item }} removed"
  loop: "{{ dns_teardown_verify.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check for remaining TCP listeners on Pi-hole ports
  ansible.builtin.command: ss -H -ltn
  register: dns_teardown_tcp_listeners
  changed_when: false
  failed_when: false

- name: Check for remaining UDP listeners on the Pi-hole DNS port
  ansible.builtin.command: ss -H -lun
  register: dns_teardown_udp_listeners
  changed_when: false
  failed_when: false

- name: Assert no Pi-hole services still listen on ports 53/80
  # Trailing space (not a plain '0.0.0.0:53' substring) avoids matching the
  # always-present mDNS/avahi listener on 5353 - ss always separates the local
  # address field from the peer column, so the space is a reliable boundary.
  ansible.builtin.assert:
    that:
      - "'0.0.0.0:53 ' not in dns_teardown_tcp_listeners.stdout"
      - "'[::]:53 ' not in dns_teardown_tcp_listeners.stdout"
      - "'0.0.0.0:53 ' not in dns_teardown_udp_listeners.stdout"
      - "'[::]:53 ' not in dns_teardown_udp_listeners.stdout"
      - "'0.0.0.0:80 ' not in dns_teardown_tcp_listeners.stdout"
      - "'[::]:80 ' not in dns_teardown_tcp_listeners.stdout"
    fail_msg: >-
      Pi-hole services still listen on ports 53/80 after teardown. TCP:\n
      {{ dns_teardown_tcp_listeners.stdout }}UDP:\n
      {{ dns_teardown_udp_listeners.stdout }}
    success_msg: "[OK] No Pi-hole services listening on ports 53/80"

# Note: firewall rules the role added are left in place - harmless residue on a
# test box, and reversing ufw risks locking out SSH. Run `ufw --force reset`
# by hand if you want a truly bare firewall.
