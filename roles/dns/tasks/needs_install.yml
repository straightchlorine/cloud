---
# Publishes dns_pihole_needs_install. A reinstall wipes /etc/pihole, so it runs only when Pi-hole is missing or a
# reinstall is forced. The installed version is deliberately not compared with dns_pihole_version: basic-install.sh
# clones the current Pi-hole itself, so an installed host never reports the pinned tag, and `pihole -v` reads a
# versions file that holds "null" whenever git cannot read the checkouts (see git_safe_directory.yml).
# Either mismatch would reinstall the host and discard a restored Teleporter archive.
- name: Check for the Pi-hole binary
  ansible.builtin.stat:
    path: "{{ dns_pihole_binary_path }}"
  register: dns_pihole_binary

- name: Check for an existing Pi-hole gravity database
  ansible.builtin.stat:
    path: "{{ dns_pihole_gravity_path }}"
  register: dns_pihole_gravity
  become: true

- name: Decide whether Pi-hole needs (re)installing
  ansible.builtin.set_fact:
    dns_pihole_needs_install: >-
      {{ dns_pihole_force_reinstall
      or not dns_pihole_binary.stat.exists
      or not dns_pihole_gravity.stat.exists }}
