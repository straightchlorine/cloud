---
# Additional monitoring services for DNS server

- name: Install Netdata for system monitoring
  when: dns_additional_services | selectattr('name', 'equalto', 'netdata') | list | length > 0
  block:
    - name: Install Netdata via package manager
      ansible.builtin.apt:
        name: netdata
        state: present
        update_cache: true
      become: true

# Pi-hole metrics: see prometheus_exporters_pihole_exporter_enabled
# (roles/prometheus-exporters), which is the single source of truth for
# this exporter across all hosts.
