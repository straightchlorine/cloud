---
# The installer falls back to alternate web ports when the default ones look busy, and a restored Teleporter archive
# carries the old host's value (the 3B+ has a plain "80"), but the firewall, exporter and validation expect these.
# The regexp takes any quoted value and skips the dns.port line, which has none.
- name: Pin the web interface to ports 80/443
  ansible.builtin.lineinfile:
    path: /etc/pihole/pihole.toml
    regexp: '^  port = ".*'
    line: '  port = "80o,[::]:80o,[::]:443os,443os"'
  become: true
  notify: Restart pihole-FTL
