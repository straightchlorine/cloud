---
# Secondary LOCAL Pi-hole backup (Teleporter config archive + a consistent
# pihole-FTL.db snapshot). The primary off-site backup is the restic role.

- name: Validate local backup configuration
  ansible.builtin.assert:
    that:
      - dns_backup_dir is defined
      - dns_backup_owner is defined
    fail_msg: >-
      dns_backup_dir (the Syncthing-shared folder, ideally on the plugged drive)
      and dns_backup_owner (the user that runs Syncthing) must be set in host_vars
      when dns_backup_enabled is true.
    quiet: true

- name: Ensure the Syncthing backup directory exists
  ansible.builtin.file:
    path: "{{ dns_backup_dir }}"
    state: directory
    owner: "{{ dns_backup_owner }}"
    mode: "0750"
  become: true

- name: Render the Pi-hole Syncthing backup script to staging
  # Jinja template (embeds web password) rendered first, then installed by
  # coreutils `install` below with root:root + 0700.
  ansible.builtin.template:
    src: pihole-syncthing-backup.sh.j2
    dest: /tmp/pihole-syncthing-backup.sh.installing
    mode: "0700"
  become: true

- name: Install the Pi-hole Syncthing backup script with coreutils install
  ansible.builtin.command:
    argv:
      - install
      - -o
      - root
      - -g
      - root
      - -m
      - "0700"
      - /tmp/pihole-syncthing-backup.sh.installing
      - /usr/local/bin/pihole-syncthing-backup.sh
  become: true
  changed_when: false

- name: Remove the pihole-syncthing-backup.sh staging copy
  ansible.builtin.file:
    path: /tmp/pihole-syncthing-backup.sh.installing
    state: absent
  become: true

- name: Schedule the Pi-hole Syncthing backup
  ansible.builtin.cron:
    name: "Pi-hole Syncthing local backup"
    minute: "{{ dns_backup_schedule_minute }}"
    hour: "{{ dns_backup_schedule_hour }}"
    job: "/usr/local/bin/pihole-syncthing-backup.sh >> /var/log/pihole-syncthing-backup.log 2>&1"
    user: root
  become: true
