---
# Secondary LOCAL Pi-hole backup into a Syncthing folder; restic is the
# off-site copy. The target vars are asserted up front in validate.yml.

- name: Install the nightly local snapshot backup
  ansible.builtin.include_role:
    name: common
    tasks_from: stack_snapshot_backup
  vars:
    common_snapshot_name: "pihole"
    common_snapshot_stack_home: "/etc/pihole"
    common_snapshot_dest: "{{ dns_backup_dir }}"
    common_snapshot_owner: "{{ dns_backup_owner }}"
    common_snapshot_retention: "{{ dns_backup_retention }}"
    common_snapshot_hour: "{{ dns_backup_schedule_hour }}"
    common_snapshot_minute: "{{ dns_backup_schedule_minute }}"
    common_snapshot_summary: "Teleporter config archive and a rolling pihole-FTL.db copy"
    common_snapshot_steps:
      # The FTL CLI export needs no API session, so no password lands in the script.
      - |
        (cd "$WORK" && pihole-FTL --teleporter)
      # Query history is instance-local (docs/backup/restore.md): one rolling copy
      # beside the dated snapshots, not one per retained day. sqlite .backup is
      # consistent against the live FTL writer; the rename keeps it atomic.
      - |
        if [ -f /etc/pihole/pihole-FTL.db ]; then
            pihole-FTL sqlite3 /etc/pihole/pihole-FTL.db ".backup '$WORK/pihole-FTL.db'"
            chown "$OWNER" "$WORK/pihole-FTL.db"
            mv "$WORK/pihole-FTL.db" "$DEST/pihole-FTL.db"
        fi

- name: Remove the cron entry of the previous Pi-hole backup script
  # The shared task names its entry "Pihole Syncthing local backup"; this one
  # points at the same script path and would run it a second time.
  ansible.builtin.cron:
    name: "Pi-hole Syncthing local backup"
    user: root
    state: absent
  become: true
