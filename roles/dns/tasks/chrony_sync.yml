---
# chrony must be syncing before the Pi-hole install: the gravity build downloads
# blocklists over HTTPS, which fails TLS validation on a wrong clock. NTP
# firewall rules come later, after the firewall role installs ufw.

- name: Gather service facts to check for systemd-timesyncd
  ansible.builtin.service_facts:

- name: Stop systemd-timesyncd service
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  become: true
  when: "'systemd-timesyncd.service' in ansible_facts.services"

- name: Install chrony package
  ansible.builtin.apt:
    name: chrony
    state: present
  become: true

- name: Create chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: Restart chrony

- name: Enable and start chrony service
  # molecule-idempotence-notest: containers lack CAP_SYS_TIME, so systemd
  # skips the unit (ConditionCapability) and the task reports changed on
  # every run there. On real hosts it converges normally.
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  become: true
  tags: [molecule-idempotence-notest]

- name: Wait for chrony to sync
  # timeout: waitsync's own retry loop can spin for minutes when the daemon
  # is unreachable (e.g. a container without CAP_SYS_TIME). Never block the
  # deploy on it - the task below warns and proceeds.
  ansible.builtin.command: timeout 30 chronyc waitsync 10 0.5
  become: true
  register: dns_chrony_sync_result
  changed_when: false
  failed_when: false

- name: Warn if chrony did not sync in time
  ansible.builtin.debug:
    msg: >-
      chronyc waitsync did not confirm sync within the timeout
      ({{ dns_chrony_sync_result.stdout | default('no output') }}).
      Proceeding anyway - the Pi-hole install may fail TLS validation if the
      clock is still wrong.
  when: dns_chrony_sync_result.rc != 0
