---
# Opportunistically uses an attached-but-unused drive if one is found - never
# required. See roles/common/tasks/detect_optional_drive.yml for the
# (non-destructive) detection this depends on.
#
# What we do with it, and why: systemd-journald writes constantly, so
# relocating it off the SD card is the real card-longevity win. We don't
# touch Pi-hole's own gravity.db/query-log/FTL database paths - those are
# baked into the installer and fragile to relocate for little extra benefit.
# The Syncthing backup dir (dns_backup_dir) can be pointed at
# {{ dns_optional_drive_mount_path }} manually in host_vars if you want it
# there too - no auto-magic, it's already a plain configurable var.

- name: Detect an optional attached drive
  ansible.builtin.include_role:
    name: common
    tasks_from: detect_optional_drive

- name: No optional drive found - continuing on the SD card only
  ansible.builtin.debug:
    msg: "No unmounted secondary drive found."
  when: not common_optional_drive_present

- name: Use the optional attached drive
  when: common_optional_drive_present
  block:
    - name: Refuse to use an unformatted/unpartitioned drive unless explicitly allowed
      ansible.builtin.fail:
        msg: >-
          {{ common_optional_drive_device }} has no usable filesystem{{
          " (it's a bare disk, or its partition table is empty/stale/multi-partition with nothing in use)"
          if common_optional_drive_is_whole_disk else '' }}.
          Format it yourself, or set dns_optional_drive_format: true in
          host_vars to let this role wipe {{ common_optional_drive_device }}
          {{ 'entirely (any existing partition table included) ' if common_optional_drive_is_whole_disk else '' }}
          and format it as {{ dns_optional_drive_filesystem }} (DESTRUCTIVE).
      when:
        - not common_optional_drive_has_filesystem
        - not dns_optional_drive_format

    - name: Wipe any existing partition table before repartitioning
      # Only reached with dns_optional_drive_format explicitly true. Needed
      # because the "whole disk" case includes stale/multi-partition tables
      # (e.g. a recycled drive) - wipefs guarantees a truly blank device for
      # parted below, rather than trying to reconcile with leftover
      # partitions that aren't in use but are still on the disk.
      ansible.builtin.command: "wipefs -a {{ common_optional_drive_device }}"
      become: true
      changed_when: true
      when:
        - not common_optional_drive_has_filesystem
        - common_optional_drive_is_whole_disk

    - name: Create a single partition spanning the whole disk
      community.general.parted:
        device: "{{ common_optional_drive_device }}"
        label: gpt
        number: 1
        state: present
        part_end: "100%"
      become: true
      when:
        - not common_optional_drive_has_filesystem
        - common_optional_drive_is_whole_disk

    - name: Determine the partition to format and mount
      # '1' only applies once we've just created a fresh partition above
      # (whole disk, no filesystem yet). A whole disk that already has a
      # filesystem was formatted directly with no partition table at all -
      # the target there is the disk device itself, not device+"1".
      ansible.builtin.set_fact:
        dns_optional_drive_target: >-
          {{ (common_optional_drive_device ~ '1')
          if (common_optional_drive_is_whole_disk and not common_optional_drive_has_filesystem)
          else common_optional_drive_device }}

    - name: Format the optional drive (only runs when explicitly allowed above)
      community.general.filesystem:
        fstype: "{{ dns_optional_drive_filesystem }}"
        dev: "{{ dns_optional_drive_target }}"
      become: true
      when: not common_optional_drive_has_filesystem

    - name: Create the mount point
      ansible.builtin.file:
        path: "{{ dns_optional_drive_mount_path }}"
        state: directory
        mode: "0755"
      become: true

    - name: Mount the optional drive
      ansible.posix.mount:
        path: "{{ dns_optional_drive_mount_path }}"
        src: "{{ dns_optional_drive_target }}"
        fstype: "{{ dns_optional_drive_filesystem }}"
        opts: "defaults,noatime,errors=remount-ro"
        state: mounted
      become: true

    - name: Relocate systemd-journald storage onto the drive
      when: dns_optional_drive_journald_enabled
      block:
        - name: Create the journal directory on the drive
          ansible.builtin.file:
            path: "{{ dns_optional_drive_mount_path }}/journal"
            state: directory
            owner: root
            group: systemd-journal
            mode: "2755"
          become: true

        - name: Stop systemd-journald before relocating storage
          ansible.builtin.systemd:
            name: systemd-journald
            state: stopped
          become: true

        - name: Bind-mount the drive's journal directory over /var/log/journal
          ansible.posix.mount:
            path: /var/log/journal
            src: "{{ dns_optional_drive_mount_path }}/journal"
            fstype: none
            opts: bind
            state: mounted
          become: true

        - name: Ensure journald is configured for persistent storage
          ansible.builtin.lineinfile:
            path: /etc/systemd/journald.conf
            regexp: '^#?Storage='
            line: "Storage=persistent"
          become: true

        - name: Start systemd-journald
          ansible.builtin.systemd:
            name: systemd-journald
            state: started
          become: true
