---
# Optional, non-destructive: use an attached-but-unused drive if one exists
# (see roles/common/tasks/detect_optional_drive.yml for the detection). Only
# journald is relocated off the SD card - Pi-hole's own DB paths are baked
# into the installer and fragile to move. dns_backup_dir is a plain var if you
# also want that on the drive.

- name: Detect an optional attached drive
  ansible.builtin.include_role:
    name: common
    tasks_from: detect_optional_drive

- name: No optional drive found - continuing on the SD card only
  ansible.builtin.debug:
    msg: "No unmounted secondary drive found."
  when: not common_optional_drive_present

- name: Use the optional attached drive
  when: common_optional_drive_present
  block:
    - name: Determine whether the drive needs (re)formatting
      # "Has a filesystem" isn't enough - a foreign one we don't want (e.g. a
      # leftover installer USB stick) would be reused as-is. Only treat the drive
      # as ready if what's there matches what we actually want.
      ansible.builtin.set_fact:
        dns_optional_drive_needs_format: "{{ common_optional_drive_fstype != dns_optional_drive_filesystem }}"

    - name: Refuse to use an unformatted/unexpected drive unless explicitly allowed
      ansible.builtin.fail:
        msg: >-
          {{ common_optional_drive_device }} {{ 'has no usable filesystem'
          if not common_optional_drive_has_filesystem else
          "has '" + common_optional_drive_fstype + "', not '" + dns_optional_drive_filesystem + "'"
          }}{{ " (it's a bare disk, or its partition table is empty/stale/multi-partition with nothing in use)"
          if common_optional_drive_is_whole_disk else '' }}.
          Format it yourself, or set dns_optional_drive_format: true in
          host_vars to let this role wipe {{ common_optional_drive_device }}
          {{ 'entirely (any existing partition table included) ' if common_optional_drive_is_whole_disk else '' }}
          and format it as {{ dns_optional_drive_filesystem }} (DESTRUCTIVE).
      when:
        - dns_optional_drive_needs_format
        - not dns_optional_drive_format

    - name: Wipe any existing partition table before repartitioning
      # Only reached with dns_optional_drive_format true - covers whole disks
      # with stale/multi-partition tables and foreign filesystems, so sfdisk
      # below starts from a truly blank device.
      ansible.builtin.command: "wipefs -a {{ common_optional_drive_device }}"
      become: true
      changed_when: true
      when:
        - dns_optional_drive_needs_format
        - common_optional_drive_is_whole_disk

    - name: Create a single partition spanning the whole disk
      # sfdisk over community.general.parted: util-linux is Essential on Debian,
      # parted is not installed by default. "type=L" = plain Linux partition;
      # omitting size makes it span the rest of the disk.
      ansible.builtin.command:
        cmd: "sfdisk {{ common_optional_drive_device }}"
        stdin: "type=L"
      become: true
      changed_when: true
      when:
        - dns_optional_drive_needs_format
        - common_optional_drive_is_whole_disk

    - name: Wait for the kernel to expose the new partition device
      # sfdisk doesn't guarantee the new /dev/sdaN node exists immediately -
      # USB-attached drives on a Pi are known-flaky here. partprobe forces a
      # re-read; the stat loop waits for the device file before formatting.
      when:
        - dns_optional_drive_needs_format
        - common_optional_drive_is_whole_disk
      block:
        - name: Force the kernel to re-read the partition table
          ansible.builtin.command: "partprobe {{ common_optional_drive_device }}"
          become: true
          changed_when: false

        - name: Wait for the partition device to appear
          ansible.builtin.stat:
            path: "{{ common_optional_drive_device }}1"
          register: dns_optional_drive_new_partition
          until: dns_optional_drive_new_partition.stat.exists
          retries: 10
          delay: 1

    - name: Determine the partition to format and mount
      # A '1' suffix only applies to a partition we just created. A whole disk
      # that already matches our filesystem was formatted bare (no partition
      # table), so the target there is the device itself.
      ansible.builtin.set_fact:
        dns_optional_drive_target: >-
          {{ (common_optional_drive_device ~ '1')
          if (common_optional_drive_is_whole_disk and dns_optional_drive_needs_format)
          else common_optional_drive_device }}

    - name: Format the optional drive (only runs when explicitly allowed above)
      community.general.filesystem:
        fstype: "{{ dns_optional_drive_filesystem }}"
        dev: "{{ dns_optional_drive_target }}"
        force: "{{ dns_optional_drive_needs_format and not common_optional_drive_is_whole_disk }}"
      become: true
      when: dns_optional_drive_needs_format

    - name: Create the mount point
      ansible.builtin.file:
        path: "{{ dns_optional_drive_mount_path }}"
        state: directory
        mode: "0755"
      become: true

    - name: Mount the optional drive
      ansible.posix.mount:
        path: "{{ dns_optional_drive_mount_path }}"
        src: "{{ dns_optional_drive_target }}"
        fstype: "{{ dns_optional_drive_filesystem }}"
        opts: "defaults,noatime,errors=remount-ro"
        state: mounted
      become: true

    - name: Relocate systemd-journald storage onto the drive
      ansible.builtin.include_role:
        name: common
        tasks_from: journald_relocate
      when: dns_optional_drive_journald_enabled
      vars:  # noqa: var-naming[no-role-prefix]
        common_journald_path: "{{ dns_optional_drive_mount_path }}/journal"
