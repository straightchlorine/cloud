---

# The os role must run first because validate.yml asserts on its os_family fact.
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [dns, validation, facts]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run Pi-hole deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ dns_pihole_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Set up an optional attached drive if present
  ansible.builtin.include_tasks: storage.yml
  tags: [storage]

- name: Install or update Pi-hole
  ansible.builtin.include_tasks: install.yml

- name: Apply the Pi-hole DNS settings from host_vars
  ansible.builtin.include_tasks: configure.yml

- name: Sync the Pi-hole admin password to the vault
  ansible.builtin.include_role:
    name: common
    tasks_from: pihole_password_sync

- name: Configure automatic updates
  ansible.builtin.include_tasks: auto_updates.yml
  when: dns_auto_updates_enabled

- name: Configure secondary local backup for Syncthing
  ansible.builtin.include_tasks: backup.yml
  when: dns_backup_enabled

- name: Authorize the off-site pull of the backup folder
  ansible.builtin.include_tasks: backup_pull_key.yml
  when: dns_backup_pull_enabled

- name: Share the backup folder through Syncthing
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing_share
  vars:
    common_syncthing_share_folders:
      - {id: backup, path: "{{ dns_backup_dir }}"}
  when: dns_backup_enabled

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Configure firewall for NTP
  # This must run after the firewall role, which installs ufw.
  # Chrony itself is installed earlier by common/tasks/chrony.yml.
  community.general.ufw:
    rule: allow
    port: "123"
    proto: udp
    src: "{{ item }}"
    comment: "Allow NTP (chrony) from VLAN"
  loop: "{{ common_ntp_allowed_networks }}"
  become: true
  when: common_ntp_server_enabled

- name: Re-apply the fleet notification helpers (ntfy + unattended-upgrades)
  ansible.builtin.include_role:
    name: common
    tasks_from: base_reapply
  tags: [dns, common, base]

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation]
