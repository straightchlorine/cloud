---
# DNS server setup tasks for Debian Bookworm on Raspberry Pi 3B

- name: Run Pi-hole deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: Common
    tasks_from: network_facts
  tags: [network, facts]

- name: Include common package management
  ansible.builtin.include_role:
    name: Common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ pihole_packages }}"
  tags: [packages]

- name: Clone Pi-hole repository for secure installation
  ansible.builtin.git:
    repo: "{{ pihole_git_repo }}"
    dest: /tmp/pi-hole-repo
    version: "{{ pihole_version }}"
    depth: 1
    force: true
  become: true
  register: pihole_clone

- name: Verify Pi-hole installer exists in repository
  ansible.builtin.stat:
    path: /tmp/pi-hole-repo/automated install/basic-install.sh
  register: pihole_installer
  failed_when: not pihole_installer.stat.exists or pihole_installer.stat.size < 1000

- name: Verify Pi-hole repository commit
  ansible.builtin.shell: |
    cd /tmp/pi-hole-repo
    git rev-parse --verify HEAD
  register: pihole_commit_hash
  become: true
  changed_when: false

- name: Display Pi-hole repository information for verification
  ansible.builtin.debug:
    msg: |
      Pi-hole repository cloned successfully
      Version: {{ pihole_version }}
      Commit: {{ pihole_commit_hash.stdout }}
      Install script location: /tmp/pi-hole-repo/automated install/basic-install.sh
      Script size: {{ pihole_installer.stat.size }} bytes
      Last modified: {{ pihole_installer.stat.mtime }}

      Security enhancements implemented:
      [OK] Using official GitHub repository (not direct script download)
      [OK] Pinned to specific version tag for reproducibility
      [OK] Commit hash verification for integrity
      [OK] Allows code review before installation
      [OK] Verifiable source and provenance

- name: Create Pi-hole configuration directory
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: root
    ansible.builtin.group: root
    mode: '0755'
  become: true

- name: Create Pi-hole setup vars file
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    owner: root
    ansible.builtin.group: root
    mode: '0600'
  become: true
  notify: restart pihole-FTL

- name: Install Pi-hole using verified repository
  ansible.builtin.shell: |
    cd "/tmp/pi-hole-repo/automated install/"
    bash basic-install.sh --unattended
  become: true
  args:
    creates: /usr/local/bin/pihole
  notify: restart pihole-FTL

- name: Set Pi-hole web admin password
  ansible.builtin.shell: |
    pihole -a -p "{{ vault_pihole_webpassword }}"
  become: true
  when: vault_pihole_webpassword is defined
  no_log: true

- name: Clean up Pi-hole repository after installation
  ansible.builtin.file:
    path: /tmp/pi-hole-repo
    state: absent
  become: true

- name: Configure automatic updates
  ansible.builtin.include_tasks: auto_updates.yml
  when: auto_updates_enabled

- name: Configure firewall
  ansible.builtin.include_role:
    name: Firewall
  tags: [firewall, security]

- name: Configure chrony NTP server
  ansible.builtin.include_tasks: chrony.yml

- name: Install additional monitoring services
  ansible.builtin.include_tasks: monitoring.yml
  when: additional_services is defined and additional_services | length > 0

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation, never]
