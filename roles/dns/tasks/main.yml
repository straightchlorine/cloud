---

# DNS / Pi-hole host provisioning. The os role publishes os_* facts
# (incl. os_arch_download) that this role's validation and arch-specific
# downloads rely on.
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [dns, validation, facts]

- name: Gather network facts for dynamic configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [network, facts]

- name: Run Pi-hole deployment validation
  ansible.builtin.include_tasks: validate.yml
  tags: [validation]

- name: Include common package management
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    role_specific_packages: "{{ dns_pihole_packages }}"  # noqa: var-naming[no-role-prefix]
  tags: [packages]

- name: Sync system time before installing Pi-hole
  ansible.builtin.include_tasks: chrony_sync.yml

- name: Set up an optional attached drive if present
  ansible.builtin.include_tasks: storage.yml
  tags: [storage]

- name: Deploy Pi-hole with rollback on failure
  block:
    - name: Check for an existing Pi-hole configuration
      ansible.builtin.stat:
        path: /etc/pihole
      register: dns_pihole_existing
      become: true

    - name: Preserve existing Pi-hole configuration for rollback
      # cp -a, not the copy module: pihole-FTL runs as the pihole user, so the
      # snapshot has to keep ownership, modes and timestamps or the rescue
      # block restores a directory FTL cannot write.
      ansible.builtin.command: cp -a /etc/pihole /etc/pihole.backup
      args:
        creates: /etc/pihole.backup
      become: true
      when: dns_pihole_existing.stat.exists

    - name: Clear existing Pi-hole configuration for a clean reinstall
      # It's fully preserved in /etc/pihole.backup above (restored by the
      # rescue block on failure). Leaving old contents in place instead would
      # make the installer skip installDefaultBlocklists() (it only adds
      # StevenBlack's list when adlists.list is absent) and reuse a stale
      # gravity.db, silently leaving blocking non-functional.
      ansible.builtin.file:
        path: /etc/pihole
        state: absent
      become: true
      when: dns_pihole_existing.stat.exists

    - name: Clone Pi-hole repository for secure installation
      ansible.builtin.git:
        repo: "{{ dns_pihole_git_repo }}"
        dest: /tmp/pi-hole-repo
        version: "{{ dns_pihole_version }}"
        depth: 1
        force: true
      become: true

    - name: Create Pi-hole configuration directory
      ansible.builtin.file:
        path: /etc/pihole
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Create Pi-hole setup vars file
      ansible.builtin.template:
        src: setupVars.conf.j2
        dest: /etc/pihole/setupVars.conf
        owner: root
        group: root
        mode: '0600'
      become: true
      notify: Restart pihole-FTL

    - name: Install Pi-hole using verified repository
      ansible.builtin.shell: |
        cd "/tmp/pi-hole-repo/automated install/"
        bash basic-install.sh --unattended
      become: true
      args:
        # /usr/local/bin/pihole is installed early (installScripts()), long
        # before FTL, gravity and the pihole.toml migration finish - using it
        # as the completion marker would make a retry after a partial failure
        # skip the installer entirely. gravity.db is written by runGravity(),
        # one of the last steps, so it only exists once install truly succeeded.
        creates: /etc/pihole/gravity.db
      notify: Restart pihole-FTL

    - name: Set Pi-hole web admin password
      ansible.builtin.shell: |
        pihole setpassword "{{ vault_pihole_webpassword }}"
      become: true
      no_log: true

    - name: Rebuild gravity now that FTL and DNS resolution have settled
      # basic-install.sh's own runGravity() fires immediately after FTL's
      # first restart, sometimes before DNS resolution has settled - that
      # can silently produce an empty blocklist even though the installer
      # reports success. Rerunning it here, once, has reliably fixed it.
      ansible.builtin.command: pihole -g
      become: true

    - name: Clean up Pi-hole repository and rollback backup after success
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/pi-hole-repo
        - /etc/pihole.backup
      become: true

  rescue:
    - name: Pi-hole deployment failed - stopping service
      ansible.builtin.systemd:
        name: pihole-FTL
        state: stopped
      become: true
      ignore_errors: true

    - name: Restore Pi-hole configuration from backup, or clear a failed fresh install
      ansible.builtin.shell: |
        if [ -d "/etc/pihole.backup" ]; then
          rm -rf /etc/pihole
          mv /etc/pihole.backup /etc/pihole
        else
          rm -rf /etc/pihole
        fi
      become: true
      ignore_errors: true

    - name: Start Pi-hole service after rollback
      ansible.builtin.systemd:
        name: pihole-FTL
        state: started
      become: true
      ignore_errors: true

    - name: Clean up Pi-hole repository after failed deployment
      ansible.builtin.file:
        path: /tmp/pi-hole-repo
        state: absent
      become: true
      ignore_errors: true

    - name: Notify ntfy of the failed deployment
      ansible.builtin.include_role:
        name: common
        tasks_from: ntfy_notify
      vars:
        common_ntfy_title: "Pi-hole deploy failed: {{ inventory_hostname }}"
        common_ntfy_message: "Rollback was attempted. Check ansible-playbook output for the actual error."
        common_ntfy_priority: "high"
        common_ntfy_tags: "rotating_light"

    - name: Fail with deployment error
      ansible.builtin.fail:
        msg: "Pi-hole deployment failed and rollback was attempted. Check the errors above."

- name: Configure automatic updates
  ansible.builtin.include_tasks: auto_updates.yml
  when: dns_auto_updates_enabled

- name: Configure secondary local backup for Syncthing
  ansible.builtin.include_tasks: backup.yml
  when: dns_backup_enabled

- name: Install Syncthing (common role, optional)
  ansible.builtin.include_role:
    name: common
    tasks_from: syncthing
  when: common_syncthing_enabled | default(false) | bool and dns_backup_enabled

- name: Ensure Syncthing backup folder is configured
  ansible.builtin.command: >
    syncthing cli config folders list | grep -q "backup" || \
    syncthing cli config folders add --id "backup" --label "backup" --path "{{ dns_backup_dir }}"
  when: common_syncthing_enabled | default(false) | bool and dns_backup_enabled
  changed_when: false

- name: Configure firewall
  ansible.builtin.include_role:
    name: firewall
  tags: [firewall, security]

- name: Configure firewall for NTP
  # Must run after the firewall role, which installs ufw. Chrony itself is
  # installed and synced earlier, in chrony_sync.yml.
  community.general.ufw:
    rule: allow
    port: "123"
    proto: udp
    src: "{{ item }}"
    comment: "Allow NTP (chrony) from VLAN"
  loop: "{{ dns_ntp_allowed_networks }}"
  become: true
  when: dns_ntp_server_enabled

- name: Run post-deployment validation
  ansible.builtin.include_tasks: post_deploy_validate.yml
  tags: [post_validation]
