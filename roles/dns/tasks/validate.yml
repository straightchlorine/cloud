---
# The site.yml pre-validation includes this file directly instead of through main.yml, so it runs OS discovery itself.
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [validation]

- name: Gather network facts
  # Standalone inclusion needs this because only network_facts defines primary_network_cidr and primary_interface.
  ansible.builtin.include_role:
    name: common
    tasks_from: network_facts
  tags: [validation]

- name: Run DNS services comprehensive validation
  ansible.builtin.include_role:
    name: common
    tasks_from: unified_validation
  vars:  # noqa: var-naming[no-role-prefix]
    validation_context: "DNS services"
    validation_type: "full"
    validation_role: "dns"
    validation_supported_os_families: [Debian]
    required_variables:
      - vault_pihole_webpassword
      - dns_pihole_interface
      - dns_pihole_dns_servers
      - common_ntp_server_enabled
      - common_ntp_upstream_server
    vault_placeholders:
      - { var: "vault_pihole_webpassword", value: "your-secure-web-password" }
  tags: [validation]

- name: Validate NTP allowed networks are set when serving NTP to the VLAN
  ansible.builtin.fail:
    msg: "common_ntp_allowed_networks must be non-empty when common_ntp_server_enabled is true"
  when:
    - common_ntp_server_enabled
    - common_ntp_allowed_networks | length == 0

- name: Validate the Syncthing backup target is set when the local backup is enabled
  ansible.builtin.fail:
    msg: "{{ item }} must be set in host_vars when dns_backup_enabled is true"
  when:
    - dns_backup_enabled
    - lookup('ansible.builtin.vars', item, default=none) | default(none) is none
  loop:
    - dns_backup_dir
    - dns_backup_owner

- name: Validate the off-site pull is fully specified
  vars:
    dns_pull_pubkey_value: "{{ lookup('ansible.builtin.vars', 'dns_backup_pull_pubkey', default='') | default('') }}"
    dns_pull_from_value: "{{ lookup('ansible.builtin.vars', 'dns_backup_pull_from', default='') | default('') }}"
  ansible.builtin.fail:
    msg: "{{ item.msg }}"
  when:
    - dns_backup_pull_enabled
    - item.fail
  loop:
    - msg: "dns_backup_pull_enabled needs dns_backup_enabled: the pull reads dns_backup_dir"
      fail: "{{ not dns_backup_enabled }}"
    - msg: "dns_backup_pull_pubkey must be set in host_vars when dns_backup_pull_enabled is true"
      fail: "{{ dns_pull_pubkey_value == '' }}"
    - msg: "dns_backup_pull_from must be set in host_vars when dns_backup_pull_enabled is true"
      fail: "{{ dns_pull_from_value == '' }}"
    - msg: "dns_backup_pull_pubkey must be a public key line (ssh-ed25519 ...), not a private key or a placeholder"
      # A missing key is reported by the check above, so this one only judges a value that is set.
      fail: >-
        {{ dns_pull_pubkey_value != ''
           and dns_pull_pubkey_value is not match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-[a-z0-9]+) +[A-Za-z0-9+/=]{20,}') }}
  loop_control:
    label: "{{ item.msg }}"

- name: Validate specified interface exists
  ansible.builtin.fail:
    msg: |
      Network interface {{ dns_pihole_interface }} does not exist.
      Available: {{ ansible_facts.interfaces | join(', ') }}
  when: dns_pihole_interface not in ansible_facts.interfaces
