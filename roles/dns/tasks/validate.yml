---
# Uses unified validation framework to eliminate redundancy

# This file is also included directly by site.yml's pre-deployment validation
# (include_role: dns tasks_from: validate), which does NOT run main.yml - so it
# must be self-sufficient here rather than relying on the os include that
# starts main.yml. Running the discovery again is idempotent and cheap.
- name: Discover the device OS and architecture
  ansible.builtin.include_role:
    name: os
  tags: [validation]

- name: Run DNS services comprehensive validation
  ansible.builtin.include_role:
    name: common
    tasks_from: unified_validation
  vars:  # noqa: var-naming[no-role-prefix]
    validation_context: "DNS services"
    validation_type: "full"
    validation_role: "dns"
    required_variables:
      - vault_pihole_webpassword
      - dns_pihole_interface
      - dns_pihole_dns_servers
      - dns_ntp_server_enabled
      - dns_ntp_upstream_server
    vault_placeholders:
      - { var: "vault_pihole_webpassword", value: "your-secure-web-password" }
    common_backup_directories:
      - "/etc/pihole"
      - "/opt/pihole"
  tags: [validation]

# First, cheapest gate before touching any dns/pihole logic - consumes the
# os_* facts published by the os discovery role above.
- name: Confirm the host OS and architecture are supported
  ansible.builtin.assert:
    that:
      - os_family == "Debian"
      - os_arch_download is defined
    fail_msg: >-
      DNS requires a Debian-family OS; got
      {{ os_family | default('unknown') }}
      ({{ os_name | default('?') }} {{ os_version | default('?') }}) on
      {{ os_arch_machine | default('unknown') }}.
    success_msg: >-
      [OK] Supported OS/arch: {{ os_name }} {{ os_version }}
      ({{ os_arch_machine }}, download suffix '{{ os_arch_download }}')
  tags: [validation]

- name: Validate NTP allowed networks are set when serving NTP to the VLAN
  ansible.builtin.fail:
    msg: "dns_ntp_allowed_networks must be non-empty when dns_ntp_server_enabled is true"
  when:
    - dns_ntp_server_enabled
    - dns_ntp_allowed_networks | length == 0

- name: Validate specified interface exists
  ansible.builtin.fail:
    msg: |
      Network interface {{ dns_pihole_interface }} does not exist.
      Available: {{ ansible_interfaces | join(', ') }}
  when: dns_pihole_interface not in ansible_interfaces
