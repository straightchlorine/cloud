---
# DNS services deployment validation
# Uses unified validation framework to eliminate redundancy

- name: Run DNS services comprehensive validation
  ansible.builtin.include_role:
    name: common
    tasks_from: unified_validation
  vars:  # noqa: var-naming[no-role-prefix]
    validation_context: "DNS services"
    validation_type: "full"
    validation_role: "dns"
    required_variables:
      - vault_pihole_webpassword
      - vault_domain_name
      - vault_letsencrypt_email
      - dns_pihole_interface
      - dns_pihole_ipv4_address
      - dns_pihole_dns_servers
      - dns_ntp_server_enabled
      - restic_enabled
      - restic_repository
      - restic_password
    vault_placeholders:
      - { var: "vault_pihole_webpassword", value: "your-secure-web-password" }
    common_backup_directories:
      - "/etc/pihole"
      - "/opt/pihole"
    critical_backup_paths: []  # Pi-hole dirs created during deployment
    stack_home: "/opt/pihole"  # For service validation
    required_services: []  # Pi-hole doesn't use Docker Compose
  tags: [validation]

- name: Check network interface exists
  ansible.builtin.setup:
    filter: ansible_interfaces
  register: dns_interface_facts

- name: Validate specified interface exists
  ansible.builtin.fail:
    msg: |
      Network interface {{ dns_pihole_interface }} does not exist.
      Available: {{ ansible_interfaces | join(', ') }}
  when: dns_pihole_interface not in ansible_interfaces

- name: Validate IPv4 address format
  ansible.builtin.fail:
    msg: "dns_pihole_ipv4_address must be in CIDR format (e.g., 192.168.1.10/24)"
  when: not (dns_pihole_ipv4_address | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'))

- name: Check DNS port availability
  ansible.builtin.wait_for:
    port: 53
    timeout: 1
  register: dns_port_check
  failed_when: false

- name: Warn if DNS port is in use
  ansible.builtin.debug:
    msg: "WARNING: Port 53 appears to be in use. Pi-hole installation may conflict with existing DNS service."
  when: dns_port_check.elapsed is defined and dns_port_check.elapsed < 1

- name: Test configured DNS servers
  ansible.builtin.command: nslookup google.com {{ item }}
  register: dns_upstream_test
  failed_when: false
  changed_when: false
  loop: "{{ dns_pihole_dns_servers }}"

- name: Warn about unreachable DNS servers
  ansible.builtin.debug:
    msg: "WARNING: Configured DNS server {{ item.item }} may not be reachable"
  when: item.rc != 0
  loop: "{{ dns_upstream_test.results }}"
  loop_control:
    label: "{{ item.item }}"
