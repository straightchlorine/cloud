---
# Chrony NTP server configuration for pi-dns

- name: Stop systemd-timesyncd service
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  become: true
  # Ignore errors - service may not be enabled or installed on all systems
  ignore_errors: true

- name: Install chrony package
  ansible.builtin.apt:
    name: chrony
    state: present
  become: true

- name: Create chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: Restart chrony

- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  become: true

- name: Configure firewall for NTP
  community.general.ufw:
    rule: allow
    port: "123"
    proto: udp
    src: "{{ primary_network_cidr }}"
    comment: "Allow NTP (chrony) from VLAN only"
  become: true

- name: Wait for chrony to sync
  ansible.builtin.wait_for:
    timeout: 30

- name: Check chrony sources
  ansible.builtin.command: chronyc sources
  register: dns_chrony_sources
  changed_when: false
  become: true

- name: Display chrony sources
  ansible.builtin.debug:
    var: dns_chrony_sources.stdout_lines
