---
# Chrony NTP server configuration for pi-dns

- name: Stop systemd-timesyncd service
  ansible.builtin.systemd:
    name: Systemd-timesyncd
    state: stopped
    enabled: false
  become: true
  # Ignore errors - service may not be enabled or installed on all systems
  ignore_errors: true

- name: Install chrony package
  ansible.builtin.apt:
    name: Chrony
    state: present
  become: true

- name: Create chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: restart chrony

- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: Chrony
    state: started
    enabled: true
  become: true

- name: Configure firewall for NTP
  ufw:
    rule: allow
    port: "123"
    proto: udp
    comment: "Allow NTP (chrony)"
  become: true

- name: Wait for chrony to sync
  ansible.builtin.wait_for:
    timeout: 30

- name: Check chrony sources
  ansible.builtin.command: chronyc sources
  register: chrony_sources
  changed_when: false
  become: true

- name: Display chrony sources
  ansible.builtin.debug:
    var: chrony_sources.stdout_lines
