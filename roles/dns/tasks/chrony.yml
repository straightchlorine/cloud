---
# Chrony NTP server configuration for pi-dns. The install/sync itself happens
# earlier, in chrony_sync.yml (before the Pi-hole install block, so gravity's
# blocklist download has correct system time). This file only adds the
# firewall rule (needs ufw, installed by the firewall role) and shows status.

- name: Configure firewall for NTP
  community.general.ufw:
    rule: allow
    port: "123"
    proto: udp
    src: "{{ primary_network_cidr }}"
    comment: "Allow NTP (chrony) from VLAN only"
  become: true

- name: Wait for chrony to sync
  ansible.builtin.wait_for:
    timeout: 30

- name: Check chrony sources
  ansible.builtin.command: chronyc sources
  register: dns_chrony_sources
  changed_when: false
  become: true

- name: Display chrony sources
  ansible.builtin.debug:
    var: dns_chrony_sources.stdout_lines
