---
# Debian packages are handled fleet-wide by common auto_updates.yml, not here.

- name: Configure the weekly Pi-hole update
  ansible.builtin.include_role:
    name: common
    tasks_from: app_update
  vars:
    common_app_update_name: pihole
    common_app_update_label: Pi-hole
    common_app_update_steps:
      - pihole -up
      - pihole -g
      - systemctl restart pihole-FTL
    common_app_update_weekday: "{{ dns_auto_update_day[:3] | lower }}"
    common_app_update_hour: "{{ dns_auto_update_time.split(':')[0] }}"
    common_app_update_minute: "{{ dns_auto_update_time.split(':')[1] }}"
