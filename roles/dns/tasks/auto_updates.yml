---

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  become: true

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Create Pi-hole update script
  ansible.builtin.template:
    src: pihole-update.sh.j2
    dest: /usr/local/bin/pihole-update.sh
    owner: root
    group: root
    mode: '0700'  # embeds vault_ntfy_api_key
  become: true

- name: Create weekly update cron job
  ansible.builtin.cron:
    name: "Weekly Pi-hole updates"
    minute: "{{ dns_auto_update_time.split(':')[1] }}"
    hour: "{{ dns_auto_update_time.split(':')[0] }}"
    weekday: "{{ dns_auto_update_day[:3] | lower }}"
    job: "/usr/local/bin/pihole-update.sh >> /var/log/weekly-updates.log 2>&1"
    user: root
  become: true

- name: Create log rotation for update logs
  ansible.builtin.template:
    src: weekly-updates-logrotate.j2
    dest: /etc/logrotate.d/weekly-updates
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Compute reboot-pending notification time (12 hours before auto-reboot)
  ansible.builtin.set_fact:
    dns_reboot_notify_total_minutes: >-
      {{ ((dns_auto_updates_reboot_time.split(':')[0] | int * 60
      + dns_auto_updates_reboot_time.split(':')[1] | int - 720) % 1440) }}
  when: dns_auto_updates_reboot_if_required

- name: Create reboot-pending notification script
  ansible.builtin.template:
    src: pihole-reboot-notify.sh.j2
    dest: /usr/local/bin/pihole-reboot-notify.sh
    owner: root
    group: root
    mode: '0700'  # embeds vault_ntfy_api_key
  become: true
  when: dns_auto_updates_reboot_if_required

- name: Schedule reboot-pending notification
  ansible.builtin.cron:
    name: "Pi-hole reboot pending notification"
    minute: "{{ dns_reboot_notify_total_minutes | int % 60 }}"
    hour: "{{ dns_reboot_notify_total_minutes | int // 60 }}"
    job: "/usr/local/bin/pihole-reboot-notify.sh"
    user: root
  become: true
  when: dns_auto_updates_reboot_if_required
