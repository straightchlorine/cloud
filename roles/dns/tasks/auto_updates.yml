---
# Weekly Pi-hole update (pihole -up/-g). Debian package updates are handled
# fleet-wide by the common role (roles/common/tasks/auto_updates.yml).

- name: Render the Pi-hole update script to staging
  # Jinja template (notify title/hostname) rendered first, then placed by
  # coreutils `install` below with guaranteed root:root + 0755.
  ansible.builtin.template:
    src: pihole-update.sh.j2
    dest: /tmp/pihole-update.sh.installing
    mode: '0755'
  become: true

- name: Install the Pi-hole update script with coreutils install
  ansible.builtin.command:
    argv:
      - install
      - -o
      - root
      - -g
      - root
      - -m
      - "0755"
      - /tmp/pihole-update.sh.installing
      - /usr/local/bin/pihole-update.sh
  become: true
  changed_when: false

- name: Remove the pihole-update.sh staging copy
  ansible.builtin.file:
    path: /tmp/pihole-update.sh.installing
    state: absent
  become: true

- name: Create weekly update cron job
  ansible.builtin.cron:
    name: "Weekly Pi-hole updates"
    minute: "{{ dns_auto_update_time.split(':')[1] }}"
    hour: "{{ dns_auto_update_time.split(':')[0] }}"
    weekday: "{{ dns_auto_update_day[:3] | lower }}"
    job: "/usr/local/bin/pihole-update.sh >> /var/log/weekly-updates.log 2>&1"
    user: root
  become: true

- name: Create log rotation for update logs
  ansible.builtin.template:
    src: weekly-updates-logrotate.j2
    dest: /etc/logrotate.d/weekly-updates
    owner: root
    group: root
    mode: '0644'
  become: true
