---
dns_pihole_git_repo: "https://github.com/pi-hole/pi-hole.git"
dns_pihole_version: "v6.4.3"  # Pin to verified release; override per host in host_vars.
# pihole_webpassword: MUST be set in vault/host_vars - no default.
dns_pihole_interface: "{{ primary_interface }}"
dns_pihole_dns_servers:
  - 9.9.9.9
  - 149.112.112.112

dns_pihole_packages:
  - git
  - curl
  - ca-certificates
  - dnsutils
  - jq

# Pi-hole itself; Debian package updates are fleet-wide via the common role.
dns_auto_updates_enabled: true
dns_auto_update_time: "2:00"
dns_auto_update_day: "Monday"

# Local Syncthing backup (Teleporter + FTL DB); primary/off-site is restic.
dns_backup_enabled: false
dns_backup_retention: 14
dns_backup_schedule_hour: "3"
dns_backup_schedule_minute: "30"
# Must be set in host_vars:
# dns_backup_dir:   Syncthing-shared folder
# dns_backup_owner: the Syncthing user

# chrony_sync.yml always syncs the clock; this only gates whether it also
# advertises as an NTP server for the VLAN (chrony.conf.j2 `allow` + firewall).
dns_ntp_server_enabled: false
dns_ntp_allowed_networks: []

# Metrics are exported by prometheus-exporters, not this role.
# Optional attached drive - opt in per host; no-op if none is found (see storage.yml).
dns_optional_drive_mount_path: "/mnt/data"
dns_optional_drive_filesystem: "ext4"
dns_optional_drive_format: false  # DESTRUCTIVE if true - opt in per host
dns_optional_drive_journald_enabled: true
