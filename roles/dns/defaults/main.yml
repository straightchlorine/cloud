---
# Default values for DNS role (Pi-hole)

# Pi-hole Installation Security
dns_pihole_git_repo: "https://github.com/pi-hole/pi-hole.git"
dns_pihole_version: "v6.4.3"  # Pin to verified release version
dns_pihole_verify_commit: true

# Pi-hole Configuration
# pihole_webpassword: MUST be set in vault or host_vars - no default
dns_pihole_interface: "{{ primary_interface }}"
dns_pihole_dns_servers:
  - 9.9.9.9
  - 149.112.112.112
dns_pihole_domain: local
dns_pihole_ipv6: false

# Package Configuration
dns_pihole_packages:
  - git
  - curl
  - ca-certificates
  - dnsutils

# Automatic Updates
dns_auto_updates_enabled: true
dns_auto_update_time: "2:00"
dns_auto_update_day: "Monday"

# Unattended Upgrades
dns_auto_updates_reboot_if_required: false
dns_auto_updates_reboot_time: "03:00"

# Unbound Configuration
dns_unbound_interface: "127.0.0.1"
dns_unbound_port: 5335
dns_unbound_threads: 1
dns_unbound_cache_size: "4m"

# Secondary local backup (Teleporter + FTL DB snapshot) for Syncthing.
# Primary/off-site backup remains the restic coordinator.
dns_backup_enabled: false
dns_backup_retention: 14
dns_backup_schedule_hour: "3"
dns_backup_schedule_minute: "30"
# dns_backup_dir:   MUST be set in host_vars - the Syncthing-shared folder
# dns_backup_owner: MUST be set in host_vars - the user that runs Syncthing

# Additional Services
dns_additional_services: []

dns_ntp_server_enabled: false

# Pi-hole metrics are exported by the prometheus-exporters role
# (prometheus_exporters_pihole_exporter_enabled), not by this role.
