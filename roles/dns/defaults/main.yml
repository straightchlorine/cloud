# Default values for DNS role (Pi-hole)

# Pi-hole Installation Security
pihole_git_repo: "https://github.com/pi-hole/pi-hole.git"
pihole_version: "v5.18.3" # Pin to verified release version
pihole_verify_commit: true

# Pi-hole Configuration
# pihole_webpassword: MUST be set in vault or host_vars - no default
pihole_interface: "{{ primary_interface }}"
pihole_dns_servers:
  - 9.9.9.9
  - 149.112.112.112
pihole_domain: local
pihole_ipv6: false

# Package Configuration
pihole_packages:
  - git
  - curl
  - ca-certificates
  - dnsutils

# Automatic Updates
auto_updates_enabled: true
auto_update_time: "2:00"
auto_update_day: "Monday"

# Additional Services
additional_services: []

# Pi-hole Exporter Configuration
pihole_exporter_enabled: false
pihole_exporter_user: "pihole-exporter"
pihole_exporter_install_dir: "/opt/pihole-exporter"
pihole_exporter_port: 9617
pihole_exporter_version: "0.3.0"
pihole_exporter_binary_url: "https://github.com/eko/pihole-exporter/releases/download/v{{ pihole_exporter_version }}/pihole_exporter-linux-arm64"

