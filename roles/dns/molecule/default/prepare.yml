---
- name: Prepare - platform prerequisites the role assumes
  hosts: all
  become: true
  tasks:
    - name: Install cron and iproute2
      # The cron module needs the crontab binary from the cron package.
      # The teardown scenario's port assertions need ss from iproute2, and the minimal test image has neither.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
        state: present
        update_cache: true

    - name: Create the backup owner user
      # The backup.yml task file sets dns_backup_owner as the owner of the Syncthing backup directory.
      ansible.builtin.user:
        name: molecule
        system: true
