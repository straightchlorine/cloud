---
- name: Prepare - platform prerequisites the role assumes
  hosts: all
  become: true
  tasks:
    - name: Install cron and iproute2
      # The cron module needs the crontab binary (cron package); the teardown
      # scenario's port assertions need ss (iproute2). Neither is guaranteed
      # in the minimal test image.
      ansible.builtin.apt:
        name:
          - cron
          - iproute2
        state: present
        update_cache: true

    - name: Create the backup owner user
      # backup.yml chowns the Syncthing backup dir to dns_backup_owner.
      ansible.builtin.user:
        name: molecule
        system: true
