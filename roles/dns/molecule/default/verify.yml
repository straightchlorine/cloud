---
- name: Verify DNS role
  hosts: all
  tasks:
    - name: Read the rendered Pi-hole setupVars
      ansible.builtin.slurp:
        src: /tmp/setupVars.rendered
      register: dns_setupvars

    - name: Decode rendered setupVars
      ansible.builtin.set_fact:
        dns_setupvars_content: "{{ dns_setupvars.content | b64decode }}"

    - name: Assert Pi-hole setupVars rendered with populated values
      ansible.builtin.assert:
        that:
          - "'PIHOLE_INTERFACE=eth0' in dns_setupvars_content"
          - "'PIHOLE_DNS_1=9.9.9.9' in dns_setupvars_content"
        fail_msg: "setupVars.conf did not render correctly:\n{{ dns_setupvars_content }}"
        success_msg: "[OK] Pi-hole setupVars template renders with populated values"

    - name: Read the rendered chrony.conf
      ansible.builtin.slurp:
        src: /tmp/chrony.conf.rendered
      register: dns_chrony_conf

    - name: Assert chrony.conf serves NTP when dns_ntp_server_enabled is true
      ansible.builtin.assert:
        that:
          - "'allow 192.168.1.0/24' in (dns_chrony_conf.content | b64decode)"
        fail_msg: "chrony.conf did not render the allow line for dns_ntp_allowed_networks"
        success_msg: "[OK] chrony.conf renders NTP-server access rules"

    - name: Verify the update/backup scripts rendered
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dns_rendered_files
      loop:
        - /tmp/pihole-update.rendered.sh
        - /tmp/pihole-syncthing-backup.rendered.sh

    - name: Assert update/backup scripts exist and are non-empty
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "{{ item.item }} did not render"
        success_msg: "[OK] {{ item.item }} rendered"
      loop: "{{ dns_rendered_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the rendered Pi-hole update script
      ansible.builtin.slurp:
        src: /tmp/pihole-update.rendered.sh
      register: dns_update_script_rendered

    - name: Assert the update script calls the shared ntfy helper by bare name
      ansible.builtin.assert:
        that:
          - "'ntfy-notify.sh' in (dns_update_script_rendered.content | b64decode)"
          - "'/usr/local/bin/ntfy-notify.sh' not in (dns_update_script_rendered.content | b64decode)"
          - "'molecule-test-ntfy-key' not in (dns_update_script_rendered.content | b64decode)"
        fail_msg: >-
          pihole-update.sh.j2 should call the shared ntfy-notify.sh by bare
          name (relies on common's PATH cron entry), not a hardcoded path,
          and must not embed vault_ntfy_api_key itself.
        success_msg: "[OK] Update script calls ntfy-notify.sh via PATH without embedding the API key"

    - name: Read the rendered Pi-hole Syncthing backup script
      ansible.builtin.slurp:
        src: /tmp/pihole-syncthing-backup.rendered.sh
      register: dns_backup_script_rendered

    - name: Assert the backup script rendered its dir/retention and calls ntfy-notify.sh by bare name
      ansible.builtin.assert:
        that:
          - "'DEST=\"/tmp/molecule-syncthing-backup\"' in (dns_backup_script_rendered.content | b64decode)"
          - "'RETENTION=\"14\"' in (dns_backup_script_rendered.content | b64decode)"
          - "'ntfy-notify.sh' in (dns_backup_script_rendered.content | b64decode)"
          - "'/usr/local/bin/ntfy-notify.sh' not in (dns_backup_script_rendered.content | b64decode)"
          - "'molecule-test-ntfy-key' not in (dns_backup_script_rendered.content | b64decode)"
        fail_msg: >-
          pihole-syncthing-backup.sh.j2 did not render dns_backup_dir/dns_backup_retention,
          or does not call the shared ntfy-notify.sh by bare name without embedding the API key.
        success_msg: "[OK] Syncthing backup script renders backup config and calls ntfy-notify.sh via PATH"
