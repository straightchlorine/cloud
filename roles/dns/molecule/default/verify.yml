---
- name: Verify dns default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Assert deployed files and the backup directory
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - { path: /usr/local/bin/pihole-update, state: file, mode: "0755", owner: root }
          - { path: /usr/local/bin/pihole-syncthing-backup, state: file, mode: "0755", owner: root }
          - { path: /etc/logrotate.d/weekly-updates, state: file, mode: "0644" }
          - { path: /tmp/molecule-syncthing-backup, state: directory, mode: "0750", owner: molecule }

    - name: Read the deployed and rendered files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /usr/local/bin/pihole-update
        - /usr/local/bin/pihole-syncthing-backup
        - /etc/logrotate.d/weekly-updates
        - /etc/chrony/chrony.conf
        - /tmp/setupVars.rendered
      register: dns_slurped

    - name: Decode the files by path
      ansible.builtin.set_fact:
        dns_content: >-
          {{ dict(dns_slurped.results | map(attribute='item')
             | zip(dns_slurped.results | map(attribute='content') | map('b64decode'))) }}

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      register: dns_root_crontab

    - name: Assert the update script content
      vars:
        script: "{{ dns_content['/usr/local/bin/pihole-update'] }}"
      ansible.builtin.assert:
        that:
          - "'pihole -up' in script"
          - "'pihole -g' in script"
          - "'/var/log/weekly-updates.log' in script"
          - "'ntfy-notify ' in script"
          - "'/usr/local/bin/ntfy-notify' not in script"
          - "'molecule-test-password' not in script"
        fail_msg: "pihole-update rendered wrong: {{ script }}"
        quiet: true

    - name: Assert the backup script content
      vars:
        script: "{{ dns_content['/usr/local/bin/pihole-syncthing-backup'] }}"
      ansible.builtin.assert:
        that:
          - "'DEST=\"/tmp/molecule-syncthing-backup\"' in script"
          - "'RETENTION=\"14\"' in script"
          - "'OWNER=\"molecule\"' in script"
          - "'pihole-FTL --teleporter' in script"
          - "'molecule-test-password' not in script"
          - "'ntfy-notify ' in script"
          - "'/usr/local/bin/ntfy-notify' not in script"
        fail_msg: "pihole-syncthing-backup rendered wrong: {{ script }}"
        quiet: true

    - name: Assert the cron jobs were scheduled
      ansible.builtin.assert:
        that:
          - "'/usr/local/bin/pihole-update' in dns_root_crontab.stdout"
          - "'/usr/local/bin/pihole-syncthing-backup' in dns_root_crontab.stdout"
        fail_msg: "Root crontab missing the update/backup jobs: {{ dns_root_crontab.stdout }}"
        quiet: true

    - name: Assert the logrotate config
      vars:
        conf: "{{ dns_content['/etc/logrotate.d/weekly-updates'] }}"
      ansible.builtin.assert:
        that:
          - "'/var/log/weekly-updates.log' in conf"
          - "'rotate 12' in conf"
        fail_msg: "logrotate config wrong: {{ conf }}"
        quiet: true

    - name: Assert the chrony config
      vars:
        conf: "{{ dns_content['/etc/chrony/chrony.conf'] }}"
      ansible.builtin.assert:
        that:
          - "'server pool.ntp.org iburst prefer' in conf"
          - "'allow 192.168.1.0/24' in conf"
          - "'local stratum 8' in conf"
        fail_msg: "chrony.conf rendered wrong: {{ conf }}"
        quiet: true

    - name: Assert the setup vars rendered
      vars:
        conf: "{{ dns_content['/tmp/setupVars.rendered'] }}"
      ansible.builtin.assert:
        that:
          - "'PIHOLE_INTERFACE=' ~ molecule_primary_interface in conf"
          - "'PIHOLE_DNS_1=9.9.9.9' in conf"
          - "'PIHOLE_DNS_2=149.112.112.112' in conf"
        fail_msg: "setupVars.conf rendered wrong:\n{{ conf }}"
        quiet: true

    - name: Read the chrony unit state
      ansible.builtin.systemd:
        name: chrony
      register: dns_chrony_unit

    # Not asserting ActiveState: without CAP_SYS_TIME systemd skips the unit, so it is never active here.
    - name: Assert chrony is enabled
      ansible.builtin.assert:
        that: dns_chrony_unit.status.UnitFileState == 'enabled'
        fail_msg: "chrony UnitFileState is {{ dns_chrony_unit.status.UnitFileState }}"
        quiet: true
