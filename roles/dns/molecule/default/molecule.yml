---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: dns-default
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # Both CI and local runs start in roles/<role>, so MOLECULE_PROJECT_DIRECTORY is roles/dns.
    # Its parent directory is roles/, which lets include_role resolve the os and common roles by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
