---
- name: Converge dns default
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  vars:
    vault_pihole_webpassword: molecule-test-password
    dns_pihole_interface: "{{ molecule_primary_interface }}"
    # Public resolvers the container can reach.
    dns_pihole_dns_servers:
      - 9.9.9.9
      - 149.112.112.112
    common_ntp_server_enabled: true
    common_ntp_allowed_networks:
      - 192.168.1.0/24
    dns_backup_enabled: true
  tasks:
    # Skipped on purpose: install.yml (basic-install.sh needs a real host, see scripts/dns/validate-deploy.sh),
    # storage.yml (drive detection could format the host's devices through /sys), post_deploy_validate.yml
    # (needs a running Pi-hole) and the firewall (ufw cannot bind in a container).
    - name: Validate the dns variables
      ansible.builtin.include_role:
        name: dns
        tasks_from: validate

    - name: Authorize the supervisor's read-only pull key
      ansible.builtin.include_role:
        name: dns
        tasks_from: backup_pull_key

    # configure.yml itself stays out (it runs the real pihole-FTL); its two file-level pins run through the stand-ins
    # that prepare.yml created.
    - name: Pin the web port in a restored archive's pihole.toml
      ansible.builtin.include_role:
        name: dns
        tasks_from: web_port

    - name: Pin FTL's built-in NTP off
      ansible.builtin.include_role:
        name: dns
        tasks_from: ntp_off
      loop: [ntp.ipv4.active, ntp.ipv6.active, ntp.sync.active]
      loop_control:
        loop_var: dns_ntp_key

    # An installed host must not be reinstalled, whatever its version probe says: a reinstall wipes /etc/pihole and
    # discards a restored Teleporter archive. The missing-file cases point the paths at files that do not exist.
    - name: Decide whether Pi-hole needs installing, in each situation
      ansible.builtin.include_tasks: needs_install_case.yml
      loop:
        - { id: installed, expect: false }
        - { id: forced, expect: true, dns_pihole_force_reinstall: true }
        - { id: no-binary, expect: true, dns_pihole_binary_path: /nonexistent/pihole }
        - { id: no-gravity, expect: true, dns_pihole_gravity_path: /nonexistent/gravity.db }
      loop_control:
        loop_var: molecule_case
        label: "{{ molecule_case.id }}"

    - name: Deploy chrony, the git safe.directory list, auto-updates and the backup
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../shared/deploy.yml"

    # Only install.yml deploys this template, so a broken variable would otherwise surface on a real Pi.
    - name: Render the Pi-hole setup vars template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/setupVars.conf.j2"
        dest: /tmp/setupVars.rendered
        mode: "0600"
