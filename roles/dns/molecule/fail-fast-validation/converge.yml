---
- name: Converge dns fail-fast-validation
  hosts: all
  vars_files:
    - ../shared/vars.yml
    - cases.yml
  vars:
    dns_pihole_dns_servers:
      - 9.9.9.9
  tasks:
    - name: Run each case
      ansible.builtin.include_tasks: case.yml
      loop: "{{ molecule_cases }}"
      loop_control:
        loop_var: molecule_item
        label: "{{ molecule_item.id }}"
      vars:
        molecule_case: "{{ molecule_case_defaults | combine(molecule_item) }}"
