---
- name: Converge - DNS Fail-Fast Validation
  hosts: all
  tasks:
    - name: Test fail-fast validation with missing required variable
      block:
        - name: Try to validate without required DNS variable
          ansible.builtin.fail:
            msg: "vault_pihole_webpassword is required but not set"
          when: vault_pihole_webpassword is not defined
      rescue:
        - name: Capture expected validation failure
          ansible.builtin.set_fact:
            validation_failed: true
            validation_error: "vault_pihole_webpassword is required but not set"

        - name: Display validation failure message
          ansible.builtin.debug:
            msg: |
              [OK] DNS validation correctly failed (expected behavior)
              Error: Missing required variable: vault_pihole_webpassword
