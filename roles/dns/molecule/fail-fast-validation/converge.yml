---
- name: Converge - DNS Fail-Fast Validation
  hosts: all
  vars:
    # Every required variable except dns_pihole_interface, so Case 1 leaves
    # it genuinely undefined. Each case below then includes the REAL
    # roles/dns/tasks/validate.yml with per-case vars - no hand-copied
    # guards to keep in sync.
    vault_pihole_webpassword: molecule-test-password
    dns_pihole_dns_servers:
      - "9.9.9.9"
    dns_ntp_server_enabled: false
    dns_ntp_upstream_server: pool.ntp.org
    dns_ntp_allowed_networks: []
  tasks:
    # The container's interface name varies by driver/network; cases 2 and 3
    # need a real one so they fail for the reason under test, not the
    # interface check.
    - name: Detect the container's primary interface
      ansible.builtin.set_fact:
        molecule_primary_interface: "{{ ansible_facts['interfaces'] | difference(['lo']) | first }}"

    # Case 1: a required DNS variable is missing.
    - name: "Case 1: validate.yml fails when a required DNS variable is missing"
      block:
        - name: Run the real validate.yml with dns_pihole_interface undefined
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"

        - name: Fail the test - validate.yml should have refused to run
          ansible.builtin.fail:
            msg: "validate.yml did not fail fast on a missing required DNS variable"
      rescue:
        - name: Assert the failure was for the missing dns_pihole_interface variable specifically
          # A looped fail task's own top-level msg is the generic "One or more
          # items failed" - the per-item detail lives in .results, so assert
          # on that rather than on ansible_failed_result.msg directly.
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results is defined
              - (ansible_failed_result.results | selectattr('failed') | map(attribute='item') | list) ==
                ['dns_pihole_interface']
            fail_msg: >-
              validate.yml failed, but not for the expected reason
              (missing dns_pihole_interface): {{ ansible_failed_result }}
            success_msg: "[OK] validate.yml correctly failed on the missing dns_pihole_interface variable"

        - name: Record case 1 as passed for verify.yml
          # A file, not set_fact: converge and verify are separate
          # ansible-playbook processes - in-memory facts do not cross that
          # boundary. force: false keeps the idempotence rerun unchanged.
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case1.passed
            force: false
            mode: "0644"

    # Case 2: a vault secret still holds its documented placeholder value.
    - name: "Case 2: validate.yml fails when vault_pihole_webpassword still has its placeholder value"
      block:
        - name: Run the real validate.yml with vault_pihole_webpassword left at its placeholder value
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            dns_pihole_interface: "{{ molecule_primary_interface }}"
            vault_pihole_webpassword: "your-secure-web-password"

        - name: Fail the test - validate.yml should have refused to run
          ansible.builtin.fail:
            msg: "validate.yml did not fail fast on a placeholder vault_pihole_webpassword"
      rescue:
        - name: Assert the failure was for the placeholder vault_pihole_webpassword specifically
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results is defined
              - (ansible_failed_result.results | selectattr('failed') | map(attribute='item') |
                map(attribute='var') | list) == ['vault_pihole_webpassword']
              - (ansible_failed_result.results | selectattr('failed') | list | first).msg is
                search('placeholder value')
            fail_msg: >-
              validate.yml failed, but not for the expected reason
              (placeholder vault_pihole_webpassword): {{ ansible_failed_result }}
            success_msg: "[OK] validate.yml correctly failed on the placeholder vault_pihole_webpassword"

        - name: Record case 2 as passed for verify.yml
          # A file, not set_fact: converge and verify are separate
          # ansible-playbook processes - in-memory facts do not cross that
          # boundary. force: false keeps the idempotence rerun unchanged.
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case2.passed
            force: false
            mode: "0644"

    # Case 3: the NTP-allowed-networks guard, driven through the real
    # validate.yml (not a hand-copied reproduction).
    - name: "Case 3: validate.yml fails when NTP serving is enabled without allowed networks"
      block:
        - name: Run the real validate.yml with an empty dns_ntp_allowed_networks
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            dns_pihole_interface: "{{ molecule_primary_interface }}"
            dns_ntp_server_enabled: true

        - name: Fail the test - the NTP guard should have refused an empty allow-list
          ansible.builtin.fail:
            msg: "validate.yml did not fail on an empty dns_ntp_allowed_networks"
      rescue:
        - name: Assert the failure was the NTP guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'dns_ntp_allowed_networks' in ansible_failed_result.msg"
              - "'must be non-empty' in ansible_failed_result.msg"
            fail_msg: >-
              validate.yml failed, but not for the expected reason:
              {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's NTP guard correctly failed on an empty dns_ntp_allowed_networks"

        - name: Record case 3 as passed for verify.yml
          # A file, not set_fact: converge and verify are separate
          # ansible-playbook processes - in-memory facts do not cross that
          # boundary. force: false keeps the idempotence rerun unchanged.
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case3.passed
            force: false
            mode: "0644"

    # Case 4: the interface-existence guard.
    - name: "Case 4: validate.yml fails when the configured interface does not exist"
      block:
        - name: Run the real validate.yml with a non-existent dns_pihole_interface
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/validate.yml"
          vars:
            dns_pihole_interface: doesnotexist0

        - name: Fail the test - the interface guard should have refused the bogus interface
          ansible.builtin.fail:
            msg: "validate.yml did not fail on a non-existent dns_pihole_interface"
      rescue:
        - name: Assert the failure was the interface guard, for the right reason
          ansible.builtin.assert:
            that:
              - "'doesnotexist0' in ansible_failed_result.msg"
              - "'does not exist' in ansible_failed_result.msg"
            fail_msg: >-
              validate.yml failed, but not for the expected reason:
              {{ ansible_failed_result.msg | default('') }}
            success_msg: "[OK] validate.yml's interface guard correctly failed on a non-existent interface"

        - name: Record case 4 as passed for verify.yml
          # A file, not set_fact: converge and verify are separate
          # ansible-playbook processes - in-memory facts do not cross that
          # boundary. force: false keeps the idempotence rerun unchanged.
          ansible.builtin.copy:
            content: ""
            dest: /tmp/molecule-case4.passed
            force: false
            mode: "0644"
