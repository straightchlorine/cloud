---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: test
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # CI/local both run `cd roles/<role> && molecule test`, so
    # MOLECULE_PROJECT_DIRECTORY is roles/dns - one level up is roles/,
    # letting `include_role: name: <any role>` resolve by name. converge.yml
    # currently works around the absence of this with raw include_tasks
    # paths (see its own comments) - this makes that workaround unnecessary
    # for any test written from now on, without touching the existing ones.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
