---
role_name_check: 0
driver:
  name: podman

platforms:
  - name: dns-fail-fast-validation
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ${MOLECULE_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  env:
    # Both CI and local runs start in roles/<role>, so MOLECULE_PROJECT_DIRECTORY is roles/dns.
    # Its parent directory is roles/, which lets include_role resolve any role by name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
scenario:
  # No idempotence pass: the cases only run validate.yml and record markers with force: false, so a second
  # converge cannot catch a non-idempotent role. The default scenario's idempotence pass covers the role.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
