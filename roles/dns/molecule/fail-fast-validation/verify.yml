---
- name: Verify DNS fail-fast validation
  hosts: all
  become: true
  tasks:
    - name: Stat the per-case marker files converge wrote
      # Converge and verify run as separate processes, so each case drops a
      # marker file (in its rescue) instead of a set_fact - see converge.yml.
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /tmp/molecule-case1.passed
        - /tmp/molecule-case2.passed
        - /tmp/molecule-case3.passed
        - /tmp/molecule-case4.passed
      register: dns_failfast_markers

    - name: Assert all four fail-fast cases completed
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          {{ item.item }} missing - the corresponding case in converge.yml
          either did not fail or failed for an unexpected reason.
        success_msg: "[OK] {{ item.item }} recorded"
      loop: "{{ dns_failfast_markers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Display fail-fast validation summary
      ansible.builtin.debug:
        msg: |
          [OK] DNS Fail-Fast Validation Test Complete

          Case 1 - missing required variable (dns_pihole_interface): FAILED as expected
          Case 2 - placeholder vault secret (vault_pihole_webpassword): FAILED as expected
          Case 3 - NTP guard, empty dns_ntp_allowed_networks: FAILED as expected
          Case 4 - non-existent dns_pihole_interface: FAILED as expected

          All four cases ran the real roles/dns/tasks/validate.yml end to end -
          no hand-copied guards anywhere in this scenario.
