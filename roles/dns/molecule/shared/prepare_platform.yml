---
- name: Install cron, iproute2 and git
  # The cron module needs crontab from cron; the teardown scenario needs ss from iproute2; git_config needs git.
  ansible.builtin.apt:
    name: [cron, iproute2, git]
    state: present
    update_cache: true

- name: Create the backup owner user
  # backup.yml makes dns_backup_owner the owner of the Syncthing backup directory.
  ansible.builtin.user:
    name: molecule
    system: true
    # The pull key's authorized_keys file lives in the owner's home.
    home: /home/molecule
    create_home: true
