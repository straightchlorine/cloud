---
- name: Verify dns teardown
  hosts: all
  become: true
  tasks:
    - name: Assert the unconfirmed teardown was refused
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_markers.yml"
      vars:
        molecule_case_ids: [teardown-unconfirmed]

    - name: Assert no role artifact survives
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_paths.yml"
      vars:
        molecule_paths:
          - { path: /usr/local/bin/pihole, state: absent }
          - { path: /usr/local/bin/pihole-update, state: absent }
          - { path: /usr/local/bin/pihole-syncthing-backup, state: absent }
          - { path: /usr/local/bin/ntfy-notify, state: absent }
          - { path: /usr/local/bin/reboot-notify, state: absent }
          - { path: /etc/pihole, state: absent }
          - { path: /etc/.pihole, state: absent }
          - { path: /opt/pihole, state: absent }
          - { path: /etc/ntfy, state: absent }
          - { path: /etc/chrony/chrony.conf, state: absent }
          - { path: /etc/logrotate.d/weekly-updates, state: absent }
          - { path: /etc/systemd/system/pihole-FTL.service, state: absent }
          - { path: /etc/systemd/system/foreign-zram.service, state: absent }

    - name: Read the system git safe.directory list
      ansible.builtin.command: git config --system --get-all safe.directory
      changed_when: false
      failed_when: dns_safe_directories.rc not in [0, 1]
      register: dns_safe_directories

    - name: Assert the Pi-hole checkouts left the safe.directory list
      ansible.builtin.assert:
        that: dns_safe_directories.stdout_lines | select('in', ['/etc/.pihole', '/var/www/html/admin']) | list == []
        fail_msg: "safe.directory still lists: {{ dns_safe_directories.stdout_lines }}"
        quiet: true

    - name: Look up the pihole user
      ansible.builtin.command: getent passwd pihole
      changed_when: false
      failed_when: dns_teardown_pihole_user.rc not in [0, 2]
      register: dns_teardown_pihole_user

    - name: Assert the pihole user is gone
      ansible.builtin.assert:
        that: dns_teardown_pihole_user.rc == 2
        fail_msg: "the pihole user still exists: {{ dns_teardown_pihole_user.stdout }}"
        quiet: true

    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert chrony was purged
      ansible.builtin.assert:
        that: "'chrony' not in ansible_facts.packages"
        quiet: true

    - name: Read root's crontab
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      failed_when: dns_teardown_crontab.rc not in [0, 1]
      register: dns_teardown_crontab

    - name: Assert the role's cron jobs are gone
      ansible.builtin.assert:
        that:
          - "'pihole-update' not in dns_teardown_crontab.stdout"
          - "'pihole-syncthing-backup' not in dns_teardown_crontab.stdout"
          - "'Reboot pending notification' not in dns_teardown_crontab.stdout"
        fail_msg: "Cron jobs survived the teardown: {{ dns_teardown_crontab.stdout }}"
        quiet: true

    # A failure means the resolver restore failed even though the removals succeeded.
    - name: Resolve a public name
      ansible.builtin.command: getent hosts github.com
      changed_when: false
      register: dns_teardown_resolve
      retries: 3
      delay: 2
      until: dns_teardown_resolve.rc == 0

    - name: List listening sockets
      ansible.builtin.command: ss -H -ltun
      changed_when: false
      register: dns_teardown_listeners

    - name: Assert nothing listens on 53 or 80
      ansible.builtin.assert:
        that: dns_teardown_listeners.stdout_lines | select('search', ':(53|80)\s') | list | length == 0
        fail_msg: "Still listening on 53/80: {{ dns_teardown_listeners.stdout }}"
        quiet: true
