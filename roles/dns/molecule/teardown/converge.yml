---
- name: Converge dns teardown
  hosts: all
  become: true
  vars_files:
    - ../shared/vars.yml
  vars:
    # The role's Syncthing teardown resolves common_syncthing_home from ansible_user.
    ansible_user: root
    vault_pihole_webpassword: molecule-test-password
    vault_ntfy_api_key: molecule-test-ntfy-key
    ntfy_server_url: "https://ntfy.example.test"
    ntfy_topic: molecule-test
    # The teardown writes these into resolv.conf and then checks resolution, so CI must reach them.
    dns_pihole_dns_servers:
      - 9.9.9.9
    common_ntp_server_enabled: false
    common_ntp_allowed_networks: []
    dns_backup_enabled: true
    common_auto_updates_reboot_if_required: true
  tasks:
    # Arrange-only state: a rerun would recreate what the teardown removed and report changes.
    - name: Deploy what the teardown removes
      tags: [molecule-idempotence-notest]
      block:
        - name: Deploy chrony, the git safe.directory list, auto-updates and the backup
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../shared/deploy.yml"

        - name: Deploy the ntfy helper
          ansible.builtin.include_role:
            name: common
            tasks_from: ntfy_install

        - name: Deploy unattended-upgrades and the reboot notification
          ansible.builtin.include_role:
            name: common
            tasks_from: auto_updates

        # Deploy handlers must fire while their services exist; here deploy and teardown share one play.
        - name: Flush deploy handlers
          ansible.builtin.meta: flush_handlers

        # Stand-ins for what the Pi-hole installer creates, since it cannot run in a container.
        - name: Create the fake Pi-hole config directory
          ansible.builtin.file:
            path: /etc/pihole
            state: directory
            mode: "0755"

        - name: Create the fake Pi-hole config files
          ansible.builtin.copy:
            content: "molecule fixture\n"
            dest: "{{ item }}"
            mode: "0644"
          loop:
            - /etc/pihole/setupVars.conf
            - /etc/pihole/adlists.list
            - /etc/pihole/gravity.db

        # The teardown runs `yes | pihole uninstall` through it.
        - name: Create the fake pihole binary
          ansible.builtin.copy:
            content: "#!/bin/sh\nexit 0\n"
            dest: /usr/local/bin/pihole
            mode: "0755"

        - name: Create the fake pihole-FTL and foreign zram units
          ansible.builtin.copy:
            content: |
              [Unit]
              Description={{ item.description }}
              [Service]
              ExecStart=/bin/true
              {% if item.install %}
              [Install]
              WantedBy=multi-user.target
              {% endif %}
            dest: "/etc/systemd/system/{{ item.name }}.service"
            mode: "0644"
          loop:
            - { name: pihole-FTL, description: Pi-hole FTL (molecule fixture), install: true }
            - { name: foreign-zram, description: Foreign zram fixture, install: false }

        - name: Create the fake pihole user
          ansible.builtin.user:
            name: pihole
            system: true

    - name: Refuse an unconfirmed teardown
      vars:
        molecule_case:
          id: teardown-unconfirmed
          expect: dns teardown requires the shared teardown_confirmed fact
      block:
        - name: Run the dns teardown unconfirmed
          ansible.builtin.include_role:
            name: dns
            tasks_from: teardown

        - name: Fail when the unconfirmed teardown ran
          ansible.builtin.fail:
            msg: dns teardown ran without teardown_confirmed
      rescue:
        - name: Assert the refusal and record the case
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_SHARED') }}/assert_failure.yml"

    # Includes the teardown's own check that artifacts are gone and the Pi-hole ports are free.
    - name: Run the dns teardown confirmed
      ansible.builtin.include_role:
        name: dns
        tasks_from: teardown
      vars:
        teardown_confirmed: true
