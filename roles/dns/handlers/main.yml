- name: restart pihole-FTL
  ansible.builtin.systemd:
    name: pihole-FTL
    state: restarted
  become: true

- name: reload pihole
  ansible.builtin.shell: pihole restartdns
  become: true

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  become: true

- name: restart pihole-exporter
  ansible.builtin.systemd:
    name: pihole-exporter
    state: restarted
  become: true

- name: rollback pihole
  block:
    - name: Stop Pi-hole service
      ansible.builtin.systemd:
        name: pihole-FTL
        state: stopped
      become: true
      ignore_errors: true

    - name: Restore configuration from backup if available
      ansible.builtin.shell: |
        if [ -d "/etc/pihole.backup" ]; then
          rm -rf /etc/pihole
          mv /etc/pihole.backup /etc/pihole
        fi
      become: true
      ignore_errors: true

    - name: Start Pi-hole service
      ansible.builtin.systemd:
        name: pihole-FTL
        state: started
      become: true
      ignore_errors: true

