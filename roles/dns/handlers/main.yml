---
- name: Restart pihole-FTL
  ansible.builtin.systemd:
    name: pihole-FTL
    state: restarted
    enabled: true
  become: true

- name: Reload pihole
  ansible.builtin.command: pihole restartdns
  become: true
  changed_when: true

- name: Restart pihole-exporter
  ansible.builtin.systemd:
    name: pihole-exporter
    state: restarted
    enabled: true
  become: true

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true
  become: true

- name: Rollback pihole
  block:
    - name: Stop Pi-hole service
      ansible.builtin.systemd:
        name: Pihole-FTL
        state: stopped
      become: true
      # Ignore errors during rollback - service may not be running or may be in failed state
      ignore_errors: true

    - name: Restore configuration from backup if available
      ansible.builtin.shell: |
        if [ -d "/etc/pihole.backup" ]; then
          rm -rf /etc/pihole
          mv /etc/pihole.backup /etc/pihole
        fi
      become: true
      # Ignore errors - backup may not exist or file system may be in inconsistent state
      ignore_errors: true

    - name: Start Pi-hole service
      ansible.builtin.systemd:
        name: Pihole-FTL
        state: started
      become: true
      # Ignore errors - configuration may not be fully restored and startup may fail
      ignore_errors: true
