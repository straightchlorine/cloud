---
- name: restart pihole-FTL
  ansible.builtin.systemd:
    name: pihole-FTL
    state: restarted
    enabled: true
  become: true

- name: restart pihole-exporter
  ansible.builtin.systemd:
    name: pihole-exporter
    state: restarted
    enabled: true
  become: true

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true
  become: true
