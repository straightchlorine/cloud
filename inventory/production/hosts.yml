---
all:
  children:
    # Service hosts (Pi devices)
    dns:
      hosts:
        dns:
          ansible_host: 192.168.20.2
          ansible_user: zero
          device_role: dns
          device_type: rpizero2w
    music:
      hosts:
        media:
          ansible_host: 192.168.20.15
          ansible_user: media
          device_role: music
          device_type: rpi3b
        pi-test-media:
          ansible_host: 192.168.20.35
          ansible_user: ansible
          device_role: music
          device_type: rpi3b
    automation:
      hosts:
        pi-automation:
          ansible_host: 192.168.20.20
          ansible_user: automation
          device_role: automation
          device_type: rpi4b

    # Infrastructure hosts (dedicated machines)
    monitoring:
      hosts:
        debian-monitoring:
          ansible_host: 192.168.20.5
          ansible_user: monitoring
          device_role: monitoring
          device_type: debian_vm

    # Public-facing honeypot VPS, reached over the tailnet only. Deliberately
    # outside `services`: it is CentOS Stream, so the apt/ufw fleet base roles
    # do not apply to it (see the `all:!honeypot` scoping in playbooks/site.yml).
    honeypot:
      hosts:
        centos-honeypot:
          # Tailnet address: the admin sshd binds this address only, so the
          # host is unreachable by Ansible off-tailnet.
          ansible_host: 100.64.0.1
          # The hardened admin sshd. Public 22/tcp belongs to cowrie.
          # First bootstrap: -e ansible_port=22
          ansible_port: 2022
          # Not `deploy`: that account exists only for the honeywatch release
          # workflow (tailnet -> docker compose) and has no general sudo.
          ansible_user: admin
          device_role: honeypot
          device_type: vps

    backup_primary:
      hosts:
        backup_wyse:
          ansible_host: 192.168.101.10
          ansible_user: backup
          device_role: backup
          device_type: debian

    workstations:
      hosts:
        station-arch:
          ansible_host: 192.168.100.10
          ansible_user: backup
          device_role: workstation
          device_type: arch_linux

    # GPU research host for the quantum-pipeline VQE solver. Typically a cloud
    # GPU VM, so ansible_host is per-instance (see host_vars/gpu-station.yml);
    # its nvidia_gpu_exporter (:9835) is only reachable when on-net.
    gpu_qp:
      hosts:
        gpu-station:
          ansible_host: 192.168.50.52
          ansible_user: debian
          device_role: gpu-qp
          device_type: cloud_vm

    firewall:
      hosts:
        firewall:
          ansible_host: 192.168.100.1
          ansible_user: admin
          device_role: firewall
          device_type: opnsense
          # External unmanaged host - reached only through the reverse proxy

    # Backup architecture groups
    backup_standalone:
      hosts:
        station-arch:

    backup_coordinated:
      children:
        dns:
        music:
        automation:

    # Logical groups for deployment targeting
    services:
      children:
        dns:
        music:
        automation:

    prometheus:
      children:
        services:
        backup_primary:
        workstations:

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/ansible_controller_key
