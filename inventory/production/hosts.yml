all:
  children:
    # Service hosts (Pi devices)
    dns:
      hosts:
        pi-dns:
          ansible_host: 192.168.20.10
          ansible_user: ansible
          device_role: dns
          device_type: rpi3b
    music:
      hosts:
        pi-music:
          ansible_host: 192.168.20.15
          ansible_user: media
          device_role: music
          device_type: rpi3b
          services: [navidrome, beets, dozzle]
    automation:
      hosts:
        pi-automation:
          ansible_host: 192.168.20.20
          ansible_user: automation
          device_role: automation
          device_type: rpi4b
          services: [traefik]

    # Infrastructure hosts (dedicated machines)
    monitoring:
      hosts:
        debian-monitoring:
          ansible_host: 192.168.20.5
          ansible_user: monitoring
          device_role: monitoring
          device_type: debian_vm
          services: [grafana, prometheus, loki, alertmanager]

    backup_primary:
      hosts:
        backup_wyse:
          ansible_host: 192.168.101.10
          ansible_user: backup
          device_role: backup
          device_type: debian
          services: [backup]

    workstations:
      hosts:
        station-arch:
          ansible_host: 192.168.100.10
          ansible_user: backup
          device_role: workstation
          device_type: arch_linux
          services: [development, storage]

    firewall:
      hosts:
        firewall:
          ansible_host: 192.168.100.1
          ansible_user: admin
          device_role: firewall
          device_type: opnsense
          services: [opnsense]
          # Note: External unmanaged host, only for Traefik SSL proxying

    # Backup architecture groups
    backup_standalone:
      hosts:
        station-arch:

    backup_coordinated:
      children:
        dns:
        music:
        automation:

    # Logical groups for deployment targeting
    services:
      children:
        dns:
        music:
        automation:

    prometheus:
      children:
        services:
        backup_primary:
        workstations:

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/ansible_controller_key
