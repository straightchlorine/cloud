---
all:
  children:
    # Service hosts (Pi devices)
    dns:
      hosts:
        dns:
          ansible_host: 192.168.20.2
          ansible_user: zero
          device_role: dns
          device_type: rpizero2w
    music:
      hosts:
        media:
          ansible_host: 192.168.20.15
          ansible_user: ansible
          device_role: music
          device_type: rpi3b
        pi-test-media:
          ansible_host: 192.168.20.35
          ansible_user: ansible
          device_role: music
          device_type: rpi3b
    automation:
      hosts:
        pi-automation:
          ansible_host: 192.168.20.20
          ansible_user: automation
          device_role: automation
          device_type: rpi4b

    # Infrastructure hosts (dedicated machines)
    monitoring:
      hosts:
        debian-monitoring:
          ansible_host: 192.168.20.5
          ansible_user: monitoring
          device_role: monitoring
          device_type: debian_vm

    # Public-facing honeypot VPS, reached over the tailnet only. It runs CentOS Stream,
    # so it stays outside `fleet`, which the apt and ufw base plays in playbooks/site.yml target.
    honeypot:
      hosts:
        centos-honeypot:
          # The admin sshd binds only the tailnet address, so Ansible cannot reach the host off-tailnet.
          ansible_host: 100.64.0.1
          # This is the hardened admin sshd, because public 22/tcp belongs to cowrie.
          # The first bootstrap run passes -e ansible_port=22.
          ansible_port: 2022
          # The `deploy` account only serves the honeywatch release workflow and has no general sudo.
          ansible_user: admin
          device_role: honeypot
          device_type: vps

    # Performance bench VM (CentOS Stream 10, KVM) for honeywatch, deployed by playbooks/honeybench.yml.
    # It is a dnf and Docker host without apt or ufw, so it stays outside `services`, `fleet` and `prometheus`.
    bench:
      hosts:
        honeybench:
          ansible_host: honeybench.codex.home.arpa
          ansible_user: centos
          device_role: honeybench
          device_type: cloud_vm

    backup_primary:
      hosts:
        backup_wyse:
          ansible_host: 192.168.101.10
          ansible_user: backup
          device_role: backup
          device_type: debian

    workstations:
      hosts:
        station-arch:
          ansible_host: 192.168.100.10
          ansible_user: backup
          device_role: workstation
          device_type: arch_linux
        # Gentoo laptop on OpenRC; bootstrap checklist in roles/restic/README.md, "Applying to portable".
        portable:
          ansible_host: portable.codex.home.arpa
          ansible_user: ansible
          device_role: workstation
          device_type: gentoo

    # Hosts that are prepared in the inventory but not reachable yet: no play targets this group.
    # Move a host into workstations (or its real group) once its bootstrap checklist is done.
    workstations_pending:
      hosts: {}

    # GPU research host for the quantum-pipeline VQE solver, typically a cloud GPU VM.
    # Its ansible_host therefore changes per instance.
    gpu_qp:
      hosts:
        gpu-station:
          ansible_host: 192.168.50.52
          ansible_user: debian
          device_role: gpu-qp
          device_type: cloud_vm

    firewall:
      hosts:
        firewall:
          ansible_host: 192.168.100.1
          ansible_user: admin
          device_role: firewall
          device_type: opnsense
          # No play in this repo targets this OPNsense host.

    # Logical groups for deployment targeting
    services:
      children:
        dns:
        music:
        automation:

    # Debian-family hosts that get the apt and ufw based base roles.
    # Excluded are station-arch (Arch), portable (Gentoo), honeypot and bench (CentOS Stream) and the OPNsense firewall.
    fleet:
      children:
        services:
        monitoring:
        backup_primary:
        gpu_qp:

    prometheus:
      children:
        services:
        backup_primary:
        # The base play deploys Node Exporter here, which reads group_vars/prometheus.yml.
        gpu_qp:
      hosts:
        # Listed by host, so that portable is not monitored by accident when it moves into workstations.
        station-arch:

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/ansible_controller_key
