---
device_type: vps

# Undoing the hardening of an internet-facing VPS means reprovisioning it, not running a playbook.
# Teardowns therefore refuse this host (see the role README).
teardown_protected: true

# The honeywatch nginx binds the dashboard and API to the tailnet address on this port.
# Without the entry, the tailnet firewalld zone allows only the admin sshd, so the k3s cluster cannot reach it.
honeypot_tailnet_extra_ports:
  - {proto: tcp, port: 5000}

# An R2 bucket lifecycle rule handles retention, so the R2 token needs no Object Delete scope.
# The script's own trim is parked far in the future, because it rejects 0 as an invalid retention.
honeypot_backup_retention_days: 36500

# This sends host metrics to the fleet Prometheus over the tailnet.
# Shipping the journal to the fleet Loki is already the role default.
alloy_metrics_enabled: true

# These values equal the role defaults and are repeated so the lockout-critical admin path,
# the deployment contract and the optional jobs stay visible in one place.
# Cowrie owns the public SSH port, while the real sshd listens on the tailnet only.
honeypot_ssh_port: 2022
honeypot_cowrie_public_port: 22
honeypot_ssh_allow_users:
  - deploy
  - admin

honeypot_tailnet_interface: tailscale0
honeypot_stack_dir: /opt/honeywatch

honeypot_backup_enabled: true
honeypot_mmdb_enabled: true

honeypot_alloy_enabled: true
