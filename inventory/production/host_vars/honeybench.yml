---
device_type: cloud_vm

# The bench runs as the account Ansible connects as, because the checkout, worktrees and bench output must belong to it.
# The role's validate.yml asserts that the two match.
honeybench_user: "{{ ansible_user }}"

# The ref must contain the honeywatch bench/ directory. Pin a tag or sha for a campaign.
honeybench_repo_version: master

# Production data for the bench is an unredacted pg_dumpall that is kept out of git.
# The sha256 pins which dataset the numbers belong to, so a re-dump is a deliberate inventory change.
# Deploy the dump with: ansible-playbook playbooks/honeybench.yml -e honeybench_dump_enabled=true
honeybench_dump_src: "{{ lookup('env', 'HOME') }}/code/honeywatch/honeywatch-prod-data.gz"
honeybench_dump_sha256: "374dda9624b4c795490547e33205e0e3c10c27c44798ad1ffee59ee5e7f28a96"

# A cloud VM is disposable, so teardowns are never blocked on it.
teardown_protected: false

# This host is not in the `prometheus` group and has no Alloy.
# Bench runs read the host's own steal time and cgroup counters instead, in bench/measure.py.
