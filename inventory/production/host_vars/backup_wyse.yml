---
# This Dell Wyse coordinates the backups of the Raspberry Pis and other small devices.
device_role: backup
device_type: debian

# The coordinator pulls backups from remote hosts over SSHFS.
backup_role: coordinator

backup_user: backup
backup_group: backup
common_backup_base_path: /opt/backup

backup_restic_version: "0.18.1"

coordinator_targets:
  - service_name: dns
    hostname: pihole
    target_host: pihole
    ssh_user: root
    ssh_key: "{{ common_backup_base_path }}/.ssh/nodes/dns"
    backup_schedule: "*-*-* 01:00:00"
    common_backup_paths:
      - /etc
      - /var/lib
      - /var/log
      - /opt/pihole
      - /root/.ssh
    backup_excludes:
      - /var/cache/*
      - /var/tmp/*
      - /var/spool/*
      - /var/lib/apt/lists/*
      - /tmp/*
      - "*.tmp"
      - ".cache/*"
      - "/etc/issue*"
      - "/etc/.pihole/*"
      - "/etc/apt/apt.conf.d/*~"
    restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/dns"
    restic_password: "{{ vault_restic_dns_password }}"
    retention_policy:
      daily: 14
      weekly: 8
      monthly: 12
      yearly: 3
    priority: 1
    memory_limit: 800M
    restic_optimization:
      pack_size: 16
      read_concurrency: 2
      compression: auto

  - service_name: pi-automation
    hostname: automation
    target_host: automation
    ssh_user: root
    ssh_key: "{{ common_backup_base_path }}/.ssh/nodes/pi-automation"
    backup_schedule: "*-*-* 02:00:00"
    common_backup_paths:
      - /etc
      - /var/log
      - /home/automation
      - /mnt/data
      - /root/.ssh
    backup_excludes:
      - /var/cache/*
      - /var/tmp/*
      - /var/spool/*
      - /var/lib/apt/lists/*
      - /tmp/*
      - "*.tmp"
      - ".cache/*"
      - "/etc/issue*"
      - "/etc/apt/apt.conf.d/*~"
      - "/var/log/journal/archive/*"
    restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/pi-automation"
    restic_password: "{{ vault_restic_pi_automation_password }}"
    retention_policy:
      daily: 14
      weekly: 8
      monthly: 12
      yearly: 3
    priority: 2
    memory_limit: 800M
    restic_optimization:
      pack_size: 16
      read_concurrency: 2
      compression: auto

  # The key, repository and password keep the pi-music names so the existing restic repository stays in use.
  - service_name: media
    hostname: media
    target_host: media
    ssh_user: root
    ssh_key: "{{ common_backup_base_path }}/.ssh/nodes/pi-music"
    backup_schedule: "*-*-* 03:00:00"
    common_backup_paths:
      - /etc
      - /var/lib/docker/volumes
      - /var/log
      - /home/ansible
      - /mnt/data
      - /root/.ssh
    backup_excludes:
      - /var/cache/*
      - /var/tmp/*
      - /var/spool/*
      - /var/lib/apt/lists/*
      - /tmp/*
      - "*.tmp"
      - ".cache/*"
      - "/etc/issue*"
      - "/etc/apt/apt.conf.d/*~"
      - "/var/log/journal/archive/*"
      - "*/thumbnails/*"
      - "*/media/cache/*"
    restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/pi-music"
    restic_password: "{{ vault_restic_pi_music_password }}"
    retention_policy:
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 1
    priority: 3
    memory_limit: 800M
    restic_optimization:
      pack_size: 16
      read_concurrency: 2
      compression: auto

prometheus_exporters_node_exporter_enabled: true

backup_monitoring: true

common_backup_service_name: "backup-coordinator"
