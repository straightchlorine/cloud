---
# Backup Coordinator Configuration
# Dell Wyse - handles backups for Raspberry Pis and small devices
device_role: backup
device_type: debian

# ============================================
# BACKUP CONFIGURATION (Coordinator Mode)
# ============================================

# Mode: coordinator (pulls backups from remote hosts via SSHFS)
backup_role: coordinator

# User and paths
backup_user: backup
backup_group: backup
backup_base_path: /opt/backup

# Restic configuration
restic_version: "0.18.1"
backup_restic_version: "0.18.1"

# Backup targets (Raspberry Pis) - pulled by coordinator
backup_targets:
  - service_name: pi-dns
    hostname: pihole
    target_host: pihole
    ssh_user: root
    ssh_key: "{{ backup_base_path }}/.ssh/backup-pi-dns"
    backup_schedule: "*-*-* 01:00:00"
    backup_paths:
      - /etc/pihole
      - /etc/chrony
      - /var/log/pihole
      - /opt/pihole
      - /etc/dnsmasq.d
    backup_excludes:
      - "*.tmp"
      - "cache/*"
      - "*.log.1*"
    restic_repository: "sftp:{{ vault_backup_storage_user }}@{{ vault_backup_storage_host }}:{{ vault_backup_storage_port }}{{ vault_backup_repository_base }}/pi-dns"
    restic_password: "{{ vault_restic_pi_dns_password }}"
    retention_policy:
      daily: 14
      weekly: 8
      monthly: 12
      yearly: 3
    priority: 1
    memory_limit: 800M
    restic_optimization:
      pack_size: 16
      read_concurrency: 2
      compression: auto

  - service_name: pi-automation
    hostname: automation
    target_host: automation
    ssh_user: root
    ssh_key: "{{ backup_base_path }}/.ssh/backup-pi-automation"
    backup_schedule: "*-*-* 02:00:00"
    backup_paths:
      - /opt/automation
      - /etc/traefik
      - /var/lib/docker/volumes
      - /etc/docker
    backup_excludes:
      - "*/logs/*"
      - "*.log"
      - "*/tmp/*"
    restic_repository: "sftp:{{ vault_backup_storage_user }}@{{ vault_backup_storage_host }}:{{ vault_backup_storage_port }}{{ vault_backup_repository_base }}/pi-automation"
    restic_password: "{{ vault_restic_pi_automation_password }}"
    retention_policy:
      daily: 14
      weekly: 8
      monthly: 12
      yearly: 3
    priority: 2
    memory_limit: 800M
    restic_optimization:
      pack_size: 16
      read_concurrency: 2
      compression: auto

  - service_name: pi-music
    hostname: media
    target_host: media
    ssh_user: root
    ssh_key: "{{ backup_base_path }}/.ssh/backup-pi-music"
    backup_schedule: "*-*-* 03:00:00"
    backup_paths:
      - /opt/music
      - /var/lib/music
      - /var/lib/docker/volumes
      - /etc/docker
    backup_excludes:
      - "*/cache/*"
      - "*.tmp"
      - "*/thumbnails/*"
      - "*/logs/*"
    restic_repository: "sftp:{{ vault_backup_storage_user }}@{{ vault_backup_storage_host }}:{{ vault_backup_storage_port }}{{ vault_backup_repository_base }}/pi-music"
    restic_password: "{{ vault_restic_pi_music_password }}"
    retention_policy:
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 1
    priority: 3
    memory_limit: 800M
    restic_optimization:
      pack_size: 16
      read_concurrency: 2
      compression: auto

# Node exporter configuration
node_exporter_enabled: true
node_exporter_port: 9100
node_exporter_ufw_enabled: true

# Firewall ports
firewall_backup_ports:
  - port: 9100
    comment: "Prometheus Node Exporter"

# Monitoring and health checks
backup_monitoring: true

# Backup service name (used for logging and identification)
backup_service_name: "backup-coordinator"

# Key rotation schedule
backup_key_rotation_schedule: "monthly"
