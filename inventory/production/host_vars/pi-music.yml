---
# Raspberry Pi 3 specific configuration

device_type: rpi3b

music_stack_enabled: true
music_stack_home: "/home/media/compose"

ssd_device: "/dev/sda1"
# SSD configuration inherited from group_vars/services.yml common_ssd_config
music_library_path: "/mnt/data"

ansible_uid: 1000
ansible_gid: 1000

# Stack management
start_stack: true

# Required variables for validation
ytdlp_dependencies:
  - python3-pip
  - ffmpeg
ytdlp_version: "2025.08.27"
beets_genres:
  - Rock
  - Pop
  - Electronic
  - YouTube

firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 4545, comment: "Navidrome"}
  - {port: 9001, comment: "Portainer Agent"}
  - {port: 2376, comment: "Docker API"}

docker_log_driver: "json-file"
docker_log_max_size: "10m"
docker_log_max_file: "3"

youtube_sync_enabled: true

# Prometheus exporters configuration
docker_exporter_enabled: true
prometheus_role: "music"

# Enterprise backup configuration
restic_enabled: true
restic_repository: "{{ vault_backup_repository_base }}/music"
restic_password: "{{ vault_restic_music_password }}"
common_backup_directories:
  - "{{ music_stack_home }}"
  - "{{ music_library_path }}"
  - "/var/lib/docker/volumes"
  - "/etc/docker"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "**/logs/*"
  - "docker/overlay2/*"
  - "**/*.cache"

# Music stack configuration
navidrome_port: 4545

# Systemd and backup configuration inherited from group_vars/services.yml
# common_systemd_config and common_backup_config
common_backup_service_name: "music"
