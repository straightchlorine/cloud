---
# Refused by the *-teardown playbooks; a staging host leaves this unset.
teardown_protected: true
device_type: rpizero2w

common_wifi_powersave_tuning_enabled: true
common_zram_enabled: true

dns_pihole_dns_servers:
  - "192.168.20.1"

common_auto_updates_reboot_if_required: true
# This is the earliest reboot time in the fleet, so DNS is back before the other hosts reboot.
common_auto_updates_reboot_time: "04:45"

common_ntp_server_enabled: true
# OPNsense runs NTP on the LAN.
common_ntp_upstream_server: "192.168.20.1"
common_ntp_allowed_networks:
  - "{{ primary_network_cidr }}"

firewall_common_ports:
  - {port: 22, comment: "SSH"}
  - {port: 53, comment: "Pi-hole DNS", proto: "udp"}
  - {port: 53, comment: "Pi-hole DNS", proto: "tcp"}
  - {port: 80, comment: "Pi-hole Web Interface"}
  # There is no blanket 123/udp rule, because ufw is first-match and it would shadow the source-restricted NTP rule.
  # That rule comes from common_ntp_allowed_networks.
  - {port: 9100, comment: "Node Exporter"}
  - {port: 9617, comment: "Pi-hole Exporter"}

prometheus_exporters_pihole_exporter_enabled: true
# The primary IP makes the exporter's hostname label a real address instead of 127.0.0.1.
prometheus_exporters_pihole_exporter_target_host: "{{ primary_ip }}"

# The systemd collector is left out on this small board.
# Its per-scrape cgroup walk caused connection resets from Prometheus.
prometheus_exporters_node_exporter_enabled_collectors:
  - textfile
  - filesystem
  - cpu
  - meminfo
  - loadavg
  - diskstats
  - netdev
  - netstat
  - stat
  - time
  - uname
  - vmstat

prometheus_role: "dns"

# Syncthing runs as the SSH user, so the backup directory belongs to that user.
common_syncthing_enabled: true
dns_backup_enabled: true
dns_backup_dir: "/home/zero/syncthing/pihole-backup"
dns_backup_owner: "zero"
