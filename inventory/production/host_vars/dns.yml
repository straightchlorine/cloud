---
# Raspberry Pi Zero 2 W (DNS host): Pi-hole + chrony NTP + prometheus exporters.
# Running on SD card only with zram compressed swap and Wi-Fi power-save disabled.
device_type: rpizero2w

# Board tuning for low-power wireless operation
common_wifi_powersave_tuning_enabled: true
common_zram_enabled: true

dns_pihole_dns_servers:
  - "192.168.20.1"
dns_pihole_interface: "{{ primary_interface }}"
dns_pihole_packages:
  - curl
  - ca-certificates
  - dnsutils
  - jq  # pihole-syncthing-backup.sh parses the Pi-hole API JSON with this

# dns_auto_updates gates only the Pi-hole weekly cron; Debian updates + reboot
# are fleet-wide via the common role.
dns_auto_updates_enabled: true
common_auto_updates_reboot_if_required: true
# First in the fleet's reboot window: DNS is back before the others boot.
common_auto_updates_reboot_time: "04:45"

# Serves NTP to the VLAN (see common/templates/chrony.conf.j2 `allow` + firewall rule).
common_ntp_server_enabled: true
# OPNsense already runs NTP here - use it as the low-latency upstream.
common_ntp_upstream_server: "192.168.20.1"
common_ntp_allowed_networks:
  - "{{ primary_network_cidr }}"

common_firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 53, comment: "Pi-hole DNS", proto: "udp"}
  - {port: 53, comment: "Pi-hole DNS", proto: "tcp"}
  - {port: 80, comment: "Pi-hole Web Interface"}
  # No blanket 123/udp: ufw is first-match, so an unrestricted allow would
  # shadow the src-restricted NTP rule from common_ntp_allowed_networks.
  - {port: 9100, comment: "Node Exporter"}
  - {port: 9617, comment: "Pi-hole Exporter"}

prometheus_exporters_pihole_exporter_enabled: true
prometheus_exporters_pihole_exporter_target_host: "{{ primary_ip }}"
prometheus_role: "dns"

# Local Syncthing backup (Teleporter + FTL DB); Syncthing runs as the ssh user
# (zero). 32GB card - default retention is fine, ~50-80MB total.
common_syncthing_enabled: true
dns_backup_enabled: true
dns_backup_dir: "/home/zero/syncthing/pihole-backup"
dns_backup_owner: "zero"

restic_enabled: true
restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/dns"
restic_password: "{{ vault_restic_dns_password }}"
common_backup_directories:
  - "/etc/pihole"
  - "/etc/chrony"
  - "/var/log/pihole"
  - "/opt/pihole"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "/var/log/pihole/pihole.log.*"
