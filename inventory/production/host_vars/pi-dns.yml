---
# DNS server specific configuration - Pi-hole on Debian Bookworm
dns_service: pihole
dns_port: 53
dns_interface: "{{ primary_ip }}"

# Device Configuration
device_type: rpi3b

# Pi-hole configuration
dns_pihole_webpassword: "{{ vault_pihole_webpassword }}"
dns_pihole_dns_servers:
  - "192.168.20.1"
dns_pihole_interface: "{{ primary_interface }}"
dns_pihole_packages:
  - curl
  - ca-certificates
  - dnsutils

# Automatic updates configuration
dns_auto_updates_enabled: true
dns_auto_updates_schedule: "0 2 * * 1" # Monday 2 AM
dns_auto_updates_reboot_if_required: true

# NTP server configuration
ntp_server_enabled: true
# OPNsense (192.168.20.1) already runs NTP - use it as the local, low-latency
# upstream instead of hitting the public pool from every device.
dns_ntp_upstream_server: "192.168.20.1"
ntp_allowed_networks:
  - "10.0.0.0/8"
  - "192.168.0.0/16"
  - "172.16.0.0/12"

# Firewall configuration for DNS services
common_firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 53, comment: "Pi-hole DNS", proto: "udp"}
  - {port: 53, comment: "Pi-hole DNS", proto: "tcp"}
  - {port: 80, comment: "Pi-hole Web Interface"}
  - {port: 123, comment: "NTP server", proto: "udp"}
  - {port: 9100, comment: "Node Exporter"}
  - {port: 9617, comment: "Pi-hole Exporter"}
  - {port: 19999, comment: "Netdata"}

# Additional services for Pi 3B
additional_services:
  - name: Netdata
    description: "System monitoring"
    port: 19999
  - name: Prometheus-node-exporter
    description: "Metrics collection"
    port: 9100
  - name: Chrony
    description: "NTP server"
    port: 123
  - name: Pihole-exporter
    description: "Pi-hole metrics exporter"
    port: 9617

# Prometheus exporters configuration
prometheus_exporters_pihole_exporter_enabled: true
prometheus_exporters_pihole_exporter_target_host: "{{ primary_ip }}"
prometheus_role: "dns"

# Secondary local backup to Syncthing (Teleporter + pihole-FTL.db snapshot).
# Syncthing runs as the ansible user (send-only from this Pi) - same account
# used for deployment and manual admin, kept uniform across the fleet.
dns_backup_enabled: true
dns_backup_dir: "/home/ansible/syncthing/pihole-backup"
dns_backup_owner: "ansible"

# Enterprise backup configuration
restic_enabled: true
restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/dns"
restic_password: "{{ vault_restic_dns_password }}"
common_backup_directories:
  - "/etc/pihole"
  - "/etc/chrony"
  - "/var/log/pihole"
  - "/opt/pihole"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "/var/log/pihole/pihole.log.*"
