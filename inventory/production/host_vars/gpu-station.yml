---
# GPU research host for the quantum-pipeline VQE solver. See roles/gpu-qp/README.md.

device_role: gpu-qp
device_type: cloud_vm

# CUDA compute capability of the installed card, for example 6.1 for Pascal or 8.6 for Ampere.
gpu_qp_cuda_arch: "6.1"

# SSH uses the fleet-wide ansible_ssh_private_key_file from hosts.yml and the debian user set there.
# The public half of that key must be in /home/debian/.ssh/authorized_keys on the instance.

# A cloud instance is disposable, so teardowns are never blocked on it.
teardown_protected: false

# The base play in playbooks/site.yml installs Node Exporter here through the `prometheus` group.
# The prometheus-exporters validation requires prometheus_role.
# The monitoring role uses it as the scrape label in roles/monitoring/templates/prometheus.yml.j2.
prometheus_role: "gpu-qp"

# The exporter role opens its port only to primary_network_cidr, which is this host's own subnet.
# The monitoring host is on another subnet, so it is allowed explicitly.
firewall_rules:
  - {port: 9100, proto: "tcp", src: "192.168.20.5", comment: "Node Exporter metrics (Prometheus scrape)"}
