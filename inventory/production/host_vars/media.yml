---
# Refused by the *-teardown playbooks; a staging host leaves this unset.
teardown_protected: true
# TLS terminates at the central reverse proxy, so Navidrome serves plain HTTP.

device_type: rpi3b

media_library_path: "/mnt/data"
# The audio Bible gains nothing from the lyrics and ReplayGain backfill, and it takes hours.
media_backfill_exclude: '^artist:New International Version'

media_youtube_enabled: true

# These are the LAN resolvers the host already uses, with the router as the fallback.
# The beets container gets exactly these, so a lookup that works from the host also works from the container.
media_beets_dns:
  - 192.168.20.10
  - 192.168.20.1

firewall_common_ports:
  - {port: 22, comment: "SSH"}
  - {port: 4545, comment: "Navidrome"}

# Watchtower's HTTP API can trigger updates, so these ports are open to the monitoring host only.
firewall_rules:
  - {port: 8084, proto: "tcp", src: "192.168.20.5", comment: "Watchtower metrics (Prometheus scrape)"}
  - {port: 8085, proto: "tcp", src: "192.168.20.5", comment: "cAdvisor metrics (Prometheus scrape)"}

common_auto_updates_reboot_if_required: true
common_auto_updates_reboot_time: "05:15"

prometheus_role: "music"

# The role writes the Storage Box key from restic_storage_key when it is set.
# Otherwise place the key by hand at /etc/ssh/restic_storage_key, and authorize its public key on the Storage Box first.
# restic_storage_key: "{{ vault_restic_storage_key_media }}"
media_restic_enabled: true
media_restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/music"
media_restic_password: "{{ vault_restic_music_password }}"

common_syncthing_enabled: true
media_backup_enabled: true
media_backup_dir: "/mnt/data/syncthing/backup"
