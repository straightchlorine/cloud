---
# Disposable clone of pi-dns.yml for testing the dns role. Delete this file
# and the pi-dns-test entry in hosts.yml once done.

device_type: rpi3b # adjust if your spare Pi is a different model

# OPNsense unbound instance on this VLAN - no external resolvers.
dns_pihole_dns_servers:
  - "192.168.20.1"
dns_pihole_interface: "{{ primary_interface }}"
# OPNsense already runs NTP here - use it as the low-latency upstream.
dns_ntp_upstream_server: "192.168.20.1"
dns_pihole_packages:
  - curl
  - ca-certificates
  - dnsutils
  - jq  # pihole-syncthing-backup.sh parses the Pi-hole API JSON with this

# dns_auto_updates gates only the Pi-hole weekly cron; Debian updates + reboot
# are fleet-wide via the common role.
dns_auto_updates_enabled: true
# Notifications: keep TRUE so the dns role re-applies reboot-notify.sh on every
# dns-only redeploy (the shared ntfy helper is installed fleet-wide).
common_auto_updates_reboot_if_required: true

common_firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 53, comment: "Pi-hole DNS", proto: "udp"}
  - {port: 53, comment: "Pi-hole DNS", proto: "tcp"}
  - {port: 80, comment: "Pi-hole Web Interface"}
  # No 123/udp: this box doesn't serve NTP, so an unrestricted allow would
  # shadow the src-restricted NTP rule the dns role adds when it is enabled.
  - {port: 9100, comment: "Node Exporter"}
  - {port: 9617, comment: "Pi-hole Exporter"}

prometheus_exporters_pihole_exporter_enabled: true
prometheus_exporters_pihole_exporter_target_host: "{{ primary_ip }}"
prometheus_role: "dns"

# Local backup on the optional attached drive (dns_optional_drive_* /mnt/data).
dns_backup_enabled: true
dns_backup_dir: "/mnt/data/syncthing/backup"
dns_backup_owner: "ansible"

# DESTRUCTIVE, host-scoped on purpose - NOT a role default: a future dns-group
# host should never get wiped without an explicit per-host choice.
dns_optional_drive_format: true

# NTP serving left off - a test box shouldn't become another's dependency.
# Off-site restic backup disabled with a placeholder repo - never write into
# pi-dns's real Hetzner backup.
restic_enabled: false
restic_repository: "sftp:hetzner-storage:unused-dns-test-placeholder"
restic_password: "unused-dns-test-placeholder"

# Syncthing installation (official apt stable-v2 channel).
# Set common_syncthing_enabled=true to install Syncthing on this host;
# the DNS backup script assumes syncthing is running and sharing
# the folder at {{ dns_backup_dir }}.
common_syncthing_enabled: true
