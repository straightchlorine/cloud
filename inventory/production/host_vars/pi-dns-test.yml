---
# Disposable clone of pi-dns.yml for testing the dns role end-to-end on
# throwaway hardware. Delete this file and the pi-dns-test entry in
# hosts.yml once you're done testing.

# Device Configuration
device_type: rpi3b # adjust if your spare Pi is a different model

# Pi-hole configuration
# OPNsense unbound instance on this VLAN - no external resolvers.
dns_pihole_dns_servers:
  - "192.168.20.1"
dns_pihole_interface: "{{ primary_interface }}"
# OPNsense (192.168.20.1) already runs NTP - use it as the local, low-latency
# upstream instead of hitting the public pool from every device.
dns_ntp_upstream_server: "192.168.20.1"
dns_pihole_packages:
  - curl
  - ca-certificates
  - dnsutils

# Automatic updates configuration
dns_auto_updates_enabled: true
dns_auto_updates_reboot_if_required: true

# Firewall configuration for DNS services
common_firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 53, comment: "Pi-hole DNS", proto: "udp"}
  - {port: 53, comment: "Pi-hole DNS", proto: "tcp"}
  - {port: 80, comment: "Pi-hole Web Interface"}
  - {port: 123, comment: "NTP server", proto: "udp"}
  - {port: 9100, comment: "Node Exporter"}
  - {port: 9617, comment: "Pi-hole Exporter"}

# Prometheus exporters configuration
prometheus_exporters_pihole_exporter_enabled: true
prometheus_exporters_pihole_exporter_target_host: "{{ primary_ip }}"
prometheus_role: "dns"

# Local Syncthing backup left off (role default) - no point wiring up
# Syncthing on a box you're about to tear down.

# NTP serving to the VLAN left off (role default: dns_ntp_server_enabled
# false) - a disposable test box shouldn't become something else depends on.

# Off-site restic backup: required by validate.yml but disabled and pointed
# at a placeholder repo so this disposable box can never write into pi-dns's
# real Hetzner backup repository.
restic_enabled: false
restic_repository: "sftp:hetzner-storage:unused-dns-test-placeholder"
restic_password: "unused-dns-test-placeholder"
