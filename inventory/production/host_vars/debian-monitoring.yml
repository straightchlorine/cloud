---
# Monitoring Infrastructure Host Configuration
# Dedicated Debian host for centralized monitoring stack

# Host identification
device_role: monitoring
device_type: debian_vm

# Monitoring path configuration (required for validation)
monitoring_data_path: "/var/lib/monitoring"
monitoring_config_path: "/etc/monitoring"
monitoring_log_path: "/var/log/monitoring"
monitoring_stack_home: "/opt/monitoring"

# Monitoring user configuration
monitoring_user: "monitoring"
monitoring_uid: 1001
monitoring_gid: 1001

# Service ports (required for validation)
monitoring_grafana_port: 3000
monitoring_prometheus_port: 9090
monitoring_loki_port: 3100
monitoring_uptime_kuma_port: 3001
monitoring_alertmanager_port: 9093

# Grafana configuration
monitoring_grafana_admin_password: "{{ vault_grafana_admin_password }}"
monitoring_grafana_domain: "monitoring.{{ domain_name }}"

# Prometheus configuration
monitoring_prometheus_retention: "30d"
monitoring_prometheus_storage_path: "/var/lib/prometheus"

# Loki configuration
monitoring_loki_retention: "30d"
monitoring_loki_storage_path: "/var/lib/loki"

# Alertmanager configuration
monitoring_alertmanager_email: "{{ vault_alertmanager_email }}"
monitoring_alertmanager_smtp_host: "{{ vault_smtp_host }}"
monitoring_alertmanager_smtp_port: "{{ vault_smtp_port }}"

# Network and security
firewall_monitoring_ports:
  - port: 3000
    comment: "Grafana web interface"
  - port: 9090
    comment: "Prometheus web interface"
  - port: 3100
    comment: "Loki HTTP API"
  - port: 9093
    comment: "Alertmanager web interface"

# Storage requirements
monitoring_storage_requirements:
  prometheus: "10GB"
  loki: "20GB"
  grafana: "1GB"

# Backup configuration for monitoring data
monitoring_backup_enabled: true
monitoring_backup_directories:
  - "/var/lib/prometheus"
  - "/var/lib/loki"
  - "/var/lib/grafana"
  - "/etc/prometheus"
  - "/etc/grafana"

# Enterprise backup configuration
restic_enabled: true
restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/monitoring"
restic_password: "{{ vault_restic_monitoring_password }}"
common_backup_directories:
  - "{{ monitoring_data_path }}"
  - "{{ monitoring_config_path }}"
  - "/var/lib/prometheus"
  - "/var/lib/loki"
  - "/var/lib/grafana"
  - "/etc/grafana"
  - "/etc/prometheus"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "**/logs/*"
  - "**/*.cache"

# Monitoring stack configuration
ansible_fqdn: "{{ inventory_hostname }}.{{ domain_name }}"
monitoring_network: "monitoring-network"
prometheus_role: "monitoring"

# Grafana configuration
monitoring_grafana_database_type: "sqlite3"
monitoring_grafana_allow_embedding: "false"

# Backup script configuration
common_backup_service_name: "monitoring"
common_backup_cache_dir: "{{ common_backup_base_path }}/cache"
common_backup_log_dir: "{{ common_backup_base_path }}/logs"
retention_policy:
  daily: "7"
  weekly: "4"
  monthly: "6"
  yearly: "1"

# Required vault variables for validation
required_monitoring_vars:
  - vault_grafana_admin_password
  - vault_alertmanager_email
  - vault_smtp_host
  - vault_smtp_port
  - vault_restic_monitoring_password
