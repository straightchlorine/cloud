---
# Refused by the *-teardown playbooks; a staging host leaves this unset.
teardown_protected: true
# TLS terminates at the central reverse proxy, so the services publish plain HTTP on the host IP.

device_type: rpi4b

# The data path is an SSD mount when a drive is present.
# Journald and Docker's data-root move onto that drive as well.
automation_data_path: "/mnt/data"

# These are the networks that send requests to Firefly: the LAN reverse proxy and the tailnet.
# Without the proxy listed, Firefly ignores X-Forwarded-Proto and emits http:// URLs even over HTTPS.
automation_trusted_proxies: "192.168.20.30/32,100.64.0.0/10"

firewall_common_ports:
  - {port: 22, comment: "SSH"}
  - {port: 8081, comment: "Vaultwarden"}
  - {port: 8082, comment: "Firefly III"}
  - {port: 8083, comment: "Calibre-Web"}

# Watchtower's HTTP API can trigger image updates, not just read metrics.
# These ports are therefore open to the monitoring host only, unlike the LAN-wide ports above.
firewall_rules:
  - {port: 8084, proto: "tcp", src: "192.168.20.5", comment: "Watchtower metrics (Prometheus scrape)"}
  - {port: 8085, proto: "tcp", src: "192.168.20.5", comment: "cAdvisor metrics (Prometheus scrape)"}

common_auto_updates_reboot_if_required: true
common_auto_updates_reboot_time: "05:00"

prometheus_role: "automation"

# Off-site backup through the roles/restic job named "automation".
# The role writes the Storage Box key from restic_storage_key when it is set.
# Otherwise place the key by hand at /etc/ssh/restic_storage_key, and authorize its public key on the Storage Box first.
# restic_storage_key: "{{ vault_restic_storage_key_pi_automation }}"
automation_restic_enabled: true
automation_restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/automation"
automation_restic_password: "{{ vault_restic_automation_password }}"

# Syncthing replicates automation_backup_dir as the secondary local backup.
# The role defaults automation_backup_owner to ansible_user, which runs the stack and Syncthing.
common_syncthing_enabled: true
automation_backup_enabled: true
automation_backup_dir: "/mnt/data/syncthing/backup"
