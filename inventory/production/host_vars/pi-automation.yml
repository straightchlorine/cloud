---
# Raspberry Pi 4 (production automation host): vaultwarden, firefly + mariadb,
# watchtower. TLS terminates at the central reverse proxy; services publish
# plain HTTP on the host IP.

device_type: rpi4b
device_specs:
  cpu: "ARM Cortex-A72 4-core 1.5GHz"
  memory: "2GB"
  architecture: "aarch64"

# automation_data_path: SSD mount when a drive is present; journald and Docker's
# data-root live under it too (both optional/auto-detected, mirroring DNS).
automation_data_path: "/mnt/data"

automation_subdomain_vaultwarden: "vault"
automation_subdomain_firefly: "firefly"

# Only the CIDRs that actually send requests: the LAN reverse proxy (192.168.20.30)
# and the tailnet. Without the proxy listed, Firefly ignores its X-Forwarded-Proto
# and emits http:// URLs/CSP even though the client connected over real HTTPS.
automation_trusted_proxies: "192.168.20.30/32,100.64.0.0/10"

common_firewall_ports:
  - {port: 22, comment: "SSH"}
  - {port: 8081, comment: "Vaultwarden"}
  - {port: 8082, comment: "Firefly III"}
  - {port: 8083, comment: "Calibre-Web"}

# Watchtower's HTTP API can trigger image updates, not just read metrics -
# scoped to the monitoring host only, unlike the LAN-wide ports above.
firewall_rules:
  - {port: 8084, proto: "tcp", src: "192.168.20.5", comment: "Watchtower metrics (Prometheus scrape)"}
  - {port: 8085, proto: "tcp", src: "192.168.20.5", comment: "cAdvisor metrics (Prometheus scrape)"}

# Stack-level
common_start_stack: true

# Prometheus labels
prometheus_role: "automation"

# Primary/off-site backup - restic.
restic_enabled: true
restic_repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/automation"
restic_password: "{{ vault_restic_automation_password }}"
common_backup_tmp_dir: "{{ automation_data_path }}/backup-tmp"
common_backup_directories:
  - "{{ automation_stack_home }}"
  - "{{ automation_data_path }}"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log.1*"
  - "**/logs/*"
common_backup_service_name: "automation"

# Secondary local backup: Syncthing replicates automation_backup_dir.
# automation_backup_owner derives from ansible_user (the stack/Syncthing user).
common_syncthing_enabled: true
automation_backup_enabled: true
automation_backup_dir: "/mnt/data/syncthing/backup"
