---
teardown_protected: true
device_role: workstation
device_type: arch_linux

# Off-site backup through roles/restic, which playbooks/site.yml applies because no stack role owns this host.
# The role writes the Storage Box key from restic_storage_key when it is set.
# Otherwise place the key by hand at /etc/ssh/restic_storage_key, and authorize its public key on the Storage Box first.
# restic_storage_key: "{{ vault_restic_storage_key_station_arch }}"

# /var is its own small filesystem here, so the cache and the pack-file staging directory (TMPDIR) live on the RAID.
# The units wait for that mount (RequiresMountsFor), so a catch-up run at boot cannot start before it is there.
restic_cache_dir: /data/vault/.cache/restic
restic_jobs:
  - name: station
    # The push-backup units this job retires are still named backup-station-arch.
    legacy_name: station-arch
    repository: "sftp:hetzner-storage:{{ vault_backup_repository_base }}/station-arch"
    password: "{{ vault_restic_station_arch_password }}"
    schedule: "*-*-* 10:00:00"
    # One timeout covers the backup, forget, the weekly prune and the weekly partial data check.
    # A prune that times out is retried on the next daily run.
    timeout: 8h
    memory_max_mib: 12288
    # The freshness check alerts when the last good run is older than this.
    # It runs daily at noon and shortly after boot.
    # The large value keeps a Monday boot after a weekend off quiet until the catch-up run lands.
    max_age_hours: 96
    retention: { daily: 7, weekly: 2, monthly: 2, yearly: 1 }
    sources:
      - /etc
      - /home
      - /var/lib
      - /data/ssd/uni
      - /data/vault/books
      - /data/vault/memory-vault
      - /data/vault/backup
    # Everything regenerable stays out, but .git stays in because unpushed history cannot be regenerated.
    # Every restic run already passes --exclude-caches, which skips directories carrying a CACHEDIR.TAG.
    excludes:
      # Dependency directories and build output.
      - "**/node_modules"
      - "**/.venv"
      - "**/venv"
      - "**/__pycache__"
      - "**/target"
      - "**/*.wdb"
      - "*.tmp"
      # Caches, toolchains, package stores and games.
      - "**/.cache"
      - "/home/*/.npm"
      - "/home/*/.local/share/pnpm"
      - "/home/*/.local/go"
      - "/home/*/.local/share/containers"
      - "/home/*/.local/share/nvim"
      - "/home/*/.rustup"
      - "/home/*/.cargo/registry"
      - "/home/*/.vite-plus"
      - "/home/*/.pyenv/versions"
      - "/home/*/.local/share/Steam/steamapps"
      - "/home/*/.local/share/matlab"
      - "/home/*/code/wke-bench/models"
      - "/home/**/cache"
      - "/home/**/tmp"
      - "/home/**/logs"
      - "/data/ssd/**/cache"
      - "/data/ssd/**/tmp"
      - "/data/ssd/**/logs"
      - "/data/ssd/uni/masters/2_term/nlp/nlp-venv"
      # Docker's images, layers and build cache are regenerable; its named volumes hold data and stay in.
      # A userns-remapped daemon keeps the same layout under a <uid>.<gid> subdirectory.
      - "/var/lib/docker/*"
      - "!/var/lib/docker/volumes"
      - "!/var/lib/docker/*.*"
      - "/var/lib/docker/*.*/*"
      - "!/var/lib/docker/*.*/volumes"
      - "/var/lib/containers"
      - "/var/lib/machines"
      - "/var/lib/clamav"
      - "/var/lib/texmf"
      - "/var/lib/systemd/coredump"
      # The leak archive is too large to ever send off-site.
      - "/data/vault/backup/leaks"
