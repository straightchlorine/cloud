---
# Station-Arch Workstation Configuration
# Standalone backup - handles its own backups independently
device_role: workstation
device_type: arch_linux

# ============================================
# BACKUP CONFIGURATION (Standalone Mode)
# ============================================

# Mode: standalone (direct backup to Hetzner)
backup_role: standalone

# User and paths
backup_user: backup
backup_group: backup
backup_base_path: /opt/backup

# Restic configuration
restic_version: "0.18.1"
restic_repository: "sftp:{{ vault_backup_storage_user }}@{{ vault_backup_storage_host }}:{{ vault_backup_storage_port }}{{ vault_backup_repository_base }}/station-arch"
restic_password: "{{ vault_restic_station_arch_password }}"

# Backup paths
backup_paths:
  - /etc
  - /home
  - /var/lib
  - /data/ssd/code
  - /data/vault/books
  - /data/vault/code
  - /data/vault/media/img
  - /data/vault/media/misc
  - /data/vault/organise

# Exclude patterns
backup_excludes:
  - "**/.cache/**"
  - "**/cache/**"
  - "**/tmp/**"
  - "/var/tmp/**"
  - "/var/cache/**"
  - "*.log.1*"
  - "*.tmp"
  - "**/logs/**"
  - "/data/vault/code/.vault/leaks/"
  - "/home/*/.local/share/Steam/steamapps/**"
  - "/home/*/.local/share/anaconda/**"
  - "/home/*/.local/share/matlab/**"
  - "/home/*/building/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/target/**"
  - "**/build/**"
  - "**/__pycache__/**"
  - "*.iso"
  - "*.img"
  - "*.vmdk"

# Retention policy
retention_policy:
  daily: 30
  weekly: 12
  monthly: 24
  yearly: 3

# Restic optimization (optimized for speed on powerful machine)
restic_optimization:
  read_concurrency: 8     # High for Ryzen 7 16-thread CPU
  compression: auto
  pack_size: 64           # Larger packs OK with 32GB RAM

# Scheduling
backup_schedule: "*-*-* 10:00:00"  # Daily at 10 AM
backup_randomized_delay: "1800s"   # Random delay up to 30 min
backup_timeout: 14400              # 4 hours timeout for large dataset

# Optional: Memory limit (not needed on 32GB machine but can be set for safety)
# restic_memory_limit: "4G"
