---
# Service-specific variables for service hosts

# System Configuration
ansible_python_interpreter: /usr/bin/python3
os_type: debian_bookworm

# Network Configuration (dynamically detected)
local_network: "{{ primary_network_cidr }}"

# Common Firewall Ports (SSH always allowed)
common_firewall_ports:
  - port: 22
    comment: "SSH access"

# Monitoring Configuration
prometheus_node_exporter_enabled: true
prometheus_node_exporter_port: 9100

# Common Systemd Service Configuration (eliminates duplication)
# Used by all Docker stack services
common_systemd_config:
  service_type: "oneshot"
  remain_after_exit: "true"
  common_standard_output: "journal"
  common_standard_error: "journal"
  restart_policy: "on-failure"
  restart_sec: "5"
  common_wanted_by: "multi-user.target"
  enable_security_hardening: true
  no_new_privileges: "true"

# Common Enterprise Backup Configuration (eliminates duplication)
# Used by all service hosts
common_backup_config:
  common_backup_cache_dir: "{{ common_backup_base_path }}/cache"
  common_backup_log_dir: "{{ common_backup_base_path }}/logs"
  retention_policy:
    daily: "7"
    weekly: "4"
    monthly: "6"
    yearly: "1"
  backup_exclude_patterns:
    - "*.tmp"
    - "*.log.1*"
    - "**/logs/*"
    - "docker/overlay2/*"

# Common SSD Configuration (eliminates duplication)
# Used by hosts with external storage
common_ssd_config:
  ssd_filesystem: "ext4"
  ssd_mount_options: "defaults,noatime,errors=remount-ro"
  ssd_format: false
