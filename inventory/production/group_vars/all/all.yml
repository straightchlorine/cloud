---
# Global configuration variables for all hosts

# Common system settings
timezone: Europe/Warsaw

# Standardized Docker Compose version
docker_compose_version: "v2.24.5"

# Common security settings
ssh_port: 22
enable_ufw: true

# Common package cache settings
package_cache_valid_time: 3600
backup_retention_days: 30

# Standardized backup configuration paths
common_backup_base_path: "/opt/backup"
common_backup_password_file: "{{ common_backup_base_path }}/restic-password"

# Common filesystem utilities (used by all roles with storage)
common_filesystem_utilities:
  - parted
  - e2fsprogs
  - ntfs-3g
  - exfat-fuse
  - exfatprogs

# Common System Packages
common_packages:
  - curl
  - wget
  - git
  - htop
  - vim
  - ufw
  - fail2ban
  - logrotate
  - rsync
  - unzip
  - software-properties-common
  - ca-certificates
  - gnupg
  - lsb-release

# Log Management
log_rotation_days: 30
log_compression: true

# Security Configuration
common_fail2ban_enabled: true
common_fail2ban_ssh_maxretry: 3
common_fail2ban_ssh_bantime: 600

# Domain configuration (must be set in vault)
domain_name: "{{ vault_domain_name }}"
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# Validation checks - these variables MUST be defined in host_vars
required_vars:
  - domain_name
  - vault_domain_name
  - vault_letsencrypt_email
