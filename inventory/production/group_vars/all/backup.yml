---
backup_user: backup
backup_group: backup

# The Hetzner Storage Box connection values come from the vault, see vault.yml.example.
# One account is shared by every push host, so any host's key can delete every repository.
# This risk is accepted in docs/backup/index.md.
restic_storage_host: "{{ vault_backup_storage_host }}"
restic_storage_user: "{{ vault_backup_storage_user }}"
restic_storage_port: "{{ vault_backup_storage_port }}"
# The pinned host keys live in the vault because each line names the Storage Box host.
# Take them from ssh-keyscan against the storage port and compare them with Hetzner's published fingerprints.
# Validation refuses sftp jobs until a line matches the storage host and port.
restic_known_hosts: "{{ vault_backup_storage_known_hosts }}"
