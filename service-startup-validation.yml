# Service startup order validation playbook
# Validates service dependencies and startup sequences across all services
# Usage: ansible-playbook -i inventory service-startup-validation.yml

- name: Service startup order validation for all services
  hosts: all
  gather_facts: yes
  become: no

  tasks:
    - name: Display service startup validation start message
      ansible.builtin.debug:
        msg: |
          🚀 Starting service startup order validation for {{ inventory_hostname }}

          Validation scope:
          ✅ Docker Compose service dependency analysis
          ✅ Service startup tier identification and ordering
          ✅ Network configuration and external dependencies
          ✅ Port conflicts and resource requirements
          ✅ Critical service dependency chain validation

          This prevents service startup failures due to incorrect dependency ordering!

    - name: Run common service startup validation
      ansible.builtin.include_role:
        name: common
        tasks_from: service_startup_validation
      tags: [common_startup]

    - name: Run DNS service startup validation for Pi-hole hosts
      ansible.builtin.include_role:
        name: dns
        tasks_from: service_startup_validation
      when: "'dns' in group_names"
      tags: [dns_startup]

    - name: Run automation service startup validation for automation hosts
      ansible.builtin.include_role:
        name: automation
        tasks_from: service_startup_validation
      when: "'automation' in group_names"
      tags: [automation_startup]

    - name: Run music service startup validation for music hosts
      ansible.builtin.include_role:
        name: music-stack
        tasks_from: service_startup_validation
      when: "'music' in group_names"
      tags: [music_startup]

    - name: Generate comprehensive service startup validation summary
      ansible.builtin.debug:
        msg: |
          ✅ Service Startup Validation Summary for {{ inventory_hostname }}:

          Common Requirements:
          ✅ Docker service availability and network creation capability
          ✅ Compose file structure and resource limits validation

          {% if 'dns' in group_names %}
          DNS Services (Pi-hole):
          ✅ System DNS service conflict resolution
          ✅ Port 53 availability and interface binding
          ✅ Upstream DNS connectivity verification
          ✅ Service startup order: systemd-resolved reconfiguration → Pi-hole installation → DNS pointing
          {% endif %}

          {% if 'automation' in group_names %}
          Automation Stack:
          ✅ Multi-tier service dependency validation
          ✅ Traefik reverse proxy foundation requirement
          ✅ Database → Application → Monitoring startup sequence
          ✅ Network routing and external dependency management
          {% endif %}

          {% if 'music' in group_names %}
          Music Stack:
          ✅ Core service → Agent → Tool tier identification
          ✅ Volume mount and profile-based service management
          ✅ Independent agent startup capability
          {% endif %}

          🚀 All service startup dependencies validated successfully!
          Services are ready for coordinated deployment with proper startup ordering.

  handlers:
    - name: service startup validation complete
      ansible.builtin.debug:
        msg: "🚀 All hosts passed service startup validation"

# Quick service dependency check for monitoring/CI
- name: Quick service startup status check
  hosts: all
  gather_facts: no
  become: no
  tasks:
    - name: Quick Docker service status check
      ansible.builtin.systemd:
        name: docker
      register: quick_docker_check

    - name: Quick compose file existence check
      ansible.builtin.stat:
        path: "{{ item }}/docker-compose.yml"
      register: quick_compose_checks
      loop:
        - "{{ automation_stack_home | default('/nonexistent') }}"
        - "{{ music_stack_home | default('/nonexistent') }}"
      when: item != '/nonexistent'

    - name: Display quick service startup status
      ansible.builtin.debug:
        msg: |
          ⚡ Quick Service Startup Status for {{ inventory_hostname }}:
          Docker Service: {{ 'Active' if quick_docker_check.status.ActiveState == 'active' else 'Inactive' }}
          Compose Files: {{ quick_compose_checks.results | selectattr('stat.exists') | map(attribute='item') | list | join(', ') or 'None found' }}
          Status: {{ '✅ Ready for service deployment' if quick_docker_check.status.ActiveState == 'active' else '⚠️ Docker service required' }}

