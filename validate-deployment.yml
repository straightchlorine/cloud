# Pre-deployment validation playbook
# Run this before any deployment to ensure all requirements are met
# Usage: ansible-playbook -i inventory validate-deployment.yml

- name: Validate all deployment requirements
  hosts: all
  gather_facts: yes
  become: no

  tasks:
    - name: Display validation start message
      ansible.builtin.debug:
        msg: "Starting pre-deployment validation for {{ inventory_hostname }}"

    - name: Validate common requirements
      block:
        - name: Check basic connectivity
          ansible.builtin.ping:

        - name: Gather system facts
          ansible.builtin.setup:

        - name: Validate OS compatibility
          ansible.builtin.fail:
            msg: "Unsupported OS family: {{ ansible_os_family }}. Only Debian-based systems supported."
          when: ansible_os_family != "Debian"

        - name: Check minimum memory requirements
          ansible.builtin.fail:
            msg: "Insufficient memory: {{ ansible_memtotal_mb }}MB. Minimum 1GB required."
          when: ansible_memtotal_mb < 1024

        - name: Validate architecture
          ansible.builtin.fail:
            msg: "Unsupported architecture: {{ ansible_architecture }}"
          when: ansible_architecture not in ['aarch64', 'x86_64']

        - name: Test network connectivity
          ansible.builtin.uri:
            url: "{{ item }}"
            method: HEAD
            timeout: 10
          loop:
            - "https://hub.docker.com"
            - "https://github.com"
            - "https://archive.ubuntu.com"
          register: network_check

        - name: Validate all network connections successful
          ansible.builtin.fail:
            msg: "Network connectivity test failed for {{ item.item }}"
          when: item.status != 200
          loop: "{{ network_check.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Check available disk space on root filesystem
          ansible.builtin.shell: df / | tail -1 | awk '{print $4}'
          register: root_disk_space
          changed_when: false

        - name: Fail if insufficient root disk space
          ansible.builtin.fail:
            msg: "Insufficient root disk space. Available: {{ (root_disk_space.stdout | int / 1024 / 1024) | round(2) }}GB. Required: 2GB minimum"
          when: (root_disk_space.stdout | int) < 2097152

        - name: Check available disk space on /tmp
          ansible.builtin.shell: df /tmp | tail -1 | awk '{print $4}'
          register: tmp_disk_space
          changed_when: false

        - name: Fail if insufficient temp space
          ansible.builtin.fail:
            msg: "Insufficient temp space. Available: {{ (tmp_disk_space.stdout | int / 1024) | round(2) }}MB. Required: 500MB minimum"
          when: (tmp_disk_space.stdout | int) < 512000

        - name: Verify essential services are available
          ansible.builtin.systemd:
            name: "{{ item }}"
          register: service_check
          failed_when: service_check.status.LoadState == "not-found"
          loop:
            - ssh
            - systemd-resolved

        - name: Check Docker service for container-based deployments
          ansible.builtin.systemd:
            name: docker
          register: docker_service_check
          failed_when: false
          when: "'automation' in group_names or 'music' in group_names"

        - name: Fail if Docker required but not installed
          ansible.builtin.fail:
            msg: "Docker service not found but required for this host group"
          when:
            - "'automation' in group_names or 'music' in group_names"
            - docker_service_check.status.LoadState == "not-found"

    - name: Run backup validation for all hosts
      ansible.builtin.include_role:
        name: common
        tasks_from: backup_validation
      tags: [backup_validation]

    - name: Run DNS validation for Pi-hole hosts
      ansible.builtin.include_role:
        name: dns
        tasks_from: validate
      when: "'dns' in group_names"

    - name: Run automation validation for automation hosts
      ansible.builtin.include_role:
        name: automation
        tasks_from: validate
      when: "'automation' in group_names"

    - name: Run music stack validation for music hosts
      ansible.builtin.include_role:
        name: music-stack
        tasks_from: validate
      when: "'music' in group_names"

    - name: Display validation success message
      ansible.builtin.debug:
        msg: "Pre-deployment validation completed successfully for {{ inventory_hostname }}"

  handlers:
    - name: validation complete
      ansible.builtin.debug:
        msg: "All hosts passed validation checks"

