---
- name: Pre-deployment validation
  # The base plays target `fleet`, which holds the Debian-family hosts.
  # The honeypot (CentOS Stream) has its own play at the end of this file and in playbooks/honeypot.yml.
  # The honeybench host is deployed on demand by playbooks/honeybench.yml.
  # Station-arch (Arch) and the OPNsense firewall are not in the fleet either.
  hosts: fleet
  gather_facts: true
  become: false
  tags: [validation, pre_validation]
  tasks:
    - name: Run role-specific validation
      tags: [role_validation]
      block:
        - name: DNS validation for Pi-hole hosts
          ansible.builtin.include_role:
            name: dns
            tasks_from: validate
          when: "'dns' in group_names"

        - name: Automation validation for automation hosts
          ansible.builtin.include_role:
            name: automation
            tasks_from: validate
          when: "'automation' in group_names"

        - name: Media stack validation for music hosts
          ansible.builtin.include_role:
            name: media
            tasks_from: validate
          when: "'music' in group_names"

        - name: Monitoring validation for monitoring hosts
          ansible.builtin.include_role:
            name: monitoring
            tasks_from: validate
          when: "'monitoring' in group_names"

        - name: GPU validation for gpu_qp hosts
          ansible.builtin.include_role:
            name: gpu-qp
            tasks_from: validate
          when: "'gpu_qp' in group_names"

- name: Configure all hosts with common setup
  hosts: fleet
  become: true
  gather_facts: true
  pre_tasks:
    - name: Sync system clock via chrony
      # This must run before any HTTPS-dependent task, such as the apt cache update, installs and checksum downloads.
      # A wrong clock fails TLS notBefore validation on all of them.
      ansible.builtin.include_role:
        name: common
        tasks_from: chrony

    - name: Update package cache
      ansible.builtin.include_role:
        name: common
        tasks_from: package_cache_update

  roles:
    - role: common
      tags: [common, base]
    - role: firewall
      tags: [firewall, security]
    - role: prometheus-exporters
      tags: [monitoring, prometheus, exporters]

  post_tasks:
    - name: Verify base system configuration
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - fail2ban
        - node-exporter
      tags: [verification]

- name: Configure DNS servers
  hosts: dns
  become: true
  gather_facts: true
  roles:
    - role: dns
      tags: [dns, pihole]

- name: Configure media stack
  hosts: music
  become: true
  gather_facts: true
  roles:
    - role: media
      tags: [media, music, docker]

- name: Configure automation stack
  hosts: automation
  become: true
  gather_facts: true
  roles:
    - role: automation
      tags: [automation, services]

- name: Configure monitoring infrastructure
  hosts: monitoring
  become: true
  gather_facts: true
  roles:
    - role: monitoring
      tags: [monitoring, grafana, prometheus, loki]

- name: Configure the workstation backup
  hosts: workstations
  become: true
  gather_facts: true
  roles:
    - role: restic
      tags: [restic, backup]

- name: Configure the GPU hosts
  hosts: gpu_qp
  become: true
  gather_facts: true
  roles:
    - role: gpu-qp
      tags: [gpu-qp, gpu, quantum, docker]

- name: Configure the honeypot host
  hosts: honeypot
  become: true
  gather_facts: true
  roles:
    - role: honeypot
      tags: [honeypot, security]
