---
- name: Pre-deployment validation
  # The honeypot is excluded from every `all` play: it is a CentOS Stream VPS
  # and the fleet base roles below are apt- and ufw-based. It is deployed by
  # its own play at the end of this file (and by playbooks/honeypot.yml).
  hosts: all:!honeypot
  gather_facts: true
  become: false
  tags: [validation, pre_validation]
  tasks:
    - name: Run backup validation for all hosts
      ansible.builtin.include_role:
        name: common
        tasks_from: backup_validation
      tags: [backup_validation]

    - name: Run role-specific validation
      tags: [role_validation]
      block:
        - name: DNS validation for Pi-hole hosts
          ansible.builtin.include_role:
            name: dns
            tasks_from: validate
          when: "'dns' in group_names"

        - name: Automation validation for automation hosts
          ansible.builtin.include_role:
            name: automation
            tasks_from: validate
          when: "'automation' in group_names"

        - name: Media stack validation for music hosts
          ansible.builtin.include_role:
            name: media
            tasks_from: validate
          when: "'music' in group_names"

        - name: Honeypot validation for the honeypot host
          ansible.builtin.include_role:
            name: honeypot
            tasks_from: validate
          when: "'honeypot' in group_names"

        - name: Monitoring validation for monitoring hosts
          ansible.builtin.include_role:
            name: monitoring
            tasks_from: validate
          when: "'monitoring' in group_names"

- name: Configure all hosts with common setup
  hosts: all:!honeypot
  become: true
  gather_facts: true
  pre_tasks:
    - name: Sync system clock via chrony
      # Must run before any HTTPS-dependent task (apt cache update, package
      # installs, checksum downloads) - a wrong clock fails TLS notBefore
      # validation on all of them.
      ansible.builtin.include_role:
        name: common
        tasks_from: chrony

    - name: Update package cache
      ansible.builtin.include_role:
        name: common
        tasks_from: package_cache_update

  roles:
    - role: common
      tags: [common, base]
    - role: firewall
      tags: [firewall, security]
    - role: prometheus-exporters
      tags: [monitoring, prometheus, exporters]

  post_tasks:
    - name: Verify base system configuration
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - fail2ban
        - node-exporter
      tags: [verification]

- name: Configure DNS servers
  hosts: dns
  become: true
  gather_facts: true
  roles:
    - role: dns
      tags: [dns, pihole]

- name: Configure media stack
  hosts: music
  become: true
  gather_facts: true
  roles:
    - role: media
      tags: [media, music, docker]

- name: Configure automation stack
  hosts: automation
  become: true
  gather_facts: true
  roles:
    - role: automation
      tags: [automation, services]

- name: Configure monitoring infrastructure
  hosts: monitoring
  become: true
  gather_facts: true
  roles:
    - role: monitoring
      tags: [monitoring, grafana, prometheus, loki]

- name: Configure backup across all infrastructure hosts
  hosts: services,monitoring
  become: true
  gather_facts: true
  pre_tasks:
    - name: Skip backup config until the host declares its backup role
      # roles/backup validates `backup_role` per host; only the coordinator
      # (backup_wyse) and standalone (station-arch) hosts set it today. End
      # the play here for the rest - the backup rework will assign service
      # hosts a backup_role and this guard goes away with it. Without the
      # guard the play hard-fails on every service host, forcing callers to
      # skip it via --skip-tags backup - which ALSO skips the exporter tasks
      # tagged `backup` (a group-scope tag), breaking fresh-host deploys.
      ansible.builtin.meta: end_play
      when: backup_role is not defined
  roles:
    - role: backup
      tags: [backup]

- name: Configure the honeypot host
  hosts: honeypot
  become: true
  gather_facts: true
  roles:
    - role: honeypot
      tags: [honeypot, security]
