---
# Single confirmation flag cascades into all related teardowns.
#   ansible-playbook -i inventory/production playbooks/dns-teardown.yml \
#     --limit <your-test-host> -e dns_teardown_confirm=true
#
# Pattern (shared by every teardown playbook):
#   1. Gate on this role's own flag (dns_teardown_confirm) and hard-refuse
#      the production host.
#   2. Set the shared fact teardown_confirmed: true.
#   3. Run the teardown manifest below - every included teardown task file
#      checks teardown_confirmed, so nothing can run outside a confirmed
#      teardown. Future playbooks (media-teardown.yml, automation-teardown.yml)
#      follow the same shape with their own confirm flag.
- name: Tear down the DNS role for repeatable testing
  hosts: dns
  become: true
  gather_facts: true
  pre_tasks:
    - name: Gather network facts for teardown
      # pihole-exporter teardown needs primary_network_cidr to delete its src-restricted
      # ufw rule; it's a custom fact, not in the normal gather_facts payload.
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

  tasks:
    - name: Require explicit teardown confirmation
      ansible.builtin.assert:
        that:
          - dns_teardown_confirm | default(false) | bool
        fail_msg: >-
          Refusing DNS teardown. Re-run with -e dns_teardown_confirm=true
          and --limit <your-test-host>.
        quiet: true

    - name: Never tear down the production DNS host
      ansible.builtin.assert:
        that:
          - inventory_hostname != 'pi-dns'
          - (ansible_host | default('')) != '192.168.20.10'
        fail_msg: >-
          Refusing: {{ inventory_hostname }} ({{ ansible_host | default('?') }})
          is the PRODUCTION DNS host. Point --limit at your test Pi instead.
        quiet: true

    - name: Mark this run as a confirmed teardown
      # Single point of truth: every teardown task file below (and in other
      # roles) checks this fact before removing anything.
      ansible.builtin.set_fact:
        teardown_confirmed: true

    - name: Run DNS role teardown
      ansible.builtin.include_role:
        name: dns
        tasks_from: teardown
      when: teardown_confirmed | default(false) | bool

    - name: Tear down the Pi-hole exporter (prometheus-exporters' state, not dns's)
      ansible.builtin.include_role:
        name: prometheus-exporters
        tasks_from: pihole_exporter_teardown
      when:
        - teardown_confirmed | default(false) | bool
        - prometheus_exporters_pihole_exporter_enabled | default(false)
        - "'dns' in group_names"

    - name: Tear down Syncthing (common role)
      ansible.builtin.include_role:
        name: common
        tasks_from: syncthing_teardown
      when:
        - teardown_confirmed | default(false) | bool
        - common_syncthing_enabled | default(false) | bool
