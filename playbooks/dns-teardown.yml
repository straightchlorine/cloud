---
# Tear down the DNS stack. One confirmation flag gates every related teardown below.
#   ansible-playbook -i inventory/production playbooks/dns-teardown.yml \
#     --limit <your-test-host> -e dns_teardown_confirm=true
#
# Every teardown playbook follows the same pattern.
#   1. Gate on this role's own flag (dns_teardown_confirm) and refuse any host
#      marked teardown_protected in the inventory.
#   2. Set the shared fact teardown_confirmed: true.
#   3. Run the teardown task files below, which all check teardown_confirmed,
#      so nothing can run outside a confirmed teardown.
#
# The feature-flag gates below use | default(false) because this playbook never loads the owning roles' defaults.
# That is an acceptable cross-role flag default under CLAUDE.md.
- name: Tear down the DNS role for repeatable testing
  hosts: dns_servers
  become: true
  gather_facts: true
  pre_tasks:
    - name: Gather network facts for teardown
      # The exporter teardown deletes its source-restricted ufw rule using prometheus_exporters_firewall_source.
      # That value is primary_network_cidr, a custom fact that normal fact gathering does not provide.
      ansible.builtin.include_role:
        name: common
        tasks_from: network_facts

  tasks:
    - name: Gate the teardown
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_guard
      vars:
        common_teardown_name: dns
    - name: Run DNS role teardown
      ansible.builtin.include_role:
        name: dns
        tasks_from: teardown
      when: teardown_confirmed | default(false) | bool

    - name: Tear down the Pi-hole exporter (prometheus-exporters' state, not dns's)
      ansible.builtin.include_role:
        name: prometheus-exporters
        tasks_from: pihole_exporter_teardown
      when:
        - teardown_confirmed | default(false) | bool
        - prometheus_exporters_pihole_exporter_enabled | default(false)
        - "'dns_servers' in group_names"
