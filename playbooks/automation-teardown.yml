---
# Tear down the automation stack.
#   ansible-playbook -i inventory/production playbooks/automation-teardown.yml \
#     --limit <your-test-host> -e automation_teardown_confirm=true
# The guard gates on the confirm flag automation_teardown_confirm and refuses hosts marked teardown_protected.
# It then sets teardown_confirmed, which every included teardown task file checks.
# This shape is shared by every teardown playbook, see dns-teardown.yml.
- name: Tear down the automation role for repeatable testing
  hosts: automation
  become: true
  gather_facts: true
  tasks:
    - name: Gate the teardown
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_guard
      vars:
        common_teardown_name: automation

    - name: Run the automation teardown
      ansible.builtin.include_role:
        name: automation
        tasks_from: teardown
      when: teardown_confirmed | default(false) | bool
