---
#   ansible-playbook -i inventory/production playbooks/automation-teardown.yml \
#     --limit <your-test-host> -e automation_teardown_confirm=true
#
# Same pattern as playbooks/dns-teardown.yml: gate on this role's own flag and
# refuse hosts marked teardown_protected, set teardown_confirmed, then run the
# teardown manifest.
- name: Tear down the automation role for repeatable testing
  hosts: automation
  become: true
  gather_facts: true
  tasks:
    - name: Gate the teardown
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_guard
      vars:
        common_teardown_name: automation
    - name: Run automation role teardown
      ansible.builtin.include_role:
        name: automation
        tasks_from: teardown
      when: teardown_confirmed | default(false) | bool
