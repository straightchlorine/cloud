---
# Backup System - Complete Deployment
# Deploys coordinator and all configured target nodes

- name: Deploy Backup Coordinator
  hosts: backup-primary
  become: true
  gather_facts: true

  vars:
    backup_role: "coordinator"
    backup_base_path: "/opt/enterprise-backup"
    backup_user: "backup"
    backup_group: "backup"
    backup_restic_version: "0.18.1"
    backup_network_optimization: true
    backup_monitoring: true

  pre_tasks:
    - name: Display enterprise backup deployment start
      ansible.builtin.debug:
        msg: |
          🚀 Backup System Deployment Starting

          Coordinator: {{ inventory_hostname }}
          Targets: {{ backup_targets | length }} configured
          Base Path: {{ backup_base_path }}
          Network Optimization: {{ backup_network_optimization }}
          Monitoring: {{ backup_monitoring }}

  tasks:
    - name: Deploy enterprise backup coordinator
      ansible.builtin.include_role:
        name: backup-system

  post_tasks:
    - name: Display SSH key deployment instructions
      ansible.builtin.debug:
        msg: |
          📋 SSH Key Deployment Required:

          {% for target in backup_targets %}
          {{ target.service_name }}:
          SSH Key: {{ backup_base_path }}/keys/{{ target.service_name }}-ssh-key.pub
          Target: {{ target.ssh_user | default(backup_user) }}@{{ target.target_host }}
          Command: ssh-copy-id -i {{ backup_base_path }}/keys/{{ target.service_name }}-ssh-key.pub {{ target.ssh_user | default(backup_user) }}@{{ target.target_host }}

          {% endfor %}

- name: Deploy Standalone Backup Systems
  hosts: backup_standalone
  become: true
  gather_facts: true

  tasks:
    - name: Deploy standalone backup system
      ansible.builtin.import_role:
        name: backup-system

- name: Backup System Deployment Summary
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display comprehensive deployment summary
      ansible.builtin.debug:
        msg: |
          ✅ Backup System Deployment Complete!

          🏗️ Architecture Deployed:
          - Coordinator: {{ groups['backup_primary'] | join(', ') }}
          - Standalone Systems: {{ groups['backup_standalone'] | join(', ') }}
          - Backup Strategy: Coordinator + Standalone Architecture

          🔧 Services Configured:
          {% for host in groups['backup-primary'] %}
          {% set targets = hostvars[host]['backup_targets'] | default([]) %}
          {% for target in targets %}
          - {{ target.service_name }}: {{ target.target_host }}
            Schedule: {{ target.backup_schedule | default('*-*-* 02:00:00') }}
            Method: {{ target.backup_method | default('hybrid_enhanced') }}
            Repository: {{ target.restic_repository }}
          {% endfor %}
          {% endfor %}

          📊 Features Enabled:
          ✅ Network Optimization with Bandwidth Control
          ✅ Centralized Restore with Secure Push-back
          ✅ Real-time Performance Metrics
          ✅ Automated Health Monitoring
          ✅ Enterprise Security and Compliance

          🚀 Next Steps:
          1. Deploy SSH keys (see instructions above)
          2. Verify connectivity: /opt/enterprise-backup/scripts/backup-manager.sh --verify
          3. Test backup operations: systemctl start backup-[service].service
          4. Monitor operations: tail -f /opt/enterprise-backup/logs/backup-*.log

          📈 Management Commands:
          - Status: /opt/enterprise-backup/scripts/backup-manager.sh --status
          - Health Check: /opt/enterprise-backup/scripts/backup-health-monitor.sh
          - Metrics: cat /opt/enterprise-backup/metrics/backup-*.json

          📋 Architecture:
          - Coordinator (backup-wyse): Pulls backups from coordinated hosts (Raspberry Pis)
          - Standalone Systems: Large machines handle their own backups independently

          🎉 Backup System Ready for Production!