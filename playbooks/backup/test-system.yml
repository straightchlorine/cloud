---
# Backup System - Comprehensive Testing
# Tests all components of the enterprise backup system

- name: Test Backup System
  hosts: backup-primary
  become: true
  gather_facts: true

  vars:
    backup_base_path: "/opt/enterprise-backup"
    backup_user: "backup"

  tasks:
    - name: Display enterprise backup system test start
      ansible.builtin.debug:
        msg: |
          🧪 Starting Backup System Test

          Testing Components:
          🏢 Coordinator Infrastructure
          🔗 SSH Connectivity
          📁 Repository Access
          🔄 Backup Operations
          📊 Monitoring Systems
          🔐 Security Configuration

    - name: Test coordinator infrastructure
      ansible.builtin.stat:
        path: "{{ item }}"
      register: infrastructure_test
      loop:
        - "{{ backup_base_path }}"
        - "{{ backup_base_path }}/scripts"
        - "{{ backup_base_path }}/logs"
        - "{{ backup_base_path }}/keys"
        - "{{ backup_base_path }}/metrics"

    - name: Verify infrastructure exists
      ansible.builtin.fail:
        msg: "Infrastructure component missing: {{ item.item }}"
      when: not item.stat.exists
      loop: "{{ infrastructure_test.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Test backup scripts syntax
      ansible.builtin.shell: |
        bash -n {{ backup_base_path }}/scripts/backup-{{ item.service_name }}.sh
      become_user: "{{ backup_user }}"
      register: script_syntax_test
      failed_when: script_syntax_test.rc != 0
      changed_when: false
      loop: "{{ backup_targets | default([]) }}"

    - name: Test restore scripts syntax
      ansible.builtin.shell: |
        bash -n {{ backup_base_path }}/scripts/enterprise-restore-{{ item.service_name }}.sh
      become_user: "{{ backup_user }}"
      register: restore_syntax_test
      failed_when: restore_syntax_test.rc != 0
      changed_when: false
      loop: "{{ backup_targets | default([]) }}"

    - name: Test SSH connectivity to targets
      ansible.builtin.shell: |
        ssh -i {{ backup_base_path }}/keys/{{ item.service_name }}-ssh-key \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            {{ item.ssh_user | default(backup_user) }}@{{ item.target_host }} \
            "echo 'Enterprise backup SSH test successful'"
      become_user: "{{ backup_user }}"
      register: ssh_connectivity_test
      failed_when: false
      changed_when: false
      loop: "{{ backup_targets | default([]) }}"

    - name: Test repository access
      ansible.builtin.shell: |
        export RESTIC_REPOSITORY="{{ item.restic_repository }}"
        export RESTIC_PASSWORD_FILE="{{ backup_base_path }}/keys/{{ item.service_name }}-password"
        export RESTIC_CACHE_DIR="{{ backup_base_path }}/cache/{{ item.service_name }}"
        restic snapshots --json | jq length 2>/dev/null || echo "0"
      become_user: "{{ backup_user }}"
      register: repository_test
      failed_when: false
      changed_when: false
      loop: "{{ backup_targets | default([]) }}"

    - name: Test systemd services status
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: systemd_test
      failed_when: systemd_test.status.LoadState == "not-found"
      loop:
        - backup-health-monitor.service
        - backup-metrics.service

    - name: Test monitoring scripts
      ansible.builtin.command: >
        {{ backup_base_path }}/scripts/backup-health-monitor.sh
      become_user: "{{ backup_user }}"
      register: monitoring_test
      failed_when: monitoring_test.rc != 0
      changed_when: false

    - name: Test backup dry run for first target
      ansible.builtin.shell: |
        # Override backup script to do dry run
        export DRY_RUN=true
        {{ backup_base_path }}/scripts/backup-{{ backup_targets[0].service_name }}.sh
      become_user: "{{ backup_user }}"
      register: backup_dry_run_test
      failed_when: false
      changed_when: false
      when: backup_targets | default([]) | length > 0

    - name: Generate enterprise backup test report
      ansible.builtin.template:
        src: test-report.md.j2
        dest: "/tmp/backup-test-report-{{ ansible_date_time.epoch }}.md"
        mode: '0644'
      vars:
        test_results:
          infrastructure: "{{ infrastructure_test.results }}"
          script_syntax: "{{ script_syntax_test.results | default([]) }}"
          restore_syntax: "{{ restore_syntax_test.results | default([]) }}"
          ssh_connectivity: "{{ ssh_connectivity_test.results | default([]) }}"
          repository_access: "{{ repository_test.results | default([]) }}"
          systemd_services: "{{ systemd_test.results | default([]) }}"
          monitoring: "{{ monitoring_test }}"
          backup_dry_run: "{{ backup_dry_run_test | default({}) }}"

    - name: Display comprehensive test results
      ansible.builtin.debug:
        msg: |
          ✅ Backup System Test Results

          🏗️ Infrastructure Components:
          {% for item in infrastructure_test.results %}
          - {{ item.item | basename }}: {{ '✅ OK' if item.stat.exists else '❌ MISSING' }}
          {% endfor %}

          🔧 Script Validation:
          {% for item in script_syntax_test.results | default([]) %}
          - Backup Script ({{ item.item.service_name }}): {{ '✅ OK' if item.rc == 0 else '❌ SYNTAX ERROR' }}
          {% endfor %}
          {% for item in restore_syntax_test.results | default([]) %}
          - Restore Script ({{ item.item.service_name }}): {{ '✅ OK' if item.rc == 0 else '❌ SYNTAX ERROR' }}
          {% endfor %}

          🔗 SSH Connectivity:
          {% for item in ssh_connectivity_test.results | default([]) %}
          - {{ item.item.service_name }}: {{ '✅ CONNECTED' if item.rc == 0 else '❌ FAILED' }}
          {% endfor %}

          📁 Repository Access:
          {% for item in repository_test.results | default([]) %}
          - {{ item.item.service_name }}: {{ '✅ ACCESSIBLE (' + item.stdout.strip() + ' snapshots)' if item.rc == 0 else '❌ INACCESSIBLE' }}
          {% endfor %}

          ⚙️ System Services:
          {% for item in systemd_test.results | default([]) %}
          - {{ item.item }}: {{ '✅ LOADED' if item.status.LoadState == 'loaded' else '❌ NOT FOUND' }}
          {% endfor %}

          📊 Monitoring System:
          - Health Monitor: {{ '✅ FUNCTIONAL' if monitoring_test.rc == 0 else '❌ FAILED' }}

          🧪 Backup Operations:
          {% if backup_dry_run_test.rc is defined %}
          - Dry Run Test: {{ '✅ PASSED' if backup_dry_run_test.rc == 0 else '⚠️ ISSUES DETECTED' }}
          {% else %}
          - Dry Run Test: ⚠️ SKIPPED (No targets configured)
          {% endif %}

          📋 Test Summary:
          {% set total_tests = (infrastructure_test.results | length) + (script_syntax_test.results | default([]) | length) + (ssh_connectivity_test.results | default([]) | length) + (repository_test.results | default([]) | length) + (systemd_test.results | default([]) | length) + 1 %}
          {% set passed_tests = (infrastructure_test.results | selectattr('stat.exists') | list | length) + (script_syntax_test.results | default([]) | selectattr('rc', 'equalto', 0) | list | length) + (ssh_connectivity_test.results | default([]) | selectattr('rc', 'equalto', 0) | list | length) + (repository_test.results | default([]) | selectattr('rc', 'equalto', 0) | list | length) + (systemd_test.results | default([]) | rejectattr('status.LoadState', 'equalto', 'not-found') | list | length) + (1 if monitoring_test.rc == 0 else 0) %}

          Total Tests: {{ total_tests }}
          Passed: {{ passed_tests }}
          Failed: {{ total_tests - passed_tests }}
          Success Rate: {{ ((passed_tests / total_tests) * 100) | round(1) }}%

          {% if (passed_tests / total_tests) >= 0.9 %}
          🎉 ENTERPRISE BACKUP SYSTEM: READY FOR PRODUCTION!
          {% elif (passed_tests / total_tests) >= 0.7 %}
          ⚠️ ENTERPRISE BACKUP SYSTEM: NEEDS ATTENTION
          {% else %}
          🚨 ENTERPRISE BACKUP SYSTEM: REQUIRES FIXES
          {% endif %}

          📄 Detailed Report: /tmp/backup-test-report-{{ ansible_date_time.epoch }}.md

  handlers:
    - name: enterprise backup test complete
      ansible.builtin.debug:
        msg: "🏆 Enterprise backup system test completed"