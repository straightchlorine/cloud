---
# Backup System - Coordinator Only Deployment
# Deploys only the backup coordinator (backup-wyse)

- name: Deploy Backup Coordinator
  hosts: backup_primary
  become: true
  gather_facts: true

  pre_tasks:
    - name: Debug vault variables
      debug:
        msg: |
          Vault variables check:
          - vault_backup_repository_base: {{ vault_backup_repository_base | default('UNDEFINED') }}
          - vault_restic_station_arch_password: {{ vault_restic_station_arch_password | default('UNDEFINED') }}
          - vault_domain_name: {{ vault_domain_name | default('UNDEFINED') }}
          - vault_letsencrypt_email: {{ vault_letsencrypt_email | default('UNDEFINED') }}

    - name: Force load backup_targets variable from hostvars
      set_fact:
        backup_targets: "{{ hostvars[inventory_hostname]['backup_targets'] }}"

    - name: Verify backup_targets was loaded
      debug:
        msg: "backup_targets loaded: {{ backup_targets is defined }} ({{ backup_targets | length }} items)"

    - name: Debug variable access in playbook context
      ansible.builtin.debug:
        msg: |
          🔍 Playbook Variable Debug:
          - backup_role: {{ backup_role | default('UNDEFINED') }}
          - backup_base_path: {{ backup_base_path | default('UNDEFINED') }}
          - backup_targets defined: {{ backup_targets is defined }}
          {% if backup_targets is defined %}
          - backup_targets count: {{ backup_targets | length }}
          {% endif %}
          - device_role: {{ device_role | default('UNDEFINED') }}
          - Working directory: {{ ansible_env.PWD | default('UNDEFINED') }}

    - name: Display coordinator deployment summary
      ansible.builtin.debug:
        msg: |
          [DEPLOY] Deploying Backup Coordinator

          Host: {{ inventory_hostname }}
          Targets: {{ backup_targets | length }} configured
          Base Path: {{ backup_base_path }}

          Target Services:
          {% for target in backup_targets %}
          - {{ target.service_name }}: {{ target.target_host }}
            Repository: {{ target.restic_repository }}
            Schedule: {{ target.backup_schedule }}
            Method: {{ target.backup_method }}
          {% endfor %}
      when: backup_targets is defined

  roles:
    - role: backup-system

  post_tasks:
    - name: Create coordinator verification script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Backup Coordinator Verification Script

          BACKUP_BASE="{{ backup_base_path }}"
          echo "🔍 Verifying Backup Coordinator..."

          # Check coordinator services
          echo "Checking coordinator services..."
          {% for target in backup_targets %}
          if systemctl is-enabled backup-{{ target.service_name }}.timer >/dev/null 2>&1; then
              echo "[OK] backup-{{ target.service_name }}.timer: Enabled"
          else
              echo "[FAIL] backup-{{ target.service_name }}.timer: Not enabled"
          fi
          {% endfor %}

          # Check SSH connectivity
          echo "Testing SSH connectivity..."
          {% for target in backup_targets %}
          if ssh -i "$BACKUP_BASE/.ssh/nodes/{{ target.service_name }}" -o ConnectTimeout=5 -o BatchMode=yes {{ target.ssh_user }}@{{ target.target_host }} "echo 'SSH OK'" >/dev/null 2>&1; then
              echo "[OK] {{ target.service_name }}: SSH connectivity OK"
          else
              echo "[FAIL] {{ target.service_name }}: SSH connectivity FAILED"
              echo "   Deploy key: ssh-copy-id -i $BACKUP_BASE/.ssh/nodes/{{ target.service_name }}.pub {{ target.ssh_user }}@{{ target.target_host }}"
          fi
          {% endfor %}

          # Check repositories
          echo "Checking repository access..."
          {% for target in backup_targets %}
          export RESTIC_REPOSITORY="{{ target.restic_repository }}"
          export RESTIC_PASSWORD_FILE="$BACKUP_BASE/keys/{{ target.service_name }}-password"
          if restic snapshots >/dev/null 2>&1; then
              echo "[OK] {{ target.service_name }}: Repository accessible"
          else
              echo "[WARN]  {{ target.service_name }}: Repository needs initialization"
          fi
          {% endfor %}

          echo ""
          echo "[TARGET] Quick Test Commands:"
          {% for target in backup_targets %}
          echo "{{ target.service_name }}: systemctl start backup-{{ target.service_name }}.service"
          {% endfor %}
        dest: "{{ backup_base_path }}/scripts/backup-verify-coordinator.sh"
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: '0755'

    - name: Display coordinator deployment completion
      ansible.builtin.debug:
        msg: |
          [OK] backup coordinator deployment complete

          [stats] coordinator configuration:
          - host: {{ inventory_hostname }}
          - base path: {{ backup_base_path }}
          - targets: {{ backup_targets | length }} services configured
          - monitoring: {{ backup_monitoring }}

          [TOOL] Deployed Services:
          {% for target in backup_targets %}
          - backup-{{ target.service_name }}.service
          - backup-{{ target.service_name }}.timer
          {% endfor %}
          - backup-health-monitor.service
          - backup-metrics.service

          📋 SSH Key Deployment Required:
          {% for target in backup_targets %}
          {{ target.service_name }}:
            ssh-copy-id -i {{ backup_base_path }}/.ssh/nodes/{{ target.service_name }}.pub {{ target.ssh_user }}@{{ target.target_host }}
          {% endfor %}

          [DEPLOY] Next Steps:
          1. Deploy SSH keys (see commands above)
          2. Verify setup: {{ backup_base_path }}/scripts/backup-verify-coordinator.sh
          3. Test operations: {{ backup_base_path }}/scripts/backup-manager.sh --status

          Coordinator ready for enterprise backup operations!