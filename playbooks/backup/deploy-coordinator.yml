---
# Backup System - Coordinator Only Deployment
# Deploys only the backup coordinator (backup-wyse)

- name: Deploy Backup Coordinator
  hosts: backup-primary
  become: true
  gather_facts: true

  # Configuration comes from host_vars - no hardcoded overrides

  pre_tasks:
    - name: Load host_vars manually for testing
      ansible.builtin.include_vars: "../../host_vars/backup-wyse.yml"
      ignore_errors: true
      register: manual_load_result

    - name: Display manual load result
      ansible.builtin.debug:
        msg: |
          Manual load result: {{ 'SUCCESS' if manual_load_result is succeeded else 'FAILED' }}
          {% if manual_load_result is failed %}
          Error: {{ manual_load_result.msg | default('Unknown error') }}
          {% endif %}

    - name: Display manually loaded variables (if successful)
      ansible.builtin.debug:
        msg: |
          After manual load:
          - backup_role: {{ backup_role | default('STILL UNDEFINED') }}
          - backup_targets defined: {{ backup_targets is defined }}
          {% if backup_targets is defined %}
          - backup_targets count: {{ backup_targets | length }}
          {% endif %}
      when: manual_load_result is succeeded

    - name: Test simple variable access
      ansible.builtin.debug:
        msg: |
          Direct inventory variables:
          - device_role: {{ device_role | default('UNDEFINED') }}
          - ansible_host: {{ ansible_host | default('UNDEFINED') }}
          - Current working directory: {{ ansible_env.PWD | default('UNDEFINED') }}

    - name: Display coordinator deployment summary
      ansible.builtin.debug:
        msg: |
          🚀 Deploying Backup Coordinator

          Host: {{ inventory_hostname }}
          Targets: {{ backup_targets | length }} configured
          Base Path: {{ backup_base_path }}

          Target Services:
          {% for target in backup_targets %}
          - {{ target.service_name }}: {{ target.target_host }}
            Repository: {{ target.restic_repository }}
            Schedule: {{ target.backup_schedule }}
            Method: {{ target.backup_method }}
          {% endfor %}
      when: backup_targets is defined

  tasks:
    - name: Deploy enterprise backup coordinator
      ansible.builtin.include_role:
        name: backup-system

  post_tasks:
    - name: Create coordinator verification script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Backup Coordinator Verification Script

          BACKUP_BASE="{{ backup_base_path }}"
          echo "🔍 Verifying Backup Coordinator..."

          # Check coordinator services
          echo "Checking coordinator services..."
          {% for target in backup_targets %}
          if systemctl is-enabled backup-{{ target.service_name }}.timer >/dev/null 2>&1; then
              echo "✅ backup-{{ target.service_name }}.timer: Enabled"
          else
              echo "❌ backup-{{ target.service_name }}.timer: Not enabled"
          fi
          {% endfor %}

          # Check SSH connectivity
          echo "Testing SSH connectivity..."
          {% for target in backup_targets %}
          if ssh -i "$BACKUP_BASE/keys/{{ target.service_name }}-ssh-key" -o ConnectTimeout=5 -o BatchMode=yes {{ target.ssh_user }}@{{ target.target_host }} "echo 'SSH OK'" >/dev/null 2>&1; then
              echo "✅ {{ target.service_name }}: SSH connectivity OK"
          else
              echo "❌ {{ target.service_name }}: SSH connectivity FAILED"
              echo "   Deploy key: ssh-copy-id -i $BACKUP_BASE/keys/{{ target.service_name }}-ssh-key.pub {{ target.ssh_user }}@{{ target.target_host }}"
          fi
          {% endfor %}

          # Check repositories
          echo "Checking repository access..."
          {% for target in backup_targets %}
          export RESTIC_REPOSITORY="{{ target.restic_repository }}"
          export RESTIC_PASSWORD_FILE="$BACKUP_BASE/keys/{{ target.service_name }}-password"
          if restic snapshots >/dev/null 2>&1; then
              echo "✅ {{ target.service_name }}: Repository accessible"
          else
              echo "⚠️  {{ target.service_name }}: Repository needs initialization"
          fi
          {% endfor %}

          echo ""
          echo "🎯 Quick Test Commands:"
          {% for target in backup_targets %}
          echo "{{ target.service_name }}: systemctl start backup-{{ target.service_name }}.service"
          {% endfor %}
        dest: "{{ backup_base_path }}/scripts/backup-verify-coordinator.sh"
        owner: "{{ backup_user }}"
        group: "{{ backup_group }}"
        mode: '0755'

    - name: Display coordinator deployment completion
      ansible.builtin.debug:
        msg: |
          ✅ Backup Coordinator Deployment Complete!

          📊 Coordinator Configuration:
          - Host: {{ inventory_hostname }}
          - Base Path: {{ backup_base_path }}
          - Targets: {{ backup_targets | length }} services configured
          - Network Optimization: {{ backup_network_optimization }}
          - Health Monitoring: {{ backup_monitoring }}

          🔧 Deployed Services:
          {% for target in backup_targets %}
          - backup-{{ target.service_name }}.service
          - backup-{{ target.service_name }}.timer
          {% endfor %}
          - backup-health-monitor.service
          - backup-metrics.service

          📋 SSH Key Deployment Required:
          {% for target in backup_targets %}
          {{ target.service_name }}:
            ssh-copy-id -i {{ backup_base_path }}/keys/{{ target.service_name }}-ssh-key.pub {{ target.ssh_user }}@{{ target.target_host }}
          {% endfor %}

          🚀 Next Steps:
          1. Deploy SSH keys (see commands above)
          2. Verify setup: {{ backup_base_path }}/scripts/backup-verify-coordinator.sh
          3. Test operations: {{ backup_base_path }}/scripts/backup-manager.sh --status

          Coordinator ready for enterprise backup operations!