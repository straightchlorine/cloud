---
# Tear down the honeybench campaign state: bench containers, their data, the worktrees and the dump.
# It keeps packages, Docker, the pinned tools and the checkout, because the checkout holds bench/results.
#   ansible-playbook -i inventory/production playbooks/honeybench-teardown.yml \
#     --limit honeybench -e honeybench_teardown_confirm=true
# The guard gates on the confirm flag honeybench_teardown_confirm and refuses hosts marked teardown_protected.
# It then sets teardown_confirmed, which every included teardown task file checks.
# This shape is shared by every teardown playbook, see dns-teardown.yml.
- name: Tear down the honeybench role for repeatable testing
  hosts: bench
  become: true
  gather_facts: true
  tasks:
    - name: Gate the teardown
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_guard
      vars:
        common_teardown_name: honeybench

    - name: Run the honeybench teardown
      ansible.builtin.include_role:
        name: honeybench
        tasks_from: teardown
      when: teardown_confirmed | default(false) | bool
