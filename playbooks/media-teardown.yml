---
- name: Tear down the media role for repeatable testing
  hosts: music
  become: true
  gather_facts: true
  tasks:
    - name: Gate the teardown
      ansible.builtin.include_role:
        name: common
        tasks_from: teardown_guard
      vars:
        common_teardown_name: media
    - name: Run media role teardown
      ansible.builtin.include_role:
        name: media
        tasks_from: teardown
      when: teardown_confirmed | default(false) | bool
