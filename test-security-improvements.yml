---
# Security Improvements Test Playbook
# Validates all implemented security enhancements

- name: Test Security Improvements in Backup System
  hosts: backup-primary
  become: true
  gather_facts: true

  vars:
    test_results: []
    backup_base_path: "/opt/enterprise-backup"
    backup_user: "backup"

  tasks:
    - name: Initialize test results
      ansible.builtin.set_fact:
        test_results: []

    - name: Test 1 - Verify SSH key deployment automation
      block:
        - name: Check SSH keys exist for all targets
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/keys/{{ item.service_name }}-ssh-key"
          loop: "{{ backup_targets }}"
          register: ssh_key_check

        - name: Verify SSH key permissions
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/keys/{{ item.service_name }}-ssh-key"
          loop: "{{ backup_targets }}"
          register: ssh_key_perms

        - name: Record SSH key test results
          ansible.builtin.set_fact:
            test_results: "{{ test_results + [{'test': 'SSH Key Deployment', 'status': 'PASS' if all_keys_exist else 'FAIL', 'details': 'All SSH keys present with correct permissions'}] }}"
          vars:
            all_keys_exist: "{{ ssh_key_check.results | selectattr('stat.exists') | list | length == backup_targets | length }}"

    - name: Test 2 - Verify encrypted password storage
      block:
        - name: Check vault password file exists
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/keys/.vault-password"
          register: vault_password_file

        - name: Check vault password file permissions
          ansible.builtin.fail:
            msg: "Vault password file has incorrect permissions"
          when: vault_password_file.stat.exists and vault_password_file.stat.mode != '0400'

        - name: Check encrypted password files exist
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/keys/{{ item.service_name }}-password.vault"
          loop: "{{ backup_targets }}"
          register: encrypted_passwords

        - name: Verify no plain text passwords in scripts
          ansible.builtin.shell: |
            grep -r "RESTIC_PASSWORD=" {{ backup_base_path }}/scripts/ || true
          register: password_in_scripts
          changed_when: false

        - name: Record password encryption test results
          ansible.builtin.set_fact:
            test_results: "{{ test_results + [{'test': 'Password Encryption', 'status': password_test_status, 'details': password_test_details}] }}"
          vars:
            vault_exists: "{{ vault_password_file.stat.exists }}"
            all_encrypted: "{{ encrypted_passwords.results | selectattr('stat.exists') | list | length == backup_targets | length }}"
            no_plain_passwords: "{{ 'RESTIC_PASSWORD=' not in password_in_scripts.stdout }}"
            password_test_status: "{{ 'PASS' if (vault_exists and all_encrypted and no_plain_passwords) else 'FAIL' }}"
            password_test_details: "Vault file: {{ vault_exists }}, Encrypted files: {{ all_encrypted }}, No plain text: {{ no_plain_passwords }}"

    - name: Test 3 - Verify backup integrity verification
      block:
        - name: Check backup scripts contain integrity verification
          ansible.builtin.shell: |
            grep -l "verify_backup_integrity" {{ backup_base_path }}/scripts/backup-*.sh | wc -l
          register: scripts_with_verification
          changed_when: false

        - name: Check for restic check commands
          ansible.builtin.shell: |
            grep -c "restic check" {{ backup_base_path }}/scripts/backup-*.sh || echo "0"
          register: restic_check_count
          changed_when: false

        - name: Record integrity verification test results
          ansible.builtin.set_fact:
            test_results: "{{ test_results + [{'test': 'Backup Integrity Verification', 'status': integrity_test_status, 'details': integrity_test_details}] }}"
          vars:
            verification_present: "{{ scripts_with_verification.stdout | int > 0 }}"
            restic_checks: "{{ restic_check_count.stdout | int > 0 }}"
            integrity_test_status: "{{ 'PASS' if (verification_present and restic_checks) else 'FAIL' }}"
            integrity_test_details: "Scripts with verification: {{ scripts_with_verification.stdout }}, Restic checks: {{ restic_check_count.stdout }}"

    - name: Test 4 - Verify monitoring and alerting
      block:
        - name: Check health monitor script exists
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/scripts/backup-health-monitor.sh"
          register: health_monitor

        - name: Check metrics collector script exists
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/scripts/backup-metrics.sh"
          register: metrics_collector

        - name: Check monitoring services are enabled
          ansible.builtin.shell: |
            systemctl is-enabled backup-health-monitor.timer backup-metrics.timer | grep -c enabled || echo "0"
          register: monitoring_services
          changed_when: false

        - name: Record monitoring test results
          ansible.builtin.set_fact:
            test_results: "{{ test_results + [{'test': 'Monitoring and Alerting', 'status': monitoring_test_status, 'details': monitoring_test_details}] }}"
          vars:
            health_exists: "{{ health_monitor.stat.exists }}"
            metrics_exists: "{{ metrics_collector.stat.exists }}"
            services_enabled: "{{ monitoring_services.stdout | int >= 2 }}"
            monitoring_test_status: "{{ 'PASS' if (health_exists and metrics_exists and services_enabled) else 'FAIL' }}"
            monitoring_test_details: "Health monitor: {{ health_exists }}, Metrics: {{ metrics_exists }}, Services: {{ monitoring_services.stdout }}/2"

    - name: Test 5 - Verify key rotation system
      block:
        - name: Check key rotation script exists
          ansible.builtin.stat:
            path: "{{ backup_base_path }}/scripts/backup-key-rotation.sh"
          register: key_rotation_script

        - name: Check key rotation service exists
          ansible.builtin.stat:
            path: "/etc/systemd/system/backup-key-rotation.service"
          register: key_rotation_service

        - name: Check key rotation timer is enabled
          ansible.builtin.shell: |
            systemctl is-enabled backup-key-rotation.timer | grep -c enabled || echo "0"
          register: rotation_timer
          changed_when: false

        - name: Test key age checking function
          ansible.builtin.shell: |
            source {{ backup_base_path }}/scripts/backup-key-rotation.sh
            echo "Key rotation script syntax OK"
          register: script_syntax
          changed_when: false
          failed_when: false

        - name: Record key rotation test results
          ansible.builtin.set_fact:
            test_results: "{{ test_results + [{'test': 'Key Rotation System', 'status': rotation_test_status, 'details': rotation_test_details}] }}"
          vars:
            script_exists: "{{ key_rotation_script.stat.exists }}"
            service_exists: "{{ key_rotation_service.stat.exists }}"
            timer_enabled: "{{ rotation_timer.stdout | int >= 1 }}"
            syntax_ok: "{{ script_syntax.rc == 0 }}"
            rotation_test_status: "{{ 'PASS' if (script_exists and service_exists and timer_enabled and syntax_ok) else 'FAIL' }}"
            rotation_test_details: "Script: {{ script_exists }}, Service: {{ service_exists }}, Timer: {{ timer_enabled }}, Syntax: {{ syntax_ok }}"

    - name: Test 6 - Security posture validation
      block:
        - name: Check file permissions in keys directory
          ansible.builtin.shell: |
            find {{ backup_base_path }}/keys -type f -exec stat -c "%n %a" {} \; | awk '
            /ssh-key$/ { if ($2 != "600") print "FAIL: " $1 " has permissions " $2 " (should be 600)" }
            /password$/ { if ($2 != "600") print "FAIL: " $1 " has permissions " $2 " (should be 600)" }
            /.vault-password$/ { if ($2 != "400") print "FAIL: " $1 " has permissions " $2 " (should be 400)" }
            ' || echo "All permissions OK"
          register: permission_check
          changed_when: false

        - name: Check for hardcoded secrets
          ansible.builtin.shell: |
            grep -r -i "password\|secret\|key" {{ backup_base_path }}/scripts/ | grep -v "PASSWORD_FILE\|vault\|ssh-key" | head -5 || echo "No hardcoded secrets found"
          register: secret_check
          changed_when: false

        - name: Check service security features
          ansible.builtin.shell: |
            grep -c "PrivateTmp\|ProtectSystem\|NoNewPrivileges" /etc/systemd/system/backup-*.service || echo "0"
          register: service_security
          changed_when: false

        - name: Record security posture test results
          ansible.builtin.set_fact:
            test_results: "{{ test_results + [{'test': 'Security Posture', 'status': security_test_status, 'details': security_test_details}] }}"
          vars:
            permissions_ok: "{{ 'FAIL' not in permission_check.stdout }}"
            no_secrets: "{{ 'password' not in secret_check.stdout.lower() and 'secret' not in secret_check.stdout.lower() }}"
            security_features: "{{ service_security.stdout | int >= 3 }}"
            security_test_status: "{{ 'PASS' if (permissions_ok and no_secrets and security_features) else 'FAIL' }}"
            security_test_details: "Permissions: {{ permissions_ok }}, No hardcoded secrets: {{ no_secrets }}, Security features: {{ service_security.stdout }}"

    - name: Generate comprehensive test report
      ansible.builtin.debug:
        msg: |

          ========================================
          BACKUP SYSTEM SECURITY TEST REPORT
          ========================================
          Test Date: {{ ansible_date_time.iso8601 }}
          Coordinator: {{ inventory_hostname }}

          TEST RESULTS:
          {% for result in test_results %}
          [{{ result.status }}] {{ result.test }}
            Details: {{ result.details }}
          {% endfor %}

          SUMMARY:
          Total Tests: {{ test_results | length }}
          Passed: {{ test_results | selectattr('status', 'equalto', 'PASS') | list | length }}
          Failed: {{ test_results | selectattr('status', 'equalto', 'FAIL') | list | length }}

          Overall Status: {{ 'SECURE' if (test_results | selectattr('status', 'equalto', 'FAIL') | list | length == 0) else 'NEEDS ATTENTION' }}
          ========================================

    - name: Save test report to file
      ansible.builtin.copy:
        content: |
          # Backup System Security Test Report

          **Test Date:** {{ ansible_date_time.iso8601 }}
          **Coordinator:** {{ inventory_hostname }}

          ## Test Results

          {% for result in test_results %}
          ### {{ result.status == 'PASS' and '✅' or '❌' }} {{ result.test }}
          {{ result.details }}

          {% endfor %}

          ## Summary
          - **Total Tests:** {{ test_results | length }}
          - **Passed:** {{ test_results | selectattr('status', 'equalto', 'PASS') | list | length }}
          - **Failed:** {{ test_results | selectattr('status', 'equalto', 'FAIL') | list | length }}
          - **Overall Status:** {{ 'SECURE' if (test_results | selectattr('status', 'equalto', 'FAIL') | list | length == 0) else 'NEEDS ATTENTION' }}

          {% if test_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 %}
          ## Failed Tests Require Immediate Attention
          {% for result in test_results %}
          {% if result.status == 'FAIL' %}
          - **{{ result.test }}:** {{ result.details }}
          {% endif %}
          {% endfor %}
          {% endif %}
        dest: "{{ backup_base_path }}/security-test-report-{{ ansible_date_time.epoch }}.md"
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: '0644'