[defaults]
inventory = inventory/production
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
deprecation_warnings = False
log_path = ./ansible.log
roles_path = roles
collections_paths = ./collections:/root/.ansible/collections:/usr/share/ansible/collections
gathering = smart
fact_caching = memory

[inventory]
enable_plugins = yaml, ini, auto

[ssh_connection]
# ServerAliveInterval/CountMax: a Wi-Fi-only host (the Zero 2 W) can drop an SSH
# session silently - without keepalives a dead connection wedges the run
# forever at whatever task was in flight, instead of failing it in ~1 minute.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
private_key_file = ~/.ssh/ansible_controller_key
