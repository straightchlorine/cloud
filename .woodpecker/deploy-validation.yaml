---
# Woodpecker CI pipeline - Deployment validation
# Comprehensive validation before production deployment
# Runs on tag creation and deployment events

when:
  event: [tag, deployment, manual]
  branch: [main, master, production]

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 0  # Full history for tags

  - name: install-collections
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - mkdir -p /root/.ansible/collections/ansible_collections
      - ansible-galaxy collection install -r requirements.yml -p /root/.ansible/collections || true

  - name: pre-deployment-validation
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - ansible-playbook validate-infrastructure.yml -e validation_type=pre_deployment --check --diff

  - name: vault-validation
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - ansible-playbook validate-infrastructure.yml -e validation_type=vault --check || true

  - name: backup-validation
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - ansible-playbook validate-infrastructure.yml -e validation_type=backup --check || true

  - name: molecule-comprehensive
    image: quay.io/podman/stable:latest
    pull: true
    commands:
      - dnf install -y python3 python3-pip git containers-common
      - mkdir -p /etc/containers
      - |
        cat > /etc/containers/storage.conf << 'CONF'
        [storage]
        driver = "vfs"
        CONF
      - pip install ansible-core>=2.15 molecule>=6.0 molecule-plugins[podman]
      - |
        for role in common backup-system firewall dns automation backup monitoring music-stack prometheus-exporters; do
          echo "========================================="
          echo "Testing role: $role"
          echo "========================================="
          cd roles/$role
          molecule test --all
          cd ../..
        done
