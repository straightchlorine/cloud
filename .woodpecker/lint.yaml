---
when:
  event: [push, pull_request]

# Unlabelled workflows go to the arm64 agent, whose pods never start.
labels:
  platform: linux/amd64

steps:
  # One install of requirements.txt for every Ansible check, the pins `just lint` uses.
  - name: ansible
    image: python:3.13-slim
    environment:
      # Relative: CI_WORKSPACE is empty at compile time, and Ansible ignores ansible.cfg in a world-writable dir.
      ANSIBLE_CONFIG: ./ansible.cfg
      PIP_ROOT_USER_ACTION: ignore
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    commands:
      - pip install -q -r requirements.txt
      # ansible.cfg lists ./collections first.
      - scripts/install-collections.sh -p ./collections --force
      # Offline: ansible-lint would fetch requirements.yml from Galaxy itself.
      - ansible-lint --offline roles/ playbooks/
      - yamllint -s -c .yamllint .
      - ANSIBLE_ROLES_PATH="$PWD/roles" ansible-playbook --syntax-check playbooks/*.yml playbooks/*/*.yml

  - name: markdownlint
    image: node:22-slim
    commands:
      - >-
        npx --yes markdownlint-cli@0.50.0 '**/*.md'
        --ignore .venv --ignore collections --ignore .ansible --ignore node_modules

  - name: shellcheck
    image: koalaman/shellcheck-alpine:v0.11.0
    commands:
      # xargs fails the step on any finding; find -exec \; would not.
      - >-
        find . -name "*.sh" -not -path "./.git/*" -not -path "./collections/*" -not -path "./.venv/*"
        -print0 | xargs -0 shellcheck
