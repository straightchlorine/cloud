---
# Woodpecker CI — Linting, syntax checks, and validation
# Runs once per push (no matrix), fast feedback

when:
  event: [push, pull_request]

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  - name: install-collections
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - mkdir -p /root/.ansible/collections/ansible_collections
      - >-
        ansible-galaxy collection install -r requirements.yml
        -p /root/.ansible/collections || true

  - name: ansible-lint
    image: cytopia/ansible-lint:latest
    commands:
      - ansible-lint roles/ playbooks/

  - name: yaml-lint
    image: cytopia/yamllint:latest
    commands:
      - yamllint -c .yamllint .

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - >-
        find . -name "*.sh" -not -path "./.git/*"
        -exec shellcheck {} \;

  - name: syntax-check
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
      ANSIBLE_ROLES_PATH: ${CI_WORKSPACE}/roles
    commands:
      - chmod 755 .
      - >-
        ansible-playbook --syntax-check
        playbooks/site.yml
        playbooks/music-stack.yml
        playbooks/automation-stack.yml
        playbooks/backup/deploy-full-system.yml
        playbooks/backup/deploy-coordinator.yml
        playbooks/backup/test-system.yml
        validate-infrastructure.yml
        prometheus-exporters.yml
        deploy-rclone-to-hosts.yml
        backup-coordinator.yml
        backup-deploy.yml

  - name: validate-infrastructure
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
      ANSIBLE_ROLES_PATH: ${CI_WORKSPACE}/roles
    commands:
      - chmod 755 .
      - >-
        ansible-playbook validate-infrastructure.yml
        -e validation_type=pre_deployment --check
