---
# Woodpecker CI pipeline - Fast linting and validation
# Runs on every push/PR to provide quick feedback

when:
  event: [push, pull_request]

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  - name: ansible-lint
    image: cytopia/ansible-lint:latest
    commands:
      - ansible-lint roles/ playbooks/

  - name: yaml-lint
    image: cytopia/yamllint:latest
    commands:
      - yamllint -c .yamllint .

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} \;

  - name: markdown-lint
    image: davidanson/markdownlint-cli2:latest
    commands:
      - markdownlint-cli2 "**/*.md" "#CHANGELOG.md" || true
