---
# Woodpecker CI — Linting, syntax checks, and validation
# Runs once per push (no matrix), fast feedback

when:
  event: [push, pull_request]

# Unlabelled workflows also go to the OCI arm64 agent, whose pods never start.
labels:
  platform: linux/amd64

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  # Woodpecker runs every step in its own container, so the only thing shared
  # between steps is the workspace. Collections therefore go into ./collections,
  # which ansible.cfg already lists first in collections_paths -- a
  # container-local path (e.g. /root/.ansible) would be gone before the
  # ansible-lint step starts.
  - name: install-collections
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
      # ansible.cfg uses the *ignored* `collections_paths` key (modern
      # ansible-core reads `collections_path`), so point ansible at the
      # workspace copies explicitly instead of relying on it.
      ANSIBLE_COLLECTIONS_PATH: ${CI_WORKSPACE}/collections
    commands:
      # galaxy.ansible.com answers slowly/intermittently; retry before giving up.
      - |
        for attempt in 1 2 3; do
          if ansible-galaxy collection install -r requirements.yml -p ./collections --force; then
            exit 0
          fi
          echo "> collection install attempt ${attempt}/3 failed; retrying in 15s"
          sleep 15
        done
        echo "> collection install failed after 3 attempts"
        exit 1

  # ansible-lint auto-installs requirements.yml from Galaxy unless told not to,
  # which is what used to time out here. The collections are already on disk
  # (previous step), so lint offline and reuse them.
  #
  # The cytopia/ansible-lint image is not used: it is a 2022 build shipping
  # ansible-lint 6.11.0 / ansible-core 2.14.2, whose rule set no longer matches
  # this project (it flags e.g. meta-no-info / no-relative-paths) and whose core
  # cannot support the pinned collections. Install the same ansible-lint as
  # requirements.txt instead, so CI agrees with local `just lint`.
  - name: ansible-lint
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: ${CI_WORKSPACE}/collections
    commands:
      - pip install --no-cache-dir -q 'ansible-lint>=26.8.0'
      - ansible-lint --offline roles/ playbooks/

  - name: yaml-lint
    image: cytopia/yamllint:latest
    commands:
      - yamllint -c .yamllint .

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - >-
        find . -name "*.sh" -not -path "./.git/*"
        -exec shellcheck {} \;

  - name: syntax-check
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: ${CI_WORKSPACE}/collections
    commands:
      - chmod 755 .
      # Globbed so renamed or new playbooks cannot drift out of the check.
      - >-
        ANSIBLE_ROLES_PATH="$(pwd)/roles" ansible-playbook --syntax-check
        playbooks/*.yml playbooks/backup/*.yml
        $(ls *.yml | grep -vx requirements.yml)
