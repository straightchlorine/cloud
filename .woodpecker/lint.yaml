---
# Woodpecker CI — Linting, syntax checks, and validation
# Runs once per push (no matrix), fast feedback

when:
  event: [push, pull_request]

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  - name: install-collections
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - mkdir -p /root/.ansible/collections/ansible_collections
      - >-
        ansible-galaxy collection install -r requirements.yml
        -p /root/.ansible/collections || true

  - name: ansible-lint
    image: cytopia/ansible-lint:latest
    commands:
      - ansible-lint roles/ playbooks/

  - name: yaml-lint
    image: cytopia/yamllint:latest
    commands:
      - yamllint -c .yamllint .

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - >-
        find . -name "*.sh" -not -path "./.git/*"
        -exec shellcheck {} \;

  - name: syntax-check
    image: cytopia/ansible:latest-tools
    commands:
      - chmod 755 .
      # Globbed so renamed or new playbooks cannot drift out of the check.
      - >-
        ANSIBLE_ROLES_PATH="$(pwd)/roles" ansible-playbook --syntax-check
        playbooks/*.yml playbooks/backup/*.yml
        $(ls *.yml | grep -vx requirements.yml)
