---
# Woodpecker CI pipeline - Comprehensive testing with Molecule
# Matrix testing across multiple OS versions
# Runs on push to branches and pull requests

when:
  event:
    - push
    - pull_request
    - manual
  branch:
    - main
    - master
    - develop
    - feature/*

# Matrix strategy for multi-OS testing across all roles
matrix:
  PLATFORM:
    - debian12
    - debian13
    - alpine
    - arch
    - gentoo
  ROLE:
    - common
    - backup-system
    - firewall
    - dns
    - automation
    - backup
    - monitoring
    - music-stack
    - prometheus-exporters

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  # Install Ansible collections - only run once
  - name: install-collections
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - mkdir -p /root/.ansible/collections/ansible_collections
      - ansible-galaxy collection install -r requirements.yml -p /root/.ansible/collections || true
    when:
      matrix:
        PLATFORM: debian12

  # Linting - only run once
  - name: lint
    image: cytopia/ansible-lint:latest
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - ansible-lint roles/ playbooks/
    when:
      matrix:
        PLATFORM: debian12

  # Syntax check - only run once
  - name: syntax-check
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - >-
        find . -name "*.yml"
        -not -path "./.git/*"
        -not -path "./inventory/*"
        | xargs -n1 ansible-playbook --syntax-check
    when:
      matrix:
        PLATFORM: debian12

  # Molecule tests with Podman - runs for each matrix platform and role
  - name: molecule-test
    image: quay.io/podman/stable:latest
    pull: true
    commands:
      - dnf install -y python3 python3-pip git containers-common
      - mkdir -p /etc/containers
      - |
        cat > /etc/containers/storage.conf << 'CONF'
        [storage]
        driver = "vfs"
        CONF
      - pip install ansible-core>=2.15 molecule>=6.0 molecule-plugins[podman]
      - |
        case "${PLATFORM}" in
          debian12) export MOLECULE_IMAGE="docker.io/geerlingguy/docker-debian12-ansible:latest" ;;
          debian13) export MOLECULE_IMAGE="docker.io/geerlingguy/docker-debian13-ansible:latest" ;;
          alpine)   export MOLECULE_IMAGE="docker.io/geerlingguy/docker-alpine3-ansible:latest" ;;
          arch)     export MOLECULE_IMAGE="docker.io/geerlingguy/docker-archlinux-ansible:latest" ;;
          gentoo)   export MOLECULE_IMAGE="docker.io/geerlingguy/docker-gentoo-ansible:latest" ;;
        esac
      - cd roles/${ROLE}
      - molecule test
    environment:
      MOLECULE_PLATFORM: ${PLATFORM}

  # Infrastructure validation dry-run - only run once
  - name: validate-infrastructure
    image: cytopia/ansible:latest-tools
    environment:
      ANSIBLE_CONFIG: ${CI_WORKSPACE}/ansible.cfg
    commands:
      - ansible-playbook validate-infrastructure.yml -e validation_type=pre_deployment --check
    when:
      matrix:
        PLATFORM: debian12
