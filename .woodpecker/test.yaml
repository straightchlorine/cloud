---
# Woodpecker CI — Molecule tests
# Depends on lint passing first — won't run if lint fails
# Tests on Debian 13 (trixie) — all roles use apt

depends_on:
  - lint

when:
  event:
    - push
    - pull_request
    - manual
  branch:
    - main
    - master
    - develop
    - feature/*

matrix:
  ROLE:
    - common
    - backup-system
    - firewall
    - dns
    - automation
    - backup
    - monitoring
    - music-stack
    - prometheus-exporters

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  - name: molecule-test
    image: quay.io/podman/stable:latest
    pull: true
    privileged: true
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m
    commands:
      - dnf install -y python3 python3-pip git containers-common
      - mkdir -p /etc/containers
      - |
        cat > /etc/containers/storage.conf << 'CONF'
        [storage]
        driver = "vfs"
        CONF
      - |
        cat > /etc/containers/containers.conf << 'CONF'
        [containers]
        utsns = "private"
        CONF
      - pip install 'ansible-core>=2.17,<2.22' 'molecule>=26.8.0' 'molecule-plugins[podman]>=26.7.15' 'netaddr>=1.3.0'
      - ansible-galaxy collection install -r requirements.yml
      - export MOLECULE_IMAGE="docker.io/geerlingguy/docker-debian13-ansible:latest"
      - cd roles/${ROLE}
      - molecule test
