---
# Woodpecker CI pipeline - Comprehensive testing with Molecule
# Matrix testing across multiple OS versions
# Runs on push to branches and pull requests

when:
  - event:
      - push
      - pull_request
      - manual
    branch:
      - main
      - master
      - develop
      - feature/*

# Matrix strategy for multi-OS testing across all roles
matrix:
  PLATFORM:
    - debian12
    - debian13
    - ubuntu2404
  ROLE:
    - common
    - backup-system
    - firewall
    - dns

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  # Linting - only run once
  - name: lint
    image: cytopia/ansible-lint:latest
    commands:
      - ansible-lint --version
      - ansible-lint roles/ playbooks/
      - echo "✓ Linting passed"
    when:
      - matrix:
          PLATFORM: debian12

  # Syntax check - only run once
  - name: syntax-check
    image: cytopia/ansible:latest-tools
    commands:
      - echo "Syntax checking all playbooks..."
      - >-
        find . -name "*.yml"
        -not -path "./.git/*"
        -not -path "./inventory/*"
        | xargs -n1 ansible-playbook --syntax-check
      - echo "✓ Syntax check passed"
    when:
      - matrix:
          PLATFORM: debian12

  # Molecule tests with Podman - runs for each matrix platform and role
  - name: molecule-test
    image: quay.io/podman/stable:latest
    privileged: true
    pull: always
    commands:
      # Install dependencies
      - dnf install -y python3 python3-pip git
      - pip install ansible-core>=2.15 molecule>=6.0 molecule-plugins[podman] containers-common

      # Verify installations
      - ansible --version
      - molecule --version
      - podman --version
      - echo ""
      - echo "Role: $ROLE"
      - echo "Platform: $PLATFORM"
      - echo ""

      # Run Molecule tests for the current role
      - cd roles/${ROLE}
      - echo "Testing role: ${ROLE}"
      - echo "Available scenarios:"
      - molecule list --format plain 2>/dev/null | grep "scenario" || echo "  (using default scenario)"
      - echo ""
      - molecule test
      - echo "✓ All scenarios passed for ${ROLE}"

    environment:
      MOLECULE_PLATFORM: ${PLATFORM}

  # Infrastructure validation dry-run - only run once
  - name: validate-infrastructure
    image: cytopia/ansible:latest-tools
    commands:
      - echo "Running infrastructure validation..."
      - ansible-playbook validate-infrastructure.yml -e validation_type=pre_deployment --check
      - echo "✓ Infrastructure validation passed"
    when:
      - matrix:
          PLATFORM: debian12

  # Test report
  - name: test-report
    image: alpine:latest
    commands:
      - echo ""
      - echo "======================================"
      - echo "Test Results Summary"
      - echo "======================================"
      - echo "Role: ${ROLE}"
      - echo "Platform: ${PLATFORM}"
      - echo "✓ Lint: PASSED (debian12 only)"
      - echo "✓ Syntax Check: PASSED (debian12 only)"
      - echo "✓ Molecule Tests: PASSED (${ROLE})"
      - echo ""
      - echo "Test completed for:"
      - echo "  Role: ${ROLE}"
      - echo "  Platform: ${PLATFORM}"
      - echo "  Status: SUCCESS"
      - echo ""
      - echo "Matrix: 4 roles × 3 platforms = 12 test jobs"
      - echo "Current: ${ROLE} on ${PLATFORM}"
    when:
      - status:
          - success
          - failure
