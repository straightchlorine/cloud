---
# Woodpecker CI — Molecule tests
# Depends on lint passing first — won't run if lint fails
# Per-role images: Debian 13 for the apt-based fleet roles, Rocky 9 for the
# dnf-based honeypot.

depends_on:
  - lint

when:
  event:
    - push
    - pull_request
    - manual
  branch:
    - main
    - master
    - develop
    - feature/*
    - refactor/*

# Unlabelled workflows also go to the OCI arm64 agent, whose pods never start.
labels:
  platform: linux/amd64

matrix:
  # Only roles whose molecule scenarios exercise the real task files run in CI:
  # fixture-based scenarios burn runner resources without catching regressions.
  # Add a role here once its scenarios follow docs/testing/molecule-standard.md.
  ROLE:
    - dns
    - automation
    - media
    - honeypot
    - gpu-qp

steps:
  - name: checkout
    image: woodpeckerci/plugin-git:2
    settings:
      depth: 1

  - name: molecule-test
    image: quay.io/podman/stable:latest
    pull: true
    privileged: true
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m
    commands:
      - dnf install -y python3 python3-pip git containers-common
      - mkdir -p /etc/containers
      # vfs copies every image layer in full (~6 GB for the Debian 13 image); two
      # such steps at once push the node into DiskPressure and get evicted
      # (exit 137). Native overlay cannot sit on the step's own overlay rootfs,
      # but the workspace volume under /woodpecker is a plain host directory.
      - |
        cat > /etc/containers/storage.conf << 'CONF'
        [storage]
        driver = "overlay"
        graphroot = "/woodpecker/containers-storage"
        CONF
      - |
        cat > /etc/containers/containers.conf << 'CONF'
        [containers]
        utsns = "private"
        CONF
      - pip install 'ansible-core>=2.17,<2.22' 'molecule>=26.8.0' 'molecule-plugins[podman]>=26.7.15' 'netaddr>=1.3.0'
      - ansible-galaxy collection install -r requirements.yml
      # honeypot is the RedHat-family exception (Rocky 9).
      - |
        if [ "${ROLE}" = "honeypot" ]; then
          export MOLECULE_IMAGE="docker.io/geerlingguy/docker-rockylinux9-ansible:latest"
        else
          export MOLECULE_IMAGE="docker.io/geerlingguy/docker-debian13-ansible:latest"
        fi
        cd roles/${ROLE}
        for dir in molecule/*/; do
          molecule test -s "$(basename "$dir")" || exit 1
        done
