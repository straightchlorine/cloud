---
depends_on:
  - lint

when:
  event: [push, pull_request, manual]

# Unlabelled workflows go to the arm64 agent, whose pods never start.
labels:
  platform: linux/amd64

matrix:
  # Roles whose scenarios follow docs/testing/molecule-standard.md; a ci-skip file marks a scenario a runner
  # cannot host. Images and privileges come from each role's .env.yml.
  ROLE:
    - common
    - os
    - hardware
    - firewall
    - prometheus-exporters
    - dns
    - automation
    - media
    - honeypot
    - honeybench
    - gpu-qp
    - restic
    - supervisor

steps:
  - name: molecule
    image: quay.io/podman/stable:v5.8.9
    pull: true
    privileged: true
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m
    environment:
      PIP_ROOT_USER_ACTION: ignore
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    commands:
      - dnf install -y -q --setopt=install_weak_deps=False python3-pip
      # vfs copies every layer (~6 GB for Debian 13); two steps at once hit DiskPressure and exit 137.
      # Native overlay needs a plain host dir: the step rootfs is overlay itself, /woodpecker is not.
      - |
        mkdir -p /etc/containers
        cat > /etc/containers/storage.conf << 'CONF'
        [storage]
        driver = "overlay"
        graphroot = "/woodpecker/containers-storage"
        CONF
        cat > /etc/containers/containers.conf << 'CONF'
        [containers]
        utsns = "private"
        CONF
      - pip install -q -r requirements-test.txt
      - scripts/install-collections.sh
      - scripts/molecule-test.sh "${ROLE}"
