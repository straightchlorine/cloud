# Vault variable validation playbook
# Validates all vault variables before deployment to prevent silent failures
# Usage: ansible-playbook -i inventory vault-validation.yml

- name: Vault variable validation for all services
  hosts: all
  gather_facts: yes
  become: no

  tasks:
    - name: Display vault validation start message
      ansible.builtin.debug:
        msg: |
          🔐 Starting vault variable validation for {{ inventory_hostname }}

          Validation scope:
          ✅ Core vault variables (domain, email)
          ✅ Service-specific secrets and credentials
          ✅ Variable format and strength validation
          ✅ Template rendering verification
          ✅ Placeholder detection and removal

          This prevents deployments with missing or invalid secrets!

    - name: Run DNS vault validation for Pi-hole hosts
      ansible.builtin.include_role:
        name: dns
        tasks_from: vault_validation
      when: "'dns' in group_names"
      tags: [dns_vault]

    - name: Run automation vault validation for automation hosts
      ansible.builtin.include_role:
        name: automation
        tasks_from: vault_validation
      when: "'automation' in group_names"
      tags: [automation_vault]

    - name: Run music vault validation for music hosts
      ansible.builtin.include_role:
        name: music-stack
        tasks_from: vault_validation
      when: "'music' in group_names"
      tags: [music_vault]

    - name: Run template rendering validation
      ansible.builtin.include_role:
        name: common
        tasks_from: template_validation
      tags: [template_validation]

    - name: Generate comprehensive vault validation summary
      ansible.builtin.debug:
        msg: |
          ✅ Vault Validation Summary for {{ inventory_hostname }}:

          Core Variables:
          Domain Name: {{ vault_domain_name }}
          Let's Encrypt Email: {{ vault_letsencrypt_email }}

          {% if 'dns' in group_names %}
          DNS Services:
          ✅ Pi-hole credentials validated
          ✅ Password strength verified
          {% endif %}

          {% if 'automation' in group_names %}
          Automation Stack:
          ✅ Traefik authentication configured
          ✅ Cloudflare API token validated
          ✅ Backup encryption password verified
          ✅ Service credentials configured
          {% endif %}

          {% if 'music' in group_names %}
          Music Stack:
          {% if youtube_sync_enabled | default(false) %}
          ✅ YouTube sync configuration validated
          {% else %}
          ℹ️  YouTube sync disabled - no additional validation needed
          {% endif %}
          {% endif %}

          Template Rendering:
          ✅ All templates render successfully with current vault variables
          ✅ No missing variable references
          ✅ Configuration files will be valid

          🔒 All vault variables validated successfully!
          Safe to proceed with deployment.

  handlers:
    - name: vault validation complete
      ansible.builtin.debug:
        msg: "🔐 All hosts passed vault variable validation"

# Quick vault check for monitoring/CI
- name: Quick vault variable check
  hosts: all
  gather_facts: no
  become: no
  tasks:
    - name: Quick core vault check
      ansible.builtin.fail:
        msg: "Core vault variable '{{ item }}' is missing or contains placeholder"
      when:
        - vars[item] is not defined or vars[item] == ""
        - '"your-" in (vars[item] | string) or "example" in (vars[item] | string) or "CHANGEME" in (vars[item] | string)'
      loop:
        - vault_domain_name
        - vault_letsencrypt_email

    - name: Display quick vault status
      ansible.builtin.debug:
        msg: |
          ⚡ Quick Vault Status for {{ inventory_hostname }}:
          Domain: {{ vault_domain_name }}
          Email: {{ vault_letsencrypt_email }}
          Status: ✅ Core variables configured

