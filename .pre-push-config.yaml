---
# pre-commit install --hook-type pre-push -c .pre-push-config.yaml
repos:
  - repo: local
    hooks:
      - id: lint
        name: ansible-lint and yamllint
        entry: just lint
        language: system
        pass_filenames: false
      # common is the smoke test: the other roles build on it.
      - id: molecule-common
        name: Molecule common default
        entry: scripts/molecule-test.sh common default
        language: system
        pass_filenames: false
        verbose: true
