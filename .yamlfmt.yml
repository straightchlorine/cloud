---
# yamlfmt re-serializes the whole document, so every option here is chosen to
# produce output that .yamllint accepts and Ansible reads identically.

formatter:
  type: basic
  indent: 2
  # indent_root_array stays off: it indents top-level task lists by 2, which
  # .yamllint rejects ("expected 0 but found 2").
  include_document_start: true
  retain_line_breaks_single: true
  # Without this, >- blocks are re-flowed; combined with max_line_length that
  # leaks yamlfmt's "#magic___^_^___line" placeholder into Jinja conditions.
  scan_folded_as_literal: true
  # max_line_length stays unset: re-wrapping Jinja expressions is unsafe, and
  # yamllint already enforces 120.
  trim_trailing_whitespace: true
  eof_newline: true

include:
  - "**/*.yml"
  - "**/*.yaml"

exclude:
  - ".git"
  - ".venv"
  - "venv"
  - "node_modules"
  - "collections"

# Files yamlfmt would change semantically or into yamllint errors are skipped:
# vault ciphertext, keep-chomping block scalars (|+ is rewritten to |, dropping
# trailing blank lines), and flow-mapping list items (re-emitted with a
# trailing comma, e.g. {port: 22,}).
regex_exclude:
  - '\$ANSIBLE_VAULT'
  - '\|\+'
  - '(?m)^\s*- \{'

gitignore_excludes: true
continue_on_error: false
